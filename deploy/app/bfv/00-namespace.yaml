apiVersion: v1
kind: Namespace
metadata:
  name: bfv
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: bfv-quota
  namespace: bfv
spec:
  hard:
    requests.cpu: "100m"
    requests.memory: 128Mi
    limits.cpu: "1"
    limits.memory: 256Mi
    requests.ephemeral-storage: 256Mi
    limits.ephemeral-storage: 1Gi
    pods: "6"
    persistentvolumeclaims: "1"
    requests.storage: 50Gi
    services.loadbalancers: "0"
    services.nodeports: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: bfv-defaults
  namespace: bfv
spec:
  limits:
    - type: Container
      default:
        cpu: 100m
        memory: 32Mi
        ephemeral-storage: 64Mi
      defaultRequest:
        cpu: 5m
        memory: 8Mi
        ephemeral-storage: 8Mi
      max:
        memory: 128Mi
        ephemeral-storage: 256Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: bfv
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: site-from-haproxy
  namespace: bfv
spec:
  podSelector:
    matchLabels:
      app: bfv-site
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: haproxy
      ports:
        - port: 80
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: site-to-master-server
  namespace: bfv
spec:
  podSelector:
    matchLabels:
      app: bfv-site
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 188.245.154.232/32
      ports:
        - port: 8080
          protocol: TCP

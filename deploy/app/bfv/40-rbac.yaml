apiVersion: v1
kind: ServiceAccount
metadata:
  name: bfv-deployer
  namespace: bfv
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: bfv-deployer-token
  namespace: bfv
  annotations:
    kubernetes.io/service-account.name: bfv-deployer
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bfv-deployer
  namespace: bfv
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["bfv-site"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["bfv-upload-code"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bfv-deployer
  namespace: bfv
subjects:
  - kind: ServiceAccount
    name: bfv-deployer
    namespace: bfv
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bfv-deployer
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bfv-owner
  namespace: bfv
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: bfv-owner-token
  namespace: bfv
  annotations:
    kubernetes.io/service-account.name: bfv-owner
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bfv-owner
  namespace: bfv
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "services", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    resourceNames: ["bfv-files-0"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bfv-owner
  namespace: bfv
subjects:
  - kind: ServiceAccount
    name: bfv-owner
    namespace: bfv
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bfv-owner

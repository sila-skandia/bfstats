apiVersion: v1
kind: Namespace
metadata:
  name: seq

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seq
  namespace: seq
spec:
  replicas: 1
  # Recreate, not RollingUpdate: the event store is a hostPath at /opt/seq with no
  # ReadWriteOnce lock to stop two pods mounting it at once. Under the default
  # RollingUpdate, maxSurge starts the replacement before the old pod terminates,
  # putting two Seq processes on one flare store — a corruption risk.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: seq
  template:
    metadata:
      labels:
        app: seq
    spec:
      containers:
        - name: seq
          image: datalust/seq:latest
          ports:
            - containerPort: 80
          env:
            - name: ACCEPT_EULA
              value: "Y"
            # Accept OTLP metric samples at /ingest/otlp/v1/metrics and store them
            # as wide events. Required for the CPU/memory dashboards.
            - name: SEQ_FEATURES_ENABLED
              value: "IngestOtlpMetrics"
          volumeMounts:
            - name: seq-data
              mountPath: /data
      volumes:
        - name: seq-data
          hostPath:
            path: /opt/seq
            type: DirectoryOrCreate

---
apiVersion: v1
kind: Service
metadata:
  name: seq-service
  namespace: seq
  labels:
    app: seq
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: seq-hetzner
spec:
  selector:
    app: seq
  type: ClusterIP
  ports:
    - port: 5341
      targetPort: 80
      name: web
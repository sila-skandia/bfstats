---
# play.bfstats.io - BF1942 in the browser.
#
# NOT APPLIED. Written by the stream that built the Instant Battle screen;
# see features/bf1942-in-the-browser/README.md, "Deployment", for the one
# thing to settle before `kubectl apply` is run: this node has no room for
# it as it stands.
#
# MEMORY BUDGET, measured against deploy/app/ on 2026-09-19:
#   sum of memory limits already declared   7296Mi
#   node                                    7741Mi
#   headroom                                 445Mi
# CLAUDE.md asks for ~1.5Gi of headroom for the OS, kubelet and k3s system
# pods. The node is about 1.06Gi past that *before* this file is counted;
# adding 64Mi takes the headroom to 381Mi. So this must not be applied until
# that is reclaimed. The cheapest reclaim is not to add a container at all:
# this image and the mesh image are the same nginx over the same two PVC
# subPaths, and one container can serve both hostnames (HAProxy already
# routes on Host). That option, and what it costs, is written up in the
# design doc. This manifest is the two-container shape, ready if the budget
# is found.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bfstats-play
  namespace: bf42-stats
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bfstats-play
  template:
    metadata:
      labels:
        app: bfstats-play
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      securityContext:
        fsGroup: 1000
      containers:
        - name: play
          image: anskia/bfstats-play:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          volumeMounts:
            # The same PVC and the same two subPaths the mesh site mounts,
            # read-only. No asset is copied and nothing here writes.
            - name: assets-data
              mountPath: /usr/share/nginx/html/models
              subPath: assets/mesh/models
              readOnly: true
            - name: assets-data
              mountPath: /usr/share/nginx/html/maps
              subPath: assets/mesh/maps
              readOnly: true
          # Sized from the mesh container, which is the same image serving
          # the same traffic: 19.6Mi steady and 23.2Mi peak on concurrent
          # 2.5MB .glb transfers. This site serves the same .glb traffic
          # (map.html is the same page) plus a 19-texture menu pack that is
          # under 400KB in total, so the same 16Mi/64Mi holds. Page cache
          # from the asset tree lands in the same cgroup but is reclaimable,
          # so it costs eviction rather than an OOM kill.
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "200m"
      volumes:
        - name: assets-data
          persistentVolumeClaim:
            claimName: bf42-stats-pvc-v2
---
apiVersion: v1
kind: Service
metadata:
  name: bfstats-play-service
  namespace: bf42-stats
spec:
  selector:
    app: bfstats-play
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: web

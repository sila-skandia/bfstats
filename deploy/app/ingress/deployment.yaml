
apiVersion: v1
kind: Namespace
metadata:
  name: haproxy
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: haproxy-config
  namespace: haproxy
data:
  haproxy.cfg: |
    global
      maxconn 256
      log stdout format raw local0 debug

    defaults
      mode http
      timeout connect 5000ms
      timeout client 50000ms
      timeout server 50000ms
      option forwardfor
      option http-server-close

    frontend http-in
      bind *:8080
      log global
      option httplog
      option dontlognull

      # ACL definitions
      acl host_staging_bfstats req.hdr(host) -i staging.bfstats.io
      acl host_mesh_bfstats req.hdr(host) -i mesh.bfstats.io
      acl host_play_bfstats req.hdr(host) -i play.bfstats.io
      acl host_replay_bfstats req.hdr(host) -i replay.bfstats.io
      acl is_play_root path -i /
      acl is_stats path_beg /stats
      acl is_hub path_beg /hub
      # Exactly /netcode (the WebSocket) and /netcode/... (the rooms list):
      # path_beg /netcode alone also takes the viewer's own /netcode.js and
      # /netcode-*.js modules on the play host, and a play page that cannot
      # load them never starts.
      acl is_netcode path /netcode
      acl is_netcode path_beg /netcode/
      # A recording's short link, /replay/<slug>. With the slash: the viewer's
      # own /replay.js and /replay-*.js modules, and /replays/, stay the mesh's.
      acl is_replay_link path_beg /replay/

      capture request header CF-Connecting-IP len 15
      log-format "%[capture.req.hdr(0)]\ %ci:%cp [%t] %ft %b/%s %Tq/%Tw/%Tc/%Tr/%Tt %ST %B %CC %CS %tsc %ac/%fc/%bc/%sc/%rc %sq/%bq %hr %hs %{+Q}r %sslv"

      # play.bfstats.io — the playable map page. The mesh nginx keeps its
      # catch-all server block, so no nginx change is needed: HAProxy routes
      # on Host and the mesh service already resolves. The root path is
      # rewritten to the map page (a set-path, not a redirect, so the browser
      # stays on /); every other path — /map.html, /vendor/, /models/, /maps/
      # — is served by the same block the mesh host uses. The /netcode route
      # below is path-based and rides this host too.
      http-request set-path /map.html if host_play_bfstats is_play_root

      # replay.bfstats.io/<slug>, a shared recording's short link: the path
      # becomes the API's /replay/<slug> (the play host's /replay/<slug>
      # below, its first form, which links already handed out still use).
      # The bare host goes to the feed.
      http-request redirect location https://play.bfstats.io/play/?tab=replay code 302 if host_replay_bfstats { path / }
      http-request set-path /replay%[path] if host_replay_bfstats

      # Dedicated mesh viewer host — before the shared /stats and default UI routes
      use_backend mesh_frontend if host_mesh_bfstats
      # play.bfstats.io/replay/<slug>, a shared recording's short link: the API
      # answers it with a page that goes on to the replay
      # (features/replay-feed, "Short links"). Before the play host's
      # catch-all below, which would send it to the mesh nginx.
      use_backend stats_api if host_play_bfstats is_replay_link
      use_backend stats_api if host_replay_bfstats
      # !is_netcode: use_backend is first-match-wins, and without it this
      # rule would swallow /netcode/* on the play host before the path-based
      # netcode route below is ever evaluated. !is_stats likewise: the play
      # host's /stats is the API's, so the REPLAY feed (features/replay-feed)
      # calls it on its own origin and bfstats.io's sign-in cookie
      # (Domain=bfstats.io, Path=/stats) comes with each call.
      use_backend mesh_frontend if host_play_bfstats !is_netcode !is_stats

      # Route /stats to stats API
      use_backend stats_api if is_stats
      use_backend stats_api if host_staging_bfstats is_stats

      # Route /hub to hub API
      use_backend hub_api if is_hub
      use_backend hub_api if host_staging_bfstats is_hub

      # Route staging.bfstats.io to staging frontend
      use_backend staging_frontend if host_staging_bfstats

      # Everything else to frontend

      # Netcode room server — path-based like /stats, host-agnostic: it
      # rides whatever host serves the play site. Matches both the
      # WebSocket upgrade (GET /netcode) and the rooms list (GET
      # /netcode/rooms). Before the default so /netcode never hits the UI.
      use_backend netcode if is_netcode

      default_backend frontend

    backend stats_api
      server stats bf42-stats-service.bf42-stats:8080

    backend hub_api
      server hub bf42-notifications-service.bf42-stats:8080

    backend mesh_frontend
      server mesh bfstats-mesh-service.bf42-stats:80

    backend netcode
      # The BF1942 room server. Idle WebSockets must survive: the defaults'
      # 50s timeout client/server would reap a socket between heartbeats, so
      # this backend sets `timeout tunnel 4h`, which replaces both after the
      # upgrade. The room server heartbeats at <= 30s, keeping a live
      # socket's idle gap far under the bound; a socket silent for 4h is
      # dead and should be reaped.
      timeout tunnel 4h
      # `init-addr last,libc,none`: the netcode Service may not exist when
      # this ConfigMap applies, and HAProxy 3.2 treats an unresolvable server
      # address as a FATAL startup error — applying it without this line
      # would take bfstats.io down with it. With it, HAProxy starts, this
      # server sits DOWN, and /netcode answers 503 until the Deployment
      # exists and haproxy is restarted (names resolve once at boot; a
      # server disabled at boot stays disabled).
      server netcode bfstats-netcode-service.bf42-stats:8080 init-addr last,libc,none

    backend staging_frontend
      server staging bfstats-ui-service.bfstats-ui:80

    backend frontend
      server frontend bfstats-ui-service.bfstats-ui:80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: haproxy
  namespace: haproxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: haproxy
  template:
    metadata:
      labels:
        app: haproxy
    spec:
      containers:
      - name: haproxy
        image: haproxy:3.2-alpine
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: config
          mountPath: /usr/local/etc/haproxy
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "300m"
      volumes:
      - name: config
        configMap:
          name: haproxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: haproxy-service
  namespace: haproxy
spec:
  type: ClusterIP
  selector:
    app: haproxy
  ports:
  - port: 80
    targetPort: 8080

---
# mesh.bfstats.io rides its own Cloudflare tunnel, separate from the one serving
# bfstats.io / staging / seq.
#
# One cloudflared process runs exactly one tunnel, and each hostname's DNS CNAME
# points at a specific tunnel ID. mesh.bfstats.io was routed to 787f3214…, so it
# needs its own cloudflared alongside the existing one — adding the hostname to
# the shared config would not help, because the shared process runs a363a103…
# and would never see mesh traffic.
#
# It still forwards to the same HAProxy, which routes on the Host header, so
# nothing in deploy/app/ingress/deployment.yaml changes.
#
# Needs its own credentials in the cluster before this will start:
#
#   cloudflared tunnel token --cred-file mesh-creds.json <tunnel-name>
#   kubectl --context hetzner -n cloudflared create secret generic \
#       tunnel-credentials-mesh --from-file=credentials.json=mesh-creds.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-mesh-config
  namespace: cloudflared
data:
  config.yaml: |
    tunnel: 787f3214-7ced-464e-9186-b3206a7faef4
    credentials-file: /etc/cloudflared/creds/credentials.json
    metrics: 0.0.0.0:2000
    no-autoupdate: true
    ingress:
      - hostname: mesh.bfstats.io
        service: http://haproxy-service.haproxy:80
      - service: http_status:404
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-mesh
  namespace: cloudflared
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared-mesh
  template:
    metadata:
      labels:
        app: cloudflared-mesh
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --config
            - /etc/cloudflared/config.yaml
            - run
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            failureThreshold: 1
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared
              readOnly: true
            - name: creds
              mountPath: /etc/cloudflared/creds
              readOnly: true
          # Half the shared tunnel's limit: that one fronts all of bfstats.io,
          # this one proxies a single static host. The node has under 1Gi of
          # headroom against the budget in CLAUDE.md, so a second cloudflared
          # gets sized for what it actually carries.
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"
      volumes:
        - name: creds
          secret:
            secretName: tunnel-credentials-mesh
        - name: config
          configMap:
            name: cloudflared-mesh-config

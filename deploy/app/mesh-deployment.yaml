---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bfstats-mesh
  namespace: bf42-stats
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bfstats-mesh
  template:
    metadata:
      labels:
        app: bfstats-mesh
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      securityContext:
        fsGroup: 1000
      containers:
        - name: mesh
          image: anskia/bfstats-mesh:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          volumeMounts:
            # Same PVC FileBrowser uses. subPath creates the dir if missing.
            - name: assets-data
              mountPath: /usr/share/nginx/html/models
              subPath: assets/mesh/models
              readOnly: true
            - name: assets-data
              mountPath: /usr/share/nginx/html/maps
              subPath: assets/mesh/maps
              readOnly: true
          # nginx handing out static files; the client does all the WebGL work.
          # Measured at 19.6Mi steady and 23.2Mi peak while serving concurrent
          # 2.5MB .glb transfers — and that was with 22 workers, where this node's
          # 4 cores (and the image's cgroup-quota worker tuning) give at most 4.
          # Page cache from the asset tree lands in the same cgroup but is
          # reclaimable, so it costs eviction rather than an OOM kill.
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "200m"
      volumes:
        - name: assets-data
          persistentVolumeClaim:
            claimName: bf42-stats-pvc-v2
---
apiVersion: v1
kind: Service
metadata:
  name: bfstats-mesh-service
  namespace: bf42-stats
spec:
  selector:
    app: bfstats-mesh
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: web

---
# bfstats-netcode: the BF1942 multiplayer room server (P2 of
# features/netcode-play-multiplayer/README.md).
#
# NOT APPLIED. Written for the owner to apply, in the repo's convention for
# a feature's first deployment files (the play site was held the same way):
# nothing here has touched a cluster. The owner's constraint decision in the
# feature README says this pod is NOT gated on the node budget (7296/7741 Mi
# today) — it is kept lean by construction, one Node process, no framework,
# level data without glb scenes, and profiled on the real node once it runs.
# It adds a hard ceiling of 832Mi to the budget sweep either way (sized
# below, 2026-11-13).
#
# Namespace bf42-stats and the overall shape mirror mesh-deployment.yaml:
# same PVC and the same two assets subPaths, read-only; the room server is
# the mesh site's sibling on the same volume.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bfstats-netcode
  namespace: bf42-stats
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bfstats-netcode
  template:
    metadata:
      labels:
        app: bfstats-netcode
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      securityContext:
        fsGroup: 1000
      containers:
        - name: netcode
          image: anskia/bfstats-netcode:latest
          imagePullPolicy: Always
          ports:
            # The node server listens on 8080, matching the API pods'
            # convention (mesh is 80 because nginx's default). Nothing here
            # is a root-owned socket; the port is internal anyway and the
            # Service maps it. The HAProxy backend targets this same 8080.
            - containerPort: 8080
          volumeMounts:
            # Same PVC and the same two subPaths the mesh pod mounts, read-
            # only: the server reads scene.json, the scene.glb JSON chunks,
            # the vehicle glbs and the damage tables from these trees and
            # writes nothing. The mounts overlay the image's /app/viewer/
            # tree at the same-relative paths the server resolves through
            # --viewer /app/viewer, so what runs on the node is exactly what
            # runs on the worktree. subPath creates the dir if missing.
            - name: assets-data
              mountPath: /app/viewer/maps
              subPath: assets/mesh/maps
              readOnly: true
            - name: assets-data
              mountPath: /app/viewer/models
              subPath: assets/mesh/models
              readOnly: true
            # The published tree keeps each glb once, by content, under
            # glbs/<sha>.glb and names it in models/models.json (mesh-asset-size
            # phase 5): there is no models/<Name>.glb on the volume. The room's
            # vehicle templates (level-load.mjs storedTemplatePath) and the
            # bots' weapon data (room-bots.mjs botDataFor) read through that
            # table, so the blobs are mounted too. Without this mount a room has
            # no vehicle template and its bots fire a stand-in weapon.
            - name: assets-data
              mountPath: /app/viewer/glbs
              subPath: assets/mesh/glbs
              readOnly: true
          # Requests 96Mi / 50m CPU, limits 832Mi / 1000m CPU. A small request and
          # a real limit, the owner's practice; limits may add up to more than
          # the node, and CPU is compressible (CLAUDE.md).
          #
          # MEMORY, measured 2026-11-13 on the server's own entry point (node
          # server/server.mjs, rooms joined over the socket, RSS from ps; M5
          # Max, node 22). The level table loads a level when a room first
          # plays it (level-table.mjs): the live vanilla tree holds 100 level
          # directories at about 28 MB each, which the old load-everything-at-
          # start could not have fitted in any limit.
          #
          #   boot, no room                               82 MB
          #   one room, no bots (Wake)                   237 MB
          #   two rooms on one level, no bots            264 MB
          #   one room, 15 bots on foot             234..270 MB
          #   two rooms, 30 bots on foot                 317 MB
          #   one room, 15 bots with hulls: Berlin 279, Wake 351
          #   two rooms, 30 bots with hulls (Berlin)     398 MB
          #
          # Bots take hulls by default since 2026-11-13 (room-guns), and a hull
          # room is the large one: the hulls' own navigation maps and drives.
          # The server's cap on live rooms (room-registry.mjs ROOM_MEMORY) adds
          # these up as RSS: 82 the process, 40 a room, 10 a room's bots, and
          # for each level some room plays, the level's own navigation maps at
          # 9 bytes a square-metre cell (shared by its rooms, at the richest bot
          # tier any of them runs) plus the build scratch of the largest. That
          # answers Stalingrad, Berlin and Wake from above and Midway to within
          # 5 MB. A CREATE that would take the sum past 748 MB is refused
          # (`server_full`; the lobby's CREATE GAME says SERVER FULL; joining a
          # room that exists is never refused), a room gets the richest bot
          # tier that fits (every hull, ships only, on foot, none), and a room
          # empty for a minute is dropped. 748 is 10 % under this limit of
          # 832Mi.
          #
          #   Midway, one room, bots in ships only   738 MB measured-model
          #   Wake, one room, bots in every hull     386 MB
          #   Berlin, one room, bots in every hull   314 MB (271 measured)
          #
          # 832Mi is the smallest limit at which Midway's bots crew their ships
          # (at 768Mi they were held on foot, and on Midway they swim). While
          # that room runs it fills the budget and the server takes no other
          # CREATE; rooms are few, and the alternative is swimming bots. Limits
          # in deploy/app/ then sum past the node's 7741Mi; that is the owner's
          # practice (small requests, real limits, limits may oversubscribe),
          # and this pod's request stays 96Mi.
          # `--room-memory-mb N` moves the cap with the limit; 0 is none. The
          # limit is also Node's heap back-pressure (one process, one cgroup):
          # with the heap held to 200 MB a no-bot room fell from 237 to 149 MB,
          # a hull room did not move (280), its weight being typed arrays.
          # requests/limits both present, as CLAUDE.md requires.
          #
          # CPU. A hull room of 15 bots costs 2.71 ms of CPU a 33.3 ms tick on
          # the M5 Max (p95 7.9, p99 13.3; on foot 0.80: wave2 room-guns). The
          # node-wide bot cap is two such rooms: 5.4 ms a tick, 16 % of an M5
          # core, an estimated 50..65 % of one of this node's cores at three to
          # four times slower. Under the old 400m that is throttled every
          # period (CFS gives 40 ms in each 100 ms), which a 30 Hz room shows
          # as lost ticks. The server is one JavaScript thread, so one core is
          # all it can use bar the collector's helpers: 1000m covers the mean
          # with a third to spare and lets a p99 tick (2 x 13.3 x 4 = 106 ms
          # worst case) run without a throttle on top. The request stays 50m.
          #
          # Intentionally NO priorityClassName: 1942-services is for the
          # always-on core services. A room server runs a 30 Hz tick where a
          # few milliseconds of scheduler delay is invisible, and a
          # top-priority container is the first to evict everything else on
          # this node — this pod must never carry that class.
          resources:
            requests:
              memory: "96Mi"
              cpu: "50m"
            limits:
              memory: "832Mi"
              cpu: "1000m"
      volumes:
        - name: assets-data
          persistentVolumeClaim:
            claimName: bf42-stats-pvc-v2
---
apiVersion: v1
kind: Service
metadata:
  name: bfstats-netcode-service
  namespace: bf42-stats
spec:
  selector:
    app: bfstats-netcode
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: netcode
# New PVC on the attached volume + a throwaway pod to trigger provisioning.
#
# The StorageClass is WaitForFirstConsumer, so the PVC alone creates nothing —
# the pod is what makes the provisioner create the directory. Once it exists,
# read the path off the PV, copy the database in, delete the pod, then point
# the API at this claim.
#
# The old bf42-stats-pvc is left completely untouched as the rollback.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bf42-stats-pvc-v2
  namespace: bf42-stats
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 30Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: pvc-primer
  namespace: bf42-stats
spec:
  restartPolicy: Never
  containers:
    - name: primer
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: bf42-stats-pvc-v2

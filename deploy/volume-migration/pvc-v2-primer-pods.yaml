# Throwaway pods whose only purpose is to satisfy WaitForFirstConsumer so the
# provisioner materialises the PVCs in pvc-v2.yaml.
#
# Safe to `kubectl delete -f` this file once the data is copied in — deleting a
# pod does not touch the PVC or PV.
apiVersion: v1
kind: Pod
metadata:
  name: pvc-primer-stats
  namespace: bf42-stats
spec:
  restartPolicy: Never
  containers:
    - name: primer
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: bf42-stats-pvc-v2
---

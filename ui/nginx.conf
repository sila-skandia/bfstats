server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # Vite emits content-hashed filenames under /assets (index-DY7jWOEO.js), so a
    # given URL's bytes never change. Without a Cache-Control header nginx sends
    # only ETag/Last-Modified, which left Cloudflare revalidating every asset
    # against the Finnish origin (cf-cache-status: REVALIDATED) and applying its
    # own 4h default browser TTL. From Australia that revalidation is ~320ms per
    # asset on the critical path. "immutable" stops the browser revalidating at
    # all; the long max-age lets the edge hold them.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Fonts are hashed the same way and are render-blocking-adjacent.
    location ~* \.(woff2?|ttf|eot)$ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Unhashed static files at the web root — revalidate, but cheaply.
    location ~* \.(ico|png|jpe?g|gif|webp|svg|webmanifest)$ {
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # index.html is the SPA entry point and is rewritten by every deploy, so the
    # browser must never hold a stale copy — but there is no reason each visitor
    # should pay a round trip to Finland for 2.5KB of static markup. Previously it
    # carried no Cache-Control at all, so Cloudflare classified it DYNAMIC and
    # never cached it. s-maxage lets the edge serve it while max-age=0 keeps the
    # browser honest; stale-while-revalidate means the refresh happens off the
    # critical path. Requires a Cloudflare Cache Rule for "/" and "/index.html"
    # with "Respect origin TTL" for the edge side to take effect.
    location = /index.html {
        add_header Cache-Control "public, max-age=0, s-maxage=300, stale-while-revalidate=86400" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

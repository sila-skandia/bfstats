//   dead  (join):   CLOSE   (left) cancels,      DONE   (right) commits
// SCORE BOARD has no board to show and stays a button in name only.
// Focus must not stay on any of them: Space is the jump the instant the
// screen closes, and a focused button turns it back into a click.
deploySuicideBtn.addEventListener('click', e => {
  e.stopPropagation();
  deploySuicideBtn.blur();
  if (deployRejoin) deploySpawn();
  else cancelDeploy();
});
deployResumeBtn.addEventListener('click', e => {
  e.stopPropagation();
  deployResumeBtn.blur();
  if (deployRejoin) cancelDeploy();
  else deploySpawn();
});
deployScoreBtn.addEventListener('click', e => {
  e.stopPropagation();
  deployScoreBtn.blur();
});

async function show(entry) {
  worldReady = false;
  syncDeployReady();
  const timing = warmups.timing = { showStart: performance.now() };
  let settleLevelWarmup;
  warmups.level = new Promise(resolve => { settleLevelWarmup = resolve; });
  const loading = entry.loading || {};
  const load = overlay.begin(entry.name, {
    title: loading.title,
    background: loading.background,
    music: loading.music,
    theme: loading.theme,
    assetBase: MAPS_BASE,
  });
  load.step('report', { label: 'level report', weight: 1 });
  // Weighted by what the bytes actually are: one ~70 MB scene against a couple
  // of MB of loose textures and a 2 KB report.
  load.step('scene', { label: 'scene geometry', weight: 88 });
  load.step('textures', { label: 'textures', weight: 11 });
  tex.baseTotal = tex.total;
  tex.baseLoaded = tex.loaded;
  tex.load = load;

  let report;
  let gltf;
  try {
    report = await fetch(`${MAPS_BASE}/${entry.report}${bust()}`).then(r => r.json());
    load.finish('report');
    gltf = await loader.loadAsync(
      `${MAPS_BASE}/${entry.glb}${bust()}`,
      e => load.bytes('scene', e.loaded, e.lengthComputable ? e.total : 0),
    );
    load.finish('scene');
  } catch (error) {
    if (tex.load === load) tex.load = null;
    load.fail(`could not load ${entry.name}: ${error.message}`);
    settleLevelWarmup(null);
    throw error;
  }
  // `?mode=` picks one of the level's gameplay layers; with no parameter this
  // resolves to the default layer, whose arrays are the top-level ones, so the
  // page is unchanged. A report from before `modes` existed passes straight
  // through. See `viewer/game-modes.js`.
  const wantedMode = params.get('mode');
  extras = selectGameMode(report, wantedMode);
  // A `?mode=` that did not land says so, and says it where a player can read
  // it: the dev panel is hidden for everyone but a developer, so the message
  // goes to the game's own console band as well (`logToConsole`, below, once
  // the level header has been written). Silence is the one wrong answer —
  // falling back to the default layer without a word is a page that looks
  // right and is showing something else.
  const modeIssue = modeProblem(report, wantedMode);
  modeNote = modeIssue
    ? (modeIssue === 'missing'
      ? `"${wantedMode}" is a game type ${report.level} offers but ships no `
        + `layer for; showing ${extras.gameplayMode}. `
        + `Has: ${modeNames(report).join(', ')}`
      : `no "${wantedMode}" layer on ${report.level}; `
        + `showing ${extras.gameplayMode}. Has: ${modeNames(report).join(', ')}`)
    : null;
  if (modeNote) console.warn(modeNote);
  // Before the old root is disposed: every gun is indexed off a node in it, and
  // the rounds in the air are clones of nodes it owns.
  releaseGuns();
  // `releaseGuns` is surgical now; a level switch is not, so the rounds in
  // the air go back to their pools here and every group goes with them.
  guns.clear();
  guns.groups.length = 0;
  vehicleGuns = [];
  dispose(currentRoot);
  disposeSky();
  disposeSounds();
  currentRoot = gltf.scene;
  // The glb holds every mode's vehicles and flags; drop the ones this mode
  // does not park. Before anything indexes the scene, so the vehicle list, the
  // occupancy roots and the cull set never see them.
  pruneToMode(currentRoot, extras.gameplayMode);
  // Baked fire-effect payloads (muzzle flashes, projectile bodies, trail
  // quads) ride every assembled vehicle; only the model viewer animates
  // them, so here they must stay hidden or they render parked on the guns.
  //
  // `extras.propellerBlur` (see `_propeller_blur` in assemble.py) keeps both
  // the blade mesh and the blurred disc as real siblings, because the one
  // aircraft that should ever show the disc is the flown one — `applyRig` in
  // flight.js toggles it from live throttle. Every parked spawner here has no
  // throttle at all, so it gets the engine-off state the comment above already
  // establishes: blades visible, disc hidden.
  //
  // The stamp spells the authored child name; the scene document renames
  // every second instance (`MustangPropellerBlurred_1`), and an exact compare
  // left a parked second aircraft drawing blade and disc stacked. Same bare
  // name law as `bareFireArmsName` below.
  currentRoot.traverse(obj => {
    if (obj.userData?.effect || obj.userData?.projectileMesh
        || obj.userData?.projectileTrail) obj.visible = false;
    const blur = obj.userData?.propellerBlur;
    if (blur) {
      const key = bareFireArmsName(blur.blurred);
      const blurred = obj.children.find(child => bareFireArmsName(child.name) === key);
      if (blurred) blurred.visible = false;
    }
  });
  scene.add(currentRoot);
  // The flags, and the level's always-on rotators — windmills, watermills,
  // radar dishes — which the extractor bakes as `ambient`/`ambient.N`.
  // `spin*` is deliberately NOT played: that is throttle-gated rotation, and
  // a parked aircraft's propeller is stationary in the game. The one aircraft
  // that should turn is the flown one, whose propeller `advancePropeller` in
  // flight.js already accumulates from its rate axes — playing the baked clip
  // here as well would drive it twice.
  flagMixer = null;
  const ambient = (gltf.animations || [])
    .filter(c => !/^spin(\.\d+)?$/.test(c.name))
    // The glb bakes a flag's cloth clip for every mode's pole, and
    // `pruneToMode` has just detached the ones this mode does not fly. A
    // track whose node has gone is a `THREE.PropertyBinding: No target node
    // found` warning per bone per frame's worth of setup — 88 of them on
    // Wake's Conquest layer alone — so the tracks are dropped here, the same
    // test three itself applies when it gives up on one.
    .map(clip => {
      const live = clip.tracks.filter(track => THREE.PropertyBinding.findNode(
        currentRoot, THREE.PropertyBinding.parseTrackName(track.name).nodeName));
      if (live.length === clip.tracks.length) return clip;
      if (!live.length) return null;
      const trimmed = clip.clone();
      trimmed.tracks = live;
      return trimmed;
    })
    .filter(Boolean);
  levelClips = ambient;
  if (ambient.length) {
    flagMixer = new THREE.AnimationMixer(currentRoot);
    for (const clip of ambient) {
      const action = flagMixer.clipAction(clip);
      // The engine gives each flag a random start phase so a row of them does
      // not beat in unison; `randomStartPitch` in `flag.ssc` does the same for
      // the sound. Without it five flags on one map flap as one object.
      action.time = Math.random() * clip.duration;
      action.play();
    }
  }
  const dir = entry.glb.replace(/\/[^/]+$/, '');
  currentDir = dir;
  bindLightmaps(currentRoot, dir);
  unlightTerrain(currentRoot);
  bindTerrainDetail(currentRoot, dir);
  setupSky(currentRoot, dir);
  // Before setupWater and bindDynamicShading: both read `levelEnvCube`.
  setupEnvCube(dir);
  setupLensFlare(dir);
  combatArea = null;
  combatFrame = null;
  // The world is the simulation core of frame() from here: built from the
  // level data in hand (the collider lands a few lines down via buildCollider,
  // the parked hulls via setupVehicleBodies), fed the local player's input
  // per frame, and stepped at the engine's fixed 30 Hz (world.js, the tick
  // law in its header). The page keeps the scene graph, the cameras, the HUD,
  // the audio, the deploy flow and the effects; the world owns nothing that
  // paints. `combatArea`, `bodyWorld`, `vehicleDamage` and `supplyField`
  // below stay page-side aliases of the world's instances, so every HUD feed,
  // console hook and debug readout that always reached them reaches them
  // still.
  world = new World({
    extras,
    guns,
    groundHeight,
    fireStates,
    onCrash: onCrashDamage,
    isWrecked: owner => {
      const visual = damageVisuals.get(owner);
      return !!(visual?.wrecked || visual?.removed);
    },
    // One snapshot per tick, which is what render interpolation needs and the
    // only hook the world owes the page (the render-interpolation block,
    // beside `footLookPending`).
    onTick: capturePresentationTick,
  });
  // A fresh level: none of the old one's nodes or poses survive it.
  rebuildVehicleInterp();
  combatArea = world.combatArea;
  vehicleDamage = world.vehicleDamage;
  setupWater(currentRoot, dir);
  setupSounds(extras, dir);
  loadMapArt(dir);
  // A map held open across a level switch would be showing the old level.
  toggleFullMap(false);
  fullmapName.textContent = extras.level || entry.name;
  const cps = (extras.controlPoints || []).length;
  fullmapMeta.textContent = cps
    ? `${cps} control point${cps === 1 ? '' : 's'} · ${(extras.soldierSpawns || []).length} spawns`
    : '';
  // After the baked paths and the sky/water shaders have claimed their
  // meshes, everything still on a lit glTF material is the engine's
  // fixed-function path: vehicles and non-lightmapped statics.
  bindDynamicShading(currentRoot);
  bindTextureFade(currentRoot);
  applyLighting();
  if (extras.sunDirection) {
    // The sun light points along -sunLightDirectionVec toward the origin.
    sun.position.set(
      extras.sunDirection[0] * -400,
      extras.sunDirection[1] * 400,
      extras.sunDirection[2] * -400,
    );
  }
  indexScene(currentRoot);
  collectTerrain(currentRoot);
  // Both tables are small (damage.json 154 KB shared across every level,
  // materials.png a couple of KB) and both are needed before the first shot,
  // not before the first frame.
  [terrainMaterials, damageTables] = await Promise.all([
    loadTerrainMaterials(dir), loadDamageTables(dir), loadCollisionMeshes(dir),
  ]);
  materialFrictionById = buildMaterialFrictionTable(damageTables);
  const collision = buildCollider(currentRoot);
  // After the collider: a body is keyed by the owner id the index handed out.
  setupVehicleBodies();
  // A new level means a new scene graph; the old aircraft's node is gone, and
  // the view rig holds a reference to it. So are every cached door.
  aircraft = null;
  car = null;
  view = null;
  soldier = null;
  // A new level starts the flag choice over; without this the rebuilt select
  // would keep the old map's index through `buildSpawnFlags`.
  spawnFlagSelect.selectedIndex = -1;
  entryPoints = null;
  nearEntry = null;
  if (optPilot.checked) setPilot(true);
  // Joining is the spawn screen, not an instant teleport — clear a leftover
  // on-foot tick from the previous level so openDeploy owns the join.
  if (optOnFoot.checked) {
    optOnFoot.checked = false;
    setOnFoot(false);
  }
  applyFar();
  if (!skyRoot) await loadSky(entry);
  applyFog();
  placeCamera();
  wireframe(optWire.checked);
  applyVisibility();
  // The fog is up, so the programs this links are the ones the frame wants.
  timing.warmStart = performance.now();
  Promise.resolve(loadEffectLibrary())
    .then(library => warmLevel(library))
    .then(() => {
      timing.warmCompiled = performance.now();
      return textureQueueDrained();
    })
    .finally(() => {
      timing.warmResolved = performance.now();
      settleLevelWarmup(timing);
    });
  const t = extras.terrain || {};
  const o = extras.objects || {};
  // `objects` counts what the glb holds, and the glb holds every mode's
  // vehicles; what is standing in this level is what survived `pruneToMode`.
  const vehiclesHere = spawnersRoot ? spawnersRoot.children.length
                                    : (o.spawners || 0);
  document.getElementById('stats').innerHTML =
    `<strong>${extras.level || entry.name}</strong><br>` +
    `world ${extras.worldSize || '?'} m<br>` +
    `terrain ${t.triangles || 0} tris / ${t.tiles || 0} tiles` +
    (t.defaultTiles ? ` + ${t.defaultTiles} default` : '') +
    (t.detail ? ' + detail' : '') + `<br>` +
    `objects ${o.placed || 0} placed` +
    (vehiclesHere ? ` / ${vehiclesHere} vehicles` : '') +
    (o.lightmaps ? ` / ${o.lightmaps} lightmaps` : '') +
    (o.skipped?.length ? ` / ${o.skipped.length} skipped` : '') + `<br>` +
    `sky ${extras.sky ? extras.sky.mesh + (extras.sky.clouds ? ' + clouds' : '') :
          (extras.skybox ? 'env cubemap' : 'fog colour')} / ` +
    `water ${extras.water ? 'shader' : 'flat'}<br>` +
    // A level exported before the collision flip has a heightfield and a sea
    // and no hulls; saying so beats a silent half-working collider.
    `collision ${collision.statics
      ? `${collision.statics.count} tris` : 'hulls not exported'}` +
    (collision.heightfield
      ? ` / heightfield ${collision.heightfield.dim}^2 @ ${collision.heightfield.spacing} m`
      : ' / no heightfield') +
    (t.materials ? ` / ${Object.keys(t.materials.labels || {}).length} surfaces` : '');

  // The same facts into the console, because that is what a console is for:
  // the retail client fills `io::mainConsole` while it loads, which is why
  // the band in the user's capture is full-height on a session that had only
  // executed two lines. `getLines(20)` returns what the scrollback has, so a
  // console nobody has written to opens as a thin strip — in the game and
  // here alike.
  logToConsole(`level ${extras.level || entry.name} (${activeMod.id || 'bf1942'})`);
  logToConsole(`world ${extras.worldSize || '?'} m, ` +
               `${t.triangles || 0} terrain tris over ${t.tiles || 0} tiles`);
  logToConsole(`${o.placed || 0} objects placed, ${vehiclesHere} vehicle spawners, ` +
               `${o.lightmaps || 0} object lightmaps`);
  // The one line a player who typed a `?mode=` needs and would otherwise only
  // find in a browser console they never open.
  if (modeNote) logToConsole(modeNote);
  if (o.skipped?.length) logToConsole(`${o.skipped.length} objects skipped`);
  logToConsole(collision.statics
    ? `collision ${collision.statics.count} tris` + (collision.heightfield
        ? `, heightfield ${collision.heightfield.dim}^2 @ ${collision.heightfield.spacing} m`
        : ', no heightfield')
    : 'collision hulls not exported');

  // Geometry, collider and bindings are all up; only loose textures may still
  // be streaming, and the game deploys over those too.
  worldReady = true;
  timing.worldReady = performance.now();
  syncDeployReady();
  // Direct-to-spawn: skip the briefing dialog and land on the deploy screen.
  // A level that declares no soldier spawn has no screen to open, and with
  // the "click to fly" plate gone there would be nothing to tell the player
  // the controls are live — so free roam starts armed instead.
  if (!optPilot.checked && !openDeploy()) capture();

  // Every texture this level needs has been queued by now, so a queue that is
  // already drained (or was never filled) means the load is done — texReport
  // alone would sit waiting for a callback that is not coming.
  if (tex.total - tex.baseTotal <= tex.loaded - tex.baseLoaded) {
    load.end();
    if (tex.load === load) tex.load = null;
  } else {
    texReport();
  }
}

optGameFog.addEventListener('change', applyFog);

// A round to play back over the level: `?replay=<recording.ndjson>`, with
// `&serverlog=<ev_*.xml>` to overlay the server's own event log, or a
// recording dropped onto the view. See replay.js.
const replayUrl = params.get('replay');
let replayController = null;
// --- the room (netcode-play-multiplayer P2) ----------------------------------
//
// `?room=<code>` joins the room server at the same origin (`/netcode` —
// HAProxy's path-beg ACL rides it through, WS and the JSON lobby both).
// netcode-client.js owns the wire (the engine's 104-bit input word, the 20 Hz
// snapshots, the seq law); netcode-render.js draws the server-confirmed
// remotes the way replay.js draws recordings; this page glues the two onto
// the local sim's seams and sends the engine's control-channel rows (seat
// enter/exit/switch, respawn) from the page's own mount/spawn code. Without
// `?room=` every binding below is a no-op — single-player is untouched.
const roomCode = params.get('room');
const roomName = params.get('name') || 'Player';
let roomClient = null;
let roomRenderer = null;
let roomJoined = false;
let roomPingTimer = null;
let roomTornDown = false;    // a deliberate teardown; not a join failure
// P3: the server's word beats the local sim only past these windows — a
// destroyed-Armor decree is a hard event (the page's own death loop latches
// the cam), but HP and position corrections wait for a real mismatch so the
// prediction stays the predictor (netcode.md §4).
const NET_HP_GRACE = 1.5;
const NET_POS_GRACE = 4.0;
const parkedHullCache = new Map();   // room vehicle id -> local scene node
// The room table id of the vehicle the local player is sitting in, cached on
// entry: `netVehicleIdFor` is a matrix read over the room table, and the
// seat-dot feed asks for it every frame while seated.
let netOccupiedVehicleId = null;
const netScratchV = new THREE.Vector3();

/** The room table id for a LOCAL vehicle node: template name (the scene
 *  node's `userData.control`), closest to the server pose among the same
 *  template's entries — the `spawnDelayForNode` matching law, over the wire
 *  table instead of the local scene. */
function netVehicleIdFor(node) {
  if (!roomJoined || !node) return null;
  const name = templateNameOf(node).toLowerCase();
  netScratchV.setFromMatrixPosition(node.matrixWorld);
  let best = null;
  let bestD = Infinity;
  for (const [id, v] of roomClient.vehicles) {
    if (v.template.toLowerCase() !== name) continue;
    const pose = roomClient.remoteVehicle(id);
    if (!pose) continue;
    const d = (netScratchV.x - pose.x) ** 2
      + (netScratchV.y - pose.y) ** 2 + (netScratchV.z - pose.z) ** 2;
    if (d < bestD) { bestD = d; best = id; }
  }
  return best;
}

/** The active seat's position in the occupancy's own survey order, the same
 *  index the server's seat rows and the snapshot records carry (root = 0). */
function netSeatIndex() {
  const occ = occupancy;
  if (!occ) return null;
  const i = occ.order.indexOf(occ.activeSeatId);
  return i >= 0 ? i : 0;
}

function netSeatRow(action) {
  const occ = occupancy;
  if (!occ?.root) return null;
  const id = netVehicleIdFor(occ.root);
  if (id == null) return null;
  return { type: 'seat', vehicle: id, seat: netSeatIndex() ?? 0, action };
}

function netSendAction(row) {
  if (roomJoined && roomClient) roomClient.action(row);
}

/** The local scene's parked hull for a room vehicle id: the level node whose
 *  template matches and whose position is closest to the server pose. The
 *  replica draws a remote driver's vehicle, so the parked hull under it must
 *  not double-draw (and it is asleep either way — `damageVisuals`' own node,
 *  the frozen spawn tree, not the body world). */
function parkedHullFor(vehicleId) {
  if (parkedHullCache.has(vehicleId)) return parkedHullCache.get(vehicleId);
  const v = roomClient?.vehicles.get(vehicleId);
  let found = null;
  if (v) {
    const want = v.template.toLowerCase();
    const pose = roomClient.remoteVehicle(vehicleId);
    let bestD = Infinity;
    for (const visual of damageVisuals.values()) {
      const node = visual?.node;
      if (!node || templateNameOf(node).toLowerCase() !== want) continue;
      const d = pose
        ? (node.position.x - pose.x) ** 2
          + (node.position.y - pose.y) ** 2 + (node.position.z - pose.z) ** 2
        : 0;
      if (d < bestD) { bestD = d; found = node; }
    }
  }
  parkedHullCache.set(vehicleId, found);
  return found;
}

function hideParkedHull(roomId, occupied) {
  const node = parkedHullFor(roomId);
  if (node) node.visible = !occupied;
}

function netTeardownRoom() {
  roomTornDown = true;
  if (!roomJoined && !roomClient) return;
  roomJoined = false;
  if (roomPingTimer !== null) { clearInterval(roomPingTimer); roomPingTimer = null; }
  roomRenderer?.reset();
  roomClient?.close();
  roomClient = null;
  parkedHullCache.clear();
}

// --- the room's trouble modal -------------------------------------------------
//
// A room that will not open must say so: the join fails with no feedback
// today, and a player staring at an empty map navigates away. The modal is
// the game's own panel (this page's tokens, the deploy family) with the
// reason, RETRY (one reload — the URL holds the room), and PLAY SOLO.
const ROOM_CLOSE_MESSAGES = {
  room_full: 'the room is full',
  bad_room: 'no room with that code',
  bad_name: 'that name is no good',
  no_peer: 'the server lost your connection',
  handler_error: 'the server had a problem',
  silent_timeout: 'the server dropped you (silence)',
};
const roomIssue = document.getElementById('roomIssue');
const roomIssueCode = document.getElementById('roomIssueCode');
const roomIssueMessage = document.getElementById('roomIssueMessage');

function roomIssueShow(code, message) {
  roomIssueCode.textContent = code ? `· ${code}` : '';
  roomIssueMessage.textContent = message;
  roomIssue.hidden = false;
  (document.getElementById('roomIssueRetry'))?.focus?.();
}

function roomIssueHide() { roomIssue.hidden = true; }

function roomPlaySolo() {
  roomIssue.hidden = true;
  netTeardownRoom();
  logToConsole('playing solo');
}
document.getElementById('roomIssueRetry').addEventListener('click',
  () => location.reload());
document.getElementById('roomIssueSolo').addEventListener('click', roomPlaySolo);

async function joinRoom() {
  if (!roomCode || roomClient) return;
  try {
    const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
    const ws = new WebSocket(`${proto}${location.host}/netcode`);
    // The server only ever sends binary frames; say so before the first one
    // lands (the hello follows the join immediately).
    ws.binaryType = 'arraybuffer';
    roomClient = createRoomClient({ ws, now: () => performance.now() });
    roomRenderer = createRemoteRenderer({
      scene, camera, loader, bust,
      modelsBase: MODELS_BASE,
      // The engine's vehicle lighting, as the level's own vehicles get it —
      // replicas are drawn the way replay.js draws recorded ones.
      shadeModel: root => bindDynamicShading(root),
      onOccupyChange: hideParkedHull,
    });
    roomClient.onevent = row => {
      if (row?.text) logToConsole(row.text);
      // P3: death by server decree. The page's own death loop
      // (`soldierDead` latch on a destroyed Armor) is the cam, the deploy
      // screen and the spectator work — the decree only has to make the
      // Armor agree with the server's. The suicide path's own precedent
      // (`soldierArmor.applyDamage(maxHitPoints)`).
      if (row.type === 'killed' && row.slot === roomClient.slot
          && soldierArmor && !soldierDead) {
        soldierArmor.applyDamage(soldierArmor.maxHitPoints);
      }
      // Flags move by decree too: the deploy screen's list and the map's
      // markers read `flags[]` live, so a team write is the whole repaint.
      if (row.type === 'captured' && Number.isInteger(row.flag)
          && flags[row.flag]) {
        flags[row.flag].team = row.team;
        if (typeof paintDeployChrome === 'function') paintDeployChrome();
      }
      // The tickets: the layout's own group reads `extras.tickets` — the
      // memoised painters re-run when the object CHANGES, so a fresh object
      // per row is the page's own prescribed live-update path (the comment
      // at `ticketFlagTexture`: "mutated the counts IN PLACE would have to
      // bump the key here too" — a replacement bumps it for us).
      if (row.type === 'ticket' && Number.isFinite(row.count) && extras) {
        const key = `team${row.team}`;
        if (extras.tickets?.[key] !== row.count) {
          extras.tickets = {
            ...extras.tickets,
            [key]: row.count,
          };
        }
      }
    };
    // P3: the snapshot is the server's word with a small grace window —
    // HP drops apply (never heals — the supply depots heal both sides, and
    // the server's own count absorbs the rest), and a position past the
    // grace snaps (a respawn, a stuck body; P4's smoothing owns the small
    // stuff). Only when the local player is alive and on foot.
    roomClient.onsnapshot = snap => {
      if (!soldier || soldierDead || !soldierArmor) return;
      if (optPilot.checked || !optOnFoot.checked) return;
      let self = null;
      for (const p of snap.players) {
        if (p.slot === roomClient.slot) { self = p; break; }
      }
      if (!self || !self.alive) return;
      if (self.hp != null && self.hp < soldierArmor.hitPoints - NET_HP_GRACE) {
        soldierArmor.applyDamage(soldierArmor.hitPoints - self.hp);
      }
      if (Number.isFinite(self.x) && Number.isFinite(self.z)) {
        const dx = self.x - soldier.x;
        const dz = self.z - soldier.z;
        if (dx * dx + dz * dz > NET_POS_GRACE * NET_POS_GRACE) {
          soldier.spawn(self.x, self.y, self.z);
        }
      }
    };
    roomClient.onclosed = code => {
      const wasIn = roomJoined;
      roomJoined = false;
      if (roomPingTimer !== null) { clearInterval(roomPingTimer); roomPingTimer = null; }
      roomRenderer?.reset();
      if (wasIn) logToConsole(`room closed (${code})`);
      // The reason, on the screen: a dropped round or a refused join both
      // end in this modal — the message names the failure and the two
      // ways back in.
      const message = ROOM_CLOSE_MESSAGES[code]
        ?? (typeof code === 'string' && code ? `the room closed: ${code}` : null);
      if (message) roomIssueShow(code, message.toUpperCase());
    };
    roomClient.onjoined = async () => {
      roomJoined = true;
      roomIssueHide();
      // (The heartbeat was already running — it starts at open, see above,
      // so the join's own silence during the page's load is covered.)
      // The room names the level it runs. When the URL already asked for
      // that level the page's own load covers it; when it asked for
      // another (or nothing), the ONE clean way to switch is a reload with
      // the room's level in the URL — `show()` is not safe to run twice,
      // and the manifest flow would be mid-flight in the same breath. The
      // reload re-joins the same room from the URL and loads once.
      const want = (roomClient.hello.level || '').toLowerCase();
      const asked = (params.get('map') || '').toLowerCase();
      if (want && asked !== want && manifest.some(e => e.name.toLowerCase() === want)) {
        const q = new URLSearchParams(location.search);
        q.set('map', want);
        location.replace(`${location.pathname}?${q}`);
        return;
      }
      logToConsole(`room ${roomClient.hello.room} · ${roomClient.hello.level} · slot ${roomClient.slot}`);
      logToConsole(`you are on team ${roomClient.hello.team === 1 ? 'AXIS' : 'ALLIED'}`);
      // The room names the team; the deploy screen rides it.
      setDeployTeam(roomClient.hello.team === 1 ? 1 : 2, false);
      if (!deployActive()) openDeploy();
    };
    ws.addEventListener('message', e => {
      // Binary frames only (see above); a string would be a server that is
      // not the room server, and is ignored rather than misparsed.
      if (typeof e.data === 'string') return;
      roomClient?.handleMessage(e.data);
    });
    ws.addEventListener('error', e => {
      console.warn('room socket error', e.message ?? e);
      // The close that follows the error is the one that speaks.
    });
    ws.addEventListener('close', e => {
      // The room server's own close codes ride the wire as MSG_CLOSED rows
      // (netcode.js); a bare transport close is the silent-timeout law or a
      // network drop, and the console should say which side ended it.
      console.log('room socket closed', e.code, e.reason);
      // A join that never happened must say so: a missing room server
      // otherwise leaves a silently empty map. A deliberate teardown never
      // reaches the modal (the guard below reads the teardown flag).
      const failed = roomCode && !roomJoined && !roomTornDown;
      netTeardownRoom();
      if (failed) {
        roomIssueShow(null,
          "CAN'T REACH THE ROOM SERVER\n"
          + 'Make sure it is running, then RETRY — or play solo.');
      }
    });
    window.__netDiag = () => ({
      readyState: ['CONNECTING', 'OPEN', 'CLOSING', 'CLOSED'][ws.readyState],
      clientState: roomClient?.state ?? null,
      hello: roomClient?.hello ?? null,
      captured,
      lockHeld,
      pointerLock: document.pointerLockElement === renderer.domElement,
    });
    // Send the join when the socket is open (or now, if it already is) —
    // `send` before the handshake throws, and a silent drop would just look
    // like a server that never answered.
    const sendJoin = () => roomClient?.join({
      room: roomCode,
      name: roomName,
      team: 0,
      // Create-on-join names the level the room was made on (rooms.mjs);
      // joining an existing room ignores it.
      level: params.get('map') || undefined,
    });
    // Heartbeat from the handshake on: the page's own level load starves
    // its main thread for seconds at a time (GLB parses), and the server's
    // silence window (rooms.mjs HEARTBEAT_TIMEOUT_MS) must not end a
    // connection whose join is still queued behind that burst.
    const startPing = () => {
      if (roomPingTimer !== null) clearInterval(roomPingTimer);
      roomPingTimer = setInterval(() => roomClient?.ping(), 4000);
    };
    if (ws.readyState === WebSocket.OPEN) {
      startPing();
      sendJoin();
    } else {
      ws.addEventListener('open', () => {
        startPing();
        sendJoin();
      });
    }
    window.addEventListener('beforeunload', netTeardownRoom);
    window.__net = () => ({
      connected: roomJoined,
      slot: roomClient?.slot ?? null,
      level: roomClient?.hello?.level ?? null,
      remoteSlots: roomJoined ? roomClient.remoteSlots() : [],
      remote: s => roomJoined ? roomClient.remotePlayer(s) : null,
      snapCount: roomJoined ? roomClient.snapCount() : 0,
      feed: roomJoined ? [...roomClient.feed] : [],
      sent: roomJoined ? [...roomClient.sentActions] : [],
      close: netTeardownRoom,
    });
    // The E-key seat toggle, exposed the way __deploy and __keys are: the
    // smoke drives this instead of a pointer-lock keypress.
    window.__seatToggle = () => {
      if (optPilot.checked && mannedActive()) exitManned();
      else if (optPilot.checked && (aircraft || car)) exitVehicle();
      else if (optOnFoot.checked && soldier && captured && nearEntry) enterVehicle(nearEntry);
    };
    window.__seat = () => ({
      pilot: optPilot.checked,
      onboard: !!occupancy,
      vehicle: occupancy?.root?.userData?.control ?? null,
      seat: occupancy ? occupancy.order.indexOf(occupancy.activeSeatId) : null,
    });
  } catch (err) {
    console.warn('room unavailable', err);
    logToConsole('multiplayer unavailable — playing solo');
    roomClient = null;
  }
}

if (roomCode) joinRoom();

const manifest = await fetch(`${MAPS_BASE}/maps.json${bust()}`)
  .then(r => r.ok ? r.json() : [])
  .catch(() => []);
const select = document.getElementById('maps');
if (!manifest.length) {
  select.hidden = true;
  document.getElementById('stats').textContent =
    'No maps yet. From tools/bf1942-models run: python3 extract_map.py Tobruk';
} else {
  for (const entry of manifest) {
    select.appendChild(new Option(entry.name, entry.name));
  }
  select.addEventListener('change', () => {
    // A room is pinned to the level its server created; switching maps
    // leaves it (P2 — the room's own lobby is the place to pick again).
    netTeardownRoom();
    const entry = manifest.find(e => e.name === select.value);
    if (entry) show(entry);
  });
  // A recording names the level it was made on; ?map= still wins.
  const replayLevel = replayUrl ? await recordingLevel(replayUrl).catch(() => '') : '';
  const wanted = (params.get('map') || replayLevel || '').toLowerCase();
  const first = manifest.find(e => e.name.toLowerCase() === wanted) || manifest[0];
  select.value = first.name;
  await show(first);
}

optSoundVol.addEventListener('input', () => {

optPilot.addEventListener('change', () => {

  }

spawnFlagSelect.addEventListener('change', () => {

  spawnAtFlag();

const clock = new THREE.Clock();
/** Scratch for the seated branch's world-position feed (world.js's
 *  `setPlayerPosition`, the combat-area test for a bare gun/seat root). */
const seatWorldPos = new THREE.Vector3();

function frame(dt) {
  updateMobileControls();
  // ---- the input stage (page) ----------------------------------------------
  // The keyboard and the mouse never leave this page. The look stage (the
  // mouse stage's per-frame pump, mouse-input.js) is pumped here once a frame
  // in exactly the two cases the old code pumped it — on foot
  // (`stepSoldierLook(pumpLook(ticks))`) and seated (`stepTurret`'s own pump) —
  // and never for the free camera. The world owns the tick from there: its
  // per-tick law consumes one buffered input per player per tick (world.js,
  // the tick law in its header), which is the engine's own
  // `InputManager::update` 0x0049cff7 boundary.
  const seated = optPilot.checked && occupancy;
  const onFoot = optOnFoot.checked && soldier;
  // The world's one clock answers this frame's tick count; the pump reads it
  // so the look stage and the sim can never drift apart (Fix 5). A frame
  // before any level has built the world owes no ticks.
  const lookTicks = world?.lookTicks(dt) ?? 0;
  let input = null;
  let look = null;
  if (seated) {
    // The pad's deflection must land in the device stage BEFORE the pump
    // turns the counts into an axis, or this frame's pad aim arrives a
    // frame late (the page's original feed-then-pump order).
    feedMobileTurretAim(dt);
    pumpLook(lookTicks);
    const held = captured ? keys : EMPTY_KEYS;
    // The engine's PlayerInput, named by action: the same keys, mouse
    // latches and mobile pad this page has always folded. `forwardKeys` and
    // `rudder` are the raw W/S and A/D pairs the aircraft's stick wants —
    // ground vehicles steer and throttle with the pad folded in
    // (`forward`/`strafe`), while the plane's roll and pitch arrive from the
    // pad separately.
    input = {
      forward: clampMobileInput(
        ((held.has('KeyW') ? 1 : 0) - (held.has('KeyS') ? 1 : 0))
        + mobilePadAxis('y')),
      forwardKeys: (held.has('KeyW') ? 1 : 0) - (held.has('KeyS') ? 1 : 0),
      strafe: clampMobileInput(
        ((held.has('KeyD') ? 1 : 0) - (held.has('KeyA') ? 1 : 0))
        + mobilePadAxis('x')),
      rudder: (held.has('KeyD') ? 1 : 0) - (held.has('KeyA') ? 1 : 0),
      fire: held.has('Space') || seatFire,
      altFire: seatAltFire,
      roll: mobilePadHeld ? mobilePadVector.x
        : (held.has('ArrowRight') ? 1 : 0) - (held.has('ArrowLeft') ? 1 : 0),
      pitch: mobilePadHeld ? mobilePadVector.y
        : (held.has('ArrowUp') ? 1 : 0) - (held.has('ArrowDown') ? 1 : 0),
      pad: mobilePadHeld,
    };
    look = { x: mouseInput.x, y: mouseInput.y };
    const pos = occupancy.root.getWorldPosition(seatWorldPos);
    world.setPlayerPosition(LOCAL_PLAYER, [pos.x, pos.y, pos.z]);
  } else if (onFoot) {
    pumpLook(lookTicks);
    const held = captured ? keys : EMPTY_KEYS;
    // Hoisted so footFire can hand the deviation model the same
    // c_PIThrottle / c_PIYaw values the body integrates — the engine's speed
    // gates read the *input*, not the achieved velocity.
    input = {
      forward: clampMobileInput(
        ((held.has('KeyW') || touchFlying ? 1 : 0) - (held.has('KeyS') ? 1 : 0))
        + mobilePadAxis('y')),
      strafe: clampMobileInput(
        ((held.has('KeyD') ? 1 : 0) - (held.has('KeyA') ? 1 : 0))
        + mobilePadAxis('x')),
      walk: held.has('ShiftLeft') || held.has('ShiftRight'),
      crouch: held.has('ControlLeft') || held.has('ControlRight'),
      prone,
      jump: held.has('Space') || mobileJumpHeld,
    };
    // A dead body holds still: when `soldierDead` latches (death cam active)
    // zero the steering/jump input so the corpse does not keep walking.
    if (soldierDead) {
      input.forward = input.strafe = 0;
      input.jump = false;
      input.crouch = input.prone = false;
    }
    look = footLookPair();
  }
  world?.setInput(LOCAL_PLAYER, input, look);
  frameInputLast = input;

  // ---- the sim core (world) -------------------------------------------------
  // The whole simulation core of the old frame() in one 30 Hz step: the
  // per-player soldiers and occupied drivetrains (the old onFoot +
  // pilot/drive/manned sim halves), guns.advance, the combat area per player,
  // the vehicle bodies and the damage pass — in the exact order, with
  // nothing presentational inside (world.js, the tick law in its header).
  // `step` is that tick's report; the presentation halves read it back.
  const step = world?.step(dt) ?? { ticks: 0, bodyTicks: 0, alpha: 0, players: {}, damage: [] };
  // The presentation instant this frame draws, and the drawn vehicle pose that
  // follows from it. Before every camera below, because all of them read it —
  // directly (the on-foot eye) or through the scene graph (every seat).
  presentAlpha = step.alpha;
  applyVehicleInterp(presentAlpha);

  // The room's wire, right on the sim core's edge: one input word per tick
  // the world consumed (the engine's one-buffered-input-per-tick law — the
  // same input this page just handed the local sim; an unticked frame sends
  // nothing). A frame longer than 33 ms ran several local ticks against this
  // word (world.js `#consume`), so it owes the server that many: one word a
  // frame would leave the authority's catch-up ticks on its zeroed idle word,
  // which is a held trigger released every frame below 30 fps. Then the
  // renderer draws the server-confirmed remotes after the local world's
  // readbacks.
  if (roomJoined && input) {
    for (let i = 0; i < step.ticks; i++) roomClient.sendInput(input, look);
  }
  if (roomJoined && roomRenderer) {
    roomRenderer.update(dt, roomClient, performance.now());
  }

  // The readbacks: the HP-15 gate answer the camera shells and the mobile UI
  // spend, the combat-area frame for the warning group and the `?data` hook,
  // and the on-foot look this tick actually applied, for the deviation
  // model's |MouseLookX/Y| drain (footFire reads the accumulated pair).
  const local = step.players[LOCAL_PLAYER] ?? null;
  vehicleInput.blocked = local?.gate.blocked ?? false;
  vehicleInput.rotationalScale = local?.gate.rotationalScale ?? 1;
  combatFrame = local?.combat ?? null;
  if (local?.look) {
    footLookX += Math.abs(local.look.yaw);
    footLookY += Math.abs(local.look.pitch);
  }

  // ---- the cameras and the rest of the presentation -------------------------
  if (seated) {
    // Round 3's first disclosed gap: the occupied vehicle's own drivetrain
    // physics steps every tick it exists, no matter which of its seats is
    // actually active — the world's occupied-vehicle step runs for the whole
    // time the player is mounted, so a nested seat (the Sherman's hull
    // gunner) leaves the hull coasting on its existing momentum rather than
    // freezing it. A bare gun/seat root has no drivetrain either way —
    // `aircraft`/`car` both stay null for one — so neither camera call does
    // anything for it.
    if (aircraft) pilot(dt);
    else if (car) drive(dt);
    if (mannedActive()) {
      // A bare gun/seat root, or a nested seat of a vehicle whose own root
      // `pilot`/`drive` just took its physics step above — the camera and
      // the trigger are `manned()`'s alone from here, checked after so the
      // two paths never both claim the camera the same frame.
      //
      // FOV correction lives here, not a one-time set on entry: switching seats
      // moves between a manned gun and a drivetrain root without ever calling
      // `enterVehicle` again, and neither `pilot()`/`drive()` nor `VehicleCamera`
      // (outside this track) touch `camera.fov` at all, so whichever mode ran
      // last otherwise leaves its FOV behind for the next one. Guarded on an
      // actual change so a held seat costs one float compare, not an
      // `updateProjectionMatrix()`, every frame.
      if (camera.fov !== MANNED_GUN_FOV) {
        camera.fov = MANNED_GUN_FOV;
        camera.updateProjectionMatrix();
      }
      manned(dt);
    } else if (camera.fov !== FLY_FOV) {
      camera.fov = FLY_FOV;
      camera.updateProjectionMatrix();
    }
  } else if (onFoot) {
    onFootCamera(dt);
  } else {
    fly(dt);
    applyLook();
  }
  // Unconditional: rounds already in the air have to finish their flight even
  // if the trigger, the pilot mode or the whole aircraft has gone away — the
  // world's tick runs `guns.advance` after the players and before the bodies,
  // exactly where frame() used to.
  // Sync the seated soldier to its seat node's world pose — the glb is parented
  // to `scene` (not the vehicle tree) so it can't disturb VehicleCamera's node
  // traversal, so it must chase the seat's matrices here instead.
  if (seatSoldier && seatPoseTarget && optPilot.checked) {
    seatPoseTarget.getWorldPosition(seatSoldier.position);
    seatPoseTarget.getWorldQuaternion(seatSoldier.quaternion);
  }
  if (seatPoseMixer && optPilot.checked) seatPoseMixer.update(dt);
  // After the mixer, which has just re-posed the arms from the sit clip, and
  // after the drivetrain's `applyRig`/`applyTurrets` above, which is where the
  // steering wheel got this frame's angle. Both orders matter: run it before
  // the mixer and the clip overwrites the hands, run it before the rig and the
  // hands chase last frame's wheel.
  if (optPilot.checked) stepSeatIk();
  // After the drive model has moved the player's vehicle and before the damage
  // pass, so a ram's hit points and its smoke tier land on the same frame.
  // The world's tick ran the bodies immediately before its own damage pass,
  // in the same frame as the old code; this half only draws the results.
  stepVehicleBodies(step);
  // After `advance`, so a round that landed this frame is already accounted for
  // when the tier is picked. Unconditional for the same reason `advance` is: a
  // tank set alight before the player climbed out keeps burning down to nothing
  // whatever the camera is doing.
  stepVehicleDamage(step, dt);
  // After `advance`, not before: a manned gun's `Ammo/PrimaryAmmo` etc. must
  // reflect whatever `advance` just fired this frame, the same way the
  // on-foot `updateSoldierHud()` below already does for `hw.rounds`. `manned()`
  // itself no longer calls this (see its own comment) — every occupied seat,
  // driven or manned, gets one authoritative feed here regardless of which
  // branch above ran this frame.
  //
  // Cost (rule 5, features/mesh-viewer-performance/README.md): this also now
  // runs every frame while piloting/driving, where before only a seat switch
  // or entry fed the vehicle group at all. `feedVehicleHud()` is a fixed
  // handful of property reads and `hud.vars` writes -- no scene traversal,
  // and no allocation beyond one throwaway `[]` on the non-manned branch --
  // so the added calls just rewrite the same `Vehicle/*` values every tick
  // until a future track wires live vehicle damage; the painter's own rule 7
  // still gates the actual repaint on whether any of it changed.
  if (occupancy) feedVehicleHud();
  effects.firstPerson = guns.firstPerson;
  effects.advance(dt);
  // The ear is the camera's, the same listener every other voice on the page
  // hangs off, so an impact is placed against the head the player is looking
  // out of in every camera mode.
  if (effectAudio.listener) {
    effectAudio.setMaster(masterVolume());
    effectAudio.update(dt, camera.getWorldPosition(_effectEar));
  }
  applyVisibility();
  updateTextureFade();
  advanceSim(dt);
  updateAudio(dt);
  updateSky();
  // After the camera controls: a followed replay places the camera last.
  replayController?.update(dt);
  renderer.render(scene, camera);
  // The near pass: everything in vmScene — the arms rig and the muzzle
  // emitters inside it, all on VIEWMODEL_LAYER — drawn over a cleared depth buffer, so
  // the world can occlude none of it (§11 step 6). Retail does exactly this:
  // `Renderer_drawView` (0x004662c0) draws the world, clears depth to 1.0,
  // forces the finest mip and calls `StandardMeshRenderer::drawFov`
  // (0x0062cb00), where each first-person part is drawn with a projection
  // baked when its field of view was set (`BStandardMesh::setFieldOfView`
  // 0x005ad160): the render view's own perspective for `set1pFov` × the
  // eased `SoldierZoomFov` factor as a whole vertical angle, the window's
  // aspect, and the world's near plane — 0.1 m, nothing moves it. That is
  // the code (corpus doc §3, "The drawFov pass"), and retail has now been
  // caught drawing it: an Engineer's Garand and Type 5, screenshotted at
  // 2560x1440, reproduce the 0.47 rad framing (forearm only, hand off the
  // corner) at 1.7-2.1x this rig's old 57.3 degree size. Retail also has a
  // *smaller* first-person state — Thompson-at-the-hip OBS clips that
  // measure at the world's 57.3 degrees instead — with the trigger between
  // the two still open (corpus doc §7). So this pass now defaults to
  // `set1pFov`, the value the code actually bakes, and keeps the world's
  // FOV only for `?fov1p=world` and the bare 3P fallback, whose
  // VIEWMODEL_BASE was eyeballed under it. See first-person-soldier.md's
  // 2026-09-16 note and handweapon-view-and-deviation.md §3/§7.
  if (handWeapon?.rig.visible) {
    renderer.autoClear = false;
    renderer.clearDepth();
    // Two traps in an overlay pass, both learned the hard way. Three draws
    // `scene.background` in EVERY render call, autoClear or not — rendered
    // over the world scene, this pass painted the fog-coloured backdrop over
    // the entire frame, and every on-foot map read as one wall of colour.
    // `vmScene` has no background to paint (and nothing to walk but the rig:
    // the reason it exists, see its declaration). And the pass gets its own
    // camera rather than flipping the main camera's layer mask, so nothing
    // the pass does can leak into the world render's view of that camera.
    // The fog is the world's own object, shared, so the rig's materials
    // compile and shade against exactly the fog they always did.
    vmScene.fog = scene.fog;
    vmHemi.color.copy(hemi.color);
    vmHemi.groundColor.copy(hemi.groundColor);
    vmHemi.intensity = hemi.intensity;
    vmHemi.position.copy(hemi.position);
    vmSun.color.copy(sun.color);
    vmSun.intensity = sun.intensity;
    vmSun.position.copy(sun.position);
    vmCamera.matrixWorld.copy(camera.matrixWorld);
    vmCamera.matrixWorldInverse.copy(camera.matrixWorld).invert();
    // `set1pFov` (handWeapon.fov1p) by default now that retail is confirmed
    // to draw it; `?fov1p=world` forces the old world-FOV reading (`fov1p=
    // engine` still works — it is no longer a distinct branch, just not
    // `world`). A bare 3P fallback (no fov1p) keeps FOOT_FOV unconditionally,
    // because its VIEWMODEL_BASE was eyeballed under that projection, not
    // set1pFov.
    const baseFov = handWeapon.fov1p && params.get('fov1p') !== 'world'
      ? handWeapon.fov1p / DEG_TO_RAD : FOOT_FOV;
    vmCamera.fov = baseFov * handWeapon.fovCur;
    vmCamera.aspect = camera.aspect;
    vmCamera.near = 0.1;   // the engine's render-view near, baked unchanged
    vmCamera.far = camera.far;
    vmCamera.updateProjectionMatrix();
    renderer.render(vmScene, vmCamera);
    renderer.autoClear = true;
  }
  deployAnimate(dt);
  drawMinimap();
  drawFullMap();
  // Last, over everything: feed this frame's soldier-side variables, then
  // repaint only if paint() finds one of them (or the stage size) actually
  // changed since the call before (features/mesh-viewer-performance, rule 7).
  // FIXED (round-3 HUD-parity audit): this used to read `stageWidth ||
  // renderer.domElement...`, on the theory that `stageWidth`/`stageHeight`
  // are 0 under `__renderOnce`. Measured live under a real `?shots` Playwright
  // page (`viewport 1280x800`) and they are NOT 0 — `resize()` runs once,
  // synchronously, at load (`resize();` right after `addEventListener` wires
  // it up, `map.html` ~1689), before any frame ever ticks, and stamps
  // `stageWidth`/`stageHeight` with the page's own `stage.clientWidth/Height`
  // at that moment (1280x724 in that measurement — the nav bar's own row
  // costs the stage 76px of height) and never again once `__renderOnce`
  // starts forcing a *different* renderer size for the screenshot itself.
  // The `||` therefore always took the STALE pre-`__renderOnce` figure, so
  // the HUD painted for a stage 76px shorter than the 3D frame actually
  // rendered at — invisible in a live browser (`resize()` keeps the two in
  // lockstep there) but a real mismatch in every headless capture this
  // project's own recipe (BRIEFING2.md, `__renderOnce(1600,1000)` or any
  // other explicit size) produces, this track's own `Vehicle/VehicleIcon`
  // capture included: the sprite loaded and painted (confirmed directly —
  // `hud-canvas` alone reads alpha 255 over its own rect), just 76 CSS px
  // higher up the merged frame than a checker compositing the two canvases
  // 1:1 would look. `resize()` itself always keeps the renderer's own
  // backing store equal to `stageWidth/Height` (it is the one call site that
  // sets both, together, from the same `stage.client*` read) — so reading
  // the renderer directly, unconditionally, is exactly the on-screen figure
  // in ordinary play and, unlike the old fallback, also the correct one
  // under `__renderOnce`, which touches only the renderer's own size.
  const hudW = renderer.domElement.width / renderer.getPixelRatio();
  const hudH = renderer.domElement.height / renderer.getPixelRatio();
  // The seat dots ask about live occupancy every frame: a room player can
  // climb into (or out of) this vehicle at any moment, and the feed's own
  // signature memo makes the steady state a single string compare.
  feedSeatDots();
  updateSoldierHud();
  // Every frame, not just an on-foot one: a seat has a crosshair too, and it
  // is `crosshairAim` that decides whose.
  updateCrosshair();
  gameHud.paint(hudW, hudH);
  // After the render: the sun's screen position comes from the camera the
  // frame was just drawn with. A no-op on every vanilla level (see
  // `setupLensFlare`).
  paintLensFlare();
  paintGameConsole(hudW, hudH);
}
renderer.setAnimationLoop(() => frame(Math.min(clock.getDelta(), 0.1)));
if (params.has('shots')) {
  // Screenshot tooling in a hidden tab gets no requestAnimationFrame ticks
  // and reports a 0x0 window; let it force a sized, deterministic frame
  // before reading the canvas back.
  // `dt` is the frame time to simulate, under the animation loop's own 0.1 s
  // clamp: 1/15 is a 15 fps machine, whose every frame owes two world ticks.
  window.__renderOnce = (w = 1280, h = 800, dt = 1 / 60) => {
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    frame(Math.min(Math.max(dt, 0), 0.1));
    return true;
  };
  // Scene handles for offline inspection: isolating one shader term is the
  // only practical way to attribute an artefact to it.
  window.__scene = scene;
  window.__camera = camera;
  window.__renderer = renderer;
  window.__THREE = THREE;
  // Flight state for headless checks: the sim is deterministic under
  // __renderOnce, so a test can step it frame by frame and read the result.
  Object.defineProperty(window, '__aircraft', { get: () => aircraft });
  // The driven car, its dashboard numbers included, for the same reason.
  Object.defineProperty(window, '__car', { get: () => car });
  // The stick the world springs in its occupied-vehicle tick (world.js),
  // reported through the local player's record.
  Object.defineProperty(window, '__stick', {
    get: () => world?.player(LOCAL_PLAYER)?.stick ?? { roll: 0, pitch: 0 },
  });
  // Free-fly heading. Setting `camera.rotation` directly is pointless here —
  // `applyLook` rewrites it from `look` on every frame — so a headless check
  // that wants to face the camera somewhere has to move this instead.
  window.__look = look;
  // The view rig, which the mouse and the C key drive and a headless run cannot.
  // `__view.turn()` is the pilot's head in the cockpit — a Corsair's guns sit 40
  // degrees off the nose, so framing them means looking at them — and the orbit
  // outside it. `__setView(mode)` selects a mode without walking the cycle.
  Object.defineProperty(window, '__view', { get: () => view });
  window.__setView = mode => {
    if (!view) return null;
    const set = view.setMode(mode);
    showView(set);
    return set;
  };
  // Headless checks fly through the real input path rather than poking the
  // aircraft: add key codes to __keys and open the gate with __setFly(true).
  window.__keys = keys;
  window.__setFly = setFly;
  // Gun state, for headless checks. Muzzle world positions are what settles the
  // question the moving-vehicle port exists to answer: a tracer's position must
  // diverge from the muzzle it left, not travel with it.
  window.__effects = () => effects.stats();
  // The sound pool: budget, live sources, what was played, dropped, stolen or
  // ruled inaudible. A voice-count check reads this beside its own patched
  // `AudioBufferSourceNode.start` counter, and the two must agree.
  window.__effectAudio = () => (effectAudio.listener
    ? effectAudio.snapshot() : { loaded: false });
  window.__effectSoundsReady = async () => {
    await effectSoundsLoad;
    return effectAudio.listener ? effectAudio.bundles.size : 0;
  };
  // Decode a bundle's samples ahead of a check, so the first round is not the
  // silent one a cold pool gives.
  window.__primeEffectSound = name => effectAudio.prime(name);
  // Rule 6's resolve signal (features/mesh-viewer-performance): every warm-up
  // the page has started for this level and for the weapon in hand, awaited,
  // then show()'s clock readings. A check snapshots `renderer.info.programs`
  // after this and can then assert that play links nothing new.
  window.__warmup = async () => {
    await Promise.all([warmups.level, warmups.rig]);
    return { ...warmups.timing };
  };
  // Any bundle in the library, played at a point: a check has to reach every
  // impact, trail and explosion a level could ask for, not only the surfaces
  // one rifle can hit from one spawn. The looping ones (the trails) run until
  // stopped, so the handles are kept for `__stopEffects`.
  const playedEffects = [];
  window.__effectNames = () => effects.library?.names ?? [];
  window.__playEffect = (name, position, normal = [0, 1, 0]) => {
    const handle = effects.play(name, { position, normal });
    if (handle) playedEffects.push(handle);
    return !!handle;
  };
  window.__stopEffects = () => {
    for (const handle of playedEffects.splice(0)) handle.stop();
  };
  window.__getFire = () => ({
    groups: vehicleGuns.map(group => ({
      name: group.node.name,
      input: group.stats.input,
      roundOfFire: group.stats.roundOfFire,
      velocity: group.stats.velocity,
      tracerInterval: group.stats.tracer?.interval ?? null,
      firing: group.firing,
      shots: group.shots,
      muzzles: group.muzzles.map(node => {
        node.updateWorldMatrix(true, false);
        return {
          name: node.name,
          world: node.getWorldPosition(new THREE.Vector3()).toArray(),
        };
      }),
      flashes: group.emitters.map(emitter => ({
        name: emitter.node.name,
        muzzle: emitter.muzzle?.name ?? null,
        visible: emitter.node.visible,
        additive: [emitter.node.material].flat()
          .every(m => m.blending === THREE.AdditiveBlending),
      })),
    })),
    tracers: guns.tracers.map(tracer => ({
      position: tracer.mesh.position.toArray(),
      velocity: tracer.velocity.toArray(),
      bright: tracer.bright,
      age: tracer.age,
      ttl: tracer.ttl,
      // What the width floor settled on this frame, against the streak's own
      // length scale: equal means the real mesh was already wide enough.
      scale: tracer.mesh.scale.toArray(),
      lengthScale: tracer.lengthScale,
      parent: tracer.mesh.parent === scene ? 'scene' : (tracer.mesh.parent?.name ?? null),
    })),
    // Where rounds stopped, newest first, each carrying the surface it struck
    // and the EffectBundle the MaterialManager names for that pairing. The
    // selection is assertable even though the drawing is a stand-in.
    hits: guns.hits,
    impacts: guns.impacts.length,
    projectiles: guns.projectiles.length,
    // HP-9d, for a headless check: a **fuse** round is one the engine gives an
    // end-of-life explosion but no impact explosion, and `resting` says it has
    // met a surface and is running its fuse down where it landed rather than
    // having detonated there.
    inFlight: guns.projectiles.map(shot => ({
      gun: shot.group.node.name,
      age: shot.age,
      ttl: shot.ttl,
      fuse: shot.fuse,
      resting: shot.resting,
      position: shot.mesh.position.toArray(),
      // COL-2, and the three numbers a bounce check needs: where it is going,
      // how many contacts it has resolved, and which material pair it is
      // resolving them against. A rest position alone cannot tell a round
      // that skidded from one that was teleported.
      velocity: shot.velocity.toArray(),
      contacts: shot.body?.contacts ?? 0,
      contactMaterial: shot.body?.material ?? null,
      surface: shot.body?.contact?.material ?? null,
      pair: shot.body?.contact
        ? shot.body.pairWith(shot.body.contact.material) : null,
    })),
    pooled: guns.tracerPool.length,
    // Baked streaks recycle into their own group's pool, not the shared
    // cylinder pool, so a leak there is invisible to `pooled` alone.
    meshPooled: vehicleGuns.reduce((n, g) => n + g.tracerMeshPool.length, 0),
  });
  // Seat/manned-gun state for headless checks (P2,
  // features/bf1942-3d-models/seats-and-manned-guns.md): which seat is
  // active, its turret's own angles, and the active seat's own FireArms
  // (ammo/heat/mags) -- `__getFire`/`vehicleGuns` above never see these, since
  // a gun/seat occupancy's own FireArms live in `mannedGuns`, not there.
  Object.defineProperty(window, '__occupancy', {
    get: () => occupancy && {
      rootId: occupancy.rootId,
      rootKind: occupancy.rootKind,
      order: occupancy.order,
      activeSeatId: occupancy.activeSeatId,
      activeKind: occupancy.seatKind(occupancy.activeSeatId),
      mannedActive: mannedActive(),
      turretAxes: occupancy.turret?.axes.map(a => ({ axis: a.axisName, angle: a.angle })) ?? null,
      fireArms: occupancy.activeFireArmsNodes().map(n => {
        const s = fireStateFor(n);
        return {
          name: n.name, ammo: s.unlimited ? -1 : s.ammo, magsLeft: s.magsLeft,
          heat: s.heat, hasHeat: s.hasHeat, canFire: s.canFire,
        };
      }),
    },
  });
  window.__nearEntry = () => nearEntry
    && { control: nearEntry.control, seatId: nearEntry.seatId };
  // The seated occupant and the arms the IK is driving this frame: which bone
  // is pinned to which node, and how far it actually is from where the
  // declared offset puts it. A headless check has no other way to tell a hand
  // that is on the wheel from one that is merely near it.
  window.__seatIk = () => {
    const v = new THREE.Vector3();
    const want = new THREE.Vector3();
    const q = new THREE.Quaternion();
    const s = new THREE.Vector3();
    return seatIkChains.map(chain => {
      chain.target.updateWorldMatrix(true, false);
      chain.target.matrixWorld.decompose(want, q, s);
      const t = ikTarget(chain.entry, [want.x, want.y, want.z],
                         [q.x, q.y, q.z, q.w]);
      chain.end.getWorldPosition(v);
      return {
        bone: chain.bone, node: chain.node.name, target: chain.target.name,
        want: t.position.map(n => +n.toFixed(4)),

    // to (HP-9: the transform origin, not a bounding box). A check that wants
    // to stand a man beside one, or to know which neighbour a shell should
    // have caught, needs this and has had to guess at it until now.
    pos: damageVisuals.get(owner)?.node
      ? damageVisuals.get(owner).node.getWorldPosition(splashPos).toArray()
        .map(n => Math.round(n * 100) / 100)
      : null,
    tier: v.shown ? { threshold: v.shown.threshold, names: v.shown.names } : null,
    running: damageVisuals.get(owner)?.handles.length ?? 0,
    tiers: v.effects.map(e => ({ hp: e.hp, effect: e.effect })),
  }));
  // The land vehicle the player is currently driving, for a headless drive.
  // Reading its state is not enough to *test* one: the renderer manages a
  // couple of frames a second on a real level under SwiftShader, which pins
  // `dt` at the page's 0.1 s clamp and makes a real-time drive meaningless.
  // So this also hands back the two calls `frame()` makes — the same object,
  // the same level collider, the same material map — and a check can step
  // them synchronously at whatever rate it wants.
  window.__drive = () => (car ? {
    state: () => ({
      speed: car.state.velocity.length(),
      along: car.state.velocity.dot(
        new THREE.Vector3(0, 0, -1).applyQuaternion(car.state.orientation)),
      position: { ...car.state.position },
      velocity: { ...car.state.velocity },
      grounded: car.state.grounded,
      // Attitude, in degrees: a deck trace has to see the hull pitch up an
      // incline and level off on the pad, and reading that off the orientation
      // quaternion outside the page is needless work.
      pitch: THREE.MathUtils.radToDeg(Math.asin(Math.max(-1, Math.min(1,
        new THREE.Vector3(0, 0, -1).applyQuaternion(car.state.orientation).y)))),
      roll: THREE.MathUtils.radToDeg(Math.asin(Math.max(-1, Math.min(1,
        new THREE.Vector3(1, 0, 0).applyQuaternion(car.state.orientation).y)))),
      gear: car.gear ?? null,
      revs: car.revs ?? null,
      wheels: car.wheels.map(w => ({
        compression: w.compression, load: w.load,
        friction: w.friction, latched: w.staticGrip, driven: w.driven,
      })),
    }),
    setInput: (name, value) => car.setInput(name, value),
    integrate: dt => car.integrate(dt),
    // Stand it somewhere exact, stopped and pointing at a heading — the same
    // job `__teleport` does for the soldier, and needed for the same reason.
    // A measured top speed or brake distance is only a measurement if the
    // run had room: every land spawn on Wake is a few tens of metres from a
    // building or the sea, so a 40-second full-throttle run from one reads
    // the collision sweep rather than the drivetrain. Drops it a little clear
    // of the ground and lets the springs take it, exactly as a spawn does.
    place: (x, y, z, yaw = 0) => {
      car.state.position.set(x, y, z);
      car.state.velocity.set(0, 0, 0);
      car.state.angularVelocity.set(0, 0, 0);
      car.state.orientation.setFromAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
      return { ...car.state.position };
    },
    // Where the level's heightfield and material map put the ground under a
    // world (x, z): the two functions the drivetrain itself is handed. `fromY`
    // is the drivable-deck reference the wheels pass (their axle plus the step
    // they can mount), so a trace can read the deck a vehicle is riding and the
    // terrain under it separately.
    ground: (x, z, fromY) => ({
      height: groundHeight(x, z, fromY),
      friction: surfaceFriction(x, z, fromY),
      deck: collider?.deckHeight ? collider.deckHeight(x, z, fromY) : null,
    }),
    // What the hull sweep meets on a move, and the triangle it meets — the
    // question "why did the tank stop here" has no other answer from outside
    // the page, and a deck that reads as a wall is exactly that question.
    // `deckStepTop`/`deckFloorCos` are the gate; omit them for the ungated view.
    sweep: (dx, dy, dz, dist, deckStepTop = -Infinity, deckFloorCos = 2) => {
      if (!collider) return null;
      const len = Math.hypot(dx, dy, dz) || 1;
      const s = car.state.position;
      const hit = collider.sweepSphere(s.x, s.y, s.z, dx / len, dy / len, dz / len,
        dist, car._hullRadius, car._collisionOwner, true, deckStepTop, deckFloorCos);
      if (!hit) return null;
      const tris = collider.statics?.tris;
      const j = hit.triangle * 9;
      return {
        t: hit.t, owner: hit.owner, triangle: hit.triangle,
        drivable: collider.statics?.drivable?.[hit.triangle] === 1,
        name: collider.statics?.ownerNodes?.[hit.owner]?.name ?? null,
        point: [hit.px, hit.py, hit.pz],
        normal: [hit.nx, hit.ny, hit.nz],
        vertices: tris && hit.triangle >= 0
          ? [[tris[j], tris[j + 1], tris[j + 2]],
             [tris[j + 3], tris[j + 4], tris[j + 5]],
             [tris[j + 6], tris[j + 7], tris[j + 8]]]
          : null,
        radius: car._hullRadius,
      };
    },
  } : null);
  // HP-15, for a headless check: what the occupied hull's damage state is
  // letting through this frame, and what the aim rig is actually scaling by.
  window.__inputGate = () => ({
    blocked: vehicleInput.blocked,
    rotationalScale: vehicleInput.rotationalScale,
    turretInputScale: occupancy?.turret?.inputScale ?? null,
    occupied: occupiedVehicleDamage()
      ? { hp: occupiedVehicleDamage().hitPoints,
          critical: occupiedVehicleDamage().critical,
          destroyed: occupiedVehicleDamage().destroyed }
      : null,
  });
  // Hurt one by owner id without having to hit it with a round — the same
  // generic entry point `window.__damage(n)` is for the soldier. Negative heals,
  // the way `SimpleObject::handleDamage` dispatches on the sign of its argument
  // (ledger HP-7).
  // The rigid-body world: one row per simulated vehicle, and a way to step it
  // in a hidden tab the way `__renderOnce` steps everything else.
  window.__bodies = () => (bodyWorld ? [...bodyWorld.entries.values()].map(e => {
    const b = e.parked ? e.parked.body : e.driven;
    return {
      owner: e.owner, name: bodyScene.get(e.owner)?.node?.name, driven: !!e.driven,
      pos: [...b.pos], v: [...b.v], w: [...b.w], sleepiness: b.sleepiness ?? null,
      moved: !!bodyScene.get(e.owner)?.moved, hp: vehicleDamage.get(e.owner)?.hitPoints ?? null,
    };
  }) : null);
  window.__stepBodies = dt => stepVehicleBodies(dt);
  window.__crashLog = () => (crashLog ??= []);
  // The aircraft under the player, for a stepped test: inputs, state, a pose.
  window.__plane = () => (aircraft ? {
    setInput: (name, value) => aircraft.setInput(name, value),
    state: () => ({ position: { ...aircraft.state.position }, velocity: { ...aircraft.state.velocity },
      grounded: aircraft.state.grounded, throttle: aircraft.state.throttle }),
    place: (x, y, z, vx, vy, vz) => {
      aircraft.state.position.set(x, y, z);
      aircraft.state.velocity.set(vx, vy, vz);
      aircraft.applyTransform();
      snapPresentation();
    },
    integrate: dt => aircraft.integrate(dt),
  } : null);
  window.__wakeBody = owner => { const e = bodyWorld?.get(owner); e?.parked?.body.wake(); return !!e?.parked; };
  // Climb into a placed vehicle by owner id, and put the driven one somewhere
  // facing something: what a ramming test needs and a keyboard cannot give.
  window.__enterOwner = owner => {
    const node = damageVisuals.get(owner)?.node;
    if (!node) return false;
    enterVehicle({ vehicle: node, seatId: null });
    return !!(car || aircraft);
  };
  // The occupied vehicle's interior, settled: true once it is grafted, false
  // for a vehicle that has none. A check counting what an entry costs the GPU
  // has to sample after this, or the glb lands in whichever cycle it likes.
  window.__cockpitReady = () =>
    ((aircraft || car)?.cockpitReady ?? Promise.resolve(null)).then(Boolean);
  window.__placeCar = (x, z, yaw, speed = 0) => {
    if (!car) return null;
    const s = car.state;
    s.position.set(x, groundHeight(x, z) + 0.6, z);
    s.orientation.setFromAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
    const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(s.orientation);
    s.velocity.copy(fwd).multiplyScalar(speed);
    s.angularVelocity.set(0, 0, 0);
    car.applyTransform();
    snapPresentation();
    return { forward: [fwd.x, fwd.y, fwd.z] };
  };
  window.__damageVehicle = (owner, amount) => {
    const vehicle = vehicleDamage.get(owner);
    if (!vehicle) return null;
    if (amount > 0) vehicle.damage(amount);
    else vehicle.heal(-amount);
    const result = vehicle.update(0);
    if (result.changed) showDamageTier(vehicle, result.tier);
    if (result.died) wreckVehicle(vehicle);
    return { hp: vehicle.hitPoints, destroyed: vehicle.destroyed,
             tier: vehicle.shown };
  };
  window.__matrixDrift = () => {
    const local = new THREE.Matrix4();
    const expect = new THREE.Matrix4();
    let worst = 0, checked = 0, worstName = null;
    const walk = (obj, parentWorld) => {
      if (obj.matrixAutoUpdate) local.compose(obj.position, obj.quaternion, obj.scale);
      else local.copy(obj.matrix);
      if (obj === vmRoot) expect.copy(camera.matrixWorld);
      else if (parentWorld) expect.multiplyMatrices(parentWorld, local);
      else expect.copy(local);
      const a = expect.elements, b = obj.matrixWorld.elements;
      for (let i = 0; i < 16; i++) {
        const d = Math.abs(a[i] - b[i]);
        if (d > worst) { worst = d; worstName = obj.name || obj.type; }
      }
      checked++;
      const here = expect.clone();
      for (const child of obj.children) walk(child, here);
    };
    walk(scene, null);
    walk(vmScene, null);
    return { worst, checked, worstName, frozen: frozenCount };
  };
  window.__getAudioState = () => ({
    audioListener,
    // The master limiter, and how hard it is working right now: `reduction`
    // is the dB it is taking off the sum this instant, so a test can assert
    // that an idling engine is untouched and a cannon is only just caught.
    limiter: audioLimiter ? {
      threshold: audioLimiter.threshold.value,
      ratio: audioLimiter.ratio.value,
      reduction: audioLimiter.reduction,
    } : null,
    ambientAudio,
    activeAreaAudios,
    // Headless Chromium will not let anyone listen, so the engine crossfade has
    // to be asserted on the graph: per-layer gain and playback rate, and the
    // voice count, which is the number the hall-echo bug moved.
    engine: engineAudio ? engineAudio.snapshot() : null,
    // Same reason as the engine, plus one of its own: a gun patch is gated by
    // gain per trigger pull, so "no voice was added while Space was held" is
    // the assertion that keeps the hall-echo bug from coming back through the
    // weapons.
    weapons: weaponAudio.map(w => ({
      fireArms: w.spec.fireArms,
      node: w.node?.name ?? null,
      ...w.audio.snapshot(),
    })),
  });
}
</script>
</body>

  return { heightfield, statics };
}

// Rule 6's warm-up (features/mesh-viewer-performance): nothing play can draw
// is linked, uploaded or first used by the frame that draws it. Three links
// a material's program on the first frame that draws it, uploads a texture on
// the first frame that binds it and builds a skinned mesh's bone texture on
// its first draw, and the link blocks that frame on the driver: on this Iris
// Xe's system GL the perf harness watched one block for 8-9.5 s and take the
// WebGL context with it.
//
// A subtree is compiled against the scene and camera of the pass that draws
// it — the canvas (no render target), that scene's fog and lights: all a
// program key reads that the material and the object do not — then every
// texture its materials can bind goes to the GPU, and every program the
// compile linked has its first use taken (`WebGLProgram.getUniforms`: the log
// and uniform queries three otherwise runs inside the first draw, and the
// point where a link still in flight would block). `compile` walks hidden
// nodes too, so a pooled particle or a parked gun's flash is warmed like a
// wall.

/** Put `texture` on the GPU if its pixels have arrived; a no-op before. */
function uploadTexture(texture) {
  if (!texture?.isTexture || texture.version === 0) return;
  renderer.initTexture(texture);
}

/** Every texture `root` can draw with: the material's slots, a shader's
 *  uniforms and the renderer's copy of them (where the ones `onBeforeCompile`
 *  adds live, once compiled), and each skinned mesh's bone texture, built
 *  here rather than on its first draw (`WebGLRenderer.setProgram`). */
function uploadTextures(root) {
  root.traverse(obj => {
    if (obj.isSkinnedMesh && obj.skeleton) {
      if (!obj.skeleton.boneTexture) obj.skeleton.computeBoneTexture();
      uploadTexture(obj.skeleton.boneTexture);
    }
    for (const m of [obj.material].flat()) {
      if (!m) continue;
      for (const value of Object.values(m)) uploadTexture(value);
      for (const uniform of Object.values(m.uniforms ?? {})) uploadTexture(uniform?.value);
      const compiled = renderer.properties.get(m).uniforms;
      for (const uniform of Object.values(compiled ?? {})) uploadTexture(uniform?.value);
    }
  });
  // A scene's own two textures hang off no material: the skybox cube three
  // draws the background with, and an environment map.
  if (root.isScene) {
    uploadTexture(root.background);
    uploadTexture(root.environment);
  }
}

/** Compile `root` for the pass that draws it, upload its textures and take
 *  the first use of every program the compile linked. The programs are taken
 *  as the compile returns, before anything swaps a material out from under
 *  them: `GunFire.collect` clones a rig's flash materials right after the
 *  rig's compile starts, and the clones reuse these programs by key. */
function warmSubtree(root, cam = camera, target = scene) {
  const compiled = renderer.compileAsync(root, cam, target);
  const programs = new Set();
  root.traverse(obj => {
    for (const m of [obj.material].flat()) {
      const linked = m && renderer.properties.get(m).programs;
      if (linked) for (const program of linked.values()) programs.add(program);
    }
  });
  return compiled.catch(() => {}).then(() => {
    uploadTextures(root);
    // A program released since (its last material disposed) has no GL
    // program left to ask.
    for (const program of programs) if (program.program) program.getUniforms();
  });
}

/** The level's warm-up, after applyFog() so the programs are the fogged ones
 *  the frame asks for, and again on every level switch. The effect pool and
 *  the gun stand-ins are built first; then the whole scene — terrain,
 *  statics, the level's LOD interiors and flags, parked vehicles and their
 *  hidden gun payloads, sky, water, the effect pool — is warmed for the main
 *  pass. */
function warmLevel(library) {
  if (library) effects.warm();
  const stand = guns.warm();
  return Promise.all([warmSubtree(scene), warmSubtree(stand)]);
}
// What the `?shots` hook `__warmup` waits on: the level's warm-up (show()) and
// the weapon in hand's (loadHandWeapon), plus the clock readings a check needs
// to say how long the level's took. Neither promise gates anything the page
// itself does.
const warmups = { level: Promise.resolve(null), rig: Promise.resolve(), timing: {} };
// The stick position (-1..1, driven toward a held key's full deflection and
// springing back to centre on release) is the world's per-player state now —
// world.js owns it beside the aircraft path that spends it, and the page's
// resets delegate to `world.resetStick`.
const HEAD_SENS = 0.0022;
// The views C cycles from the ACTIVE SEAT -- one `VehicleCamera` per seat
// taken (`localPlayer.view`), rebuilt on every mount and seat switch
// (`buildSeatView`), never one per vehicle. Cockpit and nose are read from data (the seat's own Camera node
// and its `OutsideHudOffset`; the look clamps are `CorsairCamera`'s own
// setMin/setMaxRotation). Chase, front and fly-by are ours; the engine
// declares that they exist (`CVMChase`, `CVMFrontChase`, `CVMFlyBy`) and never
// where they sit. Which of them a seat reaches is `seat-view.js`'s answer from
// the seat's `CVM*` words and the server switches. See flight.js. The subject
// it frames when the hull has no drivetrain -- a Defgun, an AA gun, a tripod
// Browning, a jeep nobody drives -- is `localPlayer.gunSubject`, built once per mount.

// --- the server's view switches --------------------------------------------
//
// `game.serverExternalViews` and `game.serverAllowNoseCam` as the shipped
// `ServerSettings.con` writes them (both 1), plus the page's own soldier
// switch; see server-settings.js for what was read. Query string over
// localStorage over defaults, and the side panel writes them live.
function pageStorage() {
  try { return window.localStorage; } catch { return null; }
}
const serverSettings = new ServerSettings(
  readServerSettings(params, pageStorage()), pageStorage());
for (const [id, key] of [
  ['srv-external-views', 'externalViews'],
  ['srv-nose-cam', 'allowNoseCam'],
  ['srv-soldier-views', 'soldierExternalViews'],
]) {
  const el = document.getElementById(id);
  if (!el) continue;
  el.checked = serverSettings[key];
  el.addEventListener('change', () => serverSettings.set(key, el.checked));
}
serverSettings.onChange(() => {
  refreshSeatViewModes();
  soldierView.syncFootView();
});

/**
 * The active seat's own view rig. Called on every mount and every seat switch:
 * the inside view is THIS seat's Camera node (a gunner's rides his turret, a
 * passenger's sits where he sits), the external views hang off the root the
 * same for every seat, and the cycle is what this seat's Camera declares
 * under the server's switches. A root with no drivetrain -- the AA gun, the
 * Defgun, a Browning -- gets a `FixedSubject` for the hull-frame reads.
 *
 * The mode carries across a seat switch when the new seat reaches it (a
 * gunner who was outside stays outside as he climbs to the next gun);
 * otherwise the seat opens inside, which is `setViewMode`'s own opening.
 */
function buildSeatView() {
  const seat = localPlayer.occupancy;
  if (!seat) {
    localPlayer.view = null;
    localPlayer.viewFor = null;
    return null;
  }
  let subject = localPlayer.aircraft || localPlayer.car;
  if (!subject) {
    if (!localPlayer.gunSubject || localPlayer.gunSubject.node !== seat.root) {
      localPlayer.gunSubject = new FixedSubject(seat.root);
    }
    subject = localPlayer.gunSubject;
  }
  const info = seat.seatInfo(seat.activeSeatId);
  const eyeNode = seat.cameraNode();
  const nose = noseCamOffset(info?.camera?.name, info?.camera?.userData?.cameraView);
  const modes = seatViewModes({
    cvm: info?.cameraViewModes, nose: !!nose, settings: serverSettings,
  });
  localPlayer.view = new VehicleCamera(subject, {
    groundHeight, eyeNode, modes, nose, mode: localPlayer.view?.mode,
  });
  localPlayer.viewFor = { seat, seatId: seat.seatId, drive: seat.drive };
  // The constructor sets the mode without the swap; the interior follows the
  // view from here, exactly as it does on a C press.
  subject.setFirstPerson(localPlayer.view.firstPerson);
  mountChaseLaw();
  seatPose.updateSeatPoseVisibility();
  return localPlayer.view;
}

/** A server switch changed under a seated player: re-gate the cycle. */
function refreshSeatViewModes() {
  if (!localPlayer.view || !localPlayer.occupancy) return;
  const seat = localPlayer.occupancy.seatInfo(localPlayer.occupancy.activeSeatId);
  localPlayer.view.setModes(seatViewModes({
    cvm: seat?.cameraViewModes, nose: !!localPlayer.view.nose, settings: serverSettings,
  }));
  seatPose.updateSeatPoseVisibility();
}

/** C: the next view of whatever the player is sitting in, or standing as. */
function cycleView() {
  if (optPilot.checked && localPlayer.view) hudFeed.showView(localPlayer.view.cycle());
  else if (optOnFoot.checked && soldier && soldierView.footView3p.modes.length > 1) {
    hudFeed.showView(soldierView.footView3p.cycle());
  }
}

// --- the external view's law (chase-camera.js) -----------------------------
//
// `chase-camera.js` is the arithmetic of `Camera::getTransformation` for
// CVMChase / CVMFrontChase; this is the three.js half: read the drawn poses,
// write the camera. It reads NODES, never `state`: `applyVehicleInterp` has
// already slerped the root and every aim axis to this frame's alpha and walked
// the world matrices, so the tower it sees is the one being drawn. Reading the
// raw tick pose here is what would make the view judder at 30 Hz.
//
// Which frame supplies forward/up is the contested part - the W4-C brief says
// the turret, both binaries say the hull - and `chaseLawFor` owns that answer.
// `?chase=engine` is the law as read; `?chase=legacy` is the old framing.
const CHASE_OPTION = params.get('chase');
const chaseRig = {
  law: null,            // chaseLawFor()'s answer for the mounted root seat
  camera: null,         // the root seat's Camera node: anchor and look-at point
  root: null,
  radius: 0,
  rel: [0, 0, 0],
  target: [0, 0, 0],
  eye: [0, 0, 0],
  anchor: new THREE.Vector3(),
  eyeV: new THREE.Vector3(),
  quat: new THREE.Quaternion(),
  fwd: new THREE.Vector3(),
  up: new THREE.Vector3(),
  basis: new THREE.Matrix4(),
};
const CHASE_WORLD_UP = new THREE.Vector3(0, 1, 0);
// `getBoundingRadius` is cached on the engine's object (+0xb4); cached here per
// root for the same reason, and so a wreck's smoke never inflates it.
const chaseRadiusCache = new WeakMap();

/** The plain tree `boundingRadius` walks, from a vehicle's node tree. */
function chaseRadiusTree(node) {
  let radius = 0;
  if (node.isMesh && !isCollision(node) && node.geometry) {
    if (!node.geometry.boundingSphere) node.geometry.computeBoundingSphere();
    const sphere = node.geometry.boundingSphere;
    if (sphere) radius = sphere.center.length() + sphere.radius;
  }
  return {
    radius,
    offset: node.position.toArray(),
    children: node.children.filter(c => !isCollision(c)).map(chaseRadiusTree),
  };
}

/** Does `cameraNode` hang under one of the seat's mouse-aimed axes (GUN-7's
 *  shape)? Asked of the seat survey, not of a `TurretRig`: a rig is only built
 *  the first time its seat is manned, and a player who climbs in at the hull
 *  gunner's door reaches the driving seat later, by a seat switch. Peers
 *  included: `surveyVehicle` keeps every same-axis bundle as `axis.peers`
 *  (a destroyer's two turret pairs under one PCO), and a Camera parented
 *  under any peer rides the turret just as much as one under `axis.node`. */
function cameraRidesTurret(cameraNode, seat, root) {
  if (!cameraNode || !seat?.axes) return false;
  const aimed = Object.values(seat.axes)
    .filter(axis => AIM_INPUTS.includes(axis?.spec?.input))
    .flatMap(axis => axis.peers?.length ? axis.peers : [axis.node]);
  for (let p = cameraNode.parent; p && p !== root; p = p.parent) {
    if (aimed.includes(p)) return true;
  }
  return false;
}

/** Decide the law for the seat just taken. Called from `buildSeatView`, after
 *  the seat's rig exists: the anchor is THIS seat's Camera (the engine's
 *  `camM`, which for a gunner rides the gun), the frame the root's or the
 *  Camera's parent per `chaseLawFor`, and the radius the root's. */
function mountChaseLaw() {
  chaseRig.law = null;
  chaseRig.camera = localPlayer.occupancy?.cameraNode() || null;
  chaseRig.root = localPlayer.occupancy?.root || null;
  chaseRig.rel.fill(0);
  if (!localPlayer.view || !chaseRig.camera || !chaseRig.root) {
    if (localPlayer.view) localPlayer.view.externalLaw = null;
    return;
  }
  const rides = cameraRidesTurret(
    chaseRig.camera, localPlayer.occupancy.seatInfo(localPlayer.occupancy.activeSeatId), chaseRig.root);
  chaseRig.law = chaseLawFor(CHASE_OPTION, rides);
  if (chaseRig.law.law !== 'engine') { localPlayer.view.externalLaw = null; return; }
  if (!chaseRadiusCache.has(chaseRig.root)) {
    chaseRadiusCache.set(chaseRig.root, boundingRadius(chaseRadiusTree(chaseRig.root)));
  }
  chaseRig.radius = chaseRadiusCache.get(chaseRig.root);
  localPlayer.view.externalLaw = chaseExternalLaw;
}

/** `VehicleCamera.externalLaw`: true when it wrote `pose`. Every seat: the
 *  engine runs one `Camera::getTransformation` per seat Camera, and a
 *  gunner's anchor is his own Camera the world's turret step just moved. */
function chaseExternalLaw(mode, dt, pose) {
  const rig = chaseRig;
  rig.camera.updateWorldMatrix(true, false);
  rig.camera.getWorldPosition(rig.anchor);
  if (mode !== 'chase' && mode !== 'front') {
    // The engine carries `rel` as (last output - Camera position) in every
    // mode: zero in the cockpit, the tripod's offset in fly-by.
    if (mode === 'flyby' && localPlayer.view.anchored) {
      rig.rel[0] = localPlayer.view.anchor.x - rig.anchor.x;
      rig.rel[1] = localPlayer.view.anchor.y - rig.anchor.y;
      rig.rel[2] = localPlayer.view.anchor.z - rig.anchor.z;
    } else {
      rig.rel.fill(0);
    }
    return false;
  }
  // forward/up: the Camera's parent (the brief's turret frame, a viewer
  // choice) or the vehicle root (what both binaries read).
  const frame = rig.law.frameFromAim ? rig.camera.parent : rig.root;
  frame.getWorldQuaternion(rig.quat);
  rig.fwd.set(0, 0, -1).applyQuaternion(rig.quat);
  rig.up.set(0, 1, 0).applyQuaternion(rig.quat);
  const sign = mode === 'front' ? CHASE_AHEAD : CHASE_BEHIND;
  chaseTarget(rig.fwd.toArray(), rig.up.toArray(), rig.radius, sign, rig.target);
  const v = localPlayer.view.vehicle.state.velocity;
  chaseStep(rig.rel, rig.target, [v.x, v.y, v.z], sign, dt);
  const ax = rig.anchor.x + rig.rel[0];
  const az = rig.anchor.z + rig.rel[2];
  chaseEye(rig.anchor.toArray(), rig.rel, groundHeight(ax, az), rig.eye);
  rig.eyeV.fromArray(rig.eye);
  pose.position.copy(rig.eyeV);
  rig.basis.lookAt(rig.eyeV, rig.anchor, CHASE_WORLD_UP);
  pose.quaternion.setFromRotationMatrix(rig.basis);
  return true;
}

/**
 * Occupy `node` (any `PlayerControlObject` root — a flyable/drivable one,
 * a `c_ETTank`, a bare gun/seat furniture root) at `seatId`, or the root seat
 * when `seatId` is omitted. One `VehicleOccupancy` (`seats.js`) now backs
 * every kind: `air`/`ground`/`tank` additionally get a real drivetrain built
 * on it (unchanged interface, so `drive()`/`pilot()`/`view` need nothing new
 * to keep working when the *root* seat is the one active), and `gun`/`seat`
 * roots — and any nested seat of any of the above — run on `occupancy` alone,
 * stepped by `manned()` (`mannedActive()` decides which, in `frame()`'s
 * dispatch).
 */
function setPilot(on, node = null, seatId = null) {
  if (on) {
    const current = localPlayer.occupancy;
    const target = node || current?.root || vehicleHits.pickVehicle();
    if (!target) {
      optPilot.checked = false;
      return;
    }
    let seat;
    if (current && current.root === target) {
      // Re-entering the same vehicle at a specific door (its own EntryPoint
      // was in reach again) rather than wherever you last sat.
      seat = seatId ? vehicles.switchSeat(LOCAL_PLAYER, seatId) : current;
      if (seat && seatId) seatPose.disposeSeatPose();
    } else {
      // A different vehicle than the one already held. Every exit path has
      // already given the old seat back; this is the defensive case.
      if (current) leaveSeat();
      // Root seat unless a specific `EntryPoint` said otherwise — walking
      // straight up to a Sherman's hull-gunner door seats you there directly,
      // never through the driver's seat first. The hull's instance builds the
      // drivetrain when its root seat is taken, adopts it into the body world,
      // thaws the node, collects this seat's guns, mounts the world's record
      // and claims the audio (`vehicle-instance.js`).
      seat = vehicles.enter(target, seatId, LOCAL_PLAYER);
    }
    // The seat is held by someone else: nothing happens, as a full seat in
    // the engine refuses the toggle. The caller reads `localPlayer.occupancy`.
    if (seat) mountLocalSeat(seat);
  } else if (localPlayer.occupancy) {
    // The seat's gone; tell the server so the others' replicas release it.
    const netSeat = room.netSeatRow('exit');
    leaveSeat({ reset: true });
    if (netSeat) room.netSendAction(netSeat);
  } else {
    world?.clearPlayerVehicle(LOCAL_PLAYER);
  }
  world?.resetStick(LOCAL_PLAYER);
  // Climbing in or out moves the drawn set and the camera both; re-collect
  // the nodes a tick poses and start a fresh pair (the render-interpolation
  // block, beside `footLookPending`).
  rebuildVehicleInterp();
  hud.textContent = isTouchDevice ? getTouchHudText()
    : localPlayer.occupancy
      ? (mannedActive() ? HUD_MANNED : localPlayer.car ? HUD_DRIVE : HUD_PILOT)
      : (optOnFoot.checked && soldier ? HUD_FOOT : HUD_FLY);
  updateMobileControls();
}

function mountLocalSeat(seat) {
  // After the seats exist: this seat's own view rig, and its law -- which
  // asks whether the seat's Camera rides one of its own aim axes.
  buildSeatView();
  // The instance's `collect` has just cloned this seat's flash materials and
  // marked the additive ones fresh `Material` instances the renderer has
  // never linked a program for. The level's warm-up compiled the originals
  // they were cloned from, not these; skip this and the clone's first real
  // draw is the mid-burst link stall rule 6 exists to prevent.
  warmSubtree(seat.root);
  hudFeed.feedVehicleHud();
  // Render the seated soldier (passenger seats only — driver seats have no
  // poseAnimation and skip the load). Awaited here so the cockpit frame the
  // player sees is never the first external one with an empty seat.
  if (seat.instance.drivable || seat.rootKind === 'gun') seatPose.loadSeatPose();
  // The room's control channel: the server mounts this player in its own
  // world the same way (netcode.js MSG_ACTION; the vehicle id is the room
  // table's, matched by template + pose like the renderer's). The seat-dot
  // feed keeps the same id for its every-frame occupant read.
  room.netOccupiedVehicleId = room.netVehicleIdFor(seat.root);
  const netSeat = room.netSeatRow('enter');
  if (netSeat) room.netSendAction(netSeat);
}

function syncLocalSeat() {
  const seat = localPlayer.occupancy;
  const was = localPlayer.viewFor;
  if (!seat) return;
  if (was && was.seat === seat && was.seatId === seat.seatId && was.drive === seat.drive) return;
  buildSeatView();
  rebuildVehicleInterp();
  hudFeed.feedVehicleHud();
  updateMobileControls();
}

function leaveSeat({ reset = false } = {}) {
  const seat = localPlayer.occupancy;
  if (!seat) return;
  const drive = seat.drive;
  // The seated occupant goes with the seat, or stepping out of a jeep leaves
  // a soldier sitting in mid-air where the driver's seat had been.
  seatPose.disposeSeatPose();
  if (drive) {
    if (reset && seat.instance.seats.size === 1) drive.reset();
    // `reset()` only restores the exterior when it owns the swap, and it no
    // longer does. Vacating the seat has to put the fuselage back explicitly
    // or the parked plane sits on the strip as an open cockpit tub -- and a
    // hull someone else keeps driving is seen from outside.
    localPlayer.view?.setMode('cockpit');
    drive.setFirstPerson(false);
  }
  vehicles.leave(LOCAL_PLAYER);
  hudFeed.clearVehicleHud();
  // The seat's view rig goes with the seat: the next mount builds its own.
  localPlayer.view = null;
  localPlayer.viewFor = null;
  localPlayer.gunSubject = null;
  world?.resetStick(LOCAL_PLAYER);
  rebuildVehicleInterp();
}

function passenger(dt) {
  if (!localPlayer.view) return;
  const pose = localPlayer.view.update(dt);
  camera.position.copy(pose.position);
  camera.quaternion.copy(pose.quaternion);
  guns.firstPerson = localPlayer.view.inside;
}

// `?turret=<n>` multiplies `countsPerPixel` -- how many DirectInput counts one
// browser `movementX` pixel is worth.
//
// It used to scale every axis's declared `setMaxSpeed`, standing in for the
// unread magnitude of `PlayerInput[c_PIMouseLookX/Y]`. That is read now
// (`mouse-input.js`), so `setMaxSpeed` is used as the engine uses it and this
// knob has moved to the one quantity still unproven: whether a browser pixel
// is a mouse count. It is the same knob to a player -- turn it up and
// everything aims faster -- but it now moves the soldier's head as well as a
// turret, which is correct, because a mouse count is a mouse count.
// `window.__turretScale()` reads and writes it live.
if (params.has('turret')) {
  const n = Number(params.get('turret'));
  if (Number.isFinite(n) && n > 0) mouseInput.countsPerPixel = n;
}

const HUD_PILOT = 'W/S throttle · A/D rudder · arrows pitch and roll · LMB guns · RMB bombs · '
  + 'C view · mouse look around · R reset · 1-9 seats · E out on the ground · Esc';
const HUD_DRIVE = 'W/S drive and brake · A/D steer · mouse aims · LMB main gun · RMB coax · C view · '
  + 'R reset · 1-9 seats · E get out · Esc';
const HUD_MANNED = 'Mouse aims · LMB fires · C view · 1-9 seats · E get out · Esc';

/**
 * Read the keyboard into the car and step the drive model.
 *
 * Round 3's first disclosed gap: this now runs every frame the vehicle
 * exists, not only while its own root/driver seat is the one active. Before,
 * `frame()`'s dispatch called this exclusively (never alongside `manned()`),
 * so switching to a nested seat — the Sherman's own hull gunner — stopped
 * `car.integrate(dt)` from ever being called again, freezing the hull's
 * momentum, suspension and gravity dead rather than leaving it to coast on
 * whatever throttle and steering the driver last set, the way it would if
 * the driver had simply let go of the wheel instead of climbing to a
 * different seat. Reading fresh keyboard input, firing this seat's own
 * `vehicleGuns` and moving the camera all stay exclusive to the frames the
 * driver's own root seat is actually the one occupied (`driving` below) —
 * otherwise nobody is holding this wheel right now, and `manned()` (not this
 * function) owns the camera and the trigger for whichever seat really is.
 */
function drive(dt) {
  if (!localPlayer.car) return;
  // The world has already run this function's old sim half (world.js
  // #vehicleTick): the HP-15 gate (`driving` below reads its answer), the
  // keyboard into c_PIThrottle/c_PIYaw/c_PIFire/c_PIAltFire, `car.integrate`,
  // the rigs (`applyTurrets` after, never before — the world keeps the page's
  // own ordering comment), the turret's aim and step, the FireStates and the
  // `vehicleGuns` loop with the unconditional-off `setFiring` semantics. The
  // shell left here is the presentation half: the muzzle flash's 1P choice
  // and the camera, including the passenger-seat pose.
  const driving = localPlayer.occupancy.isActiveRoot() && !vehicleHits.vehicleInput.blocked;
  guns.firstPerson = localPlayer.car.firstPerson;
  // A non-driving seat (the Willy's passenger, a Sherman's hull gunner) still
  // needs the camera — the VehicleCamera owns the C-cycle for every seat of a
  // flyable vehicle, not only the root. The drivetrain step above is gated on
  // `driving` for the same reason the throttle is: the passenger can't steer.
  // But the camera pose is not steering, and letting it lapse here leaves the
  // view pinned to wherever the passenger's `setFirstPerson` swap left it —
  // exactly the "stuck in the passenger POV" bug SEAT-9 (camera-modes.md §3)
  // describes. Manned guns keep their own camera in `manned()` below, so this
  // only matters for the passenger seat of a drivable vehicle.
  if (!driving && !mannedActive() && localPlayer.view) {
    const pose = localPlayer.view.update(dt);
    camera.position.copy(pose.position);
    camera.quaternion.copy(pose.quaternion);
    return;
  }
  if (!driving) return;
  // Runs after the world integrated, so an external camera hangs off this
  // frame's attitude rather than last frame's.
  const pose = localPlayer.view.update(dt);
  camera.position.copy(pose.position);
  camera.quaternion.copy(pose.quaternion);
  // The dashboard readout this used to write into `#ammo` (road speed, gear)
  // is dropped rather than folded into `#hud`: that line is a timed
  // announcement (`showView`, the spawn/flag text) that overwrites itself on
  // a 2.2s timer, and a per-tick dashboard string competing with that timer
  // would either starve the announcements or itself flicker unreadably.
  // `car.control`/`.gear` stay live on `__car` for a headless check that

//

// where a soldier walks in from, with `setEntryRadius` as their reach
// (`extras.seat.entryRadius`, 2.3 m on a Willys) — and the PCO root carries
// `setSoldierExitLocation` for the walk back out. Both are the game's own
// data; the only invention here is the 4 m fallback radius for a mod entry
// point that declares none.

// a hard-coded 1.0s cooldown per player, refreshed on every actual toggle

 * appear as hostile, so there is nothing here for either gate to reject.

/**

 * `setSoldierExitLocation` when it declares one (the Willys puts its driver

function applyDamageToPlayer(damage, attackerPos = null, attackerTeam = null) {
  if (!soldierArmor || soldierDead) return;
  soldierArmor.applyDamage(damage);

  // If in a vehicle or piloting, vehicle damage handles it -- no on-foot grunts or hit arcs
  if (optPilot.checked || localPlayer.occupancy) return;

  const isFriendlyFire = attackerTeam != null && attackerTeam === deployScreen.deployTeamId;
  pageAudio.playSoldierHurtSound(isFriendlyFire);

  let dir = 1;
  if (attackerPos && soldier) {
    const dx = attackerPos.x - soldier.x;
    const dz = attackerPos.z - soldier.z;
    const dist = Math.hypot(dx, dz);
    if (dist > 0.01) {
      const fwdX = Math.sin(soldier.yaw);
      const fwdZ = Math.cos(soldier.yaw);
      const rightX = Math.cos(soldier.yaw);
      const rightZ = -Math.sin(soldier.yaw);
      const forwardDot = (dx / dist) * fwdX + (dz / dist) * fwdZ;
      const rightDot = (dx / dist) * rightX + (dz / dist) * rightZ;
      dir = calculateHitOctant(forwardDot, rightDot);
    }

  pageAudio.triggerHitIndicator(dir, damage / (soldierArmor.maxHitPoints || 100));

 *
 * Nothing draws on a vanilla level, and that is correct rather than broken:

/** The sun's own screen position, and whether anything is in front of it.

 *  DirectionalLight and the sky are aimed by; the sun itself is painted into
 *  the sky box faces, so this is where that painted disc lands. */

  // `show()` places the light at -sunDirection * 400, i.e. the sun is in the
  // direction the light points FROM.
  const dir = new THREE.Vector3(-sd[0] / norm, sd[1] / norm, -sd[2] / norm);
  // Is it in front of the camera? Asked in VIEW space, where -z is forward.
  // Not by projecting a far-off point and testing its ndc z: the sun is
  // effectively at infinity and every level's far plane is short (Berlin's is
  // 105 m), so such a point is always past the far plane and its ndc z always
  // reads > 1 — which is how this first drew nothing at all.
  const view = dir.clone().applyMatrix3(
    new THREE.Matrix3().setFromMatrix4(camera.matrixWorldInverse));
  if (view.z >= 0) return null;
  // Now project a point that is inside the frustum but along the same ray, so
  // the perspective divide gives the direction's own screen position.
  const projected = dir.clone()
    .multiplyScalar(camera.near + (camera.far - camera.near) * 0.5)
    .add(camera.position)

  // `setFlareDistFadeScale` fades against.
  const dist = Math.hypot(x - w / 2, y - h / 2) / (Math.hypot(w, h) / 2);
  return { sunX: x, sunY: y, sunDistance: dist, visible: true };
}

    ...view, width, height,

    // scene. Left at 1 rather than faked — a guessed occlusion would flicker
    // the whole flare on geometry it never actually checked.

    ctx.drawImage(img, -sprite.size / 2, -sprite.size / 2, sprite.size, sprite.size);

  // paints. `combatArea`, `bodyWorld`, `vehicleDamage` and `supplyField`
  // below stay page-side aliases of the world's instances, so every HUD feed,
  // console hook and debug readout that always reached them reaches them
  // still.
  world = new World({
    extras,
    guns,
    groundHeight,
    fireStates,
    onCrash: hullBodies.onCrashDamage,
    isWrecked: owner => {
      const visual = wrecks.damageVisuals.get(owner);
      return !!(visual?.wrecked || visual?.removed);
    },
    // Per tick, with every piece of the tick final: every seat's world
    // position into its occupant's record (a rider senses from his seat, the
    // combat area finds a bare gun's gunner there), then the one snapshot per
    // tick render interpolation needs (the render-interpolation block, beside
    // `footLookPending`).
    onTick: () => {
      vehicles.publishSeatPositions(seatWorldPos);
      capturePresentationTick();
    },
  });
  // A fresh level: none of the old one's nodes or poses survive it.
  rebuildVehicleInterp();
  combatArea = world.combatArea;
  vehicleDamage = world.vehicleDamage;
  // Bot visuals: create the root group now that `scene` exists.
  if (!botBodies.botRoot) {
    botBodies.botRoot = new THREE.Group();
    botBodies.botRoot.name = 'bot-renderers';
    scene.add(botBodies.botRoot);
  }
  // Bots spawn on the player's team. The call waits for `buildCollider`
  // below: `spawnBotsForLevel` builds the nav grid from `world.collider` and
  // `pickSpawn` runs its spawn-safety probes against it, and both are empty
  // before the collider lands — which is what left the grid all `-2` (no
  // terrain) and every bot with no path.
  setupWater(currentRoot, dir);
  pageAudio.setupSounds(extras, dir);
  mapSurfaces.loadMapArt(dir);
  // A map held open across a level switch would be showing the old level.
  mapSurfaces.toggleFullMap(false);
  mapSurfaces.fullmapName.textContent = extras.level || entry.name;
  const cps = (extras.controlPoints || []).length;
  mapSurfaces.fullmapMeta.textContent = cps
    ? `${cps} control point${cps === 1 ? '' : 's'} · ${(extras.soldierSpawns || []).length} spawns`
    : '';
  // After the baked paths and the sky/water shaders have claimed their
  // meshes, everything still on a lit glTF material is the engine's
  // fixed-function path: vehicles and non-lightmapped statics.
  bindDynamicShading(currentRoot);
  bindTextureFade(currentRoot);
  applyLighting();
  if (extras.sunDirection) {
    // The sun light points along -sunLightDirectionVec toward the origin.
    sun.position.set(
      extras.sunDirection[0] * -400,
      extras.sunDirection[1] * 400,
      extras.sunDirection[2] * -400,
    );
  }
  // A ship's landing craft are spawned objects of their own in the engine.
  const craft = detachSpawnedCraft(currentRoot);
  if (craft.length) console.log(`[vehicles] ${craft.length} landing craft split from their ships`);
  indexScene(currentRoot);
  collectTerrain(currentRoot);
  // Leaf sprites face the camera and each tree past its billboardDistance
  // becomes the engine's pre-rendered card (`tree-foliage.js`). After the
  // material passes above, which rebuild materials, and after `indexScene`
  // froze the statics.
  bindTreeFoliage(currentRoot, {
    scene, mapsBase: MAPS_BASE, bust, texLoader,
    maxAnisotropy: renderer.capabilities.getMaxAnisotropy(),
  }).then(r => console.log(`trees: ${r.trees} placed, ${r.sprites} sprite parts, ${r.impostors} billboards`));
  // A fresh extract starts every pole in its authored colours; a capture
  // rewrites cloth UVs in place, so seed the cache the swap reads (the
  // geometry's own baked cell) before anything can take a point.
  currentRoot.traverse(obj => {
    if (obj.userData?.kind === 'flagCloth') {
      const uv = obj.geometry?.getAttribute('uv');
      if (uv && !obj.geometry.userData.flagUvCell) {
        obj.geometry.userData.flagUvCell = flagCapture.unitRectOf(uv);
      }
    }
  });
  // Both tables are small (damage.json 154 KB shared across every level,
  // materials.png a couple of KB) and both are needed before the first shot,
  // not before the first frame.
  [terrainMaterials, damageTables] = await Promise.all([
    loadTerrainMaterials(dir), loadDamageTables(dir), hullBodies.loadCollisionMeshes(dir),
  ]);
  materialFrictionById = buildMaterialFrictionTable(damageTables);
  const collision = buildCollider(currentRoot);
  // After the collider: a body is keyed by the owner id the index handed out.
  hullBodies.setupVehicleBodies();
  // Now that the collider exists, spawn the bots so their nav grid and spawn
  // probes see it.
  spawnBotsForLevel();
  // A new level means a new scene graph (the hulls' instances went with the
  // old one, above), and so are every cached door.
  soldier = null;
  // A new level starts the flag choice over; without this the rebuilt select
  // would keep the old map's index through `buildSpawnFlags`.
  spawnFlagSelect.selectedIndex = -1;
  entryPoints = null;
  nearEntry = null;
  if (optPilot.checked) setPilot(true);
  // Joining is the spawn screen, not an instant teleport — clear a leftover
  // on-foot tick from the previous level so openDeploy owns the join.
  if (optOnFoot.checked) {
    optOnFoot.checked = false;
    setOnFoot(false);
  }
  applyFar();
  if (!skyRoot) await loadSky(entry);
  applyFog();
  placeCamera();
  wireframe(optWire.checked);
  applyVisibility();
  // The fog is up, so the programs this links are the ones the frame wants.
  timing.warmStart = performance.now();
  Promise.resolve(loadEffectLibrary())
    .then(library => warmLevel(library))
    .then(() => {
      timing.warmCompiled = performance.now();
      return textureQueueDrained();
    })
    .finally(() => {
      timing.warmResolved = performance.now();
      settleLevelWarmup(timing);
    });
  const t = extras.terrain || {};
  const o = extras.objects || {};
  // `objects` counts what the glb holds, and the glb holds every mode's
  // vehicles; what is standing in this level is what survived `pruneToMode`.
  const vehiclesHere = spawnersRoot ? spawnersRoot.children.length
                                    : (o.spawners || 0);
  document.getElementById('stats').innerHTML =
    `<strong>${extras.level || entry.name}</strong><br>` +
    `world ${extras.worldSize || '?'} m<br>` +
    `terrain ${t.triangles || 0} tris / ${t.tiles || 0} tiles` +
    (t.defaultTiles ? ` + ${t.defaultTiles} default` : '') +
    (t.detail ? ' + detail' : '') + `<br>` +
    `objects ${o.placed || 0} placed` +
    (vehiclesHere ? ` / ${vehiclesHere} vehicles` : '') +
    (o.lightmaps ? ` / ${o.lightmaps} lightmaps` : '') +
    (o.skipped?.length ? ` / ${o.skipped.length} skipped` : '') + `<br>` +
    `sky ${extras.sky ? extras.sky.mesh + (extras.sky.clouds ? ' + clouds' : '') :
          (extras.skybox ? 'env cubemap' : 'fog colour')} / ` +
    `water ${extras.water ? 'shader' : 'flat'}<br>` +
    // A level exported before the collision flip has a heightfield and a sea
    // and no hulls; saying so beats a silent half-working collider.
    `collision ${collision.statics
      ? `${collision.statics.count} tris` : 'hulls not exported'}` +
    (collision.heightfield
      ? ` / heightfield ${collision.heightfield.dim}^2 @ ${collision.heightfield.spacing} m`
      : ' / no heightfield') +
    (t.materials ? ` / ${Object.keys(t.materials.labels || {}).length} surfaces` : '');

  // The same facts into the console, because that is what a console is for:
  // the retail client fills `io::mainConsole` while it loads, which is why
  // the band in the user's capture is full-height on a session that had only
  // executed two lines. `getLines(20)` returns what the scrollback has, so a
  // console nobody has written to opens as a thin strip — in the game and
  // here alike.
  logToConsole(`level ${extras.level || entry.name} (${activeMod.id || 'bf1942'})`);
  logToConsole(`world ${extras.worldSize || '?'} m, ` +
               `${t.triangles || 0} terrain tris over ${t.tiles || 0} tiles`);
  logToConsole(`${o.placed || 0} objects placed, ${vehiclesHere} vehicle spawners, ` +
               `${o.lightmaps || 0} object lightmaps`);
  // The one line a player who typed a `?mode=` needs and would otherwise only
  // find in a browser console they never open.
  if (modeNote) logToConsole(modeNote);
  if (o.skipped?.length) logToConsole(`${o.skipped.length} objects skipped`);
  logToConsole(collision.statics
    ? `collision ${collision.statics.count} tris` + (collision.heightfield
        ? `, heightfield ${collision.heightfield.dim}^2 @ ${collision.heightfield.spacing} m`
        : ', no heightfield')
    : 'collision hulls not exported');

  // Geometry, collider and bindings are all up; only loose textures may still
  // be streaming, and the game deploys over those too.
  worldReady = true;
  timing.worldReady = performance.now();
  spawning.syncDeployReady();
  // Direct-to-spawn: skip the briefing dialog and land on the deploy screen.
  // A level that declares no soldier spawn has no screen to open, and with
  // the "click to fly" plate gone there would be nothing to tell the player
  // the controls are live — so free roam starts armed instead.
  if (!optPilot.checked && !spawning.openDeploy()) capture();

  // Every texture this level needs has been queued by now, so a queue that is
  // already drained (or was never filled) means the load is done — texReport
  // alone would sit waiting for a callback that is not coming.
  if (tex.total - tex.baseTotal <= tex.loaded - tex.baseLoaded) {
    load.end();
    if (tex.load === load) tex.load = null;
  } else {
    texReport();
  }
}

optGameFog.addEventListener('change', applyFog);
optWire.addEventListener('change', e => wireframe(e.target.checked));
optVehicles.addEventListener('change', applyVisibility);

// A round to play back over the level: `?replay=<recording.ndjson>`, with
// `&serverlog=<ev_*.xml>` to overlay the server's own event log, or a
// recording dropped onto the view. See replay.js.
const replayUrl = params.get('replay');
let replayController = null;
const room = createNetRoom({
  get MODELS_BASE() { return MODELS_BASE; }, get announceCapture() { return flagCapture.announceCapture; },
  get applyVisibility() { return applyVisibility; },
  get bindDynamicShading() { return bindDynamicShading; }, get bust() { return bust; },
  get camera() { return camera; }, get captured() { return captured; },
  get damageVisuals() { return wrecks.damageVisuals; }, get deployActive() { return deployScreen.deployActive; },
  get enterVehicle() { return enterVehicle; }, get exitSeat() { return exitSeat; },
  get extras() { return extras; }, get flags() { return flagCapture.flags; },
  get hoistCaptureFlag() { return flagCapture.hoistCaptureFlag; }, get loader() { return loader; },
  get localPlayer() { return localPlayer; }, get lockHeld() { return lockHeld; },
  get logToConsole() { return logToConsole; }, get manifest() { return manifest; },
  get nearEntry() { return nearEntry; }, get openDeploy() { return spawning.openDeploy; },
  get optOnFoot() { return optOnFoot; }, get optPilot() { return optPilot; },
  get paintDeployChrome() { return deployScreen.paintDeployChrome; }, get params() { return params; },
  get renderer() { return renderer; },
  get roomCapture() { return flagCapture.roomCapture; }, set roomCapture(v) { flagCapture.roomCapture = v; },
  get scene() { return scene; }, get setDeployTeam() { return spawning.setDeployTeam; },
  get soldier() { return soldier; }, get soldierArmor() { return soldierArmor; },
  get soldierDead() { return soldierDead; },
  get syncVehicleSpawnOwnership() { return hullBodies.syncVehicleSpawnOwnership; },
  get templateNameOf() { return wrecks.templateNameOf; }, get updateHud() { return updateHud; },
});

const manifest = await fetch(`${MAPS_BASE}/maps.json${bust()}`)
  .then(r => r.ok ? r.json() : [])
  .catch(() => []);
const select = document.getElementById('maps');
if (!manifest.length) {
  select.hidden = true;
  document.getElementById('stats').textContent =
    'No maps yet. From tools/bf1942-models run: python3 extract_map.py Tobruk';
} else {
  for (const entry of manifest) {
    select.appendChild(new Option(entry.name, entry.name));
  }
  select.addEventListener('change', () => {
    // A room is pinned to the level its server created; switching maps
    // leaves it (P2 — the room's own lobby is the place to pick again).
    room.netTeardownRoom();
    const entry = manifest.find(e => e.name === select.value);
    if (entry) show(entry);
  });
  // A recording names the level it was made on; ?map= still wins.
  const replayLevel = replayUrl ? await recordingLevel(replayUrl).catch(() => '') : '';
  const wanted = (params.get('map') || replayLevel || '').toLowerCase();
  const first = manifest.find(e => e.name.toLowerCase() === wanted) || manifest[0];
  select.value = first.name;
  await show(first);
}

// The Escape menu's own pack, fetched once the level has stopped competing
// for the network: a couple of JSON files and the plates, most of which the
// screen the player came in through has already cached. Escape before this
// lands builds it on the spot instead.
warmups.level.finally(() => { escMenuScreen(); });

replayController = createReplayController({
  scene, camera, loader, bust,
  stage: document.getElementById('stage'),
  modelsBase: MODELS_BASE,
  levelName: () => extras?.level || select.value || '',
  // The level's own parked vehicles would double every recorded one.
  hideBakedVehicles: () => { optVehicles.checked = false; },
  // The engine's vehicle lighting, as the level's own vehicles get it.
  // Not bindTextureFade: that one resets the level's list of fading meshes.
  shadeModel: root => bindDynamicShading(root),
  guns,
  effects,
  fetchHandFireSound: soldierKit.fetchHandFireSound,
  playHandFire: soldierKit.playHandFire,
});
if (replayUrl) {

    .catch(error => console.warn('replay unavailable', error));
}

});

const clock = new THREE.Clock();

function frame(dt) {
  // The human's presentation follows the seat he holds, looked up every frame
  // (a bot taking the wheel of his hull gives it a drive under him).
  if (optPilot.checked) syncLocalSeat();
  updateMobileControls();
  // ---- the input stage (page) ----------------------------------------------
  // The keyboard and the mouse never leave this page. The look stage (the
  // mouse stage's per-frame pump, mouse-input.js) is pumped here once a frame
  // in exactly the two cases the old code pumped it — on foot
  // (`stepSoldierLook(pumpLook(ticks))`) and seated (`stepTurret`'s own pump) —
  // and never for the free camera. The world owns the tick from there: its
  // per-tick law consumes one buffered input per player per tick (world.js,
  // the tick law in its header), which is the engine's own
  // `InputManager::update` 0x0049cff7 boundary.
  const seated = optPilot.checked && localPlayer.occupancy;
  const onFoot = optOnFoot.checked && soldier;
  // The world's one clock answers this frame's tick count; the pump reads it
  // so the look stage and the sim can never drift apart (Fix 5). A frame
  // before any level has built the world owes no ticks.
  const lookTicks = world?.lookTicks(dt) ?? 0;
  let input = null;
  let look = null;
  if (seated) {
    // The pad's deflection must land in the device stage BEFORE the pump
    // turns the counts into an axis, or this frame's pad aim arrives a
    // frame late (the page's original feed-then-pump order).
    feedMobileTurretAim(dt);
    pumpLook(lookTicks);
    const held = captured ? keys : soldierView.EMPTY_KEYS;
    // The engine's PlayerInput, named by action: the same keys, mouse
    // latches and mobile pad this page has always folded. `forwardKeys` and
    // `rudder` are the raw W/S and A/D pairs the aircraft's stick wants —
    // ground vehicles steer and throttle with the pad folded in
    // (`forward`/`strafe`), while the plane's roll and pitch arrive from the
    // pad separately.
    input = {
      forward: clampMobileInput(
        ((held.has('KeyW') ? 1 : 0) - (held.has('KeyS') ? 1 : 0))
        + mobilePadAxis('y')),
      forwardKeys: (held.has('KeyW') ? 1 : 0) - (held.has('KeyS') ? 1 : 0),
      strafe: clampMobileInput(
        ((held.has('KeyD') ? 1 : 0) - (held.has('KeyA') ? 1 : 0))
        + mobilePadAxis('x')),
      rudder: (held.has('KeyD') ? 1 : 0) - (held.has('KeyA') ? 1 : 0),
      fire: held.has('Space') || seatFire,
      altFire: seatAltFire,
      roll: mobilePadHeld ? mobilePadVector.x
        : (held.has('ArrowRight') ? 1 : 0) - (held.has('ArrowLeft') ? 1 : 0),
      pitch: mobilePadHeld ? mobilePadVector.y
        : (held.has('ArrowUp') ? 1 : 0) - (held.has('ArrowDown') ? 1 : 0),
      pad: mobilePadHeld,
    };
    look = { x: mouseInput.x, y: mouseInput.y };
  } else if (onFoot) {
    pumpLook(lookTicks);
    const held = captured ? keys : soldierView.EMPTY_KEYS;
    // Hoisted so footFire can hand the deviation model the same
    // c_PIThrottle / c_PIYaw values the body integrates — the engine's speed
    // gates read the *input*, not the achieved velocity.
    input = {
      forward: clampMobileInput(
        ((held.has('KeyW') || touchFlying ? 1 : 0) - (held.has('KeyS') ? 1 : 0))
        + mobilePadAxis('y')),
      strafe: clampMobileInput(
        ((held.has('KeyD') ? 1 : 0) - (held.has('KeyA') ? 1 : 0))
        + mobilePadAxis('x')),
      walk: held.has('ShiftLeft') || held.has('ShiftRight'),
      crouch: held.has('ControlLeft') || held.has('ControlRight'),
      prone,
      jump: held.has('Space') || mobileJumpHeld,
      // `c_PIMenuSelect9`, input bit 22 -> TemplateMessage 18 ->
      // `BFSoldier::setIsParachuting(true)`. It is the kit's ninth item slot
      // and the engine gives it a second job on a falling soldier; see
      // `parachute.js`. Both the digit row and the numpad, because a bail-out
      // is a two-second window. On a touch device the JUMP button doubles as
      // the ripcord while the state machine says you are falling — a jump is
      // worth nothing in mid-air, and a bail-out is no time to hunt for a
      // control that would otherwise have to be added to the pad.
      deploy: held.has('Digit9') || held.has('Numpad9') || debugDeployHeld
        || (mobileJumpHeld && soldier?.parachuteState === 'falling'),
      dead: soldierDead,
    };
    // A dead body holds still: when `soldierDead` latches (death cam active)
    // zero the steering/jump input so the corpse does not keep walking.
    if (soldierDead) {
      input.forward = input.strafe = 0;
      input.jump = false;
      input.crouch = input.prone = false;
    }
    look = footLookPair();
  }
  world?.setInput(LOCAL_PLAYER, input, look);
  frameInputLast = input;

  // ---- the sim core (world) -------------------------------------------------
  // The whole simulation core of the old frame() in one 30 Hz step: the
  // per-player soldiers and occupied drivetrains (the old onFoot +
  // pilot/drive/manned sim halves), guns.advance, the combat area per player,
  // the vehicle bodies and the damage pass — in the exact order, with
  // nothing presentational inside (world.js, the tick law in its header).
  // `step` is that tick's report; the presentation halves read it back.
  const step = world?.step(dt) ?? { ticks: 0, bodyTicks: 0, alpha: 0, players: {}, damage: [] };
  // Bot AI runs after the world step, so bots read the player's post-step pose.
  referee.tick(dt);
  botBodies.updateBotVisuals(dt);
  hullBodies.syncVehicleSpawnOwnership();
  flagCapture.updateCaptureHud(step.ticks);
  referee.captureTick(step.ticks / 30);
  // The presentation instant this frame draws, and the drawn vehicle pose that
  // follows from it. Before every camera below, because all of them read it —
  // directly (the on-foot eye) or through the scene graph (every seat).
  presentAlpha = step.alpha;
  applyVehicleInterp(presentAlpha);
  // Bail-out triggers for the frame. `parachute.js` names each one by the
  // engine's own sound trigger (`c_SstFallingHigh`, `c_SstOpenParachute`,
  // `c_SstParachuteLand`) and animation state; nothing plays them yet — the
  // samples are not in the published `_shared/sounds` tree — so this keeps
  // them where a check and a future audio stage can both read them.
  if (soldier?.parachuteEvents.length) {
    for (const event of soldier.drainParachuteEvents()) parachuteLog.push(event);
    if (parachuteLog.length > 64) parachuteLog.splice(0, parachuteLog.length - 64);
  }
  if (soldier?.footstepEvents.length) {
    for (const step of soldier.drainFootstepEvents()) pageAudio.handleSoldierFootstep(step);
  }

  // The room's wire, right on the sim core's edge: one input word per tick
  // the world consumed (the engine's one-buffered-input-per-tick law — the
  // same input this page just handed the local sim; an unticked frame sends
  // nothing). A frame longer than 33 ms ran several local ticks against this
  // word (world.js `#consume`), so it owes the server that many: one word a
  // frame would leave the authority's catch-up ticks on its zeroed idle word,
  // which is a held trigger released every frame below 30 fps. Then the
  // renderer draws the server-confirmed remotes after the local world's
  // readbacks.
  if (room.roomJoined && input) {
    // The ledger's tail holds this frame's ticks (capturePresentationTick
    // pushed one triple each); each word is recorded against the pose of the
    // tick it belongs to, so the authority's `ack` lands on the right one.
    const owed = Math.min(step.ticks, Math.floor(room.netTickPoses.length / 3));
    const base = room.netTickPoses.length - owed * 3;
    for (let i = 0; i < step.ticks; i++) {
      const seq = room.roomClient.sendInput(input, look);
      const at = base + i * 3;
      if (seq && i < owed) {
        room.netReconciler?.recordTick(seq, room.netTickPoses[at], room.netTickPoses[at + 1],
          room.netTickPoses[at + 2]);
      }
    }
  }
  // The ledger is per frame: whatever this frame's ticks produced has either
  // been recorded against a seq or belongs to a frame that sent nothing.
  if (room.netTickPoses.length) room.netTickPoses.length = 0;
  if (room.roomJoined && room.roomRenderer) {
    room.roomRenderer.update(dt, room.roomClient, performance.now());
  }

  // The readbacks: the HP-15 gate answer the camera shells and the mobile UI
  // spend, the combat-area frame for the warning group and the `?data` hook,
  // and the on-foot look this tick actually applied, for the deviation
  // model's |MouseLookX/Y| drain (footFire reads the accumulated pair).
  const local = step.players[LOCAL_PLAYER] ?? null;
  vehicleHits.vehicleInput.blocked = local?.gate.blocked ?? false;
  vehicleHits.vehicleInput.rotationalScale = local?.gate.rotationalScale ?? 1;
  combatFrame = local?.combat ?? null;
  if (local?.look) {
    soldierKit.footLookX += Math.abs(local.look.yaw);
    soldierKit.footLookY += Math.abs(local.look.pitch);
  }

  // ---- the cameras and the rest of the presentation -------------------------
  if (seated) {
    // Round 3's first disclosed gap: the occupied vehicle's own drivetrain
    // physics steps every tick it exists, no matter which of its seats is
    // actually active — the world's occupied-vehicle step runs for the whole
    // time the player is mounted, so a nested seat (the Sherman's hull
    // gunner) leaves the hull coasting on its existing momentum rather than
    // freezing it. A bare gun/seat root has no drivetrain either way —
    // `aircraft`/`car` both stay null for one — so neither camera call does
    // anything for it.
    if (localPlayer.aircraft) pilot(dt);
    else if (localPlayer.car) drive(dt);
    else if (!mannedActive()) passenger(dt);
    // Beaching groan: when the ship's keel first touches the seabed, play the
    // collision effect for the seabed's material against the hull's — the
    // same `effects[attGroup][defGroup]` cell `onCrashDamage` reads
    // (`crash-damage.js` `effectNameFor`), attacker = terrain under the keel,
    // victim = the hull's own collision material. Fires regardless of the
    // damage threshold — the real game sounds every ground contact even when
    // the speed is too low to score damage — and bills nothing (W9-A:
    // beaching costs no hit points). Single groan on the beach frame only;
    // the script's layers are one-shots, so a grind loop while sliding would
    // need new machinery — not built here. No `speed`: the picture's `speed`
    // is the emitter clock, and `EngineAudio` has no `Effect::Speed` channel
    // (an `extern` source it never feeds), so the scrape plays at its

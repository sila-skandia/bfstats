<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>BF1942 mesh &middot; maps</title>
<link rel="icon" href="./favicon.ico">
<link rel="stylesheet" href="./tokens.css">
<link rel="stylesheet" href="./shell.css">
<style>
  :root {
    /* Neutral Depth, from tokens.css. The panel stays translucent: it floats
       over the flythrough. */
    --bg: var(--mm-bg);
    --panel: rgba(19, 19, 19, .82);
    --line: var(--mm-rule);
    --text: var(--mm-ink-soft);
    --muted: var(--mm-ink-muted);
    --accent: var(--mm-accent-soft);
    --warn: var(--mm-load-busy);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    grid-template-rows: var(--nav-h) 1fr;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 var(--mm-font-mono);
    overflow: hidden;
  }
  /* The flythrough owns everything below the bar. Positioning it makes the
     canvas and the three overlays resolve against the stage rather than the
     viewport, so nothing has to know the bar's height. */
  #stage {
    position: relative;
    min-height: 0;
    overflow: hidden;
  }
  canvas {
    display: block;
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    touch-action: none;
  }
  #hud, #gate, #side {
    position: absolute;
    pointer-events: none;
  }
  #side {
    pointer-events: auto;
    z-index: 3;
    top: 16px; left: 16px;
    width: 260px;
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 14px;
    backdrop-filter: blur(8px);
  }
  h1 {
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 10px;
  }
  select {
    width: 100%;
    margin: 0 0 12px;
    padding: 6px 8px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--line);
    font: inherit;
  }
  .stat { color: var(--muted); font-size: 12px; }
  .stat strong { color: var(--text); font-weight: 500; }
  label.opt {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-top: 8px;
    color: var(--muted);
    cursor: pointer;
  }
  #hud {
    z-index: 2;
    left: 50%; bottom: 18px;
    transform: translateX(-50%);
    color: var(--muted);
    text-align: center;
    text-shadow: 0 1px 4px #000;
  }
  #gate {
    z-index: 1;
    inset: 0;
    display: grid;
    place-items: center;
    background: transparent;
    color: var(--text);
  }
  #gate[hidden] { display: none; }
  #gate span {
    pointer-events: auto;
    cursor: pointer;
    border: 1px solid var(--accent);
    padding: 10px 16px;
    letter-spacing: .08em;
    text-transform: uppercase;
    font-size: 11px;
    background: var(--panel);
  }
  /* The map art, top right. That corner is free: #side is top left, #hud is
     bottom centre. Sized in one place so the canvas backing store and the
     frame agree. */
  #minimap {
    --mm-size: 188px;
    /* Not covered by the `#hud, #gate, #side` positioning rule above. */
    position: absolute;
    z-index: 3;
    top: 16px; right: 16px;
    width: var(--mm-size);
    background: var(--panel);
    border: 1px solid var(--line);
    backdrop-filter: blur(8px);
  }
  #minimap[hidden] { display: none; }
  #minimap canvas {
    position: static;
    display: block;
    width: 100%;
    /* Square, so the art is not stretched: the border eats a pixel off the
       width and a fixed height would not match it. */
    aspect-ratio: 1;
    /* The art is a top-down render with hard grid lines; smoothing it while
       zoomed in just makes it muddy. */
    image-rendering: pixelated;
  }
  #minimap .mm-cap {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    padding: 5px 8px;
    border-top: 1px solid var(--line);
    font-size: 10px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
  }
  #minimap .mm-cap b { color: var(--accent); font-weight: 500; }
  /* The fullscreen map. Covers the stage, not the viewport — the shared nav
     bar stays reachable. */
  #fullmap {
    position: absolute;
    z-index: 5;
    inset: 0;
    display: grid;
    place-items: center;
    background: rgba(8, 8, 8, .86);
    backdrop-filter: blur(3px);
    pointer-events: auto;
  }
  #fullmap[hidden] { display: none; }
  #fullmap .fm-frame {
    position: relative;
    border: 1px solid var(--line);
    background: var(--panel);
    box-shadow: 0 18px 60px rgba(0, 0, 0, .6);
  }
  #fullmap canvas {
    position: static;
    display: block;
    /* Square art, and the stage is the limit in both axes. */
    width: min(78vh, 78vw);
    height: min(78vh, 78vw);
  }
  #fullmap .fm-cap {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
    padding: 8px 12px;
    border-top: 1px solid var(--line);
    font-size: 11px;
    letter-spacing: .08em;
    color: var(--muted);
  }
  #fullmap .fm-cap b {
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: .14em;
    font-weight: 500;
  }
  #fullmap .fm-legend { display: flex; gap: 14px; align-items: center; }
  #fullmap .fm-key { display: inline-flex; gap: 5px; align-items: center; }
  #fullmap .fm-swatch {
    width: 8px; height: 8px;
    border: 1px solid currentColor;
  }
  #fullmap .fm-swatch.axis { background: #d2564b; color: #e88379; }
  #fullmap .fm-swatch.allied { background: #4f8fd0; color: #86b6e6; }
  a { color: var(--accent); }

  .side-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
  }
  .side-header h1 { margin: 0; }
  .controls-collapse-btn {
    display: none;
    align-items: center;
    gap: 4px;
    padding: 3px 8px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 2px;
    color: var(--muted);
    font: 10px var(--mm-font-mono);
    letter-spacing: .08em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .controls-collapse-btn:hover { color: var(--text); border-color: var(--accent); }

  .map-controls-fab {
    position: absolute;
    bottom: 18px;
    right: 18px;
    z-index: 10;
    display: none;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: var(--text);
    font: 11px var(--mm-font-mono);
    letter-spacing: .06em;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
  }
  .map-controls-fab:hover { border-color: var(--accent); }
  .map-controls-fab[hidden] { display: none !important; }

  .speed-control,
  .map-actions {
    position: absolute;
    bottom: 18px;
    left: 18px;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 8px;
    pointer-events: auto;
  }
  .speed-toggle-btn,
  .map-action-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 6px 12px;
    height: 32px;
    box-sizing: border-box;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: var(--text);
    font: 11px var(--mm-font-mono);
    letter-spacing: .06em;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    transition: background-color .15s ease, border-color .15s ease, color .15s ease;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  .speed-toggle-btn:hover,
  .map-action-btn:hover { border-color: var(--accent); }
  .speed-toggle-btn:active,
  .map-action-btn:active { background: rgba(255, 255, 255, 0.14); }
  .map-action-btn svg { flex-shrink: 0; }
  .action-badge,
  .speed-badge {
    display: inline-block;
    padding: 2px 6px;
    border-radius: 3px;
    font-weight: 600;
    font-size: 10px;
    letter-spacing: .08em;
  }
  [data-speed="fast"] .action-badge,
  [data-speed="fast"] .speed-badge {
    background: var(--accent);
    color: var(--mm-highlight-ink);
  }
  [data-speed="slow"] .action-badge,
  [data-speed="slow"] .speed-badge {
    background: var(--muted);
    color: var(--mm-highlight-ink);
  }
  [data-mode="fly"] .action-badge {
    background: var(--accent);
    color: var(--mm-highlight-ink);
  }
  [data-mode="pan"] .action-badge {
    background: #5dade2;
    color: #0b1520;
  }
  .action-hint,
  .speed-hint {
    color: var(--muted);
    font-size: 10px;
  }

  @media (max-width: 720px) {
    #minimap {
      --mm-size: 110px;
      top: 10px;
      right: 10px;
    }
    #side {
      top: auto;
      bottom: 16px;
      left: 12px;
      right: 12px;
      width: auto;
      max-height: 48vh;
      overflow-y: auto;
      border-radius: 4px;
    }
    #side.side-collapsed {
      display: none;
    }
    .controls-collapse-btn { display: inline-flex; }
    .map-controls-fab { display: inline-flex; }
    #hud {
      bottom: 64px;
      font-size: 11px;
      width: auto;
      max-width: calc(100% - 24px);
      padding: 4px 10px;
      background: rgba(18, 17, 14, 0.82);
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
      pointer-events: none;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }
    .speed-control,
    .map-actions {
      bottom: 18px;
      left: 12px;
      gap: 6px;
    }
    #side:not(.side-collapsed) ~ .map-actions {
      display: none !important;
    }
    .map-controls-fab {
      bottom: 18px;
      right: 12px;
    }
    .speed-toggle-btn,
    .map-action-btn {
      padding: 6px 10px;
      font-size: 10px;
      height: 34px;
    }
    .action-hint,
    .speed-hint {
      display: none;
    }
  }
</style>
</head>
<body>
<nav class="shell-nav">
  <div class="shell-bar">
    <span class="shell-brand"><img class="shell-brand-sigil" src="./bfstats-logo.webp" alt="bfstats.io" width="26" height="26"><b>mesh</b></span>
    <span class="shell-tabs">

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './vendor/loaders/GLTFLoader.js';
import { createLoadOverlay } from './progress.js';
import { selectMod } from './mods.js';
import { Aircraft, VehicleCamera, findVehicle } from './flight.js';
import { loadEngineAudio, findEngineSpec, findWeaponSpecs,
         WEAPON_HEADROOM } from './engine-audio.js';
import { GunFire } from './gunfire.js';
import { buildHeightfield, buildCollisionIndex, WorldCollider } from './collision.js';

// Which game's levels this page serves, and the directory they hang off:
// 'maps' for vanilla, 'maps/mods/eod' for a mod. Resolved before anything is
// fetched, and it draws the nav's mod picker as a side effect.
const activeMod = await selectMod('maps');
const MAPS_BASE = activeMod.paths.maps;

const DEFAULT_DRAW = 700;
const FLY_SPEED = 140;
const FLY_SLOW = 0.02;
const LOOK_SENS = 0.0022;
const FLY_KEYS = new Set([
  'KeyW', 'KeyA', 'KeyS', 'KeyD', 'KeyQ', 'KeyE',
  'ShiftLeft', 'ShiftRight',
]);

// ?shots keeps the drawing buffer so canvas.toDataURL() works for external
// screenshot tooling; off by default because it costs a buffer copy per frame.
const renderer = new THREE.WebGLRenderer({
  antialias: true,
  preserveDrawingBuffer: new URLSearchParams(location.search).has('shots'),
});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
const stage = document.getElementById('stage');
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, 1, 0.5, 8000);
camera.position.set(0, 80, 0);

const hemi = new THREE.HemisphereLight(0xe8dcc0, 0x5a4a32, 1.35);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1d0, 2.4);
scene.add(sun);

const loader = new GLTFLoader();
// Loose textures — lightmap atlases, terrain detail, sky, water — are queued
// after the scene .glb resolves and finish well after it. Their own manager
// turns that tail into a countable second phase of the progress bar instead of
// a stretch where the map is up but still visibly filling in.
const texManager = new THREE.LoadingManager();
const cubeLoader = new THREE.CubeTextureLoader(texManager);
const texLoader = new THREE.TextureLoader(texManager);
// Cache-busting is an iteration aid, not a production behaviour: a 70 MB scene
// re-fetched on every visit and every map switch is by far the slowest thing
// this page can do, and it defeats the Cache-Control nginx already sets. Local
// dev still bypasses the cache so a re-extract shows up without a hard refresh,
// and ?nocache forces it anywhere.
const DEV_ORIGIN = ['localhost', '127.0.0.1', '[::1]', ''].includes(location.hostname);
const NO_CACHE = DEV_ORIGIN || new URLSearchParams(location.search).has('nocache');
const bust = () => (NO_CACHE ? `?t=${Date.now()}` : '');
const lmCache = new Map();

// Hosted on the stage, not the body: .ld-overlay is inset:0 absolute, and
// body is unpositioned, so on the body it would resolve against the viewport
// and paint over the shared nav bar. #stage is the 3D view's positioned box.
const overlay = createLoadOverlay(stage);

const keys = new Set();
const look = { yaw: 0, pitch: -0.15 };
const cull = [];
let spawnersRoot = null;
let captured = false;
let lockHeld = false;
let dragging = false;
let lastPointerX = 0;
let lastPointerY = 0;
let currentRoot = null;
let extras = {};
let skybox = null;
let skyRoot = null;       // the level's SkyBox mesh, reparented to the scene
let cloudMesh = null;
let cloudUniforms = null;
let waterUniforms = null;
let waterAssets = [];     // textures owned by the water/cloud shaders
let simTime = 0;
// Drives everything the level glb animates. One mixer over the level root
// plays every clip it carries: `FlagBlow <name>` per control point, over that
// flag's own joints, which is the animation state `AnimatedFlag` declares —
// and `spin`/`spin.N`, the `setContinousRotationSpeed` parts grouped by period.
let flagMixer = null;

const params = new URLSearchParams(location.search);

const optGameFog = document.getElementById('game-fog');
const optWire = document.getElementById('wire');
const optVehicles = document.getElementById('vehicles');
const optEntire = document.getElementById('entire-map');
const optSound = document.getElementById('sound');
const optSoundVol = document.getElementById('sound-vol');
const optPilot = document.getElementById('pilot');
const hud = document.getElementById('hud');
const isTouchDevice = ('ontouchstart' in window || navigator.maxTouchPoints > 0 || window.matchMedia('(pointer: coarse)').matches || window.innerWidth <= 720);
const HUD_FLY = hud.textContent;
let navMode = 'fly'; // 'fly' or 'pan'
function getTouchHudText() {
  return navMode === 'fly'
    ? 'Hold to fly · Drag to steer · 2-finger pan'
    : 'Drag to pan · Pinch to zoom';
}
function updateHud() {
  if (optPilot.checked) {
    hud.textContent = HUD_PILOT;
  } else if (isTouchDevice) {
    hud.textContent = getTouchHudText();
  } else {
    hud.textContent = HUD_FLY;
  }
}
if (isTouchDevice) hud.textContent = getTouchHudText();

let audioListener = null;
let audioLoader = null;
let ambientAudio = null;
let activeAreaAudios = [];
const audioBufferCache = new Map();
// Bumped by disposeSounds; an async setupSounds captures the value after its
// own dispose and bails if a later dispose/setup has superseded it, so a
// rapid map switch can never leak a loop that dispose can't reach.
let soundsGeneration = 0;

function uiFocused() {
  const t = document.activeElement;
  return t && (t.tagName === 'SELECT' || t.tagName === 'INPUT' || t.tagName === 'TEXTAREA');
}

/**
 * Ground height under a world (x, z).
 *
 * One answer for the camera clamp, the flown aircraft, the view rig and every
 * round in the air (gap C-5): `collision.js` rebuilds the level's own height
 * lattice from the terrain tiles at load, and a bilinear sample off that is
 * both exact — it is the grid the engine collides against — and some three
 * orders cheaper than the raycast this used to be, which mattered the moment
 * a burst of tracers started asking sixty times a second.
 *
 * The raycast stays as the fallback for a level whose lattice would not
 * rebuild (a mod with an irregular terrain export); `collider` is null then.
 */
const groundRay = new THREE.Raycaster();
const DOWN = new THREE.Vector3(0, -1, 0);
const rayOrigin = new THREE.Vector3();
let terrainMeshes = [];
const terrainBBox = new THREE.Box3();
let collider = null;

function groundHeight(x, z) {
  const sea = extras?.waterLevel ?? -Infinity;
  if (collider) {
    const h = collider.surfaceHeight(x, z);
    if (Number.isFinite(h)) return h;
  }
  if (!terrainMeshes.length) return sea;
  rayOrigin.set(x, 2000, z);
  groundRay.set(rayOrigin, DOWN);
  groundRay.far = 4000;
  const hit = groundRay.intersectObjects(terrainMeshes, false)[0];
  return hit ? Math.max(hit.point.y, sea) : sea;
}

function collectTerrain(root) {
  terrainMeshes = [];
  terrainBBox.makeEmpty();
  root.traverse(obj => {
    if (obj.isMesh && kindOf(obj) === 'terrain') {
      terrainMeshes.push(obj);
      if (obj.geometry) {
        if (!obj.geometry.boundingBox) obj.geometry.computeBoundingBox();
        terrainBBox.union(obj.geometry.boundingBox);
      }
    }
  });
}

function getFloorAltitude(x, z) {
  const gh = groundHeight(x, z);
  if (Number.isFinite(gh) && gh > -1000) return gh + 1.5;
  if (Number.isFinite(terrainBBox.min.y) && terrainBBox.min.y > -1000) {
    const base = Number.isFinite(extras?.waterLevel) ? Math.max(terrainBBox.min.y, extras.waterLevel) : terrainBBox.min.y;
    return base + 1.5;
  }
  if (Number.isFinite(extras?.waterLevel)) return extras.waterLevel + 1.5;
  return -50;
}

function clampAltitude() {
  if (optPilot.checked && aircraft) return;
  const floor = getFloorAltitude(camera.position.x, camera.position.z);
  if (camera.position.y < floor) {
    camera.position.y = floor;
  }
}

function panCamera(dx, dy) {
  const gh = groundHeight(camera.position.x, camera.position.z);
  const alt = Number.isFinite(gh) ? Math.max(camera.position.y - gh, 15) : Math.max(camera.position.y, 15);
  const panSpeed = alt * 0.0018 * (isSlow() ? 0.35 : 1.0);

  const cy = Math.cos(look.yaw), sy = Math.sin(look.yaw);
  const cp = Math.cos(look.pitch), sp = Math.sin(look.pitch);

  const rx = -cy, rz = sy;
  const ux = -sy * sp, uy = cp, uz = -cy * sp;

  camera.position.x += (-rx * dx - ux * dy) * panSpeed;
  camera.position.y += (-uy * dy) * panSpeed;
  camera.position.z += (-rz * dx - uz * dy) * panSpeed;

  clampAltitude();
}

function dollyCamera(delta) {
  const d = lookVector();
  const gh = groundHeight(camera.position.x, camera.position.z);
  const alt = Number.isFinite(gh) ? Math.max(camera.position.y - gh, 15) : Math.max(camera.position.y, 15);
  const zoomFactor = alt * 0.003 * (isSlow() ? 0.35 : 1.0);
  const step = delta * zoomFactor;

  camera.position.x += d.x * step;
  camera.position.y += d.y * step;
  camera.position.z += d.z * step;
  clampAltitude();
}

let initialCameraPose = null;

function placeCamera() {
  // ?cam=x,y,z,yaw,pitch pins the camera for reproducible screenshots.
  const pinned = (params.get('cam') || '').split(',').map(Number);
  if (pinned.length === 5 && pinned.every(Number.isFinite)) {
    camera.position.set(pinned[0], pinned[1], pinned[2]);
    look.yaw = pinned[3];
    look.pitch = pinned[4];
    applyLook();
    initialCameraPose = { x: pinned[0], y: pinned[1], z: pinned[2], yaw: pinned[3], pitch: pinned[4] };
    return;
  }
  const cam = extras.camera;
  if (cam) {
    camera.position.set(cam[0], cam[1] + 55, cam[2]);
  } else {
    camera.position.set(0, 80, 0);
  }
  look.yaw = Math.PI;
  look.pitch = -0.22;
  applyLook();
  initialCameraPose = { x: camera.position.x, y: camera.position.y, z: camera.position.z, yaw: look.yaw, pitch: look.pitch };
}

function resetCamera() {
  if (optPilot.checked) {
    optPilot.checked = false;
    setPilot(false);
  }
  if (initialCameraPose) {
    camera.position.set(initialCameraPose.x, initialCameraPose.y, initialCameraPose.z);
    look.yaw = initialCameraPose.yaw;
    look.pitch = initialCameraPose.pitch;
    applyLook();
  } else {
    placeCamera();
  }
}

let speedMode = 'fast'; // 'fast' or 'slow'

function isSlow() {
  return keys.has('ShiftLeft') || keys.has('ShiftRight') || speedMode === 'slow';
}

const speedToggleBtn = document.getElementById('speed-toggle-btn');
function setSpeedMode(mode) {
  speedMode = mode;
  if (speedToggleBtn) {
    speedToggleBtn.dataset.speed = mode;
    const badge = speedToggleBtn.querySelector('.speed-badge');
    const hint = speedToggleBtn.querySelector('.speed-hint');
    if (badge) badge.textContent = mode.toUpperCase();
    if (hint) hint.textContent = mode === 'fast' ? 'Tap for slow' : 'Tap for fast';
  }
}
speedToggleBtn?.addEventListener('click', e => {
  e.stopPropagation();
  setSpeedMode(speedMode === 'fast' ? 'slow' : 'fast');
});

const modeToggleBtn = document.getElementById('mode-toggle-btn');
const resetCamBtn = document.getElementById('reset-cam-btn');
const mapActionsBar = document.getElementById('map-actions');

function setNavMode(mode) {
  navMode = mode;
  if (modeToggleBtn) {
    modeToggleBtn.dataset.mode = mode;
    const badge = modeToggleBtn.querySelector('.mode-badge') || modeToggleBtn.querySelector('.action-badge');
    const hint = modeToggleBtn.querySelector('.mode-hint') || modeToggleBtn.querySelector('.action-hint');
    if (badge) badge.textContent = mode.toUpperCase();
    if (hint) hint.textContent = mode === 'fly' ? 'Tap for pan' : 'Tap for fly';
  }

}

modeToggleBtn?.addEventListener('click', e => {

});

resetCamBtn?.addEventListener('click', e => {
  e.stopPropagation();
  resetCamera();
});

mapActionsBar?.addEventListener('pointerdown', e => {
  e.stopPropagation();
});

function flySpeed() {
  return FLY_SPEED * (isSlow() ? FLY_SLOW : 1);
}

function lookDelta(dx, dy) {
  if (!dx && !dy) return;
  if (optPilot.checked && aircraft) {
    // Not a stick: the arrow keys fly the aircraft. What the mouse does depends
    // on the view — a head inside the cockpit, an orbit outside it, and nothing
    // at all in fly-by, which is a camera standing in the world. `VehicleCamera`
    // owns that distinction and the per-mode clamps that go with it.
    view.turn(-dx * HEAD_SENS, -dy * HEAD_SENS);
    return;
  }
  look.yaw -= dx * LOOK_SENS;
  look.pitch = Math.max(-1.2, Math.min(1.2, look.pitch - dy * LOOK_SENS));
}

addEventListener('keydown', e => {
  if (e.code === 'Escape') {
    // The map is the topmost thing Escape can dismiss.
    if (!fullmapBox.hidden) toggleFullMap(false);
    else release();
    return;
  }
  if (uiFocused()) return;
  // M is the map, which is `c_PIMap` bound to IDKey_M in every one of the
  // game's own control maps. N (`c_PIZoomMap`) is left free for a zoom cycle.
  if (e.code === 'KeyM' && !e.repeat && !e.ctrlKey && !e.metaKey && !e.altKey) {
    toggleFullMap();
    return;
  }
  keys.add(e.code);
  if (e.code === 'KeyR') {
    if (optPilot.checked && aircraft) {
      aircraft.reset();
      stick.roll = 0;
      stick.pitch = 0;
    } else if (!optPilot.checked) {
      resetCamera();
    }
  }
  // C cycles the view, which is `c_PIToggleCameraMode` bound to IDKey_C in every
  // one of the game's own control maps.
  if (e.code === 'KeyC' && !e.repeat && !e.ctrlKey && !e.metaKey
      && optPilot.checked && view) {
    showView(view.cycle());
  }
  if (captured && (FLY_KEYS.has(e.code)
      || (optPilot.checked && AIR_KEYS.has(e.code)))) e.preventDefault();
});
addEventListener('keyup', e => keys.delete(e.code));

const sideEl = document.getElementById('side');
const sideCollapseBtn = document.getElementById('side-collapse-btn');
const mapFabBtn = document.getElementById('map-controls-fab');

function setSideCollapsed(collapsed) {
  sideEl.classList.toggle('side-collapsed', collapsed);
  if (mapFabBtn) mapFabBtn.hidden = !collapsed;
}
sideCollapseBtn?.addEventListener('click', e => {
  e.stopPropagation();
  setSideCollapsed(true);
});
mapFabBtn?.addEventListener('click', e => {
  e.stopPropagation();
  setSideCollapsed(false);
});

const gate = document.getElementById('gate');
function setFly(on) {
  captured = on;
  gate.hidden = on;
  if (on && isTouchDevice && !sideEl.classList.contains('side-collapsed')) {
    setSideCollapsed(true);
  }
  if (!on) {
    dragging = false;
    lockHeld = false;
    if (document.pointerLockElement === renderer.domElement) {
      document.exitPointerLock();
    }
  }
}
function capture() {
  setFly(true);
  ensureAudioContext();
  renderer.domElement.requestPointerLock();
}
function release() {
  setFly(false);
}
gate.querySelector('span').addEventListener('click', e => {
  e.stopPropagation();
  capture();
});
let touchFlying = false;
const activeTouches = new Map();
let touchPinchDist = 0;
let touchMidX = 0;
let touchMidY = 0;
let isPanning = false;

function getTouchesCenterAndDist() {
  const pts = Array.from(activeTouches.values());
  if (pts.length < 2) return null;
  const dx = pts[1].x - pts[0].x;
  const dy = pts[1].y - pts[0].y;
  return {
    midX: (pts[0].x + pts[1].x) / 2,
    midY: (pts[0].y + pts[1].y) / 2,
    dist: Math.hypot(dx, dy)
  };
}

renderer.domElement.addEventListener('pointerdown', e => {
  if (e.pointerType === 'touch') {
    activeTouches.set(e.pointerId, { x: e.clientX, y: e.clientY });
    try { renderer.domElement.setPointerCapture(e.pointerId); } catch {}
    setFly(true);
    ensureAudioContext();

    if (activeTouches.size === 1) {
      lastPointerX = e.clientX;
      lastPointerY = e.clientY;
      dragging = true;
      if (navMode === 'fly') {
        touchFlying = true;
        isPanning = false;
      } else {
        touchFlying = false;
        isPanning = true;
      }
    } else if (activeTouches.size === 2) {
      touchFlying = false;
      isPanning = true;
      const geom = getTouchesCenterAndDist();
      if (geom) {
        touchMidX = geom.midX;
        touchMidY = geom.midY;
        touchPinchDist = geom.dist;
      }
    }
    return;
  }

  // Desktop mouse
  if (e.button === 0) {
    dragging = true;
    isPanning = false;
    lastPointerX = e.clientX;
    lastPointerY = e.clientY;
    try { renderer.domElement.setPointerCapture(e.pointerId); } catch {}
    capture();
  } else if (e.button === 1 || e.button === 2) {
    dragging = true;
    isPanning = true;
    lastPointerX = e.clientX;
    lastPointerY = e.clientY;
    try { renderer.domElement.setPointerCapture(e.pointerId); } catch {}
    setFly(true);
    ensureAudioContext();
  }
});

renderer.domElement.addEventListener('pointerup', e => {
  if (e.pointerType === 'touch') {
    activeTouches.delete(e.pointerId);
    try {
      if (renderer.domElement.hasPointerCapture(e.pointerId)) {
        renderer.domElement.releasePointerCapture(e.pointerId);
      }
    } catch {}

    if (activeTouches.size === 0) {
      touchFlying = false;
      dragging = false;
      isPanning = false;
    } else if (activeTouches.size === 1) {
      const remaining = activeTouches.values().next().value;
      lastPointerX = remaining.x;
      lastPointerY = remaining.y;
      if (navMode === 'fly') {
        touchFlying = true;
        isPanning = false;
      } else {
        touchFlying = false;
        isPanning = true;
      }
    } else {
      const geom = getTouchesCenterAndDist();
      if (geom) {
        touchMidX = geom.midX;
        touchMidY = geom.midY;
        touchPinchDist = geom.dist;
      }
    }
    return;
  }

  dragging = false;
  isPanning = false;
  try {
    if (renderer.domElement.hasPointerCapture(e.pointerId)) {
      renderer.domElement.releasePointerCapture(e.pointerId);
    }
  } catch {}
});

renderer.domElement.addEventListener('pointercancel', e => {
  if (e.pointerType === 'touch') {
    activeTouches.delete(e.pointerId);
  }
  if (activeTouches.size === 0) {
    touchFlying = false;
    dragging = false;
    isPanning = false;
  }
});

renderer.domElement.addEventListener('contextmenu', e => {
  e.preventDefault();
});
document.getElementById('side').addEventListener('pointerdown', e => {
  e.stopPropagation();
});

document.addEventListener('pointerlockchange', () => {
  if (document.pointerLockElement === renderer.domElement) {
    lockHeld = true;
    dragging = false;
    setFly(true);
    return;
  }
  if (lockHeld) {
    lockHeld = false;
    setFly(false);
  }
});
document.addEventListener('pointermove', e => {
  if (!captured) return;
  if (document.pointerLockElement === renderer.domElement) {
    lookDelta(e.movementX, e.movementY);
    return;
  }

  if (e.pointerType === 'touch') {
    if (!activeTouches.has(e.pointerId)) return;
    activeTouches.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (activeTouches.size >= 2) {
      const geom = getTouchesCenterAndDist();
      if (geom) {
        const dMidX = geom.midX - touchMidX;
        const dMidY = geom.midY - touchMidY;
        touchMidX = geom.midX;
        touchMidY = geom.midY;

        panCamera(dMidX, dMidY);

        const dDist = geom.dist - touchPinchDist;
        touchPinchDist = geom.dist;
        if (Math.abs(dDist) > 1) {
          dollyCamera(dDist * 0.7);
        }
      }
      return;
    }

    if (!dragging) return;
    const dx = e.clientX - lastPointerX;
    const dy = e.clientY - lastPointerY;
    lastPointerX = e.clientX;
    lastPointerY = e.clientY;

    if (isPanning) {
      panCamera(dx, dy);
    } else {
      lookDelta(dx, dy);
    }
    return;
  }

  if (!dragging) return;
  const dx = e.clientX - lastPointerX;
  const dy = e.clientY - lastPointerY;
  lastPointerX = e.clientX;
  lastPointerY = e.clientY;

  if (isPanning) {
    panCamera(dx, dy);
  } else {
    lookDelta(dx, dy);
  }
});
document.addEventListener('wheel', e => {
  if (!captured) return;
  e.preventDefault();
  const scale = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 80 : 1;
  camera.position.y -= e.deltaY * scale * 0.12 * (isSlow() ? FLY_SLOW : 1);
  clampAltitude();
}, { passive: false });

function lookVector() {
  const cy = Math.cos(look.yaw), sy = Math.sin(look.yaw);
  const cp = Math.cos(look.pitch), sp = Math.sin(look.pitch);
  return { x: sy * cp, y: sp, z: cy * cp, cy, sy };
}

function applyLook() {
  const d = lookVector();
  camera.lookAt(
    camera.position.x + d.x,
    camera.position.y + d.y,
    camera.position.z + d.z,
  );
}

function fly(dt) {
  if (!captured) return;
  const step = flySpeed() * dt;
  const fwd = (keys.has('KeyW') || touchFlying ? 1 : 0) - (keys.has('KeyS') ? 1 : 0);
  const strafe = (keys.has('KeyD') ? 1 : 0) - (keys.has('KeyA') ? 1 : 0);
  const vert = (keys.has('KeyE') ? 1 : 0) - (keys.has('KeyQ') ? 1 : 0);
  const d = lookVector();
  camera.position.x += (d.x * fwd - d.cy * strafe) * step;
  camera.position.y += (d.y * fwd + vert) * step;
  camera.position.z += (d.z * fwd + d.sy * strafe) * step;
  clampAltitude();
}

function resize() {
  // Stage, not window: the shared nav bar takes a grid row above it.
  const w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

function dispose(root) {
  for (const tex of lmCache.values()) tex.dispose();
  lmCache.clear();
  if (!root) return;
  root.traverse(obj => {
    obj.geometry?.dispose();
    for (const m of [obj.material].flat().filter(Boolean)) {
      m.map?.dispose();
      m.dispose();
    }
  });
  scene.remove(root);
}

// The terrain colour tiles are PRE-LIT: Battlecraft bakes the level's sun,
// ambient and cast shadows into the Tx tile art itself (open any tile - the
// building, trench and treeline shadows are painted into the pixels, all
// falling the same way as sunLightDirectionVec). The engine composes ground
// as tile * detail * 2 plus fog and never relights it, so the viewer's
// analytic hemisphere+sun must not multiply in a second time. On Tobruk that
// double-lighting was a warm ~0.87 display-space factor that hid inside an
// already-warm palette; on Wake the level's near-grey diffuseColor
// (0.4/0.38/0.36) summed with a cool-blue fog hemisphere to a dead-grey 0.56
// in linear - the island rendered visibly darker and desaturated against the
// game's warm sandy tiles. Dark levels stay dark without analytic help
// because the bake carries the level's light level into the tile art.
function unlightTerrain(root) {
  root.traverse(node => {
    if (node.userData?.kind !== 'terrain') return;
    node.traverse(obj => {
      if (!obj.isMesh || !obj.material) return;
      const source = Array.isArray(obj.material) ? obj.material : [obj.material];
      const flat = source.map(m => {
        // Ground is viewed at grazing angles for most of a flythrough, and
        // three's default anisotropy of 1 mip-blurs the tile art into a smear
        // a few metres out - the "low-frequency ground" gap against the game.
        if (m.map) m.map.anisotropy = renderer.capabilities.getMaxAnisotropy();
        const mat = new THREE.MeshBasicMaterial({
          map: m.map || null,
          side: m.side,
        });
        mat.name = m.name;
        return mat;
      });
      obj.material = Array.isArray(obj.material) ? flat : flat[0];
    });
  });
}

// The engine's second terrain stage, `base * detail * 2`.
//
// Baking it into the tile colour map at export caps the grain at that map's
// resolution -- 4 texels/m for a 1024px tile over a 256 m patch, and 2 once
// --max-texture 512 has run -- against the 32 texels/m the engine gets by
// tiling a 512px detail map 16 times across the same patch. Sixteen times the
// spatial frequency is the whole difference between crisp sand underfoot and a
// smear, and it costs one extra texture read.
function bindTerrainDetail(root, dir) {
  const info = extras.terrain || {};
  if (!info.detailTexture) return;
  const repeats = info.detailRepeats || 16;
  const tex = texLoader.load(`${MAPS_BASE}/${dir}/${info.detailTexture}${bust()}`);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  // Same grazing-angle story as the tile art: without anisotropy the detail
  // grain vanishes into the first mip a few metres ahead of the camera.
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  // Raw texels, NOT sRGB-decoded: the engine's modulate-2x runs in 8-bit
  // display space, where the detail map's mid-grey 128 is the identity
  // (`apply_detail` in bf42/terrain.py is the same math at export). Decoding
  // the map to linear first turns that identity into 2*srgb2lin(0.5) = 0.43 -
  // terrain came out ~2.3x too dark with the hue baked toward mud. The
  // combine below round-trips the base tile through sRGB so the multiply
  // happens in the space the engine did it in.
  tex.colorSpace = THREE.NoColorSpace;
  root.traverse(node => {
    if (node.userData?.kind !== 'terrain') return;
    node.traverse(obj => {
      if (!obj.isMesh || !obj.material) return;
      const source = Array.isArray(obj.material) ? obj.material : [obj.material];
      const bound = source.map(m => {
        const mat = m.clone();
        mat.userData = { ...mat.userData };
        const prev = mat.onBeforeCompile;
        mat.onBeforeCompile = (shader, renderer) => {
          if (prev) prev(shader, renderer);
          shader.uniforms.tDetail = { value: tex };
          shader.uniforms.detailRepeats = { value: repeats };
          shader.fragmentShader = shader.fragmentShader
            .replace('void main() {',
              `uniform sampler2D tDetail;
               uniform float detailRepeats;
               vec3 bfToSrgb( vec3 c ) {
                 return mix( pow( c, vec3( 0.41666 ) ) * 1.055 - vec3( 0.055 ),
                     c * 12.92, vec3( lessThanEqual( c, vec3( 0.0031308 ) ) ) );
               }
               vec3 bfFromSrgb( vec3 c ) {
                 return mix( pow( c * ( 1.0 / 1.055 ) + vec3( 0.055 / 1.055 ),
                         vec3( 2.4 ) ),
                     c * ( 1.0 / 12.92 ),
                     vec3( lessThanEqual( c, vec3( 0.04045 ) ) ) );
               }
               void main() {`)
            .replace('#include <map_fragment>',
              `#include <map_fragment>
               diffuseColor.rgb = bfFromSrgb( min( vec3( 1.0 ),
                   2.0 * bfToSrgb( diffuseColor.rgb ) *
                       texture2D( tDetail, vMapUv * detailRepeats ).rgb ) );`);
        };
        mat.needsUpdate = true;
        return mat;
      });
      obj.material = Array.isArray(obj.material) ? bound : bound[0];
    });
  });
}

function lightmapTargets(obj) {
  // A multi-material part arrives from GLTFLoader as a Group whose direct
  // Mesh children are its primitives — the same Group-vs-Mesh trap as
  // setAnimatedTextureSpeed. Child *part* nodes carry their own userData
  // (templateKind, lightmap, kind), synthesized primitive meshes carry none.
  if (obj.isMesh) return [obj];
  return obj.children.filter(
    c => c.isMesh && Object.keys(c.userData || {}).length === 0);
}

// The engine's baked lighting for statics, and the pass with the longest
// string of masked bugs in this viewer. Each hid the next:
//
// 1. It never executed -- gated on `obj.isMesh` while every `userData.lightmap`
//    extra lands on a Group (the multi-material-part trap the README documents
//    for setAnimatedTextureSpeed).
// 2. First execution rendered burnt black shells. Partly the texture tagged
//    sRGB -- a lightmap is a multiplier, not a colour, and decoding it to
//    linear squares the darkening -- but mostly:
// 3. The atlas was sampled upside down. Everything inside the glb arrives via
//    GLTFLoader with flipY=false, the glTF convention. These atlases load
//    through THREE.TextureLoader, whose default is flipY=true, so UV1 indexed
//    the atlas mirrored in V -- hard-edged rectangles across faces that should
//    be uniformly lit, which read as "the UV1 export is wrong" and cost a trip
//    through the stride-40 StandardMesh reader that was blameless all along.
//    Same class of bug as the terrain tile V mirror, one loader further down.
//
// With the atlas the right way up, the bake is self-evidently modulate-2x
// (mid-grey neutral, bright texels overbright sun-facing walls) and it
// *replaces* analytic lighting on statics rather than adding to it -- keep the
// hemisphere and sun on a lightmapped wall and every face is lit twice. So a
// lightmapped mesh gets an unlit base material and the bake does the shading,
// palm shadows on walls included.
function bindLightmaps(root, dir) {
  // The bake is the sun term only. Its dark texels sit near zero, and the
  // engine adds the level's declared ambient on top - drop that term and
  // every shadow-side wall multiplies toward black, while sun-facing walls
  // (bright texels) look right, which is exactly how the omission presents.
  // Tobruk declares ambient 0.12/0.10/0.08 plus globalAmbient 0.2 and
  // shadowColor 0.55; the ambient pair is the floor, inlined per level.
  const lit = extras.lighting || {};
  const amb = lit.ambient || [0.2, 0.2, 0.2];
  const glob = lit.globalAmbient || [0.2, 0.2, 0.2];
  const floor = [0, 1, 2].map(i =>
    Math.min(1, (amb[i] || 0) + (glob[i] || 0)).toFixed(4));
  const floorGlsl = `vec3( ${floor[0]}, ${floor[1]}, ${floor[2]} )`;
  root.traverse(node => {
    const rel = node.userData?.lightmap;
    if (!rel) return;
    const url = `${MAPS_BASE}/${dir}/${rel}${bust()}`;
    let tex = lmCache.get(url);
    if (!tex) {
      tex = texLoader.load(url);
      tex.channel = 1;
      tex.flipY = false;
      tex.colorSpace = THREE.NoColorSpace;
      tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
      lmCache.set(url, tex);
    }
    for (const obj of lightmapTargets(node)) {
      const source = Array.isArray(obj.material) ? obj.material : [obj.material];
      const bound = source.map(m => {
        const mat = new THREE.MeshBasicMaterial({
          map: m.map || null,
          side: m.side,
          alphaTest: m.alphaTest || 0,
          transparent: m.transparent,
        });
        mat.name = m.name;
        mat.lightMap = tex;
        // MeshBasicMaterial's lightmap term is INLINE in its fragment shader
        // (r169 has no <lightmap_fragment> chunk anywhere), so the combine
        // must replace that exact line. The first version of this pass
        // injected its factor after <map_fragment> and "removed" a
        // #include <lightmap_fragment> that does not exist — a silent no-op
        // that left three's own `lm * 1/pi` accumulation in place, so the
        // bake multiplied in twice and shadow-side texels (near zero)
        // squared to black while sun-facing walls survived. Anchor on the
        // built-in line and rewrite it into the engine combine, applied once.
        mat.onBeforeCompile = (shader) => {
          const anchor = 'reflectedLight.indirectDiffuse += '
            + 'lightMapTexel.rgb * lightMapIntensity * RECIPROCAL_PI;';
          if (!shader.fragmentShader.includes(anchor)) {
            console.warn('lightmap combine anchor missing (three.js upgrade?); '
              + 'bake left on the stock path for', mat.name);
            return;
          }
          shader.fragmentShader = shader.fragmentShader.replace(anchor,
            `reflectedLight.indirectDiffuse += mix( vec3( 1.0 ),
                 min( vec3( 2.0 ), ${floorGlsl} + 2.0 * lightMapTexel.rgb ),
                 lightMapIntensity );`);
        };
        mat.needsUpdate = true;
        return mat;
      });
      obj.material = Array.isArray(obj.material) ? bound : bound[0];
    }
  });
}

// The engine's lighting for everything that is neither pre-lit terrain nor a
// lightmapped static: vehicles and bare statics. Verified against the
// decompiled renderer (features/bf1942-engine-reference/, symbols
// StandardMeshSubShader_applyRenderState 0x005bf690 - the vtable slot of
// dice.ref2.rend.SubShaderBuilder.StandardMesh, whose .rdata carries the .rs
// attribute strings - plus RendPCDX8_flushDeferredState 0x00604750 and
// LightDesc_toD3DLIGHT8 0x0045f210 for the light rig): a lit StandardMesh
// draws with texture stage 0 = MODULATE2X(TEXTURE, DIFFUSE) - the same 2x
// headroom as the terrain-detail and lightmap combines - where DIFFUSE is
// D3D fixed-function vertex lighting,
//
//   clamp01( ambientColor + globalAmbientColor + diffuseColor * max(0, N.L) )
//
// with the material colour effectively white (materialDiffuse is `1 1 1` in
// 3202 of 3523 vanilla .rs declarations; no materialAmbient attribute
// exists). Beware FUN_00664560's MODULATE 1x: that is a different, simpler
// renderer path, not the mesh one. Fixed-function lighting ran in 8-bit
// DISPLAY space; the previous hemisphere+sun rig evaluated its combine in
// linear, which reads far darker in the midtones (display 0.63 is linear
// 0.36) and lost the 2x - vehicles sat visibly under-exposed on terrain
// whose bake renders at full display brightness. Same class of fix as the
// detail combine above: round-trip through sRGB and multiply in the space
// the engine used. Not modelled: the optional specular term
// (lightingSpecular, ~1/3 of materials) and the envmap reflection stage.
function bindDynamicShading(root) {
  const lit = extras.lighting || {};
  const amb = lit.ambient || [0.2, 0.2, 0.2];
  const glob = lit.globalAmbient || [0.2, 0.2, 0.2];
  const diff = lit.diffuse || [0.5, 0.5, 0.5];
  // show() aims the DirectionalLight along -sunDirection toward the origin;
  // the same convention makes L (surface toward sun) the negated X/Z.
  const sd = extras.sunDirection || [-0.35, 0.8, 0.45];
  const norm = Math.hypot(sd[0], sd[1], sd[2]) || 1;
  const L = [-sd[0] / norm, sd[1] / norm, -sd[2] / norm];
  const f = n => Number(n).toFixed(4);
  const floorGlsl = `vec3( ${[0, 1, 2].map(i =>
    f(Math.min(1, (amb[i] || 0) + (glob[i] || 0)))).join(', ')} )`;
  const sunGlsl = `vec3( ${diff.map(f).join(', ')} )`;
  const dirGlsl = `vec3( ${L.map(f).join(', ')} )`;
  // Injected constants are baked as literals, and three caches programs by
  // the onBeforeCompile SOURCE - identical closures with different level
  // values would collide across map switches without an explicit key.
  const cacheKey = `bf-dynamic-lit:${floorGlsl}|${sunGlsl}|${dirGlsl}`;
  root.traverse(obj => {
    if (!obj.isMesh || !obj.material) return;
    // A muzzle flash is light, not a surface: the exporter bakes the sprite
    // payloads unlit for exactly that reason, and the mesh payloads carry
    // `extras.additive` instead. Both have to survive this pass — rebuilding
    // them as MeshBasicMaterial here drops the userData the additive mark
    // rides in, and `gunfire.js` would then blend the flash as ordinary alpha
    // over the cockpit rail. Shading them would dim the one thing the shot is
    // showing anyway.
    if (obj.userData?.effect) return;
    const source = Array.isArray(obj.material) ? obj.material : [obj.material];
    if (!source.some(m => m.isMeshStandardMaterial)) return;
    const bound = source.map(m => {
      if (!m.isMeshStandardMaterial) return m;
      const mat = new THREE.MeshBasicMaterial({
        map: m.map || null,
        color: m.color ? m.color.clone() : 0xffffff,
        side: m.side,
        alphaTest: m.alphaTest || 0,
        transparent: m.transparent,
        opacity: m.opacity,
        depthWrite: m.depthWrite,
      });
      mat.name = m.name;
      // The glb's emissive slot carries a 0.45 translucency floor on branch
      // cards (see assemble.py) - a crutch calibrated against the OLD
      // under-lit rig, where pure N.L blackened sun-away fronds. The
      // engine-true combine already floors every surface at
      // 2*(ambient+globalAmbient), and in-game palms keep genuinely dark
      // shadow sides, so the crutch is dropped here rather than folded in -
      // keeping it would pin fronds at >=1.5x their texel on Tobruk.
      mat.customProgramCacheKey = () => cacheKey;
      mat.onBeforeCompile = (shader) => {
        shader.vertexShader = shader.vertexShader
          .replace('void main() {',
            'varying vec3 vBfNormal;\nvoid main() {')
          .replace('#include <begin_vertex>',
            `vBfNormal = mat3( modelMatrix ) * normal;
             #include <begin_vertex>`);
        shader.fragmentShader = shader.fragmentShader
          .replace('void main() {',
            `varying vec3 vBfNormal;
             vec3 bfToSrgb( vec3 c ) {
               return mix( pow( c, vec3( 0.41666 ) ) * 1.055 - vec3( 0.055 ),
                   c * 12.92, vec3( lessThanEqual( c, vec3( 0.0031308 ) ) ) );
             }
             vec3 bfFromSrgb( vec3 c ) {
               return mix( pow( c * ( 1.0 / 1.055 ) + vec3( 0.055 / 1.055 ),
                       vec3( 2.4 ) ),
                   c * ( 1.0 / 12.92 ),
                   vec3( lessThanEqual( c, vec3( 0.04045 ) ) ) );
             }
             void main() {`)
          .replace('#include <map_fragment>',
            `#include <map_fragment>
             vec3 bfN = normalize( vBfNormal );
             if ( !gl_FrontFacing ) bfN = -bfN;
             float bfNdL = max( 0.0, dot( bfN, ${dirGlsl} ) );
             // D3D clamps the vertex diffuse to [0,1] BEFORE the stage's
             // modulate-2x, and saturates again after the multiply.
             vec3 bfLit = 2.0 * min( vec3( 1.0 ),
                 ${floorGlsl} + ${sunGlsl} * bfNdL );
             diffuseColor.rgb = bfFromSrgb( min( vec3( 1.0 ),
                 bfToSrgb( diffuseColor.rgb ) * bfLit ) );`);
      };
      mat.needsUpdate = true;
      return mat;
    });
    obj.material = Array.isArray(obj.material) ? bound : bound[0];
  });
}

function disposeSky() {
  if (skybox) {
    skybox.dispose();
    skybox = null;
  }
  if (skyRoot) {
    skyRoot.traverse(obj => {
      obj.geometry?.dispose();
      for (const m of [obj.material].flat().filter(Boolean)) {
        m.map?.dispose();
        m.dispose();
      }
    });
    scene.remove(skyRoot);
    skyRoot = null;
  }
  if (cloudMesh) {
    cloudMesh.geometry.dispose();
    cloudMesh.material.dispose();
    scene.remove(cloudMesh);
    cloudMesh = null;
    cloudUniforms = null;
  }
  for (const tex of waterAssets) tex.dispose();
  waterAssets = [];
  waterUniforms = null;
}

function srgb(rgb, fallback) {
  const [r, g, b] = rgb || fallback;
  // Level .con colours are display values from a pre-colour-managed engine.
  return new THREE.Color().setRGB(r, g, b, THREE.SRGBColorSpace);
}

// The engine draws the SkyBox mesh camera-centred with no fog and no lighting
// (`lighting false` in every Sky_*.rs). Reparent it out of the level root so
// distance culling never touches it, and swap its lit materials for unlit ones.
function setupSky(root, dir) {
  root.traverse(obj => {
    if (obj.userData?.kind === 'sky') skyRoot = obj;
  });
  if (!skyRoot) return;
  skyRoot.parent.remove(skyRoot);
  scene.add(skyRoot);
  skyRoot.traverse(obj => {
    if (!obj.isMesh) return;
    obj.frustumCulled = false;
    obj.renderOrder = -100;
    const mats = [obj.material].flat().map(m => new THREE.MeshBasicMaterial({
      map: m.map || null,
      color: m.map ? 0xffffff : 0x9db4c0,
      fog: false,
      depthWrite: false,
      side: THREE.DoubleSide,
    }));
    obj.material = Array.isArray(obj.material) ? mats : mats[0];
  });
  setupClouds(dir);
}

// `Sky.addCloud`: one alpha-blended layer scrolling at Cloud.setSpeed,
// repeated Cloud.setTexScale times across the sky span. Drawn camera-locked
// like the sky box, with a radial fade standing in for the engine's
// cloud-distance falloff.
function setupClouds(dir) {
  const clouds = extras.sky?.clouds;
  if (!clouds?.texture) return;
  const tex = texLoader.load(`${MAPS_BASE}/${dir}/${clouds.texture}${bust()}`);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  waterAssets.push(tex);
  cloudUniforms = {
    map: { value: tex },
    uOffset: { value: new THREE.Vector2(0, 0) },
    uSpan: { value: 500 },
    uCam: { value: new THREE.Vector2(0, 0) },
    uFadeStart: { value: 400 },
    uFadeEnd: { value: 900 },
  };
  const material = new THREE.ShaderMaterial({
    uniforms: cloudUniforms,
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide,
    vertexShader: `
      varying vec3 vWorld;
      void main() {
        vec4 w = modelMatrix * vec4(position, 1.0);
        vWorld = w.xyz;
        gl_Position = projectionMatrix * viewMatrix * w;
      }`,
    fragmentShader: `
      uniform sampler2D map;
      uniform vec2 uOffset, uCam;
      uniform float uSpan, uFadeStart, uFadeEnd;
      varying vec3 vWorld;
      void main() {
        vec2 uv = vWorld.xz / uSpan + uOffset;
        vec4 c = texture2D(map, uv);
        float fade = 1.0 - smoothstep(uFadeStart, uFadeEnd, distance(vWorld.xz, uCam));
        gl_FragColor = vec4(c.rgb, c.a * fade);
        #include <colorspace_fragment>
      }`,
  });
  cloudMesh = new THREE.Mesh(
    new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2), material);
  cloudMesh.frustumCulled = false;
  cloudMesh.renderOrder = -99;
  scene.add(cloudMesh);
}

// Everything the engine's PatchTerrain/Water shader does with the level's
// `water.*` block: two scrolling colour layers combined modulate-2x, a
// scrolling normal map feeding a sun specular, and colour/alpha ramps driven
// by real water depth sampled from the exported heightmap-derived depth map.
function setupWater(root, dir) {
  const w = extras.water;
  if (!w) return;
  let waterObj = null;
  root.traverse(obj => {
    if (obj.userData?.kind === 'water' && obj.isMesh) waterObj = obj;
  });
  if (!waterObj) return;
  const load = rel => {
    const tex = texLoader.load(`${MAPS_BASE}/${dir}/${rel}${bust()}`);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    waterAssets.push(tex);
    return tex;
  };
  const texs = w.textures || {};
  const layer1 = texs.layer1 ? load(texs.layer1) : null;
  const layer2 = texs.layer2 ? load(texs.layer2) : null;
  const normal = texs.normal ? load(texs.normal) : null;
  const depth = texs.depth ? load(texs.depth) : null;
  if (layer1) layer1.colorSpace = THREE.SRGBColorSpace;
  if (layer2) layer2.colorSpace = THREE.SRGBColorSpace;
  if (depth) depth.wrapS = depth.wrapT = THREE.ClampToEdgeWrapping;
  // The engine reflects ENVMAP_G_.rcm off the water via the shader-manager
  // envmap parameter; the same six faces feed the fresnel term here.
  let env = null;
  if (extras.envmap?.length === 6) {
    env = cubeLoader.load(extras.envmap.map(f => `${MAPS_BASE}/${dir}/${f}${bust()}`));
    env.colorSpace = THREE.SRGBColorSpace;
    waterAssets.push(env);
  }
  const ld = w.lightDirection || [-0.3, 0.5, 0.65];
  waterUniforms = {
    tLayer1: { value: layer1 },
    tLayer2: { value: layer2 },
    tNormal: { value: normal },
    tDepth: { value: depth },
    tEnv: { value: env },
    uTime: { value: 0 },
    uWorldSize: { value: w.worldSize || extras.worldSize || 2048 },
    uMaxDepth: { value: w.maxDepth || 0 },
    uDir1: { value: new THREE.Vector2(...(w.scrollDir1 || [1, 0])) },
    uDir2: { value: new THREE.Vector2(...(w.scrollDir2 || [0, 1])) },
    uDirN: { value: new THREE.Vector2(...(w.scrollDirNormal || [1, 1])) },
    uScroll1: { value: w.scroll1 || 0 },
    uScroll2: { value: w.scroll2 || 0 },
    uScrollN: { value: w.scrollNormal || 0 },
    uTile1: { value: w.tile1 || 0.5 },
    uTile2: { value: w.tile2 || 0.5 },
    uTileN: { value: w.tileNormal || 1 },
    uShallow: { value: srgb(w.shallowColor, [0.4, 0.5, 0.55]) },
    uDeep: { value: srgb(w.deepColor, [0.3, 0.38, 0.42]) },
    uSpec: { value: srgb(w.specular ? w.specularColor : [0, 0, 0], [0, 0, 0]) },
    uLightDir: { value: new THREE.Vector3(ld[0], ld[1], ld[2]).normalize() },
    uShininess: { value: Math.min(120, Math.max(20, 0.06 / Math.max(w.streakFactor || 0.001, 1e-4))) },
    uShallowAlpha: { value: w.shallowAlpha ?? 0.5 },
    uAlphaDepth: { value: w.alphaDepth || 1.5 },
    uColorDepth: { value: w.colorDepth || 10 },
    fogColor: { value: new THREE.Color(0x808080) },
    fogNear: { value: 400 },
    fogFar: { value: 900 },
  };
  const material = new THREE.ShaderMaterial({
    uniforms: waterUniforms,
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide,
    vertexShader: `
      varying vec3 vWorld;
      void main() {
        vec4 world = modelMatrix * vec4(position, 1.0);
        vWorld = world.xyz;
        gl_Position = projectionMatrix * viewMatrix * world;
      }`,
    fragmentShader: `
      uniform sampler2D tLayer1, tLayer2, tNormal, tDepth;
      uniform samplerCube tEnv;
      uniform float uTime, uWorldSize, uMaxDepth;
      uniform vec2 uDir1, uDir2, uDirN;
      uniform float uScroll1, uScroll2, uScrollN, uTile1, uTile2, uTileN;
      uniform vec3 uShallow, uDeep, uSpec, uLightDir;
      uniform float uShininess, uShallowAlpha, uAlphaDepth, uColorDepth;
      uniform vec3 fogColor;
      uniform float fogNear, fogFar;
      varying vec3 vWorld;
      vec3 bfToSrgb( vec3 c ) {
        return mix( pow( c, vec3( 0.41666 ) ) * 1.055 - vec3( 0.055 ),
            c * 12.92, vec3( lessThanEqual( c, vec3( 0.0031308 ) ) ) );
      }
      vec3 bfFromSrgb( vec3 c ) {
        return mix( pow( c * ( 1.0 / 1.055 ) + vec3( 0.055 / 1.055 ),
                vec3( 2.4 ) ),
            c * ( 1.0 / 12.92 ),
            vec3( lessThanEqual( c, vec3( 0.04045 ) ) ) );
      }
      void main() {
        vec2 wuv = vec2(vWorld.x, -vWorld.z);
        vec3 tex = vec3(1.0);
        #ifdef HAS_LAYERS
        // The engine's fixed-function MODULATE2X runs in 8-bit DISPLAY space,
        // like every other combine in this viewer (terrain detail, lightmaps,
        // dynamic shading). The old l1*l2*4.0 did it in linear, which squares
        // the layers' slight teal tint into the saturated turquoise the game
        // never shows - the water07/08 texels are a near-neutral grey
        // (mean 140/150/153).
        vec3 l1 = bfToSrgb(texture2D(tLayer1, wuv * uTile1 + uDir1 * uScroll1 * uTime).rgb);
        vec3 l2 = bfToSrgb(texture2D(tLayer2, wuv * uTile2 + uDir2 * uScroll2 * uTime).rgb);
        tex = min(vec3(1.0), l1 * l2 * 2.0);
        #endif
        float depth = uMaxDepth;
        #ifdef HAS_DEPTH
        depth = texture2D(tDepth, wuv / uWorldSize).r * uMaxDepth;
        #endif
        vec3 base = mix(uShallow, uDeep, clamp(depth / max(uColorDepth, 0.001), 0.0, 1.0));
        vec3 col = bfFromSrgb(min(vec3(1.0), bfToSrgb(base) * tex));
        vec3 N = vec3(0.0, 1.0, 0.0);
        #ifdef HAS_NORMAL
        // The DX8-era normal map is not 0.5-centred; two offset samples
        // subtracted give a zero-mean, still-animated perturbation.
        vec2 nuv = wuv * uTileN + uDirN * uScrollN * uTime;
        vec2 dn = texture2D(tNormal, nuv).rg
                - texture2D(tNormal, nuv * 1.31 + vec2(0.5)).rg;
        N = normalize(vec3(dn.x * 0.6, 1.0, dn.y * 0.6));
        #endif
        vec3 V = normalize(cameraPosition - vWorld);
        #ifdef HAS_ENV
        vec3 R = reflect(-V, N);
        R.y = abs(R.y);
        // Deliberately blurred (fixed coarse mip): the ENVMAP_G_.rcm faces
        // bake the island and its clouds, and a sharp per-pixel lookup mirrors
        // them as structured smudges marching across the mid-distance - shapes
        // the in-game water never shows. What the reference shots do show is a
        // soft brightness wash toward the horizon, which is exactly what the
        // cubemap's low mip is. LOD 4 of a 128px face is 8px - directional
        // light distribution kept, all structure gone. (A texture bias can't
        // do this: MAX_TEXTURE_LOD_BIAS may clamp as low as 2.) Calibrated
        // against the Wake defgun reference, same spirit as the fresnel
        // shaping below - not a decompiled engine behaviour.
        vec3 sky = textureLod(tEnv, R, 4.0).rgb;
        // A plain Schlick fresnel (exponent 5, scaled to reach 1.0) turned the
        // lagoon into a near-perfect cloud mirror the moment the camera got low
        // and the view raked across open water -- exactly the case a flythrough
        // spends most of its time in, and not what the live-game reference
        // screenshots show even at the shoreline: the water keeps its own
        // shallow/deep tint and a soft sun-glint, not a crisp sky reflection.
        // Steepening the exponent and capping the peak keeps the mirror term a
        // rim highlight at true grazing incidence instead of the dominant term
        // from ten degrees off horizontal outward.
        float fresnel = 0.03 + 0.55 * pow(1.0 - max(dot(N, V), 0.0), 10.0);
        col = mix(col, sky, clamp(fresnel, 0.0, 1.0));
        #endif
        vec3 H = normalize(normalize(uLightDir) + V);
        col += uSpec * pow(max(dot(N, H), 0.0), uShininess);
        float alpha = mix(uShallowAlpha, 0.96, clamp(depth / max(uAlphaDepth, 0.001), 0.0, 1.0));
        #ifdef HAS_ENV
        alpha = max(alpha, clamp(fresnel, 0.0, 1.0));
        #endif
        // LINEAR, not smoothstep: THREE.Fog on the terrain and the engine's
        // DX8 vertex fog are both linear ramps. An S-curve here under-fogs
        // the sea ahead of the midpoint and over-fogs it past it (up to ~9%
        // of the ramp), so the waterline would read differently hazed than
        // the shore it touches at the same distance.
        float fogF = clamp((length(cameraPosition - vWorld) - fogNear)
            / max(fogFar - fogNear, 0.001), 0.0, 1.0);
        col = mix(col, fogColor, fogF);
        gl_FragColor = vec4(col, alpha);
        #include <colorspace_fragment>
      }`,
    defines: {
      ...(layer1 && layer2 ? { HAS_LAYERS: '' } : {}),
      ...(normal ? { HAS_NORMAL: '' } : {}),
      ...(depth ? { HAS_DEPTH: '' } : {}),
      ...(env ? { HAS_ENV: '' } : {}),
    },
  });
  waterObj.material.dispose();
  waterObj.material = material;
}

function syncWaterFog() {
  if (!waterUniforms || !scene.fog) return;
  waterUniforms.fogColor.value.copy(scene.fog.color);
  waterUniforms.fogNear.value = scene.fog.near;
  waterUniforms.fogFar.value = scene.fog.far;
}

// The sky box is 4000 m across but our far plane is much closer, so it is
// drawn scaled down around the camera — with depth writes off and everything
// overdrawing it, only its angular content matters, and that is scale-free.
function updateSky() {
  if (skyRoot) {
    const half = skyRoot.userData.halfExtent || 2000;
    const s = camera.far * 0.95 / (half * 1.7320508);
    skyRoot.scale.setScalar(s);
    // changeOfsSkyHeight lowers the box so the painted horizon sits below
    // eye level - Tobruk (150) shows sand-fade everywhere with the sign the
    // other way, and Wake (0) is indifferent.
    skyRoot.position.set(
      camera.position.x,
      camera.position.y - (extras.sky?.heightOffset || 0) * s,
      camera.position.z,
    );
    if (cloudMesh && cloudUniforms) {
      const clouds = extras.sky?.clouds || {};
      const rise = ((clouds.height ?? 3500) - (clouds.ofsHeight ?? 0)) * s;
      const span = 4 * half * s / (clouds.texScale || 8);
      cloudMesh.scale.set(camera.far * 4, 1, camera.far * 4);
      cloudMesh.position.set(
        camera.position.x, camera.position.y + rise, camera.position.z);
      cloudUniforms.uSpan.value = span;
      cloudUniforms.uCam.value.set(camera.position.x, camera.position.z);
      cloudUniforms.uFadeStart.value = camera.far * 1.2;
      cloudUniforms.uFadeEnd.value = camera.far * 2.4;
    }
  }
}

function advanceSim(dt) {
  simTime += dt;
  if (flagMixer) flagMixer.update(dt);
  if (waterUniforms) waterUniforms.uTime.value = simTime;
  if (cloudUniforms) {
    const speed = extras.sky?.clouds?.speed || [0, 0];
    cloudUniforms.uOffset.value.set(simTime * speed[0], simTime * speed[1]);
  }
}

function ensureListener() {
  if (!audioListener) {
    audioListener = new THREE.AudioListener();
    camera.add(audioListener);
    audioLoader = new THREE.AudioLoader();
  }
  return audioListener;
}

function ensureAudioContext() {
  ensureListener();
  // Autoplay policy: a context created before any click starts suspended and
  // stays that way until a gesture resumes it. Every caller of this is a real
  // user gesture; the catch is for the ones that are not.
  if (audioListener.context && audioListener.context.state === 'suspended') {
    audioListener.context.resume().catch(() => {});
  }
}

/**
 * Decoded wav, cached on the un-busted path.
 *
 * The cache key must not carry `bust()`: with it, the dev origin re-keyed and
 * re-decoded the same wav on every call, and the sequential decode stagger
 * started identical loops 50-200 ms apart — a permanent slapback echo. bust()
 * stays on the fetch URL only. Ambient, area and engine sound all come through
 * here so the one-decode-per-wav rule holds across all three.
 */
async function soundBuffer(dir, relPath) {
  const key = `${dir}/${relPath}`;
  if (audioBufferCache.has(key)) return audioBufferCache.get(key);
  ensureListener();
  try {
    const buf = await audioLoader.loadAsync(`${MAPS_BASE}/${key}${bust()}`);
    audioBufferCache.set(key, buf);
    return buf;
  } catch (e) {
    console.warn(`Could not load sound ${key}:`, e);
    return null;
  }
}

function disposeSounds() {
  soundsGeneration++;
  disposeEngineAudio();
  if (ambientAudio) {
    try {
      if (ambientAudio.isPlaying) ambientAudio.stop();
      ambientAudio.disconnect();
    } catch (_) {}
    ambientAudio = null;
  }
  for (const item of activeAreaAudios) {
    try {
      if (item.sound.isPlaying) item.sound.stop();
      item.sound.disconnect();
      if (item.anchor) scene.remove(item.anchor);
    } catch (_) {}
  }
  activeAreaAudios = [];
}

async function setupSounds(report, dir) {
  disposeSounds();
  const gen = soundsGeneration;
  const cfg = report.sounds;
  if (!cfg) return;

  ensureListener();
  const getBuffer = (relPath) => soundBuffer(dir, relPath);

  // Ambient atmospheric sound
  if (cfg.ambient && cfg.ambient.file) {
    const buf = await getBuffer(cfg.ambient.file);
    if (gen !== soundsGeneration) return;
    if (buf) {
      ambientAudio = new THREE.Audio(audioListener);
      ambientAudio.setBuffer(buf);
      ambientAudio.setLoop(true);
      const master = optSound.checked ? parseFloat(optSoundVol.value) : 0;
      ambientAudio.setVolume((cfg.ambient.volume ?? 0.6) * master);
      try { ambientAudio.play(); } catch (_) {}
    }
  }

  // Shorelines and positional area sounds. One looping voice per unique wave
  // file: several areas sharing Water_waves.wav used to get one loop each, and
  // two loops of the same sample audible at once through separate HRTF panners
  // reads as a hall echo, not louder surf. updateAudio moves the single
  // anchor to the closest point across every polyline in the group.
  // Flags join the area pool as one-point emitters. They group by file like
  // everything else, so every flag on the map shares a single looping voice
  // anchored at whichever one is nearest — which is the same reason the
  // shorelines do it, and the reason five flags do not phase against each
  // other. `flag.ssc` supplies the near/far ramp the group already honours.
  const areaList = [...(cfg.areas || [])];
  const flags = cfg.flags;
  if (flags && flags.file && flags.positions?.length) {
    for (const point of flags.positions) {
      areaList.push({
        name: 'flag',
        file: flags.file,
        points: [point],
        volume: flags.volume ?? 1.0,
        nearDistance: flags.nearDistance ?? flags.minDistance ?? 4.0,
        farDistance: flags.farDistance ?? 15.0,
      });
    }
  }

  if (areaList.length > 0) {
    const groups = new Map();
    for (const area of areaList) {
      if (!area.file || !area.points || area.points.length === 0) continue;
      const key = area.file.toLowerCase();
      if (!groups.has(key)) groups.set(key, { file: area.file, areas: [] });
      groups.get(key).areas.push(area);
    }

    for (const group of groups.values()) {
      const buf = await getBuffer(group.file);
      if (gen !== soundsGeneration) return;
      if (!buf) continue;

      const first = group.areas[0];
      const anchor = new THREE.Object3D();
      anchor.position.set(first.points[0][0], first.points[0][1], first.points[0][2]);
      scene.add(anchor);

      const sound = new THREE.PositionalAudio(audioListener);
      sound.setBuffer(buf);
      sound.setLoop(true);
      sound.setRefDistance(first.nearDistance || 40.0);
      // The manual .ssc near/far ramp in updateAudio owns distance volume
      // exclusively; rolloff 0 disables the panner's own inverse-distance
      // curve so the two attenuations don't multiply. setMaxDistance is not
      // called — it only applies to the 'linear' distance model, so it was
      // inert here anyway. HRTF panning is kept for direction.
      sound.setRolloffFactor(0);
      anchor.add(sound);

      activeAreaAudios.push({ anchor, sound, areas: group.areas });
      try { sound.play(); } catch (_) {}
    }
  }
  updateAudio();
}

// --- engine audio -----------------------------------------------------------
//
// The flown vehicle's own engine, played from the `.ssc` the extractor shipped
// in `scene.json`. `engine-audio.js` owns the graph and the curve evaluation;
// everything here is the seam — which node the voices hang off, what the
// control channels are worth this frame, and the lifecycle rules the ambient
// path already established (nothing starts inside an async gap, nothing
// survives a map change).

let engineAudio = null;
// Bumped by disposeEngineAudio, for the same reason soundsGeneration exists: an
// in-flight load must be able to tell that it has been superseded, or a rapid
// pilot toggle leaks a running engine that dispose can no longer reach.
let engineGeneration = 0;
let engineNode = null;
let currentDir = '';
// `Acceleration` is a control source in its own right — the Corsair's right
// cockpit whine pitches off it — and the flight model publishes velocity, not
// acceleration, so it is differenced here. Raw frame differences are mostly
// numerical noise, hence the one-pole smoothing.
const enginePrevVelocity = new THREE.Vector3();
const engineScratch = new THREE.Vector3();
let engineAccel = 0;
const ACCEL_SMOOTHING = 5;          // 1/s
const engineWorldPos = new THREE.Vector3();
const engineWorldQuat = new THREE.Quaternion();
const weaponWorldPos = new THREE.Vector3();
const weaponWorldQuat = new THREE.Quaternion();
// The longest shut-down one-shot in the vanilla set is willyenginestp at
// 1.94 s; the loops are gone 0.2 s in.
const ENGINE_RELEASE_MS = 2400;

// The guns, from the same `.ssc` machinery as the engine.
//
// `CorsairMG.ssc` is a six-patch weapon script whose first five patches are
// `silence.wav`; the extractor ships only the one that is not, the Fire Loop,
// and its four layers are two pairs that hand over on distance — CAMG1/CAMG2
// up to 4 m, CAMGdist/BFMGdist from 4 m out to 250. So the cockpit hears the
// gun and a chase camera hears the same gun from outside, and neither costs
// this page a decision: the ramps are in the data and `EngineAudio` already
// evaluates them.
//
// The loops run from the moment the patch is built and are muted by gain
// alone, which is the one-voice-per-role rule the hall-echo postmortem left
// behind (`map-sounds.md`). Starting and stopping a buffer source per trigger
// pull would restart its loop phase against the other layer every time and
// comb; holding it and moving the bus cannot. It also means a held Space adds
// no voices at all, which is the thing worth asserting headlessly.
let weaponAudio = [];

function disposeEngineAudio() {
  engineGeneration++;
  if (engineAudio) {
    engineAudio.dispose();
    engineAudio = null;
  }
  for (const weapon of weaponAudio) weapon.audio.dispose();
  weaponAudio = [];
  engineNode = null;
  engineAccel = 0;
  enginePrevVelocity.set(0, 0, 0);
}

async function setupEngineAudio() {
  disposeEngineAudio();
  const gen = engineGeneration;
  if (!aircraft) return;
  const template = aircraft.node.userData?.control || aircraft.node.name;
  const spec = findEngineSpec(extras, template);
  if (!spec) {
    // A stale scene.json, a vehicle with no Engine sound script and an
    // unpublished wav are otherwise indistinguishable — which is exactly the
    // failure that made every map but Wake look silent last time.
    console.info(`no engine sound for ${template}: re-extract this map if it `
                 + 'predates the vehicle-sound pipeline');
    return;
  }
  // The voices hang off the `Engine` node the script is bound to, not the
  // vehicle origin: on a Corsair that is the propeller hub at z -4.15, four
  // metres ahead of the pilot's ear, which is where the noise actually is.
  engineNode = aircraft.node.getObjectByName(spec.engine) || aircraft.node;
  const dir = currentDir;
  const built = await loadEngineAudio(spec, {
    listener: ensureListener(),
    getBuffer: (relPath) => soundBuffer(dir, relPath),
  });
  if (!built) return;
  // Decoding took several awaits; anything could have happened. Nothing has
  // been started yet, so a superseded load is thrown away silently.
  if (gen !== engineGeneration || !aircraft) {
    built.dispose();
    return;
  }
  engineAudio = built;
  engineAudio.setMaster(masterVolume());
  engineAudio.start();
  await setupWeaponAudio(gen, dir, template);
}

/**
 * Build and start every gun patch this vehicle carries.
 *
 * Shares the engine's generation counter rather than keeping its own: the guns
 * are only ever set up and torn down with the vehicle they are bolted to, so a
 * second counter would be two names for one fact.
 */
async function setupWeaponAudio(gen, dir, template) {
  const specs = findWeaponSpecs(extras, template);
  if (!specs.length) return;
  const built = [];
  for (const spec of specs) {
    const audio = await loadEngineAudio(spec, {
      listener: ensureListener(),
      getBuffer: (relPath) => soundBuffer(dir, relPath),
      headroom: WEAPON_HEADROOM,
    });
    if (audio) built.push({ spec, audio, node: null });
  }
  // Decoding took several awaits. Nothing has been started, so a superseded
  // load is dropped without ever having made a sound.
  if (gen !== engineGeneration || !aircraft) {
    for (const weapon of built) weapon.audio.dispose();
    return;
  }
  for (const weapon of built) {
    // The voices belong on the gun, not the vehicle origin: a Corsair's guns
    // are 2.2 m out each wing, and the panner is what puts the rattle there.
    weapon.node = aircraft.node.getObjectByName(weapon.spec.fireArms)
      || aircraft.node;
    weapon.audio.setMaster(0);   // silent until the trigger is pulled
    weapon.audio.start();
  }
  weaponAudio = built;
}

/**
 * Stop the engine the way the script expects: release, then tear down.
 *
 * `trigger Release` layers (the shut-down rattle) only play on release, and
 * every loop carries a `Volume <- TimeRelease` fade, so the graph has to stay
 * alive past the toggle. The generation guard is what stops a re-enable inside
 * the tail from being killed by the pending teardown.
 */
function stopEngineAudio() {
  if (!engineAudio) return;
  engineAudio.release();
  const gen = engineGeneration;
  setTimeout(() => {
    if (gen === engineGeneration) disposeEngineAudio();
  }, ENGINE_RELEASE_MS);
}

function masterVolume() {
  return optSound.checked ? parseFloat(optSoundVol.value) : 0;
}

/** Everything the `.ssc` control sources are worth this frame. */
function engineControl(dt) {
  const state = aircraft?.state;
  if (engineNode) {
    engineNode.getWorldPosition(engineWorldPos);
    engineNode.getWorldQuaternion(engineWorldQuat);
  }
  let speed = 0;
  let diveAngle = 0;
  if (state) {
    speed = state.airspeed || state.velocity.length();
    if (dt > 0) {
      const a = engineScratch.copy(state.velocity).sub(enginePrevVelocity).length() / dt;
      engineAccel += (a - engineAccel) * Math.min(1, dt * ACCEL_SMOOTHING);
      enginePrevVelocity.copy(state.velocity);
    }
    // `Engine::DiveAngle` is fed by the engine object and the vanilla ramps
    // span 0.2..1, so it is read here as the sine of the flight path's descent
    // angle — 1 straight down, 0.2 about 12 degrees nose-down, which is where
    // the dive scream starts to come in. Inferred, not read out of the data.
    if (speed > 1) diveAngle = Math.max(0, -state.velocity.y / speed);
  }
  return {
    dt,
    // The already-spooled engine value, NOT the stick. `c_PIThrottle` reaches
    // full in a second; `state.throttle` chases it at the rate Physics.con
    // declares (maxSpeed.roll 500 over maxRotation.roll 5000, a tenth of the
    // range per second), so the note takes the same ten seconds to come up
    // that the real one does.
    rpm: state ? state.throttle : 0,
    speed,
    acceleration: engineAccel,
    diveAngle,
    position: engineWorldPos,
    quaternion: engineWorldQuat,
    listenerPosition: camera.position,
  };
}

// Sitting in a vehicle, its engine is essentially all you can hear — the map's
// wind and surf do not compete with a radial a metre in front of your knees.
// Ducking the ambience is how to get there: the engine bus is already pinned at
// BUS_HEADROOM because its layers sum well past unity, so raising it would clip
// rather than get louder. Eased rather than switched, or entering and leaving
// the cockpit pops.
const AMBIENT_DUCK = 0.12;
const AMBIENT_DUCK_TAU = 0.4;
let ambientDuck = 1;

function updateAudio(dt = 0) {
  const master = masterVolume();
  const duckTarget = (optPilot.checked && aircraft) ? AMBIENT_DUCK : 1;
  ambientDuck += (duckTarget - ambientDuck)
    * (dt > 0 ? Math.min(1, dt / AMBIENT_DUCK_TAU) : 1);
  if (engineAudio) {
    engineAudio.setMaster(master);
    engineAudio.update(engineControl(dt));
  }
  for (const weapon of weaponAudio) {
    // The trigger comes from the gun runtime rather than the key, so a weapon
    // that has run its magazine dry or is not the seat's gun stays quiet for
    // the same reason it stops drawing tracers.
    const group = aircraftGuns.find(g => g.node.name === weapon.spec.fireArms);
    weapon.audio.setMaster(group?.firing ? master : 0);
    if (weapon.node) {
      weapon.node.getWorldPosition(weaponWorldPos);
      weapon.node.getWorldQuaternion(weaponWorldQuat);
    }
    // No control channel in a weapon patch reads anything but Distance and
    // Default, both of which the module derives itself, so the gun needs none
    // of the engine's rpm/speed/dive plumbing.
    weapon.audio.update({
      dt,
      position: weaponWorldPos,
      quaternion: weaponWorldQuat,
      listenerPosition: camera.position,
    });
  }
  if (ambientAudio) {
    const base = extras.sounds?.ambient?.volume ?? 0.6;
    ambientAudio.setVolume(base * master * ambientDuck);
  }

  if (activeAreaAudios.length === 0) return;

  const camPos = camera.position;
  for (const item of activeAreaAudios) {
    // Closest point to the camera across every polyline in the group; the
    // area that produced it supplies the near/far ramp and base volume.
    let bestArea = item.areas[0];
    let bx = bestArea.points[0][0], by = bestArea.points[0][1], bz = bestArea.points[0][2];
    let minD2 = Infinity;

    for (const area of item.areas) {
      const pts = area.points;
      if (pts.length === 1) {
        const dist2 = (camPos.x - pts[0][0]) ** 2 + (camPos.y - pts[0][1]) ** 2 + (camPos.z - pts[0][2]) ** 2;
        if (dist2 < minD2) {
          minD2 = dist2;
          bx = pts[0][0]; by = pts[0][1]; bz = pts[0][2];
          bestArea = area;
        }
        continue;
      }
      for (let i = 0; i < pts.length - 1; i++) {
        const p1 = pts[i];
        const p2 = pts[i + 1];
        const dx = p2[0] - p1[0];
        const dy = p2[1] - p1[1];
        const dz = p2[2] - p1[2];
        const len2 = dx * dx + dy * dy + dz * dz;
        let t = len2 > 0 ? ((camPos.x - p1[0]) * dx + (camPos.y - p1[1]) * dy + (camPos.z - p1[2]) * dz) / len2 : 0;
        if (t < 0) t = 0;
        else if (t > 1) t = 1;
        const qx = p1[0] + t * dx;
        const qy = p1[1] + t * dy;
        const qz = p1[2] + t * dz;
        const dist2 = (camPos.x - qx) ** 2 + (camPos.y - qy) ** 2 + (camPos.z - qz) ** 2;
        if (dist2 < minD2) {
          minD2 = dist2;
          bx = qx; by = qy; bz = qz;
          bestArea = area;
        }
      }
    }

    item.anchor.position.set(bx, by, bz);

    const dist = Math.sqrt(minD2);
    const near = bestArea.nearDistance || 40.0;
    const far = bestArea.farDistance || 80.0;
    let ramp = 0.0;
    if (dist <= near) {
      ramp = 1.0;
    } else if (dist < far) {
      const denom = Math.max(far - near, 0.001);
      ramp = 1.0 - (dist - near) / denom;
    }
    item.sound.setVolume((bestArea.volume ?? 0.6) * ramp * master * ambientDuck);
  }
}

function applyLighting() {
  const light = extras.lighting;
  if (!light) {
    hemi.color.set(0xe8dcc0);
    hemi.groundColor.set(0x5a4a32);
    hemi.intensity = 1.35;
    sun.color.set(0xfff1d0);
    sun.intensity = 2.4;
    return;
  }
  // renderer.diffuseColor is the sun's tint; keep overall exposure by
  // normalising it and carrying the magnitude into intensity.
  const diffuse = light.diffuse || [0.5, 0.5, 0.5];
  const peak = Math.max(...diffuse, 0.01);
  const tint = diffuse.map(c => c / peak);

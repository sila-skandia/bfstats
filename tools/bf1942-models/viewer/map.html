<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>BF1942 mesh &middot; maps</title>
<link rel="icon" href="./favicon.ico">
<link rel="stylesheet" href="./tokens.css">
<link rel="stylesheet" href="./shell.css">
<style>
  :root {
    /* Neutral Depth, from tokens.css. The panel stays translucent: it floats
       over the flythrough. */
    --bg: var(--mm-bg);
    --panel: rgba(19, 19, 19, .82);
    --line: var(--mm-rule);
    --text: var(--mm-ink-soft);
    --muted: var(--mm-ink-muted);
    --accent: var(--mm-accent-soft);
    --warn: var(--mm-load-busy);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    grid-template-rows: var(--nav-h) 1fr;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 var(--mm-font-mono);
    overflow: hidden;
  }
  /* The flythrough owns everything below the bar. Positioning it makes the
     canvas and the three overlays resolve against the stage rather than the
     viewport, so nothing has to know the bar's height. */
  #stage {
    position: relative;
    min-height: 0;
    overflow: hidden;
  }
  canvas {
    display: block;
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    touch-action: none;
  }
  #hud, #gate, #side {
    position: absolute;
    pointer-events: none;
  }
  #side {
    pointer-events: auto;
    z-index: 3;
    top: 16px; left: 16px;
    width: 260px;
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 14px;
    backdrop-filter: blur(8px);
  }
  h1 {
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 10px;
  }
  select {
    width: 100%;
    margin: 0 0 12px;
    padding: 6px 8px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--line);
    font: inherit;
  }
  .stat { color: var(--muted); font-size: 12px; }
  .stat strong { color: var(--text); font-weight: 500; }
  label.opt {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-top: 8px;
    color: var(--muted);
    cursor: pointer;
  }
  #hud {
    z-index: 2;
    left: 50%; bottom: 18px;
    transform: translateX(-50%);
    color: var(--muted);
    text-align: center;
    text-shadow: 0 1px 4px #000;
  }
  /* On-foot fire control. The crosshair is DOM over the canvas rather than
     painted into it: four bars around a zero-size anchor at screen centre,
     the bar gap driven per frame through --ch-gap by the deviation cone
     mapped through the camera projection (updateCrosshair()). The weapon's
     own crossHairType decides the shape: CHTCrossHair is the full cross,
     CHTIcon keeps only the dot (its authored icon art is not extracted
     yet), CHTNone and a scoped aim draw nothing.

     The look is measured off retail footage, not styled: no crosshair
     texture exists in any archive (the engine draws it), so a 960-wide
     capture of the Thompson on Wake is the reference — bars 2px thick and
     13px long at that width, colour rgb(176,32,16), no centre dot, and the
     arms MEET at centre when the shooter stands still. Sizes are locked in
     px of the reference capture; a hidpi pass can scale them later. */
  #crosshair {
    position: absolute;
    z-index: 2;
    left: 50%; top: 50%;
    width: 0; height: 0;
    pointer-events: none;
    --ch-gap: 0px;
    --ch-ink: rgb(176, 32, 16);
  }
  #crosshair[hidden] { display: none; }
  #crosshair span {
    position: absolute;
    background: var(--ch-ink);
  }
  #crosshair .ch-dot { display: none; width: 2px; height: 2px; left: -1px; top: -1px; }
  #crosshair.ch-icon .ch-dot { display: block; }
  #crosshair .ch-n { width: 2px; height: 13px; left: -1px; bottom: var(--ch-gap); }
  #crosshair .ch-s { width: 2px; height: 13px; left: -1px; top: var(--ch-gap); }
  #crosshair .ch-w { height: 2px; width: 13px; top: -1px; right: var(--ch-gap); }
  #crosshair .ch-e { height: 2px; width: 13px; top: -1px; left: var(--ch-gap); }
  #crosshair.ch-icon .ch-n, #crosshair.ch-icon .ch-s,
  #crosshair.ch-icon .ch-w, #crosshair.ch-icon .ch-e { display: none; }
  /* The in-game HUD proper -- health bar, stance figure, magazine picture,
     vehicle panels -- painted by hud.js from the game's own hud-layout.json
     rects and sprites, not styled here. Sits above the 3D canvas (z-index 0)
     and below the DOM crosshair/hint line (both z-index 2, untouched this
     round); the generic `canvas` rule above already gives it position/inset/
     size, so only the stacking and click-through need overriding. */
  #hud-canvas {
    z-index: 2;
    pointer-events: none;
  }
  #gate {
    z-index: 1;
    inset: 0;
    display: grid;
    place-items: center;
    background: transparent;
    color: var(--text);
  }
  #gate[hidden] { display: none; }
  #gate span {
    pointer-events: auto;
    cursor: pointer;
    border: 1px solid var(--accent);
    padding: 10px 16px;
    letter-spacing: .08em;
    text-transform: uppercase;
    font-size: 11px;
    background: var(--panel);
  }
  /* A lost WebGL context leaves the canvas exactly as it last drew -- there
     is no repaint to hint anything went wrong, so this has to be loud enough
     to read over a frozen frame rather than blend in like #gate does. */
  #gl-lost {
    position: absolute;
    z-index: 8;
    inset: 0;
    display: grid;
    place-items: center;
    background: rgba(10, 8, 6, .72);
  }
  #gl-lost[hidden] { display: none; }
  #gl-lost .gl-lost-card {
    pointer-events: auto;
    max-width: min(420px, calc(100% - 32px));
    border: 1px solid var(--warn);
    padding: 14px 18px;
    background: var(--panel);
    text-align: center;
  }
  #gl-lost .gl-lost-title {
    letter-spacing: .08em;
    text-transform: uppercase;
    font-size: 11px;
    color: var(--warn);
    margin-bottom: 8px;
  }
  #gl-lost .gl-lost-body { color: var(--text); font-size: 12px; line-height: 1.5; }
  #gl-lost button {
    margin-top: 12px;
    cursor: pointer;
    border: 1px solid var(--accent);
    padding: 8px 14px;
    letter-spacing: .08em;
    text-transform: uppercase;
    font-size: 11px;
    background: transparent;
    color: var(--text);
  }
  /* The map art, top right. That corner is free: #side is top left, #hud is
     bottom centre. Sized in one place so the canvas backing store and the
     frame agree. No CSS chrome: the game's own `icon_mapbar_small` bezel is
     drawn into the canvas, over the art, the way the engine composes it. */
  #minimap {
    --mm-size: 188px;
    /* Not covered by the `#hud, #gate, #side` positioning rule above. */
    position: absolute;
    z-index: 3;
    top: 16px; right: 16px;
    width: var(--mm-size);
  }
  #minimap[hidden] { display: none; }
  #minimap canvas {
    position: static;
    display: block;
    width: 100%;
    /* Square, so the art is not stretched. */
    aspect-ratio: 1;
    /* The art is a top-down render with hard grid lines; smoothing it while
       zoomed in just makes it muddy. */
    image-rendering: pixelated;
  }
  /* The fullscreen map. Covers the stage, not the viewport — the shared nav
     bar stays reachable. */
  #fullmap {
    position: absolute;
    z-index: 5;
    inset: 0;
    display: grid;
    place-items: center;
    background: rgba(8, 8, 8, .86);
    backdrop-filter: blur(3px);
    pointer-events: auto;
  }
  #fullmap[hidden] { display: none; }
  #fullmap .fm-frame { position: relative; }
  #fullmap .fm-map-frame {
    border: 1px solid var(--line);
    background: var(--panel);
    box-shadow: 0 18px 60px rgba(0, 0, 0, .6);
  }
  #fullmap canvas {
    position: static;
    display: block;
    /* Square art, and the stage is the limit in both axes. */
    width: min(78vh, 78vw);
    height: min(78vh, 78vw);
  }
  #fullmap .fm-cap {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
    padding: 8px 12px;
    border-top: 1px solid var(--line);
    font-size: 11px;
    letter-spacing: .08em;
    color: var(--muted);
  }
  #fullmap .fm-cap b {
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: .14em;
    font-weight: 500;
  }
  /* The deploy state: the game's own spawn screen, drawn from `menu/InGame`.
     The engine lays the interface out in an 800x600 virtual space and
     stretches it to the screen — a 1280x720 capture shows the kit rows on a
     100 px pitch where the data says 83, which is 720/600 exactly.
     `maps/_shared/hud/spawn-layout.json` is that node graph flattened
     (extract_spawn_layout.py), and #deploy-chrome paints it: panel plates,
     colour-fill quads, class glyphs, button plates and bitmap-font text, in
     the game's paint order and under the game's own show/hide conditions.
     The level map sits in the rectangle the engine reserves for it, and the
     invisible .fm-hit buttons sit where the game's pointer regions are, so
     the harness selectors (.fm-tab, #deploy-resume) keep working. Below a
     4:3 aspect the stage scales uniformly and letterboxes instead. */
  #fullmap .fm-chrome, #fullmap .fm-hit { display: none; }
  #fullmap.deploy {
    place-items: stretch;
    background: #05070b;
    backdrop-filter: none;
    /* Over the flight-speed buttons too: the screen owns the whole stage. */
    z-index: 11;
  }
  #fullmap.deploy .fm-frame {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
  #fullmap.deploy .fm-map-frame {
    position: absolute;
    border: 0;
    background: none;
    box-shadow: none;
  }
  #fullmap.deploy .fm-cap { display: none; }
  /* In deploy the map is the target surface, and the cursor should say so. */
  #fullmap.deploy canvas#fullmap-canvas {
    width: 100%;
    height: 100%;
    cursor: crosshair;
  }
  #fullmap.deploy .fm-chrome {
    display: block;
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  #fullmap.deploy .fm-hit {
    display: block;
    position: absolute;
    margin: 0;
    padding: 0;
    border: 0;
    background: none;
    opacity: 0;
    cursor: pointer;
  }
  #fullmap.deploy .fm-hit:disabled { cursor: default; }
  a { color: var(--accent); }

  .side-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
  }
  .side-header h1 { margin: 0; }
  .controls-collapse-btn {
    display: none;
    align-items: center;
    gap: 4px;
    padding: 3px 8px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 2px;
    color: var(--muted);
    font: 10px var(--mm-font-mono);
    letter-spacing: .08em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .controls-collapse-btn:hover { color: var(--text); border-color: var(--accent); }

  .map-controls-fab {
    position: absolute;
    bottom: 18px;
    right: 18px;
    z-index: 10;
    display: none;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: var(--text);
    font: 11px var(--mm-font-mono);
    letter-spacing: .06em;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
  }
  .map-controls-fab:hover { border-color: var(--accent); }
  .map-controls-fab[hidden] { display: none !important; }

  .speed-control,
  .map-actions {
    position: absolute;
    bottom: 18px;
    left: 18px;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 8px;
    pointer-events: auto;
  }
  .speed-toggle-btn,
  .map-action-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 6px 12px;
    height: 32px;
    box-sizing: border-box;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: var(--text);
    font: 11px var(--mm-font-mono);
    letter-spacing: .06em;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    transition: background-color .15s ease, border-color .15s ease, color .15s ease;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  .speed-toggle-btn:hover,
  .map-action-btn:hover { border-color: var(--accent); }
  .speed-toggle-btn:active,
  .map-action-btn:active { background: rgba(255, 255, 255, 0.14); }
  .map-action-btn svg { flex-shrink: 0; }
  .action-badge,
  .speed-badge {
    display: inline-block;
    padding: 2px 6px;
    border-radius: 3px;
    font-weight: 600;
    font-size: 10px;
    letter-spacing: .08em;
  }
  [data-speed="fast"] .action-badge,
  [data-speed="fast"] .speed-badge {
    background: var(--accent);
    color: var(--mm-highlight-ink);
  }
  [data-speed="slow"] .action-badge,
  [data-speed="slow"] .speed-badge {
    background: var(--muted);
    color: var(--mm-highlight-ink);
  }
  [data-mode="fly"] .action-badge {
    background: var(--accent);
    color: var(--mm-highlight-ink);
  }
  [data-mode="pan"] .action-badge {
    background: #5dade2;
    color: #0b1520;
  }
  .action-hint,
  .speed-hint {
    color: var(--muted);
    font-size: 10px;
  }

  @media (max-width: 720px) {
    #minimap {
      --mm-size: 110px;
      top: 10px;
      right: 10px;
    }
    #side {
      top: auto;
      bottom: 16px;
      left: 12px;
      right: 12px;
      width: auto;
      max-height: 48vh;
      overflow-y: auto;
      border-radius: 4px;
    }
    #side.side-collapsed {
      display: none;
    }
    .controls-collapse-btn { display: inline-flex; }
    .map-controls-fab { display: inline-flex; }
    #hud {
      bottom: 64px;
      font-size: 11px;
      width: auto;
      max-width: calc(100% - 24px);
      padding: 4px 10px;
      background: rgba(18, 17, 14, 0.82);
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
      pointer-events: none;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }
    .speed-control,
    .map-actions {
      bottom: 18px;
      left: 12px;
      gap: 6px;
    }
    #side:not(.side-collapsed) ~ .map-actions {
      display: none !important;
    }
    .map-controls-fab {
      bottom: 18px;
      right: 12px;
    }
    .speed-toggle-btn,
    .map-action-btn {
      padding: 6px 10px;
      font-size: 10px;
      height: 34px;
    }
    .action-hint,
    .speed-hint {
      display: none;
    }
  }
</style>
</head>
<body>
<nav class="shell-nav">
  <div class="shell-bar">
    <span class="shell-brand"><img class="shell-brand-sigil" src="./bfstats-logo.webp" alt="bfstats.io" width="26" height="26"><b>mesh</b></span>
    <span class="shell-tabs">
      <a href="./index.html">Models</a>
      <a href="./map.html" aria-current="page">Maps</a>
      <a href="./poses.html">Poses</a>
      <a href="./kits.html">Kits</a>
    </span>
    <span class="shell-sub">extracted levels &middot; terrain, lightmaps and sky</span>
    <span class="shell-spacer"></span>
    <a class="shell-search" href="./index.html?browse">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m10.5 10.5 3 3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <span>Search name, faction, map&hellip;</span><kbd>/</kbd>
    </a>
  </div>
</nav>
<div id="stage">
  <aside id="side">
    <div class="side-header">
      <h1>Map flythrough</h1>
      <button type="button" class="controls-collapse-btn" id="side-collapse-btn" aria-label="Collapse map controls">Hide</button>
    </div>
    <select id="maps" aria-label="Level"></select>
    <div id="stats" class="stat">extract a level first</div>
    <label class="opt"><input type="checkbox" id="game-fog" checked> fog</label>
    <label class="opt"><input type="checkbox" id="wire"> wireframe</label>
    <label class="opt"><input type="checkbox" id="vehicles" checked> vehicles</label>
    <label class="opt"><input type="checkbox" id="entire-map"> render entire map</label>
    <label class="opt"><input type="checkbox" id="pilot"> pilot the plane</label>
    <label class="opt"><input type="checkbox" id="onfoot"> spawn on foot</label>
    <select id="spawn-flag" aria-label="Spawn point" hidden></select>
    <label class="opt"><input type="checkbox" id="sound" checked> sound</label>
    <label class="opt" style="display:flex;align-items:center;gap:6px;"><input type="range" id="sound-vol" min="0" max="1" step="0.05" value="0.7" style="flex:1;height:4px;accent-color:var(--accent);"> vol</label>
  </aside>
  <button type="button" class="map-controls-fab" id="map-controls-fab" aria-label="Show map controls" hidden>
    <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4h7M13 4h1M2 8h2M8 8h6M2 12h9M15 12h-1M9 2.5v3M4 6.5v3M11 10.5v3"/></svg>
    <span>Maps</span>
  </button>
  <div id="minimap" hidden>
    <canvas id="minimap-canvas" width="376" height="376"></canvas>
  </div>
  <div id="map-actions" class="map-actions speed-control">
    <button type="button" id="speed-toggle-btn" class="map-action-btn speed-toggle-btn" data-speed="fast" aria-label="Toggle flight speed">
      <span class="action-badge speed-badge">FAST</span>
      <span class="action-hint speed-hint">Tap for slow</span>
    </button>
    <button type="button" id="mode-toggle-btn" class="map-action-btn mode-toggle-btn" data-mode="fly" aria-label="Toggle Fly or Pan navigation mode">
      <span class="action-badge mode-badge">FLY</span>
      <span class="action-hint mode-hint">Tap for pan</span>
    </button>
    <button type="button" id="reset-cam-btn" class="map-action-btn reset-cam-btn" aria-label="Reset camera position">
      <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2.5 8a5.5 5.5 0 1 0 1.6-3.9L2 6.5M2 2.5v4h4"/></svg>
      <span>Reset</span>
    </button>
  </div>
  <canvas id="hud-canvas" aria-hidden="true"></canvas>
  <div id="hud">WASD fly &middot; QE or scroll vertical &middot; mouse look &middot; Shift slow &middot; CapsLock spawn &middot; M map &middot; Esc</div>
  <div id="crosshair" hidden><span class="ch-dot"></span><span class="ch-n"></span><span class="ch-s"></span><span class="ch-w"></span><span class="ch-e"></span></div>
  <div id="gate"><span>Tap or click to fly</span></div>
  <div id="gl-lost" hidden>
    <div class="gl-lost-card">
      <div class="gl-lost-title">Graphics context lost</div>
      <div class="gl-lost-body" id="gl-lost-body"></div>
      <button type="button" id="gl-lost-reload">Reload</button>
    </div>
  </div>
  <div id="fullmap" hidden>
    <div class="fm-frame">
      <div class="fm-map-frame">
        <canvas id="fullmap-canvas" width="1024" height="1024"></canvas>
        <div class="fm-cap">
          <b id="fullmap-name">map</b>
          <span id="fullmap-meta"></span>
        </div>
      </div>
      <canvas id="deploy-chrome" class="fm-chrome" aria-hidden="true"></canvas>
      <button type="button" class="fm-hit fm-tab" data-team="1" tabindex="-1" aria-label="Axis"></button>
      <button type="button" class="fm-hit fm-tab" data-team="2" tabindex="-1" aria-label="Allied"></button>
      <button type="button" class="fm-hit fm-kit" data-kit="scout" tabindex="-1" aria-label="Scout"></button>
      <button type="button" class="fm-hit fm-kit" data-kit="assault" tabindex="-1" aria-label="Assault"></button>
      <button type="button" class="fm-hit fm-kit" data-kit="antitank" tabindex="-1" aria-label="Anti-tank"></button>
      <button type="button" class="fm-hit fm-kit" data-kit="medic" tabindex="-1" aria-label="Medic"></button>
      <button type="button" class="fm-hit fm-kit" data-kit="engineer" tabindex="-1" aria-label="Engineer"></button>
      <button type="button" id="deploy-suicide" class="fm-hit" tabindex="-1" aria-label="Suicide"></button>
      <button type="button" id="deploy-score" class="fm-hit" tabindex="-1" aria-label="Score board"></button>
      <button type="button" id="deploy-resume" class="fm-hit" tabindex="-1" aria-label="Resume"></button>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './vendor/loaders/GLTFLoader.js';
import { createLoadOverlay } from './progress.js';
import { selectMod } from './mods.js';
import { Aircraft, VehicleCamera, findVehicle, findVehicles } from './flight.js';
import { GroundVehicle } from './ground.js';
import * as GroundModule from './ground.js';
import {
  VehicleOccupancy, findAllVehicleRoots, listEntryPoints, classifyRoot,
  FireState, chainOnShot, readWorldPose, pickNearest,
} from './seats.js';
import { loadEngineAudio, findEngineSpec, findWeaponSpecs,
         WEAPON_HEADROOM } from './engine-audio.js';
import { GunFire } from './gunfire.js';
import { EffectLibrary, EffectPlayer } from './effects.js';
import { buildHeightfield, buildCollisionIndex, WorldCollider } from './collision.js';
import { Soldier, spawnFlags, pickSpawn, spawnYaw,
         FOV_DEG as FOOT_FOV, JUMP_SPEED, GRAVITY } from './soldier.js';

//
// `?aa=0` and `?dpr=<ratio>` put the renderer settings on the bench's matrix
// (features/mesh-viewer-performance, renderer settings). MSAA is a context
// attribute (`antialias`, handed to `getContext` in three's constructor), so
// it can only be picked here, before the context exists. `dpr` replaces the

// A lost context leaves the canvas showing whatever it last drew -- there is
// no repaint to hint that anything is wrong, so without this the page just
// goes quietly stale. Measured cause on this machine: a GPU-side stall
// during a firing burst at DPR 2 (features/mesh-viewer-performance/README.md,
// the Iris Xe log) took 8-9.5 s on one frame and the browser gave up on the
// context rather than waiting it out. `renderer`'s own `onContextLost`
// (`vendor/three.module.js`) already calls `preventDefault()` -- that is
// what tells Chromium a restore is worth attempting, and `restored` would
// fire without this listener too -- the call here is redundant, not load-
// bearing, kept only because a second listener calling it is harmless and
// this one should not depend on three's internals staying that way. What
// this listener actually adds is the visible message: nothing here tries
// to rebuild the scene on restore -- every texture and compiled program the
// renderer held is gone, and re-uploading all of it is out of scope for "no
// silent black canvas" -- so restore just offers a reload instead of
// pretending play can continue.
const glLostEl = document.getElementById('gl-lost');
const glLostBody = document.getElementById('gl-lost-body');
document.getElementById('gl-lost-reload')?.addEventListener('click', () => location.reload());
renderer.domElement.addEventListener('webglcontextlost', e => {
  e.preventDefault();
  release();
  glLostBody.textContent = 'The GPU dropped the WebGL context mid-frame. Waiting to see whether the browser restores it...';
  glLostEl.hidden = false;
}, false);
renderer.domElement.addEventListener('webglcontextrestored', () => {
  glLostBody.textContent = 'The context came back, but nothing it was holding did -- reload to keep playing.';
}, false);

/**
 * Ground height under a world (x, z).
 *
 * One answer for the camera clamp, the flown aircraft, the view rig and every
 * round in the air (gap C-5): `collision.js` rebuilds the level's own height
 * lattice from the terrain tiles at load, and a bilinear sample off that is
 * both exact — it is the grid the engine collides against — and some three
 * orders cheaper than the raycast this used to be, which mattered the moment
 * a burst of tracers started asking sixty times a second.
 *
 * The raycast stays as the fallback for a level whose lattice would not
 * rebuild (a mod with an irregular terrain export); `collider` is null then.
 */
const groundRay = new THREE.Raycaster();
const DOWN = new THREE.Vector3(0, -1, 0);
const rayOrigin = new THREE.Vector3();
let terrainMeshes = [];
const terrainBBox = new THREE.Box3();
let collider = null;

function groundHeight(x, z) {
  const sea = extras?.waterLevel ?? -Infinity;
  if (collider) {
    const h = collider.surfaceHeight(x, z);
    if (Number.isFinite(h)) return h;
  }
  if (!terrainMeshes.length) return sea;
  rayOrigin.set(x, 2000, z);
  groundRay.set(rayOrigin, DOWN);
  groundRay.far = 4000;
  const hit = groundRay.intersectObjects(terrainMeshes, false)[0];
  return hit ? Math.max(hit.point.y, sea) : sea;
}

function collectTerrain(root) {
  terrainMeshes = [];
  terrainBBox.makeEmpty();
  root.traverse(obj => {
    if (obj.isMesh && kindOf(obj) === 'terrain') {
      terrainMeshes.push(obj);
      if (obj.geometry) {
        if (!obj.geometry.boundingBox) obj.geometry.computeBoundingBox();
        terrainBBox.union(obj.geometry.boundingBox);
      }
    }
  });
}

function getFloorAltitude(x, z) {
  const gh = groundHeight(x, z);
  if (Number.isFinite(gh) && gh > -1000) return gh + 1.5;
  if (Number.isFinite(terrainBBox.min.y) && terrainBBox.min.y > -1000) {
    const base = Number.isFinite(extras?.waterLevel) ? Math.max(terrainBBox.min.y, extras.waterLevel) : terrainBBox.min.y;
    return base + 1.5;
  }
  if (Number.isFinite(extras?.waterLevel)) return extras.waterLevel + 1.5;
  return -50;
}

function clampAltitude() {
  if (optPilot.checked && (aircraft || car)) return;
  const floor = getFloorAltitude(camera.position.x, camera.position.z);
  if (camera.position.y < floor) {
    camera.position.y = floor;
  }
}

function panCamera(dx, dy) {
  // A body owns the camera while it is on foot; pan and dolly would fight it
  // for one frame and then lose to the next tick anyway.
  if (optOnFoot.checked) return;
  const gh = groundHeight(camera.position.x, camera.position.z);
  const alt = Number.isFinite(gh) ? Math.max(camera.position.y - gh, 15) : Math.max(camera.position.y, 15);
  const panSpeed = alt * 0.0018 * (isSlow() ? 0.35 : 1.0);

  const cy = Math.cos(look.yaw), sy = Math.sin(look.yaw);
  const cp = Math.cos(look.pitch), sp = Math.sin(look.pitch);

  const rx = -cy, rz = sy;
  const ux = -sy * sp, uy = cp, uz = -cy * sp;

  camera.position.x += (-rx * dx - ux * dy) * panSpeed;
  camera.position.y += (-uy * dy) * panSpeed;
  camera.position.z += (-rz * dx - uz * dy) * panSpeed;

  clampAltitude();
}

function dollyCamera(delta) {
  if (optOnFoot.checked) return;
  const d = lookVector();
  const gh = groundHeight(camera.position.x, camera.position.z);
  const alt = Number.isFinite(gh) ? Math.max(camera.position.y - gh, 15) : Math.max(camera.position.y, 15);
  const zoomFactor = alt * 0.003 * (isSlow() ? 0.35 : 1.0);
  const step = delta * zoomFactor;

  camera.position.x += d.x * step;
  camera.position.y += d.y * step;
  camera.position.z += d.z * step;
  clampAltitude();
}

let initialCameraPose = null;

function placeCamera() {
  // ?cam=x,y,z,yaw,pitch pins the camera for reproducible screenshots.
  const pinned = (params.get('cam') || '').split(',').map(Number);
  if (pinned.length === 5 && pinned.every(Number.isFinite)) {
    camera.position.set(pinned[0], pinned[1], pinned[2]);
    look.yaw = pinned[3];
    look.pitch = pinned[4];
    applyLook();
    initialCameraPose = { x: pinned[0], y: pinned[1], z: pinned[2], yaw: pinned[3], pitch: pinned[4] };
    return;
  }
  const cam = extras.camera;
  if (cam) {
    camera.position.set(cam[0], cam[1] + 55, cam[2]);
  } else {
    camera.position.set(0, 80, 0);
  }
  look.yaw = Math.PI;
  look.pitch = -0.22;
  applyLook();
  initialCameraPose = { x: camera.position.x, y: camera.position.y, z: camera.position.z, yaw: look.yaw, pitch: look.pitch };
}

function resetCamera() {
  if (optPilot.checked) {
    optPilot.checked = false;
    setPilot(false);
  }
  // On foot R respawns rather than resetting the camera — the keydown handler
  // routes it to `spawnAtFlag` before it ever reaches here — but a reset that
  // arrives from the on-screen button must not kick the player out of the mode
  // or move a camera the body owns.
  if (optOnFoot.checked && soldier) {
    spawnAtFlag(true);
    return;
  }
  if (initialCameraPose) {
    camera.position.set(initialCameraPose.x, initialCameraPose.y, initialCameraPose.z);
    look.yaw = initialCameraPose.yaw;
    look.pitch = initialCameraPose.pitch;
    applyLook();
  } else {
    placeCamera();
  }
}

function lookDelta(dx, dy) {
  if (!dx && !dy) return;
  // P2's one necessary touch outside its owned-function list (see its final
  // report): a bare gun/seat root has no `view` (`VehicleCamera`) to turn at
  // all, and a nested seat of a vehicle that does (the Sherman's hull gunner)
  // must not steal the *driver's* `view.turn` while manned — neither case
  // existed before manned guns did, and both need to reach `occupancy.turret`
  // before the plain aircraft/car branch below ever runs, or a manned-only
  // seat's mouse motion falls through into the on-foot soldier-look branch
  // instead (the soldier is merely suspended, not unmounted, while seated).
  // A turret takes the mouse from whichever seat owns it, driving seat
  // included. `mannedActive()` alone was enough while only gunners had one;
  // a tank's driver aims his own main gun in this engine (`ShermanTower` /
  // `ShermanGunBase` are declared under the Sherman's own control), so the
  // test is now "is there a turret" rather than "is this a gunner". A
  // drivetrain seat with no turret — a jeep, an aircraft — still falls
  // through to `view.turn` below and swings the camera as it always did.
  if (optPilot.checked && occupancy?.turret) {
    // Unnegated, unlike the soldier's own `look()` below: `TurretRig.aim`
    // takes the browser's screen sense directly — see its own comment for the
    // double flip that used to invert every manned gun in the viewer.
    occupancy.turret.aim(dx, dy);
    return;
  }
  if (optPilot.checked && mannedActive()) {
    // A manned seat with no aim rig at all: a passenger position. Nothing to
    // turn, and falling through would hand the mouse to the driver's camera.
    return;
  }
  if (optPilot.checked && (aircraft || car)) {
    // Not a stick: the arrow keys fly the aircraft and A/D steer the car. What
    // the mouse does depends on the view — a head inside the cockpit, an orbit
    // outside it, and nothing at all in fly-by, which is a camera standing in
    // the world. `VehicleCamera` owns that distinction and the per-mode clamps
    // that go with it.
    view.turn(-dx * HEAD_SENS, -dy * HEAD_SENS);
    return;
  }
  if (optOnFoot.checked && soldier) {
    // While zoomed the engine scales the mouse-look deltas by the same
    // `SoldierZoomFov` factor that narrows the view — client 0x0050095f:
    // `if (weapon->isZoomed()) { yawDelta *= SoldierZoomFov; pitchDelta *=
    // SoldierZoomFov; }` — so a 0.6x view is a 0.6x hand.
    if (isZoomed()) {
      const factor = handWeapon?.data?.zoom?.soldierFov ?? 1;
      dx *= factor;
      dy *= factor;
    }
    // The soldier owns the look: `setPointUpDownAngle 38.0 38.0` clamps the
    // pitch, and the body yaws bodily because `SoldierCamera` declares no
    // rotation of its own.
    soldier.look(-dx * LOOK_SENS, -dy * LOOK_SENS);
    // The deviation model wants MouseLookX/Y, the engine's per-axis look
    // inputs. Accumulated here, where the player's own turning arrives, and
    // drained per frame in footFire() — recoil writes `soldier.look`
    // directly and so never counts against him.
    footLookX += Math.abs(dx * LOOK_SENS);
    footLookY += Math.abs(dy * LOOK_SENS);
    return;
  }
  look.yaw -= dx * LOOK_SENS;
  look.pitch = Math.max(-1.2, Math.min(1.2, look.pitch - dy * LOOK_SENS));
}

addEventListener('keydown', e => {
  if (e.code === 'Escape') {
    // The map is the topmost thing Escape can dismiss. In its deploy state
    // it is dismissed with intent: a redeploy resumes the life in progress,
    // an abandoned join falls back to fly. Under `?kblock` Escape is a locked
    // key and reaches the page in fullscreen too: the first press releases
    // the pointer as ever, a fresh press at the gate leaves the fullscreen.
    if (deployActive()) cancelDeploy();
    else if (!fullmapBox.hidden) toggleFullMap(false);
    else if (kbSession && !captured && !e.repeat) kbLockLeave();
    else release();
    return;
  }
  // Caps Lock toggles the spawn menu even while a sidebar control is focused,
  // matching Escape's privilege over form focus.
  if (e.code === 'CapsLock' && !e.repeat) {
    if (deployActive()) cancelDeploy();
    else if (!optPilot.checked) openDeploy();
    return;
  }
  // Deploy owns Enter and 1-9 even when a sidebar INPUT/SELECT is focused:
  // otherwise Enter toggles `#onfoot` or activates RESUME and the commit
  // either never runs or is immediately undone into fly-through.
  if (deployActive()) {
    if (e.code === 'Enter' && !e.repeat) {
      e.preventDefault();
      e.stopPropagation();
      deploySpawn();
      return;
    }
    const digit = /^Digit([1-9])$/.exec(e.code);
    if (digit) {
      e.preventDefault();
      selectDeployFlag(Number(digit[1]) - 1);
      return;
    }
  }
  if (uiFocused()) return;
  // Caps Lock is also handled above; M is `c_PIMap` in the game's own maps.
  // On foot the map opens in its deploy state — the game's own map is also
  // its spawn screen — and Escape or M again puts it away without moving you.
  if (e.code === 'KeyM' && !e.repeat && !e.ctrlKey && !e.metaKey && !e.altKey) {
    if (deployActive()) cancelDeploy();
    else if (fullmapBox.hidden && optOnFoot.checked && soldier
             && !optPilot.checked) {
      // On foot, but not merely suspended in a seat: a driver's M is the
      // plain map, because his soldier is still ticked and still alive.
      openDeploy();
    } else toggleFullMap();
    return;
  }
  // Seated in anything, the same row switches seats instead (SEAT-23/24,
  // verify-r5.md's `c_PIMenuSelect1..9`) — checked after the deploy screen's
  // own use of these keys above, since the two are never active together.
  if (optPilot.checked && occupancy && !e.repeat
      && !e.ctrlKey && !e.metaKey && !e.altKey) {
    const seatDigit = /^Digit([1-9])$/.exec(e.code);
    if (seatDigit) {
      switchSeat(Number(seatDigit[1]) - 1);
      return;
    }
  }
  keys.add(e.code);
  if (e.code === 'KeyR') {
    // The seat is checked before the soldier: a driver who walked in on foot
    // still has his rifle slung, and R must reset the vehicle he is actually
    // holding the wheel of, not work the bolt.
    if (optPilot.checked && (aircraft || car)) {
      (aircraft || car).reset();
      stick.roll = 0;
      stick.pitch = 0;
    } else if (optOnFoot.checked && soldier) {
      // R is the reload once there is a magazine to reload — the game's own
      // binding — and stays the respawn only for a soldier holding nothing
      // (a weapon glb that failed to load). Shift+R is the deliberate road
      // back: it reopens the deploy screen rather than guessing a flag.
      if (e.shiftKey) {
        if (!deployActive()) openDeploy();
      } else if (handWeapon?.data?.magazine) startReload();
      else spawnAtFlag(true);
    } else if (!optPilot.checked) {
      resetCamera();
    }
  }
  // E is `c_PIUse` (SEAT-2, verify-r5.md — the report's own correction: there
  // is no distinctly-named "enter/exit" enum value, vehicle use shares the
  // same trigger a real Use-key bind would), mapped to the physical E key.
  // In free fly E is already the vertical thrust, so both branches ask for a
  // mode first. The 1.0s per-player cooldown (SEAT-6) below gates the whole
  // branch, same as the real `toggleEntryPoint`.
  if (e.code === 'KeyE' && !e.repeat && !e.ctrlKey && !e.metaKey && !e.altKey
      && performance.now() - lastSeatToggle >= SEAT_TOGGLE_COOLDOWN_MS) {
    // Checked before the plain aircraft/car branch: a nested seat (the
    // Sherman's hull gunner) or a bare gun/seat root both count as
    // `aircraft || car` truthy *or* falsy depending on the vehicle, so
    // `mannedActive()` is the one check that is right either way.
    if (optPilot.checked && mannedActive()) {
      exitManned();
      lastSeatToggle = performance.now();
    } else if (optPilot.checked && (aircraft || car)) {
      exitVehicle();
      lastSeatToggle = performance.now();
    } else if (optOnFoot.checked && soldier && captured && nearEntry) {
      enterVehicle(nearEntry);
      lastSeatToggle = performance.now();
    }
  }
  // C cycles the view, which is `c_PIToggleCameraMode` bound to IDKey_C in every
  // one of the game's own control maps.
  if (e.code === 'KeyC' && !e.repeat && !e.ctrlKey && !e.metaKey
      && optPilot.checked && view) {
    showView(view.cycle());
  }
  // Z is `c_PILie`, a non-repetitive trigger, so it toggles rather than holds.
  if (e.code === 'KeyZ' && !e.repeat && optOnFoot.checked && soldier) prone = !prone;
  if (captured && (FLY_KEYS.has(e.code)
      || (optOnFoot.checked && FOOT_KEYS.has(e.code))
      || (optPilot.checked && AIR_KEYS.has(e.code)))) e.preventDefault();
});
addEventListener('keyup', e => keys.delete(e.code));

// Crouch is left Ctrl, for game parity with `c_PICrouch` -- but the browser
// owns Ctrl+W outright by default, so firing while crouching still closes
// the tab. Chromium's Keyboard Lock API (`navigator.keyboard.lock()`) can
// reserve it, but only inside a fullscreen session the page has to request
// first; that is prototyped behind `?kblock`, off by default (`kbLockEnter`,
// below). Without it -- and in Firefox and Safari, which have no Keyboard
// Lock -- the only lever a page has is asking before the tab actually goes,
// the way any unsaved-work page does. Scoped to mid-play (captured, on foot,
// a live soldier) so it never fires over the gate screen or a fly-by.
// Chromium shows the prompt only for a page that has had a real click or key
// press since it loaded, which mid-play always has.
addEventListener('beforeunload', e => {
  if (!(captured && optOnFoot.checked && soldier)) return;
  e.preventDefault();
  e.returnValue = '';
});

const sideEl = document.getElementById('side');
const sideCollapseBtn = document.getElementById('side-collapse-btn');
const mapFabBtn = document.getElementById('map-controls-fab');

function setSideCollapsed(collapsed) {
  sideEl.classList.toggle('side-collapsed', collapsed);
  if (mapFabBtn) mapFabBtn.hidden = !collapsed;
}
sideCollapseBtn?.addEventListener('click', e => {
  e.stopPropagation();
  setSideCollapsed(true);
});
mapFabBtn?.addEventListener('click', e => {
  e.stopPropagation();
  setSideCollapsed(false);
});

const gate = document.getElementById('gate');
function setFly(on) {
  captured = on;
  gate.hidden = on;
  if (on && isTouchDevice && !sideEl.classList.contains('side-collapsed')) {
    setSideCollapsed(true);
  }
  if (!on) {
    dragging = false;
    lockHeld = false;
    // A trigger held across an Escape must not still be firing when the
    // pointer comes back.
    triggerHeld = false;
    clickQueued = false;
    aimHeld = false;
    if (document.pointerLockElement === renderer.domElement) {
      document.exitPointerLock();
    }
  }
}
function capture() {
  setFly(true);
  ensureAudioContext();
  renderer.domElement.requestPointerLock();
  // After the pointer, never before: fullscreen spends the click's user
  // activation, and Chrome 149 refuses a pointer lock asked for after it.
  kbLockEnter();
}
function release() {
  setFly(false);
}
const gateLabel = gate.querySelector('span');
gateLabel.addEventListener('click', e => {
  e.stopPropagation();
  capture();
});

// --- Keyboard Lock, prototype (`?kblock`, off by default) ------------------
//
// Crouch-walking is Ctrl+W, and Chrome claims Ctrl+W before the page sees it:
// IDC_CLOSE_TAB is one of the commands `BrowserCommandController::
// IsReservedCommandOrKey` reserves, so no preventDefault stops the tab
// closing. `navigator.keyboard.lock()` is the page's one lever. A locked key
// reaches the page with every modifier -- locking KeyW sends Control+W and
// Control+Shift+W to the page (WICG Keyboard Lock) -- because Chromium's view
// marks it `skip_if_unhandled` and the browser never pre-handles it
// (render_widget_host_view_event_handler.cc). The lock is live only while
// the tab is in a fullscreen the page itself requested
// (`KeyboardLockController::LockKeyboard` checks IsFullscreen(); F11 does not
// count), so on foot, at capture, this asks for both.
//
// Measured headless in Chromium 141 and Chrome 149
// (features/mesh-viewer-performance, Keyboard Lock):
//  - requestFullscreen() consumes the click's activation; requestPointerLock()
//    and keyboard.lock() do not.
//  - keyboard.lock() needs no activation and resolves once the browser has
//    registered the request, fullscreen or not -- the promise says nothing
//    about whether the key is reserved.
//  - requestFullscreen({ keyboardLock }) is not implemented; the option is
//    never read.
//  - With Escape locked, a short Escape reaches the page, so it still releases
//    capture, cancels the deploy screen and closes the map; the browser leaves
//    fullscreen only after Escape is held. Unlocked, the first Escape leaves
//    fullscreen and the page never sees it.
// Chromium drops the lock while the window is unfocused and re-arms it on
// focus (`RenderWidgetHostImpl::SetPageFocus`). Firefox and Safari have no
// navigator.keyboard: there, as without `?kblock`, nothing here runs and the
// beforeunload prompt above is the only guard.
const KBLOCK = params.has('kblock') && typeof navigator.keyboard?.lock === 'function'
  && !isTouchDevice;
// Every key on-foot play holds Ctrl with -- walking, strafing, a crouched
// reload (Ctrl+R reloads the page), E, Z, M, jump -- and Escape, so its short
// press stays the page's. Keys the game does not bind stay the browser's: a
// deliberate Ctrl+T still opens a tab.
const KBLOCK_KEYS = ['KeyW', 'KeyA', 'KeyS', 'KeyD', 'KeyR', 'KeyE', 'KeyZ',
                     'KeyM', 'Space', 'Escape'];
const GATE_TEXT = gateLabel.textContent;
let kbSession = false;        // inside the fullscreen this page asked for
let kbLockState = 'idle';     // what lock() last said; the ?shots hook reads it

function kbLockEnter() {
  if (!KBLOCK || !(optOnFoot.checked && soldier)) return;
  if (document.fullscreenElement !== stage) stage.requestFullscreen().catch(() => {});
  // Asked again on every capture: the session's own `fullscreenchange`
  // handler unlocks when the fullscreen ends, however it ends.
  navigator.keyboard.lock(KBLOCK_KEYS).then(
    () => { kbLockState = 'requested'; },
    error => { kbLockState = `rejected: ${error.name}`; });
}

// A fresh Escape at the gate, or leaving on-foot play, ends the session.
function kbLockLeave() {
  if (!kbSession) return;
  navigator.keyboard.unlock();
  kbLockState = 'unlocked';
  document.exitFullscreen().catch(() => {});
}

if (KBLOCK) {
  document.addEventListener('fullscreenchange', () => {
    const inside = document.fullscreenElement === stage;
    if (inside === kbSession) return;
    kbSession = inside;
    if (!inside) {
      navigator.keyboard.unlock();
      kbLockState = 'unlocked';
    }
    const was = HUD_FOOT;
    HUD_FOOT = inside ? HUD_FOOT_KBLOCK : HUD_FOOT_PLAIN;
    if (hud.textContent === was) hud.textContent = HUD_FOOT;
    gateLabel.textContent = inside ? 'Click to resume · Esc exits full screen' : GATE_TEXT;
  });
}
let touchFlying = false;
const activeTouches = new Map();
let touchPinchDist = 0;
let touchMidX = 0;
let touchMidY = 0;
let isPanning = false;

function getTouchesCenterAndDist() {
  const pts = Array.from(activeTouches.values());
  if (pts.length < 2) return null;
  const dx = pts[1].x - pts[0].x;
  const dy = pts[1].y - pts[0].y;
  return {
    midX: (pts[0].x + pts[1].x) / 2,
    midY: (pts[0].y + pts[1].y) / 2,
    dist: Math.hypot(dx, dy)
  };
}

// The bit a button sets in `e.buttons`, indexed by its own `e.button` number.
// The two numberings disagree on middle vs. right: `button` calls middle 1
// and right 2, `buttons` puts right at bit 2 (0x2) and middle at bit 4 (0x4).
// Getting this backwards would read a right-click as a middle-click, so it
// is a lookup table, not an arithmetic guess.
const BUTTON_BIT = [1, 4, 2, 8, 16];

// Real pointer lock, or -- under `?shots` -- captured and stood in for it,
// the same way `canFire` (Infantry advance) already treats `?shots` as a
// substitute for `captured` itself: headless Chromium never grants pointer
// lock, so a harness has nothing else to gate on.
function pointerLocked() {
  return document.pointerLockElement === renderer.domElement || params.has('shots');
}

// Left is `c_PIFire`, right is `c_PIAltFire` (`Infantry.con`) while captured,
// on foot and pointer-locked -- the same gate `pointerdown` always checked.
// A second button pressed while the first is already held never reaches
// `pointerdown`: the browser reports it as a `pointermove` carrying the
// button that changed (`e.button`) and the new chord (`e.buttons`), plus a
// `mousedown` this page does not listen for. Releasing one of two held
// buttons is the same story on `pointerup`'s side. `pointerdown`, `pointerup`
// and that chorded `pointermove` all funnel through here so a chord is never
// silently dropped -- confirmed against real Chromium event order with
// `scratchpad/chord.cjs` (a held left + a right press/release fires
// `pointermove button=2 buttons=3` then `buttons=1`, no `pointerdown`/`up`
// at all for the right button).
//
// A release is handled before the gate, not after it: death or a redeploy
// while the trigger is held nulls `soldier` out from under it (see the
// `soldier = null` sites), and the pointerup that follows must still clear
// `triggerHeld`/`aimHeld` or the next life starts with the trigger stuck.
// A fresh press still needs the full gate -- there is no weapon, no rig and
// no meaning to "zoomed" without one. Zoom is never touched on a release;
// `altFireOnce` only toggles on a fresh press.
function footButtonChange(e) {
  const pressed = !!(e.buttons & BUTTON_BIT[e.button]);
  if (!pressed) {
    if (e.button === 0) triggerHeld = false;
    else if (e.button === 2) aimHeld = false;
    return;
  }
  if (!(captured && optOnFoot.checked && soldier && pointerLocked())) return;
  if (e.button === 0) {
    triggerHeld = true;
    clickQueued = true;
  } else if (e.button === 2) {
    const hw = handWeapon;
    if (hw?.data?.zoom?.toggle) {
      // `altFireOnce` masks the *held* alt-fire input on the client
      // (0x00500901, mask 0x800000) so only a fresh press reaches the
      // weapon -- the button that just transitioned to pressed is a fresh
      // press whether it arrived alone or as half of a chord.
      hw.zoomed = !hw.zoomed;
      hw.rezoom = 0;
    } else {
      aimHeld = true;
    }
  }
}

renderer.domElement.addEventListener('pointerdown', e => {
  if (e.pointerType === 'touch') {
    activeTouches.set(e.pointerId, { x: e.clientX, y: e.clientY });
    try { renderer.domElement.setPointerCapture(e.pointerId); } catch {}
    setFly(true);
    ensureAudioContext();

    if (activeTouches.size === 1) {
      lastPointerX = e.clientX;
      lastPointerY = e.clientY;
      dragging = true;
      if (navMode === 'fly') {
        touchFlying = true;
        isPanning = false;
      } else {
        touchFlying = false;
        isPanning = true;
      }
    } else if (activeTouches.size === 2) {
      touchFlying = false;
      isPanning = true;
      const geom = getTouchesCenterAndDist();
      if (geom) {
        touchMidX = geom.midX;
        touchMidY = geom.midY;
        touchPinchDist = geom.dist;
      }
    }
    return;
  }

  // Desktop mouse. On foot with the pointer already locked, the buttons stop
  // being a drag and become the game's own bindings — `c_PIFire` on the left,
  // `c_PIAltFire` (aim) on the right, `Infantry.con` — so the very first
  // click still captures and only the clicks after it pull the trigger.
  if (captured && optOnFoot.checked && soldier && pointerLocked()) {
    footButtonChange(e);
    return;
  }
  if (e.button === 0) {
    dragging = true;
    isPanning = false;
    lastPointerX = e.clientX;
    lastPointerY = e.clientY;
    try { renderer.domElement.setPointerCapture(e.pointerId); } catch {}
    capture();
  } else if (e.button === 1 || e.button === 2) {
    dragging = true;
    isPanning = true;
    lastPointerX = e.clientX;
    lastPointerY = e.clientY;
    try { renderer.domElement.setPointerCapture(e.pointerId); } catch {}
    setFly(true);
    ensureAudioContext();
  }
});

renderer.domElement.addEventListener('pointerup', e => {
  if (e.pointerType === 'touch') {
    activeTouches.delete(e.pointerId);
    try {
      if (renderer.domElement.hasPointerCapture(e.pointerId)) {
        renderer.domElement.releasePointerCapture(e.pointerId);
      }
    } catch {}

    if (activeTouches.size === 0) {
      touchFlying = false;
      dragging = false;
      isPanning = false;
    } else if (activeTouches.size === 1) {
      const remaining = activeTouches.values().next().value;
      lastPointerX = remaining.x;
      lastPointerY = remaining.y;
      if (navMode === 'fly') {
        touchFlying = true;
        isPanning = false;
      } else {
        touchFlying = false;
        isPanning = true;
      }
    } else {
      const geom = getTouchesCenterAndDist();
      if (geom) {
        touchMidX = geom.midX;
        touchMidY = geom.midY;
        touchPinchDist = geom.dist;
      }
    }
    return;
  }

  dragging = false;
  isPanning = false;
  // Same gate and the same function as the press: `footButtonChange` reads
  // `pressed` off `e.buttons`, which is already false for the button that
  // just came up, so this clears the right one without repeating the check.
  footButtonChange(e);
  try {
    if (renderer.domElement.hasPointerCapture(e.pointerId)) {
      renderer.domElement.releasePointerCapture(e.pointerId);
    }
  } catch {}
});

renderer.domElement.addEventListener('pointercancel', e => {
  if (e.pointerType === 'touch') {
    activeTouches.delete(e.pointerId);
  }
  if (activeTouches.size === 0) {
    touchFlying = false;
    dragging = false;
    isPanning = false;
  }
});

renderer.domElement.addEventListener('contextmenu', e => {
  e.preventDefault();
});
document.getElementById('side').addEventListener('pointerdown', e => {
  e.stopPropagation();
});

document.addEventListener('pointerlockchange', () => {
  if (document.pointerLockElement === renderer.domElement) {
    lockHeld = true;
    dragging = false;
    setFly(true);
    return;
  }
  if (lockHeld) {
    lockHeld = false;
    setFly(false);
  }
});
document.addEventListener('pointermove', e => {
  if (!captured) return;
  if (pointerLocked()) {
    // `e.button !== -1` means this move is really a chorded button change
    // (see `footButtonChange` above), not the cursor moving: `movementX/Y`
    // on that kind of event can be a large synthetic delta rather than real
    // mouse travel, and feeding it to `lookDelta` is what snapped the view
    // ~90 degrees when a second button joined one already held.
    if (e.button !== -1) {
      footButtonChange(e);
      return;
    }
    lookDelta(e.movementX, e.movementY);
    return;
  }

  if (e.pointerType === 'touch') {
    if (!activeTouches.has(e.pointerId)) return;
    activeTouches.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (activeTouches.size >= 2) {
      const geom = getTouchesCenterAndDist();
      if (geom) {
        const dMidX = geom.midX - touchMidX;
        const dMidY = geom.midY - touchMidY;
        touchMidX = geom.midX;
        touchMidY = geom.midY;

        panCamera(dMidX, dMidY);

        const dDist = geom.dist - touchPinchDist;
        touchPinchDist = geom.dist;
        if (Math.abs(dDist) > 1) {
          dollyCamera(dDist * 0.7);
        }
      }
      return;
    }

    if (!dragging) return;
    const dx = e.clientX - lastPointerX;
    const dy = e.clientY - lastPointerY;
    lastPointerX = e.clientX;
    lastPointerY = e.clientY;

    if (isPanning) {
      panCamera(dx, dy);
    } else {
      lookDelta(dx, dy);
    }
    return;
  }

  if (!dragging) return;
  const dx = e.clientX - lastPointerX;
  const dy = e.clientY - lastPointerY;
  lastPointerX = e.clientX;
  lastPointerY = e.clientY;

  if (isPanning) {
    panCamera(dx, dy);
  } else {
    lookDelta(dx, dy);
  }
});
document.addEventListener('wheel', e => {
  if (!captured) return;
  e.preventDefault();
  const scale = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 80 : 1;
  camera.position.y -= e.deltaY * scale * 0.12 * (isSlow() ? FLY_SLOW : 1);
  clampAltitude();
}, { passive: false });

function lookVector() {
  const cy = Math.cos(look.yaw), sy = Math.sin(look.yaw);
  const cp = Math.cos(look.pitch), sp = Math.sin(look.pitch);
  return { x: sy * cp, y: sp, z: cy * cp, cy, sy };
}

function applyLook() {
  const d = lookVector();
  camera.lookAt(
    camera.position.x + d.x,
    camera.position.y + d.y,
    camera.position.z + d.z,
  );
}

function fly(dt) {
  if (!captured) return;
  const step = flySpeed() * dt;
  const fwd = (keys.has('KeyW') || touchFlying ? 1 : 0) - (keys.has('KeyS') ? 1 : 0);
  const strafe = (keys.has('KeyD') ? 1 : 0) - (keys.has('KeyA') ? 1 : 0);
  const vert = (keys.has('KeyE') ? 1 : 0) - (keys.has('KeyQ') ? 1 : 0);
  const d = lookVector();
  camera.position.x += (d.x * fwd - d.cy * strafe) * step;
  camera.position.y += (d.y * fwd + vert) * step;
  camera.position.z += (d.z * fwd + d.sy * strafe) * step;
  clampAltitude();
}

// The stage's size, taken here and only here. A `clientHeight` read in the
// middle of a frame, after that frame's own DOM writes, forces a synchronous
// layout every frame (features/mesh-viewer-performance, rule 3); the frame
// reads these instead.
let stageWidth = 0;
let stageHeight = 0;
function resize() {
  // Stage, not window: the shared nav bar takes a grid row above it.
  const w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h) return;
  stageWidth = w;
  stageHeight = h;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
// The side panel collapsing resizes the stage without resizing the window.
new ResizeObserver(resize).observe(stage);
resize();

function dispose(root) {
  for (const tex of lmCache.values()) tex.dispose();
  lmCache.clear();
  if (!root) return;
  root.traverse(obj => {
    obj.geometry?.dispose();
    for (const m of [obj.material].flat().filter(Boolean)) {
      m.map?.dispose();
      m.dispose();
    }
  });
  scene.remove(root);
}

// The terrain colour tiles are PRE-LIT: Battlecraft bakes the level's sun,
// ambient and cast shadows into the Tx tile art itself (open any tile - the
// building, trench and treeline shadows are painted into the pixels, all
// falling the same way as sunLightDirectionVec). The engine composes ground
// as tile * detail * 2 plus fog and never relights it, so the viewer's
// analytic hemisphere+sun must not multiply in a second time. On Tobruk that
// double-lighting was a warm ~0.87 display-space factor that hid inside an
// already-warm palette; on Wake the level's near-grey diffuseColor
// (0.4/0.38/0.36) summed with a cool-blue fog hemisphere to a dead-grey 0.56
// in linear - the island rendered visibly darker and desaturated against the
// game's warm sandy tiles. Dark levels stay dark without analytic help
// because the bake carries the level's light level into the tile art.
function unlightTerrain(root) {
  root.traverse(node => {
    if (node.userData?.kind !== 'terrain') return;
    node.traverse(obj => {
      if (!obj.isMesh || !obj.material) return;
      const source = Array.isArray(obj.material) ? obj.material : [obj.material];
      const flat = source.map(m => {
        // Ground is viewed at grazing angles for most of a flythrough, and
        // three's default anisotropy of 1 mip-blurs the tile art into a smear
        // a few metres out - the "low-frequency ground" gap against the game.
        if (m.map) m.map.anisotropy = renderer.capabilities.getMaxAnisotropy();
        const mat = new THREE.MeshBasicMaterial({
          map: m.map || null,
          side: m.side,
        });
        mat.name = m.name;
        return mat;
      });
      obj.material = Array.isArray(obj.material) ? flat : flat[0];
    });
  });
}

// The engine's second terrain stage, `base * detail * 2`.
//
// Baking it into the tile colour map at export caps the grain at that map's
// resolution -- 4 texels/m for a 1024px tile over a 256 m patch, and 2 once
// --max-texture 512 has run -- against the 32 texels/m the engine gets by
// tiling a 512px detail map 16 times across the same patch. Sixteen times the
// spatial frequency is the whole difference between crisp sand underfoot and a
// smear, and it costs one extra texture read.
function bindTerrainDetail(root, dir) {
  const info = extras.terrain || {};
  if (!info.detailTexture) return;
  const repeats = info.detailRepeats || 16;
  const tex = texLoader.load(`${MAPS_BASE}/${dir}/${info.detailTexture}${bust()}`);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  // Same grazing-angle story as the tile art: without anisotropy the detail
  // grain vanishes into the first mip a few metres ahead of the camera.
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  // Raw texels, NOT sRGB-decoded: the engine's modulate-2x runs in 8-bit
  // display space, where the detail map's mid-grey 128 is the identity
  // (`apply_detail` in bf42/terrain.py is the same math at export). Decoding
  // the map to linear first turns that identity into 2*srgb2lin(0.5) = 0.43 -
  // terrain came out ~2.3x too dark with the hue baked toward mud. The
  // combine below round-trips the base tile through sRGB so the multiply
  // happens in the space the engine did it in.
  tex.colorSpace = THREE.NoColorSpace;
  root.traverse(node => {
    if (node.userData?.kind !== 'terrain') return;
    node.traverse(obj => {
      if (!obj.isMesh || !obj.material) return;
      const source = Array.isArray(obj.material) ? obj.material : [obj.material];
      const bound = source.map(m => {
        const mat = m.clone();
        mat.userData = { ...mat.userData };
        const prev = mat.onBeforeCompile;
        mat.onBeforeCompile = (shader, renderer) => {
          if (prev) prev(shader, renderer);
          shader.uniforms.tDetail = { value: tex };
          shader.uniforms.detailRepeats = { value: repeats };
          shader.fragmentShader = shader.fragmentShader
            .replace('void main() {',
              `uniform sampler2D tDetail;
               uniform float detailRepeats;
               vec3 bfToSrgb( vec3 c ) {
                 return mix( pow( c, vec3( 0.41666 ) ) * 1.055 - vec3( 0.055 ),
                     c * 12.92, vec3( lessThanEqual( c, vec3( 0.0031308 ) ) ) );
               }
               vec3 bfFromSrgb( vec3 c ) {
                 return mix( pow( c * ( 1.0 / 1.055 ) + vec3( 0.055 / 1.055 ),
                         vec3( 2.4 ) ),
                     c * ( 1.0 / 12.92 ),
                     vec3( lessThanEqual( c, vec3( 0.04045 ) ) ) );
               }
               void main() {`)
            .replace('#include <map_fragment>',
              `#include <map_fragment>
               diffuseColor.rgb = bfFromSrgb( min( vec3( 1.0 ),
                   2.0 * bfToSrgb( diffuseColor.rgb ) *
                       texture2D( tDetail, vMapUv * detailRepeats ).rgb ) );`);
        };
        mat.needsUpdate = true;
        return mat;
      });
      obj.material = Array.isArray(obj.material) ? bound : bound[0];
    });
  });
}

function lightmapTargets(obj) {
  // A multi-material part arrives from GLTFLoader as a Group whose direct
  // Mesh children are its primitives — the same Group-vs-Mesh trap as
  // setAnimatedTextureSpeed. Child *part* nodes carry their own userData
  // (templateKind, lightmap, kind), synthesized primitive meshes carry none.
  if (obj.isMesh) return [obj];
  return obj.children.filter(
    c => c.isMesh && Object.keys(c.userData || {}).length === 0);
}

// The engine's baked lighting for statics, and the pass with the longest
// string of masked bugs in this viewer. Each hid the next:
//
// 1. It never executed -- gated on `obj.isMesh` while every `userData.lightmap`
//    extra lands on a Group (the multi-material-part trap the README documents
//    for setAnimatedTextureSpeed).
// 2. First execution rendered burnt black shells. Partly the texture tagged
//    sRGB -- a lightmap is a multiplier, not a colour, and decoding it to
//    linear squares the darkening -- but mostly:
// 3. The atlas was sampled upside down. Everything inside the glb arrives via
//    GLTFLoader with flipY=false, the glTF convention. These atlases load
//    through THREE.TextureLoader, whose default is flipY=true, so UV1 indexed
//    the atlas mirrored in V -- hard-edged rectangles across faces that should
//    be uniformly lit, which read as "the UV1 export is wrong" and cost a trip
//    through the stride-40 StandardMesh reader that was blameless all along.
//    Same class of bug as the terrain tile V mirror, one loader further down.
//
// With the atlas the right way up, the bake is self-evidently modulate-2x
// (mid-grey neutral, bright texels overbright sun-facing walls) and it
// *replaces* analytic lighting on statics rather than adding to it -- keep the
// hemisphere and sun on a lightmapped wall and every face is lit twice. So a
// lightmapped mesh gets an unlit base material and the bake does the shading,
// palm shadows on walls included.
function bindLightmaps(root, dir) {
  // The bake is the sun term only. Its dark texels sit near zero, and the
  // engine adds the level's declared ambient on top - drop that term and
  // every shadow-side wall multiplies toward black, while sun-facing walls
  // (bright texels) look right, which is exactly how the omission presents.
  // Tobruk declares ambient 0.12/0.10/0.08 plus globalAmbient 0.2 and
  // shadowColor 0.55; the ambient pair is the floor, inlined per level.
  const lit = extras.lighting || {};
  const amb = lit.ambient || [0.2, 0.2, 0.2];
  const glob = lit.globalAmbient || [0.2, 0.2, 0.2];
  const floor = [0, 1, 2].map(i =>
    Math.min(1, (amb[i] || 0) + (glob[i] || 0)).toFixed(4));
  const floorGlsl = `vec3( ${floor[0]}, ${floor[1]}, ${floor[2]} )`;
  root.traverse(node => {
    const rel = node.userData?.lightmap;
    if (!rel) return;
    const url = `${MAPS_BASE}/${dir}/${rel}${bust()}`;
    let tex = lmCache.get(url);
    if (!tex) {
      tex = texLoader.load(url);
      tex.channel = 1;
      tex.flipY = false;
      tex.colorSpace = THREE.NoColorSpace;
      tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
      lmCache.set(url, tex);
    }
    for (const obj of lightmapTargets(node)) {
      const source = Array.isArray(obj.material) ? obj.material : [obj.material];
      const bound = source.map(m => {
        const mat = new THREE.MeshBasicMaterial({
          map: m.map || null,
          side: m.side,
          alphaTest: m.alphaTest || 0,
          transparent: m.transparent,
        });
        mat.name = m.name;
        // The exporter's extras marks ride in userData (additive,
        // textureFade); a rebuild that drops them silently un-marks the
        // material for every later pass.
        mat.userData = m.userData;
        mat.lightMap = tex;
        // MeshBasicMaterial's lightmap term is INLINE in its fragment shader
        // (r169 has no <lightmap_fragment> chunk anywhere), so the combine
        // must replace that exact line. The first version of this pass
        // injected its factor after <map_fragment> and "removed" a
        // #include <lightmap_fragment> that does not exist — a silent no-op
        // that left three's own `lm * 1/pi` accumulation in place, so the
        // bake multiplied in twice and shadow-side texels (near zero)
        // squared to black while sun-facing walls survived. Anchor on the
        // built-in line and rewrite it into the engine combine, applied once.
        mat.onBeforeCompile = (shader) => {
          const anchor = 'reflectedLight.indirectDiffuse += '
            + 'lightMapTexel.rgb * lightMapIntensity * RECIPROCAL_PI;';
          if (!shader.fragmentShader.includes(anchor)) {
            console.warn('lightmap combine anchor missing (three.js upgrade?); '
              + 'bake left on the stock path for', mat.name);
            return;
          }
          shader.fragmentShader = shader.fragmentShader.replace(anchor,
            `reflectedLight.indirectDiffuse += mix( vec3( 1.0 ),
                 min( vec3( 2.0 ), ${floorGlsl} + 2.0 * lightMapTexel.rgb ),
                 lightMapIntensity );`);
        };
        mat.needsUpdate = true;
        return mat;
      });
      obj.material = Array.isArray(obj.material) ? bound : bound[0];
    }
  });
}

// The engine's lighting for everything that is neither pre-lit terrain nor a
// lightmapped static: vehicles and bare statics. Verified against the
// decompiled renderer (features/bf1942-engine-reference/, symbols
// StandardMeshSubShader_applyRenderState 0x005bf690 - the vtable slot of
// dice.ref2.rend.SubShaderBuilder.StandardMesh, whose .rdata carries the .rs
// attribute strings - plus RendPCDX8_flushDeferredState 0x00604750 and
// LightDesc_toD3DLIGHT8 0x0045f210 for the light rig): a lit StandardMesh
// draws with texture stage 0 = MODULATE2X(TEXTURE, DIFFUSE) - the same 2x
// headroom as the terrain-detail and lightmap combines - where DIFFUSE is
// D3D fixed-function vertex lighting,
//
//   clamp01( ambientColor + globalAmbientColor + diffuseColor * max(0, N.L) )
//
// with the material colour effectively white (materialDiffuse is `1 1 1` in
// 3202 of 3523 vanilla .rs declarations; no materialAmbient attribute
// exists). Beware FUN_00664560's MODULATE 1x: that is a different, simpler
// renderer path, not the mesh one. Fixed-function lighting ran in 8-bit
// DISPLAY space; the previous hemisphere+sun rig evaluated its combine in
// linear, which reads far darker in the midtones (display 0.63 is linear
// 0.36) and lost the 2x - vehicles sat visibly under-exposed on terrain
// whose bake renders at full display brightness. Same class of fix as the
// detail combine above: round-trip through sRGB and multiply in the space
// the engine used. Not modelled: the optional specular term
// (lightingSpecular, ~1/3 of materials) and the envmap reflection stage.
function bindDynamicShading(root) {
  const lit = extras.lighting || {};
  const amb = lit.ambient || [0.2, 0.2, 0.2];
  const glob = lit.globalAmbient || [0.2, 0.2, 0.2];
  const diff = lit.diffuse || [0.5, 0.5, 0.5];
  // show() aims the DirectionalLight along -sunDirection toward the origin;
  // the same convention makes L (surface toward sun) the negated X/Z.
  const sd = extras.sunDirection || [-0.35, 0.8, 0.45];
  const norm = Math.hypot(sd[0], sd[1], sd[2]) || 1;
  const L = [-sd[0] / norm, sd[1] / norm, -sd[2] / norm];
  const f = n => Number(n).toFixed(4);
  const floorGlsl = `vec3( ${[0, 1, 2].map(i =>
    f(Math.min(1, (amb[i] || 0) + (glob[i] || 0)))).join(', ')} )`;
  const sunGlsl = `vec3( ${diff.map(f).join(', ')} )`;
  const dirGlsl = `vec3( ${L.map(f).join(', ')} )`;
  // Injected constants are baked as literals, and three caches programs by
  // the onBeforeCompile SOURCE - identical closures with different level
  // values would collide across map switches without an explicit key.
  const cacheKey = `bf-dynamic-lit:${floorGlsl}|${sunGlsl}|${dirGlsl}`;
  root.traverse(obj => {
    if (!obj.isMesh || !obj.material) return;
    // A muzzle flash is light, not a surface: the exporter bakes the sprite
    // payloads unlit for exactly that reason, and the mesh payloads carry
    // `extras.additive` instead. Both have to survive this pass — rebuilding
    // them as MeshBasicMaterial here drops the userData the additive mark
    // rides in, and `gunfire.js` would then blend the flash as ordinary alpha
    // over the cockpit rail. Shading them would dim the one thing the shot is
    // showing anyway.
    if (obj.userData?.effect) return;
    const source = Array.isArray(obj.material) ? obj.material : [obj.material];
    if (!source.some(m => m.isMeshStandardMaterial)) return;
    const bound = source.map(m => {
      if (!m.isMeshStandardMaterial) return m;
      const mat = new THREE.MeshBasicMaterial({
        map: m.map || null,
        color: m.color ? m.color.clone() : 0xffffff,
        side: m.side,
        alphaTest: m.alphaTest || 0,
        transparent: m.transparent,
        opacity: m.opacity,
        depthWrite: m.depthWrite,
      });
      mat.name = m.name;
      // Keep the exporter's extras marks (additive, textureFade) — a rebuild
      // that drops userData un-marks the material for every later pass.
      mat.userData = m.userData;
      // The glb's emissive slot carries a 0.45 translucency floor on branch
      // cards (see assemble.py) - a crutch calibrated against the OLD
      // under-lit rig, where pure N.L blackened sun-away fronds. The
      // engine-true combine already floors every surface at
      // 2*(ambient+globalAmbient), and in-game palms keep genuinely dark
      // shadow sides, so the crutch is dropped here rather than folded in -
      // keeping it would pin fronds at >=1.5x their texel on Tobruk.
      mat.customProgramCacheKey = () => cacheKey;
      mat.onBeforeCompile = (shader) => {
        shader.vertexShader = shader.vertexShader
          .replace('void main() {',
            'varying vec3 vBfNormal;\nvoid main() {')
          .replace('#include <begin_vertex>',
            `vBfNormal = mat3( modelMatrix ) * normal;
             #include <begin_vertex>`);
        shader.fragmentShader = shader.fragmentShader
          .replace('void main() {',
            `varying vec3 vBfNormal;
             vec3 bfToSrgb( vec3 c ) {
               return mix( pow( c, vec3( 0.41666 ) ) * 1.055 - vec3( 0.055 ),
                   c * 12.92, vec3( lessThanEqual( c, vec3( 0.0031308 ) ) ) );
             }
             vec3 bfFromSrgb( vec3 c ) {
               return mix( pow( c * ( 1.0 / 1.055 ) + vec3( 0.055 / 1.055 ),
                       vec3( 2.4 ) ),
                   c * ( 1.0 / 12.92 ),
                   vec3( lessThanEqual( c, vec3( 0.04045 ) ) ) );
             }
             void main() {`)
          .replace('#include <map_fragment>',
            `#include <map_fragment>
             vec3 bfN = normalize( vBfNormal );
             if ( !gl_FrontFacing ) bfN = -bfN;
             float bfNdL = max( 0.0, dot( bfN, ${dirGlsl} ) );
             // D3D clamps the vertex diffuse to [0,1] BEFORE the stage's
             // modulate-2x, and saturates again after the multiply.
             vec3 bfLit = 2.0 * min( vec3( 1.0 ),
                 ${floorGlsl} + ${sunGlsl} * bfNdL );
             diffuseColor.rgb = bfFromSrgb( min( vec3( 1.0 ),
                 bfToSrgb( diffuseColor.rgb ) * bfLit ) );`);
      };
      mat.needsUpdate = true;
      return mat;
    });
    obj.material = Array.isArray(obj.material) ? bound : bound[0];
  });
}

// `textureFade true` — the black_o darkness plane sealing every building
// doorway and window. The engine fades it with camera distance: up close it
// is gone and the room shows through the opening; at range it is solid and
// the opening reads as dark. The exporter marks the material in extras and
// this pass gives each flagged mesh its own clone so one building's doorway
// can be open while a distant one's is sealed. The band is PROVISIONAL
// [free]: fully open inside 20 m, fully sealed past 55 m, chosen to sit
// inside the 70 m interior-LOD switch the engine used — measure against a
// recording to pin it.
const FADE_NEAR = 20;   // [free] m, alpha 0 at or below
const FADE_FAR = 55;    // [free] m, alpha 1 at or beyond
let fadeMeshes = [];

function bindTextureFade(root) {
  fadeMeshes = [];
  root.traverse(obj => {
    if (!obj.isMesh) return;
    const source = [obj.material].flat();
    if (!source.some(m => m?.userData?.textureFade)) return;
    const bound = source.map(m => {
      if (!m?.userData?.textureFade) return m;
      // clone() keeps map/lightMap but not onBeforeCompile — irrelevant
      // here, the texture is pure black and lighting black is black.
      const mat = m.clone();
      mat.userData = m.userData;
      mat.transparent = true;
      mat.depthWrite = false;
      return mat;
    });
    obj.material = Array.isArray(obj.material) ? bound : bound[0];
    // Statics never move; cache the world position once.
    const at = new THREE.Vector3();
    obj.getWorldPosition(at);
    fadeMeshes.push({ obj, at });
  });
}

function updateTextureFade() {
  for (const { obj, at } of fadeMeshes) {
    const d = camera.position.distanceTo(at);
    const a = Math.min(1, Math.max(0, (d - FADE_NEAR) / (FADE_FAR - FADE_NEAR)));
    for (const m of [obj.material].flat()) {
      if (m?.userData?.textureFade) m.opacity = a;
    }
    // A fully-faded plane still costs a draw call; drop it.
    obj.visible = a > 0;
  }
}

function disposeSky() {
  if (skybox) {
    skybox.dispose();
    skybox = null;
  }
  if (skyRoot) {
    skyRoot.traverse(obj => {
      obj.geometry?.dispose();
      for (const m of [obj.material].flat().filter(Boolean)) {
        m.map?.dispose();
        m.dispose();
      }
    });
    scene.remove(skyRoot);
    skyRoot = null;
  }
  if (cloudMesh) {
    cloudMesh.geometry.dispose();
    cloudMesh.material.dispose();
    scene.remove(cloudMesh);
    cloudMesh = null;
    cloudUniforms = null;
  }
  for (const tex of waterAssets) tex.dispose();
  waterAssets = [];
  waterUniforms = null;
}

function srgb(rgb, fallback) {
  const [r, g, b] = rgb || fallback;
  // Level .con colours are display values from a pre-colour-managed engine.
  return new THREE.Color().setRGB(r, g, b, THREE.SRGBColorSpace);
}

// The engine draws the SkyBox mesh camera-centred with no fog and no lighting
// (`lighting false` in every Sky_*.rs). Reparent it out of the level root so
// distance culling never touches it, and swap its lit materials for unlit ones.
function setupSky(root, dir) {
  root.traverse(obj => {
    if (obj.userData?.kind === 'sky') skyRoot = obj;
  });
  if (!skyRoot) return;
  skyRoot.parent.remove(skyRoot);
  scene.add(skyRoot);
  skyRoot.traverse(obj => {
    if (!obj.isMesh) return;
    obj.frustumCulled = false;
    obj.renderOrder = -100;
    const mats = [obj.material].flat().map(m => new THREE.MeshBasicMaterial({
      map: m.map || null,
      color: m.map ? 0xffffff : 0x9db4c0,
      fog: false,
      depthWrite: false,
      side: THREE.DoubleSide,
    }));
    obj.material = Array.isArray(obj.material) ? mats : mats[0];
  });
  setupClouds(dir);
}

// `Sky.addCloud`: one alpha-blended layer scrolling at Cloud.setSpeed,
// repeated Cloud.setTexScale times across the sky span. Drawn camera-locked
// like the sky box, with a radial fade standing in for the engine's
// cloud-distance falloff.
function setupClouds(dir) {
  const clouds = extras.sky?.clouds;
  if (!clouds?.texture) return;
  const tex = texLoader.load(`${MAPS_BASE}/${dir}/${clouds.texture}${bust()}`);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  waterAssets.push(tex);
  cloudUniforms = {
    map: { value: tex },
    uOffset: { value: new THREE.Vector2(0, 0) },
    uSpan: { value: 500 },
    uCam: { value: new THREE.Vector2(0, 0) },
    uFadeStart: { value: 400 },
    uFadeEnd: { value: 900 },
  };
  const material = new THREE.ShaderMaterial({
    uniforms: cloudUniforms,
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide,
    vertexShader: `
      varying vec3 vWorld;
      void main() {
        vec4 w = modelMatrix * vec4(position, 1.0);
        vWorld = w.xyz;
        gl_Position = projectionMatrix * viewMatrix * w;
      }`,
    fragmentShader: `
      uniform sampler2D map;
      uniform vec2 uOffset, uCam;
      uniform float uSpan, uFadeStart, uFadeEnd;
      varying vec3 vWorld;
      void main() {
        vec2 uv = vWorld.xz / uSpan + uOffset;
        vec4 c = texture2D(map, uv);
        float fade = 1.0 - smoothstep(uFadeStart, uFadeEnd, distance(vWorld.xz, uCam));
        gl_FragColor = vec4(c.rgb, c.a * fade);
        #include <colorspace_fragment>
      }`,
  });
  cloudMesh = new THREE.Mesh(
    new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2), material);
  cloudMesh.frustumCulled = false;
  cloudMesh.renderOrder = -99;
  scene.add(cloudMesh);
}

// Everything the engine's PatchTerrain/Water shader does with the level's
// `water.*` block: two scrolling colour layers combined modulate-2x, a
// scrolling normal map feeding a sun specular, and colour/alpha ramps driven
// by real water depth sampled from the exported heightmap-derived depth map.
function setupWater(root, dir) {
  const w = extras.water;
  if (!w) return;
  let waterObj = null;
  root.traverse(obj => {
    if (obj.userData?.kind === 'water' && obj.isMesh) waterObj = obj;
  });
  if (!waterObj) return;
  const load = rel => {
    const tex = texLoader.load(`${MAPS_BASE}/${dir}/${rel}${bust()}`);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    waterAssets.push(tex);
    return tex;
  };
  const texs = w.textures || {};
  const layer1 = texs.layer1 ? load(texs.layer1) : null;
  const layer2 = texs.layer2 ? load(texs.layer2) : null;
  const normal = texs.normal ? load(texs.normal) : null;
  const depth = texs.depth ? load(texs.depth) : null;
  if (layer1) layer1.colorSpace = THREE.SRGBColorSpace;
  if (layer2) layer2.colorSpace = THREE.SRGBColorSpace;
  if (depth) depth.wrapS = depth.wrapT = THREE.ClampToEdgeWrapping;
  // The engine reflects ENVMAP_G_.rcm off the water via the shader-manager
  // envmap parameter; the same six faces feed the fresnel term here.
  let env = null;
  if (extras.envmap?.length === 6) {
    env = cubeLoader.load(extras.envmap.map(f => `${MAPS_BASE}/${dir}/${f}${bust()}`));
    env.colorSpace = THREE.SRGBColorSpace;
    waterAssets.push(env);
  }
  const ld = w.lightDirection || [-0.3, 0.5, 0.65];
  waterUniforms = {
    tLayer1: { value: layer1 },
    tLayer2: { value: layer2 },
    tNormal: { value: normal },
    tDepth: { value: depth },
    tEnv: { value: env },
    uTime: { value: 0 },
    uWorldSize: { value: w.worldSize || extras.worldSize || 2048 },
    uMaxDepth: { value: w.maxDepth || 0 },
    uDir1: { value: new THREE.Vector2(...(w.scrollDir1 || [1, 0])) },
    uDir2: { value: new THREE.Vector2(...(w.scrollDir2 || [0, 1])) },
    uDirN: { value: new THREE.Vector2(...(w.scrollDirNormal || [1, 1])) },
    uScroll1: { value: w.scroll1 || 0 },
    uScroll2: { value: w.scroll2 || 0 },
    uScrollN: { value: w.scrollNormal || 0 },
    uTile1: { value: w.tile1 || 0.5 },
    uTile2: { value: w.tile2 || 0.5 },
    uTileN: { value: w.tileNormal || 1 },
    uShallow: { value: srgb(w.shallowColor, [0.4, 0.5, 0.55]) },
    uDeep: { value: srgb(w.deepColor, [0.3, 0.38, 0.42]) },
    uSpec: { value: srgb(w.specular ? w.specularColor : [0, 0, 0], [0, 0, 0]) },
    uLightDir: { value: new THREE.Vector3(ld[0], ld[1], ld[2]).normalize() },
    uShininess: { value: Math.min(120, Math.max(20, 0.06 / Math.max(w.streakFactor || 0.001, 1e-4))) },

 * every loop carries a `Volume <- TimeRelease` fade, so the graph has to stay
 * alive past the toggle. The generation guard is what stops a re-enable inside
 * the tail from being killed by the pending teardown.
 */
function stopEngineAudio() {
  if (!engineAudio) return;
  engineAudio.release();
  const gen = engineGeneration;
  setTimeout(() => {
    if (gen === engineGeneration) disposeEngineAudio();
  }, ENGINE_RELEASE_MS);
}

function masterVolume() {
  return optSound.checked ? parseFloat(optSoundVol.value) : 0;
}

/** Everything the `.ssc` control sources are worth this frame. */
function engineControl(dt) {
  const state = (aircraft || car)?.state;
  if (engineNode) {
    engineNode.getWorldPosition(engineWorldPos);
    engineNode.getWorldQuaternion(engineWorldQuat);
  }
  let speed = 0;
  let diveAngle = 0;
  if (state) {
    speed = state.airspeed || state.velocity.length();
    if (dt > 0) {
      const a = engineScratch.copy(state.velocity).sub(enginePrevVelocity).length() / dt;
      engineAccel += (a - engineAccel) * Math.min(1, dt * ACCEL_SMOOTHING);
      enginePrevVelocity.copy(state.velocity);
    }
    // `Engine::DiveAngle` is fed by the engine object and the vanilla ramps
    // span 0.2..1, so it is read here as the sine of the flight path's descent
    // angle — 1 straight down, 0.2 about 12 degrees nose-down, which is where
    // the dive scream starts to come in. Inferred, not read out of the data.
    if (speed > 1) diveAngle = Math.max(0, -state.velocity.y / speed);
  }
  return {
    dt,
    // The already-spooled engine value, NOT the stick. `c_PIThrottle` reaches
    // full in a second; `state.throttle` chases it at the rate Physics.con
    // declares (maxSpeed.roll 500 over maxRotation.roll 5000, a tenth of the
    // range per second), so the note takes the same ten seconds to come up
    // that the real one does.
    rpm: state ? state.throttle : 0,
    speed,
    acceleration: engineAccel,
    diveAngle,
    position: engineWorldPos,
    quaternion: engineWorldQuat,
    listenerPosition: camera.position,
  };
}

// Sitting in a vehicle, its engine is essentially all you can hear — the map's
// wind and surf do not compete with a radial a metre in front of your knees.
// Ducking the ambience is how to get there: the engine bus is already pinned at
// BUS_HEADROOM because its layers sum well past unity, so raising it would clip
// rather than get louder. Eased rather than switched, or entering and leaving
// the cockpit pops.
const AMBIENT_DUCK = 0.12;
const AMBIENT_DUCK_TAU = 0.4;
let ambientDuck = 1;

function updateAudio(dt = 0) {
  const master = masterVolume();
  const duckTarget = (optPilot.checked && (aircraft || car)) ? AMBIENT_DUCK : 1;
  ambientDuck += (duckTarget - ambientDuck)
    * (dt > 0 ? Math.min(1, dt / AMBIENT_DUCK_TAU) : 1);
  if (engineAudio) {
    engineAudio.setMaster(master);
    engineAudio.update(engineControl(dt));
  }
  for (const weapon of weaponAudio) {
    // The trigger comes from the gun runtime rather than the key, so a weapon
    // that has run its magazine dry or is not the seat's gun stays quiet for
    // the same reason it stops drawing tracers.
    const group = vehicleGuns.find(g => g.node.name === weapon.spec.fireArms);
    weapon.audio.setMaster(group?.firing ? master : 0);
    if (weapon.node) {
      weapon.node.getWorldPosition(weaponWorldPos);
      weapon.node.getWorldQuaternion(weaponWorldQuat);
    }
    // No control channel in a weapon patch reads anything but Distance and
    // Default, both of which the module derives itself, so the gun needs none
    // of the engine's rpm/speed/dive plumbing.
    weapon.audio.update({
      dt,
      position: weaponWorldPos,
      quaternion: weaponWorldQuat,
      listenerPosition: camera.position,
    });
  }
  if (handFireBus) {
    // The hand-shot bus tracks the master like the engine bus does, and is
    // deliberately not ducked: the duck exists so a cockpit engine drowns the
    // surf, and the weapon at your own shoulder is the one thing louder.
    const target = master * WEAPON_HEADROOM;
    if (Math.abs(handFireBus.gain.value - target) > 1e-4) {
      handFireBus.gain.setTargetAtTime(
        target, audioListener.context.currentTime, 0.05);
    }
  }
  if (ambientAudio) {
    const base = extras.sounds?.ambient?.volume ?? 0.6;
    ambientAudio.setVolume(base * master * ambientDuck);
  }

  if (activeAreaAudios.length === 0) return;

  const camPos = camera.position;
  for (const item of activeAreaAudios) {
    // Closest point to the camera across every polyline in the group; the
    // area that produced it supplies the near/far ramp and base volume.
    let bestArea = item.areas[0];
    let bx = bestArea.points[0][0], by = bestArea.points[0][1], bz = bestArea.points[0][2];
    let minD2 = Infinity;

    for (const area of item.areas) {
      const pts = area.points;
      if (pts.length === 1) {
        const dist2 = (camPos.x - pts[0][0]) ** 2 + (camPos.y - pts[0][1]) ** 2 + (camPos.z - pts[0][2]) ** 2;
        if (dist2 < minD2) {
          minD2 = dist2;
          bx = pts[0][0]; by = pts[0][1]; bz = pts[0][2];
          bestArea = area;
        }
        continue;
      }
      for (let i = 0; i < pts.length - 1; i++) {
        const p1 = pts[i];
        const p2 = pts[i + 1];
        const dx = p2[0] - p1[0];
        const dy = p2[1] - p1[1];
        const dz = p2[2] - p1[2];
        const len2 = dx * dx + dy * dy + dz * dz;
        let t = len2 > 0 ? ((camPos.x - p1[0]) * dx + (camPos.y - p1[1]) * dy + (camPos.z - p1[2]) * dz) / len2 : 0;
        if (t < 0) t = 0;
        else if (t > 1) t = 1;
        const qx = p1[0] + t * dx;
        const qy = p1[1] + t * dy;
        const qz = p1[2] + t * dz;
        const dist2 = (camPos.x - qx) ** 2 + (camPos.y - qy) ** 2 + (camPos.z - qz) ** 2;
        if (dist2 < minD2) {
          minD2 = dist2;
          bx = qx; by = qy; bz = qz;
          bestArea = area;
        }
      }
    }

    item.anchor.position.set(bx, by, bz);

    const dist = Math.sqrt(minD2);
    const near = bestArea.nearDistance || 40.0;
    const far = bestArea.farDistance || 80.0;
    let ramp = 0.0;
    if (dist <= near) {
      ramp = 1.0;
    } else if (dist < far) {
      const denom = Math.max(far - near, 0.001);
      ramp = 1.0 - (dist - near) / denom;
    }
    item.sound.setVolume((bestArea.volume ?? 0.6) * ramp * master * ambientDuck);
  }
}

function applyLighting() {
  const light = extras.lighting;
  if (!light) {
    hemi.color.set(0xe8dcc0);
    hemi.groundColor.set(0x5a4a32);
    hemi.intensity = 1.35;
    sun.color.set(0xfff1d0);
    sun.intensity = 2.4;
    return;
  }
  // renderer.diffuseColor is the sun's tint; keep overall exposure by
  // normalising it and carrying the magnitude into intensity.
  const diffuse = light.diffuse || [0.5, 0.5, 0.5];
  const peak = Math.max(...diffuse, 0.01);
  const tint = diffuse.map(c => c / peak);
  sun.color.setRGB(tint[0], tint[1], tint[2], THREE.SRGBColorSpace);
  sun.intensity = 2.4 * Math.min(1.4, peak / 0.5);
  // The engine has no sky-dome light: its only ambient terms are
  // renderer.ambientColor / globalAmbientColor, and neither is ever blue.
  // Tinting the hemisphere with the raw fog colour injected atmosphere blue
  // into the shading on marine maps - on Wake (fog 0.71/0.74/0.79 against sun
  // 1/.95/.9) the two cancelled to a dead-grey total and every vehicle picked
  // up a cool cast the game never shows. Keep the fog's LUMINANCE as the size
  // of the ambient bounce, but give it the sun's hue so the hemisphere can
  // never fight the level's declared light colour.
  const fog = extras.fogColor || [0.7, 0.7, 0.7];
  const atmos = 0.2126 * fog[0] + 0.7152 * fog[1] + 0.0722 * fog[2];
  hemi.color.setRGB(atmos * tint[0], atmos * tint[1], atmos * tint[2],
                    THREE.SRGBColorSpace);
  const ground = light.ambient || [0.2, 0.2, 0.2];
  hemi.groundColor.setRGB(
    Math.min(1, ground[0] * 2.5), Math.min(1, ground[1] * 2.5),
    Math.min(1, ground[2] * 2.5), THREE.SRGBColorSpace);
  hemi.intensity = 1.15;
}

function drawDistance() {
  return extras.drawDistance || DEFAULT_DRAW;
}

function applyFar() {
  const world = extras.worldSize || 2048;
  const draw = drawDistance();
  // The engine's far plane IS the view distance: with fog saturating there,
  // the world ends in a completed haze wall that meets the sky painting.
  // Drawing past it (the old draw*1.6 with a 900 m floor) rasterised
  // fog-saturated terrain as crisp silhouettes against the paler sky band —
  // the "distant mountain ridge" the game never shows. Extend only to a
  // declared fogEnd beyond the view distance (Gazala: fog 500-850 vs VD 500)
  // so the wall always completes before the clip; 1.05 keeps the last
  // fog-saturated metres from z-fighting the plane.
  camera.far = optEntire.checked
    ? Math.max(4000, world * 1.5)
    : Math.max(draw, extras.fogEnd || 0) * 1.05;
  camera.updateProjectionMatrix();
}

function applyFog() {
  const color = extras.fogColor || [0.8, 0.72, 0.53];
  const draw = drawDistance();
  let start, end;
  if (optGameFog.checked) {
    // Nullish, not falsy: Berlin authors `fogstart 0` — fog from the eye
    // out — and a || default replaced that 0 with 150 against its declared
    // end of 100, which inverts the ramp and paints the whole world as one
    // fog wall.
    start = extras.fogStart ?? 150;
    end = extras.fogEnd ?? 300;
  } else if (!optEntire.checked) {
    start = draw * 0.55;
    end = draw;
  } else {
    start = 250;
    end = Math.max(1400, extras.worldSize || 2000);
  }
  // Declared fog colours are display values from a pre-colour-managed engine.
  const fogColor = new THREE.Color().setRGB(
    color[0], color[1], color[2], THREE.SRGBColorSpace);
  scene.fog = new THREE.Fog(fogColor, start, end);
  scene.background = skybox || fogColor;
  syncWaterFog();
}

function isCollision(obj) {
  return Boolean(obj.userData?.collision) || /collision/i.test(obj.name || '');
}

function kindOf(obj) {
  return obj.userData?.kind || '';
}

const cullBonePos = new THREE.Vector3();
function tagCull(obj) {
  // A skinned flag cloth sits at the scene root carrying no transform of its
  // own — glTF requires that of any skinned mesh — so its bind-pose geometry
  // boxes around the world origin and a distance test would hide it
  // everywhere except there. Its real position is wherever its joints are.
  if (obj.isSkinnedMesh && obj.skeleton && obj.skeleton.bones.length) {
    const box = new THREE.Box3();
    for (const bone of obj.skeleton.bones) {
      box.expandByPoint(bone.getWorldPosition(cullBonePos));
    }
    const sphere = new THREE.Sphere();
    box.getBoundingSphere(sphere);
    obj.userData.cullCenter = sphere.center.clone();
    // The joints are a lattice inside the cloth, not its extent; pad for it.
    obj.userData.cullRadius = sphere.radius + 2;
    return;
  }
  const box = new THREE.Box3().setFromObject(obj);
  const sphere = new THREE.Sphere();
  box.getBoundingSphere(sphere);
  obj.userData.cullCenter = sphere.center.clone();
  obj.userData.cullRadius = sphere.radius;
}

function indexScene(root) {
  cull.length = 0;
  spawnersRoot = null;
  root.traverse(obj => {
    if (isCollision(obj)) obj.visible = false;
  });
  root.updateMatrixWorld(true);
  root.traverse(obj => {
    if (obj === root) return;
    if (kindOf(obj) === 'spawners' || obj.name === 'spawners') {
      spawnersRoot = obj;
    }
  });
  for (const child of root.children) {
    if (child === spawnersRoot) {
      for (const vehicle of child.children) tagCull(vehicle);
      continue;
    }
    if (kindOf(child) === 'water') continue;
    tagCull(child);
    cull.push(child);
  }
}

function inRange(obj, cam, limit) {
  const c = obj.userData.cullCenter;
  const r = obj.userData.cullRadius || 0;
  if (!c) return true;
  const dx = c.x - cam.x, dy = c.y - cam.y, dz = c.z - cam.z;
  const reach = limit + r;
  return dx * dx + dy * dy + dz * dz <= reach * reach;
}

function applyVisibility() {
  const entire = optEntire.checked;
  const cam = camera.position;
  const limit = drawDistance();
  for (const obj of cull) obj.visible = entire || inRange(obj, cam, limit);
  if (!spawnersRoot) return;
  spawnersRoot.visible = optVehicles.checked;
  if (!optVehicles.checked) return;
  for (const vehicle of spawnersRoot.children) {
    vehicle.visible = entire || inRange(vehicle, cam, limit);
  }
}

// --- piloting ---------------------------------------------------------------
//
// The map scene already ships real vehicles at their spawn points, assembled by
// the same assembler the model browser uses and carrying a `rig` extra on every
// input-driven part, plus an empty `<Vehicle>Camera` node at the pilot's eye
// point. Piloting therefore adds no extraction: it drives what is already here.
//
// Control scheme is the game's own (`Settings/Default/Controls/Air.con`): the
// keyboard flies the aircraft and the mouse is a head, not a stick. W/S is
// throttle, A/D is rudder, the arrow keys are the stick — up/down pitch,
// left/right roll. Landing gear is deliberately not bound; in the real game it
// is automatic on altitude thresholds, which `Aircraft.integrate` reproduces.
//
// Freeing the mouse from the stick lets it do what the game's own hold-LShift
// free-look does: swivel the pilot's head inside a cockpit that is still flying
// straight, within the clamps the Corsair's camera declares.
//
// C cycles the view — `c_PIToggleCameraMode`, IDKey_C in the game's own control
// maps — through cockpit, chase, front and fly-by. `VehicleCamera` in flight.js
// owns all four and is explicit about which of them the data actually describes:
// the cockpit, and only the cockpit. Outside it the mouse orbits instead of
// swivelling, and fly-by ignores it entirely.

let aircraft = null;
// The driven land vehicle — `ground.js`'s half of the same seam. At most one
// of `aircraft`/`car` is ever non-null: one seat, one body, one view rig.
let car = null;
const AIR_KEYS = new Set([
  'KeyW', 'KeyA', 'KeyS', 'KeyD', 'KeyR', 'Space',
  'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight',
]);

/**
 * What kind of seat a spawned PlayerControlObject offers, read off its own
 * drivetrain rather than its name: the one `Engine` node every powered
 * vehicle carries declares `engineType` straight out of `Physics.con`, and
 * that is the engine's own taxonomy — `c_ETPlane` flies, `c_ETCar` drives.
 * Ships and tanks return null until a model exists for them (`c_ETTank`
 * steers by differential, which `ground.js` documents as an open gap), and so
 * do the engineless Defguns and Brownings that share the class.
 *
 * The walk stops at every nested PlayerControlObject: a Willys' passenger
 * seat has no engine of its own and must not borrow the driver's, and a
 * carrier's deck must not be classified by whatever is parked on it.
 */
function classifyVehicle(node) {
  if (!node) return null;
  const stack = [...node.children];
  while (stack.length) {
    const obj = stack.pop();
    const data = obj.userData || {};
    if (data.templateKind === 'PlayerControlObject') continue;
    if (data.templateKind === 'Engine' && data.physics?.engineType) {
      const type = data.physics.engineType;
      if (type === 'c_ETPlane') return 'air';
      if (type === 'c_ETCar') return 'ground';
      return null;
    }
    stack.push(...obj.children);
  }
  return null;
}

/**
 * The seat the pilot checkbox takes when nobody points at one: the first
 * aircraft the scene spawns, else the first drivable car. The name trio at
 * the end is for scenes extracted before `extras.physics` existed, whose
 * engines cannot say what they are.
 */
function pickVehicle() {
  const found = findVehicles(currentRoot);
  return found.find(node => classifyVehicle(node) === 'air')
    || found.find(node => classifyVehicle(node) === 'ground')
    || findVehicle(currentRoot, 'Corsair')
    || findVehicle(currentRoot, 'Spitfire')
    || findVehicle(currentRoot, 'Zero');
}

// --- the guns ---------------------------------------------------------------
//
// Same runtime as the model browser (`gunfire.js`), pointed at the flown
// vehicle instead of a model on a turntable. The Corsair's `CorsairGuns` is a
// two-barrel FireArms at 12 rounds a second, 400 m/s, tracer every third round,
// and all of that is read out of the scene — nothing about the Corsair appears
// below.
//
// Three things differ from firing a parked model, and all three are options:
//
//   - Rounds are parented to `scene`, never to the aircraft, or a tracer would
//     hang off the wing at a fixed distance for its whole life. That is the
//     module's own contract, so it costs nothing here beyond passing the
//     world in.
//   - `platformVelocity` adds the airframe's velocity to the muzzle's. Fired
//     level it barely shows against 400 m/s; fired in a dive or a hard yaw the
//     stream visibly leans away from the nose, which is the tell that the
//     rounds are really in the world and not glued to the gun.
//     Not modelled: the muzzle's own `omega x r` from the roll rate. At the
//     Corsair's 200 deg/s and a 2.23 m semi-span that is 7.8 m/s across a
//     400 m/s round — 1.1 degrees, the same order as the gun convergence the
//     muzzle nodes already carry, and it needs the body-rate sign convention
//     to be right to be worth having.
//   - Real muzzle velocity (`speedScale: 1`) and the round's declared
//     `timeToLive`. The browser slows fast rounds to 15% because a 400 m/s
//     round crosses a parked model between two frames; from a cockpit moving
//     at 50 m/s the round's motion *relative to you* is the picture, and it
//     reads as the dashed stream the game draws. A `Tracer_Projectile` then
//     lives its declared 3 s, which at 400 m/s is 1200 m — past Wake's 500 m
//     draw distance, so in practice the stream fades into the fog and expires
//     unseen, exactly as it does in game.
//   - `viewportHeight` is the tracer width floor's denominator. Read off the
//     drawing buffer rather than the window because `__renderOnce` resizes it
//     to whatever a headless check asked for, and a floor measured against the
//     wrong height is a streak that grows or vanishes only under test.
const _bufferSize = new THREE.Vector2();
const guns = new GunFire({
  scene, camera,
  viewportHeight: () => renderer.getDrawingBufferSize(_bufferSize).y,
});
// The tinted impact discs are a debug marker, not the authored effect; the
// authored effect is the EffectBundle the material table names, played out of
// `_shared/effects.glb` by `effects` below. `?impacts=debug` draws the marker
// as well, `?effects=off` leaves the library unloaded.
guns.impactMarkers = params.get('impacts') === 'debug';
// The game's own impact, trail and explosion bundles. Loaded once per mod
// beside `damage.json`; a level change keeps it. Until it lands (or when it
// is absent) a hit is recorded and nothing is drawn at the spot.
// Mesh particles (the decals, the stone chips) are `lighting true` meshes and
// get the same engine-combine shading as every other dynamic mesh here.
const effects = new EffectPlayer({ scene, camera, onMesh: mesh => bindDynamicShading(mesh) });
guns.effects = effects;
let effectsLoad = null;
function loadEffectLibrary() {
  if (effectsLoad || params.get('effects') === 'off') return effectsLoad;
  effectsLoad = EffectLibrary.load(`${MAPS_BASE}/_shared/effects.glb${bust()}`, loader)
    .then(library => { effects.library = library; return library; })
    .catch(err => { console.warn('effects library unavailable', err); return null; });
  return effectsLoad;
}
let vehicleGuns = [];

function collectGuns() {
  releaseGuns();
  const vehicle = aircraft || car;
  // `replace: false`, the same courtesy `loadHandWeapon` extends the other
  // way: a soldier who walked into this seat still owns his rifle's group,
  // and a wholesale `clear()` here would silently disarm him for the walk out.
  vehicleGuns = vehicle
    ? guns.collect(vehicle.node, {
      replace: false,
      speedScale: 1,
      maxRange: 1500,
      roundLifetime: 'data',
      tracerLength: 'data',
      platformVelocity: () => (aircraft || car)?.state.velocity ?? null,
    })
    : [];
}

function releaseGuns() {
  // Surgical, like `disposeHandWeapon`: only this vehicle's groups leave the
  // index, and rounds already in the air keep their reference and finish
  // their flight.
  for (const group of vehicleGuns) {
    guns.setFiring(group, false);
    const index = guns.groups.indexOf(group);
    if (index >= 0) guns.groups.splice(index, 1);
  }
  vehicleGuns = [];
}

// --- what the rounds run into ----------------------------------------------
//
// Gaps C-1, C-5, C-6 and M-2 of `parity-audit/projectiles-collision.md`, all
// behind one object. `collision.js` owns the arithmetic; this is the wiring.
//
// Three inputs, all already shipped and none of them new:
//   - the terrain tiles in the scene, snapped back onto the level's own height
//     lattice (4 m on every vanilla map);
//   - `waterLevel` out of `scene.json`, one horizontal plane;
//   - every node the assembler tagged `extras.collision`, which the map export
//     now carries (Wake 20,911 triangles, Bocage 21,661) and which `indexScene`
//     already hides from the render pass.
//
// Plus two tables that decide what a hit *means* rather than where it is:
// `terrain/materials.png` (one byte per heightmap sample, straight out of
// `Materialmap.raw`) and `_shared/damage.json`'s `effects` matrix.
let terrainMaterials = null;
let damageTables = null;

async function loadDamageTables(dir) {
  const ref = extras?.damage;
  if (!ref?.path) return null;
  try {
    return await fetch(`${MAPS_BASE}/${dir}/${ref.path}${bust()}`)
      .then(r => r.ok ? r.json() : null);
  } catch { return null; }
}

/**
 * `terrain/materials.png` back into the byte array it was written from.
 *
 * The exporter puts the raw id in all three colour channels so the file is
 * legible to a human; only red is read here, and nothing is filtered — a
 * bilinear read between id 10 (dry sand) and id 12 (rock) would invent id 11.
 */
async function loadTerrainMaterials(dir) {
  const spec = extras?.terrain?.materials;
  if (!spec?.image) return null;
  try {
    const blob = await fetch(`${MAPS_BASE}/${dir}/${spec.image}${bust()}`)
      .then(r => r.ok ? r.blob() : null);
    if (!blob) return null;
    const bitmap = await createImageBitmap(blob);
    const canvas = document.createElement('canvas');
    canvas.width = bitmap.width;
    canvas.height = bitmap.height;
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(bitmap, 0, 0);
    const rgba = ctx.getImageData(0, 0, bitmap.width, bitmap.height).data;
    const ids = new Uint8Array(bitmap.width * bitmap.height);
    for (let i = 0; i < ids.length; i++) ids[i] = rgba[i * 4];
    return { ids, dim: bitmap.width, spacing: spec.spacing || 0 };
  } catch { return null; }
}

/** Rebuild the collider for the level now in `currentRoot`. */
function buildCollider(root) {
  const worldSize = extras?.worldSize || 0;
  const heightfield = buildHeightfield(terrainMeshes, {
    worldSize,
    dim: extras?.terrain?.materials?.dim || 0,
  });
  if (heightfield && terrainMaterials) {
    heightfield.setMaterials(terrainMaterials.ids, terrainMaterials.dim,
                             terrainMaterials.spacing || heightfield.spacing);
  }
  // One owner per placed object, and one per spawned vehicle rather than one
  // for the whole spawner group — otherwise a Sherman's round would pass
  // through the Willy parked next to it.
  const ownerRoots = [];
  for (const child of root.children) {
    if (child === spawnersRoot) ownerRoots.push(...child.children);
    else ownerRoots.push(child);
  }
  const statics = buildCollisionIndex(root, { ownerRoots });
  collider = (heightfield || statics || Number.isFinite(extras?.waterLevel))
    ? new WorldCollider({ heightfield, statics, waterLevel: extras?.waterLevel })
    : null;
  guns.collider = collider;
  guns.damageEffects = damageTables?.effects || null;
  guns.projectileMaterials = damageTables?.projectiles || null;
  guns.materials = damageTables?.materials || null;
  effects.clear();
  loadEffectLibrary();
  return { heightfield, statics };
}
// Stick position, -1..1. Held keys drive it toward full deflection and it
// springs back to centre when they are released, which is what the surfaces'
// own `setAutomaticReset 1` does in the engine.
const stick = { roll: 0, pitch: 0 };
const STICK_RATE = 2.4;      // to full deflection in ~0.4 s
const STICK_RETURN = 3.2;    // and back to centre a little faster
const HEAD_SENS = 0.0022;
// The four views C cycles. Only `cockpit` is reconstructed from data — the look
// clamps it applies are `CorsairCamera`'s own setMin/setMaxRotation. Chase,
// front and fly-by are ours; the engine declares that they exist (`CVMChase`,
// `CVMFrontChase`, `CVMFlyBy`) and never where they sit. See flight.js.
let view = null;

function setPilot(on, node = null) {
  if (on && node && aircraft?.node !== node && car?.node !== node) {
    // A different seat than the one already built. The old vehicle was
    // already parked by `leaveVehicle`; dropping the references leaves it
    // standing where its driver left it, a fixture of the level now.
    aircraft = null;
    car = null;
    view = null;
  }
  if (on && !aircraft && !car) {
    const picked = node || pickVehicle();
    if (!picked) {
      optPilot.checked = false;
      return;
    }
    const kind = classifyVehicle(picked) || 'air';
    const vehicle = kind === 'ground'
      ? new GroundVehicle(picked, currentRoot, { groundHeight })
      : new Aircraft(picked, currentRoot);
    if (kind === 'ground') car = vehicle;
    else {
      aircraft = vehicle;
      aircraft.groundHeight = groundHeight;
      // The spawn pose puts the aircraft on the deck; lift it clear of its
      // own wheels. The car stays put — its springs are the lift.
      aircraft.state.position.y += 0.2;
    }
    // `Vehicle` defaults to forcing first person every step, because a page
    // with a single view has no other way to say "someone is sitting in it".
    // This page now has four, so it takes the decision over: `VehicleCamera`
    // calls `setFirstPerson` on every mode change, and the swap follows the view
    // rather than the sim. Leaving both on would have `integrate` slam the
    // interior back every frame the moment you pressed C.
    vehicle.autoFirstPerson = false;
    view = new VehicleCamera(vehicle, { groundHeight });
    collectGuns();
  }
  if (on && (aircraft || car)) {
    // Ticking the box is the user gesture the autoplay policy wants; the same
    // call on a map load is not one, and resume() there fails harmlessly until
    // the fly gate is clicked.
    ensureAudioContext();
    setupEngineAudio();
  }
  if (!on && (aircraft || car)) {
    const vehicle = aircraft || car;
    stopEngineAudio();
    releaseGuns();
    vehicle.reset();
    // `reset()` only restores the exterior when it owns the swap, and it no
    // longer does. Vacating the seat has to put the fuselage back explicitly or
    // the parked plane sits on the strip as an open cockpit tub.
    view.setMode('cockpit');
    vehicle.setFirstPerson(false);
    vehicle.applyTransform();
    vehicle.applyRig();
    ammoEl.hidden = true;      // the dashboard line rides the ammo element
  }
  stick.roll = 0;
  stick.pitch = 0;
  hud.textContent = on
    ? (car ? HUD_DRIVE : HUD_PILOT)
    : (optOnFoot.checked && soldier ? HUD_FOOT
      : isTouchDevice ? getTouchHudText() : HUD_FLY);
}

const HUD_PILOT = 'W/S throttle · A/D rudder · arrows pitch and roll · Space guns · '
  + 'C view · mouse look around · R reset · E out on the ground · Esc';
const HUD_DRIVE = 'W/S drive and brake · A/D steer · C view · mouse look around · '
  + 'R reset · E get out · Esc';

/** Read the keyboard into the car and step the drive model. */
function drive(dt) {
  if (!car) return;
  const held = captured ? keys : EMPTY_KEYS;

  // One axis, three jobs — accelerate, brake, reverse — which is exactly the
  // split `ground.js` reads off `c_PIThrottle`. Unlike the aircraft's
  // latching quadrant this springs back to centre: a lifted pedal is engine
  // braking, not a held power setting.
  car.setInput('c_PIThrottle', axisToward(car.input('c_PIThrottle'),
    (held.has('KeyW') ? 1 : 0) - (held.has('KeyS') ? 1 : 0), dt));
  car.setInput('c_PIYaw', axisToward(car.input('c_PIYaw'),
    (held.has('KeyD') ? 1 : 0) - (held.has('KeyA') ? 1 : 0), dt));
  // A Willys carries no guns, but the input costs nothing and whatever
  // armed car arrives next inherits the trigger with it.
  car.setInput('c_PIFire', held.has('Space') ? 1 : 0);

  car.integrate(dt);

  guns.firstPerson = car.firstPerson;
  for (const group of vehicleGuns) {
    guns.setFiring(group, car.input(group.stats.input || 'c_PIFire') > 0);
  }

  const pose = view.update(dt);
  camera.position.copy(pose.position);
  camera.quaternion.copy(pose.quaternion);

  // The dashboard, on the element the rifleman's ammo line uses: road speed
  // and the automatic's gear, which `ground.js` keeps readable for exactly
  // this. Reverse is a mode there rather than a slot, so it is read off the
  // signed forward speed here.
  const fwd = driveFwd.set(0, 0, -1).applyQuaternion(car.state.orientation);
  const vf = car.state.velocity.dot(fwd);
  ammoEl.hidden = false;
  ammoEl.textContent = `${car.control} · ${Math.round(Math.abs(vf) * 3.6)} km/h`
    + ` · gear ${vf < -0.25 ? 'R' : car.gear}`;
}
const driveFwd = new THREE.Vector3();

// --- walking up to a seat ----------------------------------------------------
//
// Every assembled vehicle carries its `EntryPoint` nodes — meshless, placed
// where a soldier walks in from, with `setEntryRadius` as their reach
// (`extras.seat.entryRadius`, 2.3 m on a Willys) — and the PCO root carries
// `setSoldierExitLocation` for the walk back out. Both are the game's own
// data; the only invention here is the 4 m fallback radius for a mod entry
// point that declares none.
const ENTRY_RADIUS_FALLBACK = 4;
const ENTRY_SCAN_PERIOD = 0.25;   // seconds between proximity sweeps on foot
let entryPoints = null;           // [{node, vehicle, control, radius}]
let nearEntry = null;             // the seat the HUD is currently offering
let entryScan = 0;

/**
 * Index every walkable seat once per level. Only the root seat of a vehicle
 * the page can actually drive or fly: the passenger PCOs and the manned guns
 * keep their entry points for the day seat switching exists.
 */
function collectEntryPoints() {
  entryPoints = [];
  const roots = findVehicles(currentRoot);
  // A vehicle someone has flown was reparented out of `spawners` and is
  // invisible to `findVehicles`; it is still standing in the level and still
  // has a door.
  for (const owned of [aircraft?.node, car?.node]) {
    if (owned && !roots.includes(owned)) roots.push(owned);
  }
  for (const vehicle of roots) {
    if (!classifyVehicle(vehicle)) continue;
    const control = vehicle.userData?.control || vehicle.name || 'vehicle';
    vehicle.traverse(obj => {
      if (obj.userData?.templateKind !== 'EntryPoint') return;
      if ((obj.userData.seat?.control || '') !== control) return;
      entryPoints.push({
        node: obj, vehicle, control,
        radius: obj.userData.seat?.entryRadius || ENTRY_RADIUS_FALLBACK,
      });
    });
  }
}

const entryWorld = new THREE.Vector3();

/** The closest entry point whose declared radius reaches the soldier. */
function nearestEntry() {
  if (!entryPoints) collectEntryPoints();
  let best = null;
  let bestDistance = Infinity;
  for (const entry of entryPoints) {
    entry.node.getWorldPosition(entryWorld);
    const distance = Math.hypot(entryWorld.x - soldier.x,
      entryWorld.y - (soldier.y + 1), entryWorld.z - soldier.z);
    if (distance <= entry.radius && distance < bestDistance) {
      best = entry;
      bestDistance = distance;
    }
  }
  return best;
}

/**
 * Watch for a door within reach, a few times a second rather than every
 * frame, and offer it on the HUD. Runs from `onFoot`.
 */
function scanForEntry(dt) {
  entryScan -= dt;
  if (entryScan > 0) return;
  entryScan = ENTRY_SCAN_PERIOD;
  const near = nearestEntry();
  if (near?.vehicle !== nearEntry?.vehicle) {
    hud.textContent = near ? `E — enter the ${near.control}` : HUD_FOOT;
  }
  nearEntry = near;
}

/**
 * From on foot into a seat. The soldier is suspended rather than torn down —
 * his weapon, magazines and flag selection all wait for the walk back out —
 * so only the presentation is packed away: the viewmodel, the crosshair, the
 * on-foot FOV.
 */
function enterVehicle(node) {
  if (handWeapon) {
    if (handWeapon.group) guns.setFiring(handWeapon.group, false);
    handWeapon.rig.visible = false;
    // Holstering drops zoom — `HandFireArms::disable` (lnxded 0x08293da0)
    // calls setZoom(false) — and the eased FOV factor goes home with it.
    handWeapon.zoomed = false;
    handWeapon.rezoom = 0;
    handWeapon.fovCur = 1;
    handWeapon.worldFov = FOOT_FOV;
  }
  triggerHeld = false;
  clickQueued = false;
  aimHeld = false;
  crosshairEl.hidden = true;
  ammoEl.hidden = true;
  camera.fov = FLY_FOV;
  camera.near = FLY_NEAR;
  camera.updateProjectionMatrix();
  nearEntry = null;
  // Checked without an event on purpose: the change handler would tear the
  // waiting soldier down, and the checkbox is only being told the truth —
  // someone is in a vehicle.
  optPilot.checked = true;
  setPilot(true, node);
  if (!aircraft && !car) {
    // The seat refused (an extract this page cannot classify). Back on foot
    // as if nothing happened.
    camera.fov = FOOT_FOV;
    camera.near = 0.2;
    camera.updateProjectionMatrix();
    if (handWeapon) handWeapon.rig.visible = true;
    hud.textContent = HUD_FOOT;
  }
}

/**
 * Park the vehicle exactly where it stands — engine off, controls centred,
 * exterior restored — without `reset()`'s teleport back to spawn. This is
 * the difference between vacating a seat and returning the vehicle.
 */
function leaveVehicle() {
  const vehicle = aircraft || car;
  if (!vehicle) return;
  stopEngineAudio();
  releaseGuns();
  vehicle.state.velocity.set(0, 0, 0);
  vehicle.state.angularVelocity.set(0, 0, 0);
  vehicle.state.throttle = 0;
  vehicle.setInput('c_PIThrottle', 0);
  vehicle.setInput('c_PIYaw', 0);
  vehicle.setInput('c_PIFire', 0);
  view.setMode('cockpit');
  vehicle.setFirstPerson(false);
  vehicle.applyTransform();
  vehicle.applyRig();
  stick.roll = 0;
  stick.pitch = 0;
  ammoEl.hidden = true;
}

/**
 * Where the occupant steps out, in world space: the vehicle's own
 * `setSoldierExitLocation` when it declares one (the Willys puts its driver
 * 1.5 m off the left running board), else two metres to the vehicle's left.
 * The declared vector is in Refractor's frame — z forward — so its Z is
 * negated at this boundary, the same fix `rig` angles get.
 */
function exitPose(vehicle) {
  const declared = vehicle.node.userData?.physics?.soldierExitLocation;
  const local = declared
    ? new THREE.Vector3(declared.position[0], declared.position[1],
      -declared.position[2])
    : new THREE.Vector3(-2, 0.5, 0);
  const position = local.applyQuaternion(vehicle.state.orientation)
    .add(vehicle.state.position);
  const fwd = driveFwd.set(0, 0, -1).applyQuaternion(vehicle.state.orientation);
  return {
    x: position.x, y: position.y, z: position.z,
    // The soldier's convention: forward is (sin yaw, 0, cos yaw). Stepping
    // out facing the way the vehicle faces reads right for both doors.
    yaw: Math.atan2(fwd.x, fwd.z),
  };
}

/**
 * E from a seat: back onto the ground beside it. An aircraft only opens its
 * canopy on the ground — grounded, or slow enough that the distinction has
 * stopped mattering.
 */
function exitVehicle() {
  const vehicle = aircraft || car;
  if (!vehicle) return;
  if (aircraft && !(aircraft.state.grounded || aircraft.state.airspeed < 3)) {
    return;
  }
  const exit = exitPose(vehicle);
  leaveVehicle();
  optPilot.checked = false;
  if (optOnFoot.checked && soldier) {
    soldier.collider = collider;
    soldier.spawn(exit.x, exit.y, exit.z, exit.yaw);
    camera.fov = FOOT_FOV;
    camera.near = 0.2;
    camera.updateProjectionMatrix();
    if (handWeapon) handWeapon.rig.visible = true;
    hud.textContent = HUD_FOOT;
  } else {
    // Nobody was waiting in the seat — the pilot box was ticked from free
    // fly — so E hands back the free camera where the vehicle stopped.
    placeCamera();
    updateHud();
  }
}

// --- on foot ----------------------------------------------------------------
//
// All the arithmetic is in `soldier.js`, which imports nothing and is driven by
// `tests/test_soldier.py` under node. This page only feeds it the keyboard and
// takes the eye pose back, the same seam `flight.js` keeps between VehicleState
// and the presentation layer.

let soldier = null;
let flags = [];
let prone = false;           // `c_PILie` is a toggle, not a hold
const FLY_FOV = camera.fov;
const FLY_NEAR = camera.near;

/** Fill the flag picker from the level's own control points.
 *
 *  Rebuilt whole, but not forgetful: the deploy screen writes its choice into
 *  this select and `setOnFoot` rebuilds the options before reading it back,
 *  and an innerHTML wipe resets a select to its first option. A level switch
 *  clears the value in `show()` first, so the memory never crosses maps. */
function buildSpawnFlags() {
  const kept = spawnFlagSelect.value;
  flags = spawnFlags(extras);
  spawnFlagSelect.innerHTML = '';
  for (const [index, flag] of flags.entries()) {
    const option = document.createElement('option');
    const side = flag.team === 1 ? 'Axis' : flag.team === 2 ? 'Allied' : 'neutral';
    option.value = String(index);
    option.textContent = `${flag.name} (${side}, ${flag.spawns.length})`;
    spawnFlagSelect.appendChild(option);
  }
  if (kept !== '' && Number(kept) < flags.length) spawnFlagSelect.value = kept;
  spawnFlagSelect.hidden = !flags.length || !optOnFoot.checked;
  return flags.length;
}

/** Put the soldier at the selected flag, on the next of its spawn points. */
let spawnIndex = 0;
function spawnAtFlag(advance = false) {
  if (!soldier || !flags.length) return false;
  const flag = flags[Math.min(Number(spawnFlagSelect.value) || 0, flags.length - 1)];
  if (advance) spawnIndex++;
  const spawn = pickSpawn(flag, spawnIndex, { groundAt: groundHeight });
  if (!spawn) return false;
  soldier.collider = collider;
  soldier.spawn(spawn.position[0], spawn.position[1], spawn.position[2],
                spawnYaw(spawn));
  prone = false;
  // The weapon follows the flag: switching to the other side's spawn swaps
  // the SMG. A no-op when the right one is already in hand.
  ensureHandWeapon(flag);
  hud.textContent = `${flag.name} · ${spawn.name}`;
  clearTimeout(hudViewTimer);
  hudViewTimer = setTimeout(() => {
    if (optOnFoot.checked) hud.textContent = HUD_FOOT;
  }, 2200);
  return true;
}

function setOnFoot(on) {
  if (on && optPilot.checked) {      // the two modes are exclusive
    optPilot.checked = false;
    setPilot(false);
  }
  // Either edge tears the old weapon down: entering rebuilds it against the
  // current level's gun index (a map switch has just cleared `guns.groups`),
  // leaving must not park a rifle on the free-fly camera.
  disposeHandWeapon();
  if (on) {
    soldier = new Soldier({ collider, worldSize: extras?.worldSize || 0 });
    if (!buildSpawnFlags() || !spawnAtFlag()) {
      // A level with no control point that owns a spawn group has nowhere to
      // put a soldier; say so rather than dropping him at the origin.
      soldier = null;
      optOnFoot.checked = false;
      spawnFlagSelect.hidden = true;
      hud.textContent = 'this level declares no flag with soldier spawns';
      return;
    }
    // `set1pFov 0.47`, and a near plane that clears the capsule so a wall you
    // are pressed against is drawn rather than clipped through.
    camera.fov = FOOT_FOV;
    camera.near = 0.2;
    camera.updateProjectionMatrix();
    spawnFlagSelect.hidden = false;
    hud.textContent = HUD_FOOT;
  } else {
    // The deploy screen cannot outlive the mode it selects for: the pilot
    // checkbox's exclusivity and the on-foot box both land here with the
    // overlay possibly still up.
    if (deployActive()) toggleFullMap(false);
    soldier = null;
    spawnFlagSelect.hidden = true;
    camera.fov = FLY_FOV;
    camera.near = FLY_NEAR;
    camera.updateProjectionMatrix();
    // `getTouchHudText()`, not the `HUD_TOUCH` this file once believed in —
    // that name was never declared, and reading it would throw on a phone.
    hud.textContent = isTouchDevice ? getTouchHudText() : HUD_FLY;
  }
}

const HUD_FOOT ='WASD move · Shift walk · Ctrl crouch · Z prone · Space jump · '
  + 'LMB fire · RMB aim · R reload · M redeploy · Esc';

/** Read the keyboard into the soldier and put the camera behind his eyes. */
function onFoot(dt) {
  if (!soldier) return;
  soldier.collider = collider;
  const held = captured ? keys : EMPTY_KEYS;
  // Hoisted so footFire can hand the deviation model the same c_PIThrottle /
  // c_PIYaw values the body integrates — the engine's speed gates read the
  // *input*, not the achieved velocity.
  const input = {
    forward: (held.has('KeyW') || touchFlying ? 1 : 0) - (held.has('KeyS') ? 1 : 0),
    strafe: (held.has('KeyD') ? 1 : 0) - (held.has('KeyA') ? 1 : 0),
    walk: held.has('ShiftLeft') || held.has('ShiftRight'),
    crouch: held.has('ControlLeft') || held.has('ControlRight'),
    prone,
    jump: held.has('Space'),
  };
  soldier.step(dt, input);
  // `soldier.eye()` is the eye pose with the bob already on it, interpolated
  // between the last two 60 Hz ticks — the sim runs on a fixed step inside
  // `step()` above, so drawing at the last tick would stutter on any monitor
  // that is not exactly 60 Hz. The bob's amplitudes are the game's
  // `setCameraShake*`; `soldier.js` has the citation.
  soldier.eye(footEye);
  camera.position.set(footEye.x, footEye.y, footEye.z);
  look.yaw = soldier.viewYaw;
  look.pitch = soldier.pitch;
  applyLook();
  // After the camera pose is final: the weapon fires down this frame's view
  // axis, and the crosshair is drawn against this frame's FOV.
  footFire(dt, input);
  // And after everything the frame owed: is there a door within reach.
  scanForEntry(dt);
}

const EMPTY_KEYS = new Set();
const footEye = { x: 0, y: 0, z: 0 };

// --- the weapon in hand ------------------------------------------------------
//
// A spawned soldier holds one glb, loaded from the models tree the way
// `flight.js` fetches a cockpit, parented to the camera and indexed by the
// same `GunFire` that fires the vehicles. For the pairings §11 of
// `first-person-soldier.md` has extracted, that glb is the first-person arms
// rig — camo sleeves and full-detail hands welded around the weapon, the six
// clip families baked in — mounted at the data's own `center1pHands` and
// driven by an AnimationMixer off the soldier's gait. Every other weapon
// draws its bare 3P glb at the eyeballed stand-in offset, exactly as before.
// Either way the document extras carry the armoury block (rate, spread,
// magazine, zoom, recoil) and a node stamped `fireArms` with a `muzzle`
// child, so nothing about any weapon is declared below.
//
// Two deliberate shortcuts remain, both visible and both documented:
//   - Scoped weapons get the data's FOV change and no scope art.
//   - Crouch and prone play the standing aim: their 1P clip families exist
//     in the data but are not yet baked into the fp.glb (§11 keeps the list).

// Which weapon the deploy screen's kit puts in hand is the game's own data,
// read from two places neither of which is the level's scene: the level's
// `Init.con` (`game.setTeamSkin` / `game.setKit <team> <slot> <kit>`) and the
// kit's `Objects.con` (the `HandFireArms` it carries at `itemIndex 3`, the
// slot the engine selects on spawn). `extract_loadouts.py` reads both through
// the kit readers and writes them as `_shared/loadouts.json` beside the
// levels; `kitPrimary` below looks the answer up by level, team and row.
let loadouts = null;
const loadoutsLoad = fetch(`${MAPS_BASE}/_shared/loadouts.json${bust()}`)
  .then(r => (r.ok ? r.json() : null))
  .then(data => { loadouts = data; return data; })
  .catch(err => { console.warn('loadouts unavailable', err); return null; });
// The stand-in for a maps tree published before `_shared/loadouts.json`
// existed, or a mod not yet run through the extractor: vanilla's kit
// primaries by the nation a side flies (`teamNation`), in the spawn screen's
// row order. Read from the same `Objects/Items/<Nation>Kit/*/Objects.con`
// files the extractor reads — not a guess, but frozen here, so the file wins
// whenever it is present.
const FALLBACK_PRIMARIES = {
  us:   ['No4Sniper', 'Bar1918', 'Bazooka', 'Thompson', 'No4'],
  brit: ['No4Sniper', 'Bar1918', 'Bazooka', 'Thompson', 'No4'],
  rus:  ['No4Sniper', 'DP', 'Bazooka', 'Mp18', 'No4'],
  ger:  ['K98Sniper', 'Sg44', 'Panzershreck', 'Mp40', 'K98'],
  jp:   ['K98Sniper', 'Type99', 'Panzershreck', 'Mp18', 'Type5'],
};
// And the soldier those nations dress, for the arms rig, when the file is
// not there to say which template the level actually names.
const FALLBACK_SOLDIERS = {
  us: 'USSoldier', brit: 'BritishSoldier', rus: 'RussianSoldier',
  ger: 'GermanSoldier', jp: 'JapaneseSoldier',
};
// The extracted first-person arms rigs — `<Soldier>__<Weapon>.fp.glb` under
// models/viewmodels (§11) — one per soldier and weapon the vanilla levels
// pair, because the sleeves are the nation's camo and the hands are welded
// to that weapon. Looked up by `viewmodelRigFor`; a pairing absent here, or
// a mod tree without the folder, draws the bare 3P glb.
const VIEWMODEL_RIGS = [
  'USSoldier__Thompson', 'USSoldier__No4Sniper', 'USSoldier__Bar1918',
  'USSoldier__Bazooka', 'USSoldier__No4', 'USSoldier__M1Garand',
  'USMarineSoldier__No4Sniper', 'USMarineSoldier__Bar1918',
  'USMarineSoldier__Bazooka', 'USMarineSoldier__Thompson',
  'USMarineSoldier__M1Garand',
  'BritishSoldier__No4Sniper', 'BritishSoldier__Bar1918',
  'BritishSoldier__Bazooka', 'BritishSoldier__Thompson', 'BritishSoldier__No4',
  'RussianSoldier__No4Sniper', 'RussianSoldier__DP', 'RussianSoldier__Bazooka',
  'RussianSoldier__Mp18', 'RussianSoldier__No4',
  'GermanSoldier__K98Sniper', 'GermanSoldier__Sg44',
  'GermanSoldier__Panzershreck', 'GermanSoldier__MP40', 'GermanSoldier__K98',
  'GermanDesertSoldier__K98Sniper', 'GermanDesertSoldier__Sg44',
  'GermanDesertSoldier__Panzershreck', 'GermanDesertSoldier__Mp40',
  'GermanDesertSoldier__K98',
  'JapaneseSoldier__K98Sniper', 'JapaneseSoldier__Type99',
  'JapaneseSoldier__Panzershreck', 'JapaneseSoldier__Mp18',
  'JapaneseSoldier__Type5',
];
const viewmodelRigIndex = new Map(VIEWMODEL_RIGS.map(stem => [stem.toLowerCase(), stem]));

/** The arms rig for `weapon` in `soldier`'s hands, or null for the bare glb.
 *  Case-insensitive on both halves: the kit files spell `MP40` and `k98Sniper`
 *  where the weapons' own `create` lines spell `Mp40` and `K98Sniper`, and
 *  the rig files were named as the exporter was invoked. A weapon with rigs
 *  only in other nations' sleeves borrows one — `?weapon=Thompson` on the
 *  Axis side has always drawn the US rig, and sleeves of the wrong camo
 *  beat no arms at all. */
function viewmodelRigFor(weapon, soldier) {
  if (!weapon) return null;
  const exact = viewmodelRigIndex.get(`${soldier || ''}__${weapon}`.toLowerCase());
  if (exact) return exact;
  const suffix = `__${weapon}`.toLowerCase();
  for (const [key, stem] of viewmodelRigIndex) if (key.endsWith(suffix)) return stem;
  return null;
}
// The rig and everything in it render in their own pass over a cleared depth
// buffer (frame(), below) so a wall pressed against the chest can never
// truncate the barrel — the game's equivalent is drawing 1P parts in their
// own pass (§11 step 6). A light only reaches a pass whose camera mask it
// shares, so the two scene lights are enrolled in the layer here.
const VIEWMODEL_LAYER = 1;
hemi.layers.enable(VIEWMODEL_LAYER);
sun.layers.enable(VIEWMODEL_LAYER);
// The near pass's own camera: it sees only the rig's layer and copies the
// main camera's matrices each frame (frame(), below). matrixAutoUpdate off —
// the copied world matrix IS its pose; letting three recompose it from an
// unset position would drag the pass to the origin.
const vmCamera = new THREE.PerspectiveCamera();
vmCamera.matrixAutoUpdate = false;
vmCamera.layers.set(VIEWMODEL_LAYER);
// Where the rig hangs is the engine's own arithmetic, not a calibration.
// `BFSoldier::updateAnimations` (client 0x004fb150, lnxded 0x0826e630)
// places the first-person skeleton at
//
//     rotate90aroundX · T(center1pHands + easedOffset) · S · M
//
// (row-vector products, left applied first) and hands it to
// `Skeleton::transform`. M is the SoldierCamera's transform relative to
// the soldier, so the chain reads in camera space; S is the camera-shake
// matrix the camera itself rides, which cancels in view; the eased offset
// chases `soldierCameraPosition` / `soldierZoomPosition`; rotate90aroundX
// is a fixed axis swap, (x,y,z) -> (x,-z,y), from the raw skeleton into the
// camera's frame. No yaw, pitch or extra offset exists anywhere in it. In
// three.js terms that is exactly: parent the rig to the camera, turn it
// half a revolution about Y, translate by center1pHands + offset with z
// negated for the handedness flip (corpus doc
// `handweapon-view-and-deviation.md` §3). The calibrated x/y/z/yaw that
// used to sit on top stood in for a pose error, not a mount error: the
// engine applies no lower-body clip in first person, so the exporter now
// bakes the rest pose under the arms (§11 of first-person-soldier.md).
//
// Retail's view frame is D3D's — +x right, +y up, +z forward
// (`convertWorldPosToScreenPos` 0x00440790 divides by view z and maps +x
// straight to screen right) — so a positive `soldierCameraPosition` x moves
// the gun to the viewer's right, and vanilla's `center1pHands` −0.12
// carries the whole rig 12 cm left of the eye.
//
// The bare 3P fallback (a weapon with no extracted arms rig) has no
// skeleton to mount, so it keeps an eyeballed camera-space base. The
// engine's base is `center1pHands` (BFSoldierTemplate +0x15c, the console
// word of that name), which the fp rigs read from their extras; the bare
// glb is authored view-ready and only this stand-in remains. Chosen so the
// Thompson's hip pose lands where the eyeballed viewmodel used to sit; the
// hip<->zoom *shift* is entirely the data's.
const VIEWMODEL_BASE = { x: 0.17, y: -0.10, z: -0.26 };   // OPEN [bare fallback]
// The eases are the engine's, both frame-rate dependent by design (no dt in
// either): the rig moves 25% of the remaining distance per visual update
// (constant 0.25f, lnxded .rodata 0x086c08ac), the FOV factor converges
// 0.7·cur + 0.3·target and snaps within 0.001.
const VIEW_EASE = 0.25;
const FOV_SNAP = 0.001;
// Crossfade between viewmodel clips, seconds. OPEN [stand-in]: the animation
// state machine declares per-transition rates the extractor does not yet
// read, so one short blend stands for all of them — and fire gets a
// near-snap, or the first round of a burst would smear through the fade.
const VIEWMODEL_FADE = 0.15;        // OPEN [stand-in]
const VIEWMODEL_FIRE_FADE = 0.02;   // OPEN [stand-in]
const CROSSHAIR_MIN_PX = 4;        // bar gap floor, so the cross never closes
const DEG_TO_RAD = Math.PI / 180;

let handWeapon = null;    // { name, data, rig, group, model, rounds, mags, ... }
let weaponToken = 0;      // guards a slow load landing after a mode/map switch
let triggerHeld = false;  // left button, while pointer-locked on foot
let clickQueued = false;  // one queued semi-auto shot per press
let aimHeld = false;      // right button held — zooms only mod weapons without `altFireOnce`
let footLookX = 0;        // |MouseLookX| radians accumulated since last frame
let footLookY = 0;        // |MouseLookY| likewise

/**
 * Is the weapon in hand zoomed right now. Toggle weapons (`altFireOnce`,
 * all of vanilla) latch `hw.zoomed` per press; `hw.rezoom` is the sniper
 * bolt-cycle un-zoom window (`UnZoomBetweenFireTime`), during which the
 * latch holds but the view sits at the hip. Hold-to-zoom is the fallback
 * for mod weapons that do not declare the toggle.
 */
function isZoomed() {
  const hw = handWeapon;
  if (!hw || !hw.data?.zoom) return false;
  if (hw.data.zoom.toggle) return hw.zoomed && !(hw.rezoom > 0);
  return aimHeld && captured;
}
const crosshairEl = document.getElementById('crosshair');
const ammoEl = document.getElementById('ammo');
const aimOrigin = new THREE.Vector3();
const aimDirection = new THREE.Vector3();

// The kit row's class, for finding a level's kit by class when its slot
// numbering is not the vanilla one. `extract_kits.py` writes these labels
// from the kit's `setType`; the row names are the page's.
const KIT_CLASS = {
  scout: 'Scout', assault: 'Assault', antitank: 'Anti-tank',
  medic: 'Medic', engineer: 'Engineer',
};

/** What the chosen kit hands a soldier of `team` on this level: the kit the
 *  level binds to that row (`game.setKit <team> <row> <kit>`), the weapon at
 *  its `itemIndex 3`, and the soldier template the team wears. Every field
 *  null where `_shared/loadouts.json` is absent or does not name the level;
 *  `weaponTemplateFor` then falls back to the vanilla table by nation. */
function kitLoadout(team, kitName = deployKit) {
  const side = loadouts?.levels?.[currentDir]?.[team];
  if (!side) return { kit: null, primary: null, soldier: null };
  const slot = KITS.indexOf(kitName);
  let kit = side.slots?.[String(slot)] || null;
  if (!kit || !loadouts.kits?.[kit]) {
    // A mod may file its classes in other rows; the class label is the
    // engine's own `setType`, so match on that before giving up.
    const wanted = KIT_CLASS[kitName];
    kit = Object.values(side.slots || {})
      .find(name => loadouts.kits?.[name]?.class === wanted) || kit;
  }
  return {
    kit,
    primary: loadouts.kits?.[kit]?.primary || null,
    soldier: side.soldier || null,
  };
}

/** The template a soldier of `flag`'s team spawns holding, with the kit the
 *  deploy screen chose. `?weapon=` overrides everything, as it always has. */
function weaponTemplateFor(flag, kitName = deployKit) {
  const forced = params.get('weapon');
  if (forced) return forced;
  const team = flag?.team;
  const loadout = kitLoadout(team, kitName);
  if (loadout.primary) return loadout.primary;
  const slot = Math.max(0, KITS.indexOf(kitName));
  return FALLBACK_PRIMARIES[teamNation(team)]?.[slot]
    || FALLBACK_PRIMARIES[team === 1 ? 'ger' : 'us'][slot];
}

/** The soldier template whose sleeves the arms rig should wear: the level's
 *  `game.setTeamSkin`, or the nation's soldier when the file is absent. */
function soldierTemplateFor(flag) {
  const team = flag?.team;
  return kitLoadout(team).soldier
    || FALLBACK_SOLDIERS[teamNation(team)]
    || (team === 1 ? 'GermanSoldier' : 'USSoldier');
}

/** Tear down the viewmodel, its gun group and the HUD it owns. */
function disposeHandWeapon() {
  releaseHandFireLoop();
  const hw = handWeapon;
  weaponToken++;
  handWeapon = null;
  clickQueued = false;
  crosshairEl.hidden = true;
  ammoEl.hidden = true;
  if (!hw) return;
  if (hw.group) {
    guns.setFiring(hw.group, false);
    // Surgical, not `collect(replace: true)`: that would evict a flown
    // aircraft's guns too. Rounds already in the air keep their reference to
    // the group and finish their flight.
    const index = guns.groups.indexOf(hw.group);
    if (index >= 0) guns.groups.splice(index, 1);
  }
  camera.remove(hw.rig);
  // The mixer first, while its bindings still resolve, then the GPU half —
  // a skinned rig also owns bone textures its skeleton has to give back.
  if (hw.mixer) {
    hw.mixer.stopAllAction();
    hw.mixer.uncacheRoot(hw.mixer.getRoot());
  }
  hw.rig.traverse(obj => {
    obj.geometry?.dispose();
    obj.skeleton?.dispose?.();
    for (const m of [obj.material].flat().filter(Boolean)) {
      m.map?.dispose();
      m.dispose();
    }
  });
  // An aim in progress was narrowing the FOV; hand the soldier his own back.
  if (optOnFoot.checked && soldier) {
    camera.fov = FOOT_FOV;
    camera.updateProjectionMatrix();
  }
}

/** Load the weapon into hand — the arms rig where one is extracted for
 *  `soldier` holding it, the bare `name`.glb where not — hang it off the
 *  camera and index its gun. */
async function loadHandWeapon(name, soldier = null) {
  disposeHandWeapon();
  const token = weaponToken;
  let gltf = null;
  let fp = false;
  // The arms first: §11's `<Soldier>__<Weapon>.fp.glb`, sleeves and hands
  // welded around the weapon with the six clip families baked in. A pairing
  // without one falls through to the bare weapon, which works as it did.
  const rigFile = viewmodelRigFor(name, soldier);
  if (rigFile) {
    try {
      gltf = await loader.loadAsync(
        `${MODELS_BASE}/viewmodels/${rigFile}.fp.glb${bust()}`);
      fp = true;
    } catch { /* the bare path below */ }
  }
  if (!gltf) {
    try {
      gltf = await loader.loadAsync(`${MODELS_BASE}/${name}.glb${bust()}`);
    } catch {
      // A `?weapon=` naming nothing extracted, or a mod tree without the glb:
      // on foot bare-handed, which already worked.
      return null;
    }
  }
  if (token !== weaponToken || !optOnFoot.checked || !soldier) return null;
  // Document-level extras land on `gltf.userData` (GLTFLoader's
  // `assignExtrasToUserData(result, json)`); the fallbacks cover a vendored
  // loader that files them elsewhere. The fp rig spells its armoury block
  // `weaponStats` — the same shape the bare glb calls `weapon`, and
  // everything downstream reads it through `hw.data` without caring.
  const doc = (Object.keys(gltf.userData ?? {}).length ? gltf.userData : null)
    ?? gltf.parser?.json?.extras ?? {};
  const data = fp
    ? doc.weaponStats ?? null
    : doc.weapon ?? gltf.scene?.userData?.weapon ?? null;
  // Where the rig hangs in camera space: `center1pHands`, read from the
  // extras and not retyped — the engine's base vector, added to the eased
  // weapon offset ahead of the camera transform (the chain above). Its
  // −1.56 puts the skeleton root 1.56 m below the eye and, with the rest
  // pose the exporter bakes under the arms, the head bone 2 cm under the
  // eye: sleeves at the bottom of the frame, weapon raked up-forward. The
  // bare fallback keeps the eyeballed VIEWMODEL_BASE; only it needs one.
  const hands = fp ? doc.view?.center1pHands : null;
  const base = hands
    ? { x: hands[0], y: hands[1], z: -hands[2] }
    : VIEWMODEL_BASE;
  // The rig's two authored poses, camera space. Refractor's z is forward,
  // three's camera looks down -z, so z is negated; a weapon that declares no
  // `soldierCameraPosition` (the Bazooka) sits at the base alone, and one
  // with no `soldierZoomPosition` zooms to its hip pose.
  const toCamera = v => ({
    x: base.x + (v?.[0] ?? 0),
    y: base.y + (v?.[1] ?? 0),
    z: base.z - (v?.[2] ?? 0),
  });
  const viewHip = toCamera(data?.view?.cameraPosition);
  const viewZoom = data?.view?.zoomPosition
    ? toCamera(data.view.zoomPosition) : viewHip;
  const rig = new THREE.Group();
  rig.name = `${name} viewmodel`;
  rig.position.set(viewHip.x, viewHip.y, viewHip.z);
  // The fp rig stands +Y up with its arms extending along +Z, and a three.js
  // camera looks down −Z: half a revolution about Y turns the arms into the
  // view (§11 step 1) — the whole of the engine's rotate90aroundX once the
  // exporter's Z-up-to-Y-up pitch and the glTF handedness flip are taken
  // out. Nothing else rotates it. The bare weapon glbs are authored
  // view-ready.
  if (fp) gltf.scene.rotation.y = Math.PI;
  rig.add(gltf.scene);
  // The whole rig lives on the near layer, drawn by frame()'s second pass
  // over cleared depth. Culling goes with it: skinned bounds computed at
  // bind pose lie about where animated sleeves actually are, and a rig this
  // small is cheaper to draw than to test.
  rig.traverse(obj => {
    obj.layers.set(VIEWMODEL_LAYER);
    if (obj.isMesh) obj.frustumCulled = false;
  });
  // The additive mark the exporter leaves on flash and glow materials. The
  // model browser applies it model-wide at load and `GunFire.collect` applies
  // it to the emitter clones it makes; this covers whatever additive surface
  // is neither (a sight glow on the gun body itself).
  gltf.scene.traverse(obj => {
    if (!obj.isMesh) return;
    for (const m of [obj.material].flat().filter(Boolean)) {
      if (!m.userData?.additive) continue;
      m.blending = THREE.AdditiveBlending;
      m.transparent = true;
      m.depthWrite = false;
      m.needsUpdate = true;
    }
  });
  camera.add(rig);
  // The load can resolve after its owner has already climbed into a seat —
  // spawn beside a jeep and press E inside the fetch — and a viewmodel must
  // not materialise over a windscreen. `exitVehicle` shows it again.
  rig.visible = !(optPilot.checked && (aircraft || car));
  // The six baked families become mixer actions. Locomotion loops; the
  // one-shots clamp on their last frame — the clamped fire pose is what
  // "holds between shots" against the 0.1 s cycle (§11 step 4), and a
  // clamped deploy or reload simply waits for the crossfade home.
  let mixer = null;
  const actions = {};
  if (fp && gltf.animations?.length) {
    mixer = new THREE.AnimationMixer(gltf.scene);
    for (const clip of gltf.animations) {
      const action = mixer.clipAction(clip);
      if (LOCO_LOOP.has(clip.name)) {
        action.setLoop(THREE.LoopRepeat, Infinity);
      } else {
        action.setLoop(THREE.LoopOnce, 1);
        action.clampWhenFinished = true;
      }
      actions[clip.name] = action;
    }
  }
  const magazine = data?.magazine || null;
  const hw = {
    name, data, rig,
    soldier,               // whose sleeves were asked for
    rigFile: fp ? rigFile : null,   // the arms rig that answered, if one did
    mixer, actions,        // the arms rig's state machine; both empty when bare
    clips: fp ? doc.clips ?? null : null,   // per-family frames/speed/span extras
    active: null,          // the clip currently owning the arms
    group: null,
    // The loaded magazine plus the spares. `magazines 5` is read as the
    // total carried, which is how the game's HUD counts them.
    rounds: magazine?.size ?? Infinity,
    mags: magazine ? Math.max((magazine.magazines ?? 1) - 1, 0) : 0,
    reload: 0,       // seconds left of a reload in progress
    cool: 0,         // seconds until a semi-auto weapon has cycled
    pulse: false,    // a one-frame trigger pulse is in flight
    fire: null,      // { spec, buffer } once loadHandFireSound resolves
    zoomed: false,   // the press-toggle latch (`altFireOnce`)
    rezoom: 0,       // seconds of `UnZoomBetweenFireTime` un-zoom left
    fovCur: 1,       // the eased ARMS FOV factor, 1 hip .. `zoom.soldierFov` zoomed
    worldFov: FOOT_FOV,   // the eased world FOV, degrees, FOOT_FOV .. `zoom.fov` zoomed
    viewHip, viewZoom,
    pos: { ...viewHip },   // the eased rig offset, chasing hip or zoom
    model: new DeviationModel({ deviation: data?.deviation }),
  };
  if (data) {
    const found = guns.collect(rig, {
      replace: false,          // the flown aircraft's guns must survive this
      speedScale: 1,           // real muzzle velocity, like the pilot path
      maxRange: 1200,
      roundLifetime: 'data',
      platformVelocity: () => (soldier ? soldier.body.velocity : null),
      // `fireInCameraDof 1`: the round leaves the eye down the view axis and
      // the muzzle node only places the flash. All 25 armed hand weapons
      // declare it; a mod one that does not falls back to its muzzle.
      aimRay: data.fireInCameraDof ? () => {
        camera.getWorldPosition(aimOrigin);
        camera.getWorldDirection(aimDirection);
        return { origin: aimOrigin, dir: aimDirection };
      } : null,
      spreadDeg: () => (handWeapon ? handWeapon.model.current() : 0),
    });
    hw.group = found[0] || null;
  }
  handWeapon = hw;
  if (mixer && actions.idle) {
    // Idle underneath from the first frame — the breathing sway, slow enough
    // at its declared 0.1x to read as stillness — and the raise over it:
    // §11's deploy one-shot on spawn.
    actions.idle.play();
    hw.active = 'idle';
    playViewmodelClip(hw, 'deploy', { restart: true });
  }
  loadHandFireSound(hw);
  updateAmmoHud();
  return hw;
}

/** The right weapon for `flag` and the chosen kit, loaded only if it is not
 *  already in hand — in the right sleeves: a redeploy across the team line
 *  with the same weapon still changes soldier, so the rig is compared too. */
function ensureHandWeapon(flag) {
  const name = weaponTemplateFor(flag);
  const who = soldierTemplateFor(flag);
  if (handWeapon?.name === name
      && (handWeapon.rigFile || null) === (viewmodelRigFor(name, who) || null)
      && (!handWeapon.group || guns.groups.includes(handWeapon.group))) {
    // Same weapon, new life: the raise plays again on every spawn.
    playViewmodelClip(handWeapon, 'deploy', { restart: true });
    return;
  }
  loadHandWeapon(name, who);
}

// How a gait names a locomotion clip. Walk and run are one baked clip at two
// rates — the export carries both names so the distinction stays data (§11).
// Crouch and prone fall back to the aim until their families are baked.
const LOCO_CLIP = { run: 'run', walk: 'walk', stand: 'idle', crouch: 'idle', prone: 'idle' };
const LOCO_LOOP = new Set(['idle', 'walk', 'run']);

/**
 * Bring `name` to full weight and fade whatever held the arms before it.
 * Loops keep their phase across a fade-out — a walk cycle returned to
 * mid-burst has not restarted — and one-shots pass `restart` to rewind.
 * Silently a no-op for the bare-weapon fallback, which has no mixer.
 */
function playViewmodelClip(hw, name, { restart = false, timeScale = 1,
                                       fade = VIEWMODEL_FADE } = {}) {
  const to = hw?.actions?.[name];
  if (!to || !hw.mixer) return;
  if (hw.active === name && !restart) return;
  const from = hw.active && hw.active !== name ? hw.actions[hw.active] : null;
  if (restart) to.reset();
  to.setEffectiveTimeScale(timeScale);
  to.enabled = true;
  to.play();
  if (from) {
    to.crossFadeFrom(from, fade, false);
  } else if (restart) {
    to.setEffectiveWeight(1);
  }
  hw.active = name;
}

/**
 * The clip this frame owes, then the mixer tick. Priority is the engine's
 * upper-body machine read off this page's own state: a reload in progress
 * owns the arms; a deploy still raising, or a clamped fire pose inside the
 * shot cycle, holds; otherwise the gait chooses the locomotion loop.
 */
function updateViewmodelAnimation(hw, dt) {
  if (!hw.mixer) return;
  let want;
  if (hw.reload > 0) {
    want = 'reload';
    if (hw.active !== 'reload') {
      // Rescaled so the last frame lands exactly on the magazine swap: the
      // clip is baked at 25 fps against an undeclared authoring rate, and
      // `bakedSpan / reloadTime` — 3.75 for the Thompson — is §11's shipped
      // correction for that one unverified number.
      const span = hw.clips?.reload?.duration
        || hw.actions.reload?.getClip().duration || 0;
      const reloadTime = hw.data?.magazine?.reloadTime || span || 1;
      playViewmodelClip(hw, 'reload',
        { restart: true, timeScale: span ? span / reloadTime : 1 });
    }
  } else if (hw.active === 'deploy' && hw.actions.deploy?.isRunning()) {
    want = 'deploy';
  } else if (hw.active === 'fire' && hw.cool > 0) {
    want = 'fire';
  } else {
    want = LOCO_CLIP[soldier?.gait] || 'idle';
  }
  if (want !== hw.active) playViewmodelClip(hw, want);
  hw.mixer.update(dt);
}

/** Begin a magazine change. True if one actually started. */
function startReload() {
  const hw = handWeapon;
  const magazine = hw?.data?.magazine;
  if (!hw || !magazine || hw.reload > 0 || hw.mags <= 0) return false;
  if (hw.rounds >= magazine.size) return false;
  hw.reload = magazine.reloadTime ?? 2;
  // `FireArms::Reload` calls setZoom(false): a magazine change drops zoom.
  hw.zoomed = false;
  hw.rezoom = 0;
  if (hw.group) guns.setFiring(hw.group, false);
  return true;
}

// --- the shot it makes -------------------------------------------------------
//
// Per-round one-shots from `models/sounds/<Name>.mp3` — the fire sample
// `extract_weapon_sounds.py` picked out of the weapon's own `.ssc`, with the
// authored volume, pitch jitter and time gate riding alongside in
// `weapons.json`. The vehicle guns hold a muted loop and gate it with gain
// because their fire is authored as a loop patch on a vehicle that outlives
// any burst; a hand weapon's round is an event, so each shot gets its own
// BufferSource into one shared bus. Overlap comes free — a Thompson's 0.1 s
// loop cycle at 700 rpm stacks instead of restarting, so rapid fire never
// cuts its own tail off — and the bus follows the master volume from
// updateAudio like every other voice on the page. Decodes go through the
// shared cache, so the one-decode-per-wav rule holds here too.
let weaponSoundsIndex = null;   // promise for models/sounds/weapons.json
let handFireBus = null;         // every hand-shot voice sums here

function weaponSoundsManifest() {
  if (!weaponSoundsIndex) {
    weaponSoundsIndex = fetch(`${MODELS_BASE}/sounds/weapons.json${bust()}`)
      .then(r => (r.ok ? r.json() : null))
      .catch(() => null);
  }
  return weaponSoundsIndex;
}

/** Decode the weapon's fire sample; inert until a shot actually plays it. */
async function loadHandFireSound(hw) {
  const manifest = await weaponSoundsManifest();
  const spec = manifest?.weapons?.[hw.name];
  if (!spec) return;   // a quiet weapon (binoculars), or a mod without the tree
  const buffer = await modelSoundBuffer(`sounds/${spec.file}`);
  // Loading is inert, so a superseded weapon costs nothing; the guard only
  // keeps a slow decode from handing a Thompson its predecessor's report.
  if (buffer && handWeapon === hw) hw.fire = { spec, buffer };
}

function ensureHandFireBus(ctx) {
  if (!handFireBus) {
    handFireBus = ctx.createGain();
    handFireBus.gain.value = masterVolume() * WEAPON_HEADROOM;
    handFireBus.connect(audioListener.getInput());
  }
  return handFireBus;
}

// The active Fire Loop voice, for weapons whose .ssc marks the fire patch
// `loop` + `stop FinishSample`: the engine starts the loop when the trigger
// closes and, on release, lets the playing cycle run out rather than cutting
// it. Web Audio spells FinishSample as `source.loop = false` mid-play — the
// buffer is one authored cycle, so it ends exactly at the boundary.
let handFireLoop = null;

function startHandFireLoop(fire) {
  if (handFireLoop || !fire || !audioListener || masterVolume() <= 0) return;
  const ctx = audioListener.context;
  const source = ctx.createBufferSource();
  source.buffer = fire.buffer;
  source.loop = true;
  // The script's own per-play jitter (`randomStartPitch 0.02/0.01` on the
  // distance layer); the close stereo layer plays straight.
  const gain = ctx.createGain();
  gain.gain.value = Math.min(fire.spec.volume ?? 1, 1);
  source.connect(gain);
  gain.connect(ensureHandFireBus(ctx));
  source.onended = () => {
    try { source.disconnect(); gain.disconnect(); } catch (_) {}
    if (handFireLoop && handFireLoop.source === source) handFireLoop = null;
  };
  try { source.start(); handFireLoop = { source, gain }; } catch (_) {}
}

function releaseHandFireLoop() {
  // FinishSample: the cycle in flight completes, nothing is cut.
  if (handFireLoop) handFireLoop.source.loop = false;
  handFireLoop = null;
}

function playHandFire(fire) {
  if (!fire || !audioListener || masterVolume() <= 0) return;
  const ctx = audioListener.context;
  // A looped fire patch is trigger-held, not per-round: `onShot` only has to
  // make sure the loop is running.
  if (fire.spec.loop) {
    startHandFireLoop(fire);
    return;
  }
  const source = ctx.createBufferSource();
  source.buffer = fire.buffer;
  // The same per-play jitter DICE puts on the loops, applied per shot: a
  // burst reads as many rounds rather than one report stuttering.
  const [up = 0, down = 0] = fire.spec.randomStartPitch || [];
  source.playbackRate.value = 1 + (Math.random() * (up + down) - down);
  const gain = ctx.createGain();
  // The M1's report is authored at volume 10 against the game mixer's own
  // headroom; Web Audio has none to give, so the manifest keeps the authored
  // number and the clamp lives here, next to the bus that motivates it.
  gain.gain.value = Math.min(fire.spec.volume ?? 1, 1);
  source.connect(gain);
  gain.connect(ensureHandFireBus(ctx));
  source.onended = () => {
    try { source.disconnect(); gain.disconnect(); } catch (_) {}
  };
  // `delay` is the script's own `Volume <- Time` gate — the knife's swish
  // lands 0.4 s into the swing, and starting it early would un-author that.
  try { source.start(ctx.currentTime + (fire.spec.delay || 0)); } catch (_) {}
}

// Every round the soldier's own gun fires: the report plays, the magazine
// empties, the cone blooms, and the view kicks. `onShot` fires for vehicle
// guns too, so the group is checked first.
guns.onShot = group => {
  const hw = handWeapon;
  if (!hw || group !== hw.group) return;
  playHandFire(hw.fire);
  // The arms answer the round: fire is a one-shot per shot, near-snapped in
  // and clamped on its last frame so a burst holds the pose between rounds
  // (a 0.028 s clip against the 0.1 s cycle — §11).
  playViewmodelClip(hw, 'fire', { restart: true, fade: VIEWMODEL_FIRE_FADE });
  if (Number.isFinite(hw.rounds)) hw.rounds = Math.max(0, hw.rounds - 1);
  hw.model.onShot();
  hw.cool = 1 / (hw.data?.roundOfFire || 1);
  // `UnZoomBetweenFireTime > 0` (the snipers' 3.0): the fire path flags it
  // and `FireArms::handleUpdate` un-zooms, then re-zooms when the timer
  // runs out — the bolt-cycle un-zoom. The toggle latch itself holds.
  const unzoom = hw.data?.zoom?.unZoomBetweenFire;
  if (unzoom > 0 && hw.zoomed) hw.rezoom = unzoom;
  // `setRecoil*`: degrees per shot, sampled uniformly inside the declared
  // range (Thompson up 0.21..0.25, leftRight -0.1..0.1) and written into the
  // soldier's own look state, unscaled — the pitch clamp catches a long
  // burst the same way it catches the mouse.
  const recoil = hw.data?.recoil;
  if (recoil && soldier) {
    const draw = range => {
      if (!range) return 0;
      const lo = Math.min(range[0], range[1]);
      return lo + Math.random() * (Math.max(range[0], range[1]) - lo);
    };
    soldier.look(draw(recoil.leftRight) * DEG_TO_RAD,
                 draw(recoil.up) * DEG_TO_RAD);
  }
};

/**
 * One frame of the weapon: aim blend and FOV, deviation state, the reload
 * clock, the trigger, and the HUD. Runs from `onFoot` after the camera pose
 * is final, and before `guns.advance` fires this frame's rounds.
 */
function footFire(dt, input = null) {
  const hw = handWeapon;
  // Drained even bare-handed, or the first frame holding a weapon would see
  // every radian turned since it was picked up.
  const lookX = dt > 0 ? footLookX / dt : 0;
  const lookY = dt > 0 ? footLookY / dt : 0;
  footLookX = 0;
  footLookY = 0;
  if (!hw) return;
  guns.firstPerson = true;   // the 0.4 m `em_1P_*` sprite, not the 1.76 m mesh

  // The sniper bolt-cycle un-zoom window counts down here; when it empties,
  // the still-set toggle latch zooms the view back in on its own.
  if (hw.rezoom > 0) hw.rezoom = Math.max(0, hw.rezoom - dt);
  const zoomed = isZoomed();

  // Two fields of view, as the engine keeps them. `zoom.soldierFov`
  // (`SoldierZoomFov`, a factor: the Mp40's 0.9 barely leans in, the
  // Thompson's 0.6 commits) belongs to the ARMS: `BFSoldier::applyFovModifier`
  // multiplies it into `set1pFov` and hands the product to every
  // first-person part through `setFirstPersonFov` (0x004f7120). It eases
  // `0.7·cur + 0.3·target` per visual frame and snaps within 0.001 —
  // `BFSoldier::handleVisualUpdate`, no dt, frame-rate dependent by design.
  // The near pass in frame() draws the rig with it.
  const fovTarget = zoomed ? (hw.data?.zoom?.soldierFov ?? 1) : 1;
  hw.fovCur = Math.abs(fovTarget - hw.fovCur) <= FOV_SNAP
    ? fovTarget
    : 0.7 * hw.fovCur + 0.3 * fovTarget;
  // The world camera is the other: zoom switches it to the weapon's
  // `zoomFov`, a whole field of view in the unit `renderer.fieldOfView 1`
  // uses (radians; the Thompson's 0.5 = 28.6°, a sniper's 0.1 = 5.7°), and
  // back to FOOT_FOV. INFERRED [zoomFov unit]: read off the vehicleFov path
  // (`Camera::setVehicleFOV` replaces the render view's FOV wholesale), not
  // off the camera-mode switch itself, which is a raw-byte read
  // (0x004fc8b6). Whether that side eases or snaps is unread, so it borrows
  // the arms' 0.7/0.3 ease. OPEN [stand-in].
  const worldTarget = zoomed && hw.data?.zoom?.fov
    ? hw.data.zoom.fov / DEG_TO_RAD : FOOT_FOV;
  hw.worldFov = Math.abs(worldTarget - hw.worldFov) <= FOV_SNAP
    ? worldTarget
    : 0.7 * hw.worldFov + 0.3 * worldTarget;
  camera.fov = hw.worldFov;
  camera.updateProjectionMatrix();
  // And displaces the rig from its hip pose to its zoom pose, eased 25% of
  // the remaining distance per visual frame (0.25f, same function, no dt).
  const at = zoomed ? hw.viewZoom : hw.viewHip;
  hw.pos.x += (at.x - hw.pos.x) * VIEW_EASE;
  hw.pos.y += (at.y - hw.pos.y) * VIEW_EASE;
  hw.pos.z += (at.z - hw.pos.z) * VIEW_EASE;
  hw.rig.position.set(hw.pos.x, hw.pos.y, hw.pos.z);
  // A scoped weapon aims through glass this page does not draw yet; hiding
  // the rifle is the half of the scope view the data can already pay for.
  hw.rig.visible = !(hw.data?.zoom?.scope && zoomed);

  // The deviation inputs, named for the engine's PlayerInput channels. Note
  // what is NOT fed: zoom — aiming has no effect on deviation, in either
  // binary. `jumping` gates miscDev; the engine's gate is the c_PIAction
  // input masked by a soldier state bit, and airborne is this page's
  // stand-in for that mask.
  hw.model.update(dt, {
    stance: soldier.stance,
    throttle: input?.forward ?? 0,
    strafe: input?.strafe ?? 0,
    lookX,
    lookY,
    jumping: !soldier.grounded,
  });

  const magazine = hw.data?.magazine;
  if (hw.reload > 0) {
    hw.reload -= dt;
    if (hw.reload <= 0) {
      hw.reload = 0;
      hw.mags -= 1;
      hw.rounds = magazine.size;
    }
  } else if (magazine && hw.rounds <= 0 && hw.mags > 0) {
    // Dry means a magazine change, asked for or not — `autoReload` in the
    // data or no. R merely asks early. Like an asked-for reload, it drops
    // zoom (`FireArms::Reload` -> setZoom(false)).
    hw.reload = magazine.reloadTime ?? 2;
    hw.zoomed = false;
    hw.rezoom = 0;
  }

  if (hw.group) {
    hw.cool = Math.max(0, hw.cool - dt);
    // `__setTrigger` stands in for the mouse under ?shots, where headless
    // Chromium never grants pointer lock — the capture gate would otherwise
    // dead-trigger every harness shot.
    const canFire = (captured || params.has('shots'))
      && hw.reload <= 0 && hw.rounds > 0;
    if (hw.data?.fireOnce) {
      // Semi-auto: one queued click becomes exactly one frame of trigger,

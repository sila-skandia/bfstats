// ~2 s after the last input matches the retail rhythm of scroll-and-fade.
const WEAPON_BAR_MS = 2000;
let weaponBarUntil = 0;     // performance.now() deadline for the weapon bar
// The weapon-bar icon variable names, built once (rule 5: nothing per frame).
const WEAPON_ICON_VARS = Array.from({ length: 8 },
  (_, i) => `Weapon/Icon/WeaponIcon${i + 1}`);

/** The kit the level binds to `flag.team`'s chosen row, as slots. Null where
 *  `_shared/loadouts.json` is absent, does not know the level, or does not
 *  know the kit — the same "no data, fall back" shape `kitLoadout` has. */
function kitSlotsFor(flag) {
  const { kit } = kitLoadout(flag?.team, deployKit);
  const weapons = kit ? loadouts?.kits?.[kit]?.weapons : null;
  return Array.isArray(weapons) && weapons.length ? weapons : null;
}

/** Which slot number `template` occupies in `slots`, or null. Case-insensitive:
 *  the kit files and the weapons' own `create` lines disagree on casing. */
function slotOf(slots, template) {
  const want = String(template || '').toLowerCase();
  const found = slots.find(entry => entry.weapon.toLowerCase() === want);
  return found ? found.slot : null;
}

/** Raise the weapon in `slot` (1..N) — the engine's
 *  `c_PIMenuSelect<slot>` (`c_PIWeaponSelect1..6` on the MemeFile side).
 *  Selecting the slot already in hand is a no-op, like the engine's. */
function selectKitWeapon(slot) {
  if (!optOnFoot.checked || !soldier || optPilot.checked) return false;
  const entry = kitWeaponSlots?.find(w => w.slot === slot);
  if (!entry) return false;
  weaponBarUntil = performance.now() + WEAPON_BAR_MS;
  if (entry.slot === handSlot) return true;
  handSlot = entry.slot;
  loadHandWeapon(entry.weapon, soldierTemplateFor({ team: deployTeamId }));
  return true;
}

/** Scroll the inventory one entry `dir`(+1/-1) through slot order, wrapping —
 *  the wheel's own behaviour in the game. */
function cycleKitWeapon(dir) {
  if (!kitWeaponSlots || kitWeaponSlots.length < 2) return false;
  const order = kitWeaponSlots.map(w => w.slot);
  const at = order.indexOf(handSlot ?? order[0]);
  const next = order[(at + dir + order.length) % order.length];
  return selectKitWeapon(next);
}

/** Tear down the viewmodel, its gun group and the HUD it owns. */
function disposeHandWeapon() {
  releaseHandFireLoop();
  const hw = handWeapon;
  weaponToken++;
  handWeapon = null;
  clickQueued = false;
  crosshairEl.hidden = true;
  if (!hw) return;
  if (hw.group) {
    guns.setFiring(hw.group, false);
    // Surgical, not `collect(replace: true)`: that would evict a flown
    // aircraft's guns too. Rounds already in the air keep their reference to
    // the group and finish their flight.
    const index = guns.groups.indexOf(hw.group);
    if (index >= 0) guns.groups.splice(index, 1);
  }
  vmRoot.remove(hw.rig);
  // The mixer first, while its bindings still resolve, then the GPU half —
  // a skinned rig also owns bone textures its skeleton has to give back.
  if (hw.mixer) {
    hw.mixer.stopAllAction();
    hw.mixer.uncacheRoot(hw.mixer.getRoot());
  }
  hw.rig.traverse(obj => {
    obj.geometry?.dispose();
    obj.skeleton?.dispose?.();
    for (const m of [obj.material].flat().filter(Boolean)) {
      m.map?.dispose();
      m.dispose();
    }
  });
  // An aim in progress was narrowing the FOV; hand the soldier his own back.
  if (optOnFoot.checked && soldier) {
    camera.fov = FOOT_FOV;
    camera.updateProjectionMatrix();
  }
}

/** Load the seat-pose glb for the active seat, if the seat draws anybody.
 *
 * **Whether an occupant is drawn at all is whether the seat reaches a
 * SeatObject**, and `extras.seat.flags` then says how much of him — see
 * `seat-ik.js`'s `seatBody` for the addresses. A Sherman's driving position
 * declares EntryPoints, a Camera and the turret and no SeatObject, so nobody
 * is drawn there; its hull gunner reaches `ShermanBrowningSeat` with
 * `c_SeatShowHalfBodySoldier`, so the legs are hidden and the torso shows.
 *
 * Which pose is `resolveSeatStates`: the seat's own
 * `seatAnimationUpperBody`/`LowerBody` where it declares them (a Willys
 * passenger's `Ub_PassengerInWilly`), the soldier template's `Ub_SitInVehicle`
 * plus `Lb_SitInVehicle`/`Lb_StandInVehicle` where it does not — which is
 * every driver's seat in the game, and the reason this used to return early
 * and draw nothing.
 *
 * The glb is parented to the global `scene` (not to a node inside the vehicle's
 * tree) to avoid disturbing the VehicleCamera's camera-node lookup, and its
 * world position is synced to the seat node every frame. An AnimationMixer plays
 * the `seat.lower`+`seat.upper` clips the extractor baked in. Visibility
 * follows the camera mode: hidden in cockpit (first-person), shown in every
 * external view (C). */
const seatPoseLoader = new GLTFLoader();
let seatPoseMixer = null;
let seatPoseActions = null;
let seatPoseTarget = null;   // the seat node whose world pose we follow
let seatIkChains = [];       // per-frame arm work, built by `bindSeatIk`
let seatPoseGeneration = 0;  // which load is still the current one

async function loadSeatPose() {
  disposeSeatPose();
  if (!occupancy || !optPilot.checked) return;
  const mine = ++seatPoseGeneration;
  const seat = occupancy.seatInfo(occupancy.activeSeatId);
  const body = seatBody(seat?.seatObjects);
  if (!body.draw) return;             // no SeatObject: the game draws nobody
  const states = resolveSeatStates(seat.seatObjects);
  const soldierName = soldierTemplateFor(
    flags.find(f => f.team === deployTeamId) || { team: deployTeamId });
  const assetFor = name =>
    `${MODELS_BASE}/poses/${soldierName}__${name}.pose.glb${bust()}`;
  let gltf;
  try {
    gltf = await seatPoseLoader.loadAsync(
      assetFor(seatPoseName(states.upperBody, states.lowerBody)));
  } catch {
    // The seat names a state the game never declared, so no glb was written
    // for it. The engine still draws the occupant — see `defaultSeatPoseName`.
    const fallback = defaultSeatPoseName(body.mask);
    try {
      gltf = await seatPoseLoader.loadAsync(assetFor(fallback));
    } catch {
      return;
    }
  }
  // Leaving the seat, or switching to another, while the glb was in flight:
  // `disposeSeatPose` has already run and this scene must not be adopted, or
  // it hangs in the world for ever with nothing left holding a reference.
  if (mine !== seatPoseGeneration) { disposeSeatScene(gltf.scene); return; }
  const soldierScene = gltf.scene;
  try {
    soldierScene.traverse(obj => {
      if (obj.isSkinnedMesh) obj.frustumCulled = false;
    });
    soldierScene.userData.seatPose = true;
    // `c_SeatShowHalfBodySoldier`: the engine hides the pelvis and everything
    // under it rather than swapping in a half model, so the same skinned mesh
    // simply loses its legs. Scaling the bone to nothing is the closest a
    // skinned mesh gets to `disableBoneTree` — `visible = false` on a joint
    // does nothing, because the vertices are drawn by the mesh, not the bone.
    if (body.halfBody) hideBelowPelvis(soldierScene);

  // The SeatObject node (e.g. `WillyPassengerSeat`) is the *sit* position; an
  // EntryPoint is the door where the soldier spawns on enter. Sync to the
  // SeatObject's world pose every frame so the rider moves with the vehicle
  // without polluting the vehicle's node tree (which VehicleCamera traverses).
  seatPoseTarget = seat.seatObjects?.[0] || seat.node;
  if (seatPoseTarget) {
    seatPoseTarget.getWorldPosition(soldierScene.position);
    seatPoseTarget.getWorldQuaternion(soldierScene.quaternion);
  } else {
    soldierScene.position.set(0, 0, 0);
  }
  scene.add(soldierScene);
  seatSoldier = soldierScene;
  seatSoldier.visible = !view?.firstPerson;
  // The helmet. A BFSoldier template declares a body, a head and two hands and
  // nothing else, so the exported soldier is bare-headed; the helmet belongs
  // to the kit the player deployed with and hangs off bone `A`. The driver in
  // `models-work/willy-hands-wheel.png` is wearing one.
  dressSeatOccupant(soldierScene, seat).catch(err =>
    console.warn('seat kit:', err));

  // Play the lower + upper seat clips the extractor wrote. They are independent
  // state machines (like gaits), so two actions at full weight compose.
  const clips = gltf.animations || [];
  const lowerClip = THREE.AnimationClip.findByName(clips, 'seat.lower');
  const upperClip = THREE.AnimationClip.findByName(clips, 'seat.upper');
  if (lowerClip || upperClip) {
    seatPoseMixer = new THREE.AnimationMixer(soldierScene);
    seatPoseActions = {};
    if (lowerClip) {
      seatPoseActions.lower = seatPoseMixer.clipAction(lowerClip);
      seatPoseActions.lower.play();
    }
    if (upperClip) {
      seatPoseActions.upper = seatPoseMixer.clipAction(upperClip);
      seatPoseActions.upper.play();
    }
  }
  bindSeatIk(seat, soldierScene, clips);
  } catch (err) {
    console.error('loadSeatPose:', err);
  }
}

// `models/kits.json`, fetched once: which worn meshes each kit hangs off which
// bone. `kits.html` browses the same file; the graft convention itself lives in
// `kit-graft.js` so both read it from one place.
let kitManifest = null;
const kitPartCache = new Map();

async function kitsIndex() {
  if (!kitManifest) {
    kitManifest = fetch(`${MODELS_BASE}/kits.json${bust()}`)
      .then(r => (r.ok ? r.json() : null))
      .then(kitsByTemplate, () => new Map());
  }
  return kitManifest;
}

async function loadKitPart(glb) {
  if (!kitPartCache.has(glb)) {
    kitPartCache.set(glb, seatPoseLoader
      .loadAsync(`${MODELS_BASE}/${glb}${bust()}`)
      .then(g => g.scene, () => null));
  }
  return kitPartCache.get(glb);
}

/** Hang the deploy kit's worn meshes on the seated soldier's own bones.
 *
 * Only the seated occupant for now: the spawn-pad soldiers and the on-foot
 * player load the same bare pose glbs and are bare-headed too, and dressing
 * all three is the same call in three more places once someone wants it. */
async function dressSeatOccupant(soldierScene, seat) {
  const index = await kitsIndex();
  const { kit: kitName } = kitLoadout(deployTeamId, deployKit);
  const kit = kitName && index.get(String(kitName).toLowerCase());
  if (!kit) return;
  for (const graft of wornGrafts(kit)) {
    // The seat may have been left while the part was in flight.
    if (soldierScene !== seatSoldier) return;
    const source = await loadKitPart(graft.glb);
    if (!source || soldierScene !== seatSoldier) return;
    const bone = findBoneMatching(soldierScene, graft.bone);
    if (!bone) continue;          // no such bone on this figure: silently bare
    const node = source.clone(true);
    node.quaternion.set(...graft.quaternion);
    node.position.set(...graft.position);
    node.userData.seatKitPart = true;
    node.traverse(obj => { if (obj.isMesh) obj.frustumCulled = false; });
    bone.add(node);
  }
}

/** `c_SeatShowHalfBodySoldier` — `setUseSeat` hides `Bip01 Pelvis` and its
 *  subtree. */
function hideBelowPelvis(soldierScene) {
  const pelvis = findBone(soldierScene, 'Bip01 Pelvis');
  if (pelvis) pelvis.scale.setScalar(1e-4);
}

/** A bone by name, tolerant of the underscore/space spellings the data mixes. */
const boneKey = name => String(name).toLowerCase().replace(/[_\s]+/g, ' ').trim();
function findBone(root, name) {
  const want = boneKey(name);
  let found = null;
  root.traverse(obj => { if (!found && boneKey(obj.name) === want) found = obj; });
  return found;
}

/** The same, for a bone the kit manifest names (`A`, `backpack`, `HipPack`). */
function findBoneMatching(root, want) {
  const pattern = bonePattern(want);
  let found = null;
  root.traverse(obj => { if (!found && pattern.test(obj.name)) found = obj; });
  return found;
}

/** Build the per-frame IK work for one seat: every `extras.skeletonIK` node
 *  this seat owns, paired with the arm chain it drives.
 *
 * Scoped by the same `control` tag `surveyVehicle` buckets seats with, so a
 * Sherman gunner's Browning does not pull the driver's hands and vice versa.
 * The chain is the bone's two ancestors — the engine's own `i-1` and `i-2`
 * (`applyIK2BoneSolver` reads the bone array at negative offsets, 232 bytes
 * apart), which for `Bip01 R Hand` is the forearm and the upper arm. */
function bindSeatIk(seat, soldierScene, clips) {
  seatIkChains = [];
  if (!seat?.node || !soldierScene) return;
  // Which bones the seat clips re-pose every frame. Those need no restoring:
  // the mixer overwrites last frame's IK before this frame's runs. A bone no
  // clip touches does need it, or the deltas compound (a pose file that
  // resolved only `seat.lower` would wind the arms off the model in seconds).
  const driven = new Set();
  for (const clip of clips || []) {
    for (const track of clip.tracks || []) {
      driven.add(boneKey(track.name.slice(0, track.name.lastIndexOf('.'))));
    }
  }
  const owners = [];
  seat.node.traverse(obj => {
    if (!obj.userData?.skeletonIK) return;
    const owner = obj.userData.control || occupancy?.rootId;
    if (owner === seat.id) owners.push(obj);
  });
  const resolveChild = (node, index, name) =>
    (name && node.children.find(c => c.name === name)) || node.children[index] || null;
  for (const binding of collectIkBindings(owners, resolveChild)) {
    const end = findBone(soldierScene, binding.bone);
    const mid = end?.parent;
    const root = mid?.parent;
    if (!end || !mid || !root) continue;
    seatIkChains.push({
      ...binding, end, mid, root,
      rest: [root, mid, end].map(
        b => (driven.has(boneKey(b.name)) ? null : b.quaternion.clone())),
    });
  }
}

// Scratch, so the three.js half of a frame's IK allocates nothing. The plain
// arrays `seat-ik.js` returns are small and short-lived; what used to cost
// real work each frame was re-baking the rotation triple, and `collectIkBindings`
// now does that once (`prepareIkEntry`).
const _ikPos = new THREE.Vector3();
const _ikScale = new THREE.Vector3();
const _ikQuat = new THREE.Quaternion();
const _ikParent = new THREE.Quaternion();
const _ikInverse = new THREE.Quaternion();
const _ikDelta = new THREE.Quaternion();
const _ikRoot = new THREE.Vector3();
const _ikMid = new THREE.Vector3();
const _ikEnd = new THREE.Vector3();
const _ikA = [0, 0, 0];
const _ikB = [0, 0, 0];
const _ikC = [0, 0, 0];
const toArr = (v, out) => { out[0] = v.x; out[1] = v.y; out[2] = v.z; return out; };

/** Pin each declared bone to its vehicle node's live world pose, once a frame.
 *
 * Called after the seat pose's mixer has stepped and after the vehicle's own
 * rig has been applied, so the wheel is already where this frame put it and
 * the hands follow it round rather than trailing it by a frame.
 *
 * `updateIk` (lnxded `0x08265880`) does the same composition in the soldier's
 * own frame; world space is the same answer and saves inverting a matrix the
 * viewer already has. The arm reaches (`applyIK2BoneSolver`) and the hand is
 * then planted at the declared angle outright (`Skeleton::transform`,
 * `0x8342233`) — both halves, in that order. */
function stepSeatIk() {
  if (!seatIkChains.length || !seatSoldier) return;
  for (const chain of seatIkChains) {
    if (chain.rest[0]) chain.root.quaternion.copy(chain.rest[0]);
    if (chain.rest[1]) chain.mid.quaternion.copy(chain.rest[1]);
    if (chain.rest[2]) chain.end.quaternion.copy(chain.rest[2]);
  }
  seatSoldier.updateMatrixWorld(true);
  for (const chain of seatIkChains) {
    chain.target.updateWorldMatrix(true, false);
    chain.target.matrixWorld.decompose(_ikPos, _ikQuat, _ikScale);
    const target = ikTarget(
      chain.entry,
      [_ikPos.x, _ikPos.y, _ikPos.z],
      [_ikQuat.x, _ikQuat.y, _ikQuat.z, _ikQuat.w]);

    chain.root.getWorldPosition(_ikRoot);
    chain.mid.getWorldPosition(_ikMid);
    chain.end.getWorldPosition(_ikEnd);
    const solve = solveTwoBone(
      toArr(_ikRoot, _ikA), toArr(_ikMid, _ikB), toArr(_ikEnd, _ikC),
      target.position);
    if (solve.degenerate) continue;

    // A world-space rotation applied to a bone whose parent stays put is
    // `local' = parentWorld^-1 * q * parentWorld * local`. Bend the forearm
    // first, then swing the whole arm: the swing was derived from where the
    // hand sits *after* the bend and carries it along rigidly.
    applyWorldDelta(chain.mid, solve.bend);
    applyWorldDelta(chain.root, solve.reach);
    chain.root.updateMatrixWorld(true);

    // And the hand's own orientation is the declared one, not whatever the
    // arm's swing left behind.
    chain.end.parent.getWorldQuaternion(_ikParent);
    _ikQuat.set(target.quaternion[0], target.quaternion[1],
                target.quaternion[2], target.quaternion[3]);
    chain.end.quaternion.copy(_ikParent.invert()).multiply(_ikQuat);
    chain.end.updateMatrixWorld(true);
  }
}

function applyWorldDelta(bone, quat) {
  if (!bone.parent) return;
  bone.parent.getWorldQuaternion(_ikParent);
  _ikInverse.copy(_ikParent).invert();
  _ikDelta.set(quat[0], quat[1], quat[2], quat[3]);
  // parentWorld^-1 * delta * parentWorld, then premultiply onto the local.
  _ikDelta.premultiply(_ikInverse).multiply(_ikParent);
  bone.quaternion.premultiply(_ikDelta);
}

/** Give one loaded seat-pose scene back to the GPU, the same way
 *  `disposeHandWeapon` gives back a weapon rig.
 *
 * A soldier pose is a skinned mesh with its own geometry, materials, textures
 * and bone texture, and entering and leaving a seat loads a fresh one every
 * time. Dropping the reference frees none of that: only `dispose()` does, and
 * a session spent hopping in and out of a jeep used to leak every copy. */
function disposeSeatScene(root) {
  if (!root) return;
  // A grafted kit part is a `clone(true)` of a cached scene, so its geometry
  // and materials belong to `kitPartCache` and are still wanted by the next
  // occupant. Unhook those first; only the pose's own meshes are freed.
  const borrowed = [];
  root.traverse(obj => { if (obj.userData?.seatKitPart) borrowed.push(obj); });
  for (const node of borrowed) node.removeFromParent();
  root.traverse(obj => {
    obj.geometry?.dispose();
    obj.skeleton?.dispose?.();
    for (const m of [obj.material].flat().filter(Boolean)) {
      m.map?.dispose();
      m.dispose();
    }
  });
  root.removeFromParent?.();
  if (root.parent) root.parent.remove(root);
}

function disposeSeatPose() {
  // Any load still in flight is now stale. `loadSeatPose` is not awaited at
  // its call sites, so leaving the vehicle before the glb arrives used to let
  // the finished load adopt itself into an empty world: a soldier sitting in
  // mid-air over the spot the jeep was, holding a reference nothing would ever
  // drop. Bumping the generation here is what makes that load discard itself.
  seatPoseGeneration++;
  // The mixer first, while its bindings still resolve, then the GPU half.
  if (seatPoseMixer) {
    seatPoseMixer.stopAllAction();
    seatPoseMixer.uncacheRoot(seatPoseMixer.getRoot());
    seatPoseMixer = null;
  }
  seatPoseActions = null;
  seatPoseTarget = null;
  seatIkChains = [];
  if (seatSoldier) {
    disposeSeatScene(seatSoldier);
    seatSoldier = null;
  }
}

function updateSeatPoseVisibility() {
  if (seatSoldier) {
    seatSoldier.visible = !view?.firstPerson;
  }
}

/** Load the weapon into hand — the arms rig where one is extracted for
 *  `soldierName` holding it, the bare `name`.glb where not — hang it off the
 *  camera-following `vmRoot` and index its gun. The template name must not be called `soldier`:
 *  that would shadow the live soldier the guard and `platformVelocity` read. */
async function loadHandWeapon(name, soldierName = null) {
  disposeHandWeapon();
  const token = weaponToken;
  // Kicked off now, in parallel with the (usually much bigger) visual load
  // below, rather than after `hw` exists: a JSON manifest plus one small mp3
  // almost always resolves before a rigged, textured glb does, so by the
  // time a soldier can even pull the trigger — which needs `hw` published,
  // which needs the glb below to finish first — the report is normally
  // already decoded. Sequencing it after `hw` (the previous shape of this
  // function) meant the fetch for a weapon's very first equip in the session
  // hadn't even started yet when firing became possible; a shot taken in
  // that window played the round but not its sound, on every hand weapon —
  // reproduced headless on the Garand, No4, Type5 and Thompson alike, worse
  // on Wake's Marine Garand once it gained its own first-person rig (a much
  // bigger fetch to queue behind) via the kit-loadout fix.
  const firePromise = fetchHandFireSound(name);
  let gltf = null;
  let fp = false;
  // The arms first: §11's `<Soldier>__<Weapon>.fp.glb`, sleeves and hands
  // welded around the weapon with the six clip families baked in. A pairing
  // without one falls through to the bare weapon, which works as it did.
  const rigFile = viewmodelRigFor(name, soldierName);
  if (rigFile) {
    try {
      gltf = await loader.loadAsync(
        `${MODELS_BASE}/viewmodels/${rigFile}.fp.glb${bust()}`);
      fp = true;
    } catch { /* the bare path below */ }
  }
  if (!gltf) {
    try {
      gltf = await loader.loadAsync(`${MODELS_BASE}/${name}.glb${bust()}`);
    } catch {
      // A `?weapon=` naming nothing extracted, or a mod tree without the glb:
      // on foot bare-handed, which already worked.
      return null;
    }
  }
  if (token !== weaponToken || !optOnFoot.checked || !soldier) return null;
  // A bare 3P weapon ships its collision hulls as drawable siblings of the
  // visual mesh — the grenade's "Complex collision" box in the green
  // `defense material` read as soldier armour riding along with the weapon.
  // The fp rigs never carry hulls; the bare fallback hides them, the way the
  // level path's own cull treats collision nodes (`isCollision`, above).
  if (!fp) {
    gltf.scene.traverse(obj => {
      if (isCollision(obj)) obj.visible = false;
    });
  }
  // Document-level extras land on `gltf.userData` (GLTFLoader's
  // `assignExtrasToUserData(result, json)`); the fallbacks cover a vendored
  // loader that files them elsewhere. The fp rig spells its armoury block
  // `weaponStats` — the same shape the bare glb calls `weapon`, and
  // everything downstream reads it through `hw.data` without caring.
  const doc = (Object.keys(gltf.userData ?? {}).length ? gltf.userData : null)
    ?? gltf.parser?.json?.extras ?? {};
  const data = fp
    ? doc.weaponStats ?? null
    : doc.weapon ?? gltf.scene?.userData?.weapon ?? null;
  // Where the rig hangs in camera space: `center1pHands`, read from the
  // extras and not retyped — the engine's base vector, added to the eased
  // weapon offset ahead of the camera transform (the chain above). Its
  // −1.56 puts the skeleton root 1.56 m below the eye and, with the rest
  // pose the exporter bakes under the arms, the head bone 2 cm under the
  // eye: sleeves at the bottom of the frame, weapon raked up-forward. The
  // bare fallback keeps the eyeballed VIEWMODEL_BASE; only it needs one.
  const hands = fp ? doc.view?.center1pHands : null;
  const base = hands
    ? { x: hands[0], y: hands[1], z: -hands[2] }
    : VIEWMODEL_BASE;
  // `set1pFov`, radians, from the same extras: the whole vertical angle the
  // engine bakes into each first-person part's own projection (the near
  // pass in frame() says what becomes of it).
  const fov1p = fp ? (doc.view?.fov1p ?? null) : null;
  // The rig's two authored poses, camera space. Refractor's z is forward,
  // three's camera looks down -z, so z is negated; a weapon that declares no
  // `soldierCameraPosition` (the Bazooka) sits at the base alone, and one
  // with no `soldierZoomPosition` zooms to its hip pose.
  const toCamera = v => ({
    x: base.x + (v?.[0] ?? 0),
    y: base.y + (v?.[1] ?? 0),
    z: base.z - (v?.[2] ?? 0),
  });
  const viewHip = toCamera(data?.view?.cameraPosition);
  const viewZoom = data?.view?.zoomPosition
    ? toCamera(data.view.zoomPosition) : viewHip;
  const rig = new THREE.Group();
  rig.name = `${name} viewmodel`;
  rig.position.set(viewHip.x, viewHip.y, viewHip.z);
  // The fp rig stands +Y up with its arms extending along +Z, and a three.js
  // camera looks down −Z: half a revolution about Y turns the arms into the
  // view (§11 step 1) — the whole of the engine's rotate90aroundX once the
  // exporter's Z-up-to-Y-up pitch and the glTF handedness flip are taken
  // out. Nothing else rotates it. The bare weapon glbs are authored
  // view-ready.
  if (fp) gltf.scene.rotation.y = Math.PI;
  rig.add(gltf.scene);
  // The whole rig lives on the near layer, drawn by frame()'s second pass
  // over cleared depth. Culling goes with it: skinned bounds computed at
  // bind pose lie about where animated sleeves actually are, and a rig this
  // small is cheaper to draw than to test.
  rig.traverse(obj => {
    obj.layers.set(VIEWMODEL_LAYER);
    if (obj.isMesh) obj.frustumCulled = false;
  });
  // The additive mark the exporter leaves on flash and glow materials. The
  // model browser applies it model-wide at load and `GunFire.collect` applies
  // it to the emitter clones it makes; this covers whatever additive surface
  // is neither (a sight glow on the gun body itself).
  gltf.scene.traverse(obj => {
    if (!obj.isMesh) return;
    for (const m of [obj.material].flat().filter(Boolean)) {
      if (!m.userData?.additive) continue;
      m.blending = THREE.AdditiveBlending;
      m.transparent = true;
      m.depthWrite = false;
      m.needsUpdate = true;
    }
  });
  vmRoot.add(rig);
  // The load can resolve after its owner has already climbed into a seat —
  // spawn beside a jeep and press E inside the fetch — and a viewmodel must
  // not materialise over a windscreen. `exitVehicle` shows it again.
  rig.visible = !(optPilot.checked && (aircraft || car));
  // Hidden again until its programs are linked, its textures and its bone
  // textures are on the GPU and each program has had its first use: the
  // arms, the flash emitters `collect` clones below and the baked streak all
  // warm here, in one parallel batch, against the near pass's own scene and
  // camera, rather than one at a time on the frame that first draws each —
  // three's first-use shader check blocks that frame on the link
  // (features/mesh-viewer-performance, rule 6). The seat is checked again
  // when the warm-up lands, for the same reason as above.
  const armsShown = rig.visible;
  rig.visible = false;
  warmups.rig = warmSubtree(rig, vmCamera, vmScene).then(() => {
    if (token !== weaponToken) return;
    rig.visible = armsShown && !(optPilot.checked && (aircraft || car));
  });
  // The six baked families become mixer actions. Locomotion loops; one-shots
  // clamp on their last frame. Fire follows the ASM loop bit in extras
  // (Thompson Looping vs sniper PlayOnce) — ANIM-7 / T2.
  let mixer = null;
  const actions = {};
  let fireVariants = [];
  if (fp && gltf.animations?.length) {
    mixer = new THREE.AnimationMixer(gltf.scene);
    const clipExtras = doc.clips ?? {};
    for (const clip of gltf.animations) {
      const action = mixer.clipAction(clip);
      const meta = clipExtras[clip.name];
      // ANIM-7: fire→StandReload (returnTo) is PlayOnce even if a stale
      // extract still wrote loop=true (No4Sniper / K98Sniper).
      let loop = meta?.loop ?? LOCO_LOOP.has(clip.name);
      if (clip.name === 'fire' && /reload/i.test(meta?.returnTo || '')) {
        loop = false;
      }
      if (loop) {
        action.setLoop(THREE.LoopRepeat, Infinity);
      } else {
        action.setLoop(THREE.LoopOnce, 1);
        action.clampWhenFinished = true;
      }
      actions[clip.name] = action;
    }
    // Fire one-shots beyond the lone `fire` family: the knife's aim state
    // registers five swings (ANIM-6's c_AsmRandom — `rand() % n` on every
    // entry into the fire state) and the extractor bakes them as
    // `fire1..fireN`. `onShot` rolls the per-round pick; selection
    // (viewmodel-anim.js) only keeps the swing and releases it to loco.
    fireVariants = Object.keys(actions).filter(k => /^fire\d+$/.test(k))
      .sort((a, b) => Number(a.slice(4)) - Number(b.slice(4)));
  }
  const magazine = data?.magazine || null;
  // The idle fidgets this rig baked (`idle1..idleN` — §11's `addIdle`
  // families): the names in slot order, the ANIM-6 dwell clock, and the
  // fidget currently owning the arms.
  const fidgetNames = fp
    ? Object.keys(doc.clips ?? {}).filter(k => /^idle\d+$/.test(k))
        .sort((a, b) => Number(a.slice(4)) - Number(b.slice(4)))
    : [];
  // The `<weapon> grip` node — the weapon itself, welded under the hand, with
  // the arms and sleeves as its siblings rather than its children. It is what
  // `hideDuringFireTime` hides: the engine's `FireArms::Fire` blanks the
  // weapon's own visual for that long from the shot and `handleUpdate` restores
  // it at expiry (lnxded 0x0828a090 / 0x08288890), which is how the grenade
  // leaves the palm at the instant the thrown one appears. Only the four
  // weapons that let go of what they hold declare a time, so on everything
  // else this node is found and never touched.
  let weaponNode = null;
  if (fp) rig.traverse(obj => { if (obj.userData?.weldBone) weaponNode = obj; });
  const hw = {
    name, data, rig,
    soldier: soldierName,  // whose sleeves were asked for
    rigFile: fp ? rigFile : null,   // the arms rig that answered, if one did
    fov1p,                 // `set1pFov` in radians, or null for a bare weapon
    mixer, actions,        // the arms rig's state machine; both empty when bare
    fireVariants,          // the fire one-shot variants (`fire1..fireN`), when the
                           // weapon's aim state registers several (the knife)
    clips: fp ? doc.clips ?? null : null,   // per-family frames/speed/span extras
    active: null,          // the clip currently owning the arms
    fidgetNames,           // baked idle fidget families (`idle1..idleN`)
    fidget: null,          // the fidget selected/playing, or null
    fidgetTimer: null,     // seconds left of the ANIM-6 dwell, null = parked
    group: null,
    // The loaded magazine plus the spares. `magazines 5` is read as the
    // total carried, which is how the game's HUD counts them. A negative
    // `magSize` is the engine's unlimited ammo (the knife's -1): rounds goes
    // to Infinity so the trigger gate and the reload checks read it plainly.
    rounds: magazine ? (magazine.size >= 0 ? magazine.size : Infinity) : Infinity,
    mags: magazine ? Math.max((magazine.magazines ?? 1) - 1, 0) : 0,
    reload: 0,       // seconds left of a reload in progress
    reloadPlayed: false,  // the arms' reload clip has been started for this magazine
    cool: 0,         // seconds until a semi-auto weapon has cycled
    weaponNode,      // the welded weapon inside the rig, or null when bare
    hideFire: 0,     // seconds of `hideDuringFireTime` left on the weapon mesh
    throwWind: 0,    // seconds of `fireDelay` wind-up left before the round leaves
    throwBegun: false,  // the wind-up already played this round's clip and report
    pulse: false,    // a one-frame trigger pulse is in flight
    fire: null,      // { spec, buffer } once firePromise (above) resolves
    fireRetry: false, // the shot path has already asked again for a missing report
    zoomed: false,   // the press-toggle latch (`altFireOnce`)
    rezoom: 0,       // seconds of `UnZoomBetweenFireTime` un-zoom left
    fovCur: 1,       // the eased ARMS FOV factor, 1 hip .. `zoom.soldierFov` zoomed
    worldFov: FOOT_FOV,   // the eased world FOV, degrees, FOOT_FOV .. `zoom.fov` zoomed
    viewHip, viewZoom,
    pos: { ...viewHip },   // the eased rig offset, chasing hip or zoom
    model: new DeviationModel({ deviation: data?.deviation }),
  };
  if (data) {
    const found = guns.collect(rig, {
      replace: false,          // the flown aircraft's guns must survive this
      speedScale: 1,           // real muzzle velocity, like the pilot path
      maxRange: 1200,
      roundLifetime: 'data',
      platformVelocity: () => (soldier ? soldier.body.velocity : null),
      // `fireInCameraDof 1`: the round leaves the eye down the view axis and
      // the muzzle node only places the flash. All 25 armed hand weapons
      // declare it; a mod one that does not falls back to its muzzle.
      aimRay: data.fireInCameraDof ? () => {
        camera.getWorldPosition(aimOrigin);
        camera.getWorldDirection(aimDirection);
        // A thrown weapon leaves the hand, not the bridge of the nose. The
        // direction stays the view axis (`fireInCameraDof`), so it still lands
        // where the crosshair says to within the hand's own 0.4 m; only where
        // the round first appears moves, to where the fire clip has the fist
        // at its release frame — up-right of centre and an arm's length out.
        // Presentation, and named as such: the engine's own origin is the eye.
        if (data.throw?.fireDelay > 0) {
          aimOrigin.add(throwHand.copy(THROW_RELEASE).applyQuaternion(camera.quaternion));
        }
        return { origin: aimOrigin, dir: aimDirection };
      } : null,
      spreadDeg: () => (handWeapon ? handWeapon.model.current() : 0),
    });
    hw.group = found[0] || null;
  }
  handWeapon = hw;
  if (mixer && actions.idle) {
    // Idle underneath from the first frame — the breathing sway, slow enough
    // at its declared 0.1x to read as stillness — and the raise over it:
    // §11's deploy one-shot on spawn.
    actions.idle.play();
    hw.active = 'idle';
    playViewmodelClip(hw, 'deploy', { restart: true });
  }
  // The fetch has been in flight since the top of this function; attach it
  // to `hw` whenever it lands. The guard is the load token, not
  // `handWeapon === hw`: a report that beats the glb home would otherwise be
  // dropped for the very weapon about to be published, while the token still
  // keeps one from landing on a weapon the soldier has already swapped away
  // from.
  firePromise.then(fire => { if (fire && weaponToken === token) hw.fire = fire; });
  return hw;
}

/** The right weapon for `flag` and the chosen kit, loaded only if it is not
 *  already in hand — in the right sleeves: a redeploy across the team line
 *  with the same weapon still changes soldier, so the rig is compared too.
 *  Also (re)arms the kit-rotation slots: the spawned kit's inventory, with
 *  the slot in hand matching whatever `weaponTemplateFor` picked (slot 3 on
 *  a normal spawn, `?weapon=`'s own slot under the override). */
function ensureHandWeapon(flag) {
  kitWeaponSlots = kitSlotsFor(flag);
  const name = weaponTemplateFor(flag);
  handSlot = kitWeaponSlots ? slotOf(kitWeaponSlots, name) : null;
  const who = soldierTemplateFor(flag);
  if (handWeapon?.name === name
      && (handWeapon.rigFile || null) === (viewmodelRigFor(name, who) || null)
      && (!handWeapon.group || guns.groups.includes(handWeapon.group))) {
    // Same weapon, new life: the raise plays again on every spawn.
    playViewmodelClip(handWeapon, 'deploy', { restart: true });
    return;
  }
  loadHandWeapon(name, who);
}

// Walk/run are one baked clip at two rates (§11). Crouch/prone fall back to
// idle until those families are baked. LOCO_CLIP lives in viewmodel-anim.js.
const LOCO_LOOP = new Set(['idle', 'walk', 'run']);

/**
 * Bring `name` to full weight and fade whatever held the arms before it.
 * Loops keep their phase across a fade-out — a walk cycle returned to
 * mid-burst has not restarted — and one-shots pass `restart` to rewind.
 * Silently a no-op for the bare-weapon fallback, which has no mixer.
 */
/** Seconds the engine takes to blend into `name`: 1 / its state's morph factor. */
function viewmodelFade(hw, name) {
  const factor = hw?.clips?.[name]?.morphFactor ?? VIEWMODEL_MORPH_DEFAULT;
  return factor >= VIEWMODEL_MORPH_SNAP || factor <= 0 ? 0 : 1 / factor;
}

function playViewmodelClip(hw, name, { restart = false, timeScale = 1,
                                       fade = viewmodelFade(hw, name) } = {}) {
  const to = hw?.actions?.[name];
  if (!to || !hw.mixer) return false;
  if (hw.active === name && !restart) return true;
  const from = hw.active && hw.active !== name ? hw.actions[hw.active] : null;
  if (restart) to.reset();
  to.setEffectiveTimeScale(timeScale);
  to.enabled = true;
  to.play();
  if (from) {
    // Idle settles in ~1.4 s (morphFactor 0.7). crossFadeFrom alone would
    // leave LoopRepeat fire evaluating — and shaking — for that whole fade.
    // The engine leaves the fire state; freeze fire's clock so the last pose
    // holds while idle/walk morphs in. Reload already snaps via fade === 0.
    const leavingLoopFire = hw.active === 'fire'
      && from.loop === THREE.LoopRepeat;
    if (leavingLoopFire) from.setEffectiveTimeScale(0);
    if (fade > 0) {
      to.crossFadeFrom(from, fade, false);
    } else {
      from.stop();
      to.setEffectiveWeight(1);
    }
  } else if (restart) {
    to.setEffectiveWeight(1);
  }
  hw.active = name;
  return true;
}

/**
 * The clip this frame owes, then the mixer tick. Selection is
 * `wantViewmodelClip` (viewmodel-anim.js): looping fire follows the trigger
 * latch, PlayOnce finishes its punch, bolt rifles ANIM-7 into StandReload.
 * Never hold fire for the ROF `cool` window (that was the sniper dip).
 */
function updateViewmodelAnimation(hw, dt) {
  if (!hw.mixer) return;
  // The fire action whose clock matters: the lone `fire`, or — the knife —
  // whichever registered swing currently owns the arms.
  const fireVariant = hw.fireVariants.includes(hw.active) ? hw.active : null;
  const fireAction = hw.actions[fireVariant ?? 'fire'];
  const fireRunning = !!(fireAction && fireAction.isRunning());
  const fireReturnsToReload = /reload/i.test(hw.clips?.fire?.returnTo || '');
  // `Ub_StandResetRaiseWeapon<W>` — the thrown weapons' returnTo, where a
  // rifle's is StandReload. Raising the next grenade is its reload.
  const fireReturnsToDeploy = /raiseweapon/i.test(hw.clips?.fire?.returnTo || '');
  // Looping fire (Thompson / BAR) — not bolt rifles whose returnTo is
  // StandReload even when a stale extract still marks fire.loop true.
  const fireLoops = !!(hw.clips?.fire?.loop) && !fireReturnsToReload;
  // LoopOnce + clampWhenFinished leaves the action scheduled but paused;
  // isRunning() is false then, which used to drop the reload keep-alive.
  const reloadAction = hw.actions.reload;
  const reloadRunning = !!(reloadAction
    && (typeof reloadAction.isScheduled === 'function'
      ? reloadAction.isScheduled()
      : reloadAction.isRunning()));
  // The idle-fidget dwell (ANIM-6, read out of `AnimationStateMachine::
  // updateState` / `AnimationState::checkTransitions`): entering a state
  // parks its timer at 1000 s and `updateState` re-arms it at
  // `(rand & 3) + 4.0` s — 4..7 s — expiry picks `rand() % n` among the
  // states the aim state registered through `addIdle`. Only the aim state
  // has a timer, so the clock runs while idle is what holds the arms and the
  // soldier stands still, and anything else (fire, reload, deploy, any gait
  // off stand) parks it again. The fidget itself is a one-shot (LoopOnce,
  // clamped): when it stops running, selection returns idle and the clock
  // re-arms a fresh dwell — the engine's own rhythm, one fidget every 4-7 s
  // of stillness.
  if (hw.active === 'idle' && soldier?.gait === 'stand' && hw.fidgetNames.length
      && hw.actions[hw.fidgetNames[0]]) {
    if (hw.fidgetTimer == null) hw.fidgetTimer = 4 + Math.random() * 3;
    hw.fidgetTimer -= dt;
  } else {
    hw.fidgetTimer = null;
    // An interruption that did not go through selection (a shot's direct
    // playViewmodelClip, a seat) leaves the fidget chosen but unowned.
    if (hw.fidget && hw.active !== hw.fidget) hw.fidget = null;
  }
  const fidgetAction = hw.fidget ? hw.actions[hw.fidget] : null;
  const decision = wantViewmodelClip({
    reload: hw.reload,
    reloadPlayed: hw.reloadPlayed,
    reloadRunning,
    deployRunning: !!hw.actions.deploy?.isRunning(),
    active: hw.active,
    fireRunning,
    fireLoops,
    fireReturnsToReload,
    fireReturnsToDeploy,
    firing: !!hw.group?.firing,
    hasFire: !!fireAction,
    fireVariants: hw.fireVariants.length ? hw.fireVariants : null,
    hasReload: !!hw.actions.reload,
    hasDeploy: !!hw.actions.deploy,
    gait: soldier?.gait,
    fidget: hw.fidget,
    fidgetRunning: !!(fidgetAction && fidgetAction.isRunning()),
    fidgetDue: hw.fidgetTimer != null && hw.fidgetTimer <= 0,
    fidgetPick: hw.fidgetNames.length
      ? hw.fidgetNames[Math.floor(Math.random() * hw.fidgetNames.length)]
      : null,
  });
  // Keyed on the magazine change, not on which clip holds the arms: a change
  // begun while the last reload clip is still clamped rewinds it. The clip
  // runs at the engine's own span (1/speed); DICE fitted rates in
  // 1pAnimationsTweaking.con so one pass matches reloadTime.
  // Latch only after a successful play — a no-op (bare weapon, missing clip)
  // must not burn the one attempt for this magazine.
  if (decision.startReload) {
    hw.actions.fire?.stop();
    if (playViewmodelClip(hw, 'reload', { restart: true })) {
      if (decision.markReloadPlayed) hw.reloadPlayed = true;
    }
  } else if (decision.startFire) {
    playViewmodelClip(hw, 'fire', { restart: true });
  } else if (decision.startDeploy) {
    // The throw's returnTo: bring the next grenade up. Same shape as the
    // reload branch above — stop the spent fire clip so a clamped one-shot
    // cannot go on holding the arms through the raise.
    hw.actions.fire?.stop();
    playViewmodelClip(hw, 'deploy', { restart: true });
  } else if (decision.startFidget) {
    // The pick lands in `hw.fidget` only once the clip actually owns the
    // arms — a bare weapon or a rig without the family would otherwise
    // re-fire the same no-op every frame.
    if (playViewmodelClip(hw, decision.want, { restart: true })) {
      hw.fidget = decision.want;
    } else {
      hw.fidgetNames.length = 0;   // park the clock; nothing to play
    }
  } else {
    if (decision.endFidget) {
      hw.fidget = null;
      hw.fidgetTimer = null;   // back in idle: a fresh 4-7 s dwell arms
    }
    if (decision.want !== hw.active) {
      playViewmodelClip(hw, decision.want);
    }
  }
  // Belt: selection already matches want (idle) but LoopRepeat fire is still
  // scheduled from a prior fade — freeze its clock so the clip cannot keep
  // shaking after hw.active has already flipped. Weight still drains via any
  // in-flight crossfade / fadeOut from playViewmodelClip.
  if (decision.stopLoopFire && fireAction) {
    fireAction.setEffectiveTimeScale(0);
  }
  hw.mixer.update(dt);
}

/** Begin a magazine change. True if one actually started. */
function startReload() {
  const hw = handWeapon;
  const magazine = hw?.data?.magazine;
  if (!hw || !magazine || hw.reload > 0 || hw.mags <= 0) return false;
  if (hw.rounds >= magazine.size) return false;
  hw.reload = magazine.reloadTime ?? 2;
  hw.reloadPlayed = false;   // the arms clip plays once per magazine change
  // `FireArms::Reload` calls setZoom(false): a magazine change drops zoom.
  hw.zoomed = false;
  hw.rezoom = 0;
  if (hw.group) guns.setFiring(hw.group, false);
  return true;
}

// --- the shot it makes -------------------------------------------------------
//
// Per-round one-shots from `models/sounds/<Name>.mp3` — the fire sample
// `extract_weapon_sounds.py` picked out of the weapon's own `.ssc`, with the
// authored volume, pitch jitter and time gate riding alongside in
// `weapons.json`. The vehicle guns hold a muted loop and gate it with gain
// because their fire is authored as a loop patch on a vehicle that outlives
// any burst; a hand weapon's round is an event, so each shot gets its own
// BufferSource into one shared bus. Overlap comes free — a Thompson's 0.1 s
// loop cycle at 700 rpm stacks instead of restarting, so rapid fire never
// cuts its own tail off — and the bus follows the master volume from
// updateAudio like every other voice on the page. Decodes go through the
// shared cache, so the one-decode-per-wav rule holds here too.
let weaponSoundsIndex = null;   // promise for models/sounds/weapons.json
let handFireBus = null;         // every hand-shot voice sums here

function weaponSoundsManifest() {
  if (!weaponSoundsIndex) {
    weaponSoundsIndex = fetch(`${MODELS_BASE}/sounds/weapons.json${bust()}`)
      .then(r => (r.ok ? r.json() : null))
      .catch(() => null)
      // A fetch that lost its race with the page's own load storm must not
      // memoise silence for the rest of the session: drop the cached promise
      // so the next weapon — or the next shot, through `refetchHandFireSound`
      // — asks again. Only a manifest that actually arrived is kept.
      .then(doc => { if (!doc) weaponSoundsIndex = null; return doc; });
  }
  return weaponSoundsIndex;
}

/** Resolve + decode `name`'s fire sample; inert until a shot actually plays
 *  it. Takes the bare template name rather than `hw` so `loadHandWeapon` can
 *  fire this off *before* `hw` exists — see the call site's comment on why
 *  that ordering is the whole fix for a shot going silent right after spawn. */
async function fetchHandFireSound(name) {
  if (AUDIO_OFF) return null;
  const manifest = await weaponSoundsManifest();
  const spec = manifest?.weapons?.[name];
  if (!spec) return null;   // a quiet weapon (binoculars), or a mod without the tree
  const buffer = await modelSoundBuffer(`sounds/${spec.file}`);
  return buffer ? { spec, buffer } : null;
}

/** One more try for a weapon whose report never landed, asked from the shot
 *  path. Once per weapon: a fetch is cheap, but a round is not the place to
 *  queue one every time the trigger falls. */
function refetchHandFireSound(hw) {
  if (hw.fireRetry) return;
  hw.fireRetry = true;
  const token = weaponToken;
  fetchHandFireSound(hw.name).then(fire => {
    if (fire && weaponToken === token) hw.fire = fire;
  });
}

function ensureHandFireBus(ctx) {
  if (!handFireBus) {
    handFireBus = ctx.createGain();
    handFireBus.gain.value = masterVolume() * WEAPON_HEADROOM;
    handFireBus.connect(audioListener.getInput());
  }
  return handFireBus;
}

// The active Fire Loop voice, for weapons whose .ssc marks the fire patch
// `loop` + `stop FinishSample`: the engine starts the loop when the trigger
// closes and, on release, lets the playing cycle run out rather than cutting
// it. Web Audio spells FinishSample as `source.loop = false` mid-play — the
// buffer is one authored cycle, so it ends exactly at the boundary.
let handFireLoop = null;

function startHandFireLoop(fire) {
  if (handFireLoop || !fire || !audioListener || masterVolume() <= 0) return;
  const ctx = audioListener.context;
  const source = ctx.createBufferSource();
  source.buffer = fire.buffer;
  source.loop = true;
  // The script's own per-play jitter (`randomStartPitch 0.02/0.01` on the
  // distance layer); the close stereo layer plays straight.
  const gain = ctx.createGain();
  gain.gain.value = Math.min(fire.spec.volume ?? 1, 1);
  source.connect(gain);
  gain.connect(ensureHandFireBus(ctx));
  source.onended = () => {
    try { source.disconnect(); gain.disconnect(); } catch (_) {}
    if (handFireLoop && handFireLoop.source === source) handFireLoop = null;
  };
  try { source.start(); handFireLoop = { source, gain }; } catch (_) {}
}

function releaseHandFireLoop() {
  // FinishSample: the cycle in flight completes, nothing is cut.
  if (handFireLoop) handFireLoop.source.loop = false;
  handFireLoop = null;
}

function playHandFire(fire) {
  if (!fire || !audioListener || masterVolume() <= 0) return;
  const ctx = audioListener.context;
  // A context built before the first gesture starts suspended and stays that
  // way until something resumes it. Pulling a trigger is a gesture, and when
  // the listener was created by a load rather than by a click this is the
  // difference between an audible session and a silent one.
  if (ctx.state === 'suspended') ctx.resume().catch(() => {});
  // A looped fire patch is trigger-held, not per-round: `onShot` only has to
  // make sure the loop is running.
  if (fire.spec.loop) {
    startHandFireLoop(fire);
    return;
  }
  const source = ctx.createBufferSource();
  source.buffer = fire.buffer;
  // The same per-play jitter DICE puts on the loops, applied per shot: a
  // burst reads as many rounds rather than one report stuttering.
  const [up = 0, down = 0] = fire.spec.randomStartPitch || [];
  source.playbackRate.value = 1 + (Math.random() * (up + down) - down);
  const gain = ctx.createGain();
  // The M1's report is authored at volume 10 against the game mixer's own
  // headroom; Web Audio has none to give, so the manifest keeps the authored
  // number and the clamp lives here, next to the bus that motivates it.
  gain.gain.value = Math.min(fire.spec.volume ?? 1, 1);
  source.connect(gain);
  gain.connect(ensureHandFireBus(ctx));
  source.onended = () => {
    try { source.disconnect(); gain.disconnect(); } catch (_) {}
  };
  // `delay` is the script's own `Volume <- Time` gate — the knife's swish
  // lands 0.4 s into the swing, and starting it early would un-author that.
  try { source.start(ctx.currentTime + (fire.spec.delay || 0)); } catch (_) {}
}

// Every round the soldier's own gun fires: the report plays, the magazine
// empties, the cone blooms, and the view kicks. `onShot` fires for vehicle
// guns too, so the group is checked first.
guns.onShot = group => {
  const hw = handWeapon;
  if (!hw || group !== hw.group) return;
  // A report that never arrived — a manifest or an mp3 that failed while the
  // page was still pulling the level down — is asked for once more here
  // rather than leaving this weapon silent for the rest of its life.
  // A wound-up throw (`fireDelay`) played its report and started its clip on
  // the click — `beginHandFire`, below; the round leaving is only the round.
  if (!hw.throwBegun) beginHandFire(hw);
  hw.throwBegun = false;
  // The hand-off. A thrown weapon's own mesh goes away for
  // `hideDuringFireTime` at the moment the round is created — that is one
  // statement in `FireArms::Fire`, not two events to line up — so the grenade
  // in the palm and the grenade in the air are never both on screen. Started
  // here because here is where the round leaves: `guns.onShot` is called from
  // `fireShot`, the same call that spawns the projectile.
  const hide = hw.data?.throw?.hideDuringFireTime;
  if (hide > 0 && hw.weaponNode) {
    hw.hideFire = hide;
    hw.weaponNode.visible = false;
  }
  if (Number.isFinite(hw.rounds)) hw.rounds = Math.max(0, hw.rounds - 1);
  hw.model.onShot();
  hw.cool = Math.max(hw.cool, 1 / (hw.data?.roundOfFire || 1));
  finishHandShot(hw);
};

/** The trigger's half of a shot: the report and the arms' fire clip. For every
 *  ordinary weapon it runs from `guns.onShot`, on the round; for a throw it
 *  runs on the click, `fireDelay` ahead of the round. */
function beginHandFire(hw) {
  if (!hw.fire) refetchHandFireSound(hw);
  playHandFire(hw.fire);
  // PlayOnce arms: one restart per round, blended at the fire state's morph
  // factor and clamped between shots. Looping fire (BAR / Thompson) is owned
  // by updateViewmodelAnimation + the trigger latch — restarting it here
  // would un-freeze a just-released LoopRepeat and keep the post-fire shake.
  const fireReturnsToReload = /reload/i.test(hw.clips?.fire?.returnTo || '');
  const fireLoops = !!(hw.clips?.fire?.loop) && !fireReturnsToReload;
  if (!fireLoops) {
    // One swing per round, and for the knife one of its five registered
    // swings — the same `rand() % n` the engine's c_AsmRandom rolls on every
    // entry into the fire state. A lone `fire` family plays itself.
    const pick = hw.fireVariants.length
      ? hw.fireVariants[Math.floor(Math.random() * hw.fireVariants.length)]
      : 'fire';
    playViewmodelClip(hw, pick, { restart: true });
  }
}

/** What follows the round out of the barrel: the un-zoom and the kick. */
function finishHandShot(hw) {
  // `UnZoomBetweenFireTime > 0` (the snipers' 3.0): the fire path flags it
  // and `FireArms::handleUpdate` un-zooms, then re-zooms when the timer
  // runs out — the bolt-cycle un-zoom. The toggle latch itself holds.
  const unzoom = hw.data?.zoom?.unZoomBetweenFire;
  if (unzoom > 0 && hw.zoomed) hw.rezoom = unzoom;
  // `setRecoil*`: degrees per shot, sampled uniformly inside the declared
  // range (Thompson up 0.21..0.25, leftRight -0.1..0.1) and written into the
  // soldier's own look state, unscaled — the pitch clamp catches a long
  // burst the same way it catches the mouse.
  const recoil = hw.data?.recoil;
  if (recoil && soldier) {
    const draw = range => {
      if (!range) return 0;
      const lo = Math.min(range[0], range[1]);
      // The gun's dice, so a seeded check kicks the same way every run.
      return lo + guns.rand() * (Math.max(range[0], range[1]) - lo);
    };
    soldier.look(draw(recoil.leftRight) * DEG_TO_RAD,
                 draw(recoil.up) * DEG_TO_RAD);
  }
};
// Chained on *after* the raw assignment above, never before: `chainOnShot`
// captures whatever `guns.onShot` already is at the moment it runs and wraps
// it, but the hand weapon's own `guns.onShot = ...` right above is a plain
// reassignment that would discard any wrapper installed earlier in the file,
// silently taking every manned-gun shot's ammo/heat bookkeeping with it (this
// bit a first pass: every seat's `FireState` sat frozen at its starting ammo
// through a full firing test). Splices ammo/heat onto every shot `gunfire.js`
// fires, vehicle or hand weapon alike — a no-op for any group this track
// never built a `FireState` for (the aircraft/car path has no magazine model
// of its own yet; the hand weapon manages its own `hw.rounds` above).
chainOnShot(guns, group => fireStates.get(group.node)?.registerShot());
// And the report. A gun `.ssc` is a one-shot event patch — the muzzle blast,
// the casing, the crew reloading, the breech — so the round is what plays it,
// exactly as a hand weapon's own `playHandFire` works two screens up. Chained
// rather than assigned, for the reason the block above spells out.
chainOnShot(guns, group => weaponAudioFor(group)?.audio.trigger());

/** The gun patch bolted to the FireArms node this group fires, or null.
 *  Matched on the node's own name, tolerating the scene-wide `_N` suffix the
 *  exporter gives the second and later instance of a vehicle — `weaponAudio`
 *  is keyed on the template's bare FireArms name. A plain loop, not `find`:
 *  this runs once per round fired. */
function weaponAudioFor(group) {
  const name = group?.node?.name;
  if (!name || !weaponAudio.length) return null;
  const bare = bareFireArmsName(name);
  for (const weapon of weaponAudio) {
    if (weapon.spec.fireArms === name || weapon.spec.fireArms === bare) return weapon;
  }
  return null;
}

/**
 * One frame of the weapon: aim blend and FOV, deviation state, the reload
 * clock, the trigger, and the HUD. Runs from `onFoot` after the camera pose
 * is final, and before `guns.advance` fires this frame's rounds.
 */
function footFire(dt, input = null) {
  const hw = handWeapon;
  // Drained even bare-handed, or the first frame holding a weapon would see
  // every radian turned since it was picked up.
  const lookX = dt > 0 ? footLookX / dt : 0;
  const lookY = dt > 0 ? footLookY / dt : 0;
  footLookX = 0;
  footLookY = 0;
  if (!hw) return;
  guns.firstPerson = true;   // the 0.4 m `em_1P_*` sprite, not the 1.76 m mesh

  // The sniper bolt-cycle un-zoom window counts down here; when it empties,
  // the still-set toggle latch zooms the view back in on its own.
  if (hw.rezoom > 0) hw.rezoom = Math.max(0, hw.rezoom - dt);
  const zoomed = isZoomed();

  // Two fields of view, as the engine keeps them. `zoom.soldierFov`
  // (`SoldierZoomFov`, a factor: the Mp40's 0.9 barely leans in, the
  // Thompson's 0.6 commits) belongs to the ARMS: `BFSoldier::applyFovModifier`
  // multiplies it into `set1pFov` and hands the product to every
  // first-person part through `setFirstPersonFov` (0x004f7120). It eases
  // `0.7·cur + 0.3·target` per visual frame and snaps within 0.001 —
  // `BFSoldier::handleVisualUpdate`, no dt, frame-rate dependent by design.
  // The near pass in frame() draws the rig with it.
  const fovTarget = zoomed ? (hw.data?.zoom?.soldierFov ?? 1) : 1;
  hw.fovCur = Math.abs(fovTarget - hw.fovCur) <= FOV_SNAP
    ? fovTarget
    : 0.7 * hw.fovCur + 0.3 * fovTarget;
  // The world camera is the other: zoom switches it to the weapon's
  // `zoomFov`, a whole field of view in the unit `renderer.fieldOfView 1`
  // uses (radians; the Thompson's 0.5 = 28.6°, a sniper's 0.1 = 5.7°), and
  // back to FOOT_FOV. INFERRED [zoomFov unit]: read off the vehicleFov path
  // (`Camera::setVehicleFOV` replaces the render view's FOV wholesale), not
  // off the camera-mode switch itself, which is a raw-byte read
  // (0x004fc8b6). Whether that side eases or snaps is unread, so it borrows
  // the arms' 0.7/0.3 ease. OPEN [stand-in].
  const worldTarget = zoomed && hw.data?.zoom?.fov
    ? hw.data.zoom.fov / DEG_TO_RAD : FOOT_FOV;
  hw.worldFov = Math.abs(worldTarget - hw.worldFov) <= FOV_SNAP
    ? worldTarget
    : 0.7 * hw.worldFov + 0.3 * worldTarget;
  camera.fov = hw.worldFov;
  camera.updateProjectionMatrix();
  // And displaces the rig from its hip pose to its zoom pose, eased 25% of
  // the remaining distance per visual frame (0.25f, same function, no dt).
  const at = zoomed ? hw.viewZoom : hw.viewHip;
  hw.pos.x += (at.x - hw.pos.x) * VIEW_EASE;
  hw.pos.y += (at.y - hw.pos.y) * VIEW_EASE;
  hw.pos.z += (at.z - hw.pos.z) * VIEW_EASE;
  hw.rig.position.set(hw.pos.x, hw.pos.y, hw.pos.z);
  // A scoped weapon aims through glass this page does not draw yet; hiding
  // the rifle is the half of the scope view the data can already pay for.
  hw.rig.visible = !(hw.data?.zoom?.scope && zoomed);

  // The deviation inputs, named for the engine's PlayerInput channels. Note
  // what is NOT fed: zoom — aiming has no effect on deviation, in either
  // binary. `jumping` gates miscDev; the engine's gate is the c_PIAction
  // input masked by a soldier state bit, and airborne is this page's
  // stand-in for that mask. `dt` here is the frame's; the model converts it
  // to whole 1/30 s ticks itself (`TICK_HZ`), the engine's simulation step,
  // so the cone decays at the same rate on every monitor.
  hw.model.update(dt, {
    stance: soldier.stance,
    throttle: input?.forward ?? 0,
    strafe: input?.strafe ?? 0,
    lookX,
    lookY,
    jumping: !soldier.grounded,
  });

  const magazine = hw.data?.magazine;
  if (hw.reload > 0) {
    hw.reload -= dt;
    if (hw.reload <= 0) {
      hw.reload = 0;
      hw.mags -= 1;
      hw.rounds = magazine.size;
    }
  } else if (magazine && hw.rounds <= 0 && hw.mags > 0) {
    // Dry means a magazine change, asked for or not — `autoReload` in the
    // data or no. R merely asks early. Both go through startReload, so every
    // change drops zoom and owes the arms a fresh pass of the reload clip.
    startReload();
  }

  if (hw.group) {
    hw.cool = Math.max(0, hw.cool - dt);
    // `__setTrigger` stands in for the mouse under ?shots, where headless
    // Chromium never grants pointer lock — the capture gate would otherwise
    // dead-trigger every harness shot.
    const canFire = (captured || params.has('shots'))
      && hw.reload <= 0 && hw.rounds > 0;
    if (hw.data?.fireOnce) {
      // Semi-auto: one queued click becomes exactly one frame of trigger,
      // which `advance` turns into exactly one round; `cool` holds the
      // declared cycle (a No4 works its bolt for 2.7 s) across clicks.
      if (hw.pulse) {
        guns.setFiring(hw.group, false);
        hw.pulse = false;
      }
      // A throw winds up first. `fireDelay` (the grenades' 1.0 s) is the time
      // from the click to the round: the fire clip pulls the pin and swings
      // through its fling over exactly that span, the `.ssc` lands its swoosh
      // at 0.9 s of it, and `hideDuringFireTime` (0.4) then covers what is
      // left of the 1.35 s clip before the next one is raised — three
      // independently authored numbers that only agree under this reading.
      // So the click starts the clip and the report, and the trigger pulse
      // that makes the round waits for the countdown. A weapon swapped or a
      // soldier killed mid-wind-up never throws: `hw` goes with them.
      const windUp = hw.data?.throw?.fireDelay || 0;
      if (hw.throwWind > 0) {
        hw.throwWind -= dt;
        if (hw.throwWind <= 0) {
          hw.throwWind = 0;
          guns.setFiring(hw.group, true);
          hw.pulse = true;
        }
      } else if (clickQueued && canFire && hw.cool <= 0 && !hw.pulse) {
        clickQueued = false;
        if (windUp > 0) {
          hw.throwWind = windUp;
          hw.throwBegun = true;
          // Held past the release so a second click cannot start a second
          // wind-up over this one; `onShot` then adds the declared cycle.
          hw.cool = windUp;
          beginHandFire(hw);
        } else {
          guns.setFiring(hw.group, true);
          hw.pulse = true;
        }
      }
    } else {
      const firing = triggerHeld && canFire;
      guns.setFiring(hw.group, firing);
      // The Fire Loop follows the trigger, not the rounds: the .ssc's
      // `stop FinishSample` lets the cycle in flight complete on release,
      // on running dry, and on a magazine change alike.
      if (!firing) releaseHandFireLoop();
    }
  }

  // `hideDuringFireTime` running out puts the weapon back in the hand, which
  // the engine does unconditionally — `handleUpdate` shows the visual again and
  // only then considers switching weapons (`changeWeaponWhenNoAmmo`, which this
  // page does not do yet, so a soldier out of grenades keeps holding one he
  // cannot throw).
  if (hw.hideFire > 0) {
    hw.hideFire -= dt;
    if (hw.hideFire <= 0) {
      hw.hideFire = 0;
      if (hw.weaponNode) hw.weaponNode.visible = true;
    }
  }

  // The arms last, once the reload clock and the trigger have settled what
  // this frame is: a reload begun above starts its clip this same frame.
  updateViewmodelAnimation(hw, dt);
}

/**
 * The crosshair's gap, in CSS pixels: the deviation ABOVE the stationary
 * floor, projected through the camera — `0.5 x height x tan(dev - floor) /
 * tan(vfov / 2)`.
 *
 * Subtracting the floor is measured, not derived: in retail footage a still
 * Thompson (minDev 0.4 deg, never zero) draws its arms MEETING at centre,
 * and they part when the shooter moves, turns or fires. So the gap tracks
 * the acquired spread, not the whole cone. OPEN: whether the engine's own
 * mapping is this projection or a linear scale — a corpus question
 * (crosshair draw path, client side); the footage pins only the endpoints.
 */
/**
 * What is under the trigger this frame, as the crosshair needs to know it:
 * the `setCrossHairType` word of the weapon in hand, or of the seat.
 *
 * The word is declared per HandFireArms AND per PlayerControlObject, and it
 * is the whole of the decision. Vanilla splits 37 templates across
 * `CHTCrossHair` (the four bars: every rifle and SMG, and the Sherman,
 * PanzerIV, Tiger, T34, Chi-ha and every hull/stationary MG), 49 across
 * `CHTIcon` (one texture, `hk.tga` — no vanilla template overrides
 * `CrossHair/CrossHairIcon`, so the bazooka, the K98, the Defgun, the
 * Priest, the Sexton and every aircraft draw the same picture) and 64 across
 * `CHTNone` (passengers, ships, the Willy).
 *
 * The page used to ask only the hand weapon, and only on foot, so a
 * CHTCrossHair tank drew nothing and a CHTIcon launcher drew a bare dot.
 * `deviation` is the hand weapon's acquired spread; a vehicle gun has no
 * deviation model here, and the bars meet at centre the way a tank's do.
 */
function crosshairAim() {
  // `occupancy` alone, not `aircraft || car`: those two outlive the seat.
  // `leaveVehicle` empties the occupancy and parks the vehicle but keeps the
  // drive model around for whoever climbs back in, so a soldier who had just
  // stepped out of a Sherman was still being asked what the Sherman draws.
  if (occupancy) {
    // The CONTROLLED PCO's own `hud` block, which is where `setCrossHairType`
    // is declared — a Sherman's driver and its hull gunner are two PCOs and
    // answer separately. A scene extracted before the word was carried has
    // none, and an absent word draws nothing rather than a guess.
    return { style: occupancy?.activeHud?.()?.crossHairType ?? null,
             deviation: 0, scoped: false };
  }
  const hw = handWeapon;
  if (!optOnFoot.checked || !soldier || !hw) {
    return { style: null, deviation: 0, scoped: false };
  }
  const floor = (hw.model.floor?.() ?? 0) * DEG_TO_RAD;
  return {
    style: hw.data?.crossHair ?? null,
    deviation: Math.max(0, hw.model.current() * DEG_TO_RAD - floor),
    scoped: !!hw.data?.zoom?.scope && isZoomed(),
  };
}

/** The `CrossHair/CrossHairIcon` leaf of the layout's own crosshair group:
 *  the rect a CHTIcon crosshair occupies in the 800x600 virtual screen, and
 *  the sprite it defaults to. Read from `hud-layout.json` rather than written
 *  here, so a mod that moves or replaces it is followed. */
let crosshairIcon;          // undefined until the layout has been looked at
function crosshairIconLeaf() {
  if (crosshairIcon !== undefined) return crosshairIcon;
  const layout = gameHud.layout;
  if (!layout) return null;   // not loaded yet; ask again next frame
  const leaf = (layout.groups?.crosshair?.elements || []).find(
    el => el.kind === 'variable-picture' && el.var === 'CrossHair/CrossHairIcon');
  crosshairIcon = leaf?.rect && leaf.texture
    ? { rect: leaf.rect, virtual: layout.virtual || [800, 600], texture: leaf.texture }
    : null;
  if (crosshairIcon) {
    // One fetch, and the `ch-art` class only once the bytes are in: a pack
    // without `hk` keeps the centre dot instead of an empty box.
    const url = `${hudPaths.url(`${crosshairIcon.texture}.png`)}${bust()}`;
    const img = new Image();
    img.onload = () => {
      crosshairEl.querySelector('.ch-pic').style.backgroundImage = `url("${url}")`;
      crosshairEl.classList.add('ch-art');
    };
    img.src = url;
  }
  return crosshairIcon;
}

function updateCrosshair() {
  const { style, deviation, scoped } = crosshairAim();
  // `!fullmapBox.hidden` covers both overlays this can now collide with: the
  // deploy screen and the full map. They did not need saying while this ran
  // only from `footFire`, which the overlay suppresses; it runs every frame
  // now, so a soldier waiting to spawn would otherwise aim at his own map.
  const show = (style === 'CHTCrossHair' || style === 'CHTIcon')
    && !scoped && fullmapBox.hidden;
  // Written only on change, and read back from the element rather than a
  // cache because enterVehicle and disposeHandWeapon hide it behind this
  // function's back: every DOM write here invalidates style, and a frame
  // with nothing new to say must cost the page nothing (rule 3).
  if (crosshairEl.hidden !== !show) crosshairEl.hidden = !show;
  if (!show) return;
  const icon = style === 'CHTIcon';
  if (crosshairEl.classList.contains('ch-icon') !== icon) {
    crosshairEl.classList.toggle('ch-icon', icon);
  }
  // The renderer's own backing store, not `stageHeight`: a headless capture
  // resizes the renderer through `__renderOnce` and never touches the page,
  // so the cached page height is stale there and the crosshair gap came out
  // scaled for a window nobody is looking at. Same reasoning, and the same
  // source, as the HUD canvas's own size in `frame()`.
  const ratio = renderer.getPixelRatio();
  const height = renderer.domElement.height / ratio || 800;
  if (icon) {
    const leaf = crosshairIconLeaf();
    if (!leaf) return;
    // The HUD stretches its virtual screen independently on each axis
    // (hud.js `_scaleFor`), so the icon does too.
    const width = renderer.domElement.width / ratio || 1280;
    setCrosshairVar('--ch-icon-w', leaf.rect[2] * width / leaf.virtual[0]);
    setCrosshairVar('--ch-icon-h', leaf.rect[3] * height / leaf.virtual[1]);
    return;
  }
  const px = 0.5 * height * Math.tan(deviation) / Math.tan(camera.fov * DEG_TO_RAD / 2);
  setCrosshairVar('--ch-gap', px);
}

function setCrosshairVar(name, px) {
  const value = `${px.toFixed(1)}px`;
  if (crosshairEl.style.getPropertyValue(name) !== value) {
    crosshairEl.style.setProperty(name, value);
  }
}

// --- the in-game HUD: soldier-side variables --------------------------------
//
// hud.js owns the one painter for every group hud-layout.json declares; this
// page's job is only to keep `gameHud.vars` current with the engine's own
// named variables (features/bf1942-3d-models/in-game-hud.md). This section
// feeds the SOLDIER side — health bar, stance figure, hand-weapon ammo panel —
// plus the one shared boolean (`Vehicle/ShowVehicleIcon`) that switches the
// ammo panel between its soldier and vehicle skins; a future seats.js owns
// the vehicle-side groups themselves (vehicleIcon/vehicleHealth/vehicleSeats/
// primaryAmmo/secondaryAmmo) and, once it lands, the finer-grained seated
// state that boolean really needs — see the note on `inVehicle` below.

// c_BfSoldierStanding/Crouching/Lying, the engine's own pose vocabulary
// (CommonSoldierData.inc), against the sprite pack's own suffix — a direct
// rename, not an inference.
const STANCE_TEXTURE = { stand: 'standing', crouch: 'crouching', prone: 'lying' };

// OPEN [R1-12]: the nation key BFSoldierHud's stance icon actually reads was
// never traced (verify-r1.md leaves it open). Approximated with the same
// per-side nation the deploy screen's own kit art already resolves
// (`teamNation`), translated only where the icon set's own filenames spell a
// nation differently from the flag-mesh table (`jap`, where `hud.json`'s
// `flagMeshNation` says `jp`) — an asset-naming difference this file already
// has to bridge elsewhere, not a new engine fact.
const STANCE_NATION = { us: 'us', ger: 'ger', brit: 'brit', rus: 'rus', jp: 'jap' };

// The kit's own health-bar art, memoised: `kitLoadout` allocates a small
// object per call, so this only re-resolves it when the level/team/kit
// actually changed instead of on every rendered frame
// (features/mesh-viewer-performance, rule 5). Compared field by field, not
// via a joined-string key: a template literal built fresh every call to
// throw away immediately is itself the per-frame allocation rule 5 rules out.
let kitArtDir = null;
let kitArtTeam = null;
let kitArtKitName = null;
let kitArtCache = null;
function kitHealthArt(team, kitName) {
  if (team !== kitArtTeam || kitName !== kitArtKitName || currentDir !== kitArtDir) {
    kitArtDir = currentDir;
    kitArtTeam = team;
    kitArtKitName = kitName;
    const resolved = kitLoadout(team, kitName).kit;
    kitArtCache = (resolved && loadouts?.kits?.[resolved]) || null;
  }
  return kitArtCache;
}

// The stance icon's own nation, memoised the same way and for a bigger
// reason: `teamNation` allocates a `Map` and walks every control point on
// the level (found while reviewing this track — it was being called
// unmemoised, once per rendered frame, the exact per-frame-allocation-plus-
// O(n)-scan shape rule 5 exists to catch). The team's nation cannot change
// without a fresh spawn, so this only re-runs it when the team or level did.
let nationArtDir = null;
let nationArtTeam = null;
let nationArtCache = null;
function stanceNation(team) {
  if (team !== nationArtTeam || currentDir !== nationArtDir) {
    nationArtDir = currentDir;
    nationArtTeam = team;
    nationArtCache = STANCE_NATION[teamNation(team)] || (team === 1 ? 'ger' : 'us');
  }
  return nationArtCache;
}

/**
 * Keep `gameHud.vars` current with the soldier's own state, once per
 * rendered frame (HUD-3: the engine itself recomputes this HUD once per
 * `Renderer_drawFrame`, not the 30Hz tick) — called from `frame()`, right
 * before `gameHud.paint()`. Writes plain fields on an existing object only;
 * the nation and kit-art lookups are memoised above (rule 5), so the only
 * per-call allocation left is the display-string template literal itself.
 */
// The "nothing to warn about" frame: what `CombatArea.step` returns inside
// the area, hoisted so `updateSoldierHud` allocates nothing per frame.
const IN_COMBAT_AREA = { countdown: 0 };

// `setHudAmmoType` -> `Ammo/AmmoType`, and which of those print a round
// count: both live in `hud.js` beside the rest of the layout's own
// vocabulary, so `tests/hud_harness.mjs` can drive them under node. HUD-10.
//
// Every `soldierAmmo` variable this file writes, so a weapon swap starts from
// nothing. The `Ammo/Primary*` names are shared with the vehicle panel, which
// is fine: the two groups are mutually exclusive in the layout
// (`Vehicle/ShowVehicleIcon` gates one and `NotData` of it the other), and
// only one of them is fed at a time.
const SOLDIER_AMMO_VARS = [
  'Ammo/AmmoType', 'Ammo/PrimaryAmmo', 'Ammo/MaxPrimaryAmmo', 'Ammo/PrimaryMag',
  'Ammo/SoldierAmmo/SoldierAmmoHasMag', 'Ammo/SoldierAmmo/SoldierAmmoIcon',
  'Ammo/SoldierAmmo/SoldierAmmoBar', 'Ammo/SoldierAmmo/SoldierAmmoBarFill',
  'Ammo/SoldierAmmo/SoldierAmmoBarSize',
];

function updateSoldierHud() {
  const vars = gameHud.vars;
  // Any seat at all, which `seats.js` answers for: `occupancy` is non-null
  // from the moment `setPilot` seats someone until `leaveVehicle` /
  // `exitManned` clears it, whatever the seat is — a cockpit, a driver's
  // bench, or a Defgun that has no drivetrain to be an `aircraft`/`car` at
  // all. This runs after `frame()`'s dispatch has already called
  // `feedVehicleHud`, so testing `aircraft || car` here would blank the
  // vehicle groups that a manned gun had just filled in.
  const inVehicle = optPilot.checked && !!occupancy;
  // A seated soldier's optOnFoot box is still ticked — he is only suspended,
  // per disposeHandWeapon's own comment on the old #ammo element — so the
  // vehicle check has to be explicit here too.
  const onFootActive = optOnFoot.checked && !!soldier && !inVehicle;
  // The ticket counter is not the soldier's, and its own `when` is only
  // `ShowTicket`, so it would otherwise ride over a free-fly camera — where
  // this viewer deliberately shows no HUD chrome at all and the game would
  // not be in a round. Gate it on the player being in the world (on foot or
  // in any seat), which is the same condition that raises the rest of the
  // HUD. Fed before every early return below, because a soldier who has just
  // died leaves `soldier` null while the counter is still up in the game.
  feedTicketVars(vars);
  if (!onFootActive && !inVehicle) vars['ShowTicket'] = false;
  // The combat-area warning, drawn by the layout's own `outside` group.
  // `stepCombatArea` leaves `combatFrame` null whenever nothing the engine
  // would call a player is in the world, and its countdown is 0 while that
  // player is inside — either way the group culls, the engine's own gate
  // being `0 < Outside/OutsideTime`. Not gated on `onFootActive`: the warning
  // is exactly as much the pilot's as the rifleman's.
  combatArea.feed(vars, combatFrame || IN_COMBAT_AREA);
  // T4a / V-R4: retail keeps the soldier stance icon inside vehicles.
  vars['Soldier/ShowSoldierIcon'] = !!soldier && (onFootActive || inVehicle);
  vars['Vehicle/ShowVehicleIcon'] = inVehicle;
  vars['Weapon/ShowWeaponIcon'] = onFootActive && !!handWeapon;
  // The weapon bar (the kit's inventory row the game paints while a weapon
  // is being selected — layout group `weaponBar`, gated on this one var, so
  // a stale true could draw it over a cockpit): up for a beat after the last
  // selection input, on foot only. Written before every early return below.
  const weaponBarUp = onFootActive && performance.now() < weaponBarUntil;
  vars['Weapon/SelectingWeapon'] = weaponBarUp;
  if (!weaponBarUp) {
    // Only cleared here — the icon/slot values themselves may stay stale
    // while the bar is down, because every weaponBar leaf is gated on
    // SelectingWeapon and culls whole.
    for (const key of WEAPON_ICON_VARS) vars[key] = null;
    vars['Weapon/WeaponSelect'] = null;
  }

  if (!soldier) {
    vars['CrossHair/ShowCrossHair'] = false;
    vars['CrossHair/ScopeIndex'] = 0;
    return;
  }

  const iconNation = stanceNation(deployTeamId);
  const stanceWord = STANCE_TEXTURE[soldier.stance] || 'standing';
  vars['Soldier/SoldierIcon'] = `Soldier/Icon_${iconNation}_soldier_${stanceWord}.tga`;

  // The kit glyph is baked into these two textures already (opened
  // healthbar_full_scout_64x64.png directly: the scout scope icon sits in the
  // art itself), not a separate layout element — feeding these two is the
  // whole of "the health bar and its kit art".
  const art = kitHealthArt(deployTeamId, deployKit);
  vars['Soldier/SoldierHealthBarIcon'] = art?.healthBarIcon;
  vars['Soldier/SoldierHealthBarFullIcon'] = art?.healthBarFullIcon;

  // TEMPORARY seed, not a feed: `Soldier/SoldierHitPoints` and
  // `SoldierMaxHitPoints` are supply-and-health's (BRIEFING2), and nothing in
  // this worktree tracks damage yet. Vanilla's own constant
  // (CommonSoldierData.inc: HitPoints 30, MaxHitPoints 30) seeds the bar so
  // its fill layer has something to paint before that track lands; the `??=`
  // means a real tracked value, once written, is never stomped back to this.
  vars['Soldier/SoldierMaxHitPoints'] ??= 30;
  vars['Soldier/SoldierHitPoints'] ??= 30;

  // SCOPE-1 / V-R5: CrossHair/* is owned here (T5). Off-foot, drop the overlay
  // so ScopeIndex cannot stick into a seat; Submarine/ShowPeriscope stays
  // untouched for whatever later feeds a real periscope. Soldier art above
  // already ran for the seated case (T4a).
  if (!onFootActive) {
    vars['CrossHair/ShowCrossHair'] = false;
    vars['CrossHair/ScopeIndex'] = 0;
    return;
  }
  vars['Submarine/ShowPeriscope'] = false;

  // The weapon bar's own contents while it is up: the spawned kit's
  // inventory — one icon per `addWeaponIcon` entry (slot order, loadouts'
  // `weapons` list), painted at the slot's own numbered rect the way the
  // engine raises it (a mod kit with no slot-2 weapon leaves that rect's
  // variable unfed, so the layout's literal picture shows — HUD-1), and the
  // highlighted fill on the slot in hand. The variable names come from the
  // prebuilt WEAPON_ICON_VARS so nothing allocates per frame.
  if (weaponBarUp && kitWeaponSlots) {
    for (let slot = 1; slot <= WEAPON_ICON_VARS.length; slot++) {
      const entry = kitWeaponSlots.find(w => w.slot === slot);
      vars[WEAPON_ICON_VARS[slot - 1]] = entry ? (entry.icon || null) : null;
    }
    vars['Weapon/WeaponSelect'] = handSlot;
  }

  const hw = handWeapon;
  if (!hw) {
    vars['CrossHair/ShowCrossHair'] = false;
    vars['CrossHair/ScopeIndex'] = 0;
    return;
  }
  // SCOPE-1 / V-R5: FireArms::setZoom writes ScopeIndex 0/1 when useScope;
  // weapon sync copies ScopeIcon / SniperSight / SightIcon. spriteKeyFromRef
  // in hud.js turns `sniper.tga` into atlas key `sniper`.
  // Hip fire keeps ShowCrossHair false so layout leaves 10–13 (four fill
  // ticks gated only on ShowCrossHair) do not draw a black box over the DOM
  // `#crosshair`; the scope overlay is the only layout CrossHair consumer.
  const zoom = hw.data?.zoom;

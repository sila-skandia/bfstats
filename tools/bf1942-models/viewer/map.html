// is linked, uploaded or first used by the frame that draws it. Three links
// a material's program on the first frame that draws it, uploads a texture on
// the first frame that binds it and builds a skinned mesh's bone texture on
// its first draw, and the link blocks that frame on the driver: on this Iris
// Xe's system GL the perf harness watched one block for 8-9.5 s and take the
// WebGL context with it.
//
// A subtree is compiled against the scene and camera of the pass that draws
// it — the canvas (no render target), that scene's fog and lights: all a
// program key reads that the material and the object do not — then every
// texture its materials can bind goes to the GPU, and every program the
// compile linked has its first use taken (`WebGLProgram.getUniforms`: the log
// and uniform queries three otherwise runs inside the first draw, and the
// point where a link still in flight would block). `compile` walks hidden
// nodes too, so a pooled particle or a parked gun's flash is warmed like a
// wall.

/** Put `texture` on the GPU if its pixels have arrived; a no-op before. */
function uploadTexture(texture) {
  if (!texture?.isTexture || texture.version === 0) return;
  renderer.initTexture(texture);
}

/** Every texture `root` can draw with: the material's slots, a shader's
 *  uniforms and the renderer's copy of them (where the ones `onBeforeCompile`
 *  adds live, once compiled), and each skinned mesh's bone texture, built
 *  here rather than on its first draw (`WebGLRenderer.setProgram`). */
function uploadTextures(root) {
  root.traverse(obj => {
    if (obj.isSkinnedMesh && obj.skeleton) {
      if (!obj.skeleton.boneTexture) obj.skeleton.computeBoneTexture();
      uploadTexture(obj.skeleton.boneTexture);
    }
    for (const m of [obj.material].flat()) {
      if (!m) continue;
      for (const value of Object.values(m)) uploadTexture(value);
      for (const uniform of Object.values(m.uniforms ?? {})) uploadTexture(uniform?.value);
      const compiled = renderer.properties.get(m).uniforms;
      for (const uniform of Object.values(compiled ?? {})) uploadTexture(uniform?.value);
    }
  });
  // A scene's own two textures hang off no material: the skybox cube three
  // draws the background with, and an environment map.
  if (root.isScene) {
    uploadTexture(root.background);
    uploadTexture(root.environment);
  }
}

/** Compile `root` for the pass that draws it, upload its textures and take
 *  the first use of every program the compile linked. The programs are taken
 *  as the compile returns, before anything swaps a material out from under
 *  them: `GunFire.collect` clones a rig's flash materials right after the
 *  rig's compile starts, and the clones reuse these programs by key. */
function warmSubtree(root, cam = camera, target = scene) {
  const compiled = renderer.compileAsync(root, cam, target);
  const programs = new Set();
  root.traverse(obj => {
    for (const m of [obj.material].flat()) {
      const linked = m && renderer.properties.get(m).programs;
      if (linked) for (const program of linked.values()) programs.add(program);
    }
  });
  return compiled.catch(() => {}).then(() => {
    uploadTextures(root);
    // A program released since (its last material disposed) has no GL
    // program left to ask.
    for (const program of programs) if (program.program) program.getUniforms();
  });
}

/** The level's warm-up, after applyFog() so the programs are the fogged ones
 *  the frame asks for, and again on every level switch. The effect pool and
 *  the gun stand-ins are built first; then the whole scene — terrain,
 *  statics, the level's LOD interiors and flags, parked vehicles and their
 *  hidden gun payloads, sky, water, the effect pool — is warmed for the main
 *  pass. */
function warmLevel(library) {
  if (library) effects.warm();
  const stand = guns.warm();
  return Promise.all([warmSubtree(scene), warmSubtree(stand)]);
}
// What the `?shots` hook `__warmup` waits on: the level's warm-up (show()) and
// the weapon in hand's (loadHandWeapon), plus the clock readings a check needs
// to say how long the level's took. Neither promise gates anything the page
// itself does.
const warmups = { level: Promise.resolve(null), rig: Promise.resolve(), timing: {} };
// The stick position (-1..1, driven toward a held key's full deflection and
// springing back to centre on release) is the world's per-player state now —
// world.js owns it beside the aircraft path that spends it, and the page's
// resets delegate to `world.resetStick`.
const HEAD_SENS = 0.0022;
// The four views C cycles. Only `cockpit` is reconstructed from data — the look
// clamps it applies are `CorsairCamera`'s own setMin/setMaxRotation. Chase,
// front and fly-by are ours; the engine declares that they exist (`CVMChase`,
// `CVMFrontChase`, `CVMFlyBy`) and never where they sit. See flight.js.
let view = null;

/**
 * Occupy `node` (any `PlayerControlObject` root — a flyable/drivable one,
 * a `c_ETTank`, a bare gun/seat furniture root) at `seatId`, or the root seat
 * when `seatId` is omitted. One `VehicleOccupancy` (`seats.js`) now backs
 * every kind: `air`/`ground`/`tank` additionally get a real drivetrain built
 * on it (unchanged interface, so `drive()`/`pilot()`/`view` need nothing new
 * to keep working when the *root* seat is the one active), and `gun`/`seat`
 * roots — and any nested seat of any of the above — run on `occupancy` alone,
 * stepped by `manned()` (`mannedActive()` decides which, in `frame()`'s
 * dispatch).
 */
function setPilot(on, node = null, seatId = null) {
  if (on && node && occupancy?.root !== node) {
    // A different vehicle than the one already built. The old one was
    // already parked by `leaveVehicle`/`leaveManned`; dropping the
    // references leaves it standing where its driver left it, a fixture of
    // the level now.
    aircraft = null;
    car = null;
    view = null;
    occupancy = null;
  }
  if (on && !occupancy) {
    const picked = node || pickVehicle();
    if (!picked) {
      optPilot.checked = false;
      return;
    }
    occupancy = new VehicleOccupancy(picked, {
      Aircraft, GroundVehicle, TrackedVehicle: GroundModule.TrackedVehicle,
    });
    const kind = occupancy.rootKind;
    if (kind === 'air' || kind === 'ground' || kind === 'tank') {
      // `ensureDrive` picks the class; `tank` asks for P4's `TrackedVehicle`
      // and falls back to `GroundVehicle` (Willys physics on a Sherman hull)
      // when that track's class has not landed in this worktree yet — see
      // `seats.js`'s own doc on `classes`.
      //
      // The cockpit interior is a glb of its own, fetched now and swapped in
      // for the fuselage when it lands (flight.js); relit and then warmed
      // before the swap shows it, so the first cockpit frame links nothing
      // (rule 6) and is not black (`unlitCockpit`).
      const cockpit = {
        prepareCockpit: root => { unlitCockpit(root); return warmSubtree(root); },
      };
      const vehicle = occupancy.ensureDrive(currentRoot,
        { groundHeight, surfaceFriction, deckNormal, collider: bodyAwareCollider(),
          ...cockpit });
      if (kind === 'air') {
        aircraft = vehicle;
        aircraft.groundHeight = groundHeight;
        // The spawn pose puts the aircraft on the deck; lift it clear of its
        // own wheels. The car/tank stays put — its springs are the lift.
        aircraft.state.position.y += 0.2;
      } else {
        car = vehicle;
      }
      // `Vehicle` defaults to forcing first person every step, because a page
      // with a single view has no other way to say "someone is sitting in
      // it". This page now has four (plus the manned-gun eye, which never
      // touches `autoFirstPerson` at all), so it takes the decision over:
      // `VehicleCamera` calls `setFirstPerson` on every mode change, and the
      // swap follows the view rather than the sim.
      vehicle.autoFirstPerson = false;
      view = new VehicleCamera(vehicle, { groundHeight });
      adoptDrivenBody(vehicle);
    }
    // Root seat unless a specific `EntryPoint` said otherwise — walking
    // straight up to a Sherman's hull-gunner door seats you there directly,
    // never through the driver's seat first.
    occupancy.setActiveSeat(seatId || occupancy.rootId);
    collectGuns();
    // `collect` (called above, for both the drivetrain's own guns and, via
    // its own `collectMannedGuns()` tail, a bare gun/seat root's FireArms)
    // has just cloned this seat's flash materials and marked the additive
    // ones fresh `Material` instances the renderer has never linked a
    // program for. The level's warm-up compiled the *originals* they were
    // cloned from, not these; skip this and the clone's first real draw is
    // the mid-burst link stall rule 6 exists to prevent.
    warmSubtree(occupancy.root);
  } else if (on && seatId) {
    // Re-entering the same vehicle at a specific door (its own EntryPoint
    // was in reach again) rather than wherever you last sat.
    occupancy.setActiveSeat(seatId);
    collectMannedGuns();
    warmSubtree(occupancy.root);
  }
  if (on && occupancy) {
    if (aircraft || car) {
      // Ticking the box is the user gesture the autoplay policy wants; the
      // same call on a map load is not one, and resume() there fails
      // harmlessly until the fly gate is clicked. A bare gun/seat root has
      // no engine to loop audio for at all.
      ensureAudioContext();
      setupEngineAudio();
    } else {
      // Furniture MG / Browning: no drivetrain voice, but the FireArms still
      // have patches (often already extracted next to a tank/ship that
      // carries the same gun).
      ensureAudioContext();
      setupMannedWeaponAudio();
    }
    // Back into three's matrix walk for the ride (freezeStatics) — the whole
    // vehicle, not just the seat, since a nested seat's own turret is a
    // descendant of the same frozen root.
    thawVehicle(occupancy.root);
    feedVehicleHud();
    // Render the seated soldier (passenger seats only — driver seats have no
    // poseAnimation and skip the load). Awaited here so the cockpit frame the
    // player sees is never the first external one with an empty seat.
    if (aircraft || car || occupancy.rootKind === 'gun') {
      loadSeatPose();
    }
  }
  if (!on && occupancy) {
    if (aircraft || car) {
      const vehicle = aircraft || car;
      stopEngineAudio();
      releaseGuns();
      disposeSeatPose();
      vehicle.reset();
      // `reset()` only restores the exterior when it owns the swap, and it
      // no longer does. Vacating the seat has to put the fuselage back
      // explicitly or the parked plane sits on the strip as an open cockpit
      // tub.
      view.setMode('cockpit');
      vehicle.setFirstPerson(false);
      vehicle.applyTransform();
      vehicle.applyRig();
    } else {
      // Splices `mannedGuns` out of `guns.groups` too (see `leaveManned`'s
      // own comment on why a bare `setFiring(false)` loop is not enough).
      releaseGuns();
      disposeEngineAudio();
    }
    freezeVehicle(occupancy.root);   // parked at its spawn: furniture again
    clearVehicleHud();
    occupancy = null;
  }
  // The world's occupied-vehicle state rides the same seats as the page's:
  // mounted on entry (the gun lists came fresh from `collectGuns` /
  // `collectMannedGuns` above), cleared on exit. A seat switch re-scopes the
  // lists through `switchSeat`'s own `refreshMount` below; the E-key exits
  // (leaveVehicle/leaveManned) clear it themselves, as they do `occupancy`.
  if (on && occupancy) {
    world?.setPlayerVehicle(LOCAL_PLAYER, {
      occupancy,
      vehicle: aircraft || car || null,
      kind: occupancy.rootKind,
      groups: vehicleGuns,
      manned: mannedGuns,
    });
    // The room's control channel: the server mounts this player in its own
    // world the same way (netcode.js MSG_ACTION; the vehicle id is the room
    // table's, matched by template + pose like the renderer's). The seat-dot
    // feed keeps the same id for its every-frame occupant read.
    netOccupiedVehicleId = netVehicleIdFor(occupancy.root);
    const netSeat = netSeatRow('enter');
    if (netSeat) netSendAction(netSeat);
  } else if (!on) {
    world?.clearPlayerVehicle(LOCAL_PLAYER);
    // The seat's gone; tell the server before the occupancy row is cleared
    // so the others' replicas release the hull.
    const netSeat = occupancy ? netSeatRow('exit') : null;
    if (netSeat) netSendAction(netSeat);
  }
  world?.resetStick(LOCAL_PLAYER);
  // Climbing in or out moves the drawn set and the camera both; re-collect
  // the nodes a tick poses and start a fresh pair (the render-interpolation
  // block, beside `footLookPending`).
  rebuildVehicleInterp();
  hud.textContent = isTouchDevice ? getTouchHudText()
    : on
      ? (mannedActive() ? HUD_MANNED : car ? HUD_DRIVE : HUD_PILOT)
      : (optOnFoot.checked && soldier ? HUD_FOOT : HUD_FLY);
  updateMobileControls();
}

// `?turret=<n>` multiplies `countsPerPixel` -- how many DirectInput counts one
// browser `movementX` pixel is worth.
//
// It used to scale every axis's declared `setMaxSpeed`, standing in for the
// unread magnitude of `PlayerInput[c_PIMouseLookX/Y]`. That is read now
// (`mouse-input.js`), so `setMaxSpeed` is used as the engine uses it and this
// knob has moved to the one quantity still unproven: whether a browser pixel
// is a mouse count. It is the same knob to a player -- turn it up and
// everything aims faster -- but it now moves the soldier's head as well as a
// turret, which is correct, because a mouse count is a mouse count.
// `window.__turretScale()` reads and writes it live.
if (params.has('turret')) {
  const n = Number(params.get('turret'));
  if (Number.isFinite(n) && n > 0) mouseInput.countsPerPixel = n;
}

const HUD_PILOT = 'W/S throttle · A/D rudder · arrows pitch and roll · LMB guns · RMB bombs · '
  + 'C view · mouse look around · R reset · 1-9 seats · E out on the ground · Esc';
const HUD_DRIVE = 'W/S drive and brake · A/D steer · mouse aims · LMB main gun · RMB coax · C view · '
  + 'R reset · 1-9 seats · E get out · Esc';
const HUD_MANNED = 'Mouse aims · LMB fires · 1-9 seats · E get out · Esc';

/**
 * Read the keyboard into the car and step the drive model.
 *
 * Round 3's first disclosed gap: this now runs every frame the vehicle
 * exists, not only while its own root/driver seat is the one active. Before,
 * `frame()`'s dispatch called this exclusively (never alongside `manned()`),
 * so switching to a nested seat — the Sherman's own hull gunner — stopped
 * `car.integrate(dt)` from ever being called again, freezing the hull's
 * momentum, suspension and gravity dead rather than leaving it to coast on
 * whatever throttle and steering the driver last set, the way it would if
 * the driver had simply let go of the wheel instead of climbing to a
 * different seat. Reading fresh keyboard input, firing this seat's own
 * `vehicleGuns` and moving the camera all stay exclusive to the frames the
 * driver's own root seat is actually the one occupied (`driving` below) —
 * otherwise nobody is holding this wheel right now, and `manned()` (not this
 * function) owns the camera and the trigger for whichever seat really is.
 */
function drive(dt) {
  if (!car) return;
  // The world has already run this function's old sim half (world.js
  // #vehicleTick): the HP-15 gate (`driving` below reads its answer), the
  // keyboard into c_PIThrottle/c_PIYaw/c_PIFire/c_PIAltFire, `car.integrate`,
  // the rigs (`applyTurrets` after, never before — the world keeps the page's
  // own ordering comment), the turret's aim and step, the FireStates and the
  // `vehicleGuns` loop with the unconditional-off `setFiring` semantics. The
  // shell left here is the presentation half: the muzzle flash's 1P choice
  // and the camera, including the passenger-seat pose.
  const driving = occupancy.isActiveRoot() && !vehicleInput.blocked;
  guns.firstPerson = car.firstPerson;
  // A non-driving seat (the Willy's passenger, a Sherman's hull gunner) still
  // needs the camera — the VehicleCamera owns the C-cycle for every seat of a
  // flyable vehicle, not only the root. The drivetrain step above is gated on
  // `driving` for the same reason the throttle is: the passenger can't steer.
  // But the camera pose is not steering, and letting it lapse here leaves the
  // view pinned to wherever the passenger's `setFirstPerson` swap left it —
  // exactly the "stuck in the passenger POV" bug SEAT-9 (camera-modes.md §3)
  // describes. Manned guns keep their own camera in `manned()` below, so this
  // only matters for the passenger seat of a drivable vehicle.
  if (!driving && !mannedActive() && view) {
    const pose = view.update(dt);
    camera.position.copy(pose.position);
    camera.quaternion.copy(pose.quaternion);
    return;
  }
  if (!driving) return;
  // Runs after the world integrated, so an external camera hangs off this
  // frame's attitude rather than last frame's.
  const pose = view.update(dt);
  camera.position.copy(pose.position);
  camera.quaternion.copy(pose.quaternion);
  // The dashboard readout this used to write into `#ammo` (road speed, gear)
  // is dropped rather than folded into `#hud`: that line is a timed
  // announcement (`showView`, the spawn/flag text) that overwrites itself on
  // a 2.2s timer, and a per-tick dashboard string competing with that timer
  // would either starve the announcements or itself flicker unreadably.
  // `car.control`/`.gear` stay live on `__car` for a headless check that
  // wants them; the vehicle HUD panel due from a future seats.js track is the
  // real replacement.
}
const driveFwd = new THREE.Vector3();

// --- manned guns and bare seats: the camera and trigger `drive()`/`pilot()`
// stop owning once you are not the one driving --------------------------
//
// Any seat whose root is not a drivable `air`/`ground`/`tank` (a Defgun, the
// AA guns, the Brownings — GUN-10, verify-r6.md's "manned gun" definition —
// or a bare passenger/observer seat), and *every* nested seat regardless of
// what its root is (the Sherman's own hull gunner, riding a vehicle whose own
// physics `drive()` still steps every frame, coasting, per round 3's first
// disclosed gap). `frame()`'s dispatch calls this *alongside* `pilot`/`drive`
// exactly when `mannedActive()` says so — never instead of them any more:
// the drivetrain's own momentum has to keep integrating even while `manned()`
// holds the camera and the trigger for the seat you are actually sitting in.
function mannedActive() {
  if (!occupancy || !occupancy.activeSeatId) return false;
  if (occupancy.isActiveRoot() && (aircraft || car)) return false;
  // A passenger seat ('seat' kind: no guns, no aim axes) is NOT a manned gun —
  // its camera belongs to VehicleCamera, not `manned()`, and forcing first-
  // person here locks the view to the passenger's eye node. Let drive()'s
  // non-driving branch claim the C-cycle instead (GUN-12).
  if (occupancy.seatKind(occupancy.activeSeatId) === 'seat') return false;
  return true;
}

const mannedCamPos = new THREE.Vector3();
const mannedCamQuat = new THREE.Quaternion();

/**
 * Step the active seat's presentation half. The world has already aimed and
 * stepped this seat's `TurretRig` (once per 30 Hz tick, the page's own
 * `stepTurret` loop — the engine's `TurretAxis.step` law, GUN-3), fired this
 * seat's FireArms and stepped their FireStates (world.js #vehicleTick); what
 * remains is the eye and the trigger's muzzle choice.
 *
 * The camera node never aims itself — GUN-5/6 (verify-r6.md), a gunner
 * Camera only ever rides the turret it is parented under — so the eye is just
 * wherever that hierarchy, freshly stepped in the world's tick, puts it. No
 * cockpit/orbit/fly-by modes here; a manned gun only ever has the one view
 * retail gives it.
 */
function manned(dt) {
  readWorldPose(occupancy.cameraNode(), mannedCamPos, mannedCamQuat);
  camera.position.copy(mannedCamPos);
  camera.quaternion.copy(mannedCamQuat);

  // Gunner cameras are always first-person — the 1P muzzle emitter, not the
  // mesh-mounted third-person flash that sits metres ahead of the eye.
  guns.firstPerson = true;
  // The world's occupied-vehicle tick has already written this seat's trigger
  // (`guns.setFiring`, gated on the HP-15 byte exactly as this function's old
  // loop did); the HUD feed for it happens in frame() after guns.advance.
}

/**
 * The number row: `c_PIMenuSelect1..9` in the game's own control maps
 * (SEAT-23/24, verify-r5.md) — digit N to the vehicle's Nth seat by spawn-
 * declaration order (`VehicleOccupancy.seatIdAt`; its own doc names the one
 * case this was checked against, and the one still open). A miss — an empty
 * position, or the seat already active — does nothing, same as the real
 * `map<int,PCO*>::find()` miss.
 */
function switchSeat(position) {
  if (!occupancy) return;
  const seatId = occupancy.seatIdAt(position);
  if (seatId === undefined || seatId === occupancy.activeSeatId) return;
  // Discard the previous seat's soldier pose (if any) before loading the new
  // one — a driver→passenger switch on a Willy, or vice-versa.
  disposeSeatPose();
  occupancy.setActiveSeat(seatId);
  collectMannedGuns();
  // The world's driver/gunner fire loops read the same scoped lists.
  world?.refreshMount(LOCAL_PLAYER, { groups: vehicleGuns, manned: mannedGuns });
  // A different seat is a different camera, often in a different rig; snap
  // rather than sweep the view across the hull for a frame.
  rebuildVehicleInterp();
  warmSubtree(occupancy.root);
  feedVehicleHud();
  hud.textContent = isTouchDevice ? getTouchHudText()
    : mannedActive() ? HUD_MANNED : car ? HUD_DRIVE : HUD_PILOT;
  loadSeatPose();
  updateMobileControls();
  // The room's control channel: seat switches are rows, not input words.
  const netId = netVehicleIdFor(occupancy.root);
  if (roomJoined && netId != null) {
    netSendAction({ type: 'seat', vehicle: netId, seat: position, action: 'switch' });
  }
}

// --- feeding the vehicle/gun HUD variables (BRIEFING2.md's contract) -------
//
// P1's painter (`viewer/hud.js`, a parallel track not yet merged into this
// worktree) reads `window.__hud.vars`, keyed by the engine's own MemeFile
// names exactly as `hud-layout.json` binds them. This track never paints —
// every write below is a plain assignment behind an optional-chained lookup,
// a documented no-op until that painter exists, and every value this seat
// does not currently have is cleared (`delete`d, not set false/0) so the
// painter's own culling rule ("unknown stays absent, cull the group") sees an
// honest table rather than an invented zero.
const HUD_VEHICLE_VARS = [
  'Vehicle/ShowVehicleIcon', 'Vehicle/VehicleIcon',
  'Vehicle/ShowTurretIcon', 'IconLookRotation',
  'Vehicle/VehicleHitPoints', 'Vehicle/VehicleMaxHitPoints',
  'Ammo/NumberOfWeaponIcons',
  'Ammo/PrimaryAmmoIcon', 'Ammo/PrimaryAmmoBar',
  'Ammo/PrimaryAmmo', 'Ammo/PrimaryAmmoText', 'Ammo/MaxPrimaryAmmo', 'Ammo/PrimaryMag',
  'Ammo/SecondaryAmmoIcon', 'Ammo/SecondaryAmmoBar',
  'Ammo/SecondaryAmmo', 'Ammo/SecondaryAmmoText', 'Ammo/MaxSecondaryAmmo',
  'Ammo/ReloadTime', 'Ammo/ReloadTimeSecondary', 'Overheat/OverHeat',
  // VHUD-11/VHUD-2: the seat-occupancy dots. One shared `Occupied/OccupiedData`
  // backs all six leaves (an array here, indexed by the leaf's own
  // `position`), and each dot's place inside the 128x128 vehicle icon is a
  // `Vehicle/VehiclePos/VehiclePosX<n>`/`Y<n>` pair — the layout's own
  // spelling, which nests the group (`test_hud_layout.py` has it verbatim).
  'Occupied/OccupiedData',
  ...Array.from({ length: 6 }, (_, i) => [
    `Vehicle/VehiclePos/VehiclePosX${i + 1}`,
    `Vehicle/VehiclePos/VehiclePosY${i + 1}`,
  ]).flat(),
];

function setHudVar(name, value) {
  const table = window.__hud?.vars;
  if (!table) return;
  if (value === null || value === undefined) delete table[name];
  else table[name] = value;
}

function clearVehicleHud() {
  for (const name of HUD_VEHICLE_VARS) setHudVar(name, null);
  // The dot feed's memo goes with them, or re-entering the same vehicle at
  // the same seat would leave all thirteen variables deleted and never
  // rewritten. The cached room id is the same kind of stale-on-exit state:
  // every exit path (setPilot off, leaveVehicle, leaveManned) funnels here.
  seatDotsFor = null;
  seatDotsSig = null;
  netOccupiedVehicleId = null;
}

// R2-8 (verify-r2.md's corrected report): the client's own case-sensitive
// decode of `setPrimaryAmmoBar`/`setSecondaryAmmoBar`. A name it does not
// recognise — a mod's typo, or the ambiguous bare `ABAmmoBar` vanilla itself
// never disambiguates — silently becomes 7, the client's own default, not an
// extraction bug.
const AMMO_BAR_CODES = {
  ABNone: 0, ABAmmoBarOnly: 1, ABAmmoBarHeatBar: 2, ABAmmoBarReloadBar: 3,
  ABHeatBarOnly: 4, ABReloadBarOnly: 5, ABIconOnly: 6,
};
function ammoBarCode(name) {
  return name == null ? null : (AMMO_BAR_CODES[name] ?? 7);
}

/**
 * `IconLookRotation` for the seat currently manned, in radians, or
 * `undefined` when this seat has no dial to draw.
 *
 * Un-negated on purpose: this is the engine's own value, positive to the
 * controlled PCO's right, and `hud.js` owns the canvas-versus-`RotateEffect`
 * sign flip. See `feedVehicleHud`.
 */
function turretDialAngle() {
  if (!occupancy?.showsTurretIcon(insideView())) return undefined;
  return occupancy.turret?.turretYawRadians();
}

// The seat-dot feed's memo: the vehicle it was last written for and the
// state signature it wrote. The positions are template data and never move,
// and the states only move when the local player switches seats or a room
// player enters, leaves or switches seats in this vehicle — so the table is
// rewritten on a change, not on every frame, and `frame()` can afford to ask
// every frame whether anything changed.
let seatDotsFor = null;
let seatDotsSig = null;

/** The room's other players seated in THIS vehicle, as the `{ seat, team }`
 *  rows `seatDots()` takes: `seat` in the occupancy's own position numbering
 *  (the snapshot's `seatIndex` is that index — `netcode-render.js` seats its
 *  replicas by the same law), `team` the server's team id. Empty when not in
 *  a room or when this vehicle has no room table id: single-player has no
 *  other occupants, and a vehicle the room does not track cannot be matched.
 *
 *  The table id is computed lazily rather than only on entry, because entry
 *  can happen before the first snapshot lands — `netVehicleIdFor` needs a
 *  pose to match against, and a null computed too early would otherwise stay
 *  null for the whole ride. */
function remoteSeatOccupants() {
  if (!roomJoined || !roomClient || !occupancy) return [];
  if (netOccupiedVehicleId == null) netOccupiedVehicleId = netVehicleIdFor(occupancy.root);
  if (netOccupiedVehicleId == null) return [];
  const out = [];
  for (const slot of roomClient.remoteSlots()) {
    const p = roomClient.remotePlayer(slot);
    if (p && p.seated && p.inVehicle && p.vehicleId === netOccupiedVehicleId
        && Number.isInteger(p.seatIndex)) {
      out.push({ seat: p.seatIndex, team: roomClient.teamOf(slot) });
    }
  }
  return out;
}

function feedSeatDots() {
  if (!occupancy) return;
  const dots = occupancy.seatDots(remoteSeatOccupants(),
                                  roomClient?.hello?.team ?? 0);
  const sig = dots.map(d => d.state).join(',');
  if (seatDotsFor === occupancy && sig === seatDotsSig) return;
  seatDotsFor = occupancy;
  seatDotsSig = sig;
  setHudVar('Occupied/OccupiedData', dots.map(d => d.state));
  for (let i = 0; i < 6; i++) {
    const dot = dots[i];
    setHudVar(`Vehicle/VehiclePos/VehiclePosX${i + 1}`, dot?.x ?? null);
    setHudVar(`Vehicle/VehiclePos/VehiclePosY${i + 1}`, dot?.y ?? null);
  }
}

/**
 * Is the camera in the engine's view mode 3 — the inside view?
 *
 * A driven vehicle has `VehicleCamera`'s own four-mode cycle and exactly one
 * of them (`cockpit`) is first person. A manned gun has no cycle at all:
 * `manned()` puts the eye on the seat's own Camera node and nothing else,
 * which is the one view retail gives it, so it is always inside.
 */
function insideView() {
  return mannedActive() ? true : !!view?.firstPerson;
}

/**
 * Push this vehicle's `Vehicle/*`/`Ammo/*` HUD block into `hud.vars`. Called
 * once on entry and every seat switch (icon/bar/hitpoints are effectively
 * static between those), and every tick from `manned()` so a manned gun's
 * live ammo/heat actually moves.
 */
function feedVehicleHud() {
  if (!occupancy) return;
  const rootHud = occupancy.seatInfo(occupancy.rootId)?.hud;
  const seatHud = occupancy.activeHud();
  setHudVar('Vehicle/ShowVehicleIcon', true);
  setHudVar('Vehicle/VehicleIcon', seatHud?.vehicleIcon ?? null);
  // The turret dial (`vehicleIcon`'s other three sprites, VHUD-7's rects): a
  // fixed back plate and barrel with the hull's own icon rotating underneath,
  // which is how a tank commander reads where the hull is pointing relative
  // to where he is looking.
  //
  // The angle is the engine's own `IconLookRotation` (VHUD-9, client
  // `0x006ae5d9`–`0x006ae616`):
  //
  //   IconLookRotation = atan2(dot(pcoRight, camForward),
  //                            dot(pcoForward, camForward))     // radians
  //
  // positive to the PCO's right, about the CONTROLLED PCO's own axes — the
  // hull, for a tank driver. For a seat whose camera rides the turret that is
  // the turret's own traverse, which is what `turretYawRadians()` returns.
  //
  // It replaced `headingRadians()`, and the swap is one half of a PAIR: that
  // accessor carries `seats.js`'s `RIG_SIGN.yaw = -1`, and `hud.js` used to
  // rotate the sprite clockwise (canvas `rotate(+θ)`) where the engine's
  // `RotateEffect` is counter-clockwise. Two errors cancelling, which is why
  // the dial looked right. `hud.js` now rotates by `-angle`; feed it the
  // negated value again and every dial mirrors.
  //
  // Gated, for now, on there being a traverse to show at all. VHUD-9's real
  // trigger is `(seatCamera.viewMode == 3) && pcoTemplate.hasTurretIcon`, and
  // `setHasTurretIcon` only reached the extract in this round's `con.py`
  // change, so a scene baked before it has no field to read. Handled where
  // the gate is, not here.
  const heading = turretDialAngle();
  setHudVar('Vehicle/ShowTurretIcon', heading === undefined ? null : true);
  setHudVar('IconLookRotation', heading === undefined ? null : heading);
  // The seat-occupancy dots (VHUD-11). `in-game-hud.md` used to record their
  // positions as "live-bound per vehicle", i.e. carried by nothing the
  // extractor could reach; they are `setVehicleIconPos` on each seat's own
  // PlayerControlObject, and `con.py` simply had no hit for the word. Fed as
  // one shared state array (`Occupied/OccupiedData`, which is what the layout
  // binds — one `BfOccupiedVehicleData` object backs all six leaves) plus a
  // position pair per dot. A seat whose extract predates the word feeds no
  // pair and `hud.js` keeps the layout's own literal rect.
  //
  // Called here for the entry frame and on every seat switch; `frame()` also
  // calls it every frame, because a room player can change this vehicle's
  // occupancy at any moment. The feed's signature memo makes both cheap.
  feedSeatDots();
  // R2-31 (corrected, verify-r2.md): hitpoints/armor live on the root PCO
  // only, one Armor shared by every seat — never a nested seat's own value.
  //
  // Live when this vehicle is one the damage set knows about, and the template's
  // static number otherwise. Before the Armor existed this could only ever print
  // the authored maximum, so the bar never moved no matter what hit you.
  const live = occupiedVehicleDamage();
  setHudVar('Vehicle/VehicleHitPoints',
            live ? live.hitPoints : (rootHud?.hitpoints ?? null));
  setHudVar('Vehicle/VehicleMaxHitPoints',
            live ? live.maxHitPoints : (rootHud?.maxHitpoints ?? null));
  // Which copy of the ammo panel `menu/InGame` paints: the layout gates every
  // primary leaf on `NumberOfWeaponIcons == 1` and every secondary one on
  // `== 2` (VHUD, verify-r2.md R2-13), so a seat that never feeds it shows no
  // ammo at all. `setNumberOfWeaponIcons` is the seat's own word; the fallback
  // covers scenes extracted before it was carried — a declared secondary
  // means two panels, anything else one.
  setHudVar('Ammo/NumberOfWeaponIcons', seatHud?.numberOfWeaponIcons
    ?? (seatHud?.secondaryAmmoIcon || seatHud?.secondaryAmmoBar ? 2 : 1));
  setHudVar('Ammo/PrimaryAmmoIcon', seatHud?.primaryAmmoIcon ?? null);
  setHudVar('Ammo/PrimaryAmmoBar', ammoBarCode(seatHud?.primaryAmmoBar));
  setHudVar('Ammo/SecondaryAmmoIcon', seatHud?.secondaryAmmoIcon ?? null);
  setHudVar('Ammo/SecondaryAmmoBar', ammoBarCode(seatHud?.secondaryAmmoBar));
  // Live ammo/heat: manned seats via `manned()`; drivetrain roots via
  // `drive()`/`pilot()` (T4a) — both step FireState and gate `canFire`, so
  // `chainOnShot` is not orphaning counters on the Sherman cannon/coax.
  //
  // A seat's `fireArms` array can hold two nodes (R2-30: the Sherman's root
  // declares `NumberOfWeaponIcons 2`, cannon then coax) — `nodes[0]`/`[1]` is
  // this viewer's stand-in for "primary"/"secondary" weapon-icon slot, the
  // same declaration-order assumption SEAT-22's own seat-position map already
  // rests on; the extracted data has no independent primary/secondary tag to
  // cross-check it against.
  let nodes = [];
  if (mannedActive()) {
    nodes = occupancy.activeFireArmsNodes();
  } else if (occupancy.isActiveRoot() && (aircraft || car)) {
    nodes = occupancy.seatInfo(occupancy.rootId)?.fireArms || [];
  }
  const primary = nodes[0] ? fireStateFor(nodes[0]) : null;
  const secondary = nodes[1] ? fireStateFor(nodes[1]) : null;
  // `hud-layout.json`'s vehicle-skin ammo panel prints `Ammo/{Primary,Secondary}
  // AmmoText` (registered by a DIFFERENT client function, R2-12, than the
  // `PrimaryAmmo`/`MaxPrimaryAmmo`/`PrimaryMag` trio) -- the soldier-skin
  // panel's own text binds `Ammo/PrimaryAmmo` directly instead (R1-20), so this
  // second name is unique to the vehicle layout and was missing entirely: a
  // seated ammo panel (Defgun, Sherman) drew its icon and bar but never its
  // number. Neither verify-r2.md nor hud-layout.json's own notes say whether
  // the real engine ever lets `*AmmoText` diverge from the live count; mirrored
  // here rather than left unfed, since an unfed one is a confirmed-wrong "no
  // number ever" and a mirrored one is at worst a guess about a case nothing
  // surveyed exercises.
  setHudVar('Ammo/PrimaryAmmo', primary && !primary.unlimited ? primary.ammo : null);
  setHudVar('Ammo/PrimaryAmmoText', primary && !primary.unlimited ? primary.ammo : null);
  setHudVar('Ammo/MaxPrimaryAmmo', primary ? primary.stats.magSize : null);
  setHudVar('Ammo/PrimaryMag',
    primary ? (primary.magsLeft === Infinity ? -1 : primary.magsLeft) : null);
  setHudVar('Ammo/SecondaryAmmo', secondary && !secondary.unlimited ? secondary.ammo : null);
  setHudVar('Ammo/SecondaryAmmoText', secondary && !secondary.unlimited ? secondary.ammo : null);
  setHudVar('Ammo/MaxSecondaryAmmo', secondary ? secondary.stats.magSize : null);
  // `hud-layout.json` binds exactly one `Overheat/OverHeat` (no "...Secondary"
  // variant) shared by both panels' heat-bar copy — R2-30's own Sherman is the
  // real case this matters for, since its heat weapon is the coax (secondary),
  // not the cannon (primary): reading only `nodes[0]` would silently show no
  // heat at all while the coax cooked. No array/closure here — this runs every
  // tick `manned()` steps (rule 5, features/mesh-viewer-performance/README.md).
  const heated = primary?.hasHeat ? primary : secondary?.hasHeat ? secondary : null;
  setHudVar('Overheat/OverHeat', heated ? heated.heat : null);
  // Both reload-bar copies are a fraction of `reloadTime` remaining, scaled to
  // the `max: 1.0` the layout declares — direction (counts down to empty vs.
  // fills up as reload completes) is not settled by anything in
  // verify-r2.md/verify-r6.md or `hud-layout.json`'s own metadata, so this is
  // an approximation: counts down from full (just started) to empty (ready).
  // `reloadFraction` is a module-level function, not a closure allocated here,
  // for the same per-tick reason as `heated` above.
  setHudVar('Ammo/ReloadTime', readyFraction(primary, nodes[0]));
  setHudVar('Ammo/ReloadTimeSecondary', readyFraction(secondary, nodes[1]));
}

/** The `GunFire` group that actually fires this FireArms node — `mannedGuns`
 *  for a seat someone is sitting in, `vehicleGuns` for the drivetrain root's
 *  own.
 *
 *  Which list is asked first matters, and is not a detail: a drivetrain
 *  root's own FireArms end up in BOTH, because `collectMannedGuns()` collects
 *  whatever `occupancy.activeFireArmsNodes()` names and for the root seat
 *  that is the same pair of nodes `collectGuns()` already put in
 *  `vehicleGuns`. Only one of the two copies is ever fired — `manned()` and
 *  `drive()` each own their own list — so reading the idle copy's `cooldown`
 *  is reading a clock nothing winds, which is exactly how the reload bar came
 *  back "ready" a frame after the shell left. `mannedActive()` is the same
 *  test `frame()` uses to pick which of the two runs.
 *
 *  Plain loops rather than `find`, because this runs from `feedVehicleHud` on
 *  every tick and an arrow predicate would allocate a closure a frame
 *  (features/mesh-viewer-performance, rule 5). */
function fireGroupFor(node) {
  if (!node) return null;
  const live = mannedActive() ? mannedGuns : vehicleGuns;
  for (const group of live) if (group.node === node) return group;
  const other = live === mannedGuns ? vehicleGuns : mannedGuns;
  for (const group of other) if (group.node === node) return group;
  return null;
}

/** How ready this weapon is to fire again, `0` (just fired) to `1` (ready),
 *  or `null` when there is no weapon in that slot at all.
 *
 *  This used to read `state.reloadRemaining / reloadTime` alone, and on a
 *  tank cannon that is a bar which never moves: a Sherman's `reloadTime` is
 *  0.35 s and only runs once its whole 30-round magazine is out. What the
 *  player actually waits through between shells is the `roundOfFire`
 *  cooldown — 1/0.35 s = 2.86 s — which lives on the `GunFire` group, not on
 *  `FireState`. GUN-5 has the engine's own `isReadyToUseFire` gating on the
 *  eject-clip timer, the reload timer, the overheat timer AND the fire-rate
 *  timer together, so the bar takes whichever of them is still running: it
 *  is a readiness bar, and readiness is the last gate to clear.
 *
 *  Direction: fills as the weapon becomes ready, empty right after the shot.
 *  Neither verify-r2.md nor `hud-layout.json` settles which way this bar
 *  runs (VHUD-10 is still open on the whole live-value question for a
 *  driver's own weapons), so this is a choice, not a reproduction — made
 *  this way round because the alternative draws a FULL bar at the exact
 *  moment the gun cannot fire, which reads as "loaded" to anyone glancing at
 *  it, and because every other gauge in this layout is full when the thing
 *  it measures is in good shape. Module scope, not a closure inside
 *  `feedVehicleHud`, for that function's own stated per-tick reason. */
function readyFraction(state, node) {
  if (!state) return null;
  const reloadWindow = state.stats.reloadTime > 0 ? state.stats.reloadTime : 0;
  let remaining = reloadWindow > 0 ? state.reloadRemaining / reloadWindow : 0;
  const group = fireGroupFor(node);
  const rate = group?.stats.roundOfFire;
  if (group && rate > 0) {
    remaining = Math.max(remaining, group.cooldown * rate);
  }
  if (state.hasHeat && state.overheatRemaining > 0 && state.stats.timeDelayOnOverheat > 0) {
    remaining = Math.max(remaining, state.overheatRemaining / state.stats.timeDelayOnOverheat);
  }
  return 1 - Math.max(0, Math.min(1, remaining));
}

// --- walking up to a seat ----------------------------------------------------
//
// Every assembled vehicle carries its `EntryPoint` nodes — meshless, placed
// where a soldier walks in from, with `setEntryRadius` as their reach
// (`extras.seat.entryRadius`, 2.3 m on a Willys) — and the PCO root carries
// `setSoldierExitLocation` for the walk back out. Both are the game's own
// data; the only invention here is the 4 m fallback radius for a mod entry
// point that declares none.
const ENTRY_RADIUS_FALLBACK = 4;
const ENTRY_SCAN_PERIOD = 0.25;   // seconds between proximity sweeps on foot
// SEAT-6 (verify-r5.md, confirmed both passes): `toggleEntryPoint` opens with
// a hard-coded 1.0s cooldown per player, refreshed on every actual toggle
// (both `exitPlayer` and `toggleEntryPoint`'s own success path) — not a
// per-vehicle or per-entry-point value. One shared timestamp is therefore
// correct for this page's single soldier.
const SEAT_TOGGLE_COOLDOWN_MS = 1000;
let lastSeatToggle = -Infinity;
let entryPoints = null;           // [{node, vehicle, control, radius}]
let nearEntry = null;             // the seat the HUD is currently offering
let entryScan = 0;

/**
 * Index every walkable seat once per level — every `EntryPoint` of every
 * `PlayerControlObject` root in the scene, spawner-placed or not
 * (`findAllVehicleRoots`, `seats.js`), tagged with which of that vehicle's
 * seats it opens into (`listEntryPoints`). This is the whole of "make every
 * PlayerControlObject with an EntryPoint enterable": the Defgun, the AA guns
 * and the Brownings were level furniture `findVehicles` (spawner-scoped,
 * flight.js) never saw, and a passenger/gunner seat's own door was dropped by
 * the old control-tag filter this replaces.
 */
function collectEntryPoints() {
  entryPoints = [];
  for (const vehicle of findAllVehicleRoots(currentRoot)) {
    const control = vehicle.userData?.control || vehicle.name || 'vehicle';
    for (const entry of listEntryPoints(vehicle, ENTRY_RADIUS_FALLBACK)) {
      entryPoints.push({
        node: entry.node, vehicle, control,
        seatId: entry.seatId, radius: entry.radius,
      });
    }
  }
}

const entryWorld = new THREE.Vector3();

/**
 * The closest entry point whose declared radius reaches the soldier.
 *
 * Not reproduced: SEAT-13/13b's team/hostility gates (`BFfindEntryPoint`'s
 * own team check, and `validateBFEntryPoint`'s separate component check) —
 * this page has exactly one soldier and no second team's vehicles ever
 * appear as hostile, so there is nothing here for either gate to reject.
 *
 * Round 3's second disclosed gap: `pickNearest` (`seats.js`), not a bare
 * `distance < best` compare, because more than one `EntryPoint` can sit at
 * the exact same world position — the Sherman's driver and hull-gunner
 * doors, M3A1's four passenger seats sharing one side door (confirmed
 * against the live Wake scene: the Sherman's pair differs by ~1.1e-13 m,
 * M3A1's four-way tie by exactly 0) — where a plain compare would let
 * accumulated floating-point noise in each seat's own transform chain decide
 * the winner instead of the level's own data. `entryPoints` is built by
 * `collectEntryPoints()` in `surveyVehicle`'s own declaration order (root
 * seat first, SEAT-22), so `pickNearest`'s "first within `TIE_EPSILON` wins"
 * rule seats the driver ahead of the gunner at a shared Sherman door, and the
 * lowest-numbered passenger PCO at M3A1's — the same seat order the number
 * keys already use, not an arbitrary pick.
 */
function nearestEntry() {
  if (!entryPoints) collectEntryPoints();
  return pickNearest(entryPoints, entry => {
    entry.node.getWorldPosition(entryWorld);
    const distance = Math.hypot(entryWorld.x - soldier.x,
      entryWorld.y - (soldier.y + 1), entryWorld.z - soldier.z);
    return distance <= entry.radius ? distance : Infinity;
  });
}

/**
 * Watch for a door within reach, a few times a second rather than every
 * frame, and offer it on the HUD. Runs from `onFoot`.
 */
function scanForEntry(dt) {
  entryScan -= dt;
  if (entryScan > 0) return;
  entryScan = ENTRY_SCAN_PERIOD;
  const near = nearestEntry();
  if (near?.vehicle !== nearEntry?.vehicle) {
    hud.textContent = near
      ? isTouchDevice ? `ENTER ${near.control}` : `E — enter the ${near.control}`
      : isTouchDevice ? getTouchHudText() : HUD_FOOT;
  }
  nearEntry = near;
  updateMobileControls();
}

/**
 * From on foot into a seat. The soldier is suspended rather than torn down —
 * his weapon, magazines and flag selection all wait for the walk back out —
 * so only the presentation is packed away: the viewmodel, the crosshair, the
 * on-foot FOV.
 */
function enterVehicle(entry) {
  if (handWeapon) {
    if (handWeapon.group) guns.setFiring(handWeapon.group, false);
    handWeapon.rig.visible = false;
    // Holstering drops zoom — `HandFireArms::disable` (lnxded 0x08293da0)
    // calls setZoom(false) — and the eased FOV factor goes home with it.
    handWeapon.zoomed = false;
    handWeapon.rezoom = 0;
    handWeapon.fovCur = 1;
    handWeapon.worldFov = FOOT_FOV;
  }
  triggerHeld = false;
  clickQueued = false;
  aimHeld = false;
  // A button held through the climb in must not arrive already pulling the
  // vehicle's trigger — nor, on the way back out, the soldier's.
  seatFire = false;
  seatAltFire = false;
  // Not hidden here any more: `updateCrosshair` runs every frame and reads
  // the seat's own `setCrossHairType`, so a tank keeps its cross.
  camera.fov = FLY_FOV;
  camera.near = SEAT_NEAR;
  camera.updateProjectionMatrix();
  nearEntry = null;
  // Checked without an event on purpose: the change handler would tear the
  // waiting soldier down, and the checkbox is only being told the truth —
  // someone is in a vehicle.
  optPilot.checked = true;
  setPilot(true, entry.vehicle, entry.seatId);
  if (!occupancy) {
    // The seat refused (a null root; `pickVehicle`-less path). Back on foot
    // as if nothing happened. Every real `PlayerControlObject` root now
    // classifies to something (`seats.js`'s `classifyRoot` never returns
    // null for one), so this is defensive rather than a real refusal path
    // any of the vehicles this round targets can hit.
    camera.fov = FOOT_FOV;
    camera.near = 0.2;
    camera.updateProjectionMatrix();
    if (handWeapon) handWeapon.rig.visible = true;
    hud.textContent = isTouchDevice ? getTouchHudText() : HUD_FOOT;
  }
  resetMobileControls();
}

/**
 * Park the vehicle exactly where it stands — engine off, controls centred,
 * exterior restored — without `reset()`'s teleport back to spawn. This is
 * the difference between vacating a seat and returning the vehicle.
 *
 * Only meaningful for a root that actually has a drivetrain; a bare gun/seat
 * exit is `leaveManned`'s job, since there is no `Vehicle` instance here to
 * reset. Whichever one runs, exiting always empties the whole vehicle — this
 * page has exactly one occupant, so a nested seat's own exit ends the
 * driver's occupancy too (`leaveManned` delegates here when a drivetrain
 * exists, per the note on `mannedActive()`'s own approximation).
 */
function leaveVehicle() {
  const vehicle = aircraft || car;
  if (!vehicle) return;
  stopEngineAudio();
  releaseGuns();
  // The seated occupant goes with the seat. This is the E-key exit; the debug
  // pilot toggle's own path disposes him too, and `exitManned` does, but this
  // one did not — so stepping out of a jeep left a soldier sitting in mid-air
  // where the driver's seat had been, with his IK still being solved every
  // frame, and only the *next* entry cleaned him up.
  disposeSeatPose();
  vehicle.state.velocity.set(0, 0, 0);
  vehicle.state.angularVelocity.set(0, 0, 0);
  vehicle.state.throttle = 0;
  vehicle.setInput('c_PIThrottle', 0);
  vehicle.setInput('c_PIYaw', 0);
  vehicle.setInput('c_PIFire', 0);
  view.setMode('cockpit');
  vehicle.setFirstPerson(false);
  vehicle.applyTransform();
  vehicle.applyRig();
  freezeVehicle(vehicle.node);   // parked where it stands: furniture again
  releaseDrivenBody(vehicle);    // ... and a body on its own springs
  clearVehicleHud();
  occupancy = null;
  world?.clearPlayerVehicle(LOCAL_PLAYER);
  world?.resetStick(LOCAL_PLAYER);
}

/**
 * Where the occupant steps out, in world space: the vehicle's own
 * `setSoldierExitLocation` when it declares one (the Willys puts its driver
 * 1.5 m off the left running board), else two metres to the vehicle's left.
 * The declared vector is in Refractor's frame — z forward — so its Z is
 * negated at this boundary, the same fix `rig` angles get.
 */
function exitPose(vehicle) {
  const declared = vehicle.node.userData?.physics?.soldierExitLocation;
  const local = declared
    ? new THREE.Vector3(declared.position[0], declared.position[1],
      -declared.position[2])
    : new THREE.Vector3(-2, 0.5, 0);
  const position = local.applyQuaternion(vehicle.state.orientation)
    .add(vehicle.state.position);
  const fwd = driveFwd.set(0, 0, -1).applyQuaternion(vehicle.state.orientation);
  return {
    x: position.x, y: position.y, z: position.z,
    // The soldier's convention: forward is (sin yaw, 0, cos yaw). Stepping
    // out facing the way the vehicle faces reads right for both doors.
    yaw: Math.atan2(fwd.x, fwd.z),
  };
}

/**
 * E from a seat: back onto the ground beside it.
 *
 * No speed/altitude gate on purpose: SEAT-5/SEAT-8 (verify-r5.md, confirmed
 * in both the original and verifier passes) read `isAllowedToExit()` in full
 * and found a pure geometry/collision check with no call to anything speed-
 * or altitude-related — bailing out of a moving plane is genuine vanilla
 * behaviour, not a bug to guard against. A prior pass here gated on
 * `grounded || airspeed<3`, which the report contradicts directly; removed.
 * The real gate (SEAT-6/SEAT-9: a room check at `soldierExitLocation`, run
 * only when the template's `hasRestrictedExit` is set) is not implemented —
 * `exitPose`'s placement is trusted as-is, same as it already was on the
 * ground. `soldier.spawn()`'s own `SPAWN_DROP` fall-to-floor already handles
 * landing an exit point that turns out to be in mid-air.
 */
function exitVehicle() {
  const vehicle = aircraft || car;
  if (!vehicle) return;
  const exit = exitPose(vehicle);
  // The room's control channel: capture the seat row before leaveVehicle
  // clears the occupancy the row is read from.
  const netSeat = occupancy ? netSeatRow('exit') : null;
  leaveVehicle();
  if (netSeat) netSendAction(netSeat);
  optPilot.checked = false;
  if (optOnFoot.checked && soldier) {
    soldier.collider = collider;
    soldier.spawn(exit.x, exit.y, exit.z, exit.yaw);
    camera.fov = FOOT_FOV;
    camera.near = 0.2;
    camera.updateProjectionMatrix();
    if (handWeapon) handWeapon.rig.visible = true;
    hud.textContent = isTouchDevice ? getTouchHudText() : HUD_FOOT;
  } else {
    // Nobody was waiting in the seat — the pilot box was ticked from free
    // fly — so E hands back the free camera where the vehicle stopped.
    placeCamera();
    updateHud();
  }
  resetMobileControls();
}

const exitWorldPos = new THREE.Vector3();
const exitWorldQuat = new THREE.Quaternion();
const exitFwd = new THREE.Vector3();

/**
 * `exitPose`'s twin for a seat with no `Vehicle` instance behind it: a bare
 * gun/seat root has no simulated `.state` to read at all, so this reads the
 * ROOT's own live world transform instead — `Object3D.matrixWorld`, not
 * `Vehicle.state`, which is the only thing a bare seat has. For a nested seat
 * of a vehicle that *does* have a drivetrain (the Sherman's hull gunner) that
 * transform is not a stale snapshot either: `drive()`/`pilot()` keep
 * integrating it every frame regardless of which seat is active (round 3's
 * first disclosed gap), so stepping out while the hull is still coasting
 * places the soldier at the tank's real current position, not wherever it
 * was the moment the turret seat was taken. Always the root's transform, not
 * the active seat's own: stepping out relative to a spinning turret's own
 * frame would swing the exit point with the aim, which is not what a hull
 * door does.
 */
function exitPoseManned(occ) {
  const declared = occ.exitLocationNode()?.userData?.physics?.soldierExitLocation;
  const local = declared
    ? new THREE.Vector3(declared.position[0], declared.position[1],
      -declared.position[2])
    : new THREE.Vector3(-2, 0.5, 0);
  readWorldPose(occ.root, exitWorldPos, exitWorldQuat);
  const position = local.applyQuaternion(exitWorldQuat).add(exitWorldPos);
  const fwd = exitFwd.set(0, 0, -1).applyQuaternion(exitWorldQuat);
  return {
    x: position.x, y: position.y, z: position.z,
    yaw: Math.atan2(fwd.x, fwd.z),
  };
}

/**
 * `leaveVehicle`'s twin for a seat with no drivetrain: stop firing, forget
 * the seat table, hand the vehicle's matrix back to the per-frame freeze. The
 * turret is deliberately left aimed where it was — retail furniture keeps
 * whatever pose its last gunner left it in, and nothing in verify-r5/r6
 * describes a return-to-rest on exit.
 *
 * If the root also has a drivetrain (a nested seat's own exit, e.g. the
 * Sherman's hull gunner stepping out without ever having driven), this page
 * still has only one occupant, so the exit empties the whole vehicle —
 * delegate to `leaveVehicle` for the parts only it knows how to reset.
 */
function leaveManned() {
  if (!occupancy) return;
  if (aircraft || car) {
    // `leaveVehicle` calls `releaseGuns()` itself, which already releases
    // `mannedGuns` the same way it releases `vehicleGuns` — see there.
    leaveVehicle();
    return;
  }
  // `releaseGuns()`, not a bare `setFiring(false)` loop: it also splices each
  // group out of `guns.groups`, or re-entering the same gun later would pile
  // a second, permanently-inert group onto the first every cycle instead of
  // replacing it (`collectMannedGuns` on the next entry only clears whatever
  // is still in `mannedGuns`, which this function is about to empty).
  releaseGuns();
  disposeSeatPose();
  disposeEngineAudio();
  freezeVehicle(occupancy.root);
  clearVehicleHud();
  occupancy = null;
  world?.clearPlayerVehicle(LOCAL_PLAYER);
}

/** E from a manned-only seat: a bare furniture gun, or a nested seat of a
 *  vehicle whose root seat you never drove this time. */
function exitManned() {
  if (!occupancy) return;
  const exit = exitPoseManned(occupancy);
  const netSeat = occupancy ? netSeatRow('exit') : null;
  leaveManned();
  if (netSeat) netSendAction(netSeat);
  optPilot.checked = false;
  if (optOnFoot.checked && soldier) {
    soldier.collider = collider;
    soldier.spawn(exit.x, exit.y, exit.z, exit.yaw);
    camera.fov = FOOT_FOV;
    camera.near = 0.2;
    camera.updateProjectionMatrix();
    if (handWeapon) handWeapon.rig.visible = true;
    hud.textContent = isTouchDevice ? getTouchHudText() : HUD_FOOT;
  } else {
    placeCamera();
    updateHud();
  }
  resetMobileControls();
}

// --- on foot ----------------------------------------------------------------
//
// All the arithmetic is in `soldier.js`, which imports nothing and is driven by
// `tests/test_soldier.py` under node. This page only feeds it the keyboard and
// takes the eye pose back, the same seam `flight.js` keeps between VehicleState
// and the presentation layer.

let soldier = null;
// The level's headless simulation core (world.js): N soldiers, the vehicle
// bodies, guns, combat area, supply depots, tickets and the collider, stepped
// at the engine's 30 Hz from one buffered input per player per tick. The page
// builds it once per level in show(), feeds it the local player's input every
// frame (frame() below) and keeps everything presentational. The one player
// this page owns is always `LOCAL_PLAYER`; `world` is the same object a P2
// server would run for every remote one.
let world = null;
const LOCAL_PLAYER = 'local';
// The input object frame() built for this frame — onFootCamera's footFire
// hands the deviation model the same c_PIThrottle/c_PIYaw values the world
// consumed this tick (the engine's speed gates read the *input*, not the
// achieved velocity).
let frameInputLast = null;
let seatSoldier = null;   // the seated soldier pose scene, if one is loaded
let flags = [];
let prone = false;           // `c_PILie` is a toggle, not a hold
const FLY_FOV = camera.fov;
const FLY_NEAR = camera.near;
// The near plane of a seat's own view. `Renderer_drawView` (0x004662c0) gives
// the engine's render view a near plane of 0.1 m and nothing moves it
// (`handweapon-view-and-deviation.md` section 3, quoted again at the near pass
// in `frame()`); the free-fly camera's 0.5 is this page's own, chosen for a
// camera that never sits inside anything.
//
// A vehicle's first-person interior is what needs it. `1P_Sherman_Gunner_M1`
// — the box a tank commander looks out of — spans 0.089 m to 0.40 m ahead of
// `ShermanCamera`, so at 0.5 every one of its 633 triangles fell inside the
// near plane and the driver saw straight through his own tank: no frame, and
// the gun barrel (0.57 m out, and so NOT clipped) smeared across the right of
// the screen as a shapeless wedge. At 0.1 the frame draws and occludes the
// barrel, which is what the wedge always was.
const SEAT_NEAR = 0.1;
// GUN-6 (verify-r6.md): a manned gun's own Camera never sets its own FOV in
// vanilla (`setVehicleFov` — no vanilla vehicle calls it) and the render
// view's own default is 57.30 degrees vertical. `enterVehicle` sets
// `camera.fov = FLY_FOV` (60) on the way in for every kind alike — fine for
// an aircraft/car, whose `VehicleCamera` owns the view already, but a manned
// gun never gets that camera at all, so nothing else was ever correcting it.
const MANNED_GUN_FOV = 57.3;

// --- the soldier's hit points, and the supply depots that refill them ------
//
// `verify-r4.md` (hit points, damage, healing) and `verify-r3.md` (supply
// depots), both `## Corrected report`. `armor.js` and `supply.js` are
// framework-free — see their own headers — so all the state tying them to
// *this* soldier lives here, in the on-foot/spawn code this track owns.

/** The on-foot soldier's own hit points, or null while none exists. Reset to
 *  full on every spawn/redeploy (`spawnAtFlag`, below — the one reset point,
 *  since `setOnFoot(true)` calls it too). */
let soldierArmor = null;

/** `_shared/loadouts.json` ships `maxHitpoints: 30` for every vanilla-family
 *  kit (`verify-r4.md` R4-25's own cross-mod survey). Only the fallback for
 *  a maps tree extracted before that field existed — the same role
 *  `FALLBACK_PRIMARIES` plays for weapons below. */
const SOLDIER_MAX_HP_FALLBACK = 30;

/** Wake's 52 `SupplyDepot` nodes, collected once per level (see
 *  `collectSupplyDepots`) and cached against the `currentRoot` they came
 *  from, so a map switch — a new root object — rebuilds the field exactly
 *  once rather than every frame. Built lazily from `onFoot`, this track's
 *  one hook into the per-frame loop. */
let supplyField = null;
let supplyDepotsRoot = null;

/** Reused rather than reallocated every frame, the way `soldier.js`'s own
 *  `_tickInput` is: `onFoot` updates these fields in place and hands the
 *  same object to `supplyField.tick`/`canHeal`/`canRearm` every call.
 *  `refillAmmo` is wired once, beside `handWeapon`'s own declaration below —
 *  a closure over it, so it always acts on whatever is currently in hand. */
const supplyTarget = { x: 0, y: 0, z: 0, team: 2, armor: null, refillAmmo: null };

// Fall damage — the engine's own formula, in `fall-damage.js`.
//
// Ledger **HP-14**, `GameServer::handleCollisionLandOrWater` lnxded
// `0x08154960`, delivered through the object-level `*0x15c` dispatch:
// `BFSoldier::handleDamage` (0x08270980) -> `SimpleObject::handleDamage` ->
// `Armor::damage`. HP-6's "the engine does not damage falling soldiers" was
// refuted in 2026-09-18 and the hand-tuned R4-18 ramp it justified is long
// gone; what this replaces is the *second* approximation, a single fitted
// `FALL_KINETIC_HP = 10` calibrated against one measured Wake ledge fall.
//
// Three things the fitted version could not do, and the module now does:
//
//   - **The 8.0 m/s subtraction and its early return.** Nothing under
//     8 m/s of arrival costs anything at all, and every term downstream uses
//     the reduced speed. The fitted ramp had a 1.0 m tolerance instead, which
//     is why it had to be eight times too gentle per metre to compensate.
//   - **The two per-surface scalars are read, not fitted.** They are ordinary
//     MaterialManager numbers and `_shared/damage.json` has carried them all
//     along: `materialDamage = 30` and `damageMod(ground, 40) = 0.001` for
//     every terrain material, so their product is 0.030. The old constant
//     implied about 0.026, which is why it was close.
//   - **Water, and the impact angle.** A fall into the sea is about 67x
//     gentler and squares the cosine instead of cubing it.
//
// The height tracked is no longer the airborne peak. The engine's `F` is
// `getLastCollisionHeight() - pos.y` — the height of the last *contact* — so a
// jump straight up is billed 0 and a jump off a ledge is billed the ledge
// rather than the apex above it. `SoldierBody` keeps that, and captures the
// impact speed before `#settle` zeroes `velocity.y` to plant the feet;
// `Soldier.step` latches the landing for the frame. All this page does is read
// it and hand it to the formula.
//
// Measured on flat ground at g = -14.73, 30 HP, no kit damping: nothing below
// 3.97 m, 1.2 HP at 4 m, 10.9 at 6 m, 21.7 at 7 m, lethal at 7.55 m.

// The death cam: on the on-foot soldier's death (HP ≤ 0) the game holds the
// camera floating above/by the corpse for a short beat before the deploy
// screen opens (see hitpoints-and-damage.md §7 'Client: local-player death' —
// `FUN_004933d0` → `SpawnScreenStuff::setVisible(true)`; the float is a brief
// beat, not a decoded client animation). `soldierDead` latches until respawn
// so a follow-up `__damage` on an already-dead body does not re-fire the flow.
let soldierDead = false;
let deathCamTimer = 0;    // seconds left floating over the corpse before openDeploy
const DEATH_CAM_BEAT = 1.2;  // s — short float over the corpse before deploy shows
const deathCamPos = new THREE.Vector3();

// How the death cam is framed, and for how long. Two settings, because the two
// deaths are showing different things: on foot the subject is the body that
// just fell over, and the camera floats right above it; killed inside a
// vehicle the subject is the **burning hull**, so the camera pulls back behind
// and above the wreck and holds longer, which is the shot BF1942 gives you —
// the crash first, then the spawn screen. Neither the distances nor the beats
// are engine numbers (the client's own death cam was never decoded past
// `FUN_004933d0` opening the spawn screen); they are framing.   [HOUSE RULES]
const DEATH_CAM = {
  foot:    { lift: 3.5, back: 0,   pitch: -0.9,  beat: DEATH_CAM_BEAT },
  vehicle: { lift: 4.5, back: 7.5, pitch: -0.55, beat: 3.0 },
};
let deathCamShot = DEATH_CAM.foot;
/** What the death cam is framed on: `null` for the corpse's own eye — the
 *  on-foot death — or `{ x, y, z, yaw }`, the burning hull the player was in. */
let deathCamTarget = null;
/** Reused so the death cam costs no allocation per frame. */
const deathCamAt = { x: 0, y: 0, z: 0, yaw: 0 };

/** The supply and health side of the in-game HUD writes the engine's own
 *  variable names straight into the painter's table, the same one
 *  `updateSoldierHud` fills; `gameHud` is declared with the painter further
 *  down, and every write below happens inside a call, never at load. */
const hudBridge = { get vars() { return gameHud.vars; } };

/** Fill the flag picker from the level's own control points.
 *
 *  Rebuilt whole, but not forgetful: the deploy screen writes its choice into
 *  this select and `setOnFoot` rebuilds the options before reading it back,
 *  and an innerHTML wipe resets a select to its first option. A level switch
 *  clears the value in `show()` first, so the memory never crosses maps. */
function buildSpawnFlags() {
  const kept = spawnFlagSelect.value;
  // The world owns the flags (world.js builds them from the level data the
  // engine's way); the deploy screen reads the same array it always read.
  flags = world?.flags ?? [];
  spawnFlagSelect.innerHTML = '';
  for (const [index, flag] of flags.entries()) {
    const option = document.createElement('option');
    const side = flag.team === 1 ? 'Axis' : flag.team === 2 ? 'Allied' : 'neutral';
    option.value = String(index);
    option.textContent = `${flag.name} (${side}, ${flag.spawns.length})`;
    spawnFlagSelect.appendChild(option);
  }
  if (kept !== '' && Number(kept) < flags.length) spawnFlagSelect.value = kept;
  // The sidebar picker is a debug aid; the deploy screen is the real join
  // path (Caps Lock / auto-open). Keep the select populated whenever there
  // are flags so a later commit can read it, and only hide it when empty.
  spawnFlagSelect.hidden = !flags.length;
  return flags.length;
}

/** Put the soldier at the selected flag, on the next of its spawn points.
 *  The pick itself is the world's (pickSpawn/spawnYaw inside world.js —
 *  `spawnPlayer` holds the per-player walk of the spawn list, so the page
 *  never carries `spawnIndex`); this half is the kit, the latch resets and
 *  the HUD line that always went with a spawn. */
function spawnAtFlag(advance = false) {
  if (!soldier || !flags.length || !world) return false;
  const flag = flags[Math.min(Number(spawnFlagSelect.value) || 0, flags.length - 1)];
  const spawned = world.spawnPlayer(LOCAL_PLAYER, {
    flag, advance, group: flag.vehicle ? activeDeployGroup(flag) : null });
  if (!spawned) return false;
  const spawn = spawned.spawn;
  prone = false;
  // A fresh body is full health, from the kit's own template (`soldierMaxHp`,
  // beside `kitLoadout` below) — every spawn and every redeploy passes
  // through here, so this is the one reset point. The world owns the Armor
  // record per player, but this is the same object the HUD has always read.
  soldierArmor = new Armor(soldierMaxHp(flag));
  world.setPlayerArmor(LOCAL_PLAYER, soldierArmor);
  world.setPlayerSupply(LOCAL_PLAYER, { team: deployTeamId, refillAmmo: supplyTarget.refillAmmo });
  // Respawn clears the death cam: the fresh body is alive, so the latch
  // must not hold the corpse cam over the new soldier.
  soldierDead = false;
  deathCamTimer = 0;
  deathCamShot = DEATH_CAM.foot;
  deathCamTarget = null;
  // The weapon follows the flag: switching to the other side's spawn swaps
  // the SMG. A no-op when the right one is already in hand.
  ensureHandWeapon(flag);
  // A fresh body somewhere else entirely: the eye must not sweep there.
  snapPresentation();
  hud.textContent = `${flag.name} · ${spawn.name}`;
  clearTimeout(hudViewTimer);
  hudViewTimer = setTimeout(updateHud, 2200);
  // The room's control channel: the server re-places its own copy of this
  // player on the same flag (fresh Armor at the kit's max — the spawn row
  // names the kit so both sides build the same Armor from loadouts.json).
  if (roomJoined) {
    netSendAction({
      type: 'spawn',
      flag: Math.min(Number(spawnFlagSelect.value) || 0, flags.length - 1),
      kit: deployKit,
    });
  }
  return true;
}

function setOnFoot(on) {
  if (on && optPilot.checked) {      // the two modes are exclusive
    optPilot.checked = false;
    setPilot(false);
  }
  // Either edge tears the old weapon down: entering rebuilds it against the
  // current level's gun index (a map switch has just cleared `guns.groups`),
  // leaving must not park a rifle on the free-fly camera.
  disposeHandWeapon();
  if (on) {
    // The soldier is the world's: `addPlayer` builds it the engine's way (a
    // fresh Soldier on the collider, spawned at the team's first flag) and
    // the page borrows the instance for the camera, exactly as the world's
    // records are the only ones the HUD reads.
    let player = world?.addPlayer(LOCAL_PLAYER, { team: deployTeamId });
    soldier = player?.soldier ?? null;
    if (!buildSpawnFlags() || !spawnAtFlag()) {
      // A level with no control point that owns a spawn group has nowhere to
      // put a soldier; say so rather than dropping him at the origin.
      world.removePlayer(LOCAL_PLAYER);
      soldier = null;
      optOnFoot.checked = false;
      spawnFlagSelect.hidden = true;
      hud.textContent = 'this level declares no flag with soldier spawns';
      return;
    }
    // The world's own FOV (`renderer.fieldOfView 1`, not `set1pFov` — the
    // arms rig's near pass picks its own, see frame()), and a near plane
    // that clears the capsule so a wall you are pressed against is drawn
    // rather than clipped through.
    camera.fov = FOOT_FOV;
    camera.near = 0.2;
    camera.updateProjectionMatrix();
    spawnFlagSelect.hidden = false;
    hud.textContent = isTouchDevice ? getTouchHudText() : HUD_FOOT;
  } else {
    // The deploy screen cannot outlive the mode it selects for: the pilot
    // checkbox's exclusivity and the on-foot box both land here with the
    // overlay possibly still up.
    if (deployActive()) toggleFullMap(false);
    // The soldier was the world's record; the world stops stepping it (a
    // ghost left in the players map would keep walking on its last input).
    world.removePlayer(LOCAL_PLAYER);
    soldier = null;
    // The soldier's own HP is meaningless off-foot; drop it and the icons
    // that read it rather than leave a stale number for the next spawn's
    // first frame to flash.
    soldierArmor = null;
    delete hudBridge.vars['Soldier/SoldierHitPoints'];
    delete hudBridge.vars['Soldier/SoldierMaxHitPoints'];
    delete hudBridge.vars['ShowHealIcon'];
    delete hudBridge.vars['ShowReloadIcon'];
    spawnFlagSelect.hidden = true;
    camera.fov = FLY_FOV;
    camera.near = FLY_NEAR;
    camera.updateProjectionMatrix();
    // `getTouchHudText()`, not the `HUD_TOUCH` this file once believed in —
    // that name was never declared, and reading it would throw on a phone.
    hud.textContent = isTouchDevice ? getTouchHudText() : HUD_FLY;
    // The fullscreen `?kblock` took for on-foot play goes with it.
    kbLockLeave();
  }
  updateMobileControls();
}

// `let`: under `?kblock` the Escape hint changes for as long as the
// fullscreen session lasts (kbLockEnter). Without it this never changes.
let HUD_FOOT ='WASD move · Shift walk · Ctrl crouch · Z prone · Space jump · '
  + 'LMB fire · RMB aim · R reload · CapsLock / M redeploy · Esc menu';
const HUD_FOOT_PLAIN = HUD_FOOT;
const HUD_FOOT_KBLOCK = `${HUD_FOOT_PLAIN} · hold Esc exits full screen`;

/** Wake's (or any level's) `SupplyDepot` nodes, world position resolved
 *  through the scene graph — a depot is usually parented under a `Bundle`
 *  (`extract_map.py`'s own placement) and does not carry its own world
 *  translation, only the chain above it does. Run once per level load, from
 *  `onFoot` (below), never per frame. */
function collectSupplyDepots(root) {
  const depots = [];
  if (!root) return depots;
  const pos = new THREE.Vector3();
  root.traverse(obj => {
    const data = obj.userData?.supply;
    if (!data || obj.userData.templateKind !== 'SupplyDepot') return;
    obj.updateWorldMatrix(true, false);
    obj.getWorldPosition(pos);
    depots.push(new SupplyDepot({ x: pos.x, y: pos.y, z: pos.z }, data, obj.name));
  });
  return depots;
}

/**
 * The on-foot camera half of the old `onFoot()` — the sim half went to the
 * world's 30 Hz soldier tick (world.js #soldierTick): the look was applied
 * per tick with the engine's own law (the pumped pair `frame()` handed over,
 *  applied per tick with the engine's own law (the pumped pair `frame()`
 *  handed over, `soldier.look`'s clamp included), the body stepped and the
 *  HP-14 fall damage landed against the world player's Armor — in the old
 *  order, look first because the engine turns the soldier inside the same
 *  `handlePlayerInput` call that reads his movement input. What is left here
 *  is the presentation: the death cam's latch and timer, the supply HUD, the
 *  eye pose, the trigger and the door scan.
 *
 *  The sim runs on fixed ticks inside `step()` above — the world's 30 Hz, the
 *  body's own 60 Hz within it, and since the headless-World refactor the
 *  latter is advanced in whole 1/30 increments from inside the former, so its
 *  alpha is always zero and `soldier.eye()` is raw tick state. This function
 *  therefore does its own interpolation, against the WORLD's clock: the eye
 *  is blended between the last two tick boundaries by `presentAlpha`, and the
 *  view angles are not blended at all but predicted forward from the pending
 *  mouse counts, which costs no latency. The whole argument, and the
 *  tick-exact-pose constraint it has to respect, is in the render-interpolation
 *  block beside `footLookPending`.
 *  The bob's amplitudes are the game's `setCameraShake*`;
 *  `soldier.js` has the citation. A dead body swaps in the death cam: the
 *  same eye base but parked a couple of metres above it and pitched down
 *  onto the corpse, so the view "floats over the dead player" for the beat
 *  before the deploy screen takes over.
 */
function onFootCamera(dt) {
  if (!soldier) return;
  // Death cam → deploy. When the on-foot body's Armor dies (fall damage,
  // `window.__damage(n)`, a future projectile), latch the dead state and hold
  // a short camera beat over/by the corpse (the game's death cam) before the
  // deploy screen opens — `hitpoints-and-damage.md` §7 (client `FUN_004933d0`
  // opens the spawn screen on local death). Latches so a follow-up damage tick
  // cannot re-fire the flow, and is reset by `spawnAtFlag` on the next spawn.
  if (soldierArmor && !soldierDead && soldierArmor.destroyed) {
    soldierDead = true;
    deathCamShot = DEATH_CAM.foot;
    deathCamTarget = null;
    deathCamTimer = deathCamShot.beat;
    // The corpse cam itself is applied downstream, where the eye pose is
    // normally written (`soldierDead` branch) — this block only latches the
    // state and runs the deploy timer.
  }
  if (soldierDead) {
    deathCamTimer -= dt;
    if (deathCamTimer <= 0 && !deployActive()) {
      // The client opens the deploy screen the instant the local player dies;
      // the beat above is the brief float, then the spawn screen takes over.
      openDeploy();
    }
  }

  // Wake's SupplyDepot instances: collected once per level (a map switch
  // hands `currentRoot` a new object, caught here by reference), handed to
  // the world which does the ticking on its 30 Hz cadence —
  // `SupplyDepot.tick`'s internal 0.5s self-throttle (verify-r3.md SUP-11)
  // is what actually paces the give/heal, not the tick rate. The
  // `ShowHealIcon`/`ShowReloadIcon` HUD vars are un-throttled on purpose
  // (SUP-33/34): they track proximity every frame, the way the engine's own
  // icon predicates do, independent of the depot's own action cadence.
  if (world && supplyDepotsRoot !== currentRoot) {
    supplyDepotsRoot = currentRoot;
    world.setSupplyDepots(collectSupplyDepots(currentRoot));
    supplyField = world.supplyField;
  }
  supplyTarget.x = soldier.x; supplyTarget.y = soldier.y; supplyTarget.z = soldier.z;
  supplyTarget.team = deployTeamId;
  supplyTarget.armor = soldierArmor;
  hudBridge.vars['ShowHealIcon'] = supplyField.canHeal(supplyTarget);
  hudBridge.vars['ShowReloadIcon'] = supplyField.canRearm(supplyTarget);
  if (soldierArmor) {
    hudBridge.vars['Soldier/SoldierHitPoints'] = soldierArmor.hitPoints;
    hudBridge.vars['Soldier/SoldierMaxHitPoints'] = soldierArmor.maxHitPoints;
  }

  // The drawn eye: this frame's instant between the last two tick boundaries.
  // The bob rides in it — `soldier.eye` adds `bobUp`/`bobSide`, and the bob
  // advances once per world tick like everything else — so blending the whole
  // eye smooths the shake as well as the stride.
  footEye.x = footEyePrev.x + (footEyeCur.x - footEyePrev.x) * presentAlpha;
  footEye.y = footEyePrev.y + (footEyeCur.y - footEyePrev.y) * presentAlpha;
  footEye.z = footEyePrev.z + (footEyeCur.z - footEyePrev.z) * presentAlpha;
  // The drawn view: the simulated view plus the rotation the pending mouse
  // counts have already bought and the next tick is going to apply. Through
  // the pump's own conversion (`footLookPending`), the tick's own degrees-
  // per-axis law (`soldierLookDegrees`, x3 on yaw) and the soldier's own
  // pitch clamp (`lookPreview`) — no constant is restated here. Zero on any
  // frame that ran a tick, because that frame's pump consumed the counts.
  footLookPending(footPending);
  const per = soldierLookDegrees(footPending.x, footPending.y);
  soldier.lookPreview(-per.yaw * DEG_TO_RAD, -per.pitch * DEG_TO_RAD, footView);
  if (soldierDead) {
    // Behind the subject along its own facing and above it, by `deathCamShot`.
    // The subject is the corpse's eye for a death on foot and the hull for one
    // inside a vehicle (`deathCamTarget`). Forward is `(sin yaw, 0, cos yaw)` —
    // the soldier's convention throughout this file — so "behind" is minus that.
    const at = deathCamTarget || Object.assign(deathCamAt, {
      x: footEye.x, y: footEye.y, z: footEye.z, yaw: soldier.viewYaw,
    });
    const camYaw = at.yaw;
    deathCamPos.set(
      at.x - Math.sin(camYaw) * deathCamShot.back,
      at.y + deathCamShot.lift,
      at.z - Math.cos(camYaw) * deathCamShot.back);
    camera.position.set(deathCamPos.x, deathCamPos.y, deathCamPos.z);
    look.yaw = camYaw;
    look.pitch = deathCamShot.pitch;

    camera.position.set(footEye.x, footEye.y, footEye.z);

    look.pitch = footView.pitch;

  // axis, and the crosshair is drawn against this frame's FOV. A dead body
  // cannot fire. The input object is the one frame() built (the same values
  // the world consumed this tick).
  if (!soldierDead) footFire(dt, frameInputLast);
  // And after everything the frame owed: is there a door within reach.

 *  level binds to that row (`game.setKit <team> <row> <kit>`), the weapon at

 *  null where `_shared/loadouts.json` is absent or does not name the level;
 *  `weaponTemplateFor` then falls back to the vanilla table by nation. */
function kitLoadout(team, kitName = deployKit) {
  const side = loadouts?.levels?.[currentDir]?.[team];
  if (!side) return { kit: null, primary: null, soldier: null };
  const slot = KITS.indexOf(kitName);
  let kit = side.slots?.[String(slot)] || null;
  if (!kit || !loadouts.kits?.[kit]) {
    // A mod may file its classes in other rows; the class label is the
    // engine's own `setType`, so match on that before giving up.
    const wanted = KIT_CLASS[kitName];
    kit = Object.values(side.slots || {})
      .find(name => loadouts.kits?.[name]?.class === wanted) || kit;
  }
  return {
    kit,
    primary: loadouts.kits?.[kit]?.primary || null,
    soldier: side.soldier || null,

// cycle what the level's kit actually hands out, from `_shared/loadouts.json`'s
// per-kit `weapons` list (slot, template, weapon-bar icon).

let kitWeaponSlots = null;  // [{ slot, weapon, icon }] for the spawned kit
let handSlot = null;        // the slot number currently in hand, or null
// How long the weapon bar stays up after the last selection input. The
// engine's own read is `Weapon/SelectingWeapon`, whose client write site was
// never identified (the layout's gating var is certain, its lifetime is not);

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>BF1942 map flythrough</title>
<style>
  :root {
    --bg: #14150f;
    --panel: #1c1e16cc;
    --line: #2e3125;
    --text: #e6e4d9;
    --muted: #8d8f7e;
    --accent: #9aab5a;
    --warn: #c98a3e;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 ui-monospace, "Geist Mono", "SF Mono", Menlo, monospace;
    overflow: hidden;
  }
  canvas {
    display: block;
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    touch-action: none;
  }
  #hud, #gate, #side {
    position: absolute;
    pointer-events: none;
  }
  #side {
    pointer-events: auto;
    z-index: 3;
    top: 16px; left: 16px;
    width: 260px;
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 14px;
    backdrop-filter: blur(8px);
  }
  h1 {
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 10px;
  }
  select {
    width: 100%;
    margin: 0 0 12px;
    padding: 6px 8px;
    background: #14150f;
    color: var(--text);
    border: 1px solid var(--line);
    font: inherit;
  }
  .stat { color: var(--muted); font-size: 12px; }
  .stat strong { color: var(--text); font-weight: 500; }
  label.opt {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-top: 8px;
    color: var(--muted);
    cursor: pointer;
  }
  #hud {
    z-index: 2;
    left: 50%; bottom: 18px;
    transform: translateX(-50%);
    color: var(--muted);
    text-align: center;
    text-shadow: 0 1px 4px #000;
  }
  #gate {
    z-index: 1;
    inset: 0;
    display: grid;
    place-items: center;
    background: transparent;
    color: var(--text);
  }
  #gate[hidden] { display: none; }
  #gate span {
    pointer-events: auto;
    cursor: pointer;
    border: 1px solid var(--accent);
    padding: 10px 16px;
    letter-spacing: .08em;
    text-transform: uppercase;
    font-size: 11px;
    background: var(--panel);
  }
  a { color: var(--accent); }
</style>
</head>
<body>
<aside id="side">
  <h1>Map flythrough</h1>
  <select id="maps" aria-label="Level"></select>
  <div id="stats" class="stat">extract a level first</div>
  <label class="opt"><input type="checkbox" id="game-fog"> game fog distance</label>
  <label class="opt"><input type="checkbox" id="wire"> wireframe</label>
  <label class="opt"><input type="checkbox" id="vehicles"> vehicles</label>
  <label class="opt"><input type="checkbox" id="entire-map"> render entire map</label>
  <div class="stat" style="margin-top:12px">
    <a href="./index.html">vehicle inspector</a>
  </div>
</aside>
<div id="hud">WASD fly &middot; QE or scroll vertical &middot; mouse look &middot; Shift slow &middot; Esc</div>
<div id="gate"><span>Click to fly</span></div>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './vendor/loaders/GLTFLoader.js';

const DEFAULT_DRAW = 700;
const FLY_SPEED = 140;
const FLY_SLOW = 0.02;
const LOOK_SENS = 0.0022;
const FLY_KEYS = new Set([
  'KeyW', 'KeyA', 'KeyS', 'KeyD', 'KeyQ', 'KeyE',
  'ShiftLeft', 'ShiftRight',
]);

// ?shots keeps the drawing buffer so canvas.toDataURL() works for external
// screenshot tooling; off by default because it costs a buffer copy per frame.
const renderer = new THREE.WebGLRenderer({
  antialias: true,
  preserveDrawingBuffer: new URLSearchParams(location.search).has('shots'),
});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, 1, 0.5, 8000);
camera.position.set(0, 80, 0);

const hemi = new THREE.HemisphereLight(0xe8dcc0, 0x5a4a32, 1.35);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1d0, 2.4);
scene.add(sun);

const loader = new GLTFLoader();
const cubeLoader = new THREE.CubeTextureLoader();
const texLoader = new THREE.TextureLoader();
const bust = () => `?t=${Date.now()}`;
const lmCache = new Map();

const keys = new Set();
const look = { yaw: 0, pitch: -0.15 };
const cull = [];
let spawnersRoot = null;
let captured = false;
let lockHeld = false;
let dragging = false;
let lastPointerX = 0;
let lastPointerY = 0;
let currentRoot = null;
let extras = {};
let skybox = null;
let skyRoot = null;       // the level's SkyBox mesh, reparented to the scene
let cloudMesh = null;
let cloudUniforms = null;
let waterUniforms = null;
let waterAssets = [];     // textures owned by the water/cloud shaders
let simTime = 0;

const params = new URLSearchParams(location.search);

const optGameFog = document.getElementById('game-fog');
const optWire = document.getElementById('wire');
const optVehicles = document.getElementById('vehicles');
const optEntire = document.getElementById('entire-map');

function uiFocused() {
  const t = document.activeElement;
  return t && (t.tagName === 'SELECT' || t.tagName === 'INPUT' || t.tagName === 'TEXTAREA');
}

function isSlow() {
  return keys.has('ShiftLeft') || keys.has('ShiftRight');
}

function flySpeed() {
  return FLY_SPEED * (isSlow() ? FLY_SLOW : 1);
}

function lookDelta(dx, dy) {
  if (!dx && !dy) return;
  look.yaw -= dx * LOOK_SENS;
  look.pitch = Math.max(-1.2, Math.min(1.2, look.pitch - dy * LOOK_SENS));
}

addEventListener('keydown', e => {
  if (e.code === 'Escape') {
    release();
    return;
  }
  if (uiFocused()) return;
  keys.add(e.code);
  if (captured && FLY_KEYS.has(e.code)) e.preventDefault();
});
addEventListener('keyup', e => keys.delete(e.code));

const gate = document.getElementById('gate');
function setFly(on) {
  captured = on;
  gate.hidden = on;
  if (!on) {
    dragging = false;
    lockHeld = false;
    if (document.pointerLockElement === renderer.domElement) {
      document.exitPointerLock();
    }
  }
}
function capture() {
  setFly(true);
  renderer.domElement.requestPointerLock();
}
function release() {
  setFly(false);
}
gate.querySelector('span').addEventListener('click', e => {
  e.stopPropagation();
  capture();
});
renderer.domElement.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  dragging = true;
  lastPointerX = e.clientX;
  lastPointerY = e.clientY;
  renderer.domElement.setPointerCapture(e.pointerId);
  capture();
});
renderer.domElement.addEventListener('pointerup', e => {
  dragging = false;
  if (renderer.domElement.hasPointerCapture(e.pointerId)) {
    renderer.domElement.releasePointerCapture(e.pointerId);
  }
});
renderer.domElement.addEventListener('pointercancel', () => { dragging = false; });
document.getElementById('side').addEventListener('pointerdown', () => release());
document.addEventListener('pointerlockchange', () => {
  if (document.pointerLockElement === renderer.domElement) {
    lockHeld = true;
    dragging = false;
    setFly(true);
    return;
  }
  if (lockHeld) {
    lockHeld = false;
    setFly(false);
  }
});
document.addEventListener('pointermove', e => {
  if (!captured) return;
  if (document.pointerLockElement === renderer.domElement) {
    lookDelta(e.movementX, e.movementY);
    return;
  }
  if (!dragging) return;
  lookDelta(e.clientX - lastPointerX, e.clientY - lastPointerY);
  lastPointerX = e.clientX;
  lastPointerY = e.clientY;
});
document.addEventListener('wheel', e => {
  if (!captured) return;
  e.preventDefault();
  const scale = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 80 : 1;
  camera.position.y -= e.deltaY * scale * 0.12 * (isSlow() ? FLY_SLOW : 1);
}, { passive: false });

function lookVector() {
  const cy = Math.cos(look.yaw), sy = Math.sin(look.yaw);
  const cp = Math.cos(look.pitch), sp = Math.sin(look.pitch);
  return { x: sy * cp, y: sp, z: cy * cp, cy, sy };
}

function applyLook() {
  const d = lookVector();
  camera.lookAt(
    camera.position.x + d.x,
    camera.position.y + d.y,
    camera.position.z + d.z,
  );
}

function fly(dt) {
  if (!captured) return;
  const step = flySpeed() * dt;
  const fwd = (keys.has('KeyW') ? 1 : 0) - (keys.has('KeyS') ? 1 : 0);
  const strafe = (keys.has('KeyD') ? 1 : 0) - (keys.has('KeyA') ? 1 : 0);
  const vert = (keys.has('KeyE') ? 1 : 0) - (keys.has('KeyQ') ? 1 : 0);
  const d = lookVector();
  camera.position.x += (d.x * fwd - d.cy * strafe) * step;
  camera.position.y += (d.y * fwd + vert) * step;
  camera.position.z += (d.z * fwd + d.sy * strafe) * step;
}

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

function dispose(root) {
  for (const tex of lmCache.values()) tex.dispose();
  lmCache.clear();
  if (!root) return;
  root.traverse(obj => {
    obj.geometry?.dispose();
    for (const m of [obj.material].flat().filter(Boolean)) {
      m.map?.dispose();
      m.dispose();
    }
  });
  scene.remove(root);
}

function lightmapTargets(obj) {
  // A multi-material part arrives from GLTFLoader as a Group whose direct
  // Mesh children are its primitives — the same Group-vs-Mesh trap as
  // setAnimatedTextureSpeed. Child *part* nodes carry their own userData
  // (templateKind, lightmap, kind), synthesized primitive meshes carry none.
  if (obj.isMesh) return [obj];
  return obj.children.filter(
    c => c.isMesh && Object.keys(c.userData || {}).length === 0);
}

function bindLightmaps(root, dir) {
  root.traverse(node => {
    const rel = node.userData?.lightmap;
    if (!rel) return;
    const url = `./maps/${dir}/${rel}${bust()}`;
    let tex = lmCache.get(url);
    if (!tex) {
      tex = texLoader.load(url);
      tex.channel = 1;
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
      lmCache.set(url, tex);
    }
    for (const obj of lightmapTargets(node)) {
      const source = Array.isArray(obj.material) ? obj.material : [obj.material];
      const bound = source.map(m => {
        const mat = m.clone();
        mat.lightMap = tex;
        mat.lightMapIntensity = 1;
        const prev = mat.onBeforeCompile;
        mat.onBeforeCompile = (shader, renderer) => {
          if (prev) prev(shader, renderer);
          shader.fragmentShader = shader.fragmentShader
            .replace(
              '#include <map_fragment>',
              `#include <map_fragment>
               #ifdef USE_LIGHTMAP
               diffuseColor.rgb *= texture2D( lightMap, vLightMapUv ).rgb;
               #endif`,
            )
            .replace('#include <lightmap_fragment>', '');
        };
        mat.needsUpdate = true;
        return mat;
      });
      obj.material = Array.isArray(obj.material) ? bound : bound[0];
    }
  });
}

function disposeSky() {
  if (skybox) {
    skybox.dispose();
    skybox = null;
  }
  if (skyRoot) {
    skyRoot.traverse(obj => {
      obj.geometry?.dispose();
      for (const m of [obj.material].flat().filter(Boolean)) {
        m.map?.dispose();
        m.dispose();
      }
    });
    scene.remove(skyRoot);
    skyRoot = null;
  }
  if (cloudMesh) {
    cloudMesh.geometry.dispose();
    cloudMesh.material.dispose();
    scene.remove(cloudMesh);
    cloudMesh = null;
    cloudUniforms = null;
  }
  for (const tex of waterAssets) tex.dispose();
  waterAssets = [];
  waterUniforms = null;
}

function srgb(rgb, fallback) {
  const [r, g, b] = rgb || fallback;
  // Level .con colours are display values from a pre-colour-managed engine.
  return new THREE.Color().setRGB(r, g, b, THREE.SRGBColorSpace);
}

// The engine draws the SkyBox mesh camera-centred with no fog and no lighting
// (`lighting false` in every Sky_*.rs). Reparent it out of the level root so
// distance culling never touches it, and swap its lit materials for unlit ones.
function setupSky(root, dir) {
  root.traverse(obj => {
    if (obj.userData?.kind === 'sky') skyRoot = obj;
  });
  if (!skyRoot) return;
  skyRoot.parent.remove(skyRoot);
  scene.add(skyRoot);
  skyRoot.traverse(obj => {
    if (!obj.isMesh) return;
    obj.frustumCulled = false;
    obj.renderOrder = -100;
    const mats = [obj.material].flat().map(m => new THREE.MeshBasicMaterial({
      map: m.map || null,
      color: m.map ? 0xffffff : 0x9db4c0,
      fog: false,
      depthWrite: false,
      side: THREE.DoubleSide,
    }));
    obj.material = Array.isArray(obj.material) ? mats : mats[0];
  });
  setupClouds(dir);
}

// `Sky.addCloud`: one alpha-blended layer scrolling at Cloud.setSpeed,
// repeated Cloud.setTexScale times across the sky span. Drawn camera-locked
// like the sky box, with a radial fade standing in for the engine's
// cloud-distance falloff.
function setupClouds(dir) {
  const clouds = extras.sky?.clouds;
  if (!clouds?.texture) return;
  const tex = texLoader.load(`./maps/${dir}/${clouds.texture}${bust()}`);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  waterAssets.push(tex);
  cloudUniforms = {
    map: { value: tex },
    uOffset: { value: new THREE.Vector2(0, 0) },
    uSpan: { value: 500 },
    uCam: { value: new THREE.Vector2(0, 0) },
    uFadeStart: { value: 400 },
    uFadeEnd: { value: 900 },
  };
  const material = new THREE.ShaderMaterial({
    uniforms: cloudUniforms,
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide,
    vertexShader: `
      varying vec3 vWorld;
      void main() {
        vec4 w = modelMatrix * vec4(position, 1.0);
        vWorld = w.xyz;
        gl_Position = projectionMatrix * viewMatrix * w;
      }`,
    fragmentShader: `
      uniform sampler2D map;
      uniform vec2 uOffset, uCam;
      uniform float uSpan, uFadeStart, uFadeEnd;
      varying vec3 vWorld;
      void main() {
        vec2 uv = vWorld.xz / uSpan + uOffset;
        vec4 c = texture2D(map, uv);
        float fade = 1.0 - smoothstep(uFadeStart, uFadeEnd, distance(vWorld.xz, uCam));
        gl_FragColor = vec4(c.rgb, c.a * fade);
        #include <colorspace_fragment>
      }`,
  });
  cloudMesh = new THREE.Mesh(
    new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2), material);
  cloudMesh.frustumCulled = false;
  cloudMesh.renderOrder = -99;
  scene.add(cloudMesh);
}

// Everything the engine's PatchTerrain/Water shader does with the level's
// `water.*` block: two scrolling colour layers combined modulate-2x, a
// scrolling normal map feeding a sun specular, and colour/alpha ramps driven
// by real water depth sampled from the exported heightmap-derived depth map.
function setupWater(root, dir) {
  const w = extras.water;
  if (!w) return;
  let waterObj = null;
  root.traverse(obj => {
    if (obj.userData?.kind === 'water' && obj.isMesh) waterObj = obj;
  });
  if (!waterObj) return;
  const load = rel => {
    const tex = texLoader.load(`./maps/${dir}/${rel}${bust()}`);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    waterAssets.push(tex);
    return tex;
  };
  const texs = w.textures || {};
  const layer1 = texs.layer1 ? load(texs.layer1) : null;
  const layer2 = texs.layer2 ? load(texs.layer2) : null;
  const normal = texs.normal ? load(texs.normal) : null;
  const depth = texs.depth ? load(texs.depth) : null;
  if (layer1) layer1.colorSpace = THREE.SRGBColorSpace;
  if (layer2) layer2.colorSpace = THREE.SRGBColorSpace;
  if (depth) depth.wrapS = depth.wrapT = THREE.ClampToEdgeWrapping;
  const ld = w.lightDirection || [-0.3, 0.5, 0.65];
  waterUniforms = {
    tLayer1: { value: layer1 },
    tLayer2: { value: layer2 },
    tNormal: { value: normal },
    tDepth: { value: depth },
    uTime: { value: 0 },
    uWorldSize: { value: w.worldSize || extras.worldSize || 2048 },
    uMaxDepth: { value: w.maxDepth || 0 },
    uDir1: { value: new THREE.Vector2(...(w.scrollDir1 || [1, 0])) },
    uDir2: { value: new THREE.Vector2(...(w.scrollDir2 || [0, 1])) },
    uDirN: { value: new THREE.Vector2(...(w.scrollDirNormal || [1, 1])) },
    uScroll1: { value: w.scroll1 || 0 },
    uScroll2: { value: w.scroll2 || 0 },
    uScrollN: { value: w.scrollNormal || 0 },
    uTile1: { value: w.tile1 || 0.5 },
    uTile2: { value: w.tile2 || 0.5 },
    uTileN: { value: w.tileNormal || 1 },
    uShallow: { value: srgb(w.shallowColor, [0.4, 0.5, 0.55]) },
    uDeep: { value: srgb(w.deepColor, [0.3, 0.38, 0.42]) },
    uSpec: { value: srgb(w.specular ? w.specularColor : [0, 0, 0], [0, 0, 0]) },
    uLightDir: { value: new THREE.Vector3(ld[0], ld[1], ld[2]).normalize() },
    uShininess: { value: Math.min(120, Math.max(20, 0.06 / Math.max(w.streakFactor || 0.001, 1e-4))) },
    uShallowAlpha: { value: w.shallowAlpha ?? 0.5 },
    uAlphaDepth: { value: w.alphaDepth || 1.5 },
    uColorDepth: { value: w.colorDepth || 10 },
    fogColor: { value: new THREE.Color(0x808080) },
    fogNear: { value: 400 },
    fogFar: { value: 900 },
  };
  const material = new THREE.ShaderMaterial({
    uniforms: waterUniforms,
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide,
    vertexShader: `
      varying vec3 vWorld;
      void main() {
        vec4 world = modelMatrix * vec4(position, 1.0);
        vWorld = world.xyz;
        gl_Position = projectionMatrix * viewMatrix * world;
      }`,
    fragmentShader: `
      uniform sampler2D tLayer1, tLayer2, tNormal, tDepth;
      uniform float uTime, uWorldSize, uMaxDepth;
      uniform vec2 uDir1, uDir2, uDirN;
      uniform float uScroll1, uScroll2, uScrollN, uTile1, uTile2, uTileN;
      uniform vec3 uShallow, uDeep, uSpec, uLightDir;
      uniform float uShininess, uShallowAlpha, uAlphaDepth, uColorDepth;
      uniform vec3 fogColor;
      uniform float fogNear, fogFar;
      varying vec3 vWorld;
      void main() {
        vec2 wuv = vec2(vWorld.x, -vWorld.z);
        vec3 tex = vec3(1.0);
        #ifdef HAS_LAYERS
        vec3 l1 = texture2D(tLayer1, wuv * uTile1 + uDir1 * uScroll1 * uTime).rgb;
        vec3 l2 = texture2D(tLayer2, wuv * uTile2 + uDir2 * uScroll2 * uTime).rgb;
        tex = l1 * l2 * 4.0;
        #endif
        float depth = uMaxDepth;
        #ifdef HAS_DEPTH
        depth = texture2D(tDepth, wuv / uWorldSize).r * uMaxDepth;
        #endif
        vec3 base = mix(uShallow, uDeep, clamp(depth / max(uColorDepth, 0.001), 0.0, 1.0));
        vec3 col = base * tex;
        vec3 N = vec3(0.0, 1.0, 0.0);
        #ifdef HAS_NORMAL
        vec3 nm = texture2D(tNormal, wuv * uTileN + uDirN * uScrollN * uTime).rgb * 2.0 - 1.0;
        N = normalize(vec3(nm.x * 0.4, 1.0, nm.y * 0.4));
        #endif
        vec3 V = normalize(cameraPosition - vWorld);
        vec3 H = normalize(normalize(uLightDir) + V);
        col += uSpec * pow(max(dot(N, H), 0.0), uShininess);
        float alpha = mix(uShallowAlpha, 0.96, clamp(depth / max(uAlphaDepth, 0.001), 0.0, 1.0));
        float fogF = smoothstep(fogNear, fogFar, length(cameraPosition - vWorld));
        col = mix(col, fogColor, fogF);
        gl_FragColor = vec4(col, alpha);
        #include <colorspace_fragment>
      }`,
    defines: {
      ...(layer1 && layer2 ? { HAS_LAYERS: '' } : {}),
      ...(normal ? { HAS_NORMAL: '' } : {}),
      ...(depth ? { HAS_DEPTH: '' } : {}),
    },
  });
  waterObj.material.dispose();
  waterObj.material = material;
}

function syncWaterFog() {
  if (!waterUniforms || !scene.fog) return;
  waterUniforms.fogColor.value.copy(scene.fog.color);
  waterUniforms.fogNear.value = scene.fog.near;
  waterUniforms.fogFar.value = scene.fog.far;
}

// The sky box is 4000 m across but our far plane is much closer, so it is
// drawn scaled down around the camera — with depth writes off and everything
// overdrawing it, only its angular content matters, and that is scale-free.
function updateSky() {
  if (skyRoot) {
    const half = skyRoot.userData.halfExtent || 2000;
    const s = camera.far * 0.95 / (half * 1.7320508);
    skyRoot.scale.setScalar(s);
    skyRoot.position.set(
      camera.position.x,
      camera.position.y + (extras.sky?.heightOffset || 0) * s,
      camera.position.z,
    );
    if (cloudMesh && cloudUniforms) {
      const clouds = extras.sky?.clouds || {};
      const rise = ((clouds.height ?? 3500) - (clouds.ofsHeight ?? 0)) * s;
      const span = 4 * half * s / (clouds.texScale || 8);
      cloudMesh.scale.set(camera.far * 4, 1, camera.far * 4);
      cloudMesh.position.set(
        camera.position.x, camera.position.y + rise, camera.position.z);
      cloudUniforms.uSpan.value = span;
      cloudUniforms.uCam.value.set(camera.position.x, camera.position.z);
      cloudUniforms.uFadeStart.value = camera.far * 1.2;
      cloudUniforms.uFadeEnd.value = camera.far * 2.4;
    }
  }
}

function advanceSim(dt) {
  simTime += dt;
  if (waterUniforms) waterUniforms.uTime.value = simTime;
  if (cloudUniforms) {
    const speed = extras.sky?.clouds?.speed || [0, 0];
    cloudUniforms.uOffset.value.set(simTime * speed[0], simTime * speed[1]);
  }
}

function applyLighting() {
  const light = extras.lighting;
  if (!light) {
    hemi.color.set(0xe8dcc0);
    hemi.groundColor.set(0x5a4a32);
    hemi.intensity = 1.35;
    sun.color.set(0xfff1d0);
    sun.intensity = 2.4;
    return;
  }
  // renderer.diffuseColor is the sun's tint; keep overall exposure by
  // normalising it and carrying the magnitude into intensity.
  const diffuse = light.diffuse || [0.5, 0.5, 0.5];
  const peak = Math.max(...diffuse, 0.01);
  sun.color.setRGB(diffuse[0] / peak, diffuse[1] / peak, diffuse[2] / peak,
                   THREE.SRGBColorSpace);
  sun.intensity = 2.4 * Math.min(1.4, peak / 0.5);
  const fog = extras.fogColor || [0.7, 0.7, 0.7];
  hemi.color.setRGB(fog[0], fog[1], fog[2], THREE.SRGBColorSpace);
  const ground = light.ambient || [0.2, 0.2, 0.2];
  hemi.groundColor.setRGB(
    Math.min(1, ground[0] * 2.5), Math.min(1, ground[1] * 2.5),
    Math.min(1, ground[2] * 2.5), THREE.SRGBColorSpace);
  hemi.intensity = 1.15;
}

function drawDistance() {
  return extras.drawDistance || DEFAULT_DRAW;
}

function applyFar() {
  const world = extras.worldSize || 2048;
  const draw = drawDistance();
  camera.far = optEntire.checked
    ? Math.max(4000, world * 1.5)
    : Math.max(draw * 1.6, 900);
  camera.updateProjectionMatrix();
}

function applyFog() {
  const color = extras.fogColor || [0.8, 0.72, 0.53];
  const draw = drawDistance();
  let start, end;
  if (optGameFog.checked) {
    start = extras.fogStart || 150;
    end = extras.fogEnd || 300;
  } else if (!optEntire.checked) {
    start = draw * 0.55;
    end = draw;
  } else {
    start = 250;
    end = Math.max(1400, extras.worldSize || 2000);
  }
  // Declared fog colours are display values from a pre-colour-managed engine.
  const fogColor = new THREE.Color().setRGB(
    color[0], color[1], color[2], THREE.SRGBColorSpace);
  scene.fog = new THREE.Fog(fogColor, start, end);
  scene.background = skybox || fogColor;
  syncWaterFog();
}

function isCollision(obj) {
  return Boolean(obj.userData?.collision) || /collision/i.test(obj.name || '');
}

function kindOf(obj) {
  return obj.userData?.kind || '';
}

function tagCull(obj) {
  const box = new THREE.Box3().setFromObject(obj);
  const sphere = new THREE.Sphere();
  box.getBoundingSphere(sphere);
  obj.userData.cullCenter = sphere.center.clone();
  obj.userData.cullRadius = sphere.radius;
}

function indexScene(root) {
  cull.length = 0;
  spawnersRoot = null;
  root.traverse(obj => {
    if (isCollision(obj)) obj.visible = false;
  });
  root.updateMatrixWorld(true);
  root.traverse(obj => {
    if (obj === root) return;
    if (kindOf(obj) === 'spawners' || obj.name === 'spawners') {
      spawnersRoot = obj;
    }
  });
  for (const child of root.children) {
    if (child === spawnersRoot) {
      for (const vehicle of child.children) tagCull(vehicle);
      continue;
    }
    if (kindOf(child) === 'water') continue;
    tagCull(child);
    cull.push(child);
  }
}

function inRange(obj, cam, limit) {
  const c = obj.userData.cullCenter;
  const r = obj.userData.cullRadius || 0;
  if (!c) return true;
  const dx = c.x - cam.x, dy = c.y - cam.y, dz = c.z - cam.z;
  const reach = limit + r;
  return dx * dx + dy * dy + dz * dz <= reach * reach;
}

function applyVisibility() {
  const entire = optEntire.checked;
  const cam = camera.position;
  const limit = drawDistance();
  for (const obj of cull) obj.visible = entire || inRange(obj, cam, limit);
  if (!spawnersRoot) return;
  spawnersRoot.visible = optVehicles.checked;
  if (!optVehicles.checked) return;
  for (const vehicle of spawnersRoot.children) {
    vehicle.visible = entire || inRange(vehicle, cam, limit);
  }
}

function placeCamera() {
  // ?cam=x,y,z,yaw,pitch pins the camera for reproducible screenshots.
  const pinned = (params.get('cam') || '').split(',').map(Number);
  if (pinned.length === 5 && pinned.every(Number.isFinite)) {
    camera.position.set(pinned[0], pinned[1], pinned[2]);
    look.yaw = pinned[3];
    look.pitch = pinned[4];
    applyLook();
    return;
  }
  const cam = extras.camera;
  if (cam) {
    camera.position.set(cam[0], cam[1] + 55, cam[2]);
  } else {
    camera.position.set(0, 80, 0);
  }
  look.yaw = Math.PI;
  look.pitch = -0.22;
  applyLook();
}

function wireframe(on) {
  if (!currentRoot) return;
  currentRoot.traverse(obj => {
    if (!obj.isMesh || isCollision(obj)) return;
    for (const m of [obj.material].flat()) m.wireframe = on;
  });
}

async function loadSky(entry) {
  disposeSky();
  const faces = extras.skybox;
  if (!faces || faces.length !== 6) return;
  const dir = entry.glb.replace(/\/[^/]+$/, '');
  const tex = await cubeLoader.loadAsync(
    faces.map(f => `./maps/${dir}/${f}${bust()}`),
  );
  tex.colorSpace = THREE.SRGBColorSpace;
  skybox = tex;
}

async function show(entry) {
  const report = await fetch(`./maps/${entry.report}${bust()}`).then(r => r.json());
  extras = report;
  const gltf = await loader.loadAsync(`./maps/${entry.glb}${bust()}`);
  dispose(currentRoot);
  disposeSky();
  currentRoot = gltf.scene;
  scene.add(currentRoot);
  const dir = entry.glb.replace(/\/[^/]+$/, '');
  bindLightmaps(currentRoot, dir);
  setupSky(currentRoot, dir);
  setupWater(currentRoot, dir);
  applyLighting();
  if (extras.sunDirection) {
    // The sun light points along -sunLightDirectionVec toward the origin.
    sun.position.set(
      extras.sunDirection[0] * -400,
      extras.sunDirection[1] * 400,
      extras.sunDirection[2] * -400,
    );
  }
  indexScene(currentRoot);
  applyFar();
  if (!skyRoot) await loadSky(entry);
  applyFog();
  placeCamera();
  wireframe(optWire.checked);
  applyVisibility();
  const t = extras.terrain || {};
  const o = extras.objects || {};
  document.getElementById('stats').innerHTML =
    `<strong>${extras.level || entry.name}</strong><br>` +
    `world ${extras.worldSize || '?'} m<br>` +
    `terrain ${t.triangles || 0} tris / ${t.tiles || 0} tiles` +
    (t.defaultTiles ? ` + ${t.defaultTiles} default` : '') +
    (t.detail ? ' + detail' : '') + `<br>` +
    `objects ${o.placed || 0} placed` +
    (o.spawners ? ` / ${o.spawners} vehicles` : '') +
    (o.lightmaps ? ` / ${o.lightmaps} lightmaps` : '') +
    (o.skipped?.length ? ` / ${o.skipped.length} skipped` : '') + `<br>` +
    `sky ${extras.sky ? extras.sky.mesh + (extras.sky.clouds ? ' + clouds' : '') :
          (extras.skybox ? 'env cubemap' : 'fog colour')} / ` +
    `water ${extras.water ? 'shader' : 'flat'}`;
}

optGameFog.addEventListener('change', applyFog);
optWire.addEventListener('change', e => wireframe(e.target.checked));
optVehicles.addEventListener('change', applyVisibility);
optEntire.addEventListener('change', () => {
  applyFar();
  applyFog();
  applyVisibility();
});

const manifest = await fetch(`./maps/maps.json${bust()}`)
  .then(r => r.ok ? r.json() : [])
  .catch(() => []);
const select = document.getElementById('maps');
if (!manifest.length) {
  select.hidden = true;
  document.getElementById('stats').textContent =
    'No maps yet. From tools/bf1942-models run: python3 extract_map.py Tobruk';
} else {
  for (const entry of manifest) {
    select.appendChild(new Option(entry.name, entry.name));
  }
  select.addEventListener('change', () => {
    const entry = manifest.find(e => e.name === select.value);
    if (entry) show(entry);
  });
  const wanted = (params.get('map') || '').toLowerCase();
  const first = manifest.find(e => e.name.toLowerCase() === wanted) || manifest[0];
  select.value = first.name;
  await show(first);
}

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1);
  fly(dt);
  applyLook();
  applyVisibility();
  advanceSim(dt);
  updateSky();
  renderer.render(scene, camera);
});
</script>
</body>
</html>

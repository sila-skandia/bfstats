<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>BF1942 mesh &middot; maps</title>
<link rel="icon" href="./favicon.ico">
<link rel="stylesheet" href="./tokens.css">
<link rel="stylesheet" href="./shell.css">
<style>
  :root {
    /* Neutral Depth, from tokens.css. The panel stays translucent: it floats
       over the flythrough. */
    --bg: var(--mm-bg);
    --panel: rgba(19, 19, 19, .82);
    --line: var(--mm-rule);
    --text: var(--mm-ink-soft);
    --muted: var(--mm-ink-muted);
    --accent: var(--mm-accent-soft);
    --warn: var(--mm-load-busy);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    grid-template-rows: var(--nav-h) 1fr;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 var(--mm-font-mono);
    overflow: hidden;
  }
  /* The flythrough owns everything below the bar. Positioning it makes the
     canvas and the three overlays resolve against the stage rather than the
     viewport, so nothing has to know the bar's height. */
  #stage {
    position: relative;
    min-height: 0;
    overflow: hidden;
  }
  canvas {
    display: block;
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    touch-action: none;
  }
  #hud, #side {
    position: absolute;
    pointer-events: none;
  }
  #side {
    pointer-events: auto;
    z-index: 3;
    top: 16px; left: 16px;
    width: 260px;
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 14px;
    backdrop-filter: blur(8px);
  }
  h1 {
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 10px;
  }
  select {
    width: 100%;
    margin: 0 0 12px;
    padding: 6px 8px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--line);
    font: inherit;
  }
  .stat { color: var(--muted); font-size: 12px; }
  .stat strong { color: var(--text); font-weight: 500; }
  label.opt {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-top: 8px;
    color: var(--muted);
    cursor: pointer;
  }
  #hud {
    z-index: 2;
    left: 50%; bottom: 18px;
    transform: translateX(-50%);
    color: var(--muted);
    text-align: center;
    text-shadow: 0 1px 4px #000;
  }
  /* On-foot fire control. The crosshair is DOM over the canvas rather than
     painted into it: four bars around a zero-size anchor at screen centre,
     the bar gap driven per frame through --ch-gap by the deviation cone
     mapped through the camera projection (updateCrosshair()). The weapon's
     own crossHairType decides the shape: CHTCrossHair is the full cross,
     CHTIcon is the game's own `hk.tga` at the size and place menu/InGame
     draws it, CHTNone and a scoped aim draw nothing. The dot survives only
     as the fallback for a pack that has no `hk` in it.

     The look is measured off retail footage, not styled: no crosshair
     texture exists in any archive (the engine draws it), so a 960-wide
     capture of the Thompson on Wake is the reference — bars 2px thick and
     13px long at that width, colour rgb(176,32,16), no centre dot, and the
     arms MEET at centre when the shooter stands still. Sizes are locked in
     px of the reference capture; a hidpi pass can scale them later. */
  #crosshair {
    position: absolute;
    z-index: 2;
    left: 50%; top: 50%;
    width: 0; height: 0;
    pointer-events: none;
    --ch-gap: 0px;
    --ch-ink: rgb(176, 32, 16);
  }
  #crosshair[hidden] { display: none; }
  #crosshair span {
    position: absolute;
    background: var(--ch-ink);
  }
  #crosshair .ch-dot { display: none; width: 2px; height: 2px; left: -1px; top: -1px; }
  #crosshair.ch-icon .ch-dot { display: block; }
  #crosshair.ch-art .ch-dot { display: none; }
  /* The CHTIcon picture. Sized per frame from the layout's own rect through
     --ch-icon-w/h, because the HUD stretches its 800x600 virtual screen
     independently on each axis (hud.js `_scaleFor`, VHUD-11) and this has to
     land where the canvas would have put it. `background`, not `<img>`, so
     the shared `#crosshair span` rule's ink does not paint behind it. */
  #crosshair .ch-pic {
    display: none;
    background: center / 100% 100% no-repeat;
    image-rendering: pixelated;
    width: var(--ch-icon-w, 20px); height: var(--ch-icon-h, 20px);
    left: calc(var(--ch-icon-w, 20px) / -2);
    top: calc(var(--ch-icon-h, 20px) / -2);
  }
  #crosshair.ch-icon.ch-art .ch-pic { display: block; }
  #crosshair .ch-n { width: 2px; height: 13px; left: -1px; bottom: var(--ch-gap); }
  #crosshair .ch-s { width: 2px; height: 13px; left: -1px; top: var(--ch-gap); }
  #crosshair .ch-w { height: 2px; width: 13px; top: -1px; right: var(--ch-gap); }
  #crosshair .ch-e { height: 2px; width: 13px; top: -1px; left: var(--ch-gap); }
  #crosshair.ch-icon .ch-n, #crosshair.ch-icon .ch-s,
  #crosshair.ch-icon .ch-w, #crosshair.ch-icon .ch-e { display: none; }
  /* The in-game HUD proper -- health bar, stance figure, magazine picture,
     vehicle panels -- painted by hud.js from the game's own hud-layout.json
     rects and sprites, not styled here. Sits above the 3D canvas (z-index 0)
     and below the DOM crosshair/hint line (both z-index 2, untouched this
     round); the generic `canvas` rule above already gives it position/inset/
     size, so only the stacking and click-through need overriding. */
  #hud-canvas {
    z-index: 2;
    pointer-events: none;
  }
  /* The in-game console (viewer/console.js). The engine draws its wash and
     its text over everything the 3D view has already put up -- the drawer
     `FUN_00464ee0` runs from the frame's overlay pass, after the HUD -- so
     this sits above every other layer the page owns, the Escape menu
     included: in the game the console comes down over the front end too. It
     is never interactive: the console is a keyboard surface, exactly as it
     is in the game. */
  #console-canvas {
    z-index: 13;
    pointer-events: none;
  }
  #console-canvas[hidden] { display: none !important; }

  /* The Escape menu (viewer/play/skirmish.js): the front end, back up over
     the battle. Opaque, and over everything the level draws -- the spawn
     screen at 11 included, though Escape takes that down before it gets
     here. The arrow cursor is the pointer's own, as it is on the way-in
     screen. */
  #menu-canvas {
    z-index: 12;
    touch-action: manipulation;
  }
  #menu-canvas[hidden] { display: none !important; }
  #menu-canvas:focus-visible { outline: none; }

  /* The debug gate. Everything in `#side` -- the level picker, fog,
     wireframe, vehicles, render-entire-map, pilot, spawn-on-foot and sound --
     is developer gear, and so is the fab that brings it back. A regular
     player gets neither until `show.dev 1`. The elements stay in the DOM so
     that the headless hooks (`__setOnFoot`, `__deploy`, the `?shots` flow)
     and every `optOnFoot.checked` read in this file keep working untouched;
     only their pixels go away. */
  body:not(.dev-on) #side,
  body:not(.dev-on) .map-controls-fab {
    display: none !important;
  }
  #flare-canvas {
    z-index: 1;
    pointer-events: none;
  }
  /* A lost WebGL context leaves the canvas exactly as it last drew -- there
     is no repaint to hint anything went wrong, so this has to be loud enough
     to read over a frozen frame rather than blend into the picture. */
  #gl-lost {
    position: absolute;
    z-index: 8;
    inset: 0;
    display: grid;
    place-items: center;
    background: rgba(10, 8, 6, .72);
  }
  #gl-lost[hidden] { display: none; }
  #gl-lost .gl-lost-card {
    pointer-events: auto;
    max-width: min(420px, calc(100% - 32px));
    border: 1px solid var(--warn);
    padding: 14px 18px;
    background: var(--panel);
    text-align: center;
  }
  #gl-lost .gl-lost-title {
    letter-spacing: .08em;
    text-transform: uppercase;
    font-size: 11px;
    color: var(--warn);
    margin-bottom: 8px;
  }
  #gl-lost .gl-lost-body { color: var(--text); font-size: 12px; line-height: 1.5; }
  #gl-lost button {
    margin-top: 12px;
    cursor: pointer;
    border: 1px solid var(--accent);
    padding: 8px 14px;
    letter-spacing: .08em;
    text-transform: uppercase;
    font-size: 11px;
    background: transparent;
    color: var(--text);
  }
  /* The map art, top right. That corner is free: #side is top left, #hud is
     bottom centre. Sized in one place so the canvas backing store and the
     frame agree. No CSS chrome: the game's own `icon_mapbar_small` bezel is
     drawn into the canvas, over the art, the way the engine composes it. */
  #minimap {
    --mm-size: 188px;
    /* Not covered by the `#hud, #side` positioning rule above. */
    position: absolute;
    z-index: 3;
    top: 16px; right: 16px;
    width: var(--mm-size);
  }
  #minimap[hidden] { display: none; }
  #minimap canvas {
    position: static;
    display: block;
    width: 100%;
    /* Square, so the art is not stretched. */
    aspect-ratio: 1;
    /* The art is a top-down render with hard grid lines; smoothing it while
       zoomed in just makes it muddy. */
    image-rendering: pixelated;
  }
  /* The fullscreen map. Covers the stage, not the viewport — the shared nav
     bar stays reachable. */
  #fullmap {
    position: absolute;
    z-index: 5;
    inset: 0;
    display: grid;
    place-items: center;
    background: rgba(8, 8, 8, .86);
    backdrop-filter: blur(3px);
    pointer-events: auto;
  }
  #fullmap[hidden] { display: none; }
  #fullmap .fm-frame { position: relative; }
  #fullmap .fm-map-frame {
    border: 1px solid var(--line);
    background: var(--panel);
    box-shadow: 0 18px 60px rgba(0, 0, 0, .6);
  }
  #fullmap canvas {
    position: static;
    display: block;
    /* Square art, and the stage is the limit in both axes. */
    width: min(78vh, 78vw);
    height: min(78vh, 78vw);
  }
  #fullmap .fm-cap {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
    padding: 8px 12px;
    border-top: 1px solid var(--line);
    font-size: 11px;
    letter-spacing: .08em;
    color: var(--muted);
  }
  #fullmap .fm-cap b {
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: .14em;
    font-weight: 500;
  }
  /* The deploy state: the game's own spawn screen, drawn from `menu/InGame`.
     The engine lays the interface out in an 800x600 virtual space and
     stretches it to the screen — a 1280x720 capture shows the kit rows on a
     100 px pitch where the data says 83, which is 720/600 exactly.
     `maps/_shared/hud/spawn-layout.json` is that node graph flattened
     (extract_spawn_layout.py), and #deploy-chrome paints it: panel plates,
     colour-fill quads, class glyphs, button plates and bitmap-font text, in
     the game's paint order and under the game's own show/hide conditions.
     The level map sits in the rectangle the engine reserves for it, and the
     invisible .fm-hit buttons sit where the game's pointer regions are, so
     the harness selectors (.fm-tab, #deploy-resume) keep working. Below a
     4:3 aspect the stage scales uniformly and letterboxes instead. */
  #fullmap .fm-chrome, #fullmap .fm-hit { display: none; }
  #fullmap.deploy {
    place-items: stretch;
    /* No backdrop: the capture shows the live world around and through the
       screen — the dim is the map pane's own (drawArt's `dim` fill), not an
       overlay. The engine keeps rendering behind the spawn screen. */
    background: transparent;
    backdrop-filter: none;
    /* Over the flight-speed buttons too: the screen owns the whole stage. */
    z-index: 11;
  }
  #fullmap.deploy .fm-frame {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
  #fullmap.deploy .fm-map-frame {
    position: absolute;
    border: 0;
    background: none;
    box-shadow: none;
    /* The open/close transition turns the art inside the pane (MMAP-2) with
       enough over-scale to keep the quad covered; the engine clips its map
       quad the same way, so nothing spills past the pane's edge. */
    overflow: hidden;
  }
  #fullmap.deploy .fm-cap { display: none; }
  /* In deploy the map is the target surface, and the cursor should say so. */
  #fullmap.deploy canvas#fullmap-canvas {
    width: 100%;
    height: 100%;
    cursor: crosshair;
  }
  /* The chrome is plain CullNode visibility (MEME-4) — the capture has it
     appear fully formed about 0.13 s after the pane starts moving, which is
     the eased zoom crossing ~0.7. `.deploy-ready` is that threshold. */
  #fullmap.deploy.deploy-ready .fm-chrome {
    display: block;
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  #fullmap.deploy.deploy-ready .fm-hit {
    display: block;
    position: absolute;
    margin: 0;
    padding: 0;
    border: 0;
    background: none;
    opacity: 0;
    cursor: pointer;
  }
  #fullmap.deploy .fm-hit:disabled { cursor: default; }
  a { color: var(--accent); }

  .side-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
  }
  .side-header h1 { margin: 0; }
  .controls-collapse-btn {
    display: none;
    align-items: center;
    gap: 4px;
    padding: 3px 8px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 2px;
    color: var(--muted);
    font: 10px var(--mm-font-mono);
    letter-spacing: .08em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .controls-collapse-btn:hover { color: var(--text); border-color: var(--accent); }

  .map-controls-fab {
    position: absolute;
    bottom: 18px;
    right: 18px;
    z-index: 10;
    display: none;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: var(--text);
    font: 11px var(--mm-font-mono);
    letter-spacing: .06em;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
  }
  .map-controls-fab:hover { border-color: var(--accent); }
  .map-controls-fab[hidden] { display: none !important; }

  /* The sidebar is debug gear — fog, wireframe, the pilot and on-foot hacks —
     so it starts pulled away on every screen size and the fab brings it back.
     The touch block below only re-homes it. */
  #side.side-collapsed { display: none; }
  .controls-collapse-btn { display: inline-flex; }
  .map-controls-fab { display: inline-flex; }

  .speed-control,
  .map-actions {
    position: absolute;
    bottom: 18px;
    left: 18px;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 8px;
    pointer-events: auto;
  }
  .speed-toggle-btn,
  .map-action-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 6px 12px;
    height: 32px;
    box-sizing: border-box;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: var(--text);
    font: 11px var(--mm-font-mono);
    letter-spacing: .06em;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    transition: background-color .15s ease, border-color .15s ease, color .15s ease;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  .speed-toggle-btn:hover,
  .map-action-btn:hover { border-color: var(--accent); }
  .speed-toggle-btn:active,
  .map-action-btn:active { background: rgba(255, 255, 255, 0.14); }
  .map-action-btn svg { flex-shrink: 0; }
  .action-badge,
  .speed-badge {
    display: inline-block;
    padding: 2px 6px;
    border-radius: 3px;
    font-weight: 600;
    font-size: 10px;
    letter-spacing: .08em;
  }
  [data-speed="fast"] .action-badge,
  [data-speed="fast"] .speed-badge {
    background: var(--accent);
    color: var(--mm-highlight-ink);
  }
  [data-speed="slow"] .action-badge,
  [data-speed="slow"] .speed-badge {
    background: var(--muted);
    color: var(--mm-highlight-ink);
  }
  [data-mode="fly"] .action-badge {
    background: var(--accent);
    color: var(--mm-highlight-ink);
  }
  [data-mode="pan"] .action-badge {
    background: #5dade2;
    color: #0b1520;
  }
  .action-hint,
  .speed-hint {
    color: var(--muted);
    font-size: 10px;
  }

  #mobile-controls {
    position: absolute;
    left: 12px; right: 12px; bottom: 72px;
    z-index: 9;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 10px;
    pointer-events: none;
  }
  #mobile-controls[hidden] { display: none; }
  #mobile-pad {
    position: relative;
    flex: 0 0 128px;
    width: 128px; height: 128px;
    border: 1px solid var(--line);
    border-radius: 50%;
    background: rgba(18, 17, 14, 0.72);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 6px 22px rgba(0, 0, 0, 0.42), inset 0 0 0 1px rgba(255, 255, 255, 0.04);
    pointer-events: auto;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #mobile-pad::before,
  #mobile-pad::after {
    content: '';
    position: absolute;
    background: rgba(190, 190, 175, 0.18);
  }
  #mobile-pad::before { left: 50%; top: 14px; bottom: 14px; width: 1px; }
  #mobile-pad::after { top: 50%; left: 14px; right: 14px; height: 1px; }
  #mobile-pad.is-active { border-color: var(--accent); }
  #mobile-pad-puck {
    position: absolute;
    left: 50%; top: 50%;
    width: 52px; height: 52px;
    border: 1px solid var(--accent);
    border-radius: 50%;
    background: rgba(42, 42, 35, 0.94);
    color: var(--text);
    display: grid;
    place-items: center;
    font-size: 9px;
    letter-spacing: .1em;
    text-transform: uppercase;
    box-shadow: 0 3px 12px rgba(0, 0, 0, 0.45);
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  #mobile-pad-puck.is-firing { border-color: var(--warn); color: var(--warn); }
  .mobile-action-cluster {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 7px;
    pointer-events: none;
  }
  .mobile-action-row {
    display: flex;
    align-items: center;
    gap: 7px;
    pointer-events: none;
  }
  .mobile-action-btn {
    min-width: 64px;
    height: 40px;
    padding: 0 12px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: rgba(18, 17, 14, 0.82);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: var(--text);
    font: 10px var(--mm-font-mono);
    letter-spacing: .08em;
    text-transform: uppercase;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
    pointer-events: auto;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    cursor: pointer;
  }
  .mobile-action-btn:hover { border-color: var(--accent); }
  .mobile-action-btn:active,
  .mobile-action-btn.is-active {
    border-color: var(--accent);
    background: rgba(72, 72, 58, 0.92);
  }
  .mobile-action-btn:disabled {
    opacity: 0.38;
    cursor: default;
    border-color: var(--line);
    background: rgba(18, 17, 14, 0.62);
  }
  .mobile-action-btn.fire-btn {
    min-width: 76px;
    height: 52px;
    border-color: var(--warn);
    color: var(--warn);
  }
  .mobile-action-btn.fire-btn.is-active {
    background: rgba(105, 35, 25, 0.92);
    color: #f4d7cf;
  }
  .mobile-action-btn[hidden],
  .mobile-throttle[hidden],
  #mobile-pad[hidden] { display: none; }
  .mobile-throttle {
    display: flex;
    align-items: center;
    gap: 6px;
    min-height: 40px;
    padding: 0 9px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: rgba(18, 17, 14, 0.82);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: var(--muted);
    font: 9px var(--mm-font-mono);
    letter-spacing: .08em;
    pointer-events: auto;
    touch-action: none;
  }
  .mobile-throttle input {
    width: 92px;
    accent-color: var(--accent);
  }
  .mobile-throttle output {
    min-width: 25px;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    text-align: right;
  }

  @media (max-width: 720px) {
    #minimap {
      --mm-size: 110px;
      top: 10px;
      right: 10px;
    }
    #mobile-controls {
      bottom: 78px;
      gap: 8px;
    }
    #mobile-pad {
      flex-basis: 112px;
      width: 112px;
      height: 112px;
    }
    .mobile-action-btn {
      min-width: 56px;
      height: 38px;
      padding: 0 8px;
      font-size: 9px;
    }
    .mobile-action-btn.fire-btn {
      min-width: 64px;
      height: 48px;
    }
    .mobile-throttle input {
      width: 76px;
    }

    #side {
      top: auto;
      bottom: 16px;
      left: 12px;
      right: 12px;
      width: auto;
      max-height: 48vh;
      overflow-y: auto;
      border-radius: 4px;
    }
    #side.side-collapsed {
      display: none;
    }
    .controls-collapse-btn { display: inline-flex; }
    .map-controls-fab { display: inline-flex; }
    #hud {
      bottom: 64px;
      font-size: 11px;
      width: auto;
      max-width: calc(100% - 24px);
      padding: 4px 10px;
      background: rgba(18, 17, 14, 0.82);
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
      pointer-events: none;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './vendor/loaders/GLTFLoader.js';
import { createLoadOverlay } from './progress.js';
import { selectMod } from './mods.js';
import { Aircraft, VehicleCamera, findVehicle, findVehicles } from './flight.js';
import { GroundVehicle } from './ground.js';
import * as GroundModule from './ground.js';
import {
  VehicleOccupancy, findAllVehicleRoots, listEntryPoints, classifyRoot,
  FireState, chainOnShot, readWorldPose, pickNearest,
} from './seats.js';
import { MouseInput, profileFor, soldierLookDegrees } from './mouse-input.js';
import { loadEngineAudio, findEngineSpec, findWeaponSpecs,
         findWeaponSpecsByFireArms, WEAPON_HEADROOM } from './engine-audio.js';
import { GunFire } from './gunfire.js';
import { EffectLibrary, EffectPlayer } from './effects.js';
import { EffectAudio } from './effect-audio.js';
import { buildHeightfield, buildCollisionIndex, buildDrivableMask, WorldCollider } from './collision.js';
import { FOV_DEG as FOOT_FOV, GRAVITY } from './soldier.js';
import { DeviationModel } from './deviation.js';
import { wantViewmodelClip } from './viewmodel-anim.js';
import { createReplayController, recordingLevel } from './replay.js';
import { createRoomClient } from './netcode-client.js';
import { createRemoteRenderer } from './netcode-render.js';
import { Hud, AMMO_TYPE_CODES, AMMO_TYPES_WITH_ROUNDS } from './hud.js';
import { Armor } from './armor.js';
import { VehicleDamageSet } from './vehicle-damage.js';
import { BodyWorld } from './body-world.js';
import { buildParkedVehicle, describeVehicleParts } from './vehicle-bodies.js';
import { SupplyDepot } from './supply.js';
import { collectIkBindings, defaultSeatPoseName, ikTarget, resolveSeatStates,
         seatBody, seatPoseName, solveTwoBone } from './seat-ik.js';
import { GameConsole, paintConsole, loadConsoleFont } from './console.js';
import { bonePattern, kitsByTemplate, wornGrafts } from './kit-graft.js';
import { wantsEnvmap, cubeFaceUrls, envmapVertexPatch, envmapVertexBody,
         envmapFragmentPatch, envmapFragmentApply } from './envmap.js';
import { CombatArea, combatAreaRect } from './combat-area.js';
// HP-10's sampling, and the one metre `setCharacterHeight -1.00` puts between
// a soldier's feet and his object origin — the point the engine measures a
// blast to and adds its sample offsets from.
import { soldierExposure, worldBlocker } from './soldier-exposure.js';
import { CHARACTER_HEIGHT } from './physics.js';
import { World } from './world.js';
import { flareSprites, flareTextureFiles, hasDrawableFlare } from './lens-flare.js';
import { modeNames, modeProblem, pruneToMode, selectGameMode,
         spawnerWindow } from './game-modes.js';
import { loadHudPaths } from './hud-pack.js';
import { createSkirmishScreen } from './play/skirmish.js';
import { kitIconCandidates, kitRowLabel } from './kit-icon.js';
import { cpNation as cpNationRule, teamNation as teamNationRule } from './nation.js';

// Which game's levels this page serves, and the directory they hang off:
// 'maps' for vanilla, 'maps/mods/eod' for a mod. Resolved before anything is
// fetched, and it draws the nav's mod picker as a side effect.
const activeMod = await selectMod('maps');
const MAPS_BASE = activeMod.paths.maps;
// And the models tree beside it, for the weapon a spawned soldier holds —
// the same base `flight.js` resolves for a cockpit glb, taken from the mod
// record here because this page has already resolved one.
const MODELS_BASE = activeMod.paths.models || 'models';

const DEFAULT_DRAW = 700;
const FLY_SPEED = 140;
const FLY_SLOW = 0.02;
// The FREE-FLY camera's look, radians per pixel, and nothing else any more.
// It used to be the soldier's too, on no basis; the soldier now runs the
// engine's own law (`mouse-input.js`, `BFSoldier::handlePlayerInput` lnxded
// 0x08273c70) and this number stays only because the free camera is a debug
// surface the engine has no equivalent for. Worth recording why it survived
// so long: at the shipped sensitivity the engine's yaw works out at 0.1215
// degrees per count and 0.0022 rad is 0.12605 degrees per pixel -- 3.7% apart,
// which is the closest thing anyone has to evidence that one browser pixel is
// about one mouse count.
const LOOK_SENS = 0.0022;
const FLY_KEYS = new Set([
  'KeyW', 'KeyA', 'KeyS', 'KeyD', 'KeyQ', 'KeyE',
  'ShiftLeft', 'ShiftRight',
]);
// On foot the keys are the game's own, from Settings/Default/Controls/Infantry.con:
// W/S c_PIThrottle, A/D c_PIYaw (strafe), Shift c_PIWalk (the *slower* gait),
// LeftCtrl c_PICrouch, Z c_PILie, Space c_PIAction. Space and Ctrl both scroll
// or shortcut the page otherwise, which is why they are preventDefault'ed.
const FOOT_KEYS = new Set([
  'KeyW', 'KeyA', 'KeyS', 'KeyD', 'ShiftLeft', 'ShiftRight',
  'ControlLeft', 'ControlRight', 'KeyZ', 'Space',
]);

// ?shots keeps the drawing buffer so canvas.toDataURL() works for external
// screenshot tooling; off by default because it costs a buffer copy per frame.
// `&nopreserve` gives the perf harness the hooks without the copy, so it can
// measure the page a player gets.
//
// `?aa=0` and `?dpr=<ratio>` put the renderer settings on the bench's matrix
// (features/mesh-viewer-performance, renderer settings). MSAA is a context
// attribute (`antialias`, handed to `getContext` in three's constructor), so
// it can only be picked here, before the context exists. `dpr` replaces the
// cap for the WebGL canvas alone; the 2D map surfaces keep their own. Absent,
// both leave the defaults exactly as they were.
const renderQuery = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({
  antialias: renderQuery.get('aa') !== '0',
  preserveDrawingBuffer: renderQuery.has('shots') && !renderQuery.has('nopreserve'),
});
const dprOverride = Number(renderQuery.get('dpr'));
renderer.setPixelRatio(dprOverride > 0 && dprOverride <= 4 ? dprOverride : Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
const stage = document.getElementById('stage');
stage.appendChild(renderer.domElement);

// A lost context leaves the canvas showing whatever it last drew -- there is
// no repaint to hint that anything is wrong, so without this the page just
// goes quietly stale. Measured cause on this machine: a GPU-side stall
// during a firing burst at DPR 2 (features/mesh-viewer-performance/README.md,
// the Iris Xe log) took 8-9.5 s on one frame and the browser gave up on the
// context rather than waiting it out. `renderer`'s own `onContextLost`
// (`vendor/three.module.js`) already calls `preventDefault()` -- that is
// what tells Chromium a restore is worth attempting, and `restored` would
// fire without this listener too -- the call here is redundant, not load-
// bearing, kept only because a second listener calling it is harmless and
// this one should not depend on three's internals staying that way. What
// this listener actually adds is the visible message: nothing here tries
// to rebuild the scene on restore -- every texture and compiled program the
// renderer held is gone, and re-uploading all of it is out of scope for "no
// silent black canvas" -- so restore just offers a reload instead of
// pretending play can continue.
const glLostEl = document.getElementById('gl-lost');
const glLostBody = document.getElementById('gl-lost-body');
document.getElementById('gl-lost-reload')?.addEventListener('click', () => location.reload());
renderer.domElement.addEventListener('webglcontextlost', e => {
  e.preventDefault();
  release();
  glLostBody.textContent = 'The GPU dropped the WebGL context mid-frame. Waiting to see whether the browser restores it...';
  glLostEl.hidden = false;
}, false);
renderer.domElement.addEventListener('webglcontextrestored', () => {
  glLostBody.textContent = 'The context came back, but nothing it was holding did -- reload to keep playing.';
}, false);

const scene = new THREE.Scene();
// The scene never moves, and in three r169 an auto-updating root is what
// forces every descendant's world matrix to be recomputed each frame
// (freezeStatics, below, has the arithmetic). Its matrix stays the identity
// it was born with.
scene.matrixAutoUpdate = false;
const camera = new THREE.PerspectiveCamera(60, 1, 0.5, 8000);
camera.position.set(0, 80, 0);
// In the scene graph, not just pointed at it, so things may hang off it: the
// audio listener is a child of the camera, and a parentless camera's
// children are never rendered at all. (The on-foot arms are not — they hang
// off `vmRoot`, a camera-following node in the near pass's own scene.)
scene.add(camera);

const hemi = new THREE.HemisphereLight(0xe8dcc0, 0x5a4a32, 1.35);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1d0, 2.4);
scene.add(sun);

const loader = new GLTFLoader();
// Loose textures — lightmap atlases, terrain detail, sky, water — are queued
// after the scene .glb resolves and finish well after it. Their own manager
// turns that tail into a countable second phase of the progress bar instead of
// a stretch where the map is up but still visibly filling in.
const texManager = new THREE.LoadingManager();
const cubeLoader = new THREE.CubeTextureLoader(texManager);
const texLoader = new THREE.TextureLoader(texManager);
// Cache-busting is an iteration aid, not a production behaviour: a 70 MB scene
// re-fetched on every visit and every map switch is by far the slowest thing
// this page can do, and it defeats the Cache-Control nginx already sets. Local
// dev still bypasses the cache so a re-extract shows up without a hard refresh,
// and ?nocache forces it anywhere.
const DEV_ORIGIN = ['localhost', '127.0.0.1', '[::1]', ''].includes(location.hostname);
const NO_CACHE = DEV_ORIGIN || new URLSearchParams(location.search).has('nocache');
const bust = () => (NO_CACHE ? `?t=${Date.now()}` : '');
// Where every piece of the game's interface comes from for this mod: the
// sprites, the spawn screen, the HUD layout, the bitmap fonts and the
// console face. A mod's pack holds only what it changed, so `hudPaths.url`
// answers with the mod's directory for those and vanilla's for the rest;
// on vanilla nothing is fetched and every path is the one it always was.
// See `hud-pack.js`.
const hudPaths = await loadHudPaths(activeMod.id, { bust });
const lmCache = new Map();

// Hosted on the stage, not the body: .ld-overlay is inset:0 absolute, and
// body is unpositioned, so on the body it would resolve against the viewport
// and paint over the shared nav bar. #stage is the 3D view's positioned box.
const overlay = createLoadOverlay(stage, { assetBase: MAPS_BASE });

const keys = new Set();
const look = { yaw: 0, pitch: -0.15 };
const cull = [];
let spawnersRoot = null;
let captured = false;
let lockHeld = false;
let dragging = false;
let lastPointerX = 0;
let lastPointerY = 0;
let currentRoot = null;
// The game never lets you deploy into a level that has not finished loading;
// the browser must not either. False from the moment show() starts streaming
// a scene until its collider and bindings are up — deploySpawn refuses while
// it is false, or a fast SPAWN drops the soldier into an empty fog-coloured
// void that reads as "the map is broken".
let worldReady = false;
let extras = {};
let skybox = null;
let skyRoot = null;       // the level's SkyBox mesh, reparented to the scene
let cloudMesh = null;
let cloudUniforms = null;
let waterUniforms = null;
let waterAssets = [];     // textures owned by the water/cloud shaders
// The level's environment cubemap. The engine loads it once per level into the
// StandardMesh draw context's +0x18 (0x005c01dd) and binds it to texture stage
// 1 for every `envmap true` material (0x005bfab3) — it is not the water's, the
// water shader just happens to want the same six faces. Owned here so a level
// with no water still reflects, and disposed with `waterAssets`.
let levelEnvCube = null;
// `game.setActiveCombatArea` — the warning, its countdown and the damage
// after it. All the engine reading is in `combat-area.js`; this file only
// steps it with the body's position and hands the result to the HUD and to
// the soldier's Armor. Rebuilt per level.
//
// It has TWO halves, and the second one is why it is no longer inert on the
// twelve levels that declare no rectangle: `GameServer::gameStatusPlaying`
// also counts you as outside when the terrain material under you equals
// `materialToGiveDamage` (CA-5, default 7, "Reserved (Outside map)"). Eleven
// of the 23 vanilla levels paint that id, three of them without declaring any
// rectangle at all. `heightfield.material(x, z)` is the channel — the same one
// `surfaceFriction` already reads per wheel.
let combatArea = new CombatArea(null);
let combatFrame = null;
let simTime = 0;
// Drives everything the level glb animates. One mixer over the level root
// plays every clip it carries: `FlagBlow <name>` per control point, over that
// flag's own joints, which is the animation state `AnimatedFlag` declares —
// and `spin`/`spin.N`, the `setContinousRotationSpeed` parts grouped by period.
// The clips the mixer plays are kept for `freezeStatics`, which must leave
// every node they drive in three's matrix walk.
let levelClips = [];
let flagMixer = null;
// What `?mode=` could not give this level, for the console band. Null
// whenever the URL got exactly what it asked for, which is every load
// with no `?mode=` at all.
let modeNote = null;

const params = new URLSearchParams(location.search);

/** The Instant Battle screen in `play/` is where a level is chosen. The mod
 *  travels with the redirect: that screen reads `?mod=` and nothing else, so
 *  a bare `map.html?mod=xpack1` that dropped it would land the player on
 *  vanilla's level list having asked for Road to Rome's. */
const MENU_URL = new URL('./play/index.html', location.href);
if (params.get('mod') && params.get('mod') !== 'bf1942') {

/**
 * Ground height under a world (x, z).
 *
 * One answer for the camera clamp, the flown aircraft, the view rig and every
 * round in the air (gap C-5): `collision.js` rebuilds the level's own height
 * lattice from the terrain tiles at load, and a bilinear sample off that is
 * both exact — it is the grid the engine collides against — and some three
 * orders cheaper than the raycast this used to be, which mattered the moment
 * a burst of tracers started asking sixty times a second.
 *
 * The raycast stays as the fallback for a level whose lattice would not
 * rebuild (a mod with an irregular terrain export); `collider` is null then.
 *
 * `fromY` is the driven-vehicle opt-in and nothing else passes it: with a
 * reference height the answer also includes a drivable deck at or below it (a
 * bridge span, a repair bay's apron), so a tank's wheels ride the deck while a
 * soldier, a plane's ground check, a boat and the cameras keep seeing terrain
 * and sea alone. See `WorldCollider.surfaceHeight`.
 */
const groundRay = new THREE.Raycaster();
const DOWN = new THREE.Vector3(0, -1, 0);
const rayOrigin = new THREE.Vector3();
let terrainMeshes = [];
const terrainBBox = new THREE.Box3();
let collider = null;

function groundHeight(x, z, fromY) {
  const sea = extras?.waterLevel ?? -Infinity;
  if (collider) {
    const h = collider.surfaceHeight(x, z, fromY);
    if (Number.isFinite(h)) return h;
  }
  if (!terrainMeshes.length) return sea;
  rayOrigin.set(x, 2000, z);
  groundRay.set(rayOrigin, DOWN);
  groundRay.far = 4000;
  const hit = groundRay.intersectObjects(terrainMeshes, false)[0];
  return hit ? Math.max(hit.point.y, sea) : sea;
}

/**
 * `MaterialManager.materialFriction` of the ground at a world (x, z) — what
 * `ground.js` spends its Coulomb budget out of (PHY-2).
 *
 * Both halves already existed and were never joined up: the heightfield
 * carries the level's own per-sample material id out of `terrain/materials.png`
 * (the projectile impact path has been reading it for a while), and
 * `damage.json`'s materials table now carries `materialFriction` beside
 * `materialDamage`. This is the whole of the join.
 *
 * Below the water line the answer is water's 0.1 regardless of what the
 * material map says the bed is made of, because that is the material the
 * engine's own terrain pass hands a submerged contact.
 *
 * Fallback is `DEFAULT_MATERIAL_FRICTION`: a level with no material map, a
 * mod with no `Game.rfa`, or an id the define file never mentions all resolve
 * to material 0, which vanilla authors at 1.0.
 */
// `surfaceFriction` runs once per wheel per sub-step — up to sixteen times a
// tick for a half-track — so it walks a flat numeric array rather than
// re-deriving a string key and two property lookups each time. The array is
// built once per level, when the tables land.
let materialFrictionById = null;

function buildMaterialFrictionTable(tables) {
  const materials = tables?.materials;
  if (!materials) return null;
  let top = -1;
  for (const key of Object.keys(materials)) {
    const id = Number(key);
    if (Number.isInteger(id) && id >= 0 && id > top) top = id;
  }
  if (top < 0) return null;
  const out = new Float64Array(top + 1).fill(DEFAULT_SURFACE_FRICTION);
  for (const [key, entry] of Object.entries(materials)) {
    const id = Number(key);
    if (!Number.isInteger(id) || id < 0) continue;
    if (typeof entry?.friction === 'number') out[id] = entry.friction;
  }
  return out;
}

const DEFAULT_SURFACE_FRICTION = 1.0;

function surfaceFriction(x, z, fromY) {
  const table = materialFrictionById;
  if (!table) return DEFAULT_SURFACE_FRICTION;
  const sea = extras?.waterLevel;
  // A wheel on a drivable deck spends the DECK's material, not the riverbed's
  // under it. `fromY` is the same vehicle opt-in `groundHeight` takes, so this
  // costs one extra deck ray per wheel and only while actually on a deck — and
  // without it a tank crossing a bridge over water was gripping at water's 0.1
  // because the surface it was standing on read as being at the sea line.
  const deck = fromY !== undefined ? collider?.deckSurface?.(x, z, fromY) : null;
  let id = deck ? deck.material : collider?.heightfield?.material(x, z);
  if (!deck && Number.isFinite(sea) && groundHeight(x, z, fromY) <= sea) id = 1;
  if (!Number.isInteger(id) || id < 0 || id >= table.length) {
    return DEFAULT_SURFACE_FRICTION;
  }
  return table[id];
}

/**
 * The contact normal of a drivable deck under (x, z), when a deck is what the
 * wheel there is standing on: `ground.js` takes the deck triangle's own normal
 * rather than a finite difference of the height, so a tank pitches up the repair
 * bay's incline and levels on its pad. False elsewhere, and the vehicle then
 * uses the heightfield gradient it has always used.
 */
function deckNormal(x, z, fromY, out) {
  return collider?.deckNormal ? collider.deckNormal(x, z, fromY, out) : false;
}

function collectTerrain(root) {
  terrainMeshes = [];
  terrainBBox.makeEmpty();
  root.traverse(obj => {
    if (obj.isMesh && kindOf(obj) === 'terrain') {
      terrainMeshes.push(obj);
      if (obj.geometry) {
        if (!obj.geometry.boundingBox) obj.geometry.computeBoundingBox();
        terrainBBox.union(obj.geometry.boundingBox);
      }
    }
  });
}

function getFloorAltitude(x, z) {
  const gh = groundHeight(x, z);
  if (Number.isFinite(gh) && gh > -1000) return gh + 1.5;
  if (Number.isFinite(terrainBBox.min.y) && terrainBBox.min.y > -1000) {
    const base = Number.isFinite(extras?.waterLevel) ? Math.max(terrainBBox.min.y, extras.waterLevel) : terrainBBox.min.y;
    return base + 1.5;
  }
  if (Number.isFinite(extras?.waterLevel)) return extras.waterLevel + 1.5;
  return -50;
}

function clampAltitude() {
  if (optPilot.checked && (aircraft || car)) return;
  const floor = getFloorAltitude(camera.position.x, camera.position.z);
  if (camera.position.y < floor) {
    camera.position.y = floor;
  }
}

function panCamera(dx, dy) {
  // A body owns the camera while it is on foot; pan and dolly would fight it
  // for one frame and then lose to the next tick anyway.
  if (optOnFoot.checked) return;
  const gh = groundHeight(camera.position.x, camera.position.z);
  const alt = Number.isFinite(gh) ? Math.max(camera.position.y - gh, 15) : Math.max(camera.position.y, 15);
  const panSpeed = alt * 0.0018 * (isSlow() ? 0.35 : 1.0);

  const cy = Math.cos(look.yaw), sy = Math.sin(look.yaw);
  const cp = Math.cos(look.pitch), sp = Math.sin(look.pitch);

  const rx = -cy, rz = sy;
  const ux = -sy * sp, uy = cp, uz = -cy * sp;

  camera.position.x += (-rx * dx - ux * dy) * panSpeed;
  camera.position.y += (-uy * dy) * panSpeed;
  camera.position.z += (-rz * dx - uz * dy) * panSpeed;

  clampAltitude();
}

function dollyCamera(delta) {
  if (optOnFoot.checked) return;
  const d = lookVector();
  const gh = groundHeight(camera.position.x, camera.position.z);
  const alt = Number.isFinite(gh) ? Math.max(camera.position.y - gh, 15) : Math.max(camera.position.y, 15);
  const zoomFactor = alt * 0.003 * (isSlow() ? 0.35 : 1.0);
  const step = delta * zoomFactor;

  camera.position.x += d.x * step;
  camera.position.y += d.y * step;
  camera.position.z += d.z * step;
  clampAltitude();
}

let initialCameraPose = null;

function placeCamera() {
  // ?cam=x,y,z,yaw,pitch pins the camera for reproducible screenshots.
  const pinned = (params.get('cam') || '').split(',').map(Number);
  if (pinned.length === 5 && pinned.every(Number.isFinite)) {
    camera.position.set(pinned[0], pinned[1], pinned[2]);
    look.yaw = pinned[3];
    look.pitch = pinned[4];
    applyLook();
    initialCameraPose = { x: pinned[0], y: pinned[1], z: pinned[2], yaw: pinned[3], pitch: pinned[4] };
    return;
  }
  const cam = extras.camera;
  if (cam) {
    camera.position.set(cam[0], cam[1] + 55, cam[2]);
  } else {
    camera.position.set(0, 80, 0);
  }
  look.yaw = Math.PI;
  look.pitch = -0.22;
  applyLook();
  initialCameraPose = { x: camera.position.x, y: camera.position.y, z: camera.position.z, yaw: look.yaw, pitch: look.pitch };
}

function resetCamera() {
  if (optPilot.checked) {
    optPilot.checked = false;
    setPilot(false);
  }
  // On foot R respawns rather than resetting the camera — the keydown handler
  // routes it to `spawnAtFlag` before it ever reaches here — but a reset that
  // arrives from the on-screen button must not kick the player out of the mode
  // or move a camera the body owns.
  if (optOnFoot.checked && soldier) {
    spawnAtFlag(true);
    return;
  }
  if (initialCameraPose) {
    camera.position.set(initialCameraPose.x, initialCameraPose.y, initialCameraPose.z);
    look.yaw = initialCameraPose.yaw;
    look.pitch = initialCameraPose.pitch;
    applyLook();
  } else {
    placeCamera();
  }
}

const MOBILE_AIM_PIXELS_PER_SECOND = 720;

let mobilePadHeld = false;
let mobileFireHeld = false;

function clampMobileInput(value) {

function mobilePadAxis(axis) {

/**
 * The touch pad's contribution to the same input stage the mouse feeds.
 *
 * A pad has a deflection, not a count rate, and the engine has no reading to
 * transcribe here: BF1942's own controller support binds a stick through the
 * same `axisToAxis` arm, so a real gamepad arrives already counted. The
 * viewer's own choice, stated rather than transcribed, is that **full
 * deflection is a hand moving `MOBILE_AIM_PIXELS_PER_SECOND` pixels a
 * second** -- which keeps the pad in the same currency as the mouse, so the
 * sensitivity profiles, the +-16 saturation and `countsPerPixel` all reach it
 * unchanged, and one knob moves both.
 *
 * `-y` because the pad reports up-positive and the mouse (and DirectInput)
 * report down-positive.
 */
function feedMobileTurretAim(dt) {
  if (!mobilePadHeld || !occupancy?.turret) return;
  mouseInput.accumulateDeflection(
    mobilePadVector.x, -mobilePadVector.y, dt, MOBILE_AIM_PIXELS_PER_SECOND);

function resetMobilePad() {

  mobilePadHeld = false;

function resetMobileControls() {
  resetMobilePad();

  mobileJumpHeld = false;
  mobileThrottle = 0;
  mobileThrottleTouched = false;
  triggerHeld = false;
  clickQueued = false;

  seatAltFire = false;

  mobileJumpBtn.classList.remove('is-active');

function syncMobileThrottle() {
  if (!aircraft) return;
  const current = aircraft.input('c_PIThrottle');
  if (!mobileThrottleTouched || Math.abs(current - mobileThrottle) > 0.01) {
    mobileThrottle = Math.max(0, Math.min(1, current));

function updateMobileControls() {
  if (!isTouchDevice) return;
  const deployOpen = document.getElementById('fullmap')?.classList.contains('deploy');
  const onFoot = optOnFoot.checked && soldier && !soldierDead;
  const seated = optPilot.checked && occupancy;
  const activeSeat = seated && occupancy.isActiveRoot();
  const manned = seated && mannedActive();
  const aimable = manned && occupancy.turret;
  const driving = activeSeat && car;
  const flying = activeSeat && aircraft;
  const show = captured && !deployOpen && (onFoot || seated);
  const padMode = flying ? 'STICK' : driving ? 'DRIVE' : aimable ? 'AIM' : onFoot ? 'MOVE' : 'SEAT';
  const canFire = onFoot || (seated && (driving || flying || aimable)
    && occupancy.activeFireArmsNodes().length > 0);
  const signature = [
    show, padMode, onFoot, seated, manned, driving, flying, aimable,
    nearEntry?.control || '', mobileThrottleTouched,
  ].join('|');
  if (signature === mobileControlsSignature) return;
  mobileControlsSignature = signature;

  mobileControls.hidden = !show;
  mobilePad.hidden = !(onFoot || driving || flying || aimable);
  mobilePadLabel.textContent = padMode;
  mobileFireBtn.hidden = !canFire;
  mobileFireBtn.disabled = !canFire;
  mobileFireBtn.classList.toggle('is-active', mobileFireHeld && canFire);
  mobileJumpBtn.hidden = !onFoot;
  mobileJumpBtn.classList.toggle('is-active', mobileJumpHeld && onFoot);

function updateMobilePad(event) {
  const rect = mobilePad.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  const dx = event.clientX - cx;
  const dy = event.clientY - cy;
  const dist = Math.hypot(dx, dy);
  const clamped = Math.min(dist, MOBILE_PAD_RADIUS);
  const angle = Math.atan2(dy, dx);
  const px = Math.cos(angle) * clamped;
  const py = Math.sin(angle) * clamped;
  mobilePadVector.x = clampMobileInput(px / MOBILE_PAD_RADIUS);
  mobilePadVector.y = clampMobileInput(-py / MOBILE_PAD_RADIUS);
  mobilePadPuck.style.transform = `translate(calc(-50% + ${px.toFixed(1)}px), calc(-50% + ${py.toFixed(1)}px))`;
  mobilePad.classList.add('is-active');
}

function releaseMobilePad(event) {

    if (mobilePad.hasPointerCapture(event.pointerId)) mobilePad.releasePointerCapture(event.pointerId);
  } catch {}
  resetMobilePad();

  mobilePadPuck.classList.toggle('is-firing', on);

function mobileSeatToggle() {
  if (performance.now() - lastSeatToggle < SEAT_TOGGLE_COOLDOWN_MS) return;
  if (optOnFoot.checked && soldier && nearEntry) {
    setFly(true);
    enterVehicle(nearEntry);
    lastSeatToggle = performance.now();
  } else if (optPilot.checked && mannedActive()) {
    exitManned();
    lastSeatToggle = performance.now();
  } else if (optPilot.checked && (aircraft || car)) {
    exitVehicle();
    lastSeatToggle = performance.now();
  }
  resetMobileControls();
}

// --- the mouse-look input stage, on the engine's own tick -----------------
//
// LOOP-1 and GUN-2b together. The simulation is a fixed 30 Hz step with
// `dt = 1/30` exactly, rendering runs free on top, and a frame produces 0, 1
// or several whole ticks; the mouse-look axis is computed ONCE per pumped
// frame and every tick of that frame reads the same value. That is what makes
// the same hand movement turn a turret the same amount at 30, 60 and 144 fps,
// and it is why this page cannot simply hand the render dt to the servo.
//
// The rest of the page still steps on the render dt -- the soldier body has
// its own 60 Hz accumulator in `physics.js`, the drivetrain its own in
// `ground.js`. Only the look path is moved here, which is the whole of this
// stream: a page-wide fixed step is a bigger change than one branch should
// make while four other streams are editing this file.
const SIM_TICK_HZ = 30;                 // `g_simulationFps`, lnxded 0x08716b5c
const SIM_TICK_DT = 1 / SIM_TICK_HZ;    // `Setup+0xcc` / client `Setup+0x184`
const mouseInput = new MouseInput();
// The 30 Hz clock itself lives in the world (world.js), one authority per
// player; this page reads its frame's tick count back from `world.lookTicks
// (dt)` instead of running a second accumulator that could drift out of
// phase with the world's (a profile switch used to reset this page's simAccum
// and never the world's). The engine's backlog collapse was that page clock's
// rule too (`GameClient::update` 0x0048fca8 `cmp ebx,0x9; jle; mov ebx,1`);
// the world owns the same law as its FixedStep's MAX_CATCH_UP_TICKS cap.

/** Which sensitivity profile the player is on right now.
 *
 *  The engine reads it off the entered PCO's `getVehicleCategory()` (see
 *  `mouse-input.js`'s `profileFor`), and in vanilla every stationary weapon
 *  and every gunner position -- an aircraft's rear gun included -- declares
 *  `VCLand`, so only an aircraft's own pilot seat is on the Air profile. That
 *  is exactly `flying` here. */
function lookProfile() {
  if (optPilot.checked && occupancy) {
    return profileFor(aircraft && occupancy.isActiveRoot() ? 'air' : 'land');
  }
  return profileFor(null);
}

/**
 * One frame's pump, driven by the world's own clock.
 *
 * The pump's argument is the time the frame's ticks CONSUME (`nTicks / 30`),
 * not the wall-clock frame time -- `InputManager::update` 0x0049cff7
 * `fild nTicks; fmul tickDt`. That is what makes the integral exact: the
 * axis is `0.001 * counts * scale / (n/30)`, each of the n ticks contributes
 * its own share, and the total comes to `0.001 * counts * scale * 30`
 * whatever n was. A frame that owes no tick does not pump at all, and its
 * counts wait. `ticks` is the world's count for this frame (`lookTicks`),
 * so the pump and the sim share one tick authority.
 */
function pumpLook(ticks) {
  const profile = lookProfile();
  if (profile !== mouseInput.profile) {
    // A different control map has been activated (climbing into a plane, or
    // out of one). The engine resets the map it leaves, so nothing a player
    // did on the old profile arrives scaled by the new one. Only the device
    // stage resets here; the world's clock carries on (it is the one clock).
    mouseInput.reset();
    mouseInput.profile = profile;
  }
  if (ticks > 0) mouseInput.pump(ticks * SIM_TICK_DT, profile);
  return ticks;
}

/** A pumped frame's turret ticks: set the held axis pair once, then run the
 *  servo that many times at the engine's own dt. The world owns this loop now
 *  (world.js #vehicleTick aims the rig with the latest buffered axis and
 *  steps it once per 30 Hz tick, which is exactly this servo run); the page
 *  keeps only the pump — `pumpLook` above — and hands the world the axis
 *  pair, so `occupancy.turret`'s aim/step moved across unchanged. */

/** The soldier's own look, per tick.
 *
 *  `BFSoldier::handlePlayerInput` (lnxded 0x08273c70) turns the view by
 *  `input * dt * g_simulationFps` degrees a tick -- so, at the fixed tick,
 *  `input` degrees -- with a x3.0 on the yaw axis alone (`ds:0x86c08c8`, read
 *  at 0x0827457d) and none on the pitch (0x08274537). `mouse-input.js` carries
 *  the addresses. Signs match this page's own convention, which counts yaw the
 *  other way from the engine. */
function footLookPair() {
  const factor = footZoomFactor();
  return { x: mouseInput.x * factor, y: mouseInput.y * factor };
}

/**
 * The zoom half of the law above, split out so the render prediction
 * (`footLookPending`) runs the pair through the SAME factor the tick will.
 *
 * While zoomed the engine scales BOTH mouse-look axes by the weapon's
 * `zoomFov` — the WORLD field of view, `zoom.fov` here — not by
 * `SoldierZoomFov`, which is the arms' own factor. Read out of the
 * authority: `BFSoldier::handlePlayerInput` lnxded `0x08275bdf`
 * `call [eax+0x114]` (the weapon's zoom state), then
 *
 *     0x08275bf2  mov eax,[edi+0x4c]        ; the FireArms TEMPLATE
 *     0x08275bf5  fld [ebp-0x29c]           ; c_PIMouseLookX
 *     0x08275bfb  fld [eax+0x270]
 *     0x08275c01  fmul st(1),st ; 0x08275c03 fmul [ebp-0x2a4]
 *     0x08275c0b  fstp [ebp-0x29c] ; 0x08275c11 fstp [ebp-0x2a4]
 *
 * and `FireArmsTemplate::makeScript` round-trips **`+0x270` as
 * `ObjectTemplate.zoomFov`** (`0x0828f0e2` pushes `0x086d313b` =
 * `'ObjectTemplate.zoomFov '` before `fld [ebx+0x270]`) while
 * **`+0x274` is `ObjectTemplate.SoldierZoomFov`** (`0x0828f0b0` pushes
 * `0x086d35e0`). The two differ per weapon and by a lot: a K98 is
 * `zoomFov 0.4 / soldierZoomFov 0.6`, a Colt `0.7 / 0.5`. Using the arms'
 * factor made a scoped K98 50% too fast and a sighted Colt 29% too slow.
 *
 * Why a whole FOV reads as a factor: the hip FOV is 1 radian, so `zoomFov`
 * IS the ratio. The `-1.0f` template default cannot reach here --
 * `FireArms::setZoom` `0x082881b7` refuses to zoom at all while
 * `+0x270 < 0` -- but the guard costs nothing.
 */
function footZoomFactor() {
  if (!isZoomed()) return 1;
  const zoomFov = handWeapon?.data?.zoom?.fov;
  return Number.isFinite(zoomFov) && zoomFov > 0 ? zoomFov : 1;
}

/** The axis pair the NEXT tick will read, from the counts standing right now.
 *
 *  `mouseInput.peek` is `pump` without the consumption (mouse-input.js), asked
 *  for one tick's worth of time, through the same zoom factor `footLookPair`
 *  applies to the pumped pair. On a frame that DID pump — every frame that
 *  runs a tick — the counts were just cleared, so this returns `{0, 0}` and
 *  the prediction it feeds is exactly zero. That is the whole continuity
 *  argument for drawing the predicted view: on a tick frame the displayed
 *  view IS the simulated one, by construction rather than by tuning.
 *
 *  Written into `out` — this is a per-frame path (rule 5). */
function footLookPending(out) {
  mouseInput.peek(SIM_TICK_DT, lookProfile(), out);
  const factor = footZoomFactor();
  out.x *= factor;
  out.y *= factor;
  return out;
}

// --- render interpolation: drawing between the sim's 30 Hz ticks -----------
//
// THE RULE (features/mesh-viewer-performance, rule 8): the simulation ticks at
// 30 Hz and the page never draws a raw tick. At 60 Hz the world steps every
// other frame, so a page that drew tick state showed a new pose on half its
// frames and the same one on the rest — measured on foot at
// `[2.16, 0, 1.08, 0, 2.16, 0, 2.55, 0 ...]` degrees of camera rotation per
// frame during a steady pan, which is what "the frame rate feels bad while
// aiming" actually was. The renderer was never the problem.
//
// Two different fixes, because the two quantities want different things:
//
//   * **Positions and rigged angles are INTERPOLATED.** The previous tick's
//     pose is kept beside the current one and the frame draws `lerp(prev, cur,
//     alpha)` where `alpha` is `world.step()`'s own report of how far the
//     clock has carried past the last tick. That costs one tick of positional
//     latency (33 ms), which nobody can see on a body or a hull.
//   * **The on-foot VIEW ANGLES are PREDICTED, never lerped.** Thirty-three
//     milliseconds on the mouse is something a player feels immediately, so
//     instead of trailing the sim the view LEADS it by exactly the rotation
//     the next tick is already committed to: the mouse axis is a rate
//     computed from the counts pending right now (mouse-input.js), a frame
//     that runs no tick does not pump and those counts keep accruing, so the
//     pending rotation is a pure function of state the page can read. It is
//     read through `MouseInput.peek` and `Soldier.lookPreview` — the pump's
//     own conversion and the tick's own clamp — never a re-derived copy. On
//     a frame that DID tick the counts were just consumed, the prediction is
//     zero and the displayed view equals the simulated one, so the hand-off
//     between predicted and simulated is continuous by construction.
//
// THE TICK-EXACT-POSE CONSTRAINT. Anything the SIMULATION reads out of the
// scene graph during a tick — gun muzzle world matrices (gunfire.js's
// `updateWorldMatrix` at fire time), seat positions, `setPlayerPosition` —
// must see the tick's own pose, never an interpolated one. That holds here
// without a restore pass, because every node this file interpolates is
// rewritten from exact sim state INSIDE the tick before anything reads it:
// `Vehicle.integrate` ends in `applyTransform` + `applyRig` (the root and
// every rig part), and `TurretAxis.step` ends in its own `_apply` (every aim
// axis), all of which run in world.js's `#vehicleTick`, i.e. before that
// tick's `guns.advance`. The interpolated pose is written after `world.step()`
// returns and is dead by the next tick. The one scene read that happens
// BEFORE the step is `occupancy.root.getWorldPosition` in frame()'s seated
// branch, and that feeds the combat-area test for a BARE gun/seat root only
// (a root with a drivetrain reports `vehicle.state.position` instead) — a
// bare root has no drivetrain, so nothing interpolates its position and the
// value is exact either way.
//
// SNAP, NEVER LERP, ACROSS A DISCONTINUITY. `snapPresentation()` collapses
// prev onto cur so a spawn, a teleport, a seat change or a level switch does
// not streak the camera across the map for one frame. A `FixedStep` catch-up
// collapse needs no entry: `onTick` fires per tick, so prev and cur are
// always two ADJACENT ticks however many the frame ran or dropped.
//
// Rule 5 applies throughout: every vector and quaternion below is allocated
// once, at module load or at the moment a vehicle is mounted.

/** `world.step()`'s alpha for this frame: the fraction of the way from the
 *  last tick to the next. Zero until a world exists. */
let presentAlpha = 0;
/** Set by `snapPresentation()`, spent by the next capture. */
let presentSnap = true;

/** The on-foot eye at the last two world-tick boundaries, plus the frame's
 *  drawn blend of them. NOT `soldier.eye()`'s own interpolation: the body's
 *  60 Hz clock is advanced in whole 1/30 increments from inside the world
 *  tick, so its alpha is always zero and it returns raw tick state. */
const footEyePrev = { x: 0, y: 0, z: 0 };
const footEyeCur = { x: 0, y: 0, z: 0 };
/** Scratch for the predicted view: the pending axis pair and the pair of
 *  angles `Soldier.lookPreview` hands back. */
const footPending = { x: 0, y: 0 };
const footView = { yaw: 0, pitch: 0 };

/**
 * The occupied vehicle's drawn pose.
 *
 * `vehicle` is the drivetrain whose `state` carries the root pose (null for a
 * bare gun/seat root, which does not move); `parts` is every node a tick
 * poses — rig parts, the nodes an Engine spins, and every aim axis of every
 * seat's `TurretRig` — tracked by node so no module has to hand its internals
 * over. Quaternions are slerped, the root position is lerped.
 */
const vehicleInterp = {
  vehicle: null,
  root: null,
  parts: [],
  active: false,
  posPrev: new THREE.Vector3(),
  posCur: new THREE.Vector3(),
  posDraw: new THREE.Vector3(),
  quatPrev: new THREE.Quaternion(),
  quatCur: new THREE.Quaternion(),
};

/** Re-collect the nodes a tick poses. Called on every mount, seat change and
 *  dismount — the only moments the set can change — and never per frame. */
function rebuildVehicleInterp() {
  vehicleInterp.parts.length = 0;
  vehicleInterp.vehicle = null;
  vehicleInterp.root = null;
  vehicleInterp.active = false;
  if (occupancy) {
    const drive = aircraft || car || null;
    vehicleInterp.vehicle = drive;
    vehicleInterp.root = drive ? drive.node : null;
    const seen = new Set();
    const track = node => {
      if (!node || node === vehicleInterp.root || seen.has(node)) return;
      seen.add(node);
      vehicleInterp.parts.push({
        node,
        prev: new THREE.Quaternion().copy(node.quaternion),
        cur: new THREE.Quaternion().copy(node.quaternion),
      });
    };
    for (const part of drive?.parts || []) {
      track(part.node);
      for (const spun of part.spun || []) track(spun);
    }
    // Every seat's rig, not only the active one: an inactive rig simply never
    // moves, so its prev and cur stay equal and its slerp is the identity.
    for (const rig of occupancy.turrets?.values() || []) {
      for (const axis of rig.axes || []) track(axis.node);
    }
  }
  // A vehicle left behind must stop being drawn between ITS ticks, and a
  // vehicle just climbed into starts from where it is parked, not from
  // whatever the last one was doing.
  if (view) view.drawnPosition = null;
  snapPresentation();
}

/**
 * The next capture starts a fresh pair rather than blending out of a pose
 * that no longer means anything: a spawn, a teleport, entering or leaving a
 * vehicle, a seat switch, a death or respawn, a level switch, `__plane().
 * place` / `__placeCar`. Cheap and idempotent, so call it whenever in doubt.
 */
function snapPresentation() {
  presentSnap = true;
  capturePresentationTick();
}

/**
 * One tick boundary's pose, kept beside the previous one. Registered as the
 * world's `onTick`, so it runs once per tick — including each tick of a frame
 * that ran several — with every piece of that tick's state final.
 */
function capturePresentationTick() {
  const snap = presentSnap;
  presentSnap = false;
  if (soldier) {
    if (!snap) Object.assign(footEyePrev, footEyeCur);
    // Alpha 1: this tick's own finished pose. See `Soldier.eye`.
    soldier.eye(footEyeCur, 1);
    if (snap) Object.assign(footEyePrev, footEyeCur);
  }
  const vi = vehicleInterp;
  if (!vi.vehicle && !vi.parts.length) return;
  if (vi.vehicle) {
    if (!snap) { vi.posPrev.copy(vi.posCur); vi.quatPrev.copy(vi.quatCur); }
    // The drivetrain's state, not the node: the contact solver may have pushed
    // the hull after `applyTransform` wrote the node, and `stepVehicleBodies`
    // used to be the only thing that drew that push.
    vi.posCur.copy(vi.vehicle.state.position);
    vi.quatCur.copy(vi.vehicle.state.orientation);
    if (snap) { vi.posPrev.copy(vi.posCur); vi.quatPrev.copy(vi.quatCur); }
  }
  for (const part of vi.parts) {
    if (!snap) part.prev.copy(part.cur);
    part.cur.copy(part.node.quaternion);
    if (snap) part.prev.copy(part.cur);
  }
  vi.active = true;
}

/**
 * Draw the occupied vehicle where this FRAME is, not where the last tick left
 * it. Runs immediately after `world.step()` and before any camera, because
 * every vehicle camera — the cockpit eye, a gunner's seat camera, the seated
 * soldier's pose target — derives from these nodes' world matrices.
 *
 * `updateMatrixWorld(true)` for the same reason `applyTransform` calls it: the
 * cameras read world poses before the renderer's own matrix walk gets there.
 */
function applyVehicleInterp(alpha) {
  const vi = vehicleInterp;
  if (!vi.active) return;
  if (vi.vehicle) {
    vi.posDraw.lerpVectors(vi.posPrev, vi.posCur, alpha);
    vi.root.position.copy(vi.posDraw);
    vi.root.quaternion.slerpQuaternions(vi.quatPrev, vi.quatCur, alpha);
  }
  for (const part of vi.parts) {
    part.node.quaternion.slerpQuaternions(part.prev, part.cur, alpha);
  }
  if (vi.root) vi.root.updateMatrixWorld(true);
  // The external camera modes frame the hull from outside and hang off
  // `state.position`; point them at what was actually drawn (flight.js's
  // `drawnPosition`). The cockpit mode needs nothing — it reads the camera
  // node, which the matrix update above has just moved.
  if (view) view.drawnPosition = vi.vehicle ? vi.posDraw : null;
}

function lookDelta(dx, dy) {
  if (!dx && !dy) return;
  // P2's one necessary touch outside its owned-function list (see its final
  // report): a bare gun/seat root has no `view` (`VehicleCamera`) to turn at
  // all, and a nested seat of a vehicle that does (the Sherman's hull gunner)
  // must not steal the *driver's* `view.turn` while manned — neither case
  // existed before manned guns did, and both need to reach `occupancy.turret`
  // before the plain aircraft/car branch below ever runs, or a manned-only
  // seat's mouse motion falls through into the on-foot soldier-look branch
  // instead (the soldier is merely suspended, not unmounted, while seated).
  // A turret takes the mouse from whichever seat owns it, driving seat
  // included. `mannedActive()` alone was enough while only gunners had one;
  // a tank's driver aims his own main gun in this engine (`ShermanTower` /
  // `ShermanGunBase` are declared under the Sherman's own control), so the
  // test is now "is there a turret" rather than "is this a gunner". A
  // drivetrain seat with no turret — a jeep, an aircraft — still falls
  // through to `view.turn` below and swings the camera as it always did.
  if (optPilot.checked && occupancy?.turret) {
    // Not applied here any more: the counts go into the input stage and the
    // frame's pump turns them into one axis pair that every tick of that frame
    // reads (`stepTurret`). Several `mousemove` events between two frames
    // simply add up, which is what DirectInput does between two pumps.
    mouseInput.accumulate(dx, dy);
    return;
  }
  if (optPilot.checked && mannedActive()) {
    // A manned seat with no aim rig at all: a passenger position. Nothing to
    // turn, and falling through would hand the mouse to the driver's camera.
    return;
  }
  if (optPilot.checked && (aircraft || car)) {
    // Not a stick: the arrow keys fly the aircraft and A/D steer the car. What
    // the mouse does depends on the view — a head inside the cockpit, an orbit
    // outside it, and nothing at all in fly-by, which is a camera standing in
    // the world. `VehicleCamera` owns that distinction and the per-mode clamps
    // that go with it.
    view.turn(-dx * HEAD_SENS, -dy * HEAD_SENS);
    return;
  }
  if (optOnFoot.checked && soldier) {
    // Same as the turret: accumulated here, converted once per pumped frame,
    // applied per tick in `stepSoldierLook`. The zoom factor and the pitch
    // clamp moved there with it.
    mouseInput.accumulate(dx, dy);
    return;
  }
  look.yaw -= dx * LOOK_SENS;
  look.pitch = Math.max(-1.2, Math.min(1.2, look.pitch - dy * LOOK_SENS));
}

addEventListener('keydown', e => {
  // The console gets first refusal on every key. Tilde toggles it (the
  // game's `c_GIToggleConsole`); while it is up it eats the keyboard, so
  // movement, fire, the deploy screen and the map never see a keystroke —
  // the same gate the engine puts in front of `Setup`'s input dispatch.
  if (GameConsole.isToggleKey(e)) {
    e.preventDefault();
    setConsoleOpen(!gameConsole.open);
    return;
  }
  if (consoleCaptures()) {
    if (e.code === 'Escape') { setConsoleOpen(false); return; }
    if (gameConsole.keydown(e)) e.preventDefault();
    return;
  }
  // Under the Escape menu the keyboard is the menu's, the way it is the
  // console's above: the list and the arrow keys answer, and nothing behind
  // it moves. Escape is the way back to the game.
  if (escMenuCaptures()) {
    if (e.code === 'Escape') { setEscMenu(false); return; }
    if (escMenu?.keydown(e)) e.preventDefault();
    return;
  }
  if (e.code === 'Escape') {
    // The map is the topmost thing Escape can dismiss. In its deploy state
    // it is dismissed with intent: a redeploy resumes the life in progress,
    // and a join nobody committed to leaves for the free camera, which is
    // what closing the game's own spawn menu does on a server that allows
    // it. Under `?kblock` Escape is a locked key and reaches the page in
    // fullscreen too; the browser leaves the fullscreen only on a long
    // press, and `kbLockLeave` is the page's own way out of a session the
    // pointer has already left.
    //
    // With all of those away, Escape is the game's own: it brings up the
    // menu, in one press even mid-play, because the browser has already
    // taken the pointer lock off us by the time this runs.
    if (deployActive()) cancelDeploy();
    else if (!fullmapBox.hidden) toggleFullMap(false);
    else if (kbSession && !captured && !e.repeat) kbLockLeave();
    else if (!e.repeat) setEscMenu(true);
    return;
  }
  // Caps Lock toggles the spawn menu even while a sidebar control is focused,
  // matching Escape's privilege over form focus.
  if (e.code === 'CapsLock' && !e.repeat) {
    if (deployActive()) cancelDeploy();
    else if (!optPilot.checked) openDeploy();
    return;
  }
  // Deploy owns Enter and 1-9 even when a sidebar INPUT/SELECT is focused:
  // otherwise Enter toggles `#onfoot` or activates RESUME and the commit
  // either never runs or is immediately undone into fly-through.
  if (deployActive()) {
    if (e.code === 'Enter' && !e.repeat) {
      e.preventDefault();
      e.stopPropagation();
      deploySpawn();
      return;
    }
    const digit = /^Digit([1-9])$/.exec(e.code);
    if (digit) {
      e.preventDefault();
      selectDeployFlag(Number(digit[1]) - 1);
      return;
    }
  }
  if (uiFocused()) return;
  // Caps Lock is also handled above; M is `c_PIMap` in the game's own maps.
  // On foot the map opens in its deploy state — the game's own map is also
  // its spawn screen — and Escape or M again puts it away without moving you.
  if (e.code === 'KeyM' && !e.repeat && !e.ctrlKey && !e.metaKey && !e.altKey) {
    if (deployActive()) cancelDeploy();
    else if (fullmapBox.hidden && optOnFoot.checked && soldier
             && !optPilot.checked) {
      // On foot, but not merely suspended in a seat: a driver's M is the
      // plain map, because his soldier is still ticked and still alive.
      openDeploy();
    } else toggleFullMap();
    return;
  }
  // Seated in anything, the same row switches seats instead (SEAT-23/24,
  // verify-r5.md's `c_PIMenuSelect1..9`) — checked after the deploy screen's
  // own use of these keys above, since the two are never active together.
  if (optPilot.checked && occupancy && !e.repeat
      && !e.ctrlKey && !e.metaKey && !e.altKey) {
    const seatDigit = /^Digit([1-9])$/.exec(e.code);
    if (seatDigit) {
      switchSeat(Number(seatDigit[1]) - 1);
      return;
    }
  }
  // On foot the row raises kit weapons instead: `ObjectTemplate.itemIndex` is
  // the inventory slot and the number key that selects it (1 knife .. 3
  // primary .. 5 special), so a key with no such slot in the spawned kit's
  // inventory does nothing, exactly as in the game.
  if (optOnFoot.checked && soldier && !e.repeat
      && !e.ctrlKey && !e.metaKey && !e.altKey) {
    const kitDigit = /^Digit([1-9])$/.exec(e.code);
    if (kitDigit) {
      selectKitWeapon(Number(kitDigit[1]));
      return;
    }
  }
  keys.add(e.code);
  if (e.code === 'KeyR') {
    // The seat is checked before the soldier: a driver who walked in on foot
    // still has his rifle slung, and R must reset the vehicle he is actually
    // holding the wheel of, not work the bolt.
    if (optPilot.checked && (aircraft || car)) {
      (aircraft || car).reset();
      world?.resetStick(LOCAL_PLAYER);
    } else if (optOnFoot.checked && soldier) {
      // R is the reload once there is a magazine to reload — the game's own
      // binding — and stays the respawn only for a soldier holding nothing
      // (a weapon glb that failed to load). Shift+R is the deliberate road
      // back: it reopens the deploy screen rather than guessing a flag.
      if (e.shiftKey) {
        if (!deployActive()) openDeploy();
      } else if (handWeapon?.data?.magazine) startReload();
      else spawnAtFlag(true);
    } else if (!optPilot.checked) {
      resetCamera();
    }
  }
  // E is `c_PIUse` (SEAT-2, verify-r5.md — the report's own correction: there
  // is no distinctly-named "enter/exit" enum value, vehicle use shares the
  // same trigger a real Use-key bind would), mapped to the physical E key.
  // In free fly E is already the vertical thrust, so both branches ask for a
  // mode first. The 1.0s per-player cooldown (SEAT-6) below gates the whole
  // branch, same as the real `toggleEntryPoint`.
  if (e.code === 'KeyE' && !e.repeat && !e.ctrlKey && !e.metaKey && !e.altKey
      && performance.now() - lastSeatToggle >= SEAT_TOGGLE_COOLDOWN_MS) {
    // Checked before the plain aircraft/car branch: a nested seat (the
    // Sherman's hull gunner) or a bare gun/seat root both count as
    // `aircraft || car` truthy *or* falsy depending on the vehicle, so
    // `mannedActive()` is the one check that is right either way.
    if (optPilot.checked && mannedActive()) {
      exitManned();
      lastSeatToggle = performance.now();
    } else if (optPilot.checked && (aircraft || car)) {
      exitVehicle();
      lastSeatToggle = performance.now();
    } else if (optOnFoot.checked && soldier && captured && nearEntry) {
      enterVehicle(nearEntry);
      lastSeatToggle = performance.now();
    }
  }
  // C cycles the view, which is `c_PIToggleCameraMode` bound to IDKey_C in every
  // one of the game's own control maps.
  if (e.code === 'KeyC' && !e.repeat && !e.ctrlKey && !e.metaKey
      && optPilot.checked && view) {
    showView(view.cycle());
  }
  // Z is `c_PILie`, a non-repetitive trigger, so it toggles rather than holds.
  if (e.code === 'KeyZ' && !e.repeat && optOnFoot.checked && soldier) prone = !prone;
  if (captured && (FLY_KEYS.has(e.code)
      || (optOnFoot.checked && FOOT_KEYS.has(e.code))
      || (optPilot.checked && AIR_KEYS.has(e.code)))) e.preventDefault();
});
addEventListener('keyup', e => {
  // A key released under an open console must not reach `keys` either: the
  // set is only ever read for movement, and the console has the keyboard.
  // The Escape menu has it on the same terms.
  if (consoleCaptures() || escMenuCaptures()) return;
  keys.delete(e.code);
});

// Crouch is left Ctrl, for game parity with `c_PICrouch` -- but the browser
// owns Ctrl+W outright by default, so firing while crouching still closes
// the tab. Chromium's Keyboard Lock API (`navigator.keyboard.lock()`) can
// reserve it, but only inside a fullscreen session the page has to request
// first; that is prototyped behind `?kblock`, off by default (`kbLockEnter`,
// below). Without it -- and in Firefox and Safari, which have no Keyboard
// Lock -- the only lever a page has is asking before the tab actually goes,
// the way any unsaved-work page does. Scoped to mid-play (captured, on foot,
// a live soldier) so it never fires over the spawn screen or a fly-by.
// Chromium shows the prompt only for a page that has had a real click or key
// press since it loaded, which mid-play always has.
addEventListener('beforeunload', e => {
  if (!(captured && optOnFoot.checked && soldier)) return;
  e.preventDefault();
  e.returnValue = '';
});

const sideEl = document.getElementById('side');
const sideCollapseBtn = document.getElementById('side-collapse-btn');
const mapFabBtn = document.getElementById('map-controls-fab');

function setSideCollapsed(collapsed) {
  sideEl.classList.toggle('side-collapsed', collapsed);
  if (mapFabBtn) mapFabBtn.hidden = !collapsed;
}
sideCollapseBtn?.addEventListener('click', e => {
  e.stopPropagation();
  setSideCollapsed(true);
});
mapFabBtn?.addEventListener('click', e => {
  e.stopPropagation();
  setSideCollapsed(false);
});
// Debug options start pulled away on every screen size; the fab restores them.
setSideCollapsed(true);

/* ------------------------------------------------------------------ console
 *
 * The game's own console, on the tilde key. The model, the parser and the
 * drawing rule all live in `./console.js`, reconstructed from
 * `dice::ref2::io::OldConsole` in both binaries; this is only the page's end
 * of it -- the canvas, the key hook, and the one command the viewer needs.
 *
 * `c_GIToggleConsole` is bound to `IDKey_Grave` and `IDKey_Capital` in the
 * shipped `Settings/Default/Controls/Common.con` (lines 26-27) and in the
 * client's own compiled fallback map (0x00927088 / 0x00927020). This page
 * already spends Caps Lock on the spawn menu, so only Grave toggles here.
 */
const gameConsole = new GameConsole();
const consoleCanvas = document.getElementById('console-canvas');
let consoleFont = null;
let consolePainted = -1;
let consoleSize = '';

/** True while the console owns the keyboard and the mouse. Every input path
 *  in this file asks this before acting, which is the whole of "it swallows
 *  game input": the engine does the same thing by gating `Setup`'s input
 *  dispatch on the console's own visible flag (`this+0xe3`, read at
 *  0x004429e0, 0x004447fa, 0x00446719 and half a dozen more). */
function consoleCaptures() { return gameConsole.open; }

/** The debug gate. The panel and its fab are absent for a regular player;
 *  `show.dev 1` brings both back, `show.dev 0` puts them away. Nothing is
 *  removed from the DOM, so `__setOnFoot`, `__deploy`, the `?shots` flow and
 *  every `optOnFoot.checked` in this file are unaffected either way. */
let devMode = false;
function setDevMode(on) {
  devMode = Boolean(on);
  document.body.classList.toggle('dev-on', devMode);
  if (devMode) setSideCollapsed(false);
  return devMode;
}
setDevMode(params.get('dev') === '1');

/** `show.dev` is the viewer's own word, not one of the engine's (there is no
 *  `show` object in 1.61). It is shaped like a real one: read/write, one
 *  integer argument, and it answers through the same dispatcher, so
 *  `show.dev`, `show.dev 1`, `show.dev = 1` and `show.dev 0` all behave the
 *  way a registered property does. Later streams add real commands with the
 *  same call -- `gameConsole.register({ object, method, ... })`. */
gameConsole.register({
  object: 'show', method: 'dev',
  minArgs: 0, maxArgs: 1, argTypes: ['int'], returns: 'int',
  run: args => {
    if (!args.length) return devMode ? 1 : 0;
    return setDevMode(args[0] !== '0' && args[0].toLowerCase() !== 'false') ? 1 : 0;
  },
});

/** `game.disconnect` is the engine's own word (it sits in the `game` object's

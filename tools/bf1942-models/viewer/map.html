    uShallowAlpha: { value: w.shallowAlpha ?? 0.5 },
    uAlphaDepth: { value: w.alphaDepth || 1.5 },
    uColorDepth: { value: w.colorDepth || 10 },
    fogColor: { value: new THREE.Color(0x808080) },
    fogNear: { value: 400 },
    fogFar: { value: 900 },
  };
  const material = new THREE.ShaderMaterial({
    uniforms: waterUniforms,
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide,
    vertexShader: `
      varying vec3 vWorld;
      void main() {
        vec4 world = modelMatrix * vec4(position, 1.0);
        vWorld = world.xyz;
        gl_Position = projectionMatrix * viewMatrix * world;
      }`,
    fragmentShader: `
      uniform sampler2D tLayer1, tLayer2, tNormal, tDepth;
      uniform samplerCube tEnv;
      uniform float uTime, uWorldSize, uMaxDepth;
      uniform vec2 uDir1, uDir2, uDirN;
      uniform float uScroll1, uScroll2, uScrollN, uTile1, uTile2, uTileN;
      uniform vec3 uShallow, uDeep, uSpec, uLightDir;
      uniform float uShininess, uShallowAlpha, uAlphaDepth, uColorDepth;
      uniform vec3 fogColor;
      uniform float fogNear, fogFar;
      varying vec3 vWorld;
      vec3 bfToSrgb( vec3 c ) {
        return mix( pow( c, vec3( 0.41666 ) ) * 1.055 - vec3( 0.055 ),
            c * 12.92, vec3( lessThanEqual( c, vec3( 0.0031308 ) ) ) );
      }
      vec3 bfFromSrgb( vec3 c ) {
        return mix( pow( c * ( 1.0 / 1.055 ) + vec3( 0.055 / 1.055 ),
                vec3( 2.4 ) ),
            c * ( 1.0 / 12.92 ),
            vec3( lessThanEqual( c, vec3( 0.04045 ) ) ) );
      }
      void main() {
        vec2 wuv = vec2(vWorld.x, -vWorld.z);
        vec3 tex = vec3(1.0);
        #ifdef HAS_LAYERS
        // The engine's fixed-function MODULATE2X runs in 8-bit DISPLAY space,
        // like every other combine in this viewer (terrain detail, lightmaps,
        // dynamic shading). The old l1*l2*4.0 did it in linear, which squares
        // the layers' slight teal tint into the saturated turquoise the game
        // never shows - the water07/08 texels are a near-neutral grey
        // (mean 140/150/153).
        vec3 l1 = bfToSrgb(texture2D(tLayer1, wuv * uTile1 + uDir1 * uScroll1 * uTime).rgb);
        vec3 l2 = bfToSrgb(texture2D(tLayer2, wuv * uTile2 + uDir2 * uScroll2 * uTime).rgb);
        tex = min(vec3(1.0), l1 * l2 * 2.0);
        #endif
        float depth = uMaxDepth;
        #ifdef HAS_DEPTH
        depth = texture2D(tDepth, wuv / uWorldSize).r * uMaxDepth;
        #endif
        vec3 base = mix(uShallow, uDeep, clamp(depth / max(uColorDepth, 0.001), 0.0, 1.0));
        vec3 col = bfFromSrgb(min(vec3(1.0), bfToSrgb(base) * tex));
        vec3 N = vec3(0.0, 1.0, 0.0);
        #ifdef HAS_NORMAL
        // The DX8-era normal map is not 0.5-centred; two offset samples
        // subtracted give a zero-mean, still-animated perturbation.
        vec2 nuv = wuv * uTileN + uDirN * uScrollN * uTime;
        vec2 dn = texture2D(tNormal, nuv).rg
                - texture2D(tNormal, nuv * 1.31 + vec2(0.5)).rg;
        N = normalize(vec3(dn.x * 0.6, 1.0, dn.y * 0.6));
        #endif
        vec3 V = normalize(cameraPosition - vWorld);
        #ifdef HAS_ENV
        vec3 R = reflect(-V, N);
        R.y = abs(R.y);
        // Deliberately blurred (fixed coarse mip): the ENVMAP_G_.rcm faces
        // bake the island and its clouds, and a sharp per-pixel lookup mirrors
        // them as structured smudges marching across the mid-distance - shapes
        // the in-game water never shows. What the reference shots do show is a
        // soft brightness wash toward the horizon, which is exactly what the
        // cubemap's low mip is. LOD 4 of a 128px face is 8px - directional
        // light distribution kept, all structure gone. (A texture bias can't
        // do this: MAX_TEXTURE_LOD_BIAS may clamp as low as 2.) Calibrated
        // against the Wake defgun reference, same spirit as the fresnel
        // shaping below - not a decompiled engine behaviour.
        vec3 sky = textureLod(tEnv, R, 4.0).rgb;
        // A plain Schlick fresnel (exponent 5, scaled to reach 1.0) turned the
        // lagoon into a near-perfect cloud mirror the moment the camera got low
        // and the view raked across open water -- exactly the case a flythrough
        // spends most of its time in, and not what the live-game reference
        // screenshots show even at the shoreline: the water keeps its own
        // shallow/deep tint and a soft sun-glint, not a crisp sky reflection.
        // Steepening the exponent and capping the peak keeps the mirror term a
        // rim highlight at true grazing incidence instead of the dominant term
        // from ten degrees off horizontal outward.
        float fresnel = 0.03 + 0.55 * pow(1.0 - max(dot(N, V), 0.0), 10.0);
        col = mix(col, sky, clamp(fresnel, 0.0, 1.0));
        #endif
        vec3 H = normalize(normalize(uLightDir) + V);
        col += uSpec * pow(max(dot(N, H), 0.0), uShininess);
        float alpha = mix(uShallowAlpha, 0.96, clamp(depth / max(uAlphaDepth, 0.001), 0.0, 1.0));
        #ifdef HAS_ENV
        alpha = max(alpha, clamp(fresnel, 0.0, 1.0));
        #endif
        // LINEAR, not smoothstep: THREE.Fog on the terrain and the engine's
        // DX8 vertex fog are both linear ramps. An S-curve here under-fogs
        // the sea ahead of the midpoint and over-fogs it past it (up to ~9%
        // of the ramp), so the waterline would read differently hazed than
        // the shore it touches at the same distance.
        float fogF = clamp((length(cameraPosition - vWorld) - fogNear)
            / max(fogFar - fogNear, 0.001), 0.0, 1.0);
        col = mix(col, fogColor, fogF);
        gl_FragColor = vec4(col, alpha);
        #include <colorspace_fragment>
      }`,
    defines: {
      ...(layer1 && layer2 ? { HAS_LAYERS: '' } : {}),
      ...(normal ? { HAS_NORMAL: '' } : {}),
      ...(depth ? { HAS_DEPTH: '' } : {}),
      ...(env ? { HAS_ENV: '' } : {}),
    },
  });
  waterObj.material.dispose();
  waterObj.material = material;
}

function syncWaterFog() {
  if (!waterUniforms || !scene.fog) return;
  waterUniforms.fogColor.value.copy(scene.fog.color);
  waterUniforms.fogNear.value = scene.fog.near;
  waterUniforms.fogFar.value = scene.fog.far;
}

// The sky box is 4000 m across but our far plane is much closer, so it is
// drawn scaled down around the camera — with depth writes off and everything
// overdrawing it, only its angular content matters, and that is scale-free.
function updateSky() {
  if (skyRoot) {
    const half = skyRoot.userData.halfExtent || 2000;
    const s = camera.far * 0.95 / (half * 1.7320508);
    skyRoot.scale.setScalar(s);
    // changeOfsSkyHeight lowers the box so the painted horizon sits below
    // eye level - Tobruk (150) shows sand-fade everywhere with the sign the
    // other way, and Wake (0) is indifferent.
    skyRoot.position.set(
      camera.position.x,
      camera.position.y - (extras.sky?.heightOffset || 0) * s,
      camera.position.z,
    );
    if (cloudMesh && cloudUniforms) {
      const clouds = extras.sky?.clouds || {};
      const rise = ((clouds.height ?? 3500) - (clouds.ofsHeight ?? 0)) * s;
      const span = 4 * half * s / (clouds.texScale || 8);
      cloudMesh.scale.set(camera.far * 4, 1, camera.far * 4);
      cloudMesh.position.set(
        camera.position.x, camera.position.y + rise, camera.position.z);
      cloudUniforms.uSpan.value = span;
      cloudUniforms.uCam.value.set(camera.position.x, camera.position.z);
      cloudUniforms.uFadeStart.value = camera.far * 1.2;
      cloudUniforms.uFadeEnd.value = camera.far * 2.4;
    }
  }
}

function advanceSim(dt) {
  simTime += dt;
  if (flagMixer) flagMixer.update(dt);
  if (waterUniforms) waterUniforms.uTime.value = simTime;
  if (cloudUniforms) {
    const speed = extras.sky?.clouds?.speed || [0, 0];
    cloudUniforms.uOffset.value.set(simTime * speed[0], simTime * speed[1]);
  }
}

function ensureListener() {
  if (AUDIO_OFF) return null;
  if (!audioListener) {
    audioListener = new THREE.AudioListener();
    camera.add(audioListener);
    audioLoader = new THREE.AudioLoader();
  }
  return audioListener;
}

function ensureAudioContext() {
  if (!ensureListener()) return;
  // Autoplay policy: a context created before any click starts suspended and
  // stays that way until a gesture resumes it. Every caller of this is a real
  // user gesture; the catch is for the ones that are not.
  if (audioListener.context && audioListener.context.state === 'suspended') {
    audioListener.context.resume().catch(() => {});
  }
}

/**
 * Decoded wav, cached on the un-busted path.
 *
 * The cache key must not carry `bust()`: with it, the dev origin re-keyed and
 * re-decoded the same wav on every call, and the sequential decode stagger
 * started identical loops 50-200 ms apart — a permanent slapback echo. bust()
 * stays on the fetch URL only. Ambient, area and engine sound all come through
 * here so the one-decode-per-wav rule holds across all three.
 */
async function soundBuffer(dir, relPath) {
  if (AUDIO_OFF) return null;
  const key = `${dir}/${relPath}`;
  if (audioBufferCache.has(key)) return audioBufferCache.get(key);
  ensureListener();
  // The pending decode is what goes in the cache, not just the finished
  // buffer. Two setups that overlap — the pilot box ticked, unticked and
  // ticked again while the first load is still awaiting — otherwise both miss
  // and fetch the same wav twice, which is the one-decode-per-wav rule the
  // hall-echo postmortem left behind (features/bf1942-3d-models/map-sounds.md).
  // A failed load drops out of the cache again so a later attempt can retry.
  const pending = audioLoader.loadAsync(`${MAPS_BASE}/${key}${bust()}`)
    .catch(e => {
      console.warn(`Could not load sound ${key}:`, e);
      audioBufferCache.delete(key);
      return null;
    });
  audioBufferCache.set(key, pending);
  return pending;
}

/**
 * Same cache, models tree: the hand-weapon fire samples live under
 * `models/sounds/`, not in any map directory. The `models:` prefix keeps the
 * key out of the `${dir}/${relPath}` namespace above — a map directory cannot
 * contain a colon, so the two families can never collide in the cache.
 */
async function modelSoundBuffer(relPath) {
  if (AUDIO_OFF) return null;
  const key = `models:${relPath}`;
  if (audioBufferCache.has(key)) return audioBufferCache.get(key);
  ensureListener();
  // The pending decode, for the reason soundBuffer gives above.
  const pending = audioLoader.loadAsync(`${MODELS_BASE}/${relPath}${bust()}`)
    .catch(e => {
      console.warn(`Could not load sound ${key}:`, e);
      audioBufferCache.delete(key);
      return null;
    });
  audioBufferCache.set(key, pending);
  return pending;
}

function disposeSounds() {
  soundsGeneration++;
  disposeEngineAudio();
  if (ambientAudio) {
    try {
      if (ambientAudio.isPlaying) ambientAudio.stop();
      ambientAudio.disconnect();
    } catch (_) {}
    ambientAudio = null;
  }
  for (const item of activeAreaAudios) {
    try {
      if (item.sound.isPlaying) item.sound.stop();
      item.sound.disconnect();
      if (item.anchor) scene.remove(item.anchor);
    } catch (_) {}
  }
  activeAreaAudios = [];
}

async function setupSounds(report, dir) {
  disposeSounds();
  const gen = soundsGeneration;
  const cfg = report.sounds;
  if (!cfg || AUDIO_OFF) return;

  ensureListener();
  const getBuffer = (relPath) => soundBuffer(dir, relPath);

  // Ambient atmospheric sound
  if (cfg.ambient && cfg.ambient.file) {
    const buf = await getBuffer(cfg.ambient.file);
    if (gen !== soundsGeneration) return;
    if (buf) {
      ambientAudio = new THREE.Audio(audioListener);
      ambientAudio.setBuffer(buf);
      ambientAudio.setLoop(true);
      const master = optSound.checked ? parseFloat(optSoundVol.value) : 0;
      ambientAudio.setVolume((cfg.ambient.volume ?? 0.6) * master);
      try { ambientAudio.play(); } catch (_) {}
    }
  }

  // Shorelines and positional area sounds. One looping voice per unique wave
  // file: several areas sharing Water_waves.wav used to get one loop each, and
  // two loops of the same sample audible at once through separate HRTF panners
  // reads as a hall echo, not louder surf. updateAudio moves the single
  // anchor to the closest point across every polyline in the group.
  // Flags join the area pool as one-point emitters. They group by file like
  // everything else, so every flag on the map shares a single looping voice
  // anchored at whichever one is nearest — which is the same reason the
  // shorelines do it, and the reason five flags do not phase against each
  // other. `flag.ssc` supplies the near/far ramp the group already honours.
  const areaList = [...(cfg.areas || [])];
  const flags = cfg.flags;
  if (flags && flags.file && flags.positions?.length) {
    for (const point of flags.positions) {
      areaList.push({
        name: 'flag',
        file: flags.file,
        points: [point],
        volume: flags.volume ?? 1.0,
        nearDistance: flags.nearDistance ?? flags.minDistance ?? 4.0,
        farDistance: flags.farDistance ?? 15.0,
      });
    }
  }

  if (areaList.length > 0) {
    const groups = new Map();
    for (const area of areaList) {
      if (!area.file || !area.points || area.points.length === 0) continue;
      const key = area.file.toLowerCase();
      if (!groups.has(key)) groups.set(key, { file: area.file, areas: [] });
      groups.get(key).areas.push(area);
    }

    for (const group of groups.values()) {
      const buf = await getBuffer(group.file);
      if (gen !== soundsGeneration) return;
      if (!buf) continue;

      const first = group.areas[0];
      const anchor = new THREE.Object3D();
      anchor.position.set(first.points[0][0], first.points[0][1], first.points[0][2]);
      scene.add(anchor);

      const sound = new THREE.PositionalAudio(audioListener);
      sound.setBuffer(buf);
      sound.setLoop(true);
      sound.setRefDistance(first.nearDistance || 40.0);
      // The manual .ssc near/far ramp in updateAudio owns distance volume
      // exclusively; rolloff 0 disables the panner's own inverse-distance
      // curve so the two attenuations don't multiply. setMaxDistance is not
      // called — it only applies to the 'linear' distance model, so it was
      // inert here anyway. HRTF panning is kept for direction.
      sound.setRolloffFactor(0);
      anchor.add(sound);

      activeAreaAudios.push({ anchor, sound, areas: group.areas });
      try { sound.play(); } catch (_) {}
    }
  }
  updateAudio();
}

// --- engine audio -----------------------------------------------------------
//
// The flown vehicle's own engine, played from the `.ssc` the extractor shipped
// in `scene.json`. `engine-audio.js` owns the graph and the curve evaluation;
// everything here is the seam — which node the voices hang off, what the
// control channels are worth this frame, and the lifecycle rules the ambient
// path already established (nothing starts inside an async gap, nothing
// survives a map change).

let engineAudio = null;
// Bumped by disposeEngineAudio, for the same reason soundsGeneration exists: an
// in-flight load must be able to tell that it has been superseded, or a rapid
// pilot toggle leaks a running engine that dispose can no longer reach.
let engineGeneration = 0;
let engineNode = null;
let currentDir = '';
// `Acceleration` is a control source in its own right — the Corsair's right
// cockpit whine pitches off it — and the flight model publishes velocity, not
// acceleration, so it is differenced here. Raw frame differences are mostly
// numerical noise, hence the one-pole smoothing.
const enginePrevVelocity = new THREE.Vector3();
const engineScratch = new THREE.Vector3();
let engineAccel = 0;
const ACCEL_SMOOTHING = 5;          // 1/s
const engineWorldPos = new THREE.Vector3();
const engineWorldQuat = new THREE.Quaternion();
const weaponWorldPos = new THREE.Vector3();
const weaponWorldQuat = new THREE.Quaternion();
// The longest shut-down one-shot in the vanilla set is willyenginestp at
// 1.94 s; the loops are gone 0.2 s in.
const ENGINE_RELEASE_MS = 2400;

// The guns, from the same `.ssc` machinery as the engine.
//
// `CorsairMG.ssc` is a six-patch weapon script whose first five patches are
// `silence.wav`; the extractor ships only the one that is not, the Fire Loop,
// and its four layers are two pairs that hand over on distance — CAMG1/CAMG2
// up to 4 m, CAMGdist/BFMGdist from 4 m out to 250. So the cockpit hears the
// gun and a chase camera hears the same gun from outside, and neither costs
// this page a decision: the ramps are in the data and `EngineAudio` already
// evaluates them.
//
// The loops run from the moment the patch is built and are muted by gain
// alone, which is the one-voice-per-role rule the hall-echo postmortem left
// behind (`map-sounds.md`). Starting and stopping a buffer source per trigger
// pull would restart its loop phase against the other layer every time and
// comb; holding it and moving the bus cannot. It also means a held Space adds
// no voices at all, which is the thing worth asserting headlessly.
let weaponAudio = [];

function disposeEngineAudio() {
  engineGeneration++;
  if (engineAudio) {
    engineAudio.dispose();
    engineAudio = null;
  }
  for (const weapon of weaponAudio) weapon.audio.dispose();
  weaponAudio = [];
  engineNode = null;
  engineAccel = 0;
  enginePrevVelocity.set(0, 0, 0);
}

async function setupEngineAudio() {
  disposeEngineAudio();
  const gen = engineGeneration;
  const vehicle = aircraft || car;
  if (!vehicle || AUDIO_OFF) return;
  const template = vehicle.node.userData?.control || vehicle.node.name;
  const spec = findEngineSpec(extras, template);
  if (!spec) {
    // A stale scene.json, a vehicle with no Engine sound script and an
    // unpublished wav are otherwise indistinguishable — which is exactly the
    // failure that made every map but Wake look silent last time.
    console.info(`no engine sound for ${template}: re-extract this map if it `
                 + 'predates the vehicle-sound pipeline');
    return;
  }
  // The voices hang off the `Engine` node the script is bound to, not the
  // vehicle origin: on a Corsair that is the propeller hub at z -4.15, four
  // metres ahead of the pilot's ear, which is where the noise actually is.
  engineNode = vehicle.node.getObjectByName(spec.engine) || vehicle.node;
  const dir = currentDir;
  const built = await loadEngineAudio(spec, {
    listener: ensureListener(),
    getBuffer: (relPath) => soundBuffer(dir, relPath),
  });
  if (!built) return;
  // Decoding took several awaits; anything could have happened. Nothing has
  // been started yet, so a superseded load is thrown away silently.
  if (gen !== engineGeneration || (!aircraft && !car)) {
    built.dispose();
    return;
  }
  engineAudio = built;
  engineAudio.setMaster(masterVolume());
  engineAudio.start();
  await setupWeaponAudio(gen, dir, template);
}

/**
 * Build and start every gun patch this vehicle carries.
 *
 * Shares the engine's generation counter rather than keeping its own: the guns
 * are only ever set up and torn down with the vehicle they are bolted to, so a
 * second counter would be two names for one fact.
 */
async function setupWeaponAudio(gen, dir, template) {
  const specs = findWeaponSpecs(extras, template);
  if (!specs.length) return;
  const built = [];
  for (const spec of specs) {
    const audio = await loadEngineAudio(spec, {
      listener: ensureListener(),
      getBuffer: (relPath) => soundBuffer(dir, relPath),
      headroom: WEAPON_HEADROOM,
    });
    if (audio) built.push({ spec, audio, node: null });
  }
  // Decoding took several awaits. Nothing has been started, so a superseded
  // load is dropped without ever having made a sound.
  const vehicle = aircraft || car;
  if (gen !== engineGeneration || !vehicle) {
    for (const weapon of built) weapon.audio.dispose();
    return;
  }
  for (const weapon of built) {
    // The voices belong on the gun, not the vehicle origin: a Corsair's guns
    // are 2.2 m out each wing, and the panner is what puts the rattle there.
    weapon.node = vehicle.node.getObjectByName(weapon.spec.fireArms)
      || vehicle.node;
    weapon.audio.setMaster(0);   // silent until the trigger is pulled
    weapon.audio.start();
  }
  weaponAudio = built;
}

/**
 * Stop the engine the way the script expects: release, then tear down.
 *
 * `trigger Release` layers (the shut-down rattle) only play on release, and
 * every loop carries a `Volume <- TimeRelease` fade, so the graph has to stay
 * alive past the toggle. The generation guard is what stops a re-enable inside
 * the tail from being killed by the pending teardown.
 */
function stopEngineAudio() {
  if (!engineAudio) return;
  engineAudio.release();
  const gen = engineGeneration;
  setTimeout(() => {
    if (gen === engineGeneration) disposeEngineAudio();
  }, ENGINE_RELEASE_MS);
}

function masterVolume() {
  return optSound.checked ? parseFloat(optSoundVol.value) : 0;
}

/** Everything the `.ssc` control sources are worth this frame. */
function engineControl(dt) {
  const state = (aircraft || car)?.state;
  if (engineNode) {
    engineNode.getWorldPosition(engineWorldPos);
    engineNode.getWorldQuaternion(engineWorldQuat);
  }
  let speed = 0;
  let diveAngle = 0;
  if (state) {
    speed = state.airspeed || state.velocity.length();
    if (dt > 0) {
      const a = engineScratch.copy(state.velocity).sub(enginePrevVelocity).length() / dt;
      engineAccel += (a - engineAccel) * Math.min(1, dt * ACCEL_SMOOTHING);
      enginePrevVelocity.copy(state.velocity);
    }
    // `Engine::DiveAngle` is fed by the engine object and the vanilla ramps
    // span 0.2..1, so it is read here as the sine of the flight path's descent
    // angle — 1 straight down, 0.2 about 12 degrees nose-down, which is where
    // the dive scream starts to come in. Inferred, not read out of the data.
    if (speed > 1) diveAngle = Math.max(0, -state.velocity.y / speed);
  }
  return {
    dt,
    // The already-spooled engine value, NOT the stick. Aircraft chase the
    // pedal at Physics.con's slew rate; cars write gearbox revs (with a
    // stationary pedal floor); tanks write the feedbackLoop load reading.
    // Land `.ssc` scripts read the same value as controlSource Default.
    rpm: state ? state.throttle : 0,
    speed,
    acceleration: engineAccel,
    diveAngle,
    position: engineWorldPos,
    quaternion: engineWorldQuat,
    listenerPosition: camera.position,
  };
}

// Sitting in a vehicle, its engine is essentially all you can hear — the map's
// wind and surf do not compete with a radial a metre in front of your knees.
// Ducking the ambience is how to get there: the engine bus is already pinned at
// BUS_HEADROOM because its layers sum well past unity, so raising it would clip
// rather than get louder. Eased rather than switched, or entering and leaving
// the cockpit pops.
const AMBIENT_DUCK = 0.12;
const AMBIENT_DUCK_TAU = 0.4;
let ambientDuck = 1;

function updateAudio(dt = 0) {
  const master = masterVolume();
  const duckTarget = (optPilot.checked && (aircraft || car)) ? AMBIENT_DUCK : 1;
  ambientDuck += (duckTarget - ambientDuck)
    * (dt > 0 ? Math.min(1, dt / AMBIENT_DUCK_TAU) : 1);
  if (engineAudio) {
    engineAudio.setMaster(master);
    engineAudio.update(engineControl(dt));
  }
  for (const weapon of weaponAudio) {
    // The trigger comes from the gun runtime rather than the key, so a weapon
    // that has run its magazine dry or is not the seat's gun stays quiet for
    // the same reason it stops drawing tracers.
    const group = vehicleGuns.find(g => g.node.name === weapon.spec.fireArms);
    weapon.audio.setMaster(group?.firing ? master : 0);
    if (weapon.node) {
      weapon.node.getWorldPosition(weaponWorldPos);
      weapon.node.getWorldQuaternion(weaponWorldQuat);
    }
    // No control channel in a weapon patch reads anything but Distance and
    // Default, both of which the module derives itself, so the gun needs none
    // of the engine's rpm/speed/dive plumbing.
    weapon.audio.update({
      dt,
      position: weaponWorldPos,
      quaternion: weaponWorldQuat,
      listenerPosition: camera.position,
    });
  }
  if (handFireBus) {
    // The hand-shot bus tracks the master like the engine bus does, and is
    // deliberately not ducked: the duck exists so a cockpit engine drowns the
    // surf, and the weapon at your own shoulder is the one thing louder.
    const target = master * WEAPON_HEADROOM;
    if (Math.abs(handFireBus.gain.value - target) > 1e-4) {
      handFireBus.gain.setTargetAtTime(
        target, audioListener.context.currentTime, 0.05);
    }
  }
  if (ambientAudio) {
    const base = extras.sounds?.ambient?.volume ?? 0.6;
    ambientAudio.setVolume(base * master * ambientDuck);
  }

  if (activeAreaAudios.length === 0) return;

  const camPos = camera.position;
  for (const item of activeAreaAudios) {
    // Closest point to the camera across every polyline in the group; the
    // area that produced it supplies the near/far ramp and base volume.
    let bestArea = item.areas[0];
    let bx = bestArea.points[0][0], by = bestArea.points[0][1], bz = bestArea.points[0][2];
    let minD2 = Infinity;

    for (const area of item.areas) {
      const pts = area.points;
      if (pts.length === 1) {
        const dist2 = (camPos.x - pts[0][0]) ** 2 + (camPos.y - pts[0][1]) ** 2 + (camPos.z - pts[0][2]) ** 2;
        if (dist2 < minD2) {
          minD2 = dist2;
          bx = pts[0][0]; by = pts[0][1]; bz = pts[0][2];
          bestArea = area;
        }
        continue;
      }
      for (let i = 0; i < pts.length - 1; i++) {
        const p1 = pts[i];
        const p2 = pts[i + 1];
        const dx = p2[0] - p1[0];
        const dy = p2[1] - p1[1];
        const dz = p2[2] - p1[2];
        const len2 = dx * dx + dy * dy + dz * dz;
        let t = len2 > 0 ? ((camPos.x - p1[0]) * dx + (camPos.y - p1[1]) * dy + (camPos.z - p1[2]) * dz) / len2 : 0;
        if (t < 0) t = 0;
        else if (t > 1) t = 1;
        const qx = p1[0] + t * dx;
        const qy = p1[1] + t * dy;
        const qz = p1[2] + t * dz;
        const dist2 = (camPos.x - qx) ** 2 + (camPos.y - qy) ** 2 + (camPos.z - qz) ** 2;
        if (dist2 < minD2) {
          minD2 = dist2;
          bx = qx; by = qy; bz = qz;
          bestArea = area;
        }
      }
    }

    item.anchor.position.set(bx, by, bz);

    const dist = Math.sqrt(minD2);
    const near = bestArea.nearDistance || 40.0;
    const far = bestArea.farDistance || 80.0;
    let ramp = 0.0;
    if (dist <= near) {
      ramp = 1.0;
    } else if (dist < far) {
      const denom = Math.max(far - near, 0.001);
      ramp = 1.0 - (dist - near) / denom;
    }
    item.sound.setVolume((bestArea.volume ?? 0.6) * ramp * master * ambientDuck);
  }
}

function applyLighting() {
  const light = extras.lighting;
  if (!light) {
    hemi.color.set(0xe8dcc0);
    hemi.groundColor.set(0x5a4a32);
    hemi.intensity = 1.35;
    sun.color.set(0xfff1d0);
    sun.intensity = 2.4;
    return;
  }
  // renderer.diffuseColor is the sun's tint; keep overall exposure by
  // normalising it and carrying the magnitude into intensity.
  const diffuse = light.diffuse || [0.5, 0.5, 0.5];
  const peak = Math.max(...diffuse, 0.01);
  const tint = diffuse.map(c => c / peak);
  sun.color.setRGB(tint[0], tint[1], tint[2], THREE.SRGBColorSpace);
  sun.intensity = 2.4 * Math.min(1.4, peak / 0.5);
  // The engine has no sky-dome light: its only ambient terms are
  // renderer.ambientColor / globalAmbientColor, and neither is ever blue.
  // Tinting the hemisphere with the raw fog colour injected atmosphere blue
  // into the shading on marine maps - on Wake (fog 0.71/0.74/0.79 against sun
  // 1/.95/.9) the two cancelled to a dead-grey total and every vehicle picked
  // up a cool cast the game never shows. Keep the fog's LUMINANCE as the size
  // of the ambient bounce, but give it the sun's hue so the hemisphere can
  // never fight the level's declared light colour.
  const fog = extras.fogColor || [0.7, 0.7, 0.7];
  const atmos = 0.2126 * fog[0] + 0.7152 * fog[1] + 0.0722 * fog[2];
  hemi.color.setRGB(atmos * tint[0], atmos * tint[1], atmos * tint[2],
                    THREE.SRGBColorSpace);
  const ground = light.ambient || [0.2, 0.2, 0.2];
  hemi.groundColor.setRGB(
    Math.min(1, ground[0] * 2.5), Math.min(1, ground[1] * 2.5),
    Math.min(1, ground[2] * 2.5), THREE.SRGBColorSpace);
  hemi.intensity = 1.15;
}

function drawDistance() {
  return extras.drawDistance || DEFAULT_DRAW;
}

function applyFar() {
  const world = extras.worldSize || 2048;
  const draw = drawDistance();
  // The engine's far plane IS the view distance: with fog saturating there,
  // the world ends in a completed haze wall that meets the sky painting.
  // Drawing past it (the old draw*1.6 with a 900 m floor) rasterised
  // fog-saturated terrain as crisp silhouettes against the paler sky band —
  // the "distant mountain ridge" the game never shows. Extend only to a
  // declared fogEnd beyond the view distance (Gazala: fog 500-850 vs VD 500)
  // so the wall always completes before the clip; 1.05 keeps the last
  // fog-saturated metres from z-fighting the plane.
  camera.far = optEntire.checked
    ? Math.max(4000, world * 1.5)
    : Math.max(draw, extras.fogEnd || 0) * 1.05;
  camera.updateProjectionMatrix();
}

function applyFog() {
  const color = extras.fogColor || [0.8, 0.72, 0.53];
  const draw = drawDistance();
  let start, end;
  if (optGameFog.checked) {
    // Nullish, not falsy: Berlin authors `fogstart 0` — fog from the eye
    // out — and a || default replaced that 0 with 150 against its declared
    // end of 100, which inverts the ramp and paints the whole world as one
    // fog wall.
    start = extras.fogStart ?? 150;
    end = extras.fogEnd ?? 300;
  } else if (!optEntire.checked) {
    start = draw * 0.55;
    end = draw;
  } else {
    start = 250;
    end = Math.max(1400, extras.worldSize || 2000);
  }
  // Declared fog colours are display values from a pre-colour-managed engine.
  const fogColor = new THREE.Color().setRGB(
    color[0], color[1], color[2], THREE.SRGBColorSpace);
  scene.fog = new THREE.Fog(fogColor, start, end);
  // The near pass's scene shares the object, so the arms' materials compile
  // against the same fog the world does — here, before the rig's warm-up
  // compile, and not per frame, or that compile would be for a fogless
  // program the first drawn frame then replaces.
  vmScene.fog = scene.fog;
  scene.background = skybox || fogColor;
  syncWaterFog();
}

function isCollision(obj) {
  return Boolean(obj.userData?.collision) || /collision/i.test(obj.name || '');
}

function kindOf(obj) {
  return obj.userData?.kind || '';
}

const cullBonePos = new THREE.Vector3();
function tagCull(obj) {
  // A skinned flag cloth sits at the scene root carrying no transform of its
  // own — glTF requires that of any skinned mesh — so its bind-pose geometry
  // boxes around the world origin and a distance test would hide it
  // everywhere except there. Its real position is wherever its joints are.
  if (obj.isSkinnedMesh && obj.skeleton && obj.skeleton.bones.length) {
    const box = new THREE.Box3();
    for (const bone of obj.skeleton.bones) {
      box.expandByPoint(bone.getWorldPosition(cullBonePos));
    }
    const sphere = new THREE.Sphere();
    box.getBoundingSphere(sphere);
    obj.userData.cullCenter = sphere.center.clone();
    // The joints are a lattice inside the cloth, not its extent; pad for it.
    obj.userData.cullRadius = sphere.radius + 2;
    return;
  }
  const box = new THREE.Box3().setFromObject(obj);
  const sphere = new THREE.Sphere();
  box.getBoundingSphere(sphere);
  obj.userData.cullCenter = sphere.center.clone();
  obj.userData.cullRadius = sphere.radius;
}

function indexScene(root) {
  cull.length = 0;
  spawnersRoot = null;
  root.traverse(obj => {
    if (isCollision(obj)) obj.visible = false;
  });
  root.updateMatrixWorld(true);
  root.traverse(obj => {
    if (obj === root) return;
    if (kindOf(obj) === 'spawners' || obj.name === 'spawners') {
      spawnersRoot = obj;
    }
  });
  for (const child of root.children) {
    if (child === spawnersRoot) {
      for (const vehicle of child.children) tagCull(vehicle);
      continue;
    }
    if (kindOf(child) === 'water') continue;
    tagCull(child);
    cull.push(child);
  }
  freezeStatics(root);
}

// --- static matrices --------------------------------------------------------
//
// `WebGLRenderer.render` opens with `scene.updateMatrixWorld()`, and in three
// r169 that walk recomposes and multiplies EVERY object's world matrix every
// frame: `updateMatrix()` on an auto-updating node flags it changed, and the
// `force` that sets cascades down the whole subtree whether or not anything
// under it moved. Over ~5,100 nodes, twice a frame, it was 18-21% of the
// frame's JS time (features/mesh-viewer-performance, rule 2). The level is
// mostly furniture — terrain tiles, buildings, palms, parked vehicles — that
// never moves once show() has placed it, so those subtrees leave the walk:
// their `updateMatrixWorld` is a no-op unless an ancestor genuinely forces
// it, and the nodes above them (`scene`, the level root, the spawners group)
// stop re-composing matrices they never change, so no force ever arrives.
//
// The contract: anything that moves a frozen node calls
// `updateMatrixWorld(true)` on it, or thaws it. A driven vehicle is thawed
// for the ride (setPilot) and frozen again where it is parked (leaveVehicle,
// setPilot(false)). `__matrixDrift()` under ?shots checks every world matrix
// against a fresh recompute, and the perf harness runs it after a minute of
// walking, firing and turning.
let frozenCount = 0;
// Vehicles a level clip animates while they are parked — the Hatsuzuki's
// radar dish turns under an `ambient` clip — never leave the walk, ride or
// no ride. Found by freezeStatics; `__matrixDrift` is what caught the dish
// standing still.
const neverFrozen = new WeakSet();
const staticUpdateMatrixWorld = function (force) {
  if (force === true) THREE.Object3D.prototype.updateMatrixWorld.call(this, force);
};
function freeze(obj) {
  obj.updateMatrixWorld(true);   // commit wherever it was last posed
  obj.updateMatrixWorld = staticUpdateMatrixWorld;
}
function thaw(obj) {
  if (Object.hasOwn(obj, 'updateMatrixWorld')) delete obj.updateMatrixWorld;
}
/** The spawner child that owns `node`: the vehicle itself, or the one a
 *  nested seat sits in. Null for a node outside the spawners group. */
function spawnerVehicleOf(node) {
  for (let n = node; n; n = n.parent) if (n.parent === spawnersRoot) return n;
  return null;
}
// The subtree a ride thaws and a parking freezes. A seat being driven is not
// under `spawners` any more: `Vehicle`'s constructor (flight.js; ground.js
// extends it) reparents the node onto the level root before setPilot gets to
// thaw it. Looked up through `spawners` alone, the driven vehicle was never
// thawed and never re-frozen: it kept the frozen `updateMatrixWorld` from
// freezeStatics, so everything `applyRig` poses after `applyTransform`'s
// forced update (propeller spin, control surfaces) was drawn a frame late,
// and the pose `reset()` + `applyRig()` leave on a vehicle setPilot(false)
// parks was never committed at all -- `__matrixDrift` read 1.43 on the parked
// Corsair's drawn propeller after one such exit (features/mesh-viewer-performance,
// rule 2). Once reparented, the node is its own vehicle root.
function vehicleRootOf(node) {
  return spawnerVehicleOf(node) ?? node;
}
function thawVehicle(node) {
  const vehicle = vehicleRootOf(node);
  if (vehicle) thaw(vehicle);
}
function freezeVehicle(node) {
  const vehicle = vehicleRootOf(node);
  if (vehicle && !neverFrozen.has(vehicle)) freeze(vehicle);
}
/** Take every level subtree that nothing animates out of the per-frame
 *  matrix walk. Runs once per level, after `root.updateMatrixWorld(true)`
 *  has composed everything where the extract put it. */
function freezeStatics(root) {
  // What moves: bones and skinned cloth (the flags), input-driven `rig`
  // parts, and any node an ambient clip targets, with its ancestors.
  const animated = new Set();
  for (const clip of levelClips) {
    for (const track of clip.tracks) {
      const { nodeName } = THREE.PropertyBinding.parseTrackName(track.name);
      const node = THREE.PropertyBinding.findNode(root, nodeName);
      for (let n = node; n && n !== root; n = n.parent) animated.add(n);
    }
  }
  const moves = obj => obj.isBone || obj.isSkinnedMesh
    || !!obj.userData?.rig || animated.has(obj);
  frozenCount = 0;
  root.matrixAutoUpdate = false;
  for (const child of root.children) {
    if (child === spawnersRoot) {
      child.matrixAutoUpdate = false;
      // Every parked vehicle, rigs and all: none of it moves until someone
      // climbs in, and setPilot thaws the one they climb into. Except the
      // ones a clip keeps moving while parked.
      for (const vehicle of child.children) {
        if (animated.has(vehicle)) { neverFrozen.add(vehicle); continue; }
        freeze(vehicle);
        frozenCount++;
      }
      continue;
    }
    let dynamic = false;
    child.traverse(obj => { if (moves(obj)) dynamic = true; });
    if (dynamic) continue;
    freeze(child);
    frozenCount++;
  }
}

function inRange(obj, cam, limit) {
  const c = obj.userData.cullCenter;
  const r = obj.userData.cullRadius || 0;
  if (!c) return true;
  const dx = c.x - cam.x, dy = c.y - cam.y, dz = c.z - cam.z;
  const reach = limit + r;
  return dx * dx + dy * dy + dz * dz <= reach * reach;
}

function applyVisibility() {
  const entire = optEntire.checked;
  const cam = camera.position;
  const limit = drawDistance();
  for (const obj of cull) obj.visible = entire || inRange(obj, cam, limit);
  if (!spawnersRoot) return;
  spawnersRoot.visible = optVehicles.checked;
  if (!optVehicles.checked) return;
  for (const vehicle of spawnersRoot.children) {
    vehicle.visible = entire || inRange(vehicle, cam, limit);
  }
}

// --- piloting ---------------------------------------------------------------
//
// The map scene already ships real vehicles at their spawn points, assembled by
// the same assembler the model browser uses and carrying a `rig` extra on every
// input-driven part, plus an empty `<Vehicle>Camera` node at the pilot's eye
// point. Piloting therefore adds no extraction: it drives what is already here.
//
// Control scheme is the game's own (`Settings/Default/Controls/Air.con`): the
// keyboard flies the aircraft and the mouse is a head, not a stick. W/S is
// throttle, A/D is rudder, the arrow keys are the stick — up/down pitch,
// left/right roll. Landing gear is deliberately not bound; in the real game it
// is automatic on altitude thresholds, which `Aircraft.integrate` reproduces.
//
// Freeing the mouse from the stick lets it do what the game's own hold-LShift
// free-look does: swivel the pilot's head inside a cockpit that is still flying
// straight, within the clamps the Corsair's camera declares.
//
// C cycles the view — `c_PIToggleCameraMode`, IDKey_C in the game's own control
// maps — through cockpit, chase, front and fly-by. `VehicleCamera` in flight.js
// owns all four and is explicit about which of them the data actually describes:
// the cockpit, and only the cockpit. Outside it the mouse orbits instead of
// swivelling, and fly-by ignores it entirely.

let aircraft = null;
// The driven land vehicle — `ground.js`'s half of the same seam. At most one
// of `aircraft`/`car` is ever non-null: one seat, one body, one view rig.
let car = null;
// The whole of whatever is currently occupied — `seats.js`'s survey of every
// seat, which seat is active, and (when that seat has one) its `TurretRig`.
// Set for *any* entered `PlayerControlObject`, including a plain `air`/
// `ground`/`tank` root: `aircraft`/`car` above still get built and driven
// exactly as before for those, so every reference to them elsewhere on this
// page keeps working unchanged; `occupancy` is what is new, and what a bare
// gun/seat root or a nested seat (a manned gun) runs on alone.
let occupancy = null;

// ---------------------------------------------------------------------------
// Vehicle damage: shoot a tank, watch it smoke, burn and explode.
//
// The simulation is `vehicle-damage.js`, which is framework-free and tested
// under node (`tests/test_vehicle_damage.py`). Everything here is the scene
// half: which placed object owns which Armor, where a tier's effect hangs, and
// what a wreck looks like.
//
// What the engine does and does not do, from `features/bf1942-engine-reference/`:
//
//   - **A collision costs nothing** (ledger HP-6). Driving a tank into a wall
//     or flying a plane into a hill does not touch hit points — only a
//     projectile damages anything. There is deliberately no crash-damage path
//     below; the engine has none to copy.
//   - **A living vehicle re-evaluates its tier every tick** (ARM-1), so this
//     polls rather than latching, and stops polling once the thing is dead.
// ---------------------------------------------------------------------------

const vehicleDamage = new VehicleDamageSet();
// owner id -> { node, anchors: Map<effectName, Object3D>, handles: [] }, the
// scene-side bookkeeping a tier change needs to undo.
const damageVisuals = new Map();

/**
 * Register every placed object that carries an `armor` extras block. Most of a
 * level has none — a palm and a sandbag have no Armor at all (ARM-3) — so this
 * is a handful of vehicles and stationary guns out of hundreds of objects.
 */
function registerDamageables(ownerRoots) {
  clearDamageVisuals();
  vehicleDamage.clear();
  for (let owner = 0; owner < ownerRoots.length; owner++) {
    const node = ownerRoots[owner];
    const extras = node?.userData?.armor;
    const vehicle = vehicleDamage.add(owner, extras, { name: node?.name || null });
    if (vehicle) damageVisuals.set(owner, { node, anchors: new Map(), handles: [] });
  }
}

/** Drop every running tier effect. Call on a level change. */
function clearDamageVisuals() {
  for (const visual of damageVisuals.values()) {
    for (const handle of visual.handles) handle.stop?.();
    visual.handles.length = 0;
    for (const anchor of visual.anchors.values()) anchor.parent?.remove(anchor);
    visual.anchors.clear();
  }
  damageVisuals.clear();
}

/**
 * An empty node at an `addArmorEffect` offset, parented to the vehicle so the
 * effect rides with it. `EffectPlayer.play`'s `attach` follows an object's world
 * transform and takes no local offset of its own, so the offset has to be a
 * node — which is also what the engine does with these vectors.
 */
function damageAnchor(visual, name, offset) {
  let anchor = visual.anchors.get(name);
  if (!anchor) {
    anchor = new THREE.Object3D();
    anchor.name = `damage:${name}`;
    visual.node.add(anchor);
    visual.anchors.set(name, anchor);
  }
  anchor.position.set(offset?.[0] || 0, offset?.[1] || 0, offset?.[2] || 0);
  anchor.updateMatrixWorld(true);
  return anchor;
}

/** Start the tier's bundles on this vehicle, having stopped whatever ran before. */
function showDamageTier(vehicle, tier) {
  const visual = damageVisuals.get(vehicle.owner);
  if (!visual) return;
  for (const handle of visual.handles) handle.stop?.();
  visual.handles.length = 0;
  if (!tier) return;
  for (const name of tier.names) {
    // Case is not a concern here even though it looks like one: a Sherman
    // authors `e_scrapmetal` and the bundle bakes as `e_ScrapMetal`, but
    // `EffectLibrary` keys on the lowercased name and `get` lowercases its
    // argument — the same case-insensitivity the console language itself has
    // (ledger HP-4, RFA-1).
    const entry = vehicle.effects.find(
      e => e.effect === name && e.hp === tier.threshold);
    const anchor = damageAnchor(visual, name, entry?.offset);
    const handle = effects.play(name, { attach: { object: anchor } });
    if (handle) visual.handles.push(handle);
  }
}

// How long a wreck lies there before it fades, and how long the fade takes.
//
// **Not engine numbers.** What removes a wreck in Refractor, and when, is one of
// the corpus's own open items — `subsystems/hitpoints-and-damage.md` lists the
// wreck lifetime as untraced, and a vanilla level's respawn timing lives in the
// spawner rather than the vehicle. These two are chosen to read right and are
// labelled so nobody mistakes them for findings.
const WRECK_LINGER = 6;   // seconds of wreck before the fade starts  [HOUSE RULE]
const WRECK_FADE = 2.5;   // seconds of fade                          [HOUSE RULE]

// Wreck glbs, by template name, shared across every vehicle of that type.
const wreckModels = new Map();

/**
 * The template name behind a placed node. GLTFLoader suffixes duplicate names,
 * so Wake's three Shermans arrive as `Sherman`, `Sherman_1` and `Sherman_2` and
 * all three want `Sherman.wreck.glb`.
 */
function templateNameOf(node) {
  return (node?.name || '').replace(/_\d+$/, '');
}

/**
 * A vehicle just died: hide the live model, put its wreck in the same place, and
 * start the linger-then-fade.
 *
 * The wreck is a glb of its own (`models/<Template>.wreck.glb`) — the same file
 * `replay.js` fetches — not an alternative inside the level scene, which ships
 * only the `complex` configuration. Loading is async and death is not, so the
 * live model is hidden immediately and the wreck appears when it lands; a
 * vehicle with no wreck exported still disappears rather than sitting there
 * pristine.
 */
async function wreckVehicle(vehicle) {
  const visual = damageVisuals.get(vehicle.owner);
  if (!visual?.node || visual.wrecked) return;
  visual.wrecked = true;
  visual.wreckAge = 0;
  // Hide everything that was the intact vehicle, keeping the damage anchors so
  // the death effects keep playing from where they were.
  visual.hidden = [];
  for (const child of visual.node.children) {
    if (child.name?.startsWith('damage:')) continue;
    if (child.visible) { child.visible = false; visual.hidden.push(child); }
  }
  const template = templateNameOf(visual.node);
  try {
    if (!wreckModels.has(template)) {
      wreckModels.set(template, loader.loadAsync(
        `${MODELS_BASE}/${template}.wreck.glb${bust()}`).then(g => g.scene, () => null));
    }
    const scene = await wreckModels.get(template);
    // The vehicle may have been cleared (level change) while the glb was in
    // flight, and `damageVisuals` is rebuilt per level — so re-check.
    if (!scene || damageVisuals.get(vehicle.owner) !== visual) return;
    const wreck = scene.clone(true);
    wreck.name = `wreck:${template}`;
    // `Object3D.clone` shares materials with the source, so every wreck of a
    // type would fade together — and the source is cached for the next one.
    // Own them here, once, rather than trying to un-share them mid-fade.
    wreck.traverse(obj => {
      if (!obj.material) return;
      obj.material = Array.isArray(obj.material)
        ? obj.material.map(m => m.clone()) : obj.material.clone();
    });
    bindDynamicShading(wreck);
    visual.node.add(wreck);
    visual.wreck = wreck;
  } catch {
    // No wreck for this template: the hidden live model is the whole effect.
  }
}

/**
 * Advance the linger-and-fade of every wreck, and remove one once it has gone.
 * Called from `stepVehicleDamage`, so it runs on the same clock as the burn.
 */
function stepWrecks(dt) {
  for (const [owner, visual] of damageVisuals) {
    if (!visual.wrecked || visual.removed) continue;
    visual.wreckAge += dt;
    const into = visual.wreckAge - WRECK_LINGER;
    if (into <= 0) continue;
    const opacity = Math.max(0, 1 - into / WRECK_FADE);
    if (visual.wreck) fadeNode(visual.wreck, opacity);
    if (opacity > 0) continue;
    // Gone: drop the wreck, stop the death effects, and leave the node empty.
    visual.removed = true;
    if (visual.wreck) { visual.node.remove(visual.wreck); visual.wreck = null; }
    for (const handle of visual.handles) handle.stop?.();
    visual.handles.length = 0;
  }
}

/** Fade a subtree. Its materials are this wreck's own — see `wreckVehicle`. */
function fadeNode(root, opacity) {
  root.traverse(obj => {
    if (!obj.material) return;
    const materials = Array.isArray(obj.material) ? obj.material : [obj.material];
    for (const material of materials) {
      material.transparent = true;
      material.opacity = opacity;
      // An opaque wreck still writes depth; a fading one must not, or it punches
      // a hole in whatever is behind it.
      material.depthWrite = opacity > 0.99;
    }
  });
}

/**
 * The Armor of the vehicle the player is in, or null. Matched by scene node
 * rather than by seat: hit points live on the root object and are shared by
 * every seat (VHUD-8, R2-31), so the driver and the hull gunner read the same
 * number.
 */
function occupiedVehicleDamage() {
  if (!occupancy?.root) return null;
  for (const [owner, visual] of damageVisuals) {
    if (visual.node === occupancy.root) return vehicleDamage.get(owner);
  }
  return null;
}

// The HP last pushed into the HUD, so a moving bar costs one compare per frame
// rather than a full `feedVehicleHud()`.
let fedVehicleHp = null;

/** Step every damageable thing and reconcile what it is drawing. */
function stepVehicleDamage(dt) {
  if (!vehicleDamage.size) return;
  for (const change of vehicleDamage.update(dt)) {
    if (change.changed) showDamageTier(change.vehicle, change.tier);
    if (change.died) wreckVehicle(change.vehicle);
  }
  stepWrecks(dt);
  // `feedVehicleHud` runs on entry and on a seat switch, not per tick for a
  // driver — so without this the bar of the tank you are sitting in would stay
  // where it was when you climbed in while the thing burned down under you.
  const live = occupiedVehicleDamage();
  const hp = live ? live.hitPoints : null;
  if (hp !== fedVehicleHp) {
    fedVehicleHp = hp;
    if (live) feedVehicleHud();
  }
}

/** A round landed. Apply it, and reconcile the tier on the same frame. */
function applyVehicleHit(record) {
  const landed = vehicleDamage.applyHit(record);
  if (!landed) return;
  // Straight to `update(0)` rather than waiting for the next frame: a killing
  // shot should explode on the frame it lands, not one frame later. A zero dt
  // cannot advance the burn accumulator, so this only re-picks the tier.
  const result = landed.vehicle.update(0);
  if (result.changed) showDamageTier(landed.vehicle, result.tier);
  if (result.died) wreckVehicle(landed.vehicle);
}
const AIR_KEYS = new Set([
  'KeyW', 'KeyA', 'KeyS', 'KeyD', 'KeyR', 'Space',
  'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight',
]);

/**
 * Whether `node`'s root drivetrain is one `pickVehicle`'s checkbox-triggered
 * auto-possess can use: `air`/`ground`, else null. `seats.js`'s own
 * `classifyRoot` (GUN-10, verify-r6.md) sees the fuller picture — `tank`, a
 * manned `gun`, or a bare `seat` — and drives every one of those through the
 * `E`-key/EntryPoint path (`enterVehicle`/`collectEntryPoints` below); this
 * narrower wrapper only exists because the checkbox has never known how to
 * auto-pick anything but a plane or a car, and a Sherman parked with nobody
 * near it is not what a bare "start piloting" click should mean.
 */
function classifyVehicle(node) {
  const kind = classifyRoot(node);
  return kind === 'air' || kind === 'ground' ? kind : null;
}

/**
 * The seat the pilot checkbox takes when nobody points at one: the first
 * aircraft the scene spawns, else the first drivable car. The name trio at
 * the end is for scenes extracted before `extras.physics` existed, whose
 * engines cannot say what they are.
 */
function pickVehicle() {
  const found = findVehicles(currentRoot);
  return found.find(node => classifyVehicle(node) === 'air')
    || found.find(node => classifyVehicle(node) === 'ground')
    || findVehicle(currentRoot, 'Corsair')
    || findVehicle(currentRoot, 'Spitfire')
    || findVehicle(currentRoot, 'Zero');
}

// --- the guns ---------------------------------------------------------------
//
// Same runtime as the model browser (`gunfire.js`), pointed at the flown
// vehicle instead of a model on a turntable. The Corsair's `CorsairGuns` is a
// two-barrel FireArms at 12 rounds a second, 400 m/s, tracer every third round,
// and all of that is read out of the scene — nothing about the Corsair appears
// below.
//
// Three things differ from firing a parked model, and all three are options:
//
//   - Rounds are parented to `scene`, never to the aircraft, or a tracer would
//     hang off the wing at a fixed distance for its whole life. That is the
//     module's own contract, so it costs nothing here beyond passing the
//     world in.
//   - `platformVelocity` adds the airframe's velocity to the muzzle's. Fired
//     level it barely shows against 400 m/s; fired in a dive or a hard yaw the
//     stream visibly leans away from the nose, which is the tell that the
//     rounds are really in the world and not glued to the gun.
//     Not modelled: the muzzle's own `omega x r` from the roll rate. At the
//     Corsair's 200 deg/s and a 2.23 m semi-span that is 7.8 m/s across a
//     400 m/s round — 1.1 degrees, the same order as the gun convergence the
//     muzzle nodes already carry, and it needs the body-rate sign convention
//     to be right to be worth having.
//   - Real muzzle velocity (`speedScale: 1`) and the round's declared
//     `timeToLive`. The browser slows fast rounds to 15% because a 400 m/s
//     round crosses a parked model between two frames; from a cockpit moving
//     at 50 m/s the round's motion *relative to you* is the picture, and it
//     reads as the dashed stream the game draws. A `Tracer_Projectile` then
//     lives its declared 3 s, which at 400 m/s is 1200 m — past Wake's 500 m
//     draw distance, so in practice the stream fades into the fog and expires
//     unseen, exactly as it does in game.
//   - `viewportHeight` is the tracer width floor's denominator. Read off the
//     drawing buffer rather than the window because `__renderOnce` resizes it
//     to whatever a headless check asked for, and a floor measured against the
//     wrong height is a streak that grows or vanishes only under test.

    ? occupancy.activeFireArmsNodes().flatMap(node => guns.collect(node, {

      maxRange: 1500,

      tracerLength: 'data',

// --- what the rounds run into ----------------------------------------------
//
// Gaps C-1, C-5, C-6 and M-2 of `parity-audit/projectiles-collision.md`, all
// behind one object. `collision.js` owns the arithmetic; this is the wiring.
//
// Three inputs, all already shipped and none of them new:
//   - the terrain tiles in the scene, snapped back onto the level's own height
//     lattice (4 m on every vanilla map);
//   - `waterLevel` out of `scene.json`, one horizontal plane;
//   - every node the assembler tagged `extras.collision`, which the map export
//     now carries (Wake 20,911 triangles, Bocage 21,661) and which `indexScene`
//     already hides from the render pass.
//
// Plus two tables that decide what a hit *means* rather than where it is:
// `terrain/materials.png` (one byte per heightmap sample, straight out of
// `Materialmap.raw`) and `_shared/damage.json`'s `effects` matrix.
let terrainMaterials = null;

async function loadDamageTables(dir) {
  const ref = extras?.damage;

      .then(r => r.ok ? r.json() : null);

/**
 * `terrain/materials.png` back into the byte array it was written from.

 * legible to a human; only red is read here, and nothing is filtered — a
 * bilinear read between id 10 (dry sand) and id 12 (rock) would invent id 11.

      .then(r => r.ok ? r.blob() : null);

// Rule 6's warm-up (features/mesh-viewer-performance): nothing play can draw
// is linked, uploaded or first used by the frame that draws it. Three links
// a material's program on the first frame that draws it, uploads a texture on
// the first frame that binds it and builds a skinned mesh's bone texture on
// its first draw, and the link blocks that frame on the driver: on this Iris
// Xe's system GL the perf harness watched one block for 8-9.5 s and take the
// WebGL context with it.
//
// A subtree is compiled against the scene and camera of the pass that draws
// it — the canvas (no render target), that scene's fog and lights: all a
// program key reads that the material and the object do not — then every
// texture its materials can bind goes to the GPU, and every program the
// compile linked has its first use taken (`WebGLProgram.getUniforms`: the log
// and uniform queries three otherwise runs inside the first draw, and the
// point where a link still in flight would block). `compile` walks hidden
// nodes too, so a pooled particle or a parked gun's flash is warmed like a
// wall.

 *  here rather than on its first draw (`WebGLRenderer.setProgram`). */

  root.traverse(obj => {

      if (!obj.skeleton.boneTexture) obj.skeleton.computeBoneTexture();
      uploadTexture(obj.skeleton.boneTexture);
    }
    for (const m of [obj.material].flat()) {
      if (!m) continue;
      for (const value of Object.values(m)) uploadTexture(value);
      for (const uniform of Object.values(m.uniforms ?? {})) uploadTexture(uniform?.value);

      for (const uniform of Object.values(compiled ?? {})) uploadTexture(uniform?.value);

      vehicle.autoFirstPerson = false;

    // never through the driver's seat first.

    warmSubtree(occupancy.root);

    if (aircraft || car) {
      // Ticking the box is the user gesture the autoplay policy wants; the
      // same call on a map load is not one, and resume() there fails
      // harmlessly until the fly gate is clicked. A bare gun/seat root has
      // no engine to loop audio for at all.
      ensureAudioContext();
      setupEngineAudio();

    // Back into three's matrix walk for the ride (freezeStatics) — the whole
    // vehicle, not just the seat, since a nested seat's own turret is a
    // descendant of the same frozen root.
    thawVehicle(occupancy.root);
    feedVehicleHud();

  if (!on && occupancy) {
    if (aircraft || car) {
      const vehicle = aircraft || car;
      stopEngineAudio();
      releaseGuns();
      vehicle.reset();

      // no longer does. Vacating the seat has to put the fuselage back

      // tub.
      view.setMode('cockpit');
      vehicle.setFirstPerson(false);
      vehicle.applyTransform();
      vehicle.applyRig();
    } else {
      // Splices `mannedGuns` out of `guns.groups` too (see `leaveManned`'s
      // own comment on why a bare `setFiring(false)` loop is not enough).
      releaseGuns();
    }
    freezeVehicle(occupancy.root);   // parked at its spawn: furniture again
    clearVehicleHud();
    occupancy = null;
  }

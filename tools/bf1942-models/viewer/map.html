 *  method table beside `toggleGamePause` and `ticketRatio`), and it does what
 *  it does there: leaves the battle for the menu. */
gameConsole.register({
  object: 'game', method: 'disconnect',
  minArgs: 0, maxArgs: 0, argTypes: [],
  run: () => { location.assign(MENU_URL); },
});

/**
 * The four mouse-sensitivity words, which are the engine's own: they are what
 * `Settings/Default/Controls/*.con` calls to set the shipped defaults, and
 * they are in the retail client's `game` object's method table
 * (`setInfMouseSensitivity`'s registrar `FUN_006bba90`, name string
 * `0x00920abc`; body at vtable `+0x48` = `0x006bbbe0` -> `0x006c57f0` ->
 * `ControlSettings::setSensitivity` `0x006eb1a0`, a bare `[this+0xc] = v`).
 *
 * One float argument, 0..1 like the menu slider, and read-back with no
 * argument. What the number buys is `5 x s + 0.1` as the mouse axis scale
 * (`applyMouseSensitivity` `0x006c55f0`), so 0.25 is 1.35 and 0.75 is 3.85.
 *
 * `game.setCommonMouseSensitivity` is registered for completeness and is
 * genuinely inert here: the Common profile belongs to
 * `defaultGameControlMap`, which binds `c_GIMouseLookX/Y` — the menu and map
 * cursor, not a player axis — and this page has no surface that reads it.
 */
const MOUSE_SENSITIVITY_WORDS = {
  setCommonMouseSensitivity: 'common',
  setInfMouseSensitivity: 'infantry',
  setLandSeaMouseSensitivity: 'landSea',
  setAirMouseSensitivity: 'air',
};
for (const [method, profile] of Object.entries(MOUSE_SENSITIVITY_WORDS)) {
  gameConsole.register({
    object: 'game', method,
    minArgs: 0, maxArgs: 1, argTypes: ['float'], returns: 'float',
    run: args => (args.length
      ? mouseInput.setSensitivity(profile, args[0])
      : mouseInput.sensitivityFor(profile)),
  });
}

function setConsoleOpen(on) {
  if (!gameConsole.setOpen(on)) return;
  consoleCanvas.hidden = !gameConsole.open;
  if (gameConsole.open) {
    // Whatever was held when the console came up must not still be held
    // under it: the engine stops feeding `PlayerInput` entirely while the
    // flag is set, so a key down at that moment never repeats.
    keys.clear();
    triggerHeld = false;
    seatFire = false;
    seatAltFire = false;
    aimHeld = false;
    if (!consoleFont) {
      // `Font/BF1942.font` out of this mod's own Font.rfa chain where it has
      // one (five of the installed mods do) and vanilla's otherwise.
      loadConsoleFont(hudPaths.consoleFont()).then(f => {
        consoleFont = f;
        consolePainted = -1;
      });
    }
  }
  consolePainted = -1;
}

function paintGameConsole(stageW, stageH) {
  if (!gameConsole.open || !stageW || !stageH) return;
  const size = `${stageW}x${stageH}`;
  if (gameConsole.version === consolePainted && size === consoleSize) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const cw = Math.round(stageW * dpr);
  const ch = Math.round(stageH * dpr);
  if (consoleCanvas.width !== cw || consoleCanvas.height !== ch) {
    consoleCanvas.width = cw;
    consoleCanvas.height = ch;
  }
  const ctx = consoleCanvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;   // the atlas is point art, like the HUD
  // The capture's pitch is 22 px on a 1124 px screen where the installed
  // font's own Height is 20; the drawer's rule is `lineHeight + 1` per line
  // (0x00465063), so the text object reports one more than the header does.
  const pitch = (consoleFont ? consoleFont.height : 20) + 2;
  paintConsole(ctx, gameConsole, { width: stageW, height: stageH,
                                   font: consoleFont, pitch });
  consolePainted = gameConsole.version;
  consoleSize = size;
}

/** `OldConsole::output` from the page's side: whatever the viewer wants in
 *  the scrollback, the way the client writes its own loader chatter into
 *  `io::mainConsole` (the string at 0x008d6168, logged all through boot).
 *  It is also what gives the band its height — `getLines(20)` returns what
 *  the scrollback has, so an unwritten console opens as a thin strip. */
function logToConsole(text) {
  gameConsole.output(text);
  consolePainted = -1;
}

/** Everything the console knows, for headless checks and for later streams:
 *  the same object `register` hangs commands on. */
window.__console = gameConsole;
window.__showDev = setDevMode;
window.__consoleLog = logToConsole;

/** The seated player's two triggers, straight off the mouse: left is the
 *  vehicle's `c_PIFire`, right its `c_PIAltFire`. Which weapon either one
 *  reaches is the weapon's own business — a Sherman's cannon declares the
 *  first and its coaxial machine gun the second, a Corsair's guns the first
 *  and its bombs the second — so nothing here names a gun. Space still works
 *  and still means `c_PIFire`; it was the only binding there was. */
let seatFire = false;
let seatAltFire = false;

function setFly(on) {
  captured = on;
  if (on && isTouchDevice && !sideEl.classList.contains('side-collapsed')) {
    setSideCollapsed(true);
  }
  if (!on) {
    dragging = false;
    lockHeld = false;
    // A trigger held across an Escape must not still be firing when the
    // pointer comes back.
    triggerHeld = false;
    clickQueued = false;
    aimHeld = false;
    seatFire = false;
    seatAltFire = false;
    if (document.pointerLockElement === renderer.domElement) {
      document.exitPointerLock();
    }
  }
  updateMobileControls();
}
function capture() {
  setFly(true);
  ensureAudioContext();
  // The lock is asked for, not depended on: Chrome refuses one for about a
  // second after the player pressed Escape out of the last one, and it
  // rejects rather than throws. `captured` is already true either way, so
  // dragging still turns the view and the next click takes the lock.
  const lock = renderer.domElement.requestPointerLock();
  if (lock && typeof lock.catch === 'function') lock.catch(() => {});
  // After the pointer, never before: fullscreen spends the click's user
  // activation, and Chrome 149 refuses a pointer lock asked for after it.
  kbLockEnter();
}
function release() {
  setFly(false);
}

// --- the Escape menu -------------------------------------------------------
//
// The game's own way out of a level: Escape puts the front end back up over
// the battle, and from there you either go back to it, leave it, or start a
// different one. This is that screen — `play/skirmish.js`, the same
// controller `play/index.html` is, mounted on a canvas over the stage with
// its fourth page up: `menu/ExitMenu`'s button, which reads END CURRENT GAME
// because an Instant Battle is a singleplayer game
// (`Join/Disconnect/ShowDisconnect` = 2, the engine's own numbering).
//
// The level keeps running behind it, untouched, and entirely hidden: the
// menu is opaque, exactly as the engine's is. The front end paints its black
// field and its camouflaged plate over the game, and stops the Bink movie
// while there is a game to go back to — so the battle does not show through,
// and nothing here dims or blurs the frame to suggest that it does.
//
// Three ways out of it, and all three are the game's: Escape again is back to
// the game, START is a different level (the page navigates, which is this
// site's "disconnect and load the new map"), and END CURRENT GAME is
// `game.disconnect` — the same MENU_URL the console word already goes to.
const menuCanvas = document.getElementById('menu-canvas');
let escMenu = null;
let escMenuUp = false;

/** The screen, built and loading on first need. Warmed once the level is,
 *  so the first Escape is a paint and not a fetch. */
function escMenuScreen() {
  if (escMenu) return escMenu;
  escMenu = createSkirmishScreen({
    canvas: menuCanvas,
    // `map.html` sits at the viewer root, where `play/index.html` is one
    // directory down; every pack and level URL in the controller is built
    // off this.
    root: '',
    params,
    // No menu loop over a battle: the engine stops the front end's own Bink
    // movie the moment there is a game behind the menu.
    music: false,
    inGame: true,
    onDisconnect: () => location.assign(MENU_URL),
    // Picking a mod must not throw the level away, so the list re-fetches in
    // place instead of reloading the page the way the way-in screen does.
    modChoice: 'inplace',
    onStatus: text => { if (text) console.warn(text); },
  });
  escMenu.load()
    // The level and the side it opens on are the ones being played, the way
    // the game's own list sits on what it last started. `launchTeam` is the
    // `?team=` this page came in on; with no parameter the screen keeps its
    // own default, which is the one the way-in screen shows.
    .then(() => {
      escMenu.selectMap(extras?.level || params.get('map') || '');
      if (launchTeam) escMenu.setTeam(launchTeam);
    })
    .catch(error => {
      console.error('Escape menu unavailable', error);
      // A screen that cannot draw must not swallow Escape: the key goes back
      // to being the one that frees the pointer.
      setEscMenu(false);
      escMenu = null;
    });
  return escMenu;
}

/** Up or down. Down is "back to the game", which leaves the gate showing —
 *  the pointer lock is the player's to take again with a click, because a
 *  browser will not hand it back on the same Escape that took it away. */
function setEscMenu(on) {
  if (on === escMenuUp) return;
  escMenuUp = on;
  menuCanvas.hidden = !on;
  if (on) {
    // A menu you cannot click is no menu: the pointer comes back with it.
    // (The browser has usually taken the lock off already — this is what
    // drops what was held and stops the world reading the mouse.)
    release();
    // Whatever was held when the menu came up must not still be held under
    // it — the same rule the console follows.
    keys.clear();
    escMenuScreen().paint();
    menuCanvas.focus();
    return;
  }
  // Down is back to the game, with the mouse: that is what the menu does in
  // the game, and there is no "click to resume" plate to ask for it any
  // more. Escape is a user gesture, so the lock is usually granted outright;
  // Chrome refuses one within about a second of the Escape that dropped it,
  // and `capture` is written to survive that (the view still drags, and the
  // next click takes the lock).
  capture();
}

/** Whether the menu owns the keyboard and the pointer. */
function escMenuCaptures() { return escMenuUp; }

// The handle, beside `__console`'s: a headless check drives the screen and
// reads its state back rather than screen-scraping a canvas, the same shape
// `play/index.html`'s `__menu` offers.
window.__escMenu = {
  get up() { return escMenuUp; },
  get ready() { return (escMenu?.state?.levels ?? 0) > 0; },
  get state() { return escMenu?.state ?? null; },
  get levels() { return escMenu?.levels ?? []; },
  get mod() { return escMenu?.mod ?? null; },
  open: () => setEscMenu(true),
  close: () => setEscMenu(false),
  select: index => escMenu?.select(index),
  setTeam: team => escMenu?.setTeam(team),
  launchUrl: () => escMenu?.launchUrl() ?? null,
  start: () => escMenu?.start(),
  paint: () => escMenu?.paint(),
};

// --- Keyboard Lock, prototype (`?kblock`, off by default) ------------------
//
// Crouch-walking is Ctrl+W, and Chrome claims Ctrl+W before the page sees it:
// IDC_CLOSE_TAB is one of the commands `BrowserCommandController::
// IsReservedCommandOrKey` reserves, so no preventDefault stops the tab
// closing. `navigator.keyboard.lock()` is the page's one lever. A locked key
// reaches the page with every modifier -- locking KeyW sends Control+W and
// Control+Shift+W to the page (WICG Keyboard Lock) -- because Chromium's view
// marks it `skip_if_unhandled` and the browser never pre-handles it
// (render_widget_host_view_event_handler.cc). The lock is live only while
// the tab is in a fullscreen the page itself requested
// (`KeyboardLockController::LockKeyboard` checks IsFullscreen(); F11 does not
// count), so on foot, at capture, this asks for both.
//
// Measured headless in Chromium 141 and Chrome 149
// (features/mesh-viewer-performance, Keyboard Lock):
//  - requestFullscreen() consumes the click's activation; requestPointerLock()
//    and keyboard.lock() do not.
//  - keyboard.lock() needs no activation and resolves once the browser has
//    registered the request, fullscreen or not -- the promise says nothing
//    about whether the key is reserved.
//  - requestFullscreen({ keyboardLock }) is not implemented; the option is
//    never read.
//  - With Escape locked, a short Escape reaches the page, so it still releases
//    capture, cancels the deploy screen and closes the map; the browser leaves
//    fullscreen only after Escape is held. Unlocked, the first Escape leaves
//    fullscreen and the page never sees it.
// Chromium drops the lock while the window is unfocused and re-arms it on
// focus (`RenderWidgetHostImpl::SetPageFocus`). Firefox and Safari have no
// navigator.keyboard: there, as without `?kblock`, nothing here runs and the
// beforeunload prompt above is the only guard.
const KBLOCK = params.has('kblock') && typeof navigator.keyboard?.lock === 'function'
  && !isTouchDevice;
// Every key on-foot play holds Ctrl with -- walking, strafing, a crouched
// reload (Ctrl+R reloads the page), E, Z, M, jump -- and Escape, so its short
// press stays the page's. Keys the game does not bind stay the browser's: a
// deliberate Ctrl+T still opens a tab.
const KBLOCK_KEYS = ['KeyW', 'KeyA', 'KeyS', 'KeyD', 'KeyR', 'KeyE', 'KeyZ',
                     'KeyM', 'Space', 'Escape'];
let kbSession = false;        // inside the fullscreen this page asked for
let kbLockState = 'idle';     // what lock() last said; the ?shots hook reads it

function kbLockEnter() {
  if (!KBLOCK || !(optOnFoot.checked && soldier)) return;
  if (document.fullscreenElement !== stage) stage.requestFullscreen().catch(() => {});
  // Asked again on every capture: the session's own `fullscreenchange`
  // handler unlocks when the fullscreen ends, however it ends.
  navigator.keyboard.lock(KBLOCK_KEYS).then(
    () => { kbLockState = 'requested'; },
    error => { kbLockState = `rejected: ${error.name}`; });
}

// Leaving on-foot play ends the session, and so does the Escape that
// closes the menu with the pointer already free.
function kbLockLeave() {
  if (!kbSession) return;
  navigator.keyboard.unlock();
  kbLockState = 'unlocked';
  document.exitFullscreen().catch(() => {});
}

if (KBLOCK) {
  document.addEventListener('fullscreenchange', () => {
    const inside = document.fullscreenElement === stage;
    if (inside === kbSession) return;
    kbSession = inside;
    if (!inside) {
      navigator.keyboard.unlock();
      kbLockState = 'unlocked';
    }
    const was = HUD_FOOT;
    HUD_FOOT = inside ? HUD_FOOT_KBLOCK : HUD_FOOT_PLAIN;
    if (hud.textContent === was) hud.textContent = HUD_FOOT;
  });
}
let touchFlying = false;
const activeTouches = new Map();
let touchPinchDist = 0;
let touchMidX = 0;
let touchMidY = 0;
let isPanning = false;

function getTouchesCenterAndDist() {
  const pts = Array.from(activeTouches.values());
  if (pts.length < 2) return null;
  const dx = pts[1].x - pts[0].x;
  const dy = pts[1].y - pts[0].y;
  return {
    midX: (pts[0].x + pts[1].x) / 2,
    midY: (pts[0].y + pts[1].y) / 2,
    dist: Math.hypot(dx, dy)
  };
}

// The bit a button sets in `e.buttons`, indexed by its own `e.button` number.
// The two numberings disagree on middle vs. right: `button` calls middle 1
// and right 2, `buttons` puts right at bit 2 (0x2) and middle at bit 4 (0x4).
// Getting this backwards would read a right-click as a middle-click, so it
// is a lookup table, not an arithmetic guess.
const BUTTON_BIT = [1, 4, 2, 8, 16];

// Real pointer lock, or -- under `?shots` -- captured and stood in for it,
// the same way `canFire` (Infantry advance) already treats `?shots` as a
// substitute for `captured` itself: headless Chromium never grants pointer
// lock, so a harness has nothing else to gate on.
function pointerLocked() {
  return document.pointerLockElement === renderer.domElement || params.has('shots');
}

// Left is `c_PIFire`, right is `c_PIAltFire` (`Infantry.con`) while captured,
// on foot and pointer-locked -- the same gate `pointerdown` always checked.
// A second button pressed while the first is already held never reaches
// `pointerdown`: the browser reports it as a `pointermove` carrying the
// button that changed (`e.button`) and the new chord (`e.buttons`), plus a
// `mousedown` this page does not listen for. Releasing one of two held
// buttons is the same story on `pointerup`'s side. `pointerdown`, `pointerup`
// and that chorded `pointermove` all funnel through here so a chord is never
// silently dropped -- confirmed against real Chromium event order with
// `scratchpad/chord.cjs` (a held left + a right press/release fires
// `pointermove button=2 buttons=3` then `buttons=1`, no `pointerdown`/`up`
// at all for the right button).
//
// A release is handled before the gate, not after it: death or a redeploy
// while the trigger is held nulls `soldier` out from under it (see the
// `soldier = null` sites), and the pointerup that follows must still clear
// `triggerHeld`/`aimHeld` or the next life starts with the trigger stuck.
// A fresh press still needs the full gate -- there is no weapon, no rig and
// no meaning to "zoomed" without one. Zoom is never touched on a release;
// `altFireOnce` only toggles on a fresh press.
function buttonChange(e) {
  // Both triggers are dead under an open console, press and release alike.
  if (consoleCaptures()) return;
  const pressed = !!(e.buttons & BUTTON_BIT[e.button]);
  if (!pressed) {
    if (e.button === 0) { triggerHeld = false; seatFire = false; }
    else if (e.button === 2) { aimHeld = false; seatAltFire = false; }
    return;
  }
  if (!(captured && pointerLocked())) return;
  // Seated, the two buttons are the vehicle's own two triggers rather than
  // the soldier's. `Sherman.con` is the case that makes this matter: the
  // cannon declares `c_PIFire` and `Coaxial_browning` declares `c_PIAltFire`,
  // so with only Space wired to `c_PIFire` the coaxial machine gun had no
  // input at all and could never be fired from the driver's seat — the guns
  // were collected, the FireState existed, and nothing ever pulled it.
  if (optPilot.checked && occupancy) {
    if (e.button === 0) seatFire = true;
    else if (e.button === 2) seatAltFire = true;
    return;
  }
  if (!(optOnFoot.checked && soldier)) return;
  if (e.button === 0) {
    triggerHeld = true;
    clickQueued = true;
  } else if (e.button === 2) {
    const hw = handWeapon;
    if (hw?.data?.zoom?.toggle) {
      // `altFireOnce` masks the *held* alt-fire input on the client
      // (0x00500901, mask 0x800000) so only a fresh press reaches the
      // weapon -- the button that just transitioned to pressed is a fresh
      // press whether it arrived alone or as half of a chord.
      hw.zoomed = !hw.zoomed;
      hw.rezoom = 0;
    } else {
      aimHeld = true;
    }
  }
}

renderer.domElement.addEventListener('pointerdown', e => {
  if (e.pointerType === 'touch') {
    activeTouches.set(e.pointerId, { x: e.clientX, y: e.clientY });
    try { renderer.domElement.setPointerCapture(e.pointerId); } catch {}
    setFly(true);
    ensureAudioContext();

    if (activeTouches.size === 1) {
      lastPointerX = e.clientX;
      lastPointerY = e.clientY;
      dragging = true;
      if (navMode === 'fly') {
        touchFlying = true;
        isPanning = false;
      } else {
        touchFlying = false;
        isPanning = true;
      }
    } else if (activeTouches.size === 2) {
      touchFlying = false;
      isPanning = true;
      const geom = getTouchesCenterAndDist();
      if (geom) {
        touchMidX = geom.midX;
        touchMidY = geom.midY;
        touchPinchDist = geom.dist;
      }
    }
    return;
  }

  // Desktop mouse. On foot with the pointer already locked, the buttons stop
  // being a drag and become the game's own bindings — `c_PIFire` on the left,
  // `c_PIAltFire` (aim) on the right, `Infantry.con` — so the very first
  // click still captures and only the clicks after it pull the trigger.
  // Seated players get the same gate: the buttons are triggers, not a drag,
  // and must not fall through to the orbit/pan branch below.
  if (captured && pointerLocked() && ((optPilot.checked && occupancy)
      || (optOnFoot.checked && soldier))) {
    buttonChange(e);
    return;
  }
  if (e.button === 0) {
    dragging = true;
    isPanning = false;
    lastPointerX = e.clientX;
    lastPointerY = e.clientY;
    try { renderer.domElement.setPointerCapture(e.pointerId); } catch {}
    capture();
  } else if (e.button === 1 || e.button === 2) {
    dragging = true;
    isPanning = true;
    lastPointerX = e.clientX;
    lastPointerY = e.clientY;
    try { renderer.domElement.setPointerCapture(e.pointerId); } catch {}
    setFly(true);
    ensureAudioContext();
  }
});

renderer.domElement.addEventListener('pointerup', e => {
  if (e.pointerType === 'touch') {
    activeTouches.delete(e.pointerId);
    try {
      if (renderer.domElement.hasPointerCapture(e.pointerId)) {
        renderer.domElement.releasePointerCapture(e.pointerId);
      }
    } catch {}

    if (activeTouches.size === 0) {
      touchFlying = false;
      dragging = false;
      isPanning = false;
    } else if (activeTouches.size === 1) {
      const remaining = activeTouches.values().next().value;
      lastPointerX = remaining.x;
      lastPointerY = remaining.y;
      if (navMode === 'fly') {
        touchFlying = true;
        isPanning = false;
      } else {
        touchFlying = false;
        isPanning = true;
      }
    } else {
      const geom = getTouchesCenterAndDist();
      if (geom) {
        touchMidX = geom.midX;
        touchMidY = geom.midY;
        touchPinchDist = geom.dist;
      }
    }
    return;
  }

  dragging = false;
  isPanning = false;
  // Same gate and the same function as the press: `buttonChange` reads
  // `pressed` off `e.buttons`, which is already false for the button that
  // just came up, so this clears the right one without repeating the check.
  buttonChange(e);
  try {
    if (renderer.domElement.hasPointerCapture(e.pointerId)) {
      renderer.domElement.releasePointerCapture(e.pointerId);
    }
  } catch {}
});

renderer.domElement.addEventListener('pointercancel', e => {
  if (e.pointerType === 'touch') {
    activeTouches.delete(e.pointerId);
  }
  if (activeTouches.size === 0) {
    touchFlying = false;
    dragging = false;
    isPanning = false;
  }
});

renderer.domElement.addEventListener('contextmenu', e => {
  e.preventDefault();
});
document.getElementById('side').addEventListener('pointerdown', e => {
  e.stopPropagation();
});

document.addEventListener('pointerlockchange', () => {
  if (document.pointerLockElement === renderer.domElement) {
    lockHeld = true;
    dragging = false;
    setFly(true);
    return;
  }
  if (lockHeld) {
    lockHeld = false;
    setFly(false);
  }
});
document.addEventListener('pointermove', e => {
  if (!captured) return;
  // Mouse look is off under an open console. The pointer lock is kept — the
  // console is a keyboard surface and closing it should drop you straight
  // back into play — so the deltas are simply dropped.
  if (consoleCaptures()) return;
  if (pointerLocked()) {
    // `e.button !== -1` means this move is really a chorded button change
    // (see `buttonChange` above), not the cursor moving: `movementX/Y`
    // on that kind of event can be a large synthetic delta rather than real
    // mouse travel, and feeding it to `lookDelta` is what snapped the view
    // ~90 degrees when a second button joined one already held.
    if (e.button !== -1) {
      buttonChange(e);
      return;
    }
    lookDelta(e.movementX, e.movementY);
    return;
  }

  if (e.pointerType === 'touch') {
    if (!activeTouches.has(e.pointerId)) return;
    activeTouches.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (activeTouches.size >= 2) {
      const geom = getTouchesCenterAndDist();
      if (geom) {
        const dMidX = geom.midX - touchMidX;
        const dMidY = geom.midY - touchMidY;
        touchMidX = geom.midX;
        touchMidY = geom.midY;

        panCamera(dMidX, dMidY);

        const dDist = geom.dist - touchPinchDist;
        touchPinchDist = geom.dist;
        if (Math.abs(dDist) > 1) {
          dollyCamera(dDist * 0.7);
        }
      }
      return;
    }

    if (!dragging) return;
    const dx = e.clientX - lastPointerX;
    const dy = e.clientY - lastPointerY;
    lastPointerX = e.clientX;
    lastPointerY = e.clientY;

    if (isPanning) {
      panCamera(dx, dy);
    } else {
      lookDelta(dx, dy);
    }
    return;
  }

  if (!dragging) return;
  const dx = e.clientX - lastPointerX;
  const dy = e.clientY - lastPointerY;
  lastPointerX = e.clientX;
  lastPointerY = e.clientY;

  if (isPanning) {
    panCamera(dx, dy);
  } else {
    lookDelta(dx, dy);
  }
});
document.addEventListener('wheel', e => {
  if (!captured) return;
  e.preventDefault();
  // On foot the wheel walks the kit's inventory (slot order, wrapping) — the
  // game's own mouse-wheel behaviour — instead of dollying. The free-fly
  // dolly does nothing lasting on foot anyway: the soldier's own eye height
  // sets camera.position.y every frame.
  if (optOnFoot.checked && soldier && cycleKitWeapon(e.deltaY > 0 ? 1 : -1)) {
    return;
  }
  const scale = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 80 : 1;
  camera.position.y -= e.deltaY * scale * 0.12 * (isSlow() ? FLY_SLOW : 1);
  clampAltitude();
}, { passive: false });

function lookVector() {
  const cy = Math.cos(look.yaw), sy = Math.sin(look.yaw);
  const cp = Math.cos(look.pitch), sp = Math.sin(look.pitch);
  return { x: sy * cp, y: sp, z: cy * cp, cy, sy };
}

function applyLook() {
  const d = lookVector();
  camera.lookAt(
    camera.position.x + d.x,
    camera.position.y + d.y,
    camera.position.z + d.z,
  );
}

function fly(dt) {
  if (!captured) return;
  const step = flySpeed() * dt;
  const fwd = (keys.has('KeyW') || touchFlying ? 1 : 0) - (keys.has('KeyS') ? 1 : 0);
  const strafe = (keys.has('KeyD') ? 1 : 0) - (keys.has('KeyA') ? 1 : 0);
  const vert = (keys.has('KeyE') ? 1 : 0) - (keys.has('KeyQ') ? 1 : 0);
  const d = lookVector();
  camera.position.x += (d.x * fwd - d.cy * strafe) * step;
  camera.position.y += (d.y * fwd + vert) * step;
  camera.position.z += (d.z * fwd + d.sy * strafe) * step;
  clampAltitude();
}

// The stage's size, taken here and only here. A `clientHeight` read in the
// middle of a frame, after that frame's own DOM writes, forces a synchronous
// layout every frame (features/mesh-viewer-performance, rule 3); the frame
// reads these instead.
let stageWidth = 0;
let stageHeight = 0;
function resize() {
  // Stage, not window: the shared nav bar takes a grid row above it.
  const w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h) return;
  stageWidth = w;
  stageHeight = h;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
// The side panel collapsing resizes the stage without resizing the window.
new ResizeObserver(resize).observe(stage);
resize();

function dispose(root) {
  for (const tex of lmCache.values()) tex.dispose();
  lmCache.clear();
  if (!root) return;
  root.traverse(obj => {
    obj.geometry?.dispose();
    for (const m of [obj.material].flat().filter(Boolean)) {
      m.map?.dispose();
      m.dispose();
    }
  });
  scene.remove(root);
}

// The terrain colour tiles are PRE-LIT: Battlecraft bakes the level's sun,
// ambient and cast shadows into the Tx tile art itself (open any tile - the
// building, trench and treeline shadows are painted into the pixels, all
// falling the same way as sunLightDirectionVec). The engine composes ground
// as tile * detail * 2 plus fog and never relights it, so the viewer's
// analytic hemisphere+sun must not multiply in a second time. On Tobruk that
// double-lighting was a warm ~0.87 display-space factor that hid inside an
// already-warm palette; on Wake the level's near-grey diffuseColor
// (0.4/0.38/0.36) summed with a cool-blue fog hemisphere to a dead-grey 0.56
// in linear - the island rendered visibly darker and desaturated against the
// game's warm sandy tiles. Dark levels stay dark without analytic help
// because the bake carries the level's light level into the tile art.
function unlightTerrain(root) {
  root.traverse(node => {
    if (node.userData?.kind !== 'terrain') return;
    node.traverse(obj => {
      if (!obj.isMesh || !obj.material) return;
      const source = Array.isArray(obj.material) ? obj.material : [obj.material];
      const flat = source.map(m => {
        // Ground is viewed at grazing angles for most of a flythrough, and
        // three's default anisotropy of 1 mip-blurs the tile art into a smear
        // a few metres out - the "low-frequency ground" gap against the game.
        if (m.map) m.map.anisotropy = renderer.capabilities.getMaxAnisotropy();
        const mat = new THREE.MeshBasicMaterial({
          map: m.map || null,
          side: m.side,
        });
        mat.name = m.name;
        return mat;
      });
      obj.material = Array.isArray(obj.material) ? flat : flat[0];
    });
  });
}

// The engine's second terrain stage, `base * detail * 2`.
//
// Baking it into the tile colour map at export caps the grain at that map's
// resolution -- 4 texels/m for a 1024px tile over a 256 m patch, and 2 once
// --max-texture 512 has run -- against the 32 texels/m the engine gets by
// tiling a 512px detail map 16 times across the same patch. Sixteen times the
// spatial frequency is the whole difference between crisp sand underfoot and a
// smear, and it costs one extra texture read.
function bindTerrainDetail(root, dir) {
  const info = extras.terrain || {};
  if (!info.detailTexture) return;
  const repeats = info.detailRepeats || 16;
  const tex = texLoader.load(`${MAPS_BASE}/${dir}/${info.detailTexture}${bust()}`);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  // Same grazing-angle story as the tile art: without anisotropy the detail
  // grain vanishes into the first mip a few metres ahead of the camera.
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  // Raw texels, NOT sRGB-decoded: the engine's modulate-2x runs in 8-bit
  // display space, where the detail map's mid-grey 128 is the identity
  // (`apply_detail` in bf42/terrain.py is the same math at export). Decoding
  // the map to linear first turns that identity into 2*srgb2lin(0.5) = 0.43 -
  // terrain came out ~2.3x too dark with the hue baked toward mud. The
  // combine below round-trips the base tile through sRGB so the multiply
  // happens in the space the engine did it in.
  tex.colorSpace = THREE.NoColorSpace;
  root.traverse(node => {
    if (node.userData?.kind !== 'terrain') return;
    node.traverse(obj => {
      if (!obj.isMesh || !obj.material) return;
      const source = Array.isArray(obj.material) ? obj.material : [obj.material];
      const bound = source.map(m => {
        const mat = m.clone();
        mat.userData = { ...mat.userData };
        const prev = mat.onBeforeCompile;
        mat.onBeforeCompile = (shader, renderer) => {
          if (prev) prev(shader, renderer);
          shader.uniforms.tDetail = { value: tex };
          shader.uniforms.detailRepeats = { value: repeats };
          shader.fragmentShader = shader.fragmentShader
            .replace('void main() {',
              `uniform sampler2D tDetail;
               uniform float detailRepeats;
               vec3 bfToSrgb( vec3 c ) {
                 return mix( pow( c, vec3( 0.41666 ) ) * 1.055 - vec3( 0.055 ),
                     c * 12.92, vec3( lessThanEqual( c, vec3( 0.0031308 ) ) ) );
               }
               vec3 bfFromSrgb( vec3 c ) {
                 return mix( pow( c * ( 1.0 / 1.055 ) + vec3( 0.055 / 1.055 ),
                         vec3( 2.4 ) ),
                     c * ( 1.0 / 12.92 ),
                     vec3( lessThanEqual( c, vec3( 0.04045 ) ) ) );
               }
               void main() {`)
            .replace('#include <map_fragment>',
              `#include <map_fragment>
               diffuseColor.rgb = bfFromSrgb( min( vec3( 1.0 ),
                   2.0 * bfToSrgb( diffuseColor.rgb ) *
                       texture2D( tDetail, vMapUv * detailRepeats ).rgb ) );`);
        };
        mat.needsUpdate = true;
        return mat;
      });
      obj.material = Array.isArray(obj.material) ? bound : bound[0];
    });
  });
}

function lightmapTargets(obj) {
  // A multi-material part arrives from GLTFLoader as a Group whose direct
  // Mesh children are its primitives — the same Group-vs-Mesh trap as
  // setAnimatedTextureSpeed. Child *part* nodes carry their own userData
  // (templateKind, lightmap, kind), synthesized primitive meshes carry none.
  if (obj.isMesh) return [obj];
  return obj.children.filter(
    c => c.isMesh && Object.keys(c.userData || {}).length === 0);
}

// The engine's baked lighting for statics, and the pass with the longest
// string of masked bugs in this viewer. Each hid the next:
//
// 1. It never executed -- gated on `obj.isMesh` while every `userData.lightmap`
//    extra lands on a Group (the multi-material-part trap the README documents
//    for setAnimatedTextureSpeed).
// 2. First execution rendered burnt black shells. Partly the texture tagged
//    sRGB -- a lightmap is a multiplier, not a colour, and decoding it to
//    linear squares the darkening -- but mostly:
// 3. The atlas was sampled upside down. Everything inside the glb arrives via
//    GLTFLoader with flipY=false, the glTF convention. These atlases load
//    through THREE.TextureLoader, whose default is flipY=true, so UV1 indexed
//    the atlas mirrored in V -- hard-edged rectangles across faces that should
//    be uniformly lit, which read as "the UV1 export is wrong" and cost a trip
//    through the stride-40 StandardMesh reader that was blameless all along.
//    Same class of bug as the terrain tile V mirror, one loader further down.
//
// With the atlas the right way up, the bake is self-evidently modulate-2x
// (mid-grey neutral, bright texels overbright sun-facing walls) and it
// *replaces* analytic lighting on statics rather than adding to it -- keep the
// hemisphere and sun on a lightmapped wall and every face is lit twice. So a
// lightmapped mesh gets an unlit base material and the bake does the shading,
// palm shadows on walls included.
function bindLightmaps(root, dir) {
  // The bake is the sun term only. Its dark texels sit near zero, and the
  // engine adds the level's declared ambient on top - drop that term and
  // every shadow-side wall multiplies toward black, while sun-facing walls
  // (bright texels) look right, which is exactly how the omission presents.
  // Tobruk declares ambient 0.12/0.10/0.08 plus globalAmbient 0.2 and
  // shadowColor 0.55; the ambient pair is the floor, inlined per level.
  const lit = extras.lighting || {};
  const amb = lit.ambient || [0.2, 0.2, 0.2];
  const glob = lit.globalAmbient || [0.2, 0.2, 0.2];
  const floor = [0, 1, 2].map(i =>
    Math.min(1, (amb[i] || 0) + (glob[i] || 0)).toFixed(4));
  const floorGlsl = `vec3( ${floor[0]}, ${floor[1]}, ${floor[2]} )`;
  root.traverse(node => {
    const rel = node.userData?.lightmap;
    if (!rel) return;
    const url = `${MAPS_BASE}/${dir}/${rel}${bust()}`;
    let tex = lmCache.get(url);
    if (!tex) {
      tex = texLoader.load(url);
      tex.channel = 1;
      tex.flipY = false;
      tex.colorSpace = THREE.NoColorSpace;
      tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
      lmCache.set(url, tex);
    }
    for (const obj of lightmapTargets(node)) {
      const source = Array.isArray(obj.material) ? obj.material : [obj.material];
      const bound = source.map(m => {
        const mat = new THREE.MeshBasicMaterial({
          map: m.map || null,
          side: m.side,
          alphaTest: m.alphaTest || 0,
          transparent: m.transparent,
        });
        mat.name = m.name;
        // The exporter's extras marks ride in userData (additive,
        // textureFade); a rebuild that drops them silently un-marks the
        // material for every later pass.
        mat.userData = m.userData;
        mat.lightMap = tex;
        // MeshBasicMaterial's lightmap term is INLINE in its fragment shader
        // (r169 has no <lightmap_fragment> chunk anywhere), so the combine
        // must replace that exact line. The first version of this pass
        // injected its factor after <map_fragment> and "removed" a
        // #include <lightmap_fragment> that does not exist — a silent no-op
        // that left three's own `lm * 1/pi` accumulation in place, so the
        // bake multiplied in twice and shadow-side texels (near zero)
        // squared to black while sun-facing walls survived. Anchor on the
        // built-in line and rewrite it into the engine combine, applied once.
        mat.onBeforeCompile = (shader) => {
          const anchor = 'reflectedLight.indirectDiffuse += '
            + 'lightMapTexel.rgb * lightMapIntensity * RECIPROCAL_PI;';
          if (!shader.fragmentShader.includes(anchor)) {
            console.warn('lightmap combine anchor missing (three.js upgrade?); '
              + 'bake left on the stock path for', mat.name);
            return;
          }
          shader.fragmentShader = shader.fragmentShader.replace(anchor,
            `reflectedLight.indirectDiffuse += mix( vec3( 1.0 ),
                 min( vec3( 2.0 ), ${floorGlsl} + 2.0 * lightMapTexel.rgb ),
                 lightMapIntensity );`);
        };
        mat.needsUpdate = true;
        return mat;
      });
      obj.material = Array.isArray(obj.material) ? bound : bound[0];
    }
  });
}

// The engine's lighting for everything that is neither pre-lit terrain nor a
// lightmapped static: vehicles and bare statics. Verified against the
// decompiled renderer (features/bf1942-engine-reference/, symbols
// StandardMeshSubShader_applyRenderState 0x005bf690 - the vtable slot of
// dice.ref2.rend.SubShaderBuilder.StandardMesh, whose .rdata carries the .rs
// attribute strings - plus RendPCDX8_flushDeferredState 0x00604750 and
// LightDesc_toD3DLIGHT8 0x0045f210 for the light rig): a lit StandardMesh
// draws with texture stage 0 = MODULATE2X(TEXTURE, DIFFUSE) - the same 2x
// headroom as the terrain-detail and lightmap combines - where DIFFUSE is
// D3D fixed-function vertex lighting,
//
//   clamp01( ambientColor + globalAmbientColor + diffuseColor * max(0, N.L) )
//
// with the material colour effectively white (materialDiffuse is `1 1 1` in
// 3202 of 3523 vanilla .rs declarations; no materialAmbient attribute
// exists). Beware FUN_00664560's MODULATE 1x: that is a different, simpler
// renderer path, not the mesh one. Fixed-function lighting ran in 8-bit
// DISPLAY space; the previous hemisphere+sun rig evaluated its combine in
// linear, which reads far darker in the midtones (display 0.63 is linear
// 0.36) and lost the 2x - vehicles sat visibly under-exposed on terrain
// whose bake renders at full display brightness. Same class of fix as the
// detail combine above: round-trip through sRGB and multiply in the space
// the engine used. Not modelled: the optional specular term
// (lightingSpecular, ~1/3 of materials) and the envmap reflection stage.
// Per-placement `Object.geometry.color` lands on the instance root as
// `extras.color` (GLTFLoader → userData.color). Walk ancestors so every
// mesh under a tinted tree/bush multiplies its base colour once.
function applyInstanceColors(root) {
  root.traverse(obj => {
    if (!obj.isMesh || !obj.material) return;
    let tint = null;
    for (let n = obj; n; n = n.parent) {
      const c = n.userData?.color;
      if (Array.isArray(c) && c.length >= 3) { tint = c; break; }
    }
    if (!tint) return;
    const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
    for (const m of mats) {
      if (!m?.color || m.userData?.instanceTinted) continue;
      m.color.r *= tint[0];
      m.color.g *= tint[1];
      m.color.b *= tint[2];
      m.userData = m.userData || {};
      m.userData.instanceTinted = true;
    }
  });
}

function bindDynamicShading(root) {
  applyInstanceColors(root);
  const lit = extras.lighting || {};
  const amb = lit.ambient || [0.2, 0.2, 0.2];
  const glob = lit.globalAmbient || [0.2, 0.2, 0.2];
  const diff = lit.diffuse || [0.5, 0.5, 0.5];
  // show() aims the DirectionalLight along -sunDirection toward the origin;
  // the same convention makes L (surface toward sun) the negated X/Z.
  const sd = extras.sunDirection || [-0.35, 0.8, 0.45];
  const norm = Math.hypot(sd[0], sd[1], sd[2]) || 1;
  const L = [-sd[0] / norm, sd[1] / norm, -sd[2] / norm];
  const f = n => Number(n).toFixed(4);
  const floorGlsl = `vec3( ${[0, 1, 2].map(i =>
    f(Math.min(1, (amb[i] || 0) + (glob[i] || 0)))).join(', ')} )`;
  const sunGlsl = `vec3( ${diff.map(f).join(', ')} )`;
  const dirGlsl = `vec3( ${L.map(f).join(', ')} )`;
  // Injected constants are baked as literals, and three caches programs by
  // the onBeforeCompile SOURCE - identical closures with different level
  // values would collide across map switches without an explicit key.
  const cacheKey = `bf-dynamic-lit:${floorGlsl}|${sunGlsl}|${dirGlsl}`;
  // `envmap true` adds texture stage 1 on top of the same stage-0 combine, so
  // it is a second program, keyed apart from the plain one.
  const envCacheKey = `${cacheKey}|envmap`;
  root.traverse(obj => {
    if (!obj.isMesh || !obj.material) return;
    // A muzzle flash is light, not a surface: the exporter bakes the sprite
    // payloads unlit for exactly that reason, and the mesh payloads carry
    // `extras.additive` instead. Both have to survive this pass — rebuilding
    // them as MeshBasicMaterial here drops the userData the additive mark
    // rides in, and `gunfire.js` would then blend the flash as ordinary alpha
    // over the cockpit rail. Shading them would dim the one thing the shot is
    // showing anyway.
    if (obj.userData?.effect) return;
    const source = Array.isArray(obj.material) ? obj.material : [obj.material];
    if (!source.some(m => m.isMeshStandardMaterial)) return;
    const bound = source.map(m => {
      if (!m.isMeshStandardMaterial) return m;
      const mat = new THREE.MeshBasicMaterial({
        map: m.map || null,
        color: m.color ? m.color.clone() : 0xffffff,
        side: m.side,
        alphaTest: m.alphaTest || 0,
        transparent: m.transparent,
        opacity: m.opacity,
        depthWrite: m.depthWrite,
      });
      mat.name = m.name;
      // Keep the exporter's extras marks (additive, textureFade) — a rebuild
      // that drops userData un-marks the material for every later pass.
      mat.userData = m.userData;
      // The glb's emissive slot carries a 0.45 translucency floor on branch
      // cards (see assemble.py) - a crutch calibrated against the OLD
      // under-lit rig, where pure N.L blackened sun-away fronds. The
      // engine-true combine already floors every surface at
      // 2*(ambient+globalAmbient), and in-game palms keep genuinely dark
      // shadow sides, so the crutch is dropped here rather than folded in -
      // keeping it would pin fronds at >=1.5x their texel on Tobruk.
      // `envmap true` is texture stage 1 over the same stage-0 combine
      // (envmap.js carries the engine addresses). Only bound when the level
      // actually shipped six cube faces; without them the engine's own gate
      // (ctx+0x18 != NULL, 0x005bfa8b) fails too and the material draws plain.
      const env = wantsEnvmap(m) && levelEnvCube ? levelEnvCube : null;
      mat.customProgramCacheKey = () => (env ? envCacheKey : cacheKey);
      mat.onBeforeCompile = (shader) => {
        if (env) shader.uniforms.tBfEnv = { value: env };
        shader.vertexShader = shader.vertexShader
          .replace('void main() {',
            `varying vec3 vBfNormal;\n${env ? envmapVertexPatch() : ''}void main() {`)
          .replace('#include <begin_vertex>',
            `vBfNormal = mat3( modelMatrix ) * normal;
             ${env ? envmapVertexBody() : ''}
             #include <begin_vertex>`);
        shader.fragmentShader = shader.fragmentShader
          .replace('void main() {',
            `varying vec3 vBfNormal;
             vec3 bfToSrgb( vec3 c ) {
               return mix( pow( c, vec3( 0.41666 ) ) * 1.055 - vec3( 0.055 ),
                   c * 12.92, vec3( lessThanEqual( c, vec3( 0.0031308 ) ) ) );
             }
             vec3 bfFromSrgb( vec3 c ) {
               return mix( pow( c * ( 1.0 / 1.055 ) + vec3( 0.055 / 1.055 ),
                       vec3( 2.4 ) ),
                   c * ( 1.0 / 12.92 ),
                   vec3( lessThanEqual( c, vec3( 0.04045 ) ) ) );
             }
             ${env ? envmapFragmentPatch({ srgbFns: true }) : ''}
             void main() {`)
          .replace('#include <map_fragment>',
            `#include <map_fragment>
             vec3 bfN = normalize( vBfNormal );
             if ( !gl_FrontFacing ) bfN = -bfN;
             float bfNdL = max( 0.0, dot( bfN, ${dirGlsl} ) );
             // D3D clamps the vertex diffuse to [0,1] BEFORE the stage's
             // modulate-2x, and saturates again after the multiply.
             vec3 bfLit = 2.0 * min( vec3( 1.0 ),
                 ${floorGlsl} + ${sunGlsl} * bfNdL );
             diffuseColor.rgb = bfFromSrgb( min( vec3( 1.0 ),
                 bfToSrgb( diffuseColor.rgb ) * bfLit ) );
             // Stage 1: the environment reflection, blended by the diffuse
             // texture's own alpha (0x005bfcc6 BLENDCURRENTALPHA). Runs after
             // stage 0 because CURRENT is stage 0's output.
             ${env ? envmapFragmentApply() : ''}`);
      };
      mat.needsUpdate = true;
      return mat;
    });
    obj.material = Array.isArray(obj.material) ? bound : bound[0];
  });
}

// `textureFade true` — the black_o darkness plane sealing every building
// doorway and window. The engine fades it with camera distance: up close it
// is gone and the room shows through the opening; at range it is solid and
// the opening reads as dark. The exporter marks the material in extras and
// this pass gives each flagged mesh its own clone so one building's doorway
// can be open while a distant one's is sealed. The band is PROVISIONAL
// [free]: fully open inside 20 m, fully sealed past 55 m, chosen to sit
// inside the 70 m interior-LOD switch the engine used — measure against a
// recording to pin it.
const FADE_NEAR = 20;   // [free] m, alpha 0 at or below
const FADE_FAR = 55;    // [free] m, alpha 1 at or beyond
let fadeMeshes = [];
// Every input to the ramp below is the camera's position against fixed points,
// so a frame that did not move the camera cannot change a single opacity. The
// gate is that position plus a generation `bindTextureFade` bumps, so the first
// call after a level rebuilds `fadeMeshes` always runs (rule 7's shape, applied
// to a list instead of a surface).
let fadeGeneration = 0;
let fadeCamGeneration = -1;
let fadeCamX = NaN, fadeCamY = NaN, fadeCamZ = NaN;

function bindTextureFade(root) {
  fadeMeshes = [];
  fadeGeneration++;
  root.traverse(obj => {
    if (!obj.isMesh) return;
    const source = [obj.material].flat();
    if (!source.some(m => m?.userData?.textureFade)) return;
    const bound = source.map(m => {
      if (!m?.userData?.textureFade) return m;
      // clone() keeps map/lightMap but not onBeforeCompile — irrelevant
      // here, the texture is pure black and lighting black is black.
      const mat = m.clone();
      mat.userData = m.userData;
      mat.transparent = true;
      mat.depthWrite = false;
      return mat;
    });
    obj.material = Array.isArray(obj.material) ? bound : bound[0];
    // Statics never move; cache the world position once.
    const at = new THREE.Vector3();
    obj.getWorldPosition(at);
    // And which of this mesh's materials the ramp drives. A mesh can carry a
    // material ARRAY where only some entries are the darkness plane's, so the
    // fading ones are kept rather than the first (rule 5: `[obj.material].flat()`
    // per mesh per frame was two fresh arrays per mesh, 33 of them on Wake).
    fadeMeshes.push({ obj, at, mats: bound.filter(m => m?.userData?.textureFade) });
  });
}

function updateTextureFade() {
  const cam = camera.position;
  if (fadeCamGeneration === fadeGeneration
      && cam.x === fadeCamX && cam.y === fadeCamY && cam.z === fadeCamZ) return;
  fadeCamGeneration = fadeGeneration;
  fadeCamX = cam.x; fadeCamY = cam.y; fadeCamZ = cam.z;
  for (const { obj, at, mats } of fadeMeshes) {
    const dx = at.x - cam.x, dy = at.y - cam.y, dz = at.z - cam.z;
    // Kept as a real square root rather than compared against squared band
    // edges: `sqrt` is correctly rounded, so `sqrt(d2) <= 20` and `d2 <= 400`
    // disagree by one ULP just past the near edge (`sqrt(400 + 2^-44)` rounds
    // back to exactly 20), and this has to be a behavioural no-op. One sqrt
    // across 33 meshes is not what the profile was reading anyway — the
    // allocations and the unconditional writes below were.
    const d = Math.sqrt(dx * dx + dy * dy + dz * dz);
    const a = Math.min(1, Math.max(0, (d - FADE_NEAR) / (FADE_FAR - FADE_NEAR)));
    for (const m of mats) if (m.opacity !== a) m.opacity = a;
    // A fully-faded plane still costs a draw call; drop it. Compared against
    // the material's and the object's OWN current value rather than a
    // remembered one, so anything else that writes either is picked up on the
    // next frame the camera moves.
    const shown = a > 0;
    if (obj.visible !== shown) obj.visible = shown;
  }
}

function disposeSky() {
  if (skybox) {
    skybox.dispose();
    skybox = null;
  }
  if (skyRoot) {
    skyRoot.traverse(obj => {
      obj.geometry?.dispose();
      for (const m of [obj.material].flat().filter(Boolean)) {
        m.map?.dispose();
        m.dispose();
      }
    });
    scene.remove(skyRoot);
    skyRoot = null;
  }
  if (cloudMesh) {
    cloudMesh.geometry.dispose();
    cloudMesh.material.dispose();
    scene.remove(cloudMesh);
    cloudMesh = null;
    cloudUniforms = null;
  }
  for (const tex of waterAssets) tex.dispose();
  waterAssets = [];
  waterUniforms = null;
  levelEnvCube = null;
}

// The level cubemap, loaded once and shared by the envmap materials and the
// water's fresnel term. Called before either wants it.
function setupEnvCube(dir) {
  const urls = cubeFaceUrls(extras, `${MAPS_BASE}/${dir}`);
  if (!urls) { levelEnvCube = null; return null; }
  levelEnvCube = cubeLoader.load(urls.map(u => `${u}${bust()}`));
  levelEnvCube.colorSpace = THREE.SRGBColorSpace;
  waterAssets.push(levelEnvCube);
  return levelEnvCube;
}

function srgb(rgb, fallback) {
  const [r, g, b] = rgb || fallback;
  // Level .con colours are display values from a pre-colour-managed engine.
  return new THREE.Color().setRGB(r, g, b, THREE.SRGBColorSpace);
}

// The engine draws the SkyBox mesh camera-centred with no fog and no lighting
// (`lighting false` in every Sky_*.rs). Reparent it out of the level root so
// distance culling never touches it, and swap its lit materials for unlit ones.
/**
 * A grafted cockpit interior, in the same light the rest of the level is in:
 * none.
 *
 * This page draws the whole level with `MeshBasicMaterial`. BF1942 bakes its
 * light into the textures and the per-object lightmaps, so a shaded material
 * here would be a second opinion about a surface that already carries one.
 * The cockpit glb is the exception because it does not come from the level —
 * it is the MODEL BROWSER's export (`extract_models.py --cockpit`), and that
 * page lights what it shows, so the interior arrives as
 * `MeshStandardMaterial` and is the one surface in a level the level's own
 * hemisphere and sun actually touch.
 *
 * Inside a tank that is fatal. `1P_Sherman_Gunner_M1`'s camera-facing
 * vertices have a mean N.L of 0.01 against the sun and a mean N.y of -0.04,
 * so the sun gives them nothing and the hemisphere gives them its horizon: a
 * texture whose own mean is rgb(56,54,48) came out at **rgb(1,1,0)**. The
 * viewport frame the driver looks through was there all along and it was
 * black, which is why the report read "in ours it's just looking direct at
 * the world". Unlit, the same pixels measure rgb(21,22,16) to rgb(26,29,24)
 * and the frame, its bevels, its corner screws and its top latch all read
 * the way they do in a retail capture.
 *
 * `userData.additive` is carried across the same way `loadHandWeapon` does
 * it: a gunsight's own glow is an additive surface and has to stay one.
 * Materials are converted once each, not once per mesh, because a cockpit's
 * seven texture pages are shared between its parts.
 */
function unlitCockpit(root) {
  const seen = new Map();
  const convert = m => {
    if (!m || m.isMeshBasicMaterial) return m;
    let basic = seen.get(m);
    if (basic) return basic;
    basic = new THREE.MeshBasicMaterial({
      map: m.map || null,
      color: m.color ? m.color.clone() : 0xffffff,
      transparent: m.transparent,
      opacity: m.opacity,
      alphaTest: m.alphaTest,
      side: m.side,
      depthWrite: m.depthWrite,
      toneMapped: m.toneMapped,
    });
    basic.name = m.name;
    basic.userData = m.userData;
    if (m.userData?.additive) {
      basic.blending = THREE.AdditiveBlending;
      basic.transparent = true;
      basic.depthWrite = false;
    }
    seen.set(m, basic);
    return basic;
  };
  root.traverse(obj => {
    if (!obj.isMesh) return;
    obj.material = Array.isArray(obj.material)
      ? obj.material.map(convert) : convert(obj.material);
  });
  // The shaded originals were never drawn; free them rather than leave seven
  // standard-material programs' worth of texture references alive.
  for (const original of seen.keys()) original.dispose();
}

function setupSky(root, dir) {
  root.traverse(obj => {
    if (obj.userData?.kind === 'sky') skyRoot = obj;
  });
  if (!skyRoot) return;
  skyRoot.parent.remove(skyRoot);
  scene.add(skyRoot);
  skyRoot.traverse(obj => {
    if (!obj.isMesh) return;
    obj.frustumCulled = false;
    obj.renderOrder = -100;
    const mats = [obj.material].flat().map(m => new THREE.MeshBasicMaterial({
      map: m.map || null,
      color: m.map ? 0xffffff : 0x9db4c0,
      fog: false,
      depthWrite: false,
      side: THREE.DoubleSide,
    }));
    obj.material = Array.isArray(obj.material) ? mats : mats[0];
  });
  setupClouds(dir);
}

// `Sky.addCloud`: one alpha-blended layer scrolling at Cloud.setSpeed,
// repeated Cloud.setTexScale times across the sky span. Drawn camera-locked
// like the sky box, with a radial fade standing in for the engine's
// cloud-distance falloff.
function setupClouds(dir) {
  const clouds = extras.sky?.clouds;
  if (!clouds?.texture) return;
  const tex = texLoader.load(`${MAPS_BASE}/${dir}/${clouds.texture}${bust()}`);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  waterAssets.push(tex);
  cloudUniforms = {
    map: { value: tex },
    uOffset: { value: new THREE.Vector2(0, 0) },
    uSpan: { value: 500 },
    uCam: { value: new THREE.Vector2(0, 0) },
    uFadeStart: { value: 400 },
    uFadeEnd: { value: 900 },
  };
  const material = new THREE.ShaderMaterial({
    uniforms: cloudUniforms,
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide,
    vertexShader: `
      varying vec3 vWorld;
      void main() {
        vec4 w = modelMatrix * vec4(position, 1.0);
        vWorld = w.xyz;
        gl_Position = projectionMatrix * viewMatrix * w;
      }`,
    fragmentShader: `
      uniform sampler2D map;
      uniform vec2 uOffset, uCam;
      uniform float uSpan, uFadeStart, uFadeEnd;
      varying vec3 vWorld;
      void main() {
        vec2 uv = vWorld.xz / uSpan + uOffset;
        vec4 c = texture2D(map, uv);
        float fade = 1.0 - smoothstep(uFadeStart, uFadeEnd, distance(vWorld.xz, uCam));
        gl_FragColor = vec4(c.rgb, c.a * fade);
        #include <colorspace_fragment>
      }`,
  });
  cloudMesh = new THREE.Mesh(
    new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2), material);
  cloudMesh.frustumCulled = false;
  cloudMesh.renderOrder = -99;
  scene.add(cloudMesh);
}

// Everything the engine's PatchTerrain/Water shader does with the level's
// `water.*` block: two scrolling colour layers combined modulate-2x, a
// scrolling normal map feeding a sun specular, and colour/alpha ramps driven
// by real water depth sampled from the exported heightmap-derived depth map.
function setupWater(root, dir) {
  const w = extras.water;
  if (!w) return;
  let waterObj = null;
  root.traverse(obj => {
    if (obj.userData?.kind === 'water' && obj.isMesh) waterObj = obj;
  });
  if (!waterObj) return;
  const load = rel => {
    const tex = texLoader.load(`${MAPS_BASE}/${dir}/${rel}${bust()}`);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    waterAssets.push(tex);
    return tex;
  };
  const texs = w.textures || {};
  const layer1 = texs.layer1 ? load(texs.layer1) : null;
  const layer2 = texs.layer2 ? load(texs.layer2) : null;
  const normal = texs.normal ? load(texs.normal) : null;
  const depth = texs.depth ? load(texs.depth) : null;
  if (layer1) layer1.colorSpace = THREE.SRGBColorSpace;
  if (layer2) layer2.colorSpace = THREE.SRGBColorSpace;
  if (depth) depth.wrapS = depth.wrapT = THREE.ClampToEdgeWrapping;
  // The engine reflects ENVMAP_G_.rcm off the water via the shader-manager
  // envmap parameter; the same six faces feed the fresnel term here. Shared
  // with the `envmap true` mesh materials (see setupEnvCube), one cube per
  // level rather than one per consumer.
  const env = levelEnvCube;
  const ld = w.lightDirection || [-0.3, 0.5, 0.65];
  waterUniforms = {
    tLayer1: { value: layer1 },
    tLayer2: { value: layer2 },
    tNormal: { value: normal },
    tDepth: { value: depth },
    tEnv: { value: env },
    uTime: { value: 0 },
    uWorldSize: { value: w.worldSize || extras.worldSize || 2048 },
    uMaxDepth: { value: w.maxDepth || 0 },
    uDir1: { value: new THREE.Vector2(...(w.scrollDir1 || [1, 0])) },
    uDir2: { value: new THREE.Vector2(...(w.scrollDir2 || [0, 1])) },
    uDirN: { value: new THREE.Vector2(...(w.scrollDirNormal || [1, 1])) },
    uScroll1: { value: w.scroll1 || 0 },
    uScroll2: { value: w.scroll2 || 0 },
    uScrollN: { value: w.scrollNormal || 0 },
    uTile1: { value: w.tile1 || 0.5 },
    uTile2: { value: w.tile2 || 0.5 },
    uTileN: { value: w.tileNormal || 1 },
    uShallow: { value: srgb(w.shallowColor, [0.4, 0.5, 0.55]) },
    uDeep: { value: srgb(w.deepColor, [0.3, 0.38, 0.42]) },
    uSpec: { value: srgb(w.specular ? w.specularColor : [0, 0, 0], [0, 0, 0]) },
    uLightDir: { value: new THREE.Vector3(ld[0], ld[1], ld[2]).normalize() },
    uShininess: { value: Math.min(120, Math.max(20, 0.06 / Math.max(w.streakFactor || 0.001, 1e-4))) },
    uShallowAlpha: { value: w.shallowAlpha ?? 0.5 },
    uAlphaDepth: { value: w.alphaDepth || 1.5 },
    uColorDepth: { value: w.colorDepth || 10 },
    fogColor: { value: new THREE.Color(0x808080) },
    fogNear: { value: 400 },
    fogFar: { value: 900 },
  };
  const material = new THREE.ShaderMaterial({
    uniforms: waterUniforms,
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide,
    vertexShader: `
      varying vec3 vWorld;
      void main() {
        vec4 world = modelMatrix * vec4(position, 1.0);
        vWorld = world.xyz;
        gl_Position = projectionMatrix * viewMatrix * world;
      }`,
    fragmentShader: `
      uniform sampler2D tLayer1, tLayer2, tNormal, tDepth;
      uniform samplerCube tEnv;
      uniform float uTime, uWorldSize, uMaxDepth;
      uniform vec2 uDir1, uDir2, uDirN;
      uniform float uScroll1, uScroll2, uScrollN, uTile1, uTile2, uTileN;
      uniform vec3 uShallow, uDeep, uSpec, uLightDir;
      uniform float uShininess, uShallowAlpha, uAlphaDepth, uColorDepth;
      uniform vec3 fogColor;
      uniform float fogNear, fogFar;
      varying vec3 vWorld;
      vec3 bfToSrgb( vec3 c ) {
        return mix( pow( c, vec3( 0.41666 ) ) * 1.055 - vec3( 0.055 ),
            c * 12.92, vec3( lessThanEqual( c, vec3( 0.0031308 ) ) ) );
      }
      vec3 bfFromSrgb( vec3 c ) {
        return mix( pow( c * ( 1.0 / 1.055 ) + vec3( 0.055 / 1.055 ),
                vec3( 2.4 ) ),
            c * ( 1.0 / 12.92 ),
            vec3( lessThanEqual( c, vec3( 0.04045 ) ) ) );
      }
      void main() {
        vec2 wuv = vec2(vWorld.x, -vWorld.z);
        vec3 tex = vec3(1.0);
        #ifdef HAS_LAYERS
        // The engine's fixed-function MODULATE2X runs in 8-bit DISPLAY space,
        // like every other combine in this viewer (terrain detail, lightmaps,
        // dynamic shading). The old l1*l2*4.0 did it in linear, which squares
        // the layers' slight teal tint into the saturated turquoise the game
        // never shows - the water07/08 texels are a near-neutral grey
        // (mean 140/150/153).
        vec3 l1 = bfToSrgb(texture2D(tLayer1, wuv * uTile1 + uDir1 * uScroll1 * uTime).rgb);
        vec3 l2 = bfToSrgb(texture2D(tLayer2, wuv * uTile2 + uDir2 * uScroll2 * uTime).rgb);
        tex = min(vec3(1.0), l1 * l2 * 2.0);
        #endif
        float depth = uMaxDepth;
        #ifdef HAS_DEPTH
        depth = texture2D(tDepth, wuv / uWorldSize).r * uMaxDepth;
        #endif
        vec3 base = mix(uShallow, uDeep, clamp(depth / max(uColorDepth, 0.001), 0.0, 1.0));
        vec3 col = bfFromSrgb(min(vec3(1.0), bfToSrgb(base) * tex));
        vec3 N = vec3(0.0, 1.0, 0.0);
        #ifdef HAS_NORMAL
        // The DX8-era normal map is not 0.5-centred; two offset samples
        // subtracted give a zero-mean, still-animated perturbation.
        vec2 nuv = wuv * uTileN + uDirN * uScrollN * uTime;
        vec2 dn = texture2D(tNormal, nuv).rg
                - texture2D(tNormal, nuv * 1.31 + vec2(0.5)).rg;
        N = normalize(vec3(dn.x * 0.6, 1.0, dn.y * 0.6));
        #endif
        vec3 V = normalize(cameraPosition - vWorld);
        #ifdef HAS_ENV
        vec3 R = reflect(-V, N);
        R.y = abs(R.y);
        // Deliberately blurred (fixed coarse mip): the ENVMAP_G_.rcm faces
        // bake the island and its clouds, and a sharp per-pixel lookup mirrors
        // them as structured smudges marching across the mid-distance - shapes
        // the in-game water never shows. What the reference shots do show is a
        // soft brightness wash toward the horizon, which is exactly what the
        // cubemap's low mip is. LOD 4 of a 128px face is 8px - directional
        // light distribution kept, all structure gone. (A texture bias can't
        // do this: MAX_TEXTURE_LOD_BIAS may clamp as low as 2.) Calibrated
        // against the Wake defgun reference, same spirit as the fresnel
        // shaping below - not a decompiled engine behaviour.
        vec3 sky = textureLod(tEnv, R, 4.0).rgb;
        // A plain Schlick fresnel (exponent 5, scaled to reach 1.0) turned the
        // lagoon into a near-perfect cloud mirror the moment the camera got low
        // and the view raked across open water -- exactly the case a flythrough
        // spends most of its time in, and not what the live-game reference
        // screenshots show even at the shoreline: the water keeps its own
        // shallow/deep tint and a soft sun-glint, not a crisp sky reflection.
        // Steepening the exponent and capping the peak keeps the mirror term a
        // rim highlight at true grazing incidence instead of the dominant term
        // from ten degrees off horizontal outward.
        float fresnel = 0.03 + 0.55 * pow(1.0 - max(dot(N, V), 0.0), 10.0);
        col = mix(col, sky, clamp(fresnel, 0.0, 1.0));
        #endif
        vec3 H = normalize(normalize(uLightDir) + V);
        col += uSpec * pow(max(dot(N, H), 0.0), uShininess);
        float alpha = mix(uShallowAlpha, 0.96, clamp(depth / max(uAlphaDepth, 0.001), 0.0, 1.0));
        #ifdef HAS_ENV
        alpha = max(alpha, clamp(fresnel, 0.0, 1.0));
        #endif
        // LINEAR, not smoothstep: THREE.Fog on the terrain and the engine's
        // DX8 vertex fog are both linear ramps. An S-curve here under-fogs
        // the sea ahead of the midpoint and over-fogs it past it (up to ~9%
        // of the ramp), so the waterline would read differently hazed than
        // the shore it touches at the same distance.
        float fogF = clamp((length(cameraPosition - vWorld) - fogNear)
            / max(fogFar - fogNear, 0.001), 0.0, 1.0);
        col = mix(col, fogColor, fogF);
        gl_FragColor = vec4(col, alpha);
        #include <colorspace_fragment>
      }`,
    defines: {
      ...(layer1 && layer2 ? { HAS_LAYERS: '' } : {}),
      ...(normal ? { HAS_NORMAL: '' } : {}),
      ...(depth ? { HAS_DEPTH: '' } : {}),
      ...(env ? { HAS_ENV: '' } : {}),
    },
  });
  waterObj.material.dispose();
  waterObj.material = material;
}

function syncWaterFog() {
  if (!waterUniforms || !scene.fog) return;
  waterUniforms.fogColor.value.copy(scene.fog.color);
  waterUniforms.fogNear.value = scene.fog.near;
  waterUniforms.fogFar.value = scene.fog.far;
}

// The sky box is 4000 m across but our far plane is much closer, so it is
// drawn scaled down around the camera — with depth writes off and everything
// overdrawing it, only its angular content matters, and that is scale-free.
function updateSky() {
  if (skyRoot) {
    const half = skyRoot.userData.halfExtent || 2000;
    const s = camera.far * 0.95 / (half * 1.7320508);
    skyRoot.scale.setScalar(s);
    // changeOfsSkyHeight lowers the box so the painted horizon sits below
    // eye level - Tobruk (150) shows sand-fade everywhere with the sign the
    // other way, and Wake (0) is indifferent.
    skyRoot.position.set(
      camera.position.x,
      camera.position.y - (extras.sky?.heightOffset || 0) * s,
      camera.position.z,
    );
    if (cloudMesh && cloudUniforms) {
      const clouds = extras.sky?.clouds || {};
      const rise = ((clouds.height ?? 3500) - (clouds.ofsHeight ?? 0)) * s;
      const span = 4 * half * s / (clouds.texScale || 8);
      cloudMesh.scale.set(camera.far * 4, 1, camera.far * 4);
      cloudMesh.position.set(
        camera.position.x, camera.position.y + rise, camera.position.z);
      cloudUniforms.uSpan.value = span;
      cloudUniforms.uCam.value.set(camera.position.x, camera.position.z);
      cloudUniforms.uFadeStart.value = camera.far * 1.2;
      cloudUniforms.uFadeEnd.value = camera.far * 2.4;
    }
  }
}

function advanceSim(dt) {
  simTime += dt;
  if (flagMixer) flagMixer.update(dt);
  if (waterUniforms) waterUniforms.uTime.value = simTime;
  if (cloudUniforms) {
    const speed = extras.sky?.clouds?.speed || [0, 0];
    cloudUniforms.uOffset.value.set(simTime * speed[0], simTime * speed[1]);
  }
}

/** The master limiter, installed by `ensureListener` below. */
let audioLimiter = null;

/**
 * The one AudioListener every player on this page hangs off, with a limiter
 * between it and the speakers.
 *
 * The limiter is why the buses can play the `.ssc` mix at the volumes it
 * writes. Web Audio sums into the destination and clips flat there, so before
 * this the engine and weapon buses each carried a fixed divisor to keep the
 * worst case under full scale — and paid for it everywhere else: a Sherman
 * idling, from inside, peaked at 0.089 against the BAR's 0.596 and the map's
 * own wind at 0.0156, while the same tank's cannon still came out at 1.75 and
 * clipped anyway. A single divisor cannot do both jobs; a limiter does the
 * one job it was ever really for, and only when a sound actually asks for
 * more than the output has.
 *
 * Set as a limiter rather than a compressor: `knee 0` and `ratio 20` make it
 * flat below the threshold and a ceiling above it, so nothing under -1 dBFS
 * is touched at all. The 3 ms attack catches a cannon's own transient; the
 * 150 ms release is long enough not to pump the ambient bed between rounds of
 * a machine gun and short enough to let go before the next shot.
 */
function ensureListener() {
  if (AUDIO_OFF) return null;
  if (!audioListener) {
    audioListener = new THREE.AudioListener();
    camera.add(audioListener);
    audioLoader = new THREE.AudioLoader();
    const ctx = audioListener.context;
    try {
      const limiter = ctx.createDynamicsCompressor();
      limiter.threshold.value = -1;
      limiter.knee.value = 0;
      limiter.ratio.value = 20;
      limiter.attack.value = 0.003;
      limiter.release.value = 0.15;
      // three parents the listener's gain straight onto the destination in
      // its constructor; this re-routes that one edge and nothing else, so
      // every player that asks for `getInput()` still finds the same node.
      audioListener.gain.disconnect();
      audioListener.gain.connect(limiter);
      limiter.connect(ctx.destination);
      audioLimiter = limiter;
    } catch {
      // A context with no compressor node is still a context: the graph keeps
      // its direct edge and the mix simply clips the way it used to.
      audioListener.gain.connect(ctx.destination);
    }
  }
  return audioListener;
}

function ensureAudioContext() {
  if (!ensureListener()) return;
  // Autoplay policy: a context created before any click starts suspended and
  // stays that way until a gesture resumes it. Every caller of this is a real
  // user gesture; the catch is for the ones that are not.
  if (audioListener.context && audioListener.context.state === 'suspended') {
    audioListener.context.resume().catch(() => {});
  }
}

/**
 * Decoded wav, cached on the un-busted path.
 *
 * The cache key must not carry `bust()`: with it, the dev origin re-keyed and
 * re-decoded the same wav on every call, and the sequential decode stagger
 * started identical loops 50-200 ms apart — a permanent slapback echo. bust()
 * stays on the fetch URL only. Ambient, area and engine sound all come through
 * here so the one-decode-per-wav rule holds across all three.
 */
async function soundBuffer(dir, relPath) {
  if (AUDIO_OFF) return null;
  const key = `${dir}/${relPath}`;
  if (audioBufferCache.has(key)) return audioBufferCache.get(key);
  ensureListener();
  // The pending decode is what goes in the cache, not just the finished
  // buffer. Two setups that overlap — the pilot box ticked, unticked and
  // ticked again while the first load is still awaiting — otherwise both miss
  // and fetch the same wav twice, which is the one-decode-per-wav rule the
  // hall-echo postmortem left behind (features/bf1942-3d-models/map-sounds.md).
  // A failed load drops out of the cache again so a later attempt can retry.
  const pending = audioLoader.loadAsync(`${MAPS_BASE}/${key}${bust()}`)
    .catch(e => {
      console.warn(`Could not load sound ${key}:`, e);
      audioBufferCache.delete(key);
      return null;
    });
  audioBufferCache.set(key, pending);
  return pending;
}

/**
 * Same cache, models tree: the hand-weapon fire samples live under
 * `models/sounds/`, not in any map directory. The `models:` prefix keeps the
 * key out of the `${dir}/${relPath}` namespace above — a map directory cannot
 * contain a colon, so the two families can never collide in the cache.
 */
async function modelSoundBuffer(relPath) {
  if (AUDIO_OFF) return null;
  const key = `models:${relPath}`;
  if (audioBufferCache.has(key)) return audioBufferCache.get(key);
  ensureListener();
  // The pending decode, for the reason soundBuffer gives above.
  const pending = audioLoader.loadAsync(`${MODELS_BASE}/${relPath}${bust()}`)
    .catch(e => {
      console.warn(`Could not load sound ${key}:`, e);
      audioBufferCache.delete(key);
      return null;
    });
  audioBufferCache.set(key, pending);
  return pending;
}

function disposeSounds() {
  soundsGeneration++;
  disposeEngineAudio();
  // Every pooled effect voice, armed latch and looping wreck fire, gone —
  // called from both of `show()`'s own teardown points (directly, and again
  // through `setupSounds`), so a level change is the one place the whole
  // pool is guaranteed to hit zero committed voices, whatever handle chain
  // did or did not run for the level being left. `silence()` keeps the pool
  // itself — its scripts, its decoded buffers — so the next level's impacts
  // do not re-decode anything.
  effectAudio.silence();
  if (ambientAudio) {
    try {
      if (ambientAudio.isPlaying) ambientAudio.stop();
      ambientAudio.disconnect();
    } catch (_) {}
    ambientAudio = null;
  }
  for (const item of activeAreaAudios) {
    try {
      if (item.sound.isPlaying) item.sound.stop();
      item.sound.disconnect();
      if (item.anchor) scene.remove(item.anchor);
    } catch (_) {}
  }
  activeAreaAudios = [];
}

async function setupSounds(report, dir) {
  disposeSounds();
  const gen = soundsGeneration;
  const cfg = report.sounds;
  if (!cfg || AUDIO_OFF) return;

  ensureListener();
  const getBuffer = (relPath) => soundBuffer(dir, relPath);

  // Ambient atmospheric sound
  if (cfg.ambient && cfg.ambient.file) {
    const buf = await getBuffer(cfg.ambient.file);
    if (gen !== soundsGeneration) return;
    if (buf) {
      ambientAudio = new THREE.Audio(audioListener);
      ambientAudio.setBuffer(buf);
      ambientAudio.setLoop(true);
      const master = optSound.checked ? parseFloat(optSoundVol.value) : 0;
      ambientAudio.setVolume((cfg.ambient.volume ?? 0.6) * master);
      try { ambientAudio.play(); } catch (_) {}
    }
  }

  // Shorelines and positional area sounds. One looping voice per unique wave
  // file: several areas sharing Water_waves.wav used to get one loop each, and
  // two loops of the same sample audible at once through separate HRTF panners
  // reads as a hall echo, not louder surf. updateAudio moves the single
  // anchor to the closest point across every polyline in the group.
  // Flags join the area pool as one-point emitters. They group by file like
  // everything else, so every flag on the map shares a single looping voice
  // anchored at whichever one is nearest — which is the same reason the
  // shorelines do it, and the reason five flags do not phase against each
  // other. `flag.ssc` supplies the near/far ramp the group already honours.
  const areaList = [...(cfg.areas || [])];
  const flags = cfg.flags;
  if (flags && flags.file && flags.positions?.length) {
    for (const point of flags.positions) {
      areaList.push({
        name: 'flag',
        file: flags.file,
        points: [point],
        volume: flags.volume ?? 1.0,
        nearDistance: flags.nearDistance ?? flags.minDistance ?? 4.0,
        farDistance: flags.farDistance ?? 15.0,
      });
    }
  }

  if (areaList.length > 0) {
    const groups = new Map();
    for (const area of areaList) {
      if (!area.file || !area.points || area.points.length === 0) continue;
      const key = area.file.toLowerCase();
      if (!groups.has(key)) groups.set(key, { file: area.file, areas: [] });
      groups.get(key).areas.push(area);
    }

    for (const group of groups.values()) {
      const buf = await getBuffer(group.file);
      if (gen !== soundsGeneration) return;
      if (!buf) continue;

      const first = group.areas[0];
      const anchor = new THREE.Object3D();
      anchor.position.set(first.points[0][0], first.points[0][1], first.points[0][2]);
      scene.add(anchor);

      const sound = new THREE.PositionalAudio(audioListener);
      sound.setBuffer(buf);
      sound.setLoop(true);
      sound.setRefDistance(first.nearDistance || 40.0);
      // The manual .ssc near/far ramp in updateAudio owns distance volume
      // exclusively; rolloff 0 disables the panner's own inverse-distance
      // curve so the two attenuations don't multiply. setMaxDistance is not
      // called — it only applies to the 'linear' distance model, so it was
      // inert here anyway. HRTF panning is kept for direction.
      sound.setRolloffFactor(0);
      anchor.add(sound);

      activeAreaAudios.push({ anchor, sound, areas: group.areas });
      try { sound.play(); } catch (_) {}
    }
  }
  updateAudio();
}

// --- engine audio -----------------------------------------------------------
//
// The flown vehicle's own engine, played from the `.ssc` the extractor shipped
// in `scene.json`. `engine-audio.js` owns the graph and the curve evaluation;
// everything here is the seam — which node the voices hang off, what the
// control channels are worth this frame, and the lifecycle rules the ambient
// path already established (nothing starts inside an async gap, nothing
// survives a map change).

let engineAudio = null;
// Bumped by disposeEngineAudio, for the same reason soundsGeneration exists: an
// in-flight load must be able to tell that it has been superseded, or a rapid
// pilot toggle leaks a running engine that dispose can no longer reach.
let engineGeneration = 0;
let engineNode = null;
let currentDir = '';
// `Acceleration` is a control source in its own right — the Corsair's right
// cockpit whine pitches off it — and the flight model publishes velocity, not
// acceleration, so it is differenced here. Raw frame differences are mostly
// numerical noise, hence the one-pole smoothing.
const enginePrevVelocity = new THREE.Vector3();
const engineScratch = new THREE.Vector3();
let engineAccel = 0;
const ACCEL_SMOOTHING = 5;          // 1/s
const engineWorldPos = new THREE.Vector3();
const engineWorldQuat = new THREE.Quaternion();
const weaponWorldPos = new THREE.Vector3();
const weaponWorldQuat = new THREE.Quaternion();
// The longest shut-down one-shot in the vanilla set is willyenginestp at
// 1.94 s; the loops are gone 0.2 s in.
const ENGINE_RELEASE_MS = 2400;

// The guns, from the same `.ssc` machinery as the engine.
//
// `CorsairMG.ssc` is a six-patch weapon script whose first five patches are
// `silence.wav`; the extractor ships only the one that is not, the Fire Loop,
// and its four layers are two pairs that hand over on distance — CAMG1/CAMG2
// up to 4 m, CAMGdist/BFMGdist from 4 m out to 250. So the cockpit hears the
// gun and a chase camera hears the same gun from outside, and neither costs
// this page a decision: the ramps are in the data and `EngineAudio` already
// evaluates them.
//
// The loops run from the moment the patch is built and are muted by gain
// alone, which is the one-voice-per-role rule the hall-echo postmortem left
// behind (`map-sounds.md`). Starting and stopping a buffer source per trigger
// pull would restart its loop phase against the other layer every time and
// comb; holding it and moving the bus cannot. It also means a held Space adds
// no voices at all, which is the thing worth asserting headlessly.
let weaponAudio = [];

function disposeEngineAudio() {
  engineGeneration++;
  if (engineAudio) {
    engineAudio.dispose();
    engineAudio = null;
  }
  for (const weapon of weaponAudio) weapon.audio.dispose();
  weaponAudio = [];
  engineNode = null;
  engineAccel = 0;
  enginePrevVelocity.set(0, 0, 0);
}

async function setupEngineAudio() {
  disposeEngineAudio();
  const gen = engineGeneration;
  const vehicle = aircraft || car;
  if (!vehicle || AUDIO_OFF) return;
  const template = vehicle.node.userData?.control || vehicle.node.name;
  const spec = findEngineSpec(extras, template);
  if (!spec) {
    // A stale scene.json, a vehicle with no Engine sound script and an

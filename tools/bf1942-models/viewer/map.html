    // unpublished wav are otherwise indistinguishable — which is exactly the
    // failure that made every map but Wake look silent last time.
    console.info(`no engine sound for ${template}: re-extract this map if it `
                 + 'predates the vehicle-sound pipeline');
    // The guns are not the engine's to lose. They hang off the same report
    // entry, so a template missing from `sounds.vehicles` used to take the
    // whole seat silent — no engine note *and* no report when you fired,
    // which is how a Bocage PanzerIV or a Stalingrad Hanomag read as
    // completely dead. But a gun patch is looked up by FireArms node name,
    // and the same `.ssc` was almost always extracted next to some other
    // vehicle on the same map that carries that gun, so the patches are
    // usually right there in the report under a different template. Try
    // that before giving up: a map whose data is a re-extraction behind at
    // least still shoots audibly.
    const arms = listSeatFireArms(vehicle.node);
    const byName = findWeaponSpecsByFireArms(extras, arms).map(found => {
      const local = arms.find(a => a === found.fireArms
                                   || a === `${found.fireArms}_unlimited`);
      return local ? { ...found, fireArms: local } : found;
    });
    if (byName.length) {
      await setupWeaponAudio(gen, currentDir, template, vehicle.node, byName);
    }
    return;
  }
  // The voices hang off the `Engine` node the script is bound to, not the
  // vehicle origin: on a Corsair that is the propeller hub at z -4.15, four
  // metres ahead of the pilot's ear, which is where the noise actually is.
  engineNode = vehicle.node.getObjectByName(spec.engine) || vehicle.node;
  const dir = currentDir;
  const built = await loadEngineAudio(spec, {
    listener: ensureListener(),
    getBuffer: (relPath) => soundBuffer(dir, relPath),
  });
  if (!built) return;
  // Decoding took several awaits; anything could have happened. Nothing has
  // been started yet, so a superseded load is thrown away silently.
  if (gen !== engineGeneration || (!aircraft && !car)) {
    built.dispose();
    return;
  }
  engineAudio = built;
  engineAudio.setMaster(masterVolume());
  engineAudio.start();
  await setupWeaponAudio(gen, dir, template, vehicle.node);
}

/**
 * Build and start every gun patch this vehicle (or bare manned mount) carries.
 *
 * Shares the engine's generation counter rather than keeping its own: the guns
 * are only ever set up and torn down with the seat they are bolted to, so a
 * second counter would be two names for one fact.
 *
 * `visualRoot` is the drivetrain's node or a furniture gun's occupancy root —
 * the FireArms names hang under either the same way.
 */
async function setupWeaponAudio(gen, dir, template, visualRoot, specs) {
  const list = specs ?? findWeaponSpecs(extras, template);
  if (!list.length || !visualRoot) return;
  const built = [];
  for (const spec of list) {
    const audio = await loadEngineAudio(spec, {
      listener: ensureListener(),
      getBuffer: (relPath) => soundBuffer(dir, relPath),
      // The gun bus keeps its own scale. Measured against the hand weapon it
      // is already where it should be — a Sherman's coaxial Browning peaks at
      // 0.654 to the BAR's 0.596 — and the one patch that ran past full scale
      // through it, the 20-layer cannon at 1.75, is the limiter's business
      // now rather than a reason to hold every other gun down.
      headroom: WEAPON_HEADROOM,
      // A gun patch is the report of one round, so its one-shots wait for
      // `trigger()` (spliced onto `guns.onShot` below) instead of firing once
      // at setup and leaving nothing behind to un-mute.
      oneShotsOnTrigger: true,
    });
    if (audio) built.push({ spec, audio, node: null });
  }
  // Decoding took several awaits. Nothing has been started, so a superseded
  // load is dropped without ever having made a sound.
  if (gen !== engineGeneration || !(aircraft || car || occupancy)) {
    for (const weapon of built) weapon.audio.dispose();
    return;
  }
  for (const weapon of built) {
    // The voices belong on the gun, not the vehicle origin: a Corsair's guns
    // are 2.2 m out each wing, and the panner is what puts the rattle there.
    // `fireArmsNode`, not `getObjectByName`, for the reason spelled out on
    // `bareFireArmsName`: the second Corsair in a level is `CorsairGuns_1`.
    weapon.node = fireArmsNode(visualRoot, weapon.spec.fireArms) || visualRoot;
    weapon.audio.setMaster(0);   // silent until the trigger is pulled
    weapon.audio.start();
  }
  weaponAudio = built;
}

/**
 * A FireArms node name with the scene-wide instance suffix taken off.
 *
 * The exporter numbers the second and later copy of a vehicle across the
 * whole level, and the numbering reaches every node inside it: the first
 * BF109 on Kasserine fires `BF109Guns`, the second fires `BF109Guns_1`. The
 * *sound* specs are per template (`findWeaponSpecs` keys on the vehicle's
 * `control`), so they only ever carry the bare name — anything matching a
 * spec against a live node has to strip the suffix or it silently misses
 * every instance but the first.
 *
 * That is not hypothetical: `weaponAudioFor` already stripped it, and the
 * gain gate in `updateAudio` did not, so flying the second BF109 or Stuka on
 * a level ran the whole fire patch at master 0. A gun `.ssc` whose layers are
 * all loops (every aircraft's is — the engine authors a Fire Loop held open
 * by the trigger) has nothing but that gate to un-mute it, so the guns fired
 * tracers in silence.
 */
function bareFireArmsName(name) {
  return String(name || '').replace(/_\d+$/, '');
}

/**
 * Every FireArms node name under `root`, bare of the instance suffix.
 *
 * `findWeaponSpecs` keys on the vehicle's template, so it has nothing to say
 * about a vehicle the report does not list. This is the other way in: the
 * scene itself knows which guns are bolted to the thing you are sitting in,
 * and `findWeaponSpecsByFireArms` can find those patches wherever in the
 * report they were extracted.
 */
function listSeatFireArms(root) {
  if (!root) return [];
  const names = new Set();
  root.traverse(obj => {
    if (obj.userData?.fireArms && obj.name) {
      names.add(bareFireArmsName(obj.name));
    }
  });
  return [...names];
}

/** The FireArms node under `root` a spec's bare name refers to. */
function fireArmsNode(root, fireArms) {
  if (!root || !fireArms) return null;
  const exact = root.getObjectByName(fireArms);
  if (exact) return exact;
  let found = null;
  root.traverse(obj => {
    if (!found && obj.name && bareFireArmsName(obj.name) === fireArms) found = obj;
  });
  return found;
}

/** The live gun group a weapon patch belongs to, tolerating that suffix. */
function firingGroupFor(fireArms) {
  const matches = group => bareFireArmsName(group.node.name) === fireArms;
  return vehicleGuns.find(matches) || mannedGuns.find(matches) || null;
}

/**
 * Bare furniture mounts (MG42 / Browning) have no Engine `.ssc`, so the map
 * report never lists them under `sounds.vehicles`. Reuse layers already
 * extracted for the same FireArms on a tank/ship, then start them the same
 * way a drivetrain's guns start.
 */
async function setupMannedWeaponAudio() {
  if (!occupancy || AUDIO_OFF) return;
  disposeEngineAudio();
  const gen = engineGeneration;
  const root = occupancy.root;
  const template = root.userData?.control || root.name;
  let specs = findWeaponSpecs(extras, template);
  if (!specs.length) {
    const arms = occupancy.activeFireArmsNodes()
      .map(n => n.name?.replace(/_\d+$/, ''))
      .filter(Boolean);
    // Alias layers (Sherman's `Browning`) onto this mount's real node name
    // (`Browning_unlimited`) so getObjectByName and the firing lookup agree.
    specs = findWeaponSpecsByFireArms(extras, arms).map(spec => {
      const local = arms.find(a =>
        a === spec.fireArms || a === `${spec.fireArms}_unlimited`);
      return local ? { ...spec, fireArms: local } : spec;
    });
  }
  if (!specs.length) return;
  await setupWeaponAudio(gen, currentDir, template, root, specs);
}

/**
 * Stop the engine the way the script expects: release, then tear down.
 *
 * `trigger Release` layers (the shut-down rattle) only play on release, and
 * every loop carries a `Volume <- TimeRelease` fade, so the graph has to stay
 * alive past the toggle. The generation guard is what stops a re-enable inside
 * the tail from being killed by the pending teardown.
 */
function stopEngineAudio() {
  if (!engineAudio) return;
  engineAudio.release();
  const gen = engineGeneration;
  setTimeout(() => {
    if (gen === engineGeneration) disposeEngineAudio();
  }, ENGINE_RELEASE_MS);
}

function masterVolume() {
  return optSound.checked ? parseFloat(optSoundVol.value) : 0;
}

/** Everything the `.ssc` control sources are worth this frame. */
function engineControl(dt) {
  const state = (aircraft || car)?.state;
  if (engineNode) {
    engineNode.getWorldPosition(engineWorldPos);
    engineNode.getWorldQuaternion(engineWorldQuat);
  }
  let speed = 0;
  let diveAngle = 0;
  if (state) {
    speed = state.airspeed || state.velocity.length();
    if (dt > 0) {
      const a = engineScratch.copy(state.velocity).sub(enginePrevVelocity).length() / dt;
      engineAccel += (a - engineAccel) * Math.min(1, dt * ACCEL_SMOOTHING);
      enginePrevVelocity.copy(state.velocity);
    }
    // `Engine::DiveAngle` is fed by the engine object and the vanilla ramps
    // span 0.2..1, so it is read here as the sine of the flight path's descent
    // angle — 1 straight down, 0.2 about 12 degrees nose-down, which is where
    // the dive scream starts to come in. Inferred, not read out of the data.
    if (speed > 1) diveAngle = Math.max(0, -state.velocity.y / speed);
  }
  return {
    dt,
    // The already-spooled engine value, NOT the stick. Aircraft chase the
    // pedal at Physics.con's slew rate; cars write gearbox revs (with a
    // stationary pedal floor); tanks write the feedbackLoop load reading.
    // Land `.ssc` scripts read the same value as controlSource Default.
    rpm: state ? state.throttle : 0,
    speed,
    acceleration: engineAccel,
    diveAngle,
    position: engineWorldPos,
    quaternion: engineWorldQuat,
    listenerPosition: camera.position,
  };
}

// Sitting in a vehicle, its engine is essentially all you can hear — the map's
// wind and surf do not compete with a radial a metre in front of your knees.
// Ducking the ambience is how to get there. It used to be the ONLY way to get
// there, because the engine bus was pinned at a divisor fitted to a Corsair;
// it no longer is (`engine-audio.js`'s `BUS_HEADROOM`, and the limiter in
// `ensureListener`), and the duck is now what it says it is rather than a way
// round a mix that could not be turned up. Eased rather than switched, or
// entering and leaving the cockpit pops.
const AMBIENT_DUCK = 0.12;
const AMBIENT_DUCK_TAU = 0.4;
let ambientDuck = 1;

function updateAudio(dt = 0) {
  const master = masterVolume();
  const duckTarget = (optPilot.checked && (aircraft || car)) ? AMBIENT_DUCK : 1;
  ambientDuck += (duckTarget - ambientDuck)
    * (dt > 0 ? Math.min(1, dt / AMBIENT_DUCK_TAU) : 1);
  if (engineAudio) {
    engineAudio.setMaster(master);
    engineAudio.update(engineControl(dt));
  }
  for (const weapon of weaponAudio) {
    // The trigger comes from the gun runtime rather than the key, so a weapon
    // that has run its magazine dry or is not the seat's gun stays quiet for
    // the same reason it stops drawing tracers. Nested / bare seats fire from
    // `mannedGuns`, not `vehicleGuns` — looking only at the latter silenced
    // every hull Browning and stationary MG. The name match goes through
    // `bareFireArmsName` for the reason spelled out there: an exact compare
    // silenced every instance of a vehicle but the first.
    const group = firingGroupFor(weapon.spec.fireArms);
    // A gain gate is only meaningful for a patch that has something running to
    // gate. A gun built entirely out of one-shots — which is every gun on this
    // map — is silent between rounds on its own, and holding its master at 0
    // between them would mute the very shot `trigger()` just started.
    weapon.audio.setMaster(weapon.audio.hasLoops && !group?.firing ? 0 : master);
    if (weapon.node) {
      weapon.node.getWorldPosition(weaponWorldPos);
      weapon.node.getWorldQuaternion(weaponWorldQuat);
    }
    // No control channel in a weapon patch reads anything but Distance and
    // Default, both of which the module derives itself, so the gun needs none
    // of the engine's rpm/speed/dive plumbing.
    weapon.audio.update({
      dt,
      position: weaponWorldPos,
      quaternion: weaponWorldQuat,
      listenerPosition: camera.position,
    });
  }
  if (handFireBus) {
    // The hand-shot bus tracks the master like the engine bus does, and is
    // deliberately not ducked: the duck exists so a cockpit engine drowns the
    // surf, and the weapon at your own shoulder is the one thing louder.
    const target = master * WEAPON_HEADROOM;
    if (Math.abs(handFireBus.gain.value - target) > 1e-4) {
      handFireBus.gain.setTargetAtTime(
        target, audioListener.context.currentTime, 0.05);
    }
  }
  if (ambientAudio) {
    const base = extras.sounds?.ambient?.volume ?? 0.6;
    ambientAudio.setVolume(base * master * ambientDuck);
  }

  if (activeAreaAudios.length === 0) return;

  const camPos = camera.position;
  for (const item of activeAreaAudios) {
    // Closest point to the camera across every polyline in the group; the
    // area that produced it supplies the near/far ramp and base volume.
    let bestArea = item.areas[0];
    let bx = bestArea.points[0][0], by = bestArea.points[0][1], bz = bestArea.points[0][2];
    let minD2 = Infinity;

    for (const area of item.areas) {
      const pts = area.points;
      if (pts.length === 1) {
        const dist2 = (camPos.x - pts[0][0]) ** 2 + (camPos.y - pts[0][1]) ** 2 + (camPos.z - pts[0][2]) ** 2;
        if (dist2 < minD2) {
          minD2 = dist2;
          bx = pts[0][0]; by = pts[0][1]; bz = pts[0][2];
          bestArea = area;
        }
        continue;
      }
      for (let i = 0; i < pts.length - 1; i++) {
        const p1 = pts[i];
        const p2 = pts[i + 1];
        const dx = p2[0] - p1[0];
        const dy = p2[1] - p1[1];
        const dz = p2[2] - p1[2];
        const len2 = dx * dx + dy * dy + dz * dz;
        let t = len2 > 0 ? ((camPos.x - p1[0]) * dx + (camPos.y - p1[1]) * dy + (camPos.z - p1[2]) * dz) / len2 : 0;
        if (t < 0) t = 0;
        else if (t > 1) t = 1;
        const qx = p1[0] + t * dx;
        const qy = p1[1] + t * dy;
        const qz = p1[2] + t * dz;
        const dist2 = (camPos.x - qx) ** 2 + (camPos.y - qy) ** 2 + (camPos.z - qz) ** 2;
        if (dist2 < minD2) {
          minD2 = dist2;
          bx = qx; by = qy; bz = qz;
          bestArea = area;
        }
      }
    }

    item.anchor.position.set(bx, by, bz);

    const dist = Math.sqrt(minD2);
    const near = bestArea.nearDistance || 40.0;
    const far = bestArea.farDistance || 80.0;
    let ramp = 0.0;
    if (dist <= near) {
      ramp = 1.0;
    } else if (dist < far) {
      const denom = Math.max(far - near, 0.001);
      ramp = 1.0 - (dist - near) / denom;
    }
    item.sound.setVolume((bestArea.volume ?? 0.6) * ramp * master * ambientDuck);
  }
}

function applyLighting() {
  const light = extras.lighting;
  if (!light) {
    hemi.color.set(0xe8dcc0);
    hemi.groundColor.set(0x5a4a32);
    hemi.intensity = 1.35;
    sun.color.set(0xfff1d0);
    sun.intensity = 2.4;
    return;
  }
  // renderer.diffuseColor is the sun's tint; keep overall exposure by
  // normalising it and carrying the magnitude into intensity.
  const diffuse = light.diffuse || [0.5, 0.5, 0.5];
  const peak = Math.max(...diffuse, 0.01);
  const tint = diffuse.map(c => c / peak);
  sun.color.setRGB(tint[0], tint[1], tint[2], THREE.SRGBColorSpace);
  sun.intensity = 2.4 * Math.min(1.4, peak / 0.5);
  // The engine has no sky-dome light: its only ambient terms are
  // renderer.ambientColor / globalAmbientColor, and neither is ever blue.
  // Tinting the hemisphere with the raw fog colour injected atmosphere blue
  // into the shading on marine maps - on Wake (fog 0.71/0.74/0.79 against sun
  // 1/.95/.9) the two cancelled to a dead-grey total and every vehicle picked
  // up a cool cast the game never shows. Keep the fog's LUMINANCE as the size
  // of the ambient bounce, but give it the sun's hue so the hemisphere can
  // never fight the level's declared light colour.
  const fog = extras.fogColor || [0.7, 0.7, 0.7];
  const atmos = 0.2126 * fog[0] + 0.7152 * fog[1] + 0.0722 * fog[2];
  hemi.color.setRGB(atmos * tint[0], atmos * tint[1], atmos * tint[2],
                    THREE.SRGBColorSpace);
  const ground = light.ambient || [0.2, 0.2, 0.2];
  hemi.groundColor.setRGB(
    Math.min(1, ground[0] * 2.5), Math.min(1, ground[1] * 2.5),
    Math.min(1, ground[2] * 2.5), THREE.SRGBColorSpace);
  hemi.intensity = 1.15;
}

function drawDistance() {
  return extras.drawDistance || DEFAULT_DRAW;
}

function applyFar() {
  const world = extras.worldSize || 2048;
  const draw = drawDistance();
  // The engine's far plane IS the view distance: with fog saturating there,
  // the world ends in a completed haze wall that meets the sky painting.
  // Drawing past it (the old draw*1.6 with a 900 m floor) rasterised
  // fog-saturated terrain as crisp silhouettes against the paler sky band —
  // the "distant mountain ridge" the game never shows. Extend only to a
  // declared fogEnd beyond the view distance (Gazala: fog 500-850 vs VD 500)
  // so the wall always completes before the clip; 1.05 keeps the last
  // fog-saturated metres from z-fighting the plane.
  camera.far = optEntire.checked
    ? Math.max(4000, world * 1.5)
    : Math.max(draw, extras.fogEnd || 0) * 1.05;
  camera.updateProjectionMatrix();
}

function applyFog() {
  const color = extras.fogColor || [0.8, 0.72, 0.53];
  const draw = drawDistance();
  let start, end;
  if (optGameFog.checked) {
    // Nullish, not falsy: Berlin authors `fogstart 0` — fog from the eye
    // out — and a || default replaced that 0 with 150 against its declared
    // end of 100, which inverts the ramp and paints the whole world as one
    // fog wall.
    start = extras.fogStart ?? 150;
    end = extras.fogEnd ?? 300;
  } else if (!optEntire.checked) {
    start = draw * 0.55;
    end = draw;
  } else {
    start = 250;
    end = Math.max(1400, extras.worldSize || 2000);
  }
  // Declared fog colours are display values from a pre-colour-managed engine.
  const fogColor = new THREE.Color().setRGB(
    color[0], color[1], color[2], THREE.SRGBColorSpace);
  scene.fog = new THREE.Fog(fogColor, start, end);
  // The near pass's scene shares the object, so the arms' materials compile
  // against the same fog the world does — here, before the rig's warm-up
  // compile, and not per frame, or that compile would be for a fogless
  // program the first drawn frame then replaces.
  vmScene.fog = scene.fog;
  scene.background = skybox || fogColor;
  syncWaterFog();
}

function isCollision(obj) {
  return Boolean(obj.userData?.collision) || /collision/i.test(obj.name || '');
}

function kindOf(obj) {
  return obj.userData?.kind || '';
}

const cullBonePos = new THREE.Vector3();
function tagCull(obj) {
  // A skinned flag cloth sits at the scene root carrying no transform of its
  // own — glTF requires that of any skinned mesh — so its bind-pose geometry
  // boxes around the world origin and a distance test would hide it
  // everywhere except there. Its real position is wherever its joints are.
  if (obj.isSkinnedMesh && obj.skeleton && obj.skeleton.bones.length) {
    const box = new THREE.Box3();
    for (const bone of obj.skeleton.bones) {
      box.expandByPoint(bone.getWorldPosition(cullBonePos));
    }
    const sphere = new THREE.Sphere();
    box.getBoundingSphere(sphere);
    obj.userData.cullCenter = sphere.center.clone();
    // The joints are a lattice inside the cloth, not its extent; pad for it.
    obj.userData.cullRadius = sphere.radius + 2;
    return;
  }
  const box = new THREE.Box3().setFromObject(obj);
  const sphere = new THREE.Sphere();
  box.getBoundingSphere(sphere);
  obj.userData.cullCenter = sphere.center.clone();
  obj.userData.cullRadius = sphere.radius;
}

function indexScene(root) {
  cull.length = 0;
  spawnersRoot = null;
  root.traverse(obj => {
    if (isCollision(obj)) obj.visible = false;
  });
  root.updateMatrixWorld(true);
  root.traverse(obj => {
    if (obj === root) return;
    if (kindOf(obj) === 'spawners' || obj.name === 'spawners') {
      spawnersRoot = obj;
    }
  });
  for (const child of root.children) {
    if (child === spawnersRoot) {
      for (const vehicle of child.children) tagCull(vehicle);
      continue;
    }
    if (kindOf(child) === 'water') continue;
    tagCull(child);
    cull.push(child);
  }
  flattenCull();
  freezeStatics(root);
}

/* `cull`'s bounding spheres, as four flat arrays.
 *
 * `applyVisibility` runs a distance test per entry per frame — 814 of them on
 * Wake, before the 32 spawner children — and each one used to chase
 * `obj.userData.cullCenter` (a `Vector3` behind two property loads and a
 * dictionary lookup) plus `obj.userData.cullRadius`. The centres and radii are
 * fixed at `indexScene` time by `tagCull`, so they are hoisted out of the scene
 * graph once and the per-frame test becomes typed-array arithmetic
 * (features/mesh-viewer-performance, rule 5's sibling: no per-frame pointer
 * chase either).
 *
 * `Float64Array`, not `Float32Array`: the old test ran in doubles, and this has
 * to be a behavioural no-op. Rounding a centre to Float32 moves it by up to
 * ~4e-5 m at Wake's coordinates, which is enough to flip one object at exactly
 * the range boundary. 26 KB of doubles is not the cost being addressed.
 *
 * `userData.cullCenter`/`cullRadius` stay on the objects — `tagCull` is still
 * their only writer — so any future reader of them is unaffected.
 *
 * The SPAWNER children are deliberately NOT flattened. `Vehicle`'s constructor
 * reparents the driven vehicle out of `spawnersRoot` and `leaveVehicle` puts it
 * back, so that list's membership changes during play; 32 object-based tests a
 * frame are not worth the invalidation. `cull` itself is written only here.
 */
let cullFlat = {
  x: new Float64Array(0), y: new Float64Array(0),
  z: new Float64Array(0), r: new Float64Array(0),
};
function flattenCull() {
  const n = cull.length;
  const x = new Float64Array(n), y = new Float64Array(n);
  const z = new Float64Array(n), r = new Float64Array(n);
  for (let i = 0; i < n; i++) {
    const c = cull[i].userData.cullCenter;
    // `tagCull` gives every entry a centre; a `null` here would have meant
    // "always visible" to the old predicate, so keep that reading exactly.
    if (!c) { r[i] = Infinity; continue; }
    x[i] = c.x; y[i] = c.y; z[i] = c.z;
    r[i] = cull[i].userData.cullRadius || 0;
  }
  cullFlat = { x, y, z, r };
}

// --- static matrices --------------------------------------------------------
//
// `WebGLRenderer.render` opens with `scene.updateMatrixWorld()`, and in three
// r169 that walk recomposes and multiplies EVERY object's world matrix every
// frame: `updateMatrix()` on an auto-updating node flags it changed, and the
// `force` that sets cascades down the whole subtree whether or not anything
// under it moved. Over ~5,100 nodes, twice a frame, it was 18-21% of the
// frame's JS time (features/mesh-viewer-performance, rule 2). The level is
// mostly furniture — terrain tiles, buildings, palms, parked vehicles — that
// never moves once show() has placed it, so those subtrees leave the walk:
// their `updateMatrixWorld` is a no-op unless an ancestor genuinely forces
// it, and the nodes above them (`scene`, the level root, the spawners group)
// stop re-composing matrices they never change, so no force ever arrives.
//
// The contract: anything that moves a frozen node calls
// `updateMatrixWorld(true)` on it, or thaws it. A driven vehicle is thawed
// for the ride (setPilot) and frozen again where it is parked (leaveVehicle,
// setPilot(false)). `__matrixDrift()` under ?shots checks every world matrix
// against a fresh recompute, and the perf harness runs it after a minute of
// walking, firing and turning.
let frozenCount = 0;
// Vehicles a level clip animates while they are parked — the Hatsuzuki's
// radar dish turns under an `ambient` clip — never leave the walk, ride or
// no ride. Found by freezeStatics; `__matrixDrift` is what caught the dish
// standing still.
const neverFrozen = new WeakSet();
const staticUpdateMatrixWorld = function (force) {
  if (force === true) THREE.Object3D.prototype.updateMatrixWorld.call(this, force);
};
function freeze(obj) {
  obj.updateMatrixWorld(true);   // commit wherever it was last posed
  obj.updateMatrixWorld = staticUpdateMatrixWorld;
}
function thaw(obj) {
  if (Object.hasOwn(obj, 'updateMatrixWorld')) delete obj.updateMatrixWorld;
}
/** The spawner child that owns `node`: the vehicle itself, or the one a
 *  nested seat sits in. Null for a node outside the spawners group. */
function spawnerVehicleOf(node) {
  for (let n = node; n; n = n.parent) if (n.parent === spawnersRoot) return n;
  return null;
}
// The subtree a ride thaws and a parking freezes. A seat being driven is not
// under `spawners` any more: `Vehicle`'s constructor (flight.js; ground.js
// extends it) reparents the node onto the level root before setPilot gets to
// thaw it. Looked up through `spawners` alone, the driven vehicle was never
// thawed and never re-frozen: it kept the frozen `updateMatrixWorld` from
// freezeStatics, so everything `applyRig` poses after `applyTransform`'s
// forced update (propeller spin, control surfaces) was drawn a frame late,
// and the pose `reset()` + `applyRig()` leave on a vehicle setPilot(false)
// parks was never committed at all -- `__matrixDrift` read 1.43 on the parked
// Corsair's drawn propeller after one such exit (features/mesh-viewer-performance,
// rule 2). Once reparented, the node is its own vehicle root.
function vehicleRootOf(node) {
  return spawnerVehicleOf(node) ?? node;
}
function thawVehicle(node) {
  const vehicle = vehicleRootOf(node);
  if (vehicle) thaw(vehicle);
}
function freezeVehicle(node) {
  const vehicle = vehicleRootOf(node);
  if (vehicle && !neverFrozen.has(vehicle)) freeze(vehicle);
}
/** Take every level subtree that nothing animates out of the per-frame
 *  matrix walk. Runs once per level, after `root.updateMatrixWorld(true)`
 *  has composed everything where the extract put it. */
function freezeStatics(root) {
  // What moves: bones and skinned cloth (the flags), input-driven `rig`
  // parts, and any node an ambient clip targets, with its ancestors.
  const animated = new Set();
  for (const clip of levelClips) {
    for (const track of clip.tracks) {
      const { nodeName } = THREE.PropertyBinding.parseTrackName(track.name);
      const node = THREE.PropertyBinding.findNode(root, nodeName);
      for (let n = node; n && n !== root; n = n.parent) animated.add(n);
    }
  }
  const moves = obj => obj.isBone || obj.isSkinnedMesh
    || !!obj.userData?.rig || animated.has(obj);
  frozenCount = 0;
  root.matrixAutoUpdate = false;
  for (const child of root.children) {
    if (child === spawnersRoot) {
      child.matrixAutoUpdate = false;
      // Every parked vehicle, rigs and all: none of it moves until someone
      // climbs in, and setPilot thaws the one they climb into. Except the
      // ones a clip keeps moving while parked.
      for (const vehicle of child.children) {
        if (animated.has(vehicle)) { neverFrozen.add(vehicle); continue; }
        freeze(vehicle);
        frozenCount++;
      }
      continue;
    }
    let dynamic = false;
    child.traverse(obj => { if (moves(obj)) dynamic = true; });
    if (dynamic) continue;
    freeze(child);
    frozenCount++;
  }
}

/** The spawner children's distance test, and theirs alone since `applyVisibility`
 *  took the static list onto `cullFlat`: that list's membership moves during
 *  play (a driven vehicle leaves `spawnersRoot` and comes back), and 32 tests a
 *  frame do not pay for keeping a parallel array in step with it. */
function inRange(obj, cam, limit) {
  const c = obj.userData.cullCenter;
  const r = obj.userData.cullRadius || 0;
  if (!c) return true;
  const dx = c.x - cam.x, dy = c.y - cam.y, dz = c.z - cam.z;
  const reach = limit + r;
  return dx * dx + dy * dy + dz * dz <= reach * reach;
}

function applyVisibility() {
  const entire = optEntire.checked;
  const cam = camera.position;
  const limit = drawDistance();
  // The static half runs off `cullFlat` (see `flattenCull`): no `userData`
  // lookup, no `Vector3`, and `.visible` written only when it flips, which on
  // a walking frame is a handful of the 814 rather than all of them. The test
  // itself is the old `inRange` arithmetic unchanged, in doubles.
  // `indexScene` is the only writer of either, and it rebuilds both together;
  // this is the assertion that says so out loud rather than reading `undefined`
  // out of a short array and hiding half a level.
  if (cullFlat.x.length !== cull.length) flattenCull();
  const { x, y, z, r } = cullFlat;
  const cx = cam.x, cy = cam.y, cz = cam.z;
  for (let i = 0; i < cull.length; i++) {
    let shown = entire;
    if (!shown) {
      const dx = x[i] - cx, dy = y[i] - cy, dz = z[i] - cz;
      const reach = limit + r[i];
      shown = dx * dx + dy * dy + dz * dz <= reach * reach;
    }
    const obj = cull[i];
    if (obj.visible !== shown) obj.visible = shown;
  }
  if (!spawnersRoot) return;
  spawnersRoot.visible = optVehicles.checked;
  if (!optVehicles.checked) return;
  for (const vehicle of spawnersRoot.children) {
    vehicle.visible = entire || inRange(vehicle, cam, limit);
  }
}

// --- piloting ---------------------------------------------------------------
//
// The map scene already ships real vehicles at their spawn points, assembled by
// the same assembler the model browser uses and carrying a `rig` extra on every
// input-driven part, plus an empty `<Vehicle>Camera` node at the pilot's eye
// point. Piloting therefore adds no extraction: it drives what is already here.
//
// Control scheme is the game's own (`Settings/Default/Controls/Air.con`): the
// keyboard flies the aircraft and the mouse is a head, not a stick. W/S is
// throttle, A/D is rudder, the arrow keys are the stick — up/down pitch,
// left/right roll. Landing gear is deliberately not bound; in the real game it
// is automatic on altitude thresholds, which `Aircraft.integrate` reproduces.
//
// Freeing the mouse from the stick lets it do what the game's own hold-LShift
// free-look does: swivel the pilot's head inside a cockpit that is still flying
// straight, within the clamps the Corsair's camera declares.
//
// C cycles the view — `c_PIToggleCameraMode`, IDKey_C in the game's own control
// maps — through cockpit, chase, front and fly-by. `VehicleCamera` in flight.js
// owns all four and is explicit about which of them the data actually describes:
// the cockpit, and only the cockpit. Outside it the mouse orbits instead of
// swivelling, and fly-by ignores it entirely.

let aircraft = null;
// The driven land vehicle — `ground.js`'s half of the same seam. At most one
// of `aircraft`/`car` is ever non-null: one seat, one body, one view rig.
let car = null;
// The whole of whatever is currently occupied — `seats.js`'s survey of every
// seat, which seat is active, and (when that seat has one) its `TurretRig`.
// Set for *any* entered `PlayerControlObject`, including a plain `air`/
// `ground`/`tank` root: `aircraft`/`car` above still get built and driven
// exactly as before for those, so every reference to them elsewhere on this
// page keeps working unchanged; `occupancy` is what is new, and what a bare
// gun/seat root or a nested seat (a manned gun) runs on alone.
let occupancy = null;

// ---------------------------------------------------------------------------
// Vehicle damage: shoot a tank, watch it smoke, burn and explode.
//
// The simulation is `vehicle-damage.js`, which is framework-free and tested
// under node (`tests/test_vehicle_damage.py`). Everything here is the scene
// half: which placed object owns which Armor, where a tier's effect hangs, and
// what a wreck looks like.
//
// What the engine does and does not do, from `features/bf1942-engine-reference/`:
//
//   - **A collision costs hit points** (ledger HP-6, reversed 2026-09-19;
//     `subsystems/collision-response.md` section 9). Ramming damages both
//     vehicles by `speedMod x v^2 x` an angle factor `x` the material pair
//     table, at most once a second per pair. That path is `stepVehicleBodies`
//     below, which feeds the same `VehicleDamageSet` a round does.
//   - **A living vehicle re-evaluates its tier every tick** (ARM-1), so this
//     polls rather than latching, and stops polling once the thing is dead.
// ---------------------------------------------------------------------------

// `let`: reassigned to the world's own set at level load (show() keeps the
// alias), so every HUD feed, splash pass and console hook that always reached
// `vehicleDamage` still reaches the same object the world steps.
let vehicleDamage = new VehicleDamageSet();
// owner id -> { node, anchors: Map<effectName, Object3D>, handles: [] }, the
// scene-side bookkeeping a tier change needs to undo.
const damageVisuals = new Map();

/**
 * Register every placed object that carries an `armor` extras block. Most of a
 * level has none — a palm and a sandbag have no Armor at all (ARM-3) — so this
 * is a handful of vehicles and stationary guns out of hundreds of objects.
 */
function registerDamageables(ownerRoots) {
  clearDamageVisuals();
  vehicleDamage.clear();
  // The world registers its side of every Armored owner (its own
  // `vehicleDamage` set IS this array — same object, see show()) and takes
  // the node + a world position for the water pass, so that pass needs no
  // scene graph. A static root never moves, so its registration pose is
  // enough; a hull's position is refreshed from the body world every tick.
  const regPos = new THREE.Vector3();
  for (let owner = 0; owner < ownerRoots.length; owner++) {
    const node = ownerRoots[owner];
    const armorExtras = node?.userData?.armor;
    const vehicle = world.addDamageable(owner, node, armorExtras, {
      name: node?.name || null,
      position: node ? (() => {
        node.updateWorldMatrix(true, false);
        node.getWorldPosition(regPos);
        return [regPos.x, regPos.y, regPos.z];
      })() : null,
    });
    if (vehicle) {
      damageVisuals.set(owner, {
        node,
        anchors: new Map(),
        handles: [],
        spawnDelay: spawnDelayForNode(node),
      });
    }
  }
}

/**
 * Match a placed spawner node to its ObjectSpawner respawn window.
 * Prefer the glb's own `userData.spawner` (stamped at extract); else nearest
 * `objectSpawns` entry in scene.json by vehicle name + position.
 */
function spawnDelayForNode(node) {
  // `byMode` on the stamp when two modes time one pad differently.
  const stamped = spawnerWindow(node?.userData?.spawner, extras?.gameplayMode);
  if (stamped && (Number.isFinite(stamped.minSpawnDelay)
                  || Number.isFinite(stamped.maxSpawnDelay))) {
    const min = stamped.minSpawnDelay ?? stamped.maxSpawnDelay;
    const max = stamped.maxSpawnDelay ?? min;
    return { min, max };
  }
  const spawns = extras?.objectSpawns;
  if (!Array.isArray(spawns) || !spawns.length) return null;
  const want = templateNameOf(node).toLowerCase();
  const pos = node.getWorldPosition(new THREE.Vector3());
  let best = null;
  let bestDist = Infinity;
  for (const spawn of spawns) {
    if ((spawn.vehicle || '').toLowerCase() !== want) continue;
    if (!Number.isFinite(spawn.minSpawnDelay) && !Number.isFinite(spawn.maxSpawnDelay)) {
      continue;
    }
    const [x, y, z] = spawn.position || [];
    const dist = Number.isFinite(x)
      ? Math.hypot(pos.x - x, pos.y - (y || 0), pos.z - z)
      : 0;
    if (dist < bestDist) {
      bestDist = dist;
      best = spawn;
    }
  }
  if (!best) return null;
  const min = best.minSpawnDelay ?? best.maxSpawnDelay;
  const max = best.maxSpawnDelay ?? min;
  return { min, max };
}

/** Drop every running tier effect. Call on a level change. */
function clearDamageVisuals() {
  for (const visual of damageVisuals.values()) {
    for (const handle of visual.handles) handle.stop?.();
    visual.handles.length = 0;
    for (const anchor of visual.anchors.values()) anchor.parent?.remove(anchor);
    visual.anchors.clear();
  }
  damageVisuals.clear();
}

/**
 * An empty node at an `addArmorEffect` offset, parented to the vehicle so the
 * effect rides with it. `EffectPlayer.play`'s `attach` follows an object's world
 * transform and takes no local offset of its own, so the offset has to be a
 * node — which is also what the engine does with these vectors.
 */
function damageAnchor(visual, name, offset) {
  let anchor = visual.anchors.get(name);
  if (!anchor) {
    anchor = new THREE.Object3D();
    anchor.name = `damage:${name}`;
    visual.node.add(anchor);
    visual.anchors.set(name, anchor);
  }
  anchor.position.set(offset?.[0] || 0, offset?.[1] || 0, offset?.[2] || 0);
  anchor.updateMatrixWorld(true);
  return anchor;
}

/** Start the tier's bundles on this vehicle, having stopped whatever ran before. */
function showDamageTier(vehicle, tier) {
  const visual = damageVisuals.get(vehicle.owner);
  if (!visual) return;
  for (const handle of visual.handles) handle.stop?.();
  visual.handles.length = 0;
  if (!tier) return;
  for (const name of tier.names) {
    // Case is not a concern here even though it looks like one: a Sherman
    // authors `e_scrapmetal` and the bundle bakes as `e_ScrapMetal`, but
    // `EffectLibrary` keys on the lowercased name and `get` lowercases its
    // argument — the same case-insensitivity the console language itself has
    // (ledger HP-4, RFA-1).
    const entry = vehicle.effects.find(
      e => e.effect === name && e.hp === tier.threshold);
    const anchor = damageAnchor(visual, name, entry?.offset);
    const handle = effects.play(name, { attach: { object: anchor } });
    if (handle) visual.handles.push(handle);
  }
}

// How long a wreck lies there before it fades, and how long the fade takes.
//
// **Not engine numbers.** What removes a wreck in Refractor, and when, is one of
// the corpus's own open items — `subsystems/hitpoints-and-damage.md` lists the
// wreck lifetime as untraced, and a vanilla level's respawn timing lives in the
// spawner rather than the vehicle. These two are chosen to read right and are
// labelled so nobody mistakes them for findings.
// Linger matches the measured ~10 s wreck lifetime from a live round capture
// (features/round-replay-capture/README.md); fade is still a house rule.
const WRECK_LINGER = 10;  // seconds of wreck before the fade starts
const WRECK_FADE = 2.5;   // seconds of fade                          [HOUSE RULE]

// Wreck glbs, by template name, shared across every vehicle of that type.
const wreckModels = new Map();

/**
 * The template name behind a placed node. GLTFLoader suffixes duplicate names,
 * so Wake's three Shermans arrive as `Sherman`, `Sherman_1` and `Sherman_2` and
 * all three want `Sherman.wreck.glb`.
 */
function templateNameOf(node) {
  // Prefer the control tag: GLTFLoader suffixes duplicate scene names
  // (`Sherman_1`), while `userData.control` stays the template the wreck URL
  // was published under.
  return (node?.userData?.control || node?.name || '').replace(/_\d+$/, '');
}

/**
 * A vehicle just died: put its wreck in the same place and start the
 * linger-then-fade.
 *
 * The wreck is a glb of its own (`models/<Template>.wreck.glb`) — the same file
 * `replay.js` fetches — not an alternative inside the level scene, which ships
 * only the `complex` configuration. The live mesh stays visible until the
 * wreck is parented (or the load fails), so a slow fetch never blanks the pad.
 * Parked vehicles are frozen for perf — anything added under them must call
 * `updateMatrixWorld(true)` or the wreck draws at the identity.
 */
async function wreckVehicle(vehicle) {
  const visual = damageVisuals.get(vehicle.owner);
  if (!visual?.node || visual.wrecked) return;
  visual.wrecked = true;
  visual.wreckAge = 0;
  visual.hidden = [];
  // Whoever was in it dies with it, and that has to happen HERE — before the
  // seat is torn down below — because this is the one place a vehicle dies,
  // whatever killed it (a shell, the burn-down, drowning, the combat area).
  killOccupantInWreck(visual.node);
  retireVehicleBody(vehicle.owner);
  const template = templateNameOf(visual.node);
  try {
    if (!wreckModels.has(template)) {
      wreckModels.set(template, loader.loadAsync(
        `${MODELS_BASE}/${template}.wreck.glb${bust()}`).then(g => g.scene, () => null));
    }
    const scene = await wreckModels.get(template);
    // The vehicle may have been cleared (level change) while the glb was in
    // flight, and `damageVisuals` is rebuilt per level — so re-check.
    if (!scene || damageVisuals.get(vehicle.owner) !== visual) return;
    const wreck = scene.clone(true);
    wreck.name = `wreck:${template}`;
    // Wreck GLBs ship the same armour-region collision hulls as the live
    // model. The models page shows those behind a checkbox; the map always
    // hides them (see `indexScene`). This load path never hit that walk.
    wreck.traverse(obj => {
      if (isCollision(obj)) obj.visible = false;
    });
    // `Object3D.clone` shares materials with the source, so every wreck of a
    // type would fade together — and the source is cached for the next one.
    // Own them here, once, rather than trying to un-share them mid-fade.
    wreck.traverse(obj => {
      if (!obj.material) return;
      obj.material = Array.isArray(obj.material)
        ? obj.material.map(m => m.clone()) : obj.material.clone();
    });
    bindDynamicShading(wreck);
    // Hide the intact mesh only once the wreck is ready to replace it.
    for (const child of visual.node.children) {
      if (child.name?.startsWith('damage:')) continue;
      if (child.visible) { child.visible = false; visual.hidden.push(child); }
    }
    visual.node.add(wreck);
    visual.wreck = wreck;
    // Frozen parked vehicles opt out of the per-frame matrix walk; force one
    // recompute so the wreck inherits the spawn pose (same contract as
    // `damageAnchor`).
    visual.node.updateMatrixWorld(true);
  } catch {
    // No wreck for this template: leave the live mesh up for the linger/fade
    // rather than blanking the pad.
  }
}

/** Scratch for `killOccupantInWreck`'s world reads. */
const wreckDeathPos = new THREE.Vector3();
const wreckDeathQuat = new THREE.Quaternion();
const wreckDeathFwd = new THREE.Vector3();

/**
 * The hull the player is sitting in just exploded, so the player dies with it.
 *
 * Retail's shape, and the reason this is not simply "you cannot drive a wreck":
 * a destroyed `PlayerControlObject` kills its occupants, the client opens the
 * spawn screen on local death (`hitpoints-and-damage.md` §7, `FUN_004933d0` →
 * `SpawnScreenStuff::setVisible(true)`), and between the two there is the beat
 * the player spends watching the thing he was driving burn. HP-15's input gate
 * — the part this page already had — is what happens to a wreck *nobody* is in.
 *
 * Three steps, in this order:
 *
 *   1. read the hull's live pose, because the death cam frames the wreck and
 *      the body is left beside it rather than back where he climbed in;
 *   2. empty the seat (`leaveManned` delegates to `leaveVehicle` whenever the
 *      root has a drivetrain, so one call covers a jeep, a tank, a plane and a
 *      bare manned gun alike);
 *   3. put the suspended on-foot body down at the exit point, kill its Armor
 *      and latch the death cam. From there `onFoot()` owns the rest — the same
 *      countdown and the same `openDeploy()` a death on foot runs through.
 *
 * A free-fly pilot (the debug checkbox, no soldier waiting) has no life to
 * lose: the seat still empties, and the camera goes back to the flythrough.
 */
function killOccupantInWreck(node) {
  if (!occupancy || occupancy.root !== node || soldierDead) return;
  node.updateWorldMatrix(true, false);
  node.getWorldPosition(wreckDeathPos);
  node.getWorldQuaternion(wreckDeathQuat);
  wreckDeathFwd.set(0, 0, -1).applyQuaternion(wreckDeathQuat);
  // The hull's own facing, in the soldier's convention (forward is
  // `(sin yaw, 0, cos yaw)`), so the death cam sits behind the wreck's tail.
  const hullYaw = Math.atan2(wreckDeathFwd.x, wreckDeathFwd.z);
  const exit = exitPoseManned(occupancy);
  leaveManned();
  optPilot.checked = false;
  resetMobileControls();
  if (!(optOnFoot.checked && soldier)) {
    placeCamera();
    updateHud();
    return;
  }
  soldier.collider = collider;
  soldier.spawn(exit.x, exit.y, exit.z, hullYaw);
  prone = false;
  camera.fov = FOOT_FOV;
  camera.near = 0.2;
  camera.updateProjectionMatrix();
  if (handWeapon) handWeapon.rig.visible = true;
  // A body that climbed in at full health still has it; take all of it, so
  // the `soldierArmor.destroyed` latch in `onFoot()` is not what fires the
  // flow a second time (it cannot: `soldierDead` is set below first).
  if (!soldierArmor) soldierArmor = new Armor(SOLDIER_MAX_HP_FALLBACK);
  soldierArmor.applyDamage(soldierArmor.maxHitPoints);
  soldierDead = true;
  deathCamShot = DEATH_CAM.vehicle;
  deathCamTimer = deathCamShot.beat;
  // The wreck, not the corpse, is what this shot is of.
  deathCamTarget = { x: wreckDeathPos.x, y: wreckDeathPos.y, z: wreckDeathPos.z,
                     yaw: hullYaw };
  hud.textContent = 'killed in action';
}

/**
 * Advance the linger-and-fade of every wreck, and remove one once it has gone.
 * Called from `stepVehicleDamage`, so it runs on the same clock as the burn.
 *
 * When the wreck is gone the pad must be walkable again — the collision index
 * still holds the vehicle's baked hull at the spawn pose — and a respawn timer
 * (ObjectSpawner Min/MaxSpawnDelay) starts so a fresh vehicle returns later.
 */
function stepWrecks(dt) {
  for (const [owner, visual] of damageVisuals) {
    if (visual.respawnIn != null) {
      visual.respawnIn -= dt;
      if (visual.respawnIn <= 0) respawnVehicle(owner);
      continue;
    }
    if (!visual.wrecked || visual.removed) continue;
    visual.wreckAge += dt;
    const into = visual.wreckAge - WRECK_LINGER;
    if (into <= 0) continue;
    const opacity = Math.max(0, 1 - into / WRECK_FADE);
    if (visual.wreck) fadeNode(visual.wreck, opacity);
    else {
      // No wreck GLB: fade the intact mesh that stayed visible instead.
      for (const child of visual.node.children) {
        if (child.name?.startsWith('damage:')) continue;
        fadeNode(child, opacity);
      }
    }
    if (opacity > 0) continue;
    // Gone: drop the wreck, open the pad for walking, start the respawn clock.
    visual.removed = true;
    if (visual.wreck) { visual.node.remove(visual.wreck); visual.wreck = null; }
    for (const child of visual.hidden) child.visible = false;
    for (const handle of visual.handles) handle.stop?.();
    visual.handles.length = 0;
    // A hull the body world had moved is answered through the moved-owner
    // path, which ignores the disabled flag; drop that too or the faded wreck
    // stays solid.
    collider?.clearMovedOwner?.(owner, { enable: false });
    collider?.statics?.disableOwner?.(owner);
    visual.respawnIn = spawnDelayFor(visual);
  }
}

/** Seconds until a fresh vehicle replaces this pad, from ObjectSpawner data. */
function spawnDelayFor(visual) {
  const d = visual.spawnDelay;
  if (d) {
    const min = Number.isFinite(d.min) ? d.min : 30;
    const max = Number.isFinite(d.max) ? d.max : min;
    return min + Math.random() * Math.max(0, max - min);
  }
  // Maps extracted before objectSpawns landed: a mid-range house rule.
  return 40;
}

/**
 * Restore a pad after its respawn timer: full HP, live mesh, collision back on.
 * The vehicle sits at its original spawn pose — the engine replaces the object
 * at the ObjectSpawner, it does not drag a wreck home.
 */
function respawnVehicle(owner) {
  const visual = damageVisuals.get(owner);
  const vehicle = vehicleDamage.get(owner);
  if (!visual) return;
  // Someone is still sitting in the empty pad — wait a beat rather than
  // materialising a hull around them.
  if (occupancy?.root === visual.node) {
    visual.respawnIn = 1;
    return;
  }
  visual.respawnIn = null;
  visual.wrecked = false;
  visual.removed = false;
  visual.wreckAge = 0;
  if (visual.wreck) {
    visual.node.remove(visual.wreck);
    visual.wreck = null;
  }
  for (const child of visual.hidden) {
    child.visible = true;
    // No-wreck fallthrough fades these in place; undo that.
    child.traverse(obj => {
      if (!obj.material) return;
      const materials = Array.isArray(obj.material) ? obj.material : [obj.material];
      for (const material of materials) {
        if (!(material.opacity < 1)) continue;
        material.opacity = 1;
        material.transparent = false;
        material.depthWrite = true;
      }
    });
  }
  visual.hidden = [];
  vehicle?.reset();
  if (vehicle) showDamageTier(vehicle, null);
  collider?.statics?.enableOwner?.(owner);
  visual.node.updateMatrixWorld(true);
  respawnVehicleBody(owner);
}

/** Fade a subtree. Its materials are this wreck's own — see `wreckVehicle`. */
function fadeNode(root, opacity) {
  root.traverse(obj => {
    if (!obj.material) return;
    const materials = Array.isArray(obj.material) ? obj.material : [obj.material];
    for (const material of materials) {
      material.transparent = true;
      material.opacity = opacity;
      // An opaque wreck still writes depth; a fading one must not, or it punches
      // a hole in whatever is behind it.
      material.depthWrite = opacity > 0.99;
    }
  });
}

/**
 * The Armor of the vehicle the player is in, or null. Matched by scene node
 * rather than by seat: hit points live on the root object and are shared by
 * every seat (VHUD-8, R2-31), so the driver and the hull gunner read the same
 * number.
 */
// ---------------------------------------------------------------------------
// Vehicles as rigid bodies: ram a parked plane and it moves, and both pay.
//
// Every placed vehicle with a mass is a body in `bodyWorld` (`body-world.js`):
// parked ones stand on their own wheel springs, asleep until something touches
// them; the one under the player takes part through a `DrivenBody` wrapped
// round its drive model. The engine rules - contact finding, the mass-ratio
// push, the friction pass, crash damage - are the framework-free modules;
// everything here is the scene half: which node is which body, writing a
// body's pose back onto its node, and telling the collider where a hull that
// has been shoved now stands so that rounds and boots still meet it.
// ---------------------------------------------------------------------------

/** Crash events, kept only when a test asks for them (`window.__crashLog`). */
let crashLog = null;
/** `_shared/collision-meshes.json`: every collision layer of every vehicle mesh. */
let collisionMeshes = null;
let bodyWorld = null;
// owner -> { node, spec, spawnInverse: Matrix4, moved: boolean }
const bodyScene = new Map();
const _bodyMatrix = new THREE.Matrix4();
const _bodyParentInv = new THREE.Matrix4();
const _bodyFwd = new THREE.Matrix4();
const _bodyInv = new THREE.Matrix4();
const _bodyScale = new THREE.Vector3();

async function loadCollisionMeshes(dir) {
  if (collisionMeshes) return collisionMeshes;
  const ref = extras?.damage;
  if (!ref?.path) return null;
  const path = ref.path.replace(/damage\.json$/, 'collision-meshes.json');
  try {
    collisionMeshes = await fetch(`${MAPS_BASE}/${dir}/${path}${bust()}`)
      .then(r => r.ok ? r.json() : null);
  } catch { collisionMeshes = null; }
  return collisionMeshes;
}

/** A node's world pose as the body modules' `position` + row `axes`. */
function bodyPoseOf(node) {
  node.updateWorldMatrix(true, false);
  const e = node.matrixWorld.elements;
  return {
    position: [e[12], e[13], e[14]],
    axes: [[e[0], e[1], e[2]], [e[4], e[5], e[6]], [e[8], e[9], e[10]]],
  };
}

/** The heightfield as the three functions the body modules ask of the ground. */
function bodyTerrain(heightfield, waterLevel) {
  const normal = [0, 1, 0];
  return {
    height: (x, z) => {
      const h = heightfield.height(x, z);
      return Number.isFinite(h) ? h : -Infinity;
    },
    normal: (x, z, out) => {
      heightfield.normal(x, z, normal);
      out[0] = normal[0]; out[1] = normal[1]; out[2] = normal[2];
      return out;
    },
    material: (x, z) => heightfield.material(x, z),
    waterLevel: Number.isFinite(waterLevel) ? waterLevel : null,
  };
}

/**
 * Whether a placed vehicle becomes a simulated body. Ships stay scenery: a
 * hull afloat is a `FloatingBundle`'s work, which nothing here models, and a
 * woken destroyer would sink through the sea.
 */
function bodySpecFor(node) {
  if (node?.userData?.physics?.vehicleCategory === 'VCSea') return null;
  return describeVehicleParts(node, collisionMeshes);
}

/** Longest a spawned vehicle is given to come to rest: ten seconds of ticks. */
const SETTLE_TICKS = 300;

/**
 * Let every placed vehicle drop onto its springs, before anything is indexed.
 *
 * An ObjectSpawner sits a little above the ground - a Willy's wheels hang
 * 0.2 m clear at its authored pose - and the engine's vehicles are born awake:
 * they fall, settle on their springs and go to sleep about three seconds
 * later. Doing the same here, once, at load, puts each one where the game
 * would have it, a third of a metre lower, so the collision index bakes the
 * hull where it rests and a first touch does not make a parked plane drop.
 * No damage is counted: wheels are what land, and wheels cost nothing.
 */
function settlePlacedVehicles(ownerRoots, heightfield) {
  if (!collisionMeshes || !damageTables || !heightfield) return;
  const world = new BodyWorld({
    tables: damageTables, terrain: bodyTerrain(heightfield, extras?.waterLevel) });
  const settling = [];
  ownerRoots.forEach((node, index) => {
    const spec = node?.userData?.armor ? bodySpecFor(node) : null;
    if (!spec) return;
    const parked = buildParkedVehicle(spec, { ...bodyPoseOf(node), asleep: false });
    world.addParked(index, parked, spec);
    settling.push({ node, body: parked.body });
  });
  for (let tick = 0; tick < SETTLE_TICKS; tick++) {
    world.tick();
    if (tick > 30 && settling.every(s => s.body.sleeping)) break;
  }
  for (const { node, body } of settling) writeBodyPose(node, body);
}

/** Rebuild the body world for the level `buildCollider` just indexed. */
function setupVehicleBodies() {
  bodyScene.clear();
  bodyWorld = null;
  const heightfield = collider?.heightfield;
  if (!collisionMeshes || !damageTables || !heightfield) return;
  // The world owns the BodyWorld and its crash-damage accounting; this page
  // half keeps the scene records and feeds each parked hull in.
  world?.setupBodies({ tables: damageTables,
                       terrain: bodyTerrain(heightfield, collider.waterLevel) });
  bodyWorld = world?.bodyWorld ?? null;
  for (const [owner, visual] of damageVisuals) {
    const spec = bodySpecFor(visual.node);
    if (!spec) continue;
    visual.node.updateWorldMatrix(true, false);
    bodyScene.set(owner, {
      node: visual.node, spec, moved: false,
      spawnInverse: visual.node.matrixWorld.clone().invert(),
    });
    collider.statics?.setBodyOwner?.(owner, true);
    world?.addParkedBody(owner, spec, bodyPoseOf(visual.node));
  }
}

/**
 * The collider a driven vehicle sweeps its hull against: everything the real
 * one holds except other simulated bodies, which the contact solver owns. A
 * swept sphere can only stop dead; the solver pushes, spins and damages.
 */
function bodyAwareCollider() {
  if (!collider || !bodyWorld) return collider;
  const world = collider;
  return Object.create(world, {
    sweepSphere: {
      // The drivable-deck gate is forwarded, not swallowed: this wrapper IS the
      // collider a driven vehicle is handed, so dropping the last two arguments
      // would leave a tank welded to every bridge deck it touched.
      // `skipBodies` stays true whatever the caller says — that is this
      // wrapper's whole job — but the gate is passed straight through.
      value: (ox, oy, oz, dx, dy, dz, maxDist, radius, skipOwner = -1,
              _skipBodies = true, deckStepTop = -Infinity, deckFloorCos = 2) =>
        world.sweepSphere(ox, oy, oz, dx, dy, dz, maxDist, radius, skipOwner,
                          true, deckStepTop, deckFloorCos),
    },
  });
}

/** A crash cost `owner` hit points. Called by the world's BodyWorld callback
 *  BEFORE the damage lands (world.js #onBodyDamage), so the console record
 *  reads the same pre-damage hit points it always did; the world applies the
 *  damage itself right after — this half is the presentation: the record a
 *  `window.__crashLog` check wants and the effect bundle where the impact
 *  was. The destroyed guard is the old skip: a wreck has already died, so the
 *  impact stays silent. */
function onCrashDamage(owner, result, at, other) {
  const vehicle = vehicleDamage.get(owner);
  if (crashLog) {
    crashLog.push({ tick: bodyWorld.ticks, owner, other, damage: result.damage,
      kill: result.kill, cell: result.effectCell, hp: vehicle?.hitPoints ?? null });
    if (crashLog.length > 200) crashLog.shift();
  }
  if (!vehicle || vehicle.destroyed) return;
  const effect = result.effectCell
    ? damageTables?.effects?.[result.effectCell[0]]?.[result.effectCell[1]] : null;
  if (effect) effects.play(effect, { position: [at[0], at[1], at[2]], normal: [0, 1, 0] });
}

/** The player has taken a vehicle: its drive model now stands in for the body. */
function adoptDrivenBody(vehicle) {
  if (!bodyWorld || !vehicle) return;
  const owner = collider?.statics?.ownerOf(vehicle.node) ?? -1;
  const scene = bodyScene.get(owner);
  if (!scene) return;
  world.adoptDriven(owner, vehicle, scene.spec);
  scene.moved = true;
}

/** ... and has left it: it stands on its own springs again, where it was left. */
function releaseDrivenBody(vehicle) {
  if (!bodyWorld || !vehicle) return;
  const owner = collider?.statics?.ownerOf(vehicle.node) ?? -1;
  const scene = bodyScene.get(owner);
  if (!scene || !bodyWorld.get(owner)?.driven) return;
  world.releaseDriven(owner, vehicle, scene.spec, bodyPoseOf(vehicle.node));
}

/** A wreck is scenery and a respawn is a fresh vehicle on its pad. */
function retireVehicleBody(owner) {
  if (!bodyScene.has(owner)) return;
  world.retireBody(owner);
}
function respawnVehicleBody(owner) {
  const scene = bodyScene.get(owner);
  if (!scene || !bodyWorld) return;
  world.removeBody(owner);
  scene.moved = false;
  scene.dirty = false;
  collider?.clearMovedOwner?.(owner, { enable: false });
  // Back on its pad: the engine replaces the object at the ObjectSpawner, and
  // the static index still holds the hull exactly there.
  const node = scene.node;
  _bodyMatrix.copy(scene.spawnInverse).invert();
  if (node.parent) {
    node.parent.updateWorldMatrix(true, false);
    _bodyParentInv.copy(node.parent.matrixWorld).invert();
    _bodyMatrix.premultiply(_bodyParentInv);
  }
  _bodyMatrix.decompose(node.position, node.quaternion, _bodyScale);
  node.updateMatrix();
  THREE.Object3D.prototype.updateMatrixWorld.call(node, true);
  world.addParkedBody(owner, scene.spec, bodyPoseOf(scene.node));
}

/** Write a body's pose onto its node and tell the collider where the hull is. */
function syncBodyNode(owner, scene, body) {
  writeBodyPose(scene.node, body);
  publishMovedHull(owner, scene, scene.node, body.pos);
}

/** A body's world pose, written onto a scene node (which may be frozen). */
function writeBodyPose(node, body) {
  const a = body.axes, p = body.pos;
  _bodyMatrix.set(
    a[0][0], a[1][0], a[2][0], p[0],
    a[0][1], a[1][1], a[2][1], p[1],
    a[0][2], a[1][2], a[2][2], p[2],
    0, 0, 0, 1);
  if (node.parent) {
    _bodyParentInv.copy(node.parent.matrixWorld).invert();
    _bodyFwd.multiplyMatrices(_bodyParentInv, _bodyMatrix);
  } else {
    _bodyFwd.copy(_bodyMatrix);
  }
  _bodyFwd.decompose(node.position, node.quaternion, _bodyScale);
  node.updateMatrix();
  // The node may be frozen (`freeze` swaps `updateMatrixWorld` for a no-op);
  // a body that moves has to go round that, and only that node pays for it.
  THREE.Object3D.prototype.updateMatrixWorld.call(node, true);
}

function publishMovedHull(owner, scene, node, p) {
  _bodyFwd.multiplyMatrices(node.matrixWorld, scene.spawnInverse);
  _bodyInv.copy(_bodyFwd).invert();
  collider.setMovedOwner(owner, _bodyFwd.elements, _bodyInv.elements,
    p[0], p[1], p[2], scene.spec.boundingRadius);
}

/** One body tick of the world, drawn: the world's step() (frame(), above)
 *  already ran the BodyWorld itself — `step.bodyTicks` is the report of it —
 *  and this half only writes the bodies that moved back onto their scene
 *  nodes and tells the collider where a shoved hull now stands. */
function stepVehicleBodies(step) {
  if (!step.bodyTicks || !bodyWorld) return;
  for (const [owner, entry] of bodyWorld.entries) {
    const scene = bodyScene.get(owner);
    if (!scene) continue;
    if (entry.driven) {
      // The contact solver may have pushed the drive model's state; draw it.
      // Unless the render interpolation owns this node, in which case the push
      // is already in the pose it captured at the end of the tick, and
      // re-applying the raw state here would put the hull back on the tick the
      // cameras have just been placed off.
      if (entry.driven.vehicle !== vehicleInterp.vehicle || !vehicleInterp.active) {
        entry.driven.vehicle.applyTransform();
      }
      const s = entry.driven.vehicle.state.position;
      publishMovedHull(owner, scene, scene.node, [s.x, s.y, s.z]);
      continue;
    }
    const body = entry.parked.body;
    if (body.sleeping && !scene.dirty) continue;
    scene.dirty = !body.sleeping;          // one last sync on the tick it falls asleep
    if (!scene.moved) {
      const e = scene.node.matrixWorld.elements;
      const dx = body.pos[0] - e[12], dy = body.pos[1] - e[13], dz = body.pos[2] - e[14];
      if (dx * dx + dy * dy + dz * dz < 1e-6 && body.sleeping) continue;
      scene.moved = true;
    }
    syncBodyNode(owner, scene, body);
  }
}

/* The DamageableVehicle the player is sitting in.
 *
 * `registerDamageables` hands the world the same `(owner, node)` pairs it puts
 * in `damageVisuals`, and the world keeps them in a `nodeOwners` WeakMap — so
 * `World.occupiedDamageable` answers this in one lookup where the loop below
 * walks every Armored object in the level. It is asked twice a frame while
 * seated (the HUD's hit-point bar and the burn-down check in `stepDamage`).
 *
 * The scan is kept for the one state the world cannot answer from: `addPlayer`
 * runs only from `setOnFoot(true)`, so a player who never left free fly and

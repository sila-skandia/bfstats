  const scoped = !!(zoom?.scope && isZoomed());
  if (scoped) {
    vars['CrossHair/ShowCrossHair'] = true;
    vars['CrossHair/ScopeIndex'] = 1;
    vars['CrossHair/SniperSight'] = !!zoom.sniperSight;
    vars['CrossHair/ScopeIcon'] = zoom.icon || 'sniper.tga';
    if (!zoom.sniperSight) {
      // Binoculars branch (SCOPE-3): ring via SightIcon. sightIcon is not yet
      // extracted on weaponStats — fall back to the layout's authored default.
      vars['CrossHair/SightIcon'] = zoom.sightIcon || 'scout_ring_128x128.tga';
    }
  } else {
    vars['CrossHair/ShowCrossHair'] = false;
    vars['CrossHair/ScopeIndex'] = 0;
  }
  const magazine = hw.data?.magazine;
  const hudAmmo = (hw.data?.hudAmmo || '').toLowerCase();
  const ammoHud = hw.data?.hud;
  const ammoType = AMMO_TYPE_CODES[hudAmmo];
  // Every branch below only ever WRITES, so without this a weapon swap left
  // the previous weapon's leaves behind: switch off a bazooka and its rocket
  // icon stayed in `SoldierAmmoIcon`, switch to a knife (`ATNone`, which no
  // branch feeds) and the rifle's `AmmoType 1` kept the whole magazine panel
  // on screen. Harmless while only two branches existed and only one of them
  // fed an icon; not once every type in HUD-10's enum is reachable. Cleared
  // to undefined rather than to a zero, which is the painter's own rule.
  for (const name of SOLDIER_AMMO_VARS) delete vars[name];
  if (hudAmmo === 'atammobar' && magazine) {
    // R1-19/HUD-9, the magazine-bar branch. PrimaryAmmo is the loaded round
    // count (top-right, "14" in the retail shot); PrimaryMag is a SEPARATE
    // int, the spare-magazine count (bottom-right small box, "5") — the two
    // numbers verify-r1.md's report was asked to settle, and they are not
    // the same count.
    vars['Ammo/AmmoType'] = 1;
    vars['Ammo/PrimaryAmmo'] = hw.rounds;
    vars['Ammo/MaxPrimaryAmmo'] = magazine.size;
    vars['Ammo/PrimaryMag'] = hw.mags;
    // OPEN: no `.con` word or client write-site for SoldierAmmoHasMag turned
    // up in R1's survey; fed true unconditionally so the spare-count readout
    // shows at all for a magazine weapon — an assumption this file is making,
    // not a confirmed engine default.
    vars['Ammo/SoldierAmmo/SoldierAmmoHasMag'] = true;
    // The weapon's own bar art/size (weaponStats.hud), tolerant per HUD-1:
    // absent leaves hud-layout.json's own literal (vanilla's rifle-style bar).
    if (ammoHud?.ammoBar) vars['Ammo/SoldierAmmo/SoldierAmmoBar'] = ammoHud.ammoBar;
    if (ammoHud?.ammoBarFill) vars['Ammo/SoldierAmmo/SoldierAmmoBarFill'] = ammoHud.ammoBarFill;
    if (ammoHud?.ammoBarSize) vars['Ammo/SoldierAmmo/SoldierAmmoBarSize'] = ammoHud.ammoBarSize;
  } else if (ammoType >= 2) {
    // Every icon-style type. HUD-10 closed the enum: the `.meme` value and
    // the `.con` value are THE SAME enumeration, so the weapon's own
    // `setHudAmmoType` goes straight through with no converter to write.
    //
    // The one real change is `ATIcon`, which this fed as **6** on the
    // reasoning that 6 and 7 painted identically and the choice was
    // arbitrary. It is 2, and it is not arbitrary: the layout's `{2,3,4,5}`
    // group draws the rounds text (gated `ne 4 && ne 5 && ne 6`) where the
    // `{6,7}` group does not, so a Bazooka, Panzerschreck, ExpPack,
    // Detonator or Landmine was showing an icon with no rocket count beside
    // it. 6 is `ATIconAndHeatBar`, which in vanilla is the MedPack alone.
    //
    // `Ammo/PrimaryAmmo` is fed for every type whose layout branch prints it,
    // and left alone for the two that do not (4 `ATIconAndReloadBar`, the
    // RepairPack; 5 `ATIconNoText`).
    vars['Ammo/AmmoType'] = ammoType;
    if (AMMO_TYPES_WITH_ROUNDS.has(ammoType)) vars['Ammo/PrimaryAmmo'] = hw.rounds;
    if (ammoHud?.icon) vars['Ammo/SoldierAmmo/SoldierAmmoIcon'] = ammoHud.icon;
  }
  // `ATNone` (0, the two knives) and anything unrecognised leave
  // `Ammo/AmmoType` unset: every soldierAmmo leaf requires it, so the whole
  // panel culls rather than guessing a shape for a weapon this file cannot
  // classify. For a knife that is also what the engine does -- 0 is tested by
  // no layout branch at all.
}

/** Announce the view C just selected, then fall back to the control list. */
const VIEW_BLURB = {
  cockpit: 'cockpit · first person, from the pilot\'s eye point',
  chase: 'chase · behind and above, horizon held level',
  front: 'front · ahead of the nose, looking back',
  flyby: 'fly-by · planted in the world, re-plants as you pull away',
};
let hudViewTimer = 0;
function showView(mode) {
  hud.textContent = `view: ${VIEW_BLURB[mode]}`;
  clearTimeout(hudViewTimer);
  hudViewTimer = setTimeout(updateHud, 2200);
  // Seat poses only draw in external views — hide in the cockpit (CVMInside),
  // since the player is looking out from the pilot's eyes, not at the seat.
  updateSeatPoseVisibility();
}

// The stick spring itself lives in world.js next to the aircraft path that
// spends it (STICK_RATE / STICK_RETURN, moved verbatim); the page's resets
// below delegate to `world.resetStick`.

/**
 * Read the keyboard into the aircraft and step the flight model.
 *
 * Round 3's first disclosed gap, `drive()`'s own twin: the world's
 * occupied-vehicle step runs every tick the aircraft exists, not only while
 * its own root/pilot seat is the one active, so a nested seat of a flyable
 * root (a rear-gunner position, once one is enterable) cannot stop the
 * airframe's own momentum and aerodynamics from integrating. Reading fresh
 * stick/rudder/throttle input and moving the camera stay exclusive to the
 * ticks the pilot's own root seat is actually the one occupied (`flying`
 * below).
 */
function pilot(dt) {
  if (!aircraft) return;
  // The world has already run this function's old sim half (world.js
  // #vehicleTick) with its own copy of every rule and comment above: the
  // HP-15 gate is read and `driving`/`flying` below reads its answer; the
  // throttle latch, the `axisToward` rudder and stick spring (STICK_RATE /
  // STICK_RETURN now live beside it in world.js, unchanged), the triggers,
  // `aircraft.integrate`, `occupancy.applyTurrets`, the wreck-safe pump/aim
  // of the turret (the look stage is pumped once a frame in frame(), the rig
  // is aimed and stepped once per world tick — the page's own per-tick
  // `stepTurret` loop), and the `vehicleGuns` loop with the unconditional-off
  // `setFiring` semantics. The shell here is the presentation half.
  const flying = occupancy.isActiveRoot() && !vehicleInput.blocked;
  guns.firstPerson = aircraft.firstPerson;
  if (!flying) return;
  // The view rig owns all four modes and their smoothing; this just takes the
  // pose. It runs after the world integrated, so an external camera hangs off
  // this frame's attitude rather than last frame's — at 55 m/s that is a metre
  // of lag, and on a chase camera it reads as the aircraft sliding around
  // inside the frame.
  const pose = view.update(dt);
  camera.position.copy(pose.position);
  camera.quaternion.copy(pose.quaternion);
}

function wireframe(on) {
  if (!currentRoot) return;
  currentRoot.traverse(obj => {
    if (!obj.isMesh || isCollision(obj)) return;
    for (const m of [obj.material].flat()) m.wireframe = on;
  });
}

async function loadSky(entry) {
  disposeSky();
  const faces = extras.skybox;
  if (!faces || faces.length !== 6) return;
  const dir = entry.glb.replace(/\/[^/]+$/, '');
  const tex = await cubeLoader.loadAsync(
    faces.map(f => `${MAPS_BASE}/${dir}/${f}${bust()}`),
  );
  tex.colorSpace = THREE.SRGBColorSpace;
  skybox = tex;
}

// LoadingManager counters are cumulative for the life of the page and never
// reset, so a per-load view has to be taken against a baseline captured when
// that load starts.
const tex = { total: 0, loaded: 0, baseTotal: 0, baseLoaded: 0, load: null };

function texReport() {
  if (!tex.load) return;
  const total = tex.total - tex.baseTotal;
  const done = tex.loaded - tex.baseLoaded;
  tex.load.count('textures', done, total);
  if (total > 0 && done >= total) {
    tex.load.end();
    tex.load = null;
  }
}

texManager.onStart = (url, loaded, total) => {
  tex.loaded = loaded;
  tex.total = total;
  texReport();
};
texManager.onProgress = (url, loaded, total) => {
  tex.loaded = loaded;
  tex.total = total;
  texReport();
};
// Loose textures — lightmap atlases, the terrain detail map, sky and water —
// can land after show() has warmed the level. Each drained queue puts what
// arrived on the GPU there and then, between frames, so the frame that first
// binds one is not also its upload (rule 6).
const textureQueueWaiters = [];
texManager.onLoad = () => {
  uploadTextures(scene);
  for (const resolve of textureQueueWaiters.splice(0)) resolve();
};
function textureQueueDrained() {
  return tex.loaded >= tex.total
    ? Promise.resolve()
    : new Promise(resolve => textureQueueWaiters.push(resolve));
}

// ---------------------------------------------------------------------------
// The map art. The HUD minimap and the fullscreen map are the same picture at
// different sizes and zooms — that is what the engine does too: `menu/InGame`
// hot-swaps one picture node built from a single `Textures/InGameMap.tga`
// path, and there is no second map asset anywhere in the archives.
//
// The art frames the level's *active combat area*, not the world. `scene.json`
// carries the projection as an affine so the viewer never re-derives it:
//     u = m[0]*x + m[1]*z + m[2]
//     v = m[3]*x + m[4]*z + m[5]
// with (x, z) in glTF world metres and (u, v) in 0..1 from the top left.
// ---------------------------------------------------------------------------
const minimapBox = document.getElementById('minimap');
const minimapCanvas = document.getElementById('minimap-canvas');
const fullmapBox = document.getElementById('fullmap');
const fullmapCanvas = document.getElementById('fullmap-canvas');
// The CSS widths of the two map canvases, kept by a ResizeObserver so no
// frame asks layout for them: `getBoundingClientRect` after the frame's own
// DOM writes forces a synchronous layout, 1.4-1.8% of the on-foot frame on
// its own (features/mesh-viewer-performance, rule 3). A canvas the observer
// has not reported yet — or reports at 0 because it is hidden — falls back
// to one measured read, so the first frame after the map opens is right.
const canvasCssWidth = new Map();
const canvasObserver = new ResizeObserver(entries => {
  for (const entry of entries) {
    const width = entry.contentRect.width;
    // A 0 here means `display: none` — the box the surface lives in is hidden —
    // and it is reported at the end of the frame that hid it. Dropping the
    // entry rather than caching the 0 is what lets the frame that UNHIDES the
    // surface measure it, in that same frame, before this observer has had a
    // chance to speak: the alternative paints one frame into the previous
    // backing size (confirmed: 283 px instead of 562). Neither painter reads a
    // width while its own box is hidden, so nothing else is asking meanwhile.
    if (width) canvasCssWidth.set(entry.target, width);
    else canvasCssWidth.delete(entry.target);
  }
});
canvasObserver.observe(minimapCanvas);
canvasObserver.observe(fullmapCanvas);
function cssWidthOf(canvas) {
  const known = canvasCssWidth.get(canvas);
  // `!== undefined`, not truthiness, and a measured 0 is cached too: a width
  // of 0 is an ANSWER, and treating it as a miss meant `getBoundingClientRect`
  // — a synchronous layout, rule 3 — ran again on every call that got one, for
  // exactly the surface this cache exists to keep off the frame path. The
  // observer above never stores a 0 (see there), so the only way to hold one is
  // to have measured it, and the observer overwrites that the moment the box
  // has a size.
  if (known !== undefined) return known;
  const measured = canvas.getBoundingClientRect().width;
  canvasCssWidth.set(canvas, measured);
  return measured;
}
const fullmapName = document.getElementById('fullmap-name');
const fullmapMeta = document.getElementById('fullmap-meta');

// How much of the map the HUD window shows. The engine's zoom steps were not
// recovered from the binary, so this is a viewer choice: a quarter of the
// combat area keeps a 2 km level readable without losing the grid letters.
const MINIMAP_SPAN = 0.25;
// Sprite scale in CSS pixels, multiplied by the canvas's own backing ratio so
// a flag is the same size on the 188 px HUD widget as on the fullscreen map
// and stays put on a hidpi display.
const MARKER_SCALE = 1.25;
// Only for the moment before the sprite pack lands: a dot in the side's colour
// so a level opened on a cold cache is not a bare grid.
const TEAM_FILL = { 1: '#d2564b', 2: '#4f8fd0', 0: '#9a9a9a' };

let mapArt = null;          // HTMLImageElement once the PNG has decoded
let mapArtToken = 0;        // guards against a slow load landing after a switch

// --- the sprite pack --------------------------------------------------------
//
// Every marker on every map surface is the game's own sprite out of
// `menu.rfa`: `extract_hud_pack.py` decodes them into `maps/_shared/hud/`
// for vanilla and into `maps/mods/<mod>/_shared/hud/` for whatever a mod
// repaints, and `hudPaths` above picks between the two per file. So an Eve
// of Destruction level flies the NVA and Viet Cong flags its own archives
// hold, over the vanilla bezel and rings it never touched. `hud.json` names
// the sprites and carries the flag-mesh-to-nation table (EoD's own, which
// is why `flagso_m1` resolves differently there); `minimap-icons.json` is
// `ObjectTemplate.setMinimapIcon` per vehicle template, read from the mod's
// own `Objects.rfa` chain. They are point art and are drawn unsmoothed at
// whole multiples where the surface allows.
const hudPack = { sprites: new Map(), icons: {}, nations: {} };

/** The player marker ships as a black cut-out — a solid arrowhead inside a
 *  translucent disc, colour left to the engine. Painted once the way the HUD
 *  shows it, grey disc and green arrow, and kept as a canvas. */
function tintPlayerRing(img) {
  const c = document.createElement('canvas');
  c.width = img.width;
  c.height = img.height;
  const ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0);
  const data = ctx.getImageData(0, 0, c.width, c.height);
  const px = data.data;
  for (let i = 0; i < px.length; i += 4) {
    const a = px[i + 3];
    if (!a) continue;
    if (a >= 200) {
      px[i] = 118; px[i + 1] = 214; px[i + 2] = 92;
    } else {
      px[i] = 214; px[i + 1] = 214; px[i + 2] = 208;
      px[i + 3] = Math.min(215, Math.round(a * 1.45));
    }
  }
  ctx.putImageData(data, 0, 0);
  return c;
}

async function loadHudPack() {
  let manifest, icons;
  try {
    [manifest, icons] = await Promise.all([
      fetch(`${hudPaths.url('hud.json')}${bust()}`).then(r => r.json()),
      fetch(`${hudPaths.url('minimap-icons.json')}${bust()}`).then(r => r.json()),
    ]);
  } catch (error) {
    // The surfaces still draw — fallback dots, no chrome — so this is a
    // warning, not a failure.
    console.warn('hud sprite pack unavailable', error);
    return;
  }
  hudPack.nations = manifest.flagMeshNation || {};
  hudPack.icons = icons || {};
  for (const [name, entry] of Object.entries(manifest.sprites || {})) {
    const img = new Image();
    img.onload = () => {
      hudPack.sprites.set(name, name === 'minimap_icon_ring_32x32'
        ? tintPlayerRing(img) : img);
      if (deployActive()) {
        paintDeploySoon();
        // The spawn rings draw with these sprites (with a stroked-circle
        // fallback); once the real ring lands, put it on the map at once.
        drawFullMap(true);
      }
    };
    img.onerror = () => {};
    img.src = `${hudPaths.url(entry.file)}${bust()}`;
  }
}
loadHudPack();

const sprite = name => hudPack.sprites.get(name) || null;

// The in-game HUD painter (hud.js), sharing this same sprite pack rather than
// fetching its own copy. `gameHud`, not `hud`: that name is already the
// `#hud` hint-line DOM element throughout this file. Published unconditionally
// on `window.__hud` — not only under `?shots` — because that is the whole of
// the round-2 contract other tracks (seats.js, supply.js, armor.js) write
// their own variables through: `window.__hud.vars['Vehicle/VehicleIcon'] =
// ...`, once those tracks land.
const hudCanvas = document.getElementById('hud-canvas');
const gameHud = new Hud({ canvas: hudCanvas, sprite,
                          base: rel => hudPaths.url(rel), bust });

/* The sun's lens flare. `lens-flare.js` carries the engine reading and the
 * placement arithmetic; this is the painter and the texture cache.
 *
 * Nothing draws on a vanilla level, and that is correct rather than broken:
 * the five textures all 21 vanilla declarations name ship in no vanilla
 * archive (the module's header lists every place they were looked for and the
 * two mod archives that do have them). The extractor records them in
 * `missingTextures` and leaves each sprite's `file` null, so `hasDrawableFlare`
 * is false and the whole pass is skipped.
 */
const flareCanvas = document.getElementById('flare-canvas');
const flareImages = new Map();          // file -> HTMLImageElement, once loaded
let flareData = null;

function setupLensFlare(dir) {
  flareData = null;
  flareImages.clear();
  const ctx = flareCanvas.getContext('2d');
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, flareCanvas.width, flareCanvas.height);
  const data = extras.lensFlare;
  if (!hasDrawableFlare(data)) return;
  flareData = data;
  for (const file of flareTextureFiles(data)) {
    const img = new Image();
    img.onload = () => flareImages.set(file, img);
    img.onerror = () => {};
    img.src = `${MAPS_BASE}/${dir}/${file}${bust()}`;
  }
}

/** The sun's own screen position, and whether anything is in front of it.
 *  The direction is the level's `sunLightDirectionVec`, the same vector the
 *  DirectionalLight and the sky are aimed by; the sun itself is painted into
 *  the sky box faces, so this is where that painted disc lands. */
function sunScreenPosition() {
  const sd = extras.sunDirection;
  if (!sd) return null;
  const norm = Math.hypot(sd[0], sd[1], sd[2]) || 1;
  // `show()` places the light at -sunDirection * 400, i.e. the sun is in the
  // direction the light points FROM.
  const dir = new THREE.Vector3(-sd[0] / norm, sd[1] / norm, -sd[2] / norm);
  // Is it in front of the camera? Asked in VIEW space, where -z is forward.
  // Not by projecting a far-off point and testing its ndc z: the sun is
  // effectively at infinity and every level's far plane is short (Berlin's is
  // 105 m), so such a point is always past the far plane and its ndc z always
  // reads > 1 — which is how this first drew nothing at all.
  const view = dir.clone().applyMatrix3(
    new THREE.Matrix3().setFromMatrix4(camera.matrixWorldInverse));
  if (view.z >= 0) return null;
  // Now project a point that is inside the frustum but along the same ray, so
  // the perspective divide gives the direction's own screen position.
  const projected = dir.clone()
    .multiplyScalar(camera.near + (camera.far - camera.near) * 0.5)
    .add(camera.position)
    .project(camera);
  const w = flareCanvas.width;
  const h = flareCanvas.height;
  const x = (projected.x * 0.5 + 0.5) * w;
  const y = (-projected.y * 0.5 + 0.5) * h;
  // How far off centre, normalised so the screen corner is 1 — what
  // `setFlareDistFadeScale` fades against.
  const dist = Math.hypot(x - w / 2, y - h / 2) / (Math.hypot(w, h) / 2);
  return { sunX: x, sunY: y, sunDistance: dist, visible: true };
}

function paintLensFlare() {
  if (!flareData) return;
  const width = renderer.domElement.width;
  const height = renderer.domElement.height;
  if (flareCanvas.width !== width || flareCanvas.height !== height) {
    flareCanvas.width = width;
    flareCanvas.height = height;
  }
  const ctx = flareCanvas.getContext('2d');
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, width, height);
  const view = sunScreenPosition();
  if (!view) return;
  const sprites = flareSprites(flareData, {
    ...view, width, height,
    // Not a real occlusion test: nothing here traces the sun against the
    // scene. Left at 1 rather than faked — a guessed occlusion would flicker
    // the whole flare on geometry it never actually checked.
    occlusion: 1,
    textureSize: file => {
      const img = flareImages.get(file);
      return img ? Math.max(img.naturalWidth, img.naturalHeight) : 0;
    },
  });
  for (const sprite of sprites) {
    const img = flareImages.get(sprite.file);
    if (!img) continue;
    ctx.globalCompositeOperation = sprite.additive ? 'lighter' : 'source-over';
    ctx.globalAlpha = sprite.color[3];
    ctx.save();
    ctx.translate(sprite.x, sprite.y);
    if (sprite.rot) ctx.rotate(sprite.rot);
    ctx.drawImage(img, -sprite.size / 2, -sprite.size / 2, sprite.size, sprite.size);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}
gameHud.load();
window.__hud = gameHud;

/** Draw a sprite centred on (x, y) at `sc` times its own pixels. Returns
 *  false when the pack has not delivered it yet, so callers can fall back. */
function drawSprite(ctx, name, x, y, sc, { angle = 0, alpha = 1 } = {}) {
  const img = sprite(name);
  if (!img) return false;
  const w = img.width * sc;
  const h = img.height * sc;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y);
  if (angle) ctx.rotate(angle);
  ctx.drawImage(img, -w / 2, -h / 2, w, h);
  ctx.restore();
  return true;
}

/** `cpNation`/`teamNation` proper live in `nation.js`, free of this file's
 *  `three` scene state so they can be tested under node
 *  (`tests/nation_harness.mjs`) and shared byte-for-byte with the rule
 *  `extract_menu_layout.py` runs when it writes `menu-levels.json`. These
 *  two feed them this page's own state: the mod's flag-mesh table and, for
 *  a side with no control point of its own, the vehicle-based guess. */
function cpNation(cp) {
  return cpNationRule(cp, hudPack.nations);
}

function teamNation(team) {
  return teamNationRule(extras.controlPoints || [], team, hudPack.nations,
                        nationFromVehicles(team));
}

/* The ticket counter.
 *
 * `ShowTicket` gates one top-level entry of `menu/InGame` — a sibling of the
 * spawn screen's `Kit/ShowKit`, not a child of it — so the game draws the same
 * nine leaves over the live world and over the deploy screen. Both painters
 * here read that one group: `hud.js` picks it up from `hud-layout.json`
 * generically (the group is new there this round; `extract_hud_layout.py`),
 * and `paintDeployChrome` draws it beside the spawn group.
 *
 * The counts are `scene.json.tickets`, parsed by `bf42/level.py` out of the
 * level's own `GameTypes/<mode>.con` (`Game.setNumberOfTickets`). Team 1 is
 * Axis and team 2 Allied, the reading this file already uses everywhere else
 * (`flag.team === 1 ? 'Axis' : ...`).
 *
 * These are ROUND-START values and they do not move. What a live bleed would
 * need is in `features/bf1942-3d-models/tickets-hud.md`; the short of it is
 * that a ticket is lost per death and per `Game.setTicketLostPerMin` while the
 * other side holds more than half the flags, neither of which this viewer
 * simulates — so a counting-down number here would be a fiction, and a frozen
 * one is at least the number the round genuinely starts at.
 */
function ticketFlagTexture(team) {
  // The layout's own literal is `flag_ticket_ger.tga` and the pack ships
  // brit/can/ger/jp/rus/us. `teamNation` answers in exactly those codes.
  return `flag_ticket_${teamNation(team)}.tga`;
}

/* The four strings the group needs, memoised on the level.
 *
 * `feedTicketVars` runs from `updateSoldierHud` BEFORE every one of its early
 * returns, so it is on the frame path in every mode — and every input it reads
 * is level data that cannot move under it. The counts are the ROUND-START
 * values the comment above describes (nothing in this page writes
 * `extras.tickets`; a future bleed would replace the `extras` object, which is
 * part of the key below, but one that mutated the counts IN PLACE would have to
 * bump the key here too). The two flag textures are `teamNation`, which is the
 * flag a side's control points fly.
 *
 * Unmemoised that cost, twice per frame: `nationFromVehicles` lowercasing all
 * 32 of Wake's spawner names into a Set, spreading that Set into a fresh array
 * once per nation stem inside a `.some`, and building a template literal per
 * name per stem; `teamNationRule` building a Map and re-scanning the control
 * points; and two `String()` conversions. `stanceNation` above already
 * memoises the identical rule for the stance icon for exactly this reason
 * (features/mesh-viewer-performance, rule 5).
 *
 * The key is every input that can move: the level directory; the gameplay-mode
 * `extras` (`show()` assigns `selectGameMode`'s fresh object roughly a hundred
 * lines before `currentDir`, so the dir alone is not enough on its own terms
 * even though no frame runs between the two); the flag-mesh table, which
 * `loadHudPack` fills asynchronously and can land after a level does; and the
 * spawner group, which `indexScene` rebuilds per level.
 *
 * That last one is also why this must NOT be recomputed per frame rather than
 * merely why it can be cached: `Vehicle`'s constructor reparents the driven
 * vehicle OUT of `spawnersRoot`, so a per-frame `nationFromVehicles` would flip
 * Wake's Axis ticket flag from Japanese to German for as long as a player sits
 * in the level's only Zero. Keying on the group's identity — not its contents —
 * holds the round-start answer for the whole round, which is the one the game
 * shows.
 */
let ticketMemoDir = null;
let ticketMemoExtras = null;
let ticketMemoNations = null;
let ticketMemoSpawners = null;
const ticketMemo = {
  show: false, axis: '', allied: '', axisFlag: '', alliedFlag: '',
};
function ticketMemoFor() {
  if (ticketMemoDir === currentDir && ticketMemoExtras === extras
      && ticketMemoNations === hudPack.nations
      && ticketMemoSpawners === spawnersRoot) {
    return ticketMemo;
  }
  ticketMemoDir = currentDir;
  ticketMemoExtras = extras;
  ticketMemoNations = hudPack.nations;
  ticketMemoSpawners = spawnersRoot;
  const t = extras.tickets;
  // Both counts or none: the group draws two numbers side by side and a lone
  // one would leave the layout's own sample literal ("300"/"500") showing
  // next to a real value, which reads as data rather than as a gap.
  ticketMemo.show = !!t && t.team1 != null && t.team2 != null;
  ticketMemo.axis = ticketMemo.show ? String(t.team1) : '';
  ticketMemo.allied = ticketMemo.show ? String(t.team2) : '';
  ticketMemo.axisFlag = ticketMemo.show ? ticketFlagTexture(1) : '';
  ticketMemo.alliedFlag = ticketMemo.show ? ticketFlagTexture(2) : '';
  return ticketMemo;
}

/** Fill in the `ShowTicket` group's variables on a table. Returns whether the
 *  group will draw. */
function feedTicketVars(vars) {
  const memo = ticketMemoFor();
  if (!memo.show) {
    vars['ShowTicket'] = false;
    return false;
  }
  vars['ShowTicket'] = true;
  vars['AxisTicket'] = memo.axis;
  vars['AlliedTicket'] = memo.allied;
  vars['AxisTicketFlag'] = memo.axisFlag;
  vars['AlliedTicketFlag'] = memo.alliedFlag;
  // The two red 50%-alpha quads over the numbers are the engine's low-ticket
  // warning, and it is a live-round state on a timer nothing here runs.
  // Fed false rather than left unfed so the leaves cull deterministically
  // instead of on whatever happened to be in the table.
  vars['Ticket/ShowAxisTicketBlink'] = false;
  vars['Ticket/ShowAlliedTicketBlink'] = false;
  return true;
}

function loadMapArt(dir) {
  mapArt = null;
  const token = ++mapArtToken;
  const rel = extras.minimap?.image;
  minimapBox.hidden = !extras.minimap;
  if (!rel) return;
  const img = new Image();
  img.onload = () => {
    if (token !== mapArtToken) return;
    mapArt = img;
    // The deploy screen may already be up over a half-decoded art: repaint
    // rather than wait for the 250 ms staleness gate.
    if (deployActive()) drawFullMap(true);
  };
  // A level with no art still gets markers on a blank grid, so a failed
  // decode is not worth surfacing.
  img.onerror = () => {};
  img.src = `${MAPS_BASE}/${dir}/${rel}${bust()}`;
}

function projectToArt(x, z) {
  const m = extras.minimap?.worldToImage;
  if (!m) return null;
  return { u: m[0] * x + m[1] * z + m[2], v: m[3] * x + m[4] * z + m[5] };
}

/** Grid reference under a world position, the way the art is lettered: A-H
 *  across, 1-8 down. The labels are painted into the image, so this only has
 *  to agree with them, not with any engine call. */
function gridRef(x, z) {
  const p = projectToArt(x, z);
  if (!p || p.u < 0 || p.u > 1 || p.v < 0 || p.v > 1) return '—';
  const col = Math.min(7, Math.max(0, Math.floor(p.u * 8)));
  const row = Math.min(7, Math.max(0, Math.floor(p.v * 8)));
  return `${'ABCDEFGH'[col]}${row + 1}`;
}

/** Camera heading as a screen-space angle, 0 pointing up the image.
 *
 *  Taken from the camera's world direction rather than `look.yaw` so it stays
 *  correct in the pilot and vehicle camera modes, which drive the camera by
 *  quaternion and never touch `look`. The image's V axis grows with glTF +Z,
 *  so "up the image" is -Z. */
const headingVec = new THREE.Vector3();
function cameraHeading() {
  camera.getWorldDirection(headingVec);
  return Math.atan2(headingVec.x, -headingVec.z);
}

/** Open-map quad alpha from BfMap__update: (+0x4c)*0.8*(+0x54), with
 *  +0x54 = 1 - setMinimapTransparency/100 (default 20 → 0.80). Steady
 *  visible fade (+0x4c→1) gives 0.64. Ledger MEME-10 / gap-research-meme10. */
const SPAWN_MAP_ALPHA = 0.8 * (1 - 20 / 100);

/** The art, three ways. The spawn screen dims it to a silhouette on
 *  near-black; the HUD widget leaves the world showing through, the game's
 *  own `setMinimapTransparency` default; the plain M map draws it as is. */
function drawArt(ctx, size, u0, v0, span, opts) {
  ctx.clearRect(0, 0, size, size);
  ctx.fillStyle = opts.dim ? '#05070b'
    : opts.translucent ? 'rgba(13, 15, 16, .78)' : '#0d0f10';
  ctx.fillRect(0, 0, size, size);
  if (!mapArt) return;
  const sx = u0 * mapArt.width;
  const sy = v0 * mapArt.height;
  const sw = span * mapArt.width;
  const sh = span * mapArt.height;
  ctx.globalAlpha = opts.dim ? SPAWN_MAP_ALPHA : opts.translucent ? 0.85 : 1;
  ctx.drawImage(mapArt, sx, sy, sw, sh, 0, 0, size, size);
  ctx.globalAlpha = 1;
}

/** A control point is its flag sprite: `conp_<nation>` for one that can
 *  change hands, the red-ringed `baseflag_conp_<nation>` for a main base,
 *  `conp_neutral` for one nobody holds. Kasserine's flagless capture zones
 *  get the same icon — the map marks the point, not the cloth. A flag mesh
 *  this pack has no art for (`cpNation` -> `'unknown'`, Pathet Lao's
 *  `flagpl_m1`) gets the same neutral plate rather than another nation's
 *  flag — the pack's own stand-in for a team it cannot draw. */
function drawControlPoint(ctx, cp, px, py, sc) {
  const raw = cp.team ? cpNation(cp) : null;
  const nation = raw && raw !== 'unknown' ? raw : null;
  const name = !nation ? 'conp_neutral'
    : cp.unableToChangeTeam ? `baseflag_conp_${nation}` : `conp_${nation}`;
  if (drawSprite(ctx, name, px, py, sc)) return;
  ctx.fillStyle = TEAM_FILL[cp.team] || TEAM_FILL[0];
  ctx.beginPath();
  ctx.arc(px, py, 4 * sc, 0, Math.PI * 2);
  ctx.fill();
}

/** The vehicles, by template: every `spawners` child in the scene carries its
 *  template name, and `minimap-icons.json` says which silhouette that template
 *  declared. A template with no icon of its own is a vehicle dot, the way the
 *  HUD marks anything it has no picture for. */
const vehiclePos = new THREE.Vector3();
const vehicleQuat = new THREE.Quaternion();
const vehicleFwd = new THREE.Vector3();
function drawVehicles(ctx, toPx, sc) {
  if (!spawnersRoot) return;
  for (const vehicle of spawnersRoot.children) {
    vehicle.getWorldPosition(vehiclePos);
    const p = projectToArt(vehiclePos.x, vehiclePos.z);
    if (!p) continue;
    const q = toPx(p);
    const entry = hudPack.icons[vehicle.name.toLowerCase()];
    const icon = entry?.icon && !entry.icon.startsWith('flag_') ? entry.icon : null;
    // The silhouettes point up the sprite and the game turns them with the
    // vehicle; same forward axis and the same screen angle as the player.
    vehicle.getWorldQuaternion(vehicleQuat);
    vehicleFwd.set(0, 0, -1).applyQuaternion(vehicleQuat);
    const angle = Math.atan2(vehicleFwd.x, -vehicleFwd.z);
    if (!icon || !drawSprite(ctx, icon, q.x, q.y, sc, { angle, alpha: 0.9 })) {
      drawSprite(ctx, 'icon_vehicledot_empty', q.x, q.y, sc);
    }
  }
}

/** The vehicles a side fields, for the levels where its flags say nothing:
 *  Wake's Japanese hold no control point at the start and arrive by sea, so
 *  their nation is read off the carrier and the Zeros instead. Only the
 *  templates that belong to one nation alone are listed. */
const NATION_VEHICLES = {
  jp: ['zero', 'aichival', 'chi-ha', 'ho-ha', 'type38', 'hatsuzuki', 'yamato', 'shokaku'],
  rus: ['t34', 'katyusha', 'ilyushin', 'yak9'],
  brit: ['spitfire', 'sexton', 'blackmedal', 'princeow'],
};
function nationFromVehicles(team) {
  if (!spawnersRoot) return null;
  const names = new Set(spawnersRoot.children.map(v => v.name.toLowerCase()));
  const has = nation => NATION_VEHICLES[nation].some(stem =>
    [...names].some(name => name === stem || name.startsWith(`${stem}_`)));
  if (team === 1) return has('jp') ? 'jp' : null;
  return has('rus') ? 'rus' : has('brit') ? 'brit' : null;
}

function drawPlayer(ctx, px, py, sc) {
  if (drawSprite(ctx, 'minimap_icon_ring_32x32', px, py, sc * 0.8,
                 { angle: cameraHeading() })) return;
  ctx.fillStyle = '#76d65c';
  ctx.beginPath();
  ctx.arc(px, py, 4 * sc, 0, Math.PI * 2);
  ctx.fill();
}

/** The spawn screen's targets: one `map_circle` per flag the chosen side can
 *  spawn at, never one per spawn entry. The chosen one is drawn larger and
 *  solid; the rest sit back. */
/** The map spots a flag draws: one per spawn group on a ship (the game draws
 *  one ring per group down the hull), one for the flag itself otherwise. */
function flagMapSpots(flag) {
  if (flag?.groups?.length) {
    return flag.groups.map(g => ({ group: g.group, position: g.position }));
  }
  return flag?.position ? [{ group: null, position: flag.position }] : [];
}

function drawSpawnRings(ctx, toPx, sc) {
  // -1 while nothing is chosen: every ring sits back and none is filled,
  // which is what tells the player he is about to free-roam rather than
  // spawn (`deployUnchosen`).
  const chosen = deployUnchosen ? -1
    : Math.min(Number(spawnFlagSelect.value) || 0, flags.length - 1);
  for (const index of deployFlagIndices()) {
    const flag = flags[index];
    for (const spot of flagMapSpots(flag)) {
      if (!spot.position) continue;
      const p = projectToArt(spot.position[0], spot.position[2]);
      if (!p) continue;
      const q = toPx(p);
      const active = index === chosen
        && (spot.group == null || spot.group === activeDeployGroup(flag));
      if (!drawSprite(ctx, 'map_circle', q.x, q.y, sc * (active ? 1.4 : 1.05),
                      { alpha: active ? 1 : 0.7 })) {
        ctx.strokeStyle = active ? '#ffffff' : 'rgba(255,255,255,.6)';
        ctx.lineWidth = Math.max(1, sc);
        ctx.beginPath();
        ctx.arc(q.x, q.y, 8 * sc, 0, Math.PI * 2);
        ctx.stroke();
      }
      if (active) drawSprite(ctx, 'map_dot', q.x, q.y, sc * 0.7);
    }
  }
}

/** Match a canvas's backing store to the box it is displayed in.
 *
 *  Returns the device ratio so markers can be sized in CSS pixels. Without
 *  this the HUD widget draws into a 376 px buffer shown at 186 px and every
 *  marker comes out half the size it was asked for. */
function fitCanvas(canvas) {
  const css = cssWidthOf(canvas);
  if (!css) return canvas.__ratio || 1;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const want = Math.round(css * dpr);
  if (canvas.width !== want) {
    canvas.width = want;
    canvas.height = want;
  }
  canvas.__ratio = dpr;
  return dpr;
}

/** One map surface. `span` is the fraction of the art shown, `u0`/`v0` its
 *  top-left corner — the fullscreen map passes the whole image, the HUD a
 *  window centred on the camera. Vehicles under flags under spawn rings
 *  under the player, and nothing else: the game prints no names, no capture
 *  radii and no combat-area box on any of its map surfaces. */
function paintMap(canvas, u0, v0, span, opts) {
  const ctx = canvas.getContext('2d');
  const ratio = fitCanvas(canvas);
  const size = canvas.width;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  drawArt(ctx, size, u0, v0, span, opts);
  if (!extras.minimap?.worldToImage) return ratio;

  const toPx = p => ({
    x: ((p.u - u0) / span) * size,
    y: ((p.v - v0) / span) * size,
  });
  const sc = MARKER_SCALE * ratio * (opts.scale || 1);
  ctx.imageSmoothingEnabled = false;

  drawVehicles(ctx, toPx, sc);
  for (const cp of extras.controlPoints || []) {
    const p = projectToArt(cp.position[0], cp.position[2]);
    if (!p) continue;
    const q = toPx(p);
    drawControlPoint(ctx, cp, q.x, q.y, sc);
  }
  if (opts.spawnRings) drawSpawnRings(ctx, toPx, sc);

  if (opts.player !== false) {
    const here = projectToArt(camera.position.x, camera.position.z);
    if (here) {
      const q = toPx(here);
      drawPlayer(ctx, q.x, q.y, sc);
    }
  }
  ctx.imageSmoothingEnabled = true;
  return ratio;
}

/** The HUD widget's chrome, all of it in the canvas: the `icon_mapbar_small`
 *  bezel as the nine-patch it is (a four-pixel frame round a transparent
 *  middle), the grid readout in the lower-left corner, and the flag-status
 *  strip along the bottom edge — one `cpbar` segment per control point in
 *  its holder's colour. */
function drawMinimapChrome(ctx, size, ratio) {
  const bezel = sprite('icon_mapbar_small');
  const edge = 4;
  const d = Math.round(edge * ratio * 1.5);
  if (bezel) {
    const w = bezel.width, h = bezel.height;
    const cut = (sx, sy, sw, sh, dx, dy, dw, dh) =>
      ctx.drawImage(bezel, sx, sy, sw, sh, dx, dy, dw, dh);
    cut(0, 0, edge, edge, 0, 0, d, d);
    cut(w - edge, 0, edge, edge, size - d, 0, d, d);
    cut(0, h - edge, edge, edge, 0, size - d, d, d);
    cut(w - edge, h - edge, edge, edge, size - d, size - d, d, d);
    cut(edge, 0, w - 2 * edge, edge, d, 0, size - 2 * d, d);
    cut(edge, h - edge, w - 2 * edge, edge, d, size - d, size - 2 * d, d);
    cut(0, edge, edge, h - 2 * edge, 0, d, d, size - 2 * d);
    cut(w - edge, edge, edge, h - 2 * edge, size - d, d, d, size - 2 * d);
  }

  const cps = extras.controlPoints || [];
  const segW = Math.round(12 * ratio), segH = Math.round(6 * ratio);
  const gap = Math.round(2 * ratio);
  let x = d + gap;
  const y = size - d - segH - gap;
  for (const cp of cps) {
    if (x + segW > size - d) break;
    const name = cp.team === 1 ? 'cpbar_red_cp_16x8'
      : cp.team === 2 ? 'cpbar_blue_cp_16x8' : 'cpbar_gray_cp_16x8';
    const seg = sprite(name);
    if (seg) ctx.drawImage(seg, x, y, segW, segH);
    else {
      ctx.fillStyle = TEAM_FILL[cp.team] || TEAM_FILL[0];
      ctx.fillRect(x, y, segW, segH);
    }
    x += segW + gap;
  }

  const text = gridRef(camera.position.x, camera.position.z);
  ctx.font = `bold ${Math.round(13 * ratio)}px 'Arial Narrow', 'Liberation Sans Narrow', Arial, sans-serif`;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  const tx = d + Math.round(6 * ratio);
  const ty = y - Math.round(5 * ratio);
  ctx.fillStyle = 'rgba(0,0,0,.85)';
  ctx.fillText(text, tx + ratio, ty + ratio);
  ctx.fillStyle = '#f4f4f0';
  ctx.fillText(text, tx, ty);
}

// What each map surface last painted, so a frame in which nothing it shows
// has moved paints nothing: the art plus every sprite, at DPR 2, was a 2D
// canvas repaint and a texture upload to the compositor every frame whether
// the soldier stood still or not (features/mesh-viewer-performance, rule
// 7). The key is what the surface draws — the player's art position to the
// backing pixel, the heading to a hundredth of a radian (under a pixel of
// arrow at this size), the canvas size, the art and sprites having landed,
// the flown vehicle's position for a camera planted away from it in fly-by
// — and a 250 ms ceiling catches what has no key, a captured flag's colour.
const mapSurfaceLast = new Map();   // canvas -> { key, at }
// Off only through `__mapGate(false)` under ?shots: the bench that puts a
// number on what the gate saves sets it against the every-frame repaint it
// replaced, on the same page.
let mapGate = true;
function mapSurfaceStale(canvas, key, force) {
  const last = mapSurfaceLast.get(canvas);
  const now = performance.now();
  if (mapGate && !force && last && last.key === key && now - last.at < 250) return false;
  mapSurfaceLast.set(canvas, { key, at: now });
  return true;
}
function mapSurfaceKey(canvas, here, span) {
  const size = Math.round((cssWidthOf(canvas) || 0) * Math.min(window.devicePixelRatio || 1, 2));
  const px = size / span;   // backing pixels per unit of art
  const vehicle = (aircraft || car)?.state.position;
  return `${Math.round(here.u * px)},${Math.round(here.v * px)},`
    + `${Math.round(cameraHeading() * 100)},${size},${mapArt ? mapArtToken : -1},`
    + `${hudPack.sprites.size},${vehicle ? `${Math.round(vehicle.x)},${Math.round(vehicle.z)}` : ''}`;
}

function drawMinimap() {
  if (minimapBox.hidden) return;
  const here = projectToArt(camera.position.x, camera.position.z);
  if (!here) return;
  if (!mapSurfaceStale(minimapCanvas, mapSurfaceKey(minimapCanvas, here, MINIMAP_SPAN))) return;
  // North-up with a rotating arrow. That is the game's own shipped default —
  // every stock profile sets `game.setStaticMinimap 1` — and it keeps the
  // baked-in grid letters upright.
  const half = MINIMAP_SPAN / 2;
  const u0 = Math.min(Math.max(here.u - half, 0), 1 - MINIMAP_SPAN);
  const v0 = Math.min(Math.max(here.v - half, 0), 1 - MINIMAP_SPAN);
  const ratio = paintMap(minimapCanvas, u0, v0, MINIMAP_SPAN, { translucent: true });
  drawMinimapChrome(minimapCanvas.getContext('2d'), minimapCanvas.width, ratio);
}

/** `force` repaints regardless: the deploy screen's layout and the M key
 *  open the surface at a size or in a state the key has not seen. */
function drawFullMap(force = false) {
  if (fullmapBox.hidden) return;
  const here = projectToArt(camera.position.x, camera.position.z) || { u: 0, v: 0 };
  const key = `${mapSurfaceKey(fullmapCanvas, here, 1)},${deployActive()},${deployRejoin},`
    + `${deployTeamId},${deployUnchosen ? '-' : spawnFlagSelect.value},${flags.length}`;
  if (!mapSurfaceStale(fullmapCanvas, key, force)) return;
  // Bigger sprites than the HUD widget: this surface is several times the
  // size. In the deploy state the art dims to the spawn screen's silhouette
  // and the rings come out; a dead man has no marker, so the player shows
  // only when a life waits behind the screen.
  const deploy = deployActive();
  // Sprites grow with the surface, not with the window: the game's spawn map
  // shows a 16 px flag at about a fifth of a grid square, and so does this
  // one whatever the canvas's CSS size came out as.
  const css = cssWidthOf(fullmapCanvas) || 610;
  paintMap(fullmapCanvas, 0, 0, 1, {
    scale: Math.min(2, Math.max(0.8, css / 610)),
    dim: deploy,
    spawnRings: deploy,
    player: !deploy || deployRejoin,
  });
}

function toggleFullMap(on) {
  const want = on ?? fullmapBox.hidden;
  // Deploy state: the game's own open/close — BfMap__animate easing the map
  // between the minimap corner and the spawn-map rect (block below). The
  // .deploy class stays on through the whole close so the keys and buttons
  // keep working until the pane is actually gone.
  if (want && fullmapBox.classList.contains('deploy')) {
    if (fullmapBox.hidden) deployZ = 0;   // fresh open; reopening mid-close just flips the target
    deployZTarget = 1;
    fullmapBox.hidden = false;
    applyDeployFrame();
    // Holding the map is not flying. Releasing the pointer lock also stops the
    // movement keys running under the overlay.
    if (captured) release();
    drawFullMap(true);
    return;
  }
  if (!want && deployActive()) {
    deployZTarget = 0;
    if (deployZ === 0) finishDeployClose();  // a close requested before the first ease tick
    else applyDeployFrame();
    return;
  }
  fullmapBox.hidden = !want;
  // Closing strips the deploy chrome with it, so a level switch or a plain
  // Escape can never leave the screen armed behind a hidden overlay.
  if (!want) {
    fullmapBox.classList.remove('deploy');
    fullmapFrame.removeAttribute('style');
  }
  // Holding the map is not flying. Releasing the pointer lock also stops the
  // movement keys running under the overlay.
  if (want && captured) release();
  if (want) drawFullMap(true);
}
fullmapBox.addEventListener('click', () => {
  // The plain map closes on any click; the deploy state does not — its
  // backdrop is not a button, and the exits are the footer, Escape and M.
  if (deployActive()) return;
  toggleFullMap(false);
});

// --- the deploy screen ------------------------------------------------------
//
// The game never drops a joining player straight into the world: the round
// opens on its spawn screen, and this is that screen — the kit column on the
// left, the dimmed map with its spawn rings on the right, footer buttons
// underneath (SUICIDE/SCORE BOARD/RESUME when alive, CLOSE/SCORE BOARD/DONE
// when dead). Same canvas, same projection as the M map;
// `.deploy` on #fullmap is the whole of the state, and `toggleFullMap(false)`
// strips it on any close. The column is the game's, row for row, and so is
// what a row means: `deployKit` is read at spawn by `weaponTemplateFor`,
// which resolves the row through the level's `game.setKit` binding to the
// kit's primary weapon (`kitLoadout`, above).
const deployChrome = document.getElementById('deploy-chrome');
const fullmapFrame = fullmapBox.querySelector('.fm-map-frame');
const deployTabs = [...fullmapBox.querySelectorAll('.fm-tab')];
const deployKitHits = [...fullmapBox.querySelectorAll('.fm-kit')];
const deploySuicideBtn = document.getElementById('deploy-suicide');
const deployScoreBtn = document.getElementById('deploy-score');
const deployResumeBtn = document.getElementById('deploy-resume');
// Whether a live soldier waits behind the screen (M or Shift+R over a life
// in progress). Cancelling a redeploy keeps him where he stood; cancelling a
// join has nobody to keep and falls back to fly. It is also the game's
// `Kit/IsAlive`: SUICIDE / RESUME with a life behind the screen, CLOSE / DONE
// without one.
let deployRejoin = false;
// The selection as it stood when the screen opened, so a cancelled redeploy
// does not leave the panel's select pointing somewhere nobody went.
let deployKept = '';
// Nothing chosen. `spawnFlagSelect` has no empty value and several things
// read it, so "no spawn" is a flag beside it rather than a cleared select:
// a click on the map away from every ring sets it, choosing anything clears
// it, and while it is set the commit is free roam instead of a spawn.
let deployUnchosen = false;
// The tab: 1 Axis, 2 Allied — the game's `Kit/ShowKit`. Follows the chosen
// flag and filters the rings.
let deployTeamId = 2;
// The deck spot chosen on a ship flag, as the spawn group its ring stands
// for. Null for an island flag — their single ring carries no group.
let deployGroup = null;
let deployKit = 'assault';
// The `Kit/MouseOver/*` flag the pointer currently holds true, and the footer
// button under it, for the mouse-over plate.
let deployHoverVar = null;
let deployHoverBtn = null;

// --- the open/close animation ------------------------------------------------
//
// The spawn map is the HUD minimap in the engine: one BfMap object, and
// showing the deploy screen eases its zoom fraction z toward 1 as
//   z += (target - z) * (1 - exp(-9*dt))
// (BfMap__animate 0x00468fb0; ledger MMAP-1 — pure exponential, ~0.11 s time
// constant, which is why the whole move reads in about 0.3 s). While z runs,
// the map quad interpolates from the closed minimap's (620,30) 175x175 to the
// spawn map's measured (280,33) 512x512 (MEME-13), and the displayed rotation
// is (1 - z) x the heading (MMAP-2): the art enters turned with the camera
// and settles north-up, while the quad's own edge stays axis-aligned — the
// capture's grid is visibly tilted inside a vertical-edged pane. On the way
// down everything runs in reverse, back onto the minimap corner. The engine
// fades the open-map quad by the same easing (MEME-10's +0x4c), which here is
// the pane's opacity: it comes up from nothing because the viewer's pane is
// not the always-visible minimap widget the game starts from.
const BFMAP_EASE_RATE = 9;
const BFMAP_CLOSED_RECT = [620, 30, 175, 175];
// The chrome is plain CullNode visibility (MEME-4) — the capture pops it in
// fully formed about 0.13 s after the pane starts moving, which is z crossing
// 0.7 (1 - exp(-9*0.134) ~= 0.7). `.deploy-ready` is that threshold.
const BFMAP_CHROME_Z = 0.7;

let deployZ = 0;        // the eased zoom fraction: 0 minimap, 1 spawn map
let deployZTarget = 0;  // where BfMap__animate is easing it

function deployTransitionActive() {
  return deployZ !== deployZTarget;
}

/** One tick of the ease, then the pane rewritten from it. Runs from the
 *  frame loop; a no-op once the fraction has landed on its target. */
function deployAnimate(dt) {
  if (deployZ === deployZTarget) return;
  deployZ += (deployZTarget - deployZ) * (1 - Math.exp(-BFMAP_EASE_RATE * dt));
  if (Math.abs(deployZTarget - deployZ) < 0.001) deployZ = deployZTarget;
  applyDeployFrame();
  if (deployZ === 0 && deployZTarget === 0) finishDeployClose();
}

/** Landed back on the minimap corner: gone for real, exactly what the
 *  instant close used to do — chrome stripped so a level switch or a plain
 *  Escape can never leave the screen armed behind a hidden overlay. */
function finishDeployClose() {
  fullmapBox.hidden = true;
  fullmapBox.classList.remove('deploy', 'deploy-ready');
  fullmapFrame.removeAttribute('style');
  fullmapCanvas.style.transform = '';
}

/** The pane this tick: the interpolated rect, the game's (1 - z) x heading
 *  content rotation — negated so the closed map reads with the camera's
 *  forward up — over-scaled by the square's cover factor so the turned art
 *  never shows a corner gap, and the fade. Flips the chrome on past the
 *  threshold. */
function applyDeployFrame() {
  const s = deployScale();
  const rect = spawnLayout.data?.map?.rect || [280, 33, 512, 512];
  const [x, y, w, h] = BFMAP_CLOSED_RECT.map((c, i) => c + (rect[i] - c) * deployZ);
  fullmapFrame.style.left = `${s.ox + x * s.sx}px`;
  fullmapFrame.style.top = `${s.oy + y * s.sy}px`;
  fullmapFrame.style.width = `${w * s.sx}px`;
  fullmapFrame.style.height = `${h * s.sy}px`;
  fullmapFrame.style.opacity = deployZ.toFixed(3);
  const theta = -(1 - deployZ) * cameraHeading();
  const cover = Math.abs(Math.cos(theta)) + Math.abs(Math.sin(theta));
  fullmapCanvas.style.transform = `rotate(${theta}rad) scale(${cover.toFixed(4)})`;
  // The threshold only arms on the way up: a close strips the chrome in the
  // same breath that flips the target, exactly like the game's culls flip.
  fullmapBox.classList.toggle('deploy-ready',
    deployZTarget === 1 && deployZ >= BFMAP_CHROME_Z);
}

// The five rows in the game's order; the index is its `Kit/SelectedKit`.
const KITS = ['scout', 'assault', 'antitank', 'medic', 'engineer'];

/** Which photograph a kit row shows: the level's own kit for this row and
 *  team, through `_shared/loadouts.json`'s `kitIcon.icon` (`setKitIcon`'s raw
 *  path -- `kit-icon.js` handles the casing, the extension and the
 *  directory-qualified name a nation collision earns it) resolved against
 *  whichever sprites the pack actually loaded, mod's own first. Falls back
 *  to the vanilla-table guess below whenever the loadout, the icon field or
 *  the sprite itself is not there -- a mod whose pack has not caught up, or
 *  a level `_shared/loadouts.json` does not know. The theatre variants in
 *  that fallback exist only where the game drew them: Japanese assault and
 *  engineer, Soviet and Canadian assault; everything else is the plain
 *  allies/axis picture. */
function kitPhoto(role, nation, team) {
  const { kit } = kitLoadout(team, role);
  const icon = kit && loadouts?.kits?.[kit]?.kitIcon?.icon;
  if (icon) {
    for (const candidate of kitIconCandidates(icon)) {
      if (hudPack.sprites.has(candidate)) return candidate;
    }
  }
  const variants = {
    jp: { assault: 'jap', engineer: 'jap' },
    rus: { assault: 'russian' },
    can: { assault: 'canadian' },
  };
  const side = variants[nation]?.[role] || (team === 1 ? 'axis' : 'allies');
  return `icon_${role}_${side}_selected`;
}

function deployActive() {
  return !fullmapBox.hidden && fullmapBox.classList.contains('deploy');
}

// --- the layout and its fonts -----------------------------------------------
//
// `spawn-layout.json`: the spawn interface out of `menu/InGame`, flattened
// to draw lists in 800x600 virtual units, each leaf with the CullNode
// conditions the game evaluates before drawing it, and the bitmap fonts its
// text nodes name. The atlases are white with the glyph as alpha; a tinted
// copy is made per colour the layout asks for.
const spawnLayout = { data: null, fonts: new Map(), pending: false };

async function loadSpawnLayout() {
  let data;
  try {
    data = await fetch(`${hudPaths.url('spawn-layout.json')}${bust()}`).then(r => r.json());
  } catch (error) {
    console.warn('spawn layout unavailable', error);
    return;
  }
  spawnLayout.data = data;
  await Promise.all(Object.entries(data.fontFiles || {}).map(async ([id, entry]) => {
    const meta = await fetch(`${hudPaths.url(entry.glyphs)}${bust()}`).then(r => r.json());
    const img = new Image();
    await new Promise(resolve => {
      img.onload = resolve;
      img.onerror = resolve;
      img.src = `${hudPaths.url(entry.file)}${bust()}`;
    });
    spawnLayout.fonts.set(id, { meta, img, tinted: new Map() });
  }));
  if (deployActive()) layoutDeploy();
}
loadSpawnLayout();

/** The glyph atlas in one colour, made once per (font, colour). */
function tintedAtlas(font, rgb) {
  const key = rgb.join(',');
  let c = font.tinted.get(key);
  if (c) return c;
  c = document.createElement('canvas');
  c.width = font.img.width;
  c.height = font.img.height;
  const ctx = c.getContext('2d');
  ctx.drawImage(font.img, 0, 0);
  ctx.globalCompositeOperation = 'source-in';
  ctx.fillStyle = `rgb(${rgb.map(v => Math.round(v * 255)).join(',')})`;
  ctx.fillRect(0, 0, c.width, c.height);
  font.tinted.set(key, c);
  return c;
}

function measureText(font, text) {
  let w = 0;
  for (const ch of text) {
    const g = font.meta.glyphs[ch.charCodeAt(0)];
    if (g) w += g[0] + g[1] + g[2];
  }
  return w;
}

/** Text in a bitmap font at virtual (x, y), the line's top at y: each glyph
 *  drawn at `left` past the pen and `ascent` above the baseline, the pen
 *  advancing by left + width + right, as `bf42/font.py` reads the `.dif`. */
function drawBitmapText(ctx, fontId, text, x, y, rgb) {
  const font = spawnLayout.fonts.get(fontId);
  if (!font) return;
  const atlas = tintedAtlas(font, rgb);
  const base = font.meta.baseline;
  let pen = x;
  for (const ch of text) {
    const g = font.meta.glyphs[ch.charCodeAt(0)];
    if (!g) continue;
    const [left, width, right, ascent, x0, y0, x1, y1] = g;
    // The space glyph's rectangle is an opaque corner texel; it only
    // advances the pen.
    if (ch !== ' ' && width > 0 && y1 > y0) {
      ctx.drawImage(atlas, x0, y0, x1 - x0, y1 - y0,
                    pen + left, y + base - ascent, x1 - x0, y1 - y0);
    }
    pen += left + width + right;
  }
}

// --- the game's variables and conditions -------------------------------------

/** The variable table the layout's conditions read: the file's defaults
 *  under this page's state. */
function deployVars() {
  const vars = { ...(spawnLayout.data?.variables || {}) };
  vars['Kit/ShowKit'] = deployTeamId;
  vars['Kit/SelectedKit'] = Math.max(0, KITS.indexOf(deployKit));
  vars['Kit/IsAlive'] = deployRejoin;
  vars['ChangeTeam/ShowChangeTeam'] = true;
  feedTicketVars(vars);
  for (const k of Object.keys(vars)) if (k.startsWith('Kit/MouseOver/')) vars[k] = false;
  if (deployHoverVar) vars[deployHoverVar] = true;
  return vars;
}

function condOk(c, vars) {
  if (c.op === 'and') return c.terms.every(t => condOk(t, vars));
  if (c.op === 'or') return c.terms.some(t => condOk(t, vars));
  const v = vars[c.var];
  const want = (c.value && typeof c.value === 'object') ? vars[c.value.var] : c.value;
  switch (c.op) {
    case 'eq': return v === want || Number(v) === Number(want);
    case 'ne': return !(v === want || Number(v) === Number(want));
    case 'lt': return Number(v) < Number(want);
    case 'le': return Number(v) <= Number(want);
    // `gt`/`ge` come out of the extractor's own operand flip (`FLIP_CMP` in
    // extract_hud_layout.py) whenever the MemeFile puts the literal on the
    // left, e.g. `0 < Outside/OutsideTime`. Missing here they fell through to
    // the permissive default and drew a leaf that should have been culled --
    // the same bug fixed in hud.js's copy of this function. No group in
    // `spawn-layout.json` uses either today; they are implemented so this
    // evaluator and hud.js's stay the same function.
    case 'gt': return Number(v) > Number(want);
    case 'ge': return Number(v) >= Number(want);
    default: return true;
  }
}

const elementVisible = (el, vars) => (el.when || []).every(c => condOk(c, vars));

/** The sprite a picture leaf shows: the variable pictures are the team's
 *  flag and the kit photographs, resolved for this level's nations. */
function deployTexture(el, vars) {
  if (!el.var) return el.texture;
  const nation = teamNation(deployTeamId);
  if (el.var === 'ChangeTeam/AxisTeamFlag' || el.var === 'ChangeTeam/AlliedTeamFlag') {
    return `icon_flag_${nation}`;
  }
  const kit = /^Kit\/Icons\/KitIcon(\d)$/.exec(el.var);
  if (kit) return kitPhoto(KITS[Number(kit[1]) - 1], nation, deployTeamId);
  // Anything else bound to a live variable resolves the way `hud.js` does it:
  // strip the path and the extension, lower-case. This is only reached for
  // leaves nothing above claims — today the two ticket flags. Note that
  // `deployVars()` seeds the table from the layout's own sample values, so
  // this must stay BELOW the cases that derive art from the level rather than
  // from a variable, or a sample literal would win over a real lookup.
  const live = vars && vars[el.var];
  if (typeof live === 'string' && live) {
    const base = live.slice(live.lastIndexOf('/') + 1);
    const dot = base.lastIndexOf('.');
    return (dot > 0 ? base.slice(0, dot) : base).toLowerCase();
  }
  return el.texture;
}

/** The string a text leaf shows. The counts are the game's live player
 *  tallies, which are all zero for a man alone on the server; the commit
 *  button reads LOADING while the scene still streams. */
function deployText(el, vars) {
  if (el.key === 'RESPAWN_SUICIDE' && !worldReady) return 'LOADING';
  if (el.var && /^Kit\/NrOf/.test(el.var)) return '0';
  // The five kit-row labels: the level's kit for the row, its own
  // `setKitName` resolved through the mod chain's lexicon — not the leaf's
  // own text, which is the menu's string for the class, and a mod re-points
  // the row's kit (and its name) without touching the menu.
  const role = KIT_ROW_KEYS[el.key];
  if (role) return kitRowLabelFor(role, el.text);
  // A bound string the page actually feeds wins over the layout's own sample
  // ("300"/"500" on the ticket counters). Only values this page wrote count:
  // `deployVars()` seeds the table from those same samples, so an untouched
  // key would otherwise look fed.
  if (el.var && TICKET_TEXT_VARS.has(el.var) && vars && vars[el.var] != null) {
    return String(vars[el.var]);
  }
  return el.text || '';
}

const TICKET_TEXT_VARS = new Set(['AxisTicket', 'AlliedTicket']);

// --- laying out and painting -------------------------------------------------

/** Virtual-to-stage mapping. The game stretches 800x600 to the screen; a
 *  portrait phone gets a uniform, letterboxed scale instead so nothing turns
 *  to a sliver. */
function deployScale() {
  const W = fullmapBox.clientWidth || 800;
  const H = fullmapBox.clientHeight || 600;
  const [vw, vh] = spawnLayout.data?.virtual || [800, 600];
  if (W / H < 1) {
    const s = Math.min(W / vw, H / vh);
    return { sx: s, sy: s, ox: (W - vw * s) / 2, oy: (H - vh * s) / 2, W, H };
  }
  return { sx: W / vw, sy: H / vh, ox: 0, oy: 0, W, H };
}

function placeHit(btn, rect, s) {
  const [x, y, w, h] = rect;
  btn.style.left = `${s.ox + x * s.sx}px`;
  btn.style.top = `${s.oy + y * s.sy}px`;
  btn.style.width = `${w * s.sx}px`;
  btn.style.height = `${h * s.sy}px`;
}

/** Where everything sits for the stage's current size: the map in its
 *  rectangle, the pointer regions over the game's own, then a paint. */
function layoutDeploy() {
  const data = spawnLayout.data;
  if (!data || !deployActive()) return;
  const s = deployScale();
  // While the open/close transition owns the pane (applyDeployFrame), its
  // rect is the eased interpolation, not the layout's final one.
  if (!deployTransitionActive()) placeHit(fullmapFrame, data.map.rect, s);
  const group = data.groups.spawn;
  const rows = group.elements.filter(el => el.kind === 'hit' && el.hover);
  for (const el of group.elements) {
    if (el.kind === 'hit' && el.label === 'RESPAWN_AXIS') placeHit(deployTabs[0], el.rect, s);
    if (el.kind === 'hit' && el.label === 'RESPAWN_ALLIED') placeHit(deployTabs[1], el.rect, s);
  }
  rows.forEach((el, i) => { if (deployKitHits[i]) placeHit(deployKitHits[i], el.rect, s); });
  const buttons = { RESPAWN_SUICIDE: deploySuicideBtn, RESPAWN_CLOSE: deploySuicideBtn,
                    RESPAWN_RESUME: deployResumeBtn, RESPAWN_DONE: deployResumeBtn,
                    RESPAWN_SCOREBOARD: deployScoreBtn };
  for (const el of group.elements) {
    if (el.kind === 'button' && buttons[el.id]) placeHit(buttons[el.id], el.rect, s);
  }
  updateKitAriaLabels();
  paintDeployChrome();
  drawFullMap(true);
}

/** One frame of the chrome: the layout's leaves in file order, each drawn
 *  only when its conditions hold under `deployVars()`. */
function paintDeployChrome() {
  const data = spawnLayout.data;
  if (!data || !deployActive()) return;
  const s = deployScale();
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const cw = Math.round(s.W * dpr);
  const ch = Math.round(s.H * dpr);
  if (deployChrome.width !== cw || deployChrome.height !== ch) {
    deployChrome.width = cw;
    deployChrome.height = ch;
  }
  const ctx = deployChrome.getContext('2d');
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cw, ch);
  ctx.setTransform(s.sx * dpr, 0, 0, s.sy * dpr, s.ox * dpr, s.oy * dpr);
  const vars = deployVars();
  const buttonHover = { RESPAWN_SUICIDE: 'suicide', RESPAWN_CLOSE: 'suicide',
                        RESPAWN_SCOREBOARD: 'score', RESPAWN_RESUME: 'resume', RESPAWN_DONE: 'resume' };
  // The ticket counter is its own top-level entry of menu/InGame, gated by
  // `ShowTicket` rather than by `Kit/ShowKit`, so it is a sibling of the spawn
  // group in the file and is drawn alongside it here — in the file's own
  // order, which puts it over the spawn plates the way the game draws it.
  const chrome = [...data.groups.spawn.elements,
                  ...(data.groups.tickets?.elements || [])];
  for (const el of chrome) {
    if (!elementVisible(el, vars)) continue;
    const [x, y, w, h] = el.rect;
    const color = el.color || [1, 1, 1, 1];
    ctx.globalAlpha = color[3];
    switch (el.kind) {
      case 'fill':
        ctx.fillStyle = `rgb(${color.slice(0, 3).map(v => Math.round(v * 255)).join(',')})`;
        ctx.fillRect(x, y, w, h);
        break;
      case 'picture': {
        const img = sprite(deployTexture(el, vars));
        if (!img) break;
        // Point art at its own size — the 16 px class glyphs — stays crisp;
        // the plates and photographs get the card's bilinear filtering.
        ctx.imageSmoothingEnabled = !(img.width <= 16 && img.height <= 16);
        ctx.drawImage(img, x, y, w, h);
        break;
      }
      case 'button': {
        // A button plate is drawn at its texture's own size (the 109x25
        // art sits inside a 128x128 sheet); the node's Width/Height is the
        // pointer region, not a scale.
        const img = sprite(deployHoverBtn === buttonHover[el.id] ? el.hover : el.texture);
        if (!img) break;
        ctx.imageSmoothingEnabled = true;
        ctx.drawImage(img, x, y, img.width, img.height);
        break;
      }
      case 'text': {
        const font = spawnLayout.fonts.get(el.font);
        if (!font) break;
        const text = deployText(el, vars);
        const width = measureText(font, text);
        const tx = el.align === 'center' ? x + (w - width) / 2
          : el.align === 'right' ? x + w - width : x;
        ctx.imageSmoothingEnabled = false;
        drawBitmapText(ctx, el.font, text, Math.round(tx), y, color.slice(0, 3));
        break;
      }
      default:
        break;
    }
  }
  ctx.globalAlpha = 1;
}

/** A repaint on the next frame, coalescing a burst of sprite loads or
 *  pointer moves into one. */
function paintDeploySoon() {
  if (spawnLayout.pending || !deployActive()) return;
  spawnLayout.pending = true;
  requestAnimationFrame(() => {
    spawnLayout.pending = false;
    paintDeployChrome();
  });
}

new ResizeObserver(() => { if (deployActive()) layoutDeploy(); }).observe(fullmapBox);

// --- the state -----------------------------------------------------------------

/** The flags the current tab may spawn at, as indices into `flags`. A side
 *  with no flag of its own on this level — a one-sided extract — gets them
 *  all rather than an empty map. */
function deployFlagIndices() {
  const own = [];
  flags.forEach((flag, index) => { if (flag.team === deployTeamId) own.push(index); });
  return own.length ? own : flags.map((_, index) => index);
}

/** The side the page was launched on, or null.
 *
 *  The Instant Battle screen in `play/` starts the map with `?team=`, which
 *  is the `Campaign/Team` its TEAM list writes: 1 Axis, 2 Allied, the
 *  numbering `menu/SkirmishMenu` itself uses. Names are accepted too so a
 *  hand-typed link reads. The level comes in on `?map=`, which this page
 *  already honoured. */
const launchTeam = (() => {
  const raw = (params.get('team') || '').trim().toLowerCase();
  if (raw === '1' || raw === 'axis') return 1;
  if (raw === '2' || raw === 'allied' || raw === 'allies') return 2;
  return null;
})();

/** Fresh join: pick the side that actually has spawn choices. Liberation of
 *  Caen's Allied tab is a single Canadian_Base in empty fields; Axis owns
 *  the bridge and town. Tobruk is the reverse. A rejoin keeps the life's
 *  own team.
 *
 *  A launch from the Instant Battle screen names the side instead, and it
 *  wins outright. The tally is only a guess at which side has somewhere to
 *  stand, and it is not needed here: `deployFlagIndices` already offers
 *  every flag to a side that owns none. That is how Midway works at all
 *  (its control points all start neutral), and it is what makes Wake
 *  playable from the Japanese side — all five of its flags are Allied at
 *  the start, so a tally-based guard would answer ALLIED to a player who
 *  picked AXIS on the screen before this one. */
function preferredDeployTeam() {
  if (launchTeam) return launchTeam;
  let axis = 0;
  let allied = 0;
  for (const flag of flags) {
    if (flag.team === 1) axis++;
    else if (flag.team === 2) allied++;
  }
  if (axis && !allied) return 1;
  if (allied && !axis) return 2;
  if (axis > allied) return 1;
  if (allied > axis) return 2;
  return 2;
}

/** The checkbox's on-edge. Joining became a choice rather than a teleport:
 *  the deploy screen opens when the level has flags to choose between, and
 *  the instant path — with its refusal message for a level that declares no
 *  soldier spawns — stays for the levels that do not. */
function requestOnFoot() {
  if (optPilot.checked) {            // the two modes are exclusive
    optPilot.checked = false;
    setPilot(false);
  }
  if (!buildSpawnFlags()) {
    setOnFoot(true);
    return;
  }
  openDeploy();
}

function openDeploy() {
  // Rebuilt on every open, not only when empty: `flags` otherwise survives a
  // level switch, and the rings would be drawn from the previous level's
  // flags — off the current map, or not anywhere at all. Rebuilding is a few
  // DOM options; the kept choice rides the select through it.
  if (!buildSpawnFlags()) return false;
  // A dead body is not a life to go back to: RESUME must not hand the player
  // a corpse, and `Kit/IsAlive` must say so.
  deployRejoin = !!soldier && !soldierDead;
  deployKept = spawnFlagSelect.value;
  // A fresh screen always opens on a flag, whether the last one was left
  // unselected for a free roam or not.
  deployUnchosen = false;
  // The deck-spot choice belongs to the life it was made on; a fresh screen
  // starts with whole flags again (the rejoin path re-derives it below).
  deployGroup = null;
  // Drop sidebar / footer focus so Enter commits spawn rather than toggling
  // `#onfoot` or synthesising a RESUME click.
  if (document.activeElement && document.activeElement !== document.body) {
    document.activeElement.blur();
  }
  if (deployRejoin) {
    const chosen = flags[Math.min(Number(spawnFlagSelect.value) || 0, flags.length - 1)];
    setDeployTeam(chosen?.team === 1 ? 1 : 2, false);
  } else {
    const team = preferredDeployTeam();
    setDeployTeam(team, false);
    const first = deployFlagIndices()[0];
    if (first != null) {
      spawnFlagSelect.value = String(first);
      world?.setSpawnIndex(LOCAL_PLAYER, 0);
    }
  }
  fullmapBox.classList.add('deploy');
  syncDeployReady();
  toggleFullMap(true);
  layoutDeploy();
  return true;
}

function cancelDeploy() {
  // deploySpawn closes the overlay first; a focused RESUME button can still
  // receive the Enter key's synthetic click afterward. Refuse unless the
  // deploy chrome is actually up, or that click tears down the soldier we
  // just built and dumps the camera into fly-through.
  if (!deployActive()) return;
  const rejoin = deployRejoin;
  const kept = deployKept;
  toggleFullMap(false);
  if (rejoin) {
    // The life in progress resumes untouched; the flag he never committed
    // to goes back to the one he is actually standing at.
    if (kept !== '') spawnFlagSelect.value = kept;
    return;
  }
  enterFreeCam();
}

/** Free roam: the spawn screen closed with nobody spawned.
 *
 *  The game's own behaviour on a server that allows it — you leave the spawn
 *  menu without taking a spawn and the camera is yours over the level. Caps
 *  Lock brings the screen back, which is how you stop free-roaming.
 *
 *  It takes the pointer with it. The click or the Enter that got here is a
 *  user gesture, which is the only currency pointer lock accepts, and this
 *  is the whole reason the page no longer needs a "click to fly" plate: the
 *  way into the free camera captures the mouse on the way. */
function enterFreeCam() {
  deployUnchosen = false;
  optOnFoot.checked = false;
  setOnFoot(false);
  placeCamera();
  capture();
}

/** The group of `flag` the current selection points at: the chosen deck
 *  spot when one was clicked, else the ship's first group. */
function activeDeployGroup(flag) {
  if (deployGroup != null && flag?.groups?.some(g => g.group === deployGroup)) {
    return deployGroup;
  }
  return flag?.groups?.[0]?.group ?? null;
}

function selectDeployFlag(index, group = null) {
  if (!Number.isInteger(index) || index < 0 || index >= flags.length) return false;
  deployUnchosen = false;
  spawnFlagSelect.value = String(index);
  // A fresh choice starts at the flag's first spawn, as the select's own
  // change handler would have it — the world's counter rides the reset.
  world?.setSpawnIndex(LOCAL_PLAYER, 0);
  deployGroup = group;
  // The tab follows the flag: a number key or a harness call naming the
  // other side's flag switches the column with it.
  const team = flags[index].team;
  if ((team === 1 || team === 2) && team !== deployTeamId) setDeployTeam(team, false);
  if (deployActive()) drawFullMap(true);
  return true;
}

/** The AXIS / ALLIED tab. `reselect` moves the chosen flag onto the new
 *  side when it is not already there — a tab click — and leaves it alone
 *  when the flag chose the tab. */
/** The kit buttons' accessible names say the same as the rows draw: the
 *  level's kit for the row on the current team, its `setKitName` resolved.
 *  Called from `setDeployTeam` (the team changed) and `layoutDeploy` (the
 *  layout — and with it the label's fallback — may have just landed). */
function updateKitAriaLabels() {
  for (const hit of deployKitHits) {
    const role = hit.dataset.kit;
    if (role) hit.setAttribute('aria-label',
      kitRowLabelFor(role, kitRowLayoutText(role)));
  }
}

function setDeployTeam(team, reselect = true) {
  deployTeamId = team;
  for (const tab of deployTabs) {
    tab.setAttribute('aria-pressed', String(Number(tab.dataset.team) === team));
  }
  updateKitAriaLabels();
  if (reselect) {
    // Picking a side is picking again: whatever the tab lands on is chosen.
    deployUnchosen = false;
    const chosen = Math.min(Number(spawnFlagSelect.value) || 0, flags.length - 1);
    if (flags[chosen]?.team !== team) {
      const first = deployFlagIndices()[0];
      if (first != null) {
        spawnFlagSelect.value = String(first);
        world?.setSpawnIndex(LOCAL_PLAYER, 0);
        deployGroup = null;
      }
    }
  }
  paintDeployChrome();
  if (deployActive()) drawFullMap(true);
}

for (const tab of deployTabs) {
  tab.addEventListener('click', e => {
    e.stopPropagation();
    const newTeam = Number(tab.dataset.team);
    // Switching teams kills the current soldier, matching retail BF1942:
    // a live player who changes sides on the deploy screen dies and
    // rejoins from scratch on the new side.
    if (deployRejoin && newTeam !== deployTeamId && soldier) {
      soldier = null;
      soldierArmor = null;
      soldierDead = false;
      deathCamTimer = 0;
      deployRejoin = false;
      disposeHandWeapon();
    }
    setDeployTeam(newTeam);
    tab.blur();
  });
}

// The rows: a click selects, the pointer over one raises its
// `Kit/MouseOver/*` flag for the game's mouse-over tint.
deployKitHits.forEach((hit, i) => {
  const hoverVar = () => spawnLayout.data?.groups.spawn.elements
    .filter(el => el.kind === 'hit' && el.hover)[i]?.hover || null;
  hit.addEventListener('click', e => {
    e.stopPropagation();
    deployKit = hit.dataset.kit;
    hit.blur();
    paintDeployChrome();
  });
  hit.addEventListener('pointerenter', () => { deployHoverVar = hoverVar(); paintDeploySoon(); });
  hit.addEventListener('pointerleave', () => {
    if (deployHoverVar === hoverVar()) deployHoverVar = null;
    paintDeploySoon();
  });
});
for (const [btn, id] of [[deploySuicideBtn, 'suicide'], [deployScoreBtn, 'score'],
                         [deployResumeBtn, 'resume']]) {
  btn.addEventListener('pointerenter', () => { deployHoverBtn = id; paintDeploySoon(); });
  btn.addEventListener('pointerleave', () => {
    if (deployHoverBtn === id) deployHoverBtn = null;
    paintDeploySoon();
  });
}

/** The commit. A join builds the soldier through today's `setOnFoot`, whose
 *  rebuilt select keeps the chosen flag; a redeploy moves the one that
 *  exists. Either way the screen goes first, and pointer capture stays with
 *  the gate, exactly as it does today. */
// The commit button reads LOADING and refuses while the scene streams.
function syncDeployReady() {
  // Only the commit button reads LOADING and refuses while the scene streams;
  // which button that is depends on the side of the screen the footer puts it
  // on (left with a life behind the screen, right without).
  deploySuicideBtn.disabled = deployRejoin && !worldReady;
  deployResumeBtn.disabled = !deployRejoin && !worldReady;
  paintDeployChrome();
}

function deploySpawn() {
  if (!deployActive() || !worldReady) return false;
  // Nothing chosen: the commit is the way out to the free camera, not a
  // spawn. The game's spawn menu closes the same way on a server that
  // allows it, and there is no flag here to put a soldier at.
  if (deployUnchosen) {
    toggleFullMap(false);
    enterFreeCam();
    return false;
  }
  const rejoin = deployRejoin;
  // Arm on-foot without firing `change` — that handler calls requestOnFoot
  // and would reopen this screen. Without the box ticked the frame loop
  // keeps flying even after setOnFoot builds a soldier (Caps Lock / auto
  // join never checked it).
  optOnFoot.checked = true;
  if (document.activeElement && document.activeElement !== document.body) {
    document.activeElement.blur();
  }
  toggleFullMap(false);
  const spawned = (rejoin && soldier) ? spawnAtFlag() : (setOnFoot(true), !!soldier);
  // The click that commits is a user gesture, which is the only currency
  // pointer lock accepts — capture here and the very first click in the
  // world is a trigger pull, not a mysterious dead click that only grabs
  // the mouse.
  if (spawned) capture();
  else if (!soldier) optOnFoot.checked = false;
  return spawned;
}

// Clicking the art is clicking a ring: the nearest one of the chosen side's
// within a finger's width, measured in CSS pixels so the target does not
// shrink on a hidpi display. A click only selects — Enter or DONE/SUICIDE
// commits, matching the game. Touch arrives here as the same click event.
//
// A click on open ground, away from every ring, *unselects* instead. That is
// how you say "no spawn" on this screen, and with nothing selected the same
// commit that would have spawned you takes the free camera over the level
// instead (`enterFreeCam`).
fullmapCanvas.addEventListener('click', e => {
  if (!deployActive()) return;       // the plain map still closes, above
  e.stopPropagation();
  const rect = fullmapCanvas.getBoundingClientRect();
  if (!rect.width) return;
  const u = (e.clientX - rect.left) / rect.width;
  const v = (e.clientY - rect.top) / rect.height;
  let best = -1;
  let bestGroup = null;
  let bestDist = 26;
  for (const index of deployFlagIndices()) {
    for (const spot of flagMapSpots(flags[index])) {
      if (!spot.position) continue;
      const p = projectToArt(spot.position[0], spot.position[2]);
      if (!p) continue;
      const d = Math.hypot((p.u - u) * rect.width, (p.v - v) * rect.height);
      if (d < bestDist) {
        bestDist = d;
        best = index;
        bestGroup = spot.group;
      }
    }
  }
  if (best < 0) {
    if (deployUnchosen) return;
    deployUnchosen = true;
    drawFullMap(true);
    paintDeployChrome();
    return;
  }
  selectDeployFlag(best, bestGroup);
});

// The footer. The left and right buttons swap roles depending on whether a
// life waits behind the screen (`deployRejoin`):
//   alive (rejoin): SUICIDE (left) commits spawn, RESUME (right) cancels

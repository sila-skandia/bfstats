  sun.color.setRGB(tint[0], tint[1], tint[2], THREE.SRGBColorSpace);
  sun.intensity = 2.4 * Math.min(1.4, peak / 0.5);
  // The engine has no sky-dome light: its only ambient terms are
  // renderer.ambientColor / globalAmbientColor, and neither is ever blue.
  // Tinting the hemisphere with the raw fog colour injected atmosphere blue
  // into the shading on marine maps - on Wake (fog 0.71/0.74/0.79 against sun
  // 1/.95/.9) the two cancelled to a dead-grey total and every vehicle picked
  // up a cool cast the game never shows. Keep the fog's LUMINANCE as the size
  // of the ambient bounce, but give it the sun's hue so the hemisphere can
  // never fight the level's declared light colour.
  const fog = extras.fogColor || [0.7, 0.7, 0.7];
  const atmos = 0.2126 * fog[0] + 0.7152 * fog[1] + 0.0722 * fog[2];
  hemi.color.setRGB(atmos * tint[0], atmos * tint[1], atmos * tint[2],
                    THREE.SRGBColorSpace);
  const ground = light.ambient || [0.2, 0.2, 0.2];
  hemi.groundColor.setRGB(
    Math.min(1, ground[0] * 2.5), Math.min(1, ground[1] * 2.5),
    Math.min(1, ground[2] * 2.5), THREE.SRGBColorSpace);
  hemi.intensity = 1.15;
}

function drawDistance() {
  return extras.drawDistance || DEFAULT_DRAW;
}

function applyFar() {
  const world = extras.worldSize || 2048;
  const draw = drawDistance();
  // The engine's far plane IS the view distance: with fog saturating there,
  // the world ends in a completed haze wall that meets the sky painting.
  // Drawing past it (the old draw*1.6 with a 900 m floor) rasterised
  // fog-saturated terrain as crisp silhouettes against the paler sky band —
  // the "distant mountain ridge" the game never shows. Extend only to a
  // declared fogEnd beyond the view distance (Gazala: fog 500-850 vs VD 500)
  // so the wall always completes before the clip; 1.05 keeps the last
  // fog-saturated metres from z-fighting the plane.
  camera.far = optEntire.checked
    ? Math.max(4000, world * 1.5)
    : Math.max(draw, extras.fogEnd || 0) * 1.05;
  camera.updateProjectionMatrix();
}

function applyFog() {
  const color = extras.fogColor || [0.8, 0.72, 0.53];
  const draw = drawDistance();
  let start, end;
  if (optGameFog.checked) {
    start = extras.fogStart || 150;
    end = extras.fogEnd || 300;
  } else if (!optEntire.checked) {
    start = draw * 0.55;
    end = draw;
  } else {
    start = 250;
    end = Math.max(1400, extras.worldSize || 2000);
  }
  // Declared fog colours are display values from a pre-colour-managed engine.
  const fogColor = new THREE.Color().setRGB(
    color[0], color[1], color[2], THREE.SRGBColorSpace);
  scene.fog = new THREE.Fog(fogColor, start, end);
  scene.background = skybox || fogColor;
  syncWaterFog();
}

function isCollision(obj) {
  return Boolean(obj.userData?.collision) || /collision/i.test(obj.name || '');
}

function kindOf(obj) {
  return obj.userData?.kind || '';
}

const cullBonePos = new THREE.Vector3();
function tagCull(obj) {
  // A skinned flag cloth sits at the scene root carrying no transform of its
  // own — glTF requires that of any skinned mesh — so its bind-pose geometry
  // boxes around the world origin and a distance test would hide it
  // everywhere except there. Its real position is wherever its joints are.
  if (obj.isSkinnedMesh && obj.skeleton && obj.skeleton.bones.length) {
    const box = new THREE.Box3();
    for (const bone of obj.skeleton.bones) {
      box.expandByPoint(bone.getWorldPosition(cullBonePos));
    }
    const sphere = new THREE.Sphere();
    box.getBoundingSphere(sphere);
    obj.userData.cullCenter = sphere.center.clone();
    // The joints are a lattice inside the cloth, not its extent; pad for it.
    obj.userData.cullRadius = sphere.radius + 2;
    return;
  }
  const box = new THREE.Box3().setFromObject(obj);
  const sphere = new THREE.Sphere();
  box.getBoundingSphere(sphere);
  obj.userData.cullCenter = sphere.center.clone();
  obj.userData.cullRadius = sphere.radius;
}

function indexScene(root) {
  cull.length = 0;
  spawnersRoot = null;
  root.traverse(obj => {
    if (isCollision(obj)) obj.visible = false;
  });
  root.updateMatrixWorld(true);
  root.traverse(obj => {
    if (obj === root) return;
    if (kindOf(obj) === 'spawners' || obj.name === 'spawners') {
      spawnersRoot = obj;
    }
  });
  for (const child of root.children) {
    if (child === spawnersRoot) {
      for (const vehicle of child.children) tagCull(vehicle);
      continue;
    }
    if (kindOf(child) === 'water') continue;
    tagCull(child);
    cull.push(child);
  }
}

function inRange(obj, cam, limit) {
  const c = obj.userData.cullCenter;
  const r = obj.userData.cullRadius || 0;
  if (!c) return true;
  const dx = c.x - cam.x, dy = c.y - cam.y, dz = c.z - cam.z;
  const reach = limit + r;
  return dx * dx + dy * dy + dz * dz <= reach * reach;
}

function applyVisibility() {
  const entire = optEntire.checked;
  const cam = camera.position;
  const limit = drawDistance();
  for (const obj of cull) obj.visible = entire || inRange(obj, cam, limit);
  if (!spawnersRoot) return;
  spawnersRoot.visible = optVehicles.checked;
  if (!optVehicles.checked) return;
  for (const vehicle of spawnersRoot.children) {
    vehicle.visible = entire || inRange(vehicle, cam, limit);
  }
}

// --- piloting ---------------------------------------------------------------
//
// The map scene already ships real vehicles at their spawn points, assembled by
// the same assembler the model browser uses and carrying a `rig` extra on every
// input-driven part, plus an empty `<Vehicle>Camera` node at the pilot's eye
// point. Piloting therefore adds no extraction: it drives what is already here.
//
// Control scheme is the game's own (`Settings/Default/Controls/Air.con`): the
// keyboard flies the aircraft and the mouse is a head, not a stick. W/S is
// throttle, A/D is rudder, the arrow keys are the stick — up/down pitch,
// left/right roll. Landing gear is deliberately not bound; in the real game it
// is automatic on altitude thresholds, which `Aircraft.integrate` reproduces.
//
// Freeing the mouse from the stick lets it do what the game's own hold-LShift
// free-look does: swivel the pilot's head inside a cockpit that is still flying
// straight, within the clamps the Corsair's camera declares.
//
// C cycles the view — `c_PIToggleCameraMode`, IDKey_C in the game's own control
// maps — through cockpit, chase, front and fly-by. `VehicleCamera` in flight.js
// owns all four and is explicit about which of them the data actually describes:
// the cockpit, and only the cockpit. Outside it the mouse orbits instead of
// swivelling, and fly-by ignores it entirely.

let aircraft = null;
const AIR_KEYS = new Set([
  'KeyW', 'KeyA', 'KeyS', 'KeyD', 'KeyR', 'Space',
  'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight',
]);

// --- the guns ---------------------------------------------------------------
//
// Same runtime as the model browser (`gunfire.js`), pointed at the flown
// vehicle instead of a model on a turntable. The Corsair's `CorsairGuns` is a
// two-barrel FireArms at 12 rounds a second, 400 m/s, tracer every third round,
// and all of that is read out of the scene — nothing about the Corsair appears
// below.
//
// Three things differ from firing a parked model, and all three are options:
//
//   - Rounds are parented to `scene`, never to the aircraft, or a tracer would
//     hang off the wing at a fixed distance for its whole life. That is the
//     module's own contract, so it costs nothing here beyond passing the
//     world in.
//   - `platformVelocity` adds the airframe's velocity to the muzzle's. Fired
//     level it barely shows against 400 m/s; fired in a dive or a hard yaw the
//     stream visibly leans away from the nose, which is the tell that the
//     rounds are really in the world and not glued to the gun.
//     Not modelled: the muzzle's own `omega x r` from the roll rate. At the
//     Corsair's 200 deg/s and a 2.23 m semi-span that is 7.8 m/s across a
//     400 m/s round — 1.1 degrees, the same order as the gun convergence the
//     muzzle nodes already carry, and it needs the body-rate sign convention
//     to be right to be worth having.
//   - Real muzzle velocity (`speedScale: 1`) and the round's declared
//     `timeToLive`. The browser slows fast rounds to 15% because a 400 m/s
//     round crosses a parked model between two frames; from a cockpit moving
//     at 50 m/s the round's motion *relative to you* is the picture, and it
//     reads as the dashed stream the game draws. A `Tracer_Projectile` then
//     lives its declared 3 s, which at 400 m/s is 1200 m — past Wake's 500 m
//     draw distance, so in practice the stream fades into the fog and expires
//     unseen, exactly as it does in game.
//   - `viewportHeight` is the tracer width floor's denominator. Read off the
//     drawing buffer rather than the window because `__renderOnce` resizes it
//     to whatever a headless check asked for, and a floor measured against the
//     wrong height is a streak that grows or vanishes only under test.
const _bufferSize = new THREE.Vector2();
const guns = new GunFire({
  scene, camera,
  viewportHeight: () => renderer.getDrawingBufferSize(_bufferSize).y,
});
let aircraftGuns = [];

function collectGuns() {
  aircraftGuns = aircraft
    ? guns.collect(aircraft.node, {
      speedScale: 1,
      maxRange: 1500,
      roundLifetime: 'data',
      tracerLength: 'data',
      platformVelocity: () => aircraft?.state.velocity ?? null,
    })
    : [];
}

function releaseGuns() {
  for (const group of aircraftGuns) guns.setFiring(group, false);
  guns.clear();
}

// --- what the rounds run into ----------------------------------------------
//
// Gaps C-1, C-5, C-6 and M-2 of `parity-audit/projectiles-collision.md`, all
// behind one object. `collision.js` owns the arithmetic; this is the wiring.
//
// Three inputs, all already shipped and none of them new:
//   - the terrain tiles in the scene, snapped back onto the level's own height
//     lattice (4 m on every vanilla map);
//   - `waterLevel` out of `scene.json`, one horizontal plane;
//   - every node the assembler tagged `extras.collision`, which the map export
//     now carries (Wake 20,911 triangles, Bocage 21,661) and which `indexScene`
//     already hides from the render pass.
//
// Plus two tables that decide what a hit *means* rather than where it is:
// `terrain/materials.png` (one byte per heightmap sample, straight out of
// `Materialmap.raw`) and `_shared/damage.json`'s `effects` matrix.
let terrainMaterials = null;
let damageTables = null;

async function loadDamageTables(dir) {
  const ref = extras?.damage;
  if (!ref?.path) return null;
  try {
    return await fetch(`${dir}/${ref.path}${bust()}`).then(r => r.ok ? r.json() : null);
  } catch { return null; }
}

/**
 * `terrain/materials.png` back into the byte array it was written from.
 *
 * The exporter puts the raw id in all three colour channels so the file is
 * legible to a human; only red is read here, and nothing is filtered — a
 * bilinear read between id 10 (dry sand) and id 12 (rock) would invent id 11.
 */
async function loadTerrainMaterials(dir) {
  const spec = extras?.terrain?.materials;
  if (!spec?.image) return null;
  try {
    const blob = await fetch(`${dir}/${spec.image}${bust()}`).then(r => r.ok ? r.blob() : null);
    if (!blob) return null;
    const bitmap = await createImageBitmap(blob);
    const canvas = document.createElement('canvas');
    canvas.width = bitmap.width;
    canvas.height = bitmap.height;
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(bitmap, 0, 0);
    const rgba = ctx.getImageData(0, 0, bitmap.width, bitmap.height).data;
    const ids = new Uint8Array(bitmap.width * bitmap.height);
    for (let i = 0; i < ids.length; i++) ids[i] = rgba[i * 4];
    return { ids, dim: bitmap.width, spacing: spec.spacing || 0 };
  } catch { return null; }
}

/** Rebuild the collider for the level now in `currentRoot`. */
function buildCollider(root) {
  const worldSize = extras?.worldSize || 0;
  const heightfield = buildHeightfield(terrainMeshes, {
    worldSize,
    dim: extras?.terrain?.materials?.dim || 0,
  });
  if (heightfield && terrainMaterials) {
    heightfield.setMaterials(terrainMaterials.ids, terrainMaterials.dim,
                             terrainMaterials.spacing || heightfield.spacing);
  }
  // One owner per placed object, and one per spawned vehicle rather than one
  // for the whole spawner group — otherwise a Sherman's round would pass
  // through the Willy parked next to it.
  const ownerRoots = [];
  for (const child of root.children) {
    if (child === spawnersRoot) ownerRoots.push(...child.children);
    else ownerRoots.push(child);
  }
  const statics = buildCollisionIndex(root, { ownerRoots });
  collider = (heightfield || statics || Number.isFinite(extras?.waterLevel))
    ? new WorldCollider({ heightfield, statics, waterLevel: extras?.waterLevel })
    : null;
  guns.collider = collider;
  guns.damageEffects = damageTables?.effects || null;
  guns.projectileMaterials = damageTables?.projectiles || null;
  return { heightfield, statics };
}
// Stick position, -1..1. Held keys drive it toward full deflection and it
// springs back to centre when they are released, which is what the surfaces'
// own `setAutomaticReset 1` does in the engine.
const stick = { roll: 0, pitch: 0 };
const STICK_RATE = 2.4;      // to full deflection in ~0.4 s
const STICK_RETURN = 3.2;    // and back to centre a little faster
const HEAD_SENS = 0.0022;
// The four views C cycles. Only `cockpit` is reconstructed from data — the look
// clamps it applies are `CorsairCamera`'s own setMin/setMaxRotation. Chase,
// front and fly-by are ours; the engine declares that they exist (`CVMChase`,
// `CVMFrontChase`, `CVMFlyBy`) and never where they sit. See flight.js.
let view = null;

function setPilot(on) {
  if (on && !aircraft) {
    const node = findVehicle(currentRoot, 'Corsair')
      || findVehicle(currentRoot, 'Spitfire')
      || findVehicle(currentRoot, 'Zero');
    if (!node) {
      optPilot.checked = false;
      return;
    }
    aircraft = new Aircraft(node, currentRoot);
    aircraft.groundHeight = groundHeight;
    // `Aircraft` defaults to forcing first person every step, because a page
    // with a single view has no other way to say "someone is sitting in it".
    // This page now has four, so it takes the decision over: `VehicleCamera`
    // calls `setFirstPerson` on every mode change, and the swap follows the view
    // rather than the sim. Leaving both on would have `integrate` slam the
    // interior back every frame the moment you pressed C.
    aircraft.autoFirstPerson = false;
    view = new VehicleCamera(aircraft, { groundHeight });
    // The flown vehicle must outlive the vehicles toggle and the distance cull;
    // reparenting out of `spawners` already took it off both lists, but the
    // spawn pose puts it on the deck, so lift it clear of its own wheels.
    aircraft.state.position.y += 0.2;
    collectGuns();
  }
  if (on && aircraft) {
    // Ticking the box is the user gesture the autoplay policy wants; the same
    // call on a map load is not one, and resume() there fails harmlessly until
    // the fly gate is clicked.
    ensureAudioContext();
    setupEngineAudio();
  }
  if (!on && aircraft) {
    stopEngineAudio();
    releaseGuns();
    aircraft.reset();
    // `reset()` only restores the exterior when it owns the swap, and it no
    // longer does. Vacating the seat has to put the fuselage back explicitly or
    // the parked plane sits on the strip as an open cockpit tub.
    view.setMode('cockpit');
    aircraft.setFirstPerson(false);
    aircraft.applyTransform();
    aircraft.applyRig();
  }
  stick.roll = 0;
  stick.pitch = 0;
  hud.textContent = on ? HUD_PILOT : (isTouchDevice ? HUD_TOUCH : HUD_FLY);
}

const HUD_PILOT = 'W/S throttle · A/D rudder · arrows pitch and roll · Space guns · '
  + 'C view · mouse look around · R reset · Esc';

/** Announce the view C just selected, then fall back to the control list. */
const VIEW_BLURB = {
  cockpit: 'cockpit · first person, from the pilot\'s eye point',
  chase: 'chase · behind and above, horizon held level',
  front: 'front · ahead of the nose, looking back',
  flyby: 'fly-by · planted in the world, re-plants as you pull away',
};
let hudViewTimer = 0;
function showView(mode) {
  hud.textContent = `view: ${VIEW_BLURB[mode]}`;
  clearTimeout(hudViewTimer);
  hudViewTimer = setTimeout(() => {
    if (optPilot.checked) hud.textContent = HUD_PILOT;
  }, 2200);
}

/**
 * Move an axis toward a held key's demand, and spring it back when released.
 * A digital key on an analogue surface needs this or every input is a slam.
 */
function axisToward(current, demand, dt) {
  const rate = (demand === 0 ? STICK_RETURN : STICK_RATE) * dt;
  const gap = demand - current;
  return Math.abs(gap) <= rate ? demand : current + Math.sign(gap) * rate;
}

/** Read the keyboard into the aircraft's inputs and step the sim. */
function pilot(dt) {
  if (!aircraft) return;
  const held = captured ? keys : new Set();

  // W/S throttle. It latches rather than springs — you set a power setting and
  // it stays there, which is what a throttle quadrant does.
  const power = (held.has('KeyW') ? 1 : 0) - (held.has('KeyS') ? 1 : 0);
  if (power) {
    aircraft.setInput('c_PIThrottle', Math.max(0, Math.min(1,
      aircraft.input('c_PIThrottle') + power * dt)));
  }

  // A/D rudder, arrows for the stick.
  aircraft.setInput('c_PIYaw',
    axisToward(aircraft.input('c_PIYaw'),
      (held.has('KeyD') ? 1 : 0) - (held.has('KeyA') ? 1 : 0), dt));
  stick.roll = axisToward(stick.roll,
    (held.has('ArrowRight') ? 1 : 0) - (held.has('ArrowLeft') ? 1 : 0), dt);
  // Pitch is inverted, which is a real stick and the game's own default for
  // aircraft: pull back to climb. Up arrow puts the nose down.
  stick.pitch = axisToward(stick.pitch,
    (held.has('ArrowUp') ? 1 : 0) - (held.has('ArrowDown') ? 1 : 0), dt);
  aircraft.setInput('c_PIRoll', stick.roll);
  aircraft.setInput('c_PIPitch', stick.pitch);

  // The trigger is an input like any other, so a replay frame that writes
  // `c_PIFire` fires the guns without knowing a keyboard exists. Which gun a
  // given input pulls is the gun's own business: `CorsairGuns` declares
  // `c_PIFire` and `CorsairBombDummy` declares `c_PIAltFire`, and the extractor
  // ships both, so nothing here names either one.
  aircraft.setInput('c_PIFire', held.has('Space') ? 1 : 0);

  aircraft.integrate(dt);

  // After `integrate`, so a round leaves this frame's muzzle pose rather than
  // last frame's — at 55 m/s that is a metre of lag, and it shows as tracers
  // spawning behind the wing.
  //
  // `integrate` is also what settles the cockpit swap, and the flash follows
  // the view: the pilot gets `em_1P_MuzzHeavy`'s 0.4 m sprite, an observer
  // outside gets the 1.76 m `MuzzHeavy_m1` mesh that would otherwise hang five
  // metres off the wing two metres from his eye.
  guns.firstPerson = aircraft.firstPerson;
  for (const group of aircraftGuns) {
    guns.setFiring(group, aircraft.input(group.stats.input || 'c_PIFire') > 0);
  }

  // The view rig owns all four modes and their smoothing; this just takes the
  // pose. It runs after `integrate` so an external camera hangs off this frame's
  // attitude rather than last frame's — at 55 m/s that is a metre of lag, and on
  // a chase camera it reads as the aircraft sliding around inside the frame.
  const pose = view.update(dt);
  camera.position.copy(pose.position);
  camera.quaternion.copy(pose.quaternion);
}

function wireframe(on) {
  if (!currentRoot) return;
  currentRoot.traverse(obj => {
    if (!obj.isMesh || isCollision(obj)) return;
    for (const m of [obj.material].flat()) m.wireframe = on;
  });
}

async function loadSky(entry) {
  disposeSky();
  const faces = extras.skybox;
  if (!faces || faces.length !== 6) return;
  const dir = entry.glb.replace(/\/[^/]+$/, '');
  const tex = await cubeLoader.loadAsync(
    faces.map(f => `${MAPS_BASE}/${dir}/${f}${bust()}`),
  );
  tex.colorSpace = THREE.SRGBColorSpace;
  skybox = tex;
}

// LoadingManager counters are cumulative for the life of the page and never
// reset, so a per-load view has to be taken against a baseline captured when
// that load starts.
const tex = { total: 0, loaded: 0, baseTotal: 0, baseLoaded: 0, load: null };

function texReport() {
  if (!tex.load) return;
  const total = tex.total - tex.baseTotal;
  const done = tex.loaded - tex.baseLoaded;
  tex.load.count('textures', done, total);
  if (total > 0 && done >= total) {
    tex.load.end();
    tex.load = null;
  }
}

texManager.onStart = (url, loaded, total) => {
  tex.loaded = loaded;
  tex.total = total;
  texReport();
};
texManager.onProgress = (url, loaded, total) => {
  tex.loaded = loaded;
  tex.total = total;
  texReport();
};

// ---------------------------------------------------------------------------
// The map art. The HUD minimap and the fullscreen map are the same picture at
// different sizes and zooms — that is what the engine does too: `menu/InGame`
// hot-swaps one picture node built from a single `Textures/InGameMap.tga`
// path, and there is no second map asset anywhere in the archives.
//
// The art frames the level's *active combat area*, not the world. `scene.json`
// carries the projection as an affine so the viewer never re-derives it:
//     u = m[0]*x + m[1]*z + m[2]
//     v = m[3]*x + m[4]*z + m[5]
// with (x, z) in glTF world metres and (u, v) in 0..1 from the top left.
// ---------------------------------------------------------------------------
const minimapBox = document.getElementById('minimap');
const minimapCanvas = document.getElementById('minimap-canvas');
const minimapGrid = document.getElementById('minimap-grid');
const fullmapBox = document.getElementById('fullmap');
const fullmapCanvas = document.getElementById('fullmap-canvas');
const fullmapName = document.getElementById('fullmap-name');
const fullmapMeta = document.getElementById('fullmap-meta');

// How much of the map the HUD window shows. The engine's zoom steps were not
// recovered from the binary, so this is a viewer choice: a quarter of the
// combat area keeps a 2 km level readable without losing the grid letters.
const MINIMAP_SPAN = 0.25;
// Marker sizes below are in CSS pixels and get multiplied by the canvas's own
// backing ratio, so a flag is the same size on the 188 px HUD widget as on the
// fullscreen map and stays put on a hidpi display.
const MARKER_SCALE = 1.25;
const TEAM_FILL = { 1: '#d2564b', 2: '#4f8fd0', 0: '#9a9a9a' };
const TEAM_EDGE = { 1: '#f0a49c', 2: '#a8cdf2', 0: '#d0d0d0' };

let mapArt = null;          // HTMLImageElement once the PNG has decoded
let mapArtToken = 0;        // guards against a slow load landing after a switch

function loadMapArt(dir) {
  mapArt = null;
  const token = ++mapArtToken;
  const rel = extras.minimap?.image;
  minimapBox.hidden = !extras.minimap;
  if (!rel) return;
  const img = new Image();
  img.onload = () => { if (token === mapArtToken) mapArt = img; };
  // A level with no art still gets markers on a blank grid, so a failed
  // decode is not worth surfacing.
  img.onerror = () => {};
  img.src = `${MAPS_BASE}/${dir}/${rel}${bust()}`;
}

function projectToArt(x, z) {
  const m = extras.minimap?.worldToImage;
  if (!m) return null;
  return { u: m[0] * x + m[1] * z + m[2], v: m[3] * x + m[4] * z + m[5] };
}

/** Grid reference under a world position, the way the art is lettered: A-H
 *  across, 1-8 down. The labels are painted into the image, so this only has
 *  to agree with them, not with any engine call. */
function gridRef(x, z) {
  const p = projectToArt(x, z);
  if (!p || p.u < 0 || p.u > 1 || p.v < 0 || p.v > 1) return '—';
  const col = Math.min(7, Math.max(0, Math.floor(p.u * 8)));
  const row = Math.min(7, Math.max(0, Math.floor(p.v * 8)));
  return `${'ABCDEFGH'[col]}${row + 1}`;
}

/** Camera heading as a screen-space angle, 0 pointing up the image.
 *
 *  Taken from the camera's world direction rather than `look.yaw` so it stays
 *  correct in the pilot and vehicle camera modes, which drive the camera by
 *  quaternion and never touch `look`. The image's V axis grows with glTF +Z,
 *  so "up the image" is -Z. */
const headingVec = new THREE.Vector3();
function cameraHeading() {
  camera.getWorldDirection(headingVec);
  return Math.atan2(headingVec.x, -headingVec.z);
}

function drawArt(ctx, size, u0, v0, span) {
  ctx.fillStyle = '#0d0f10';
  ctx.fillRect(0, 0, size, size);
  if (!mapArt) return;
  const sx = u0 * mapArt.width;
  const sy = v0 * mapArt.height;
  const sw = span * mapArt.width;
  const sh = span * mapArt.height;
  ctx.drawImage(mapArt, sx, sy, sw, sh, 0, 0, size, size);
}

function drawControlPoint(ctx, cp, px, py, scale) {
  const r = 5 * scale;
  ctx.lineWidth = Math.max(1, 1.5 * scale);
  if (!cp.visible) {
    // A capture zone the level deliberately left without a flag: Kasserine
    // Pass is five of them. Drawn as a dashed ring so it reads as a place you
    // capture rather than a thing you can see.
    ctx.strokeStyle = TEAM_EDGE[cp.team] || TEAM_EDGE[0];
    ctx.setLineDash([3 * scale, 3 * scale]);
    ctx.beginPath();
    ctx.arc(px, py, r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    return;
  }
  // A flag on a staff: the staff marks the exact world position, the banner
  // hangs off it, which is how the game's own map icons read.
  const h = 13 * scale;
  ctx.strokeStyle = 'rgba(0,0,0,.75)';
  ctx.lineWidth = Math.max(1, 2.5 * scale);
  ctx.beginPath();
  ctx.moveTo(px, py);
  ctx.lineTo(px, py - h);
  ctx.stroke();
  ctx.strokeStyle = '#f0f0f0';
  ctx.lineWidth = Math.max(1, 1 * scale);
  ctx.beginPath();
  ctx.moveTo(px, py);
  ctx.lineTo(px, py - h);
  ctx.stroke();
  ctx.fillStyle = TEAM_FILL[cp.team] || TEAM_FILL[0];
  ctx.strokeStyle = 'rgba(0,0,0,.8)';
  ctx.beginPath();
  ctx.moveTo(px + 1, py - h);
  ctx.lineTo(px + 1 + 9 * scale, py - h + 3.5 * scale);
  ctx.lineTo(px + 1, py - h + 7 * scale);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
}

function drawPlayer(ctx, px, py, scale) {
  const a = cameraHeading();
  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(a);
  const s = 7 * scale;
  ctx.fillStyle = '#f5d76e';
  ctx.strokeStyle = 'rgba(0,0,0,.85)';
  ctx.lineWidth = Math.max(1, 1.2 * scale);
  ctx.beginPath();
  ctx.moveTo(0, -s);
  ctx.lineTo(s * 0.62, s * 0.72);
  ctx.lineTo(0, s * 0.34);
  ctx.lineTo(-s * 0.62, s * 0.72);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}

/** Match a canvas's backing store to the box it is displayed in.
 *
 *  Returns the device ratio so markers can be sized in CSS pixels. Without
 *  this the HUD widget draws into a 376 px buffer shown at 186 px and every
 *  marker comes out half the size it was asked for. */
function fitCanvas(canvas) {
  const css = canvas.getBoundingClientRect().width;
  if (!css) return canvas.__ratio || 1;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const want = Math.round(css * dpr);
  if (canvas.width !== want) {
    canvas.width = want;
    canvas.height = want;
  }
  canvas.__ratio = dpr;
  return dpr;
}

/** One map surface. `span` is the fraction of the art shown, `u0`/`v0` its
 *  top-left corner — the fullscreen map passes the whole image, the HUD a
 *  window centred on the camera. */
function paintMap(canvas, u0, v0, span, opts) {
  const ctx = canvas.getContext('2d');
  const ratio = fitCanvas(canvas);
  const size = canvas.width;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  drawArt(ctx, size, u0, v0, span);
  if (!extras.minimap?.worldToImage) return;

  const toPx = p => ({
    x: ((p.u - u0) / span) * size,
    y: ((p.v - v0) / span) * size,
  });
  const scale = MARKER_SCALE * ratio * (opts.scale || 1);

  if (opts.combatArea && extras.combatArea) {
    // Only worth drawing when it is not the whole frame, which it is whenever
    // the level declares one — so this shows up only on the levels that do not.
    const a = projectToArt(extras.combatArea.min[0], extras.combatArea.min[2]);
    const b = projectToArt(extras.combatArea.max[0], extras.combatArea.max[2]);
    if (a && b) {
      const p = toPx(a), q = toPx(b);
      ctx.strokeStyle = 'rgba(245,215,110,.35)';
      ctx.setLineDash([6, 5]);
      ctx.lineWidth = 1;
      ctx.strokeRect(Math.min(p.x, q.x), Math.min(p.y, q.y),
                     Math.abs(q.x - p.x), Math.abs(q.y - p.y));
      ctx.setLineDash([]);
    }
  }

  if (opts.spawns) {
    for (const sp of extras.soldierSpawns || []) {
      const p = projectToArt(sp.position[0], sp.position[2]);
      if (!p) continue;
      const q = toPx(p);
      ctx.fillStyle = sp.team ? (TEAM_FILL[sp.team] || TEAM_FILL[0]) : TEAM_FILL[0];
      ctx.globalAlpha = 0.75;
      ctx.beginPath();
      ctx.arc(q.x, q.y, Math.max(1.2, 2 * scale), 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  const labels = [];
  for (const cp of extras.controlPoints || []) {
    const p = projectToArt(cp.position[0], cp.position[2]);
    if (!p) continue;
    const q = toPx(p);
    if (opts.radius && cp.radius > 0) {
      // The capture radius is a world distance, so it scales with the art.
      const m = extras.minimap.worldToImage;
      const rUv = cp.radius * Math.abs(m[0]);
      ctx.strokeStyle = TEAM_EDGE[cp.team] || TEAM_EDGE[0];
      ctx.globalAlpha = 0.28;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(q.x, q.y, (rUv / span) * size, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    drawControlPoint(ctx, cp, q.x, q.y, scale);
    if (opts.labels) labels.push({ cp, q });
  }

  // Labels last, and placed against what is already down. Control points
  // cluster — Wake puts Village and North Base within a flag's width of each
  // other — and drawn blindly the two names overprint into one unreadable
  // run of letters.
  if (opts.labels && labels.length) {
    ctx.font = `${Math.round(9 * scale)}px ui-monospace, SFMono-Regular, Menlo, monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const placed = [];
    const gap = 17 * scale;
    for (const { cp, q } of labels) {
      const text = cp.displayName.replace(/_/g, ' ');
      const w = ctx.measureText(text).width + 6 * scale;
      const h = 11 * scale;
      // Below first — it is clear of the flag, which flies up and to the
      // right of the staff — then above, then out to either side.
      const spots = [
        [q.x, q.y + gap], [q.x, q.y - gap * 1.25],
        [q.x + w / 2 + 6 * scale, q.y], [q.x - w / 2 - 6 * scale, q.y],
        [q.x, q.y + gap * 1.9], [q.x, q.y - gap * 2],
      ];
      let spot = null;
      for (const [cx, cy] of spots) {
        const box = { x0: cx - w / 2, x1: cx + w / 2, y0: cy - h / 2, y1: cy + h / 2 };
        if (box.x0 < 0 || box.x1 > size) continue;
        if (placed.some(p => box.x0 < p.x1 && box.x1 > p.x0
                          && box.y0 < p.y1 && box.y1 > p.y0)) continue;
        spot = [cx, cy]; placed.push(box); break;
      }
      if (!spot) continue;      // nowhere clear: the flag alone has to say it
      ctx.fillStyle = 'rgba(0,0,0,.82)';
      ctx.fillText(text, spot[0] + 1, spot[1] + 1);
      ctx.fillStyle = '#e8e8e8';
      ctx.fillText(text, spot[0], spot[1]);
    }
    ctx.textBaseline = 'alphabetic';
  }

  const here = projectToArt(camera.position.x, camera.position.z);
  if (here) {
    const q = toPx(here);
    drawPlayer(ctx, q.x, q.y, scale);
  }
}

function drawMinimap() {
  if (minimapBox.hidden) return;
  const here = projectToArt(camera.position.x, camera.position.z);
  if (!here) return;
  // North-up with a rotating arrow. That is the game's own shipped default —
  // every stock profile sets `game.setStaticMinimap 1` — and it keeps the
  // baked-in grid letters upright.
  const half = MINIMAP_SPAN / 2;
  const u0 = Math.min(Math.max(here.u - half, 0), 1 - MINIMAP_SPAN);
  const v0 = Math.min(Math.max(here.v - half, 0), 1 - MINIMAP_SPAN);
  paintMap(minimapCanvas, u0, v0, MINIMAP_SPAN,
           { spawns: false, radius: false, labels: false });
  minimapGrid.textContent = gridRef(camera.position.x, camera.position.z);
}

function drawFullMap() {
  if (fullmapBox.hidden) return;
  // Bigger markers than the HUD widget: this surface is three times the size
  // and carries labels, spawn dots and capture rings on top of the flags.
  paintMap(fullmapCanvas, 0, 0, 1,
           { scale: 1.5, spawns: true, radius: true, labels: true, combatArea: true });
}

function toggleFullMap(on) {
  const want = on ?? fullmapBox.hidden;
  fullmapBox.hidden = !want;
  // Holding the map is not flying. Releasing the pointer lock also stops the
  // movement keys running under the overlay.
  if (want && captured) release();
  if (want) drawFullMap();
}
fullmapBox.addEventListener('click', () => toggleFullMap(false));

async function show(entry) {
  const load = overlay.begin(entry.name);
  load.step('report', { label: 'level report', weight: 1 });
  // Weighted by what the bytes actually are: one ~70 MB scene against a couple
  // of MB of loose textures and a 2 KB report.
  load.step('scene', { label: 'scene geometry', weight: 88 });
  load.step('textures', { label: 'textures', weight: 11 });
  tex.baseTotal = tex.total;
  tex.baseLoaded = tex.loaded;
  tex.load = load;

  let report;
  let gltf;
  try {
    report = await fetch(`${MAPS_BASE}/${entry.report}${bust()}`).then(r => r.json());
    load.finish('report');
    gltf = await loader.loadAsync(
      `${MAPS_BASE}/${entry.glb}${bust()}`,
      e => load.bytes('scene', e.loaded, e.lengthComputable ? e.total : 0),
    );
    load.finish('scene');
  } catch (error) {
    if (tex.load === load) tex.load = null;
    load.fail(`could not load ${entry.name}: ${error.message}`);
    throw error;
  }
  extras = report;
  // Before the old root is disposed: every gun is indexed off a node in it, and
  // the rounds in the air are clones of nodes it owns.
  releaseGuns();
  guns.groups.length = 0;
  aircraftGuns = [];
  dispose(currentRoot);
  disposeSky();
  disposeSounds();
  currentRoot = gltf.scene;
  // Baked fire-effect payloads (muzzle flashes, projectile bodies, trail
  // quads) ride every assembled vehicle; only the model viewer animates
  // them, so here they must stay hidden or they render parked on the guns.
  currentRoot.traverse(obj => {
    if (obj.userData?.effect || obj.userData?.projectileMesh
        || obj.userData?.projectileTrail) obj.visible = false;
  });
  scene.add(currentRoot);
  // The flags, and the level's always-on rotators — windmills, watermills,
  // radar dishes — which the extractor bakes as `ambient`/`ambient.N`.
  // `spin*` is deliberately NOT played: that is throttle-gated rotation, and
  // a parked aircraft's propeller is stationary in the game. The one aircraft
  // that should turn is the flown one, whose propeller `advancePropeller` in
  // flight.js already accumulates from its rate axes — playing the baked clip
  // here as well would drive it twice.
  flagMixer = null;
  const ambient = (gltf.animations || []).filter(
    c => !/^spin(\.\d+)?$/.test(c.name));
  if (ambient.length) {
    flagMixer = new THREE.AnimationMixer(currentRoot);
    for (const clip of ambient) {
      const action = flagMixer.clipAction(clip);
      // The engine gives each flag a random start phase so a row of them does
      // not beat in unison; `randomStartPitch` in `flag.ssc` does the same for
      // the sound. Without it five flags on one map flap as one object.
      action.time = Math.random() * clip.duration;
      action.play();
    }
  }
  const dir = entry.glb.replace(/\/[^/]+$/, '');
  currentDir = dir;
  bindLightmaps(currentRoot, dir);
  unlightTerrain(currentRoot);
  bindTerrainDetail(currentRoot, dir);
  setupSky(currentRoot, dir);
  setupWater(currentRoot, dir);
  setupSounds(extras, dir);
  loadMapArt(dir);
  // A map held open across a level switch would be showing the old level.
  toggleFullMap(false);
  fullmapName.textContent = extras.level || entry.name;
  const cps = (extras.controlPoints || []).length;
  fullmapMeta.textContent = cps
    ? `${cps} control point${cps === 1 ? '' : 's'} · ${(extras.soldierSpawns || []).length} spawns`
    : '';
  // After the baked paths and the sky/water shaders have claimed their
  // meshes, everything still on a lit glTF material is the engine's
  // fixed-function path: vehicles and non-lightmapped statics.
  bindDynamicShading(currentRoot);
  applyLighting();
  if (extras.sunDirection) {
    // The sun light points along -sunLightDirectionVec toward the origin.
    sun.position.set(
      extras.sunDirection[0] * -400,
      extras.sunDirection[1] * 400,
      extras.sunDirection[2] * -400,
    );
  }
  indexScene(currentRoot);
  collectTerrain(currentRoot);
  // Both tables are small (damage.json 154 KB shared across every level,
  // materials.png a couple of KB) and both are needed before the first shot,
  // not before the first frame.
  [terrainMaterials, damageTables] = await Promise.all([
    loadTerrainMaterials(dir), loadDamageTables(dir),
  ]);
  const collision = buildCollider(currentRoot);
  // A new level means a new scene graph; the old aircraft's node is gone, and
  // the view rig holds a reference to it.
  aircraft = null;
  view = null;
  if (optPilot.checked) setPilot(true);
  applyFar();
  if (!skyRoot) await loadSky(entry);
  applyFog();
  placeCamera();
  wireframe(optWire.checked);
  applyVisibility();
  const t = extras.terrain || {};
  const o = extras.objects || {};
  document.getElementById('stats').innerHTML =
    `<strong>${extras.level || entry.name}</strong><br>` +
    `world ${extras.worldSize || '?'} m<br>` +
    `terrain ${t.triangles || 0} tris / ${t.tiles || 0} tiles` +
    (t.defaultTiles ? ` + ${t.defaultTiles} default` : '') +
    (t.detail ? ' + detail' : '') + `<br>` +
    `objects ${o.placed || 0} placed` +
    (o.spawners ? ` / ${o.spawners} vehicles` : '') +
    (o.lightmaps ? ` / ${o.lightmaps} lightmaps` : '') +
    (o.skipped?.length ? ` / ${o.skipped.length} skipped` : '') + `<br>` +
    `sky ${extras.sky ? extras.sky.mesh + (extras.sky.clouds ? ' + clouds' : '') :
          (extras.skybox ? 'env cubemap' : 'fog colour')} / ` +
    `water ${extras.water ? 'shader' : 'flat'}<br>` +
    // A level exported before the collision flip has a heightfield and a sea
    // and no hulls; saying so beats a silent half-working collider.
    `collision ${collision.statics
      ? `${collision.statics.count} tris` : 'hulls not exported'}` +
    (collision.heightfield
      ? ` / heightfield ${collision.heightfield.dim}^2 @ ${collision.heightfield.spacing} m`
      : ' / no heightfield') +
    (t.materials ? ` / ${Object.keys(t.materials.labels || {}).length} surfaces` : '');

  // Every texture this level needs has been queued by now, so a queue that is
  // already drained (or was never filled) means the load is done — texReport
  // alone would sit waiting for a callback that is not coming.
  if (tex.total - tex.baseTotal <= tex.loaded - tex.baseLoaded) {
    load.end();
    if (tex.load === load) tex.load = null;
  } else {
    texReport();
  }
}

optGameFog.addEventListener('change', applyFog);
optWire.addEventListener('change', e => wireframe(e.target.checked));
optVehicles.addEventListener('change', applyVisibility);
optEntire.addEventListener('change', () => {
  applyFar();
  applyFog();
  applyVisibility();
});

const manifest = await fetch(`${MAPS_BASE}/maps.json${bust()}`)
  .then(r => r.ok ? r.json() : [])
  .catch(() => []);
const select = document.getElementById('maps');
if (!manifest.length) {
  select.hidden = true;
  document.getElementById('stats').textContent =
    'No maps yet. From tools/bf1942-models run: python3 extract_map.py Tobruk';
} else {
  for (const entry of manifest) {
    select.appendChild(new Option(entry.name, entry.name));
  }
  select.addEventListener('change', () => {
    const entry = manifest.find(e => e.name === select.value);
    if (entry) show(entry);
  });
  const wanted = (params.get('map') || '').toLowerCase();
  const first = manifest.find(e => e.name.toLowerCase() === wanted) || manifest[0];
  select.value = first.name;
  await show(first);
}

optSound.addEventListener('change', () => {
  ensureAudioContext();
  updateAudio();
});
optSoundVol.addEventListener('input', () => {
  ensureAudioContext();
  updateAudio();
});
optPilot.addEventListener('change', () => {
  setPilot(optPilot.checked);
  if (!optPilot.checked) placeCamera();
});

const clock = new THREE.Clock();
function frame(dt) {
  if (optPilot.checked && aircraft) {
    pilot(dt);
  } else {
    fly(dt);
    applyLook();
  }
  // Unconditional: rounds already in the air have to finish their flight even
  // if the trigger, the pilot mode or the whole aircraft has gone away.
  guns.advance(dt);
  applyVisibility();
  advanceSim(dt);
  updateAudio(dt);
  updateSky();
  renderer.render(scene, camera);
  drawMinimap();
  drawFullMap();
}
renderer.setAnimationLoop(() => frame(Math.min(clock.getDelta(), 0.1)));
if (params.has('shots')) {
  // Screenshot tooling in a hidden tab gets no requestAnimationFrame ticks
  // and reports a 0x0 window; let it force a sized, deterministic frame
  // before reading the canvas back.
  window.__renderOnce = (w = 1280, h = 800) => {
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    frame(1 / 60);
    return true;
  };
  // Scene handles for offline inspection: isolating one shader term is the
  // only practical way to attribute an artefact to it.
  window.__scene = scene;
  window.__camera = camera;
  window.__renderer = renderer;
  window.__THREE = THREE;
  // Flight state for headless checks: the sim is deterministic under
  // __renderOnce, so a test can step it frame by frame and read the result.
  Object.defineProperty(window, '__aircraft', { get: () => aircraft });
  window.__stick = stick;
  // Free-fly heading. Setting `camera.rotation` directly is pointless here —
  // `applyLook` rewrites it from `look` on every frame — so a headless check
  // that wants to face the camera somewhere has to move this instead.
  window.__look = look;
  // The view rig, which the mouse and the C key drive and a headless run cannot.
  // `__view.turn()` is the pilot's head in the cockpit — a Corsair's guns sit 40
  // degrees off the nose, so framing them means looking at them — and the orbit
  // outside it. `__setView(mode)` selects a mode without walking the cycle.
  Object.defineProperty(window, '__view', { get: () => view });
  window.__setView = mode => {
    if (!view) return null;
    const set = view.setMode(mode);
    showView(set);
    return set;
  };
  // Headless checks fly through the real input path rather than poking the
  // aircraft: add key codes to __keys and open the gate with __setFly(true).
  window.__keys = keys;
  window.__setFly = setFly;
  // Gun state, for headless checks. Muzzle world positions are what settles the
  // question the moving-vehicle port exists to answer: a tracer's position must
  // diverge from the muzzle it left, not travel with it.
  window.__getFire = () => ({
    groups: aircraftGuns.map(group => ({
      name: group.node.name,
      input: group.stats.input,
      roundOfFire: group.stats.roundOfFire,
      velocity: group.stats.velocity,
      tracerInterval: group.stats.tracer?.interval ?? null,
      firing: group.firing,
      shots: group.shots,
      muzzles: group.muzzles.map(node => {
        node.updateWorldMatrix(true, false);
        return {
          name: node.name,
          world: node.getWorldPosition(new THREE.Vector3()).toArray(),
        };
      }),
      flashes: group.emitters.map(emitter => ({
        name: emitter.node.name,
        muzzle: emitter.muzzle?.name ?? null,
        visible: emitter.node.visible,
        additive: [emitter.node.material].flat()
          .every(m => m.blending === THREE.AdditiveBlending),
      })),
    })),
    tracers: guns.tracers.map(tracer => ({
      position: tracer.mesh.position.toArray(),
      velocity: tracer.velocity.toArray(),
      bright: tracer.bright,
      age: tracer.age,
      ttl: tracer.ttl,
      // What the width floor settled on this frame, against the streak's own
      // length scale: equal means the real mesh was already wide enough.
      scale: tracer.mesh.scale.toArray(),
      lengthScale: tracer.lengthScale,
      parent: tracer.mesh.parent === scene ? 'scene' : (tracer.mesh.parent?.name ?? null),
    })),
    // Where rounds stopped, newest first, each carrying the surface it struck
    // and the EffectBundle the MaterialManager names for that pairing. The
    // selection is assertable even though the drawing is a stand-in.
    hits: guns.hits,
    impacts: guns.impacts.length,
    projectiles: guns.projectiles.length,
    pooled: guns.tracerPool.length,
    // Baked streaks recycle into their own group's pool, not the shared
    // cylinder pool, so a leak there is invisible to `pooled` alone.
    meshPooled: aircraftGuns.reduce((n, g) => n + g.tracerMeshPool.length, 0),
  });
  // The collider itself, for measuring rather than for asserting: `__collision()`
  // drains the accumulated cast cost, so calling it once a second gives the real
  // microseconds-per-query number the feature doc quotes.
  window.__collision = () => collider && ({
    heightfield: collider.heightfield && {
      dim: collider.heightfield.dim,
      spacing: collider.heightfield.spacing,
      coverage: collider.heightfield.coverage,
      materials: Boolean(collider.heightfield.materials),
    },
    waterLevel: collider.waterLevel,
    statics: collider.statics && {
      triangles: collider.statics.count,
      cells: collider.statics.cols * collider.statics.rows,
      cellSize: collider.statics.cellSize,
      entries: collider.statics.cellItems.length,
    },
    cost: collider.drainCost(),
  });
  window.__castRay = (from, dir, dist) => {
    const length = Math.hypot(dir[0], dir[1], dir[2]) || 1;
    const hit = collider?.cast(from[0], from[1], from[2],
                               dir[0] / length, dir[1] / length, dir[2] / length,
                               dist, -1);
    return hit && { t: hit.t, point: [hit.x, hit.y, hit.z], kind: hit.kind,
                    material: hit.material, owner: hit.owner };
  };
  window.__getAudioState = () => ({
    audioListener,
    ambientAudio,
    activeAreaAudios,
    // Headless Chromium will not let anyone listen, so the engine crossfade has
    // to be asserted on the graph: per-layer gain and playback rate, and the
    // voice count, which is the number the hall-echo bug moved.
    engine: engineAudio ? engineAudio.snapshot() : null,
    // Same reason as the engine, plus one of its own: a gun patch is gated by
    // gain per trigger pull, so "no voice was added while Space was held" is
    // the assertion that keeps the hall-echo bug from coming back through the
    // weapons.
    weapons: weaponAudio.map(w => ({
      fireArms: w.spec.fireArms,
      node: w.node?.name ?? null,
      ...w.audio.snapshot(),
    })),
  });
}
</script>
</body>
</html>

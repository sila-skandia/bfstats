  stick.pitch = 0;
  hud.textContent = on
    ? (mannedActive() ? HUD_MANNED : car ? HUD_DRIVE : HUD_PILOT)
    : (optOnFoot.checked && soldier ? HUD_FOOT
      : isTouchDevice ? getTouchHudText() : HUD_FLY);
}

const HUD_PILOT = 'W/S throttle · A/D rudder · arrows pitch and roll · Space guns · '
  + 'C view · mouse look around · R reset · 1-9 seats · E out on the ground · Esc';
const HUD_DRIVE = 'W/S drive and brake · A/D steer · C view · mouse look around · '
  + 'R reset · 1-9 seats · E get out · Esc';
const HUD_MANNED = 'Mouse aims · Space fires · 1-9 seats · E get out · Esc';

/**
 * Read the keyboard into the car and step the drive model.
 *
 * Round 3's first disclosed gap: this now runs every frame the vehicle
 * exists, not only while its own root/driver seat is the one active. Before,
 * `frame()`'s dispatch called this exclusively (never alongside `manned()`),
 * so switching to a nested seat — the Sherman's own hull gunner — stopped
 * `car.integrate(dt)` from ever being called again, freezing the hull's
 * momentum, suspension and gravity dead rather than leaving it to coast on
 * whatever throttle and steering the driver last set, the way it would if
 * the driver had simply let go of the wheel instead of climbing to a
 * different seat. Reading fresh keyboard input, firing this seat's own
 * `vehicleGuns` and moving the camera all stay exclusive to the frames the
 * driver's own root seat is actually the one occupied (`driving` below) —
 * otherwise nobody is holding this wheel right now, and `manned()` (not this
 * function) owns the camera and the trigger for whichever seat really is.
 */
function drive(dt) {
  if (!car) return;
  const driving = occupancy.isActiveRoot();
  if (driving) {
    const held = captured ? keys : EMPTY_KEYS;

    // One axis, three jobs — accelerate, brake, reverse — which is exactly the
    // split `ground.js` reads off `c_PIThrottle`. Unlike the aircraft's
    // latching quadrant this springs back to centre: a lifted pedal is engine
    // braking, not a held power setting.
    car.setInput('c_PIThrottle', axisToward(car.input('c_PIThrottle'),
      (held.has('KeyW') ? 1 : 0) - (held.has('KeyS') ? 1 : 0), dt));
    car.setInput('c_PIYaw', axisToward(car.input('c_PIYaw'),
      (held.has('KeyD') ? 1 : 0) - (held.has('KeyA') ? 1 : 0), dt));
    // A Willys carries no guns, but the input costs nothing and whatever
    // armed car arrives next inherits the trigger with it.
    car.setInput('c_PIFire', held.has('Space') ? 1 : 0);
  }

  car.integrate(dt);

  // After `integrate`, never before: `applyRig` inside it re-poses every
  // declared `RotationalBundle` from the vehicle's own surface table, and
  // nothing ever writes `c_PIMouseLookX/Y` into that table, so it puts the
  // turret back at hull-forward each frame. Stepping the aim rig afterwards
  // is what leaves the traverse where the player pointed it — the same order
  // `manned()` has always relied on for a gunner's seat, which runs after
  // this function for exactly the same reason.
  //
  // Every rig re-asserted, only the active one stepped: `occupancy.turret`
  // belongs to whichever seat is active, and when that is a nested gunner it
  // is `manned()`'s to step, not ours — but an unmanned seat's gun still has
  // to stay pointed where its last occupant left it.
  occupancy.applyTurrets();
  if (driving) occupancy.turret?.step(dt);

  // Kept unconditional rather than folded into `if (driving)` above: a
  // vehicle's own weapon must stop the instant nobody is in the seat that
  // fires it, and gating the *value* passed to `setFiring` on `driving` (not
  // skipping the call) is what actually turns it off the same frame the seat
  // stops being active, instead of leaving it latched at whatever it was
  // firing the moment the seat switched away.
  guns.firstPerson = car.firstPerson;
  for (const group of vehicleGuns) {
    const state = fireStateFor(group.node);
    if (driving) state.step(dt);
    guns.setFiring(group, driving
      && car.input(group.stats.input || 'c_PIFire') > 0
      && state.canFire);
  }

  if (!driving) return;
  const pose = view.update(dt);
  camera.position.copy(pose.position);
  camera.quaternion.copy(pose.quaternion);
  // The dashboard readout this used to write into `#ammo` (road speed, gear)
  // is dropped rather than folded into `#hud`: that line is a timed
  // announcement (`showView`, the spawn/flag text) that overwrites itself on
  // a 2.2s timer, and a per-tick dashboard string competing with that timer
  // would either starve the announcements or itself flicker unreadably.
  // `car.control`/`.gear` stay live on `__car` for a headless check that
  // wants them; the vehicle HUD panel due from a future seats.js track is the
  // real replacement.
}
const driveFwd = new THREE.Vector3();

// --- manned guns and bare seats: the camera and trigger `drive()`/`pilot()`
// stop owning once you are not the one driving --------------------------
//
// Any seat whose root is not a drivable `air`/`ground`/`tank` (a Defgun, the
// AA guns, the Brownings — GUN-10, verify-r6.md's "manned gun" definition —
// or a bare passenger/observer seat), and *every* nested seat regardless of
// what its root is (the Sherman's own hull gunner, riding a vehicle whose own
// physics `drive()` still steps every frame, coasting, per round 3's first
// disclosed gap). `frame()`'s dispatch calls this *alongside* `pilot`/`drive`
// exactly when `mannedActive()` says so — never instead of them any more:
// the drivetrain's own momentum has to keep integrating even while `manned()`
// holds the camera and the trigger for the seat you are actually sitting in.
function mannedActive() {
  if (!occupancy) return false;
  return !(occupancy.isActiveRoot() && (aircraft || car));
}

const mannedCamPos = new THREE.Vector3();
const mannedCamQuat = new THREE.Quaternion();

/**
 * Step the active seat: its own `TurretRig` if it has one (`occupancy.turret`
 * is null for a bare seat — no RotationalBundle to aim, so `step`/the fire
 * loop below simply have nothing to do), always the seat's own Camera node
 * for the eye, and this seat's own FireArms for the trigger.
 *
 * The turret's integration law is `seats.js`'s `TurretAxis.step` — see its
 * own comment for exactly which part of GUN-3 (verify-r6.md) is confirmed
 * and which the verifier explicitly could not close out (the accumulator
 * product's closed form); this function only drives it, it does not
 * reproduce the mechanism.
 */
function manned(dt) {
  occupancy.turret?.step(dt);
  // GUN-5/6 (verify-r6.md): a gunner Camera never aims itself, it only ever
  // rides the turret it is parented under — so the eye is just wherever that
  // hierarchy, freshly stepped above, puts it. No cockpit/orbit/fly-by modes
  // here; a manned gun only ever has the one view retail gives it.
  readWorldPose(occupancy.cameraNode(), mannedCamPos, mannedCamQuat);
  camera.position.copy(mannedCamPos);
  camera.quaternion.copy(mannedCamQuat);

  const held = captured ? keys : EMPTY_KEYS;
  // Space, not LMB: this page already binds vehicle fire to Space for both
  // the aircraft and the car (HUD_PILOT/HUD_DRIVE), and a manned gun is
  // riding a vehicle exactly as they are. `FireState`/`gunfire.js` do not
  // know or care which key asked; wiring the on-foot mousedown state machine
  // instead (`triggerHeld`/`clickQueued`/`footFire`) would mean editing code
  // scoped to the hand weapon, outside this track's ownership.
  const trigger = held.has('Space');
  for (const node of occupancy.activeFireArmsNodes()) {
    const state = fireStateFor(node);
    state.step(dt);
    const group = mannedGuns.find(g => g.node === node);
    if (group) guns.setFiring(group, trigger && state.canFire);
  }
  // Not fed here: `guns.advance(dt)` — which actually calls `fireShot`
  // (`chainOnShot`'s `registerShot()`, decrementing `state.ammo`) — has not
  // run yet this frame; `manned()` returns before `frame()` reaches it. Fed
  // instead from `frame()` itself, after `guns.advance(dt)`, so a shot this
  // very frame is on the HUD this very frame instead of one frame late (the
  // on-foot path already gets this for free — `updateSoldierHud()` runs at
  // the tail of `frame()`, after `guns.advance`).
}

/**
 * The number row: `c_PIMenuSelect1..9` in the game's own control maps
 * (SEAT-23/24, verify-r5.md) — digit N to the vehicle's Nth seat by spawn-
 * declaration order (`VehicleOccupancy.seatIdAt`; its own doc names the one
 * case this was checked against, and the one still open). A miss — an empty
 * position, or the seat already active — does nothing, same as the real
 * `map<int,PCO*>::find()` miss.
 */
function switchSeat(position) {
  if (!occupancy) return;
  const seatId = occupancy.seatIdAt(position);
  if (seatId === undefined || seatId === occupancy.activeSeatId) return;
  occupancy.setActiveSeat(seatId);
  collectMannedGuns();
  // Same reasoning as `setPilot`'s own post-`collectGuns` call: this seat's
  // FireArms just got freshly-cloned flash materials from `collect()`, and
  // switching seats is exactly the "already mid-play" moment rule 6 is about
  // — the newly active seat's first shot must not be the first draw call
  // that program ever sees.
  warmSubtree(occupancy.root);
  feedVehicleHud();
  hud.textContent = mannedActive() ? HUD_MANNED : car ? HUD_DRIVE : HUD_PILOT;
}

// --- feeding the vehicle/gun HUD variables (BRIEFING2.md's contract) -------
//
// P1's painter (`viewer/hud.js`, a parallel track not yet merged into this
// worktree) reads `window.__hud.vars`, keyed by the engine's own MemeFile
// names exactly as `hud-layout.json` binds them. This track never paints —
// every write below is a plain assignment behind an optional-chained lookup,
// a documented no-op until that painter exists, and every value this seat
// does not currently have is cleared (`delete`d, not set false/0) so the
// painter's own culling rule ("unknown stays absent, cull the group") sees an
// honest table rather than an invented zero.
const HUD_VEHICLE_VARS = [
  'Vehicle/ShowVehicleIcon', 'Vehicle/VehicleIcon',
  'Vehicle/ShowTurretIcon', 'IconLookRotation',
  'Vehicle/VehicleHitPoints', 'Vehicle/VehicleMaxHitPoints',
  'Ammo/NumberOfWeaponIcons',
  'Ammo/PrimaryAmmoIcon', 'Ammo/PrimaryAmmoBar',
  'Ammo/PrimaryAmmo', 'Ammo/PrimaryAmmoText', 'Ammo/MaxPrimaryAmmo', 'Ammo/PrimaryMag',
  'Ammo/SecondaryAmmoIcon', 'Ammo/SecondaryAmmoBar',
  'Ammo/SecondaryAmmo', 'Ammo/SecondaryAmmoText', 'Ammo/MaxSecondaryAmmo',
  'Ammo/ReloadTime', 'Ammo/ReloadTimeSecondary', 'Overheat/OverHeat',
];

function setHudVar(name, value) {
  const table = window.__hud?.vars;
  if (!table) return;
  if (value === null || value === undefined) delete table[name];
  else table[name] = value;
}

function clearVehicleHud() {
  for (const name of HUD_VEHICLE_VARS) setHudVar(name, null);
}

// R2-8 (verify-r2.md's corrected report): the client's own case-sensitive
// decode of `setPrimaryAmmoBar`/`setSecondaryAmmoBar`. A name it does not
// recognise — a mod's typo, or the ambiguous bare `ABAmmoBar` vanilla itself
// never disambiguates — silently becomes 7, the client's own default, not an
// extraction bug.
const AMMO_BAR_CODES = {
  ABNone: 0, ABAmmoBarOnly: 1, ABAmmoBarHeatBar: 2, ABAmmoBarReloadBar: 3,
  ABHeatBarOnly: 4, ABReloadBarOnly: 5, ABIconOnly: 6,
};
function ammoBarCode(name) {
  return name == null ? null : (AMMO_BAR_CODES[name] ?? 7);
}

/**
 * Push this vehicle's `Vehicle/*`/`Ammo/*` HUD block into `hud.vars`. Called
 * once on entry and every seat switch (icon/bar/hitpoints are effectively
 * static between those), and every tick from `manned()` so a manned gun's
 * live ammo/heat actually moves.
 */
function feedVehicleHud() {
  if (!occupancy) return;
  const rootHud = occupancy.seatInfo(occupancy.rootId)?.hud;
  const seatHud = occupancy.activeHud();
  setHudVar('Vehicle/ShowVehicleIcon', true);
  setHudVar('Vehicle/VehicleIcon', seatHud?.vehicleIcon ?? null);
  // The turret dial (`vehicleIcon`'s other three sprites, VHUD-7's rects): a
  // fixed back plate and barrel with the hull's own icon rotating underneath,
  // which is how a tank commander reads where the hull is pointing relative
  // to where he is looking. Gated on there being a traverse to show at all —
  // a seat with only elevation, or none, leaves both variables absent and
  // `hud.js` culls all three leaves, which is also what every seat did until
  // the driver's own turret started turning.
  //
  // APPROXIMATION, and VHUD-9 is why: neither what the engine sets
  // `ShowTurretIcon` from nor `IconLookRotation`'s unit, sign and pivot were
  // ever read. Fed here in radians, because canvas `rotate()` takes radians
  // and `hud.js` passes the value straight through; `angleMultiplier` is
  // carried by the extractor and still unread, so it is not applied.
  //
  // The sign was settled by looking at it rather than by reading anything.
  // The dial's fixed barrel points up, i.e. screen-up is where the gun is
  // looking, and the hull icon spins underneath it — so with the turret
  // traversed 90 degrees right the hull sits 90 degrees to the gun's LEFT and
  // its nose belongs at 9 o'clock, which on a canvas whose positive rotation
  // is clockwise is the traverse itself, not its negative. `headingRadians()`
  // is already signed in the node's own sense, so it goes in unchanged.
  const heading = occupancy.turret?.headingRadians();
  setHudVar('Vehicle/ShowTurretIcon', heading === undefined ? null : true);
  setHudVar('IconLookRotation', heading === undefined ? null : heading);
  // R2-31 (corrected, verify-r2.md): hitpoints/armor live on the root PCO
  // only, one Armor shared by every seat — never a nested seat's own value.
  //
  // Live when this vehicle is one the damage set knows about, and the template's
  // static number otherwise. Before the Armor existed this could only ever print
  // the authored maximum, so the bar never moved no matter what hit you.
  const live = occupiedVehicleDamage();
  setHudVar('Vehicle/VehicleHitPoints',
            live ? live.hitPoints : (rootHud?.hitpoints ?? null));
  setHudVar('Vehicle/VehicleMaxHitPoints',
            live ? live.maxHitPoints : (rootHud?.maxHitpoints ?? null));
  // Which copy of the ammo panel `menu/InGame` paints: the layout gates every
  // primary leaf on `NumberOfWeaponIcons == 1` and every secondary one on
  // `== 2` (VHUD, verify-r2.md R2-13), so a seat that never feeds it shows no
  // ammo at all. `setNumberOfWeaponIcons` is the seat's own word; the fallback
  // covers scenes extracted before it was carried — a declared secondary
  // means two panels, anything else one.
  setHudVar('Ammo/NumberOfWeaponIcons', seatHud?.numberOfWeaponIcons
    ?? (seatHud?.secondaryAmmoIcon || seatHud?.secondaryAmmoBar ? 2 : 1));
  setHudVar('Ammo/PrimaryAmmoIcon', seatHud?.primaryAmmoIcon ?? null);
  setHudVar('Ammo/PrimaryAmmoBar', ammoBarCode(seatHud?.primaryAmmoBar));
  setHudVar('Ammo/SecondaryAmmoIcon', seatHud?.secondaryAmmoIcon ?? null);
  setHudVar('Ammo/SecondaryAmmoBar', ammoBarCode(seatHud?.secondaryAmmoBar));
  // Live ammo/heat: manned seats via `manned()`; drivetrain roots via
  // `drive()`/`pilot()` (T4a) — both step FireState and gate `canFire`, so
  // `chainOnShot` is not orphaning counters on the Sherman cannon/coax.
  //
  // A seat's `fireArms` array can hold two nodes (R2-30: the Sherman's root
  // declares `NumberOfWeaponIcons 2`, cannon then coax) — `nodes[0]`/`[1]` is
  // this viewer's stand-in for "primary"/"secondary" weapon-icon slot, the
  // same declaration-order assumption SEAT-22's own seat-position map already
  // rests on; the extracted data has no independent primary/secondary tag to
  // cross-check it against.
  let nodes = [];
  if (mannedActive()) {
    nodes = occupancy.activeFireArmsNodes();
  } else if (occupancy.isActiveRoot() && (aircraft || car)) {
    nodes = occupancy.seatInfo(occupancy.rootId)?.fireArms || [];
  }
  const primary = nodes[0] ? fireStateFor(nodes[0]) : null;
  const secondary = nodes[1] ? fireStateFor(nodes[1]) : null;
  // `hud-layout.json`'s vehicle-skin ammo panel prints `Ammo/{Primary,Secondary}
  // AmmoText` (registered by a DIFFERENT client function, R2-12, than the
  // `PrimaryAmmo`/`MaxPrimaryAmmo`/`PrimaryMag` trio) -- the soldier-skin
  // panel's own text binds `Ammo/PrimaryAmmo` directly instead (R1-20), so this
  // second name is unique to the vehicle layout and was missing entirely: a
  // seated ammo panel (Defgun, Sherman) drew its icon and bar but never its
  // number. Neither verify-r2.md nor hud-layout.json's own notes say whether
  // the real engine ever lets `*AmmoText` diverge from the live count; mirrored
  // here rather than left unfed, since an unfed one is a confirmed-wrong "no
  // number ever" and a mirrored one is at worst a guess about a case nothing
  // surveyed exercises.
  setHudVar('Ammo/PrimaryAmmo', primary && !primary.unlimited ? primary.ammo : null);
  setHudVar('Ammo/PrimaryAmmoText', primary && !primary.unlimited ? primary.ammo : null);
  setHudVar('Ammo/MaxPrimaryAmmo', primary ? primary.stats.magSize : null);
  setHudVar('Ammo/PrimaryMag',
    primary ? (primary.magsLeft === Infinity ? -1 : primary.magsLeft) : null);
  setHudVar('Ammo/SecondaryAmmo', secondary && !secondary.unlimited ? secondary.ammo : null);
  setHudVar('Ammo/SecondaryAmmoText', secondary && !secondary.unlimited ? secondary.ammo : null);
  setHudVar('Ammo/MaxSecondaryAmmo', secondary ? secondary.stats.magSize : null);
  // `hud-layout.json` binds exactly one `Overheat/OverHeat` (no "...Secondary"
  // variant) shared by both panels' heat-bar copy — R2-30's own Sherman is the
  // real case this matters for, since its heat weapon is the coax (secondary),
  // not the cannon (primary): reading only `nodes[0]` would silently show no
  // heat at all while the coax cooked. No array/closure here — this runs every
  // tick `manned()` steps (rule 5, features/mesh-viewer-performance/README.md).
  const heated = primary?.hasHeat ? primary : secondary?.hasHeat ? secondary : null;
  setHudVar('Overheat/OverHeat', heated ? heated.heat : null);
  // Both reload-bar copies are a fraction of `reloadTime` remaining, scaled to
  // the `max: 1.0` the layout declares — direction (counts down to empty vs.
  // fills up as reload completes) is not settled by anything in
  // verify-r2.md/verify-r6.md or `hud-layout.json`'s own metadata, so this is
  // an approximation: counts down from full (just started) to empty (ready).
  // `reloadFraction` is a module-level function, not a closure allocated here,
  // for the same per-tick reason as `heated` above.
  setHudVar('Ammo/ReloadTime', readyFraction(primary, nodes[0]));
  setHudVar('Ammo/ReloadTimeSecondary', readyFraction(secondary, nodes[1]));
}

/** The `GunFire` group that actually fires this FireArms node — `mannedGuns`
 *  for a seat someone is sitting in, `vehicleGuns` for the drivetrain root's
 *  own.
 *
 *  Which list is asked first matters, and is not a detail: a drivetrain
 *  root's own FireArms end up in BOTH, because `collectMannedGuns()` collects
 *  whatever `occupancy.activeFireArmsNodes()` names and for the root seat
 *  that is the same pair of nodes `collectGuns()` already put in
 *  `vehicleGuns`. Only one of the two copies is ever fired — `manned()` and
 *  `drive()` each own their own list — so reading the idle copy's `cooldown`
 *  is reading a clock nothing winds, which is exactly how the reload bar came
 *  back "ready" a frame after the shell left. `mannedActive()` is the same
 *  test `frame()` uses to pick which of the two runs.
 *
 *  Plain loops rather than `find`, because this runs from `feedVehicleHud` on
 *  every tick and an arrow predicate would allocate a closure a frame
 *  (features/mesh-viewer-performance, rule 5). */
function fireGroupFor(node) {
  if (!node) return null;
  const live = mannedActive() ? mannedGuns : vehicleGuns;
  for (const group of live) if (group.node === node) return group;
  const other = live === mannedGuns ? vehicleGuns : mannedGuns;
  for (const group of other) if (group.node === node) return group;
  return null;
}

/** How ready this weapon is to fire again, `0` (just fired) to `1` (ready),
 *  or `null` when there is no weapon in that slot at all.
 *
 *  This used to read `state.reloadRemaining / reloadTime` alone, and on a
 *  tank cannon that is a bar which never moves: a Sherman's `reloadTime` is
 *  0.35 s and only runs once its whole 30-round magazine is out. What the
 *  player actually waits through between shells is the `roundOfFire`
 *  cooldown — 1/0.35 s = 2.86 s — which lives on the `GunFire` group, not on
 *  `FireState`. GUN-5 has the engine's own `isReadyToUseFire` gating on the
 *  eject-clip timer, the reload timer, the overheat timer AND the fire-rate
 *  timer together, so the bar takes whichever of them is still running: it
 *  is a readiness bar, and readiness is the last gate to clear.
 *
 *  Direction: fills as the weapon becomes ready, empty right after the shot.
 *  Neither verify-r2.md nor `hud-layout.json` settles which way this bar
 *  runs (VHUD-10 is still open on the whole live-value question for a
 *  driver's own weapons), so this is a choice, not a reproduction — made
 *  this way round because the alternative draws a FULL bar at the exact
 *  moment the gun cannot fire, which reads as "loaded" to anyone glancing at
 *  it, and because every other gauge in this layout is full when the thing
 *  it measures is in good shape. Module scope, not a closure inside
 *  `feedVehicleHud`, for that function's own stated per-tick reason. */
function readyFraction(state, node) {
  if (!state) return null;
  const reloadWindow = state.stats.reloadTime > 0 ? state.stats.reloadTime : 0;
  let remaining = reloadWindow > 0 ? state.reloadRemaining / reloadWindow : 0;
  const group = fireGroupFor(node);
  const rate = group?.stats.roundOfFire;
  if (group && rate > 0) {
    remaining = Math.max(remaining, group.cooldown * rate);
  }
  if (state.hasHeat && state.overheatRemaining > 0 && state.stats.timeDelayOnOverheat > 0) {
    remaining = Math.max(remaining, state.overheatRemaining / state.stats.timeDelayOnOverheat);
  }
  return 1 - Math.max(0, Math.min(1, remaining));
}

// --- walking up to a seat ----------------------------------------------------
//
// Every assembled vehicle carries its `EntryPoint` nodes — meshless, placed
// where a soldier walks in from, with `setEntryRadius` as their reach
// (`extras.seat.entryRadius`, 2.3 m on a Willys) — and the PCO root carries
// `setSoldierExitLocation` for the walk back out. Both are the game's own
// data; the only invention here is the 4 m fallback radius for a mod entry
// point that declares none.
const ENTRY_RADIUS_FALLBACK = 4;
const ENTRY_SCAN_PERIOD = 0.25;   // seconds between proximity sweeps on foot
// SEAT-6 (verify-r5.md, confirmed both passes): `toggleEntryPoint` opens with
// a hard-coded 1.0s cooldown per player, refreshed on every actual toggle
// (both `exitPlayer` and `toggleEntryPoint`'s own success path) — not a
// per-vehicle or per-entry-point value. One shared timestamp is therefore
// correct for this page's single soldier.
const SEAT_TOGGLE_COOLDOWN_MS = 1000;
let lastSeatToggle = -Infinity;
let entryPoints = null;           // [{node, vehicle, control, radius}]
let nearEntry = null;             // the seat the HUD is currently offering
let entryScan = 0;

/**
 * Index every walkable seat once per level — every `EntryPoint` of every
 * `PlayerControlObject` root in the scene, spawner-placed or not
 * (`findAllVehicleRoots`, `seats.js`), tagged with which of that vehicle's
 * seats it opens into (`listEntryPoints`). This is the whole of "make every
 * PlayerControlObject with an EntryPoint enterable": the Defgun, the AA guns
 * and the Brownings were level furniture `findVehicles` (spawner-scoped,
 * flight.js) never saw, and a passenger/gunner seat's own door was dropped by
 * the old control-tag filter this replaces.
 */
function collectEntryPoints() {
  entryPoints = [];
  for (const vehicle of findAllVehicleRoots(currentRoot)) {
    const control = vehicle.userData?.control || vehicle.name || 'vehicle';
    for (const entry of listEntryPoints(vehicle, ENTRY_RADIUS_FALLBACK)) {
      entryPoints.push({
        node: entry.node, vehicle, control,
        seatId: entry.seatId, radius: entry.radius,
      });
    }
  }
}

const entryWorld = new THREE.Vector3();

/**
 * The closest entry point whose declared radius reaches the soldier.
 *
 * Not reproduced: SEAT-13/13b's team/hostility gates (`BFfindEntryPoint`'s
 * own team check, and `validateBFEntryPoint`'s separate component check) —
 * this page has exactly one soldier and no second team's vehicles ever
 * appear as hostile, so there is nothing here for either gate to reject.
 *
 * Round 3's second disclosed gap: `pickNearest` (`seats.js`), not a bare
 * `distance < best` compare, because more than one `EntryPoint` can sit at
 * the exact same world position — the Sherman's driver and hull-gunner
 * doors, M3A1's four passenger seats sharing one side door (confirmed
 * against the live Wake scene: the Sherman's pair differs by ~1.1e-13 m,
 * M3A1's four-way tie by exactly 0) — where a plain compare would let
 * accumulated floating-point noise in each seat's own transform chain decide
 * the winner instead of the level's own data. `entryPoints` is built by
 * `collectEntryPoints()` in `surveyVehicle`'s own declaration order (root
 * seat first, SEAT-22), so `pickNearest`'s "first within `TIE_EPSILON` wins"
 * rule seats the driver ahead of the gunner at a shared Sherman door, and the
 * lowest-numbered passenger PCO at M3A1's — the same seat order the number
 * keys already use, not an arbitrary pick.
 */
function nearestEntry() {
  if (!entryPoints) collectEntryPoints();
  return pickNearest(entryPoints, entry => {
    entry.node.getWorldPosition(entryWorld);
    const distance = Math.hypot(entryWorld.x - soldier.x,
      entryWorld.y - (soldier.y + 1), entryWorld.z - soldier.z);
    return distance <= entry.radius ? distance : Infinity;
  });
}

/**
 * Watch for a door within reach, a few times a second rather than every
 * frame, and offer it on the HUD. Runs from `onFoot`.
 */
function scanForEntry(dt) {
  entryScan -= dt;
  if (entryScan > 0) return;
  entryScan = ENTRY_SCAN_PERIOD;
  const near = nearestEntry();
  if (near?.vehicle !== nearEntry?.vehicle) {
    hud.textContent = near ? `E — enter the ${near.control}` : HUD_FOOT;
  }
  nearEntry = near;
}

/**
 * From on foot into a seat. The soldier is suspended rather than torn down —
 * his weapon, magazines and flag selection all wait for the walk back out —
 * so only the presentation is packed away: the viewmodel, the crosshair, the
 * on-foot FOV.
 */
function enterVehicle(entry) {
  if (handWeapon) {
    if (handWeapon.group) guns.setFiring(handWeapon.group, false);
    handWeapon.rig.visible = false;
    // Holstering drops zoom — `HandFireArms::disable` (lnxded 0x08293da0)
    // calls setZoom(false) — and the eased FOV factor goes home with it.
    handWeapon.zoomed = false;
    handWeapon.rezoom = 0;
    handWeapon.fovCur = 1;
    handWeapon.worldFov = FOOT_FOV;
  }
  triggerHeld = false;
  clickQueued = false;
  aimHeld = false;
  crosshairEl.hidden = true;
  camera.fov = FLY_FOV;
  camera.near = FLY_NEAR;
  camera.updateProjectionMatrix();
  nearEntry = null;
  // Checked without an event on purpose: the change handler would tear the
  // waiting soldier down, and the checkbox is only being told the truth —
  // someone is in a vehicle.
  optPilot.checked = true;
  setPilot(true, entry.vehicle, entry.seatId);
  if (!occupancy) {
    // The seat refused (a null root; `pickVehicle`-less path). Back on foot
    // as if nothing happened. Every real `PlayerControlObject` root now
    // classifies to something (`seats.js`'s `classifyRoot` never returns
    // null for one), so this is defensive rather than a real refusal path
    // any of the vehicles this round targets can hit.
    camera.fov = FOOT_FOV;
    camera.near = 0.2;
    camera.updateProjectionMatrix();
    if (handWeapon) handWeapon.rig.visible = true;
    hud.textContent = HUD_FOOT;
  }
}

/**
 * Park the vehicle exactly where it stands — engine off, controls centred,
 * exterior restored — without `reset()`'s teleport back to spawn. This is
 * the difference between vacating a seat and returning the vehicle.
 *
 * Only meaningful for a root that actually has a drivetrain; a bare gun/seat
 * exit is `leaveManned`'s job, since there is no `Vehicle` instance here to
 * reset. Whichever one runs, exiting always empties the whole vehicle — this
 * page has exactly one occupant, so a nested seat's own exit ends the
 * driver's occupancy too (`leaveManned` delegates here when a drivetrain
 * exists, per the note on `mannedActive()`'s own approximation).
 */
function leaveVehicle() {
  const vehicle = aircraft || car;
  if (!vehicle) return;
  stopEngineAudio();
  releaseGuns();
  vehicle.state.velocity.set(0, 0, 0);
  vehicle.state.angularVelocity.set(0, 0, 0);
  vehicle.state.throttle = 0;
  vehicle.setInput('c_PIThrottle', 0);
  vehicle.setInput('c_PIYaw', 0);
  vehicle.setInput('c_PIFire', 0);
  view.setMode('cockpit');
  vehicle.setFirstPerson(false);
  vehicle.applyTransform();
  vehicle.applyRig();
  freezeVehicle(vehicle.node);   // parked where it stands: furniture again
  clearVehicleHud();
  occupancy = null;
  stick.roll = 0;
  stick.pitch = 0;
}

/**
 * Where the occupant steps out, in world space: the vehicle's own
 * `setSoldierExitLocation` when it declares one (the Willys puts its driver
 * 1.5 m off the left running board), else two metres to the vehicle's left.
 * The declared vector is in Refractor's frame — z forward — so its Z is
 * negated at this boundary, the same fix `rig` angles get.
 */
function exitPose(vehicle) {
  const declared = vehicle.node.userData?.physics?.soldierExitLocation;
  const local = declared
    ? new THREE.Vector3(declared.position[0], declared.position[1],
      -declared.position[2])
    : new THREE.Vector3(-2, 0.5, 0);
  const position = local.applyQuaternion(vehicle.state.orientation)
    .add(vehicle.state.position);
  const fwd = driveFwd.set(0, 0, -1).applyQuaternion(vehicle.state.orientation);
  return {
    x: position.x, y: position.y, z: position.z,
    // The soldier's convention: forward is (sin yaw, 0, cos yaw). Stepping
    // out facing the way the vehicle faces reads right for both doors.
    yaw: Math.atan2(fwd.x, fwd.z),
  };
}

/**
 * E from a seat: back onto the ground beside it.
 *
 * No speed/altitude gate on purpose: SEAT-5/SEAT-8 (verify-r5.md, confirmed
 * in both the original and verifier passes) read `isAllowedToExit()` in full
 * and found a pure geometry/collision check with no call to anything speed-
 * or altitude-related — bailing out of a moving plane is genuine vanilla
 * behaviour, not a bug to guard against. A prior pass here gated on
 * `grounded || airspeed<3`, which the report contradicts directly; removed.
 * The real gate (SEAT-6/SEAT-9: a room check at `soldierExitLocation`, run
 * only when the template's `hasRestrictedExit` is set) is not implemented —
 * `exitPose`'s placement is trusted as-is, same as it already was on the
 * ground. `soldier.spawn()`'s own `SPAWN_DROP` fall-to-floor already handles
 * landing an exit point that turns out to be in mid-air.
 */
function exitVehicle() {
  const vehicle = aircraft || car;
  if (!vehicle) return;
  const exit = exitPose(vehicle);
  leaveVehicle();
  optPilot.checked = false;
  if (optOnFoot.checked && soldier) {
    soldier.collider = collider;
    soldier.spawn(exit.x, exit.y, exit.z, exit.yaw);
    camera.fov = FOOT_FOV;
    camera.near = 0.2;
    camera.updateProjectionMatrix();
    if (handWeapon) handWeapon.rig.visible = true;
    hud.textContent = HUD_FOOT;
  } else {
    // Nobody was waiting in the seat — the pilot box was ticked from free
    // fly — so E hands back the free camera where the vehicle stopped.
    placeCamera();
    updateHud();
  }
}

const exitWorldPos = new THREE.Vector3();
const exitWorldQuat = new THREE.Quaternion();
const exitFwd = new THREE.Vector3();

/**
 * `exitPose`'s twin for a seat with no `Vehicle` instance behind it: a bare
 * gun/seat root has no simulated `.state` to read at all, so this reads the
 * ROOT's own live world transform instead — `Object3D.matrixWorld`, not
 * `Vehicle.state`, which is the only thing a bare seat has. For a nested seat
 * of a vehicle that *does* have a drivetrain (the Sherman's hull gunner) that
 * transform is not a stale snapshot either: `drive()`/`pilot()` keep
 * integrating it every frame regardless of which seat is active (round 3's
 * first disclosed gap), so stepping out while the hull is still coasting
 * places the soldier at the tank's real current position, not wherever it
 * was the moment the turret seat was taken. Always the root's transform, not
 * the active seat's own: stepping out relative to a spinning turret's own
 * frame would swing the exit point with the aim, which is not what a hull
 * door does.
 */
function exitPoseManned(occ) {
  const declared = occ.exitLocationNode()?.userData?.physics?.soldierExitLocation;
  const local = declared
    ? new THREE.Vector3(declared.position[0], declared.position[1],
      -declared.position[2])
    : new THREE.Vector3(-2, 0.5, 0);
  readWorldPose(occ.root, exitWorldPos, exitWorldQuat);
  const position = local.applyQuaternion(exitWorldQuat).add(exitWorldPos);
  const fwd = exitFwd.set(0, 0, -1).applyQuaternion(exitWorldQuat);
  return {
    x: position.x, y: position.y, z: position.z,
    yaw: Math.atan2(fwd.x, fwd.z),
  };
}

/**
 * `leaveVehicle`'s twin for a seat with no drivetrain: stop firing, forget
 * the seat table, hand the vehicle's matrix back to the per-frame freeze. The
 * turret is deliberately left aimed where it was — retail furniture keeps
 * whatever pose its last gunner left it in, and nothing in verify-r5/r6
 * describes a return-to-rest on exit.
 *
 * If the root also has a drivetrain (a nested seat's own exit, e.g. the
 * Sherman's hull gunner stepping out without ever having driven), this page
 * still has only one occupant, so the exit empties the whole vehicle —
 * delegate to `leaveVehicle` for the parts only it knows how to reset.
 */
function leaveManned() {
  if (!occupancy) return;
  if (aircraft || car) {
    // `leaveVehicle` calls `releaseGuns()` itself, which already releases
    // `mannedGuns` the same way it releases `vehicleGuns` — see there.
    leaveVehicle();
    return;
  }
  // `releaseGuns()`, not a bare `setFiring(false)` loop: it also splices each
  // group out of `guns.groups`, or re-entering the same gun later would pile
  // a second, permanently-inert group onto the first every cycle instead of
  // replacing it (`collectMannedGuns` on the next entry only clears whatever
  // is still in `mannedGuns`, which this function is about to empty).
  releaseGuns();
  freezeVehicle(occupancy.root);
  clearVehicleHud();
  occupancy = null;
}

/** E from a manned-only seat: a bare furniture gun, or a nested seat of a
 *  vehicle whose root seat you never drove this time. */
function exitManned() {
  if (!occupancy) return;
  const exit = exitPoseManned(occupancy);
  leaveManned();
  optPilot.checked = false;
  if (optOnFoot.checked && soldier) {
    soldier.collider = collider;
    soldier.spawn(exit.x, exit.y, exit.z, exit.yaw);
    camera.fov = FOOT_FOV;
    camera.near = 0.2;
    camera.updateProjectionMatrix();
    if (handWeapon) handWeapon.rig.visible = true;
    hud.textContent = HUD_FOOT;
  } else {
    placeCamera();
    updateHud();
  }
}

// --- on foot ----------------------------------------------------------------
//
// All the arithmetic is in `soldier.js`, which imports nothing and is driven by
// `tests/test_soldier.py` under node. This page only feeds it the keyboard and
// takes the eye pose back, the same seam `flight.js` keeps between VehicleState
// and the presentation layer.

let soldier = null;
let flags = [];
let prone = false;           // `c_PILie` is a toggle, not a hold
const FLY_FOV = camera.fov;
const FLY_NEAR = camera.near;
// GUN-6 (verify-r6.md): a manned gun's own Camera never sets its own FOV in
// vanilla (`setVehicleFov` — no vanilla vehicle calls it) and the render
// view's own default is 57.30 degrees vertical. `enterVehicle` sets
// `camera.fov = FLY_FOV` (60) on the way in for every kind alike — fine for
// an aircraft/car, whose `VehicleCamera` owns the view already, but a manned
// gun never gets that camera at all, so nothing else was ever correcting it.
const MANNED_GUN_FOV = 57.3;

// --- the soldier's hit points, and the supply depots that refill them ------
//
// `verify-r4.md` (hit points, damage, healing) and `verify-r3.md` (supply
// depots), both `## Corrected report`. `armor.js` and `supply.js` are
// framework-free — see their own headers — so all the state tying them to
// *this* soldier lives here, in the on-foot/spawn code this track owns.

/** The on-foot soldier's own hit points, or null while none exists. Reset to
 *  full on every spawn/redeploy (`spawnAtFlag`, below — the one reset point,
 *  since `setOnFoot(true)` calls it too). */
let soldierArmor = null;

/** `_shared/loadouts.json` ships `maxHitpoints: 30` for every vanilla-family
 *  kit (`verify-r4.md` R4-25's own cross-mod survey). Only the fallback for
 *  a maps tree extracted before that field existed — the same role
 *  `FALLBACK_PRIMARIES` plays for weapons below. */
const SOLDIER_MAX_HP_FALLBACK = 30;

/** Wake's 52 `SupplyDepot` nodes, collected once per level (see
 *  `collectSupplyDepots`) and cached against the `currentRoot` they came
 *  from, so a map switch — a new root object — rebuilds the field exactly
 *  once rather than every frame. Built lazily from `onFoot`, this track's
 *  one hook into the per-frame loop. */
let supplyField = null;
let supplyDepotsRoot = null;

/** Reused rather than reallocated every frame, the way `soldier.js`'s own
 *  `_tickInput` is: `onFoot` updates these fields in place and hands the
 *  same object to `supplyField.tick`/`canHeal`/`canRearm` every call.
 *  `refillAmmo` is wired once, beside `handWeapon`'s own declaration below —
 *  a closure over it, so it always acts on whatever is currently in hand. */
const supplyTarget = { x: 0, y: 0, z: 0, team: 2, armor: null, refillAmmo: null };

// Fall damage (`verify-r4.md` R4-18): no height/speed-to-damage formula
// exists anywhere `Armor`'s own code, `handleCollision` or `handleDamage`
// reach — two independent passes (research and verify) read all three in
// full and found nothing. This is therefore a **viewer approximation**, not
// the engine's law: ordinary traversal (a jump's own landing speed,
// `JUMP_SPEED`, doubled, so stepping off a low ledge is always free) costs
// nothing; a fall at or past `LETHAL_FALL_SPEED` is fatal; damage ramps
// linearly between the two. Open question this approximation stands on:
// R4-18 — replace this ramp if the real formula ever surfaces.
//
// Tracked as a height, not a sampled velocity: `SoldierBody#settle()` zeroes
// `velocity.y` in the very same `step()` call that flips `grounded` true (it
// has to, to plant the body on the floor), so a peak read from
// `soldier.velocityY` *after* `step()` returns always misses the last
// partial tick's own acceleration — verified against this file's own
// `__dropFromHeight` hook, which under-reported a 12 m drop's damage by
// about 5% versus the closed-form prediction. A soldier's drag is inert
// enough over any survivable drop (`physics.js`'s own terminal-velocity
// note, ~730 m/s) that `v^2 = 2|g|h` inverts cleanly, so the two speed
// thresholds are converted once to the heights that produce them, and the
// quantity actually tracked below is the drop itself — exact at any tick
// rate, since a landed body's `y` is the ground height exactly, never a
// clamped derivative of it.
const SAFE_FALL_SPEED = JUMP_SPEED * 2;     // ~10.8 m/s, ~4 m of drop
const LETHAL_FALL_SPEED = 25;               // m/s, ~21 m of drop
const SAFE_FALL_HEIGHT = SAFE_FALL_SPEED * SAFE_FALL_SPEED / (2 * Math.abs(GRAVITY));
const LETHAL_FALL_HEIGHT = LETHAL_FALL_SPEED * LETHAL_FALL_SPEED / (2 * Math.abs(GRAVITY));
let fallPeakY = null;   // highest y seen since last leaving the ground; null while grounded
let wasGrounded = true;

/** The supply and health side of the in-game HUD writes the engine's own
 *  variable names straight into the painter's table, the same one
 *  `updateSoldierHud` fills; `gameHud` is declared with the painter further
 *  down, and every write below happens inside a call, never at load. */
const hudBridge = { get vars() { return gameHud.vars; } };

/** Fill the flag picker from the level's own control points.
 *
 *  Rebuilt whole, but not forgetful: the deploy screen writes its choice into
 *  this select and `setOnFoot` rebuilds the options before reading it back,
 *  and an innerHTML wipe resets a select to its first option. A level switch
 *  clears the value in `show()` first, so the memory never crosses maps. */
function buildSpawnFlags() {
  const kept = spawnFlagSelect.value;
  flags = spawnFlags(extras);
  spawnFlagSelect.innerHTML = '';
  for (const [index, flag] of flags.entries()) {
    const option = document.createElement('option');
    const side = flag.team === 1 ? 'Axis' : flag.team === 2 ? 'Allied' : 'neutral';
    option.value = String(index);
    option.textContent = `${flag.name} (${side}, ${flag.spawns.length})`;
    spawnFlagSelect.appendChild(option);
  }
  if (kept !== '' && Number(kept) < flags.length) spawnFlagSelect.value = kept;
  // The sidebar picker is a debug aid; the deploy screen is the real join
  // path (Caps Lock / auto-open). Keep the select populated whenever there
  // are flags so a later commit can read it, and only hide it when empty.
  spawnFlagSelect.hidden = !flags.length;
  return flags.length;
}

/** Put the soldier at the selected flag, on the next of its spawn points. */
let spawnIndex = 0;
function spawnAtFlag(advance = false) {
  if (!soldier || !flags.length) return false;
  const flag = flags[Math.min(Number(spawnFlagSelect.value) || 0, flags.length - 1)];
  if (advance) spawnIndex++;
  const spawn = pickSpawn(flag, spawnIndex, { groundAt: groundHeight });
  if (!spawn) return false;
  soldier.collider = collider;
  soldier.spawn(spawn.position[0], spawn.position[1], spawn.position[2],
                spawnYaw(spawn));
  prone = false;
  // A fresh body is full health, from the kit's own template (`soldierMaxHp`,
  // beside `kitLoadout` below) — every spawn and every redeploy passes
  // through here, so this is the one reset point.
  soldierArmor = new Armor(soldierMaxHp(flag));
  fallPeakY = null;
  wasGrounded = true;
  // The weapon follows the flag: switching to the other side's spawn swaps
  // the SMG. A no-op when the right one is already in hand.
  ensureHandWeapon(flag);
  hud.textContent = `${flag.name} · ${spawn.name}`;
  clearTimeout(hudViewTimer);
  hudViewTimer = setTimeout(() => {
    if (optOnFoot.checked) hud.textContent = HUD_FOOT;
  }, 2200);
  return true;
}

function setOnFoot(on) {
  if (on && optPilot.checked) {      // the two modes are exclusive
    optPilot.checked = false;
    setPilot(false);
  }
  // Either edge tears the old weapon down: entering rebuilds it against the
  // current level's gun index (a map switch has just cleared `guns.groups`),
  // leaving must not park a rifle on the free-fly camera.
  disposeHandWeapon();
  if (on) {
    soldier = new Soldier({ collider, worldSize: extras?.worldSize || 0 });
    if (!buildSpawnFlags() || !spawnAtFlag()) {
      // A level with no control point that owns a spawn group has nowhere to
      // put a soldier; say so rather than dropping him at the origin.
      soldier = null;
      optOnFoot.checked = false;
      spawnFlagSelect.hidden = true;
      hud.textContent = 'this level declares no flag with soldier spawns';
      return;
    }
    // The world's own FOV (`renderer.fieldOfView 1`, not `set1pFov` — the
    // arms rig's near pass picks its own, see frame()), and a near plane
    // that clears the capsule so a wall you are pressed against is drawn
    // rather than clipped through.
    camera.fov = FOOT_FOV;
    camera.near = 0.2;
    camera.updateProjectionMatrix();
    spawnFlagSelect.hidden = false;
    hud.textContent = HUD_FOOT;
  } else {
    // The deploy screen cannot outlive the mode it selects for: the pilot
    // checkbox's exclusivity and the on-foot box both land here with the
    // overlay possibly still up.
    if (deployActive()) toggleFullMap(false);
    soldier = null;
    // The soldier's own HP is meaningless off-foot; drop it and the icons
    // that read it rather than leave a stale number for the next spawn's
    // first frame to flash.
    soldierArmor = null;
    delete hudBridge.vars['Soldier/SoldierHitPoints'];
    delete hudBridge.vars['Soldier/SoldierMaxHitPoints'];
    delete hudBridge.vars['ShowHealIcon'];
    delete hudBridge.vars['ShowReloadIcon'];
    spawnFlagSelect.hidden = true;
    camera.fov = FLY_FOV;
    camera.near = FLY_NEAR;
    camera.updateProjectionMatrix();
    // `getTouchHudText()`, not the `HUD_TOUCH` this file once believed in —
    // that name was never declared, and reading it would throw on a phone.
    hud.textContent = isTouchDevice ? getTouchHudText() : HUD_FLY;
    // The fullscreen `?kblock` took for on-foot play goes with it.
    kbLockLeave();
  }
}

// `let`: under `?kblock` the Escape hint changes for as long as the
// fullscreen session lasts (kbLockEnter). Without it this never changes.
let HUD_FOOT ='WASD move · Shift walk · Ctrl crouch · Z prone · Space jump · '
  + 'LMB fire · RMB aim · R reload · CapsLock / M redeploy · Esc';
const HUD_FOOT_PLAIN = HUD_FOOT;
const HUD_FOOT_KBLOCK = `${HUD_FOOT_PLAIN} release · hold Esc exits full screen`;

/** Wake's (or any level's) `SupplyDepot` nodes, world position resolved
 *  through the scene graph — a depot is usually parented under a `Bundle`
 *  (`extract_map.py`'s own placement) and does not carry its own world
 *  translation, only the chain above it does. Run once per level load, from
 *  `onFoot` (below), never per frame. */
function collectSupplyDepots(root) {
  const depots = [];
  if (!root) return depots;
  const pos = new THREE.Vector3();
  root.traverse(obj => {
    const data = obj.userData?.supply;
    if (!data || obj.userData.templateKind !== 'SupplyDepot') return;
    obj.updateWorldMatrix(true, false);
    obj.getWorldPosition(pos);
    depots.push(new SupplyDepot({ x: pos.x, y: pos.y, z: pos.z }, data, obj.name));
  });
  return depots;
}

/** Read the keyboard into the soldier and put the camera behind his eyes. */
function onFoot(dt) {
  if (!soldier) return;
  soldier.collider = collider;
  const held = captured ? keys : EMPTY_KEYS;
  // Hoisted so footFire can hand the deviation model the same c_PIThrottle /
  // c_PIYaw values the body integrates — the engine's speed gates read the
  // *input*, not the achieved velocity.
  const input = {
    forward: (held.has('KeyW') || touchFlying ? 1 : 0) - (held.has('KeyS') ? 1 : 0),
    strafe: (held.has('KeyD') ? 1 : 0) - (held.has('KeyA') ? 1 : 0),
    walk: held.has('ShiftLeft') || held.has('ShiftRight'),
    crouch: held.has('ControlLeft') || held.has('ControlRight'),
    prone,
    jump: held.has('Space'),
  };
  soldier.step(dt, input);

  // Fall damage — an approximation; see `SAFE_FALL_HEIGHT`'s own comment
  // above (R4-18). Tracks the highest y seen while airborne (a jump's own
  // apex, when it was a jump) and judges the drop from it the instant the
  // body reports grounded again.
  if (!soldier.grounded) {
    fallPeakY = fallPeakY === null ? soldier.y : Math.max(fallPeakY, soldier.y);
  } else {
    if (!wasGrounded && soldierArmor && fallPeakY !== null) {
      const dropped = fallPeakY - soldier.y;
      if (dropped > SAFE_FALL_HEIGHT) {
        const ramp = (dropped - SAFE_FALL_HEIGHT) / (LETHAL_FALL_HEIGHT - SAFE_FALL_HEIGHT);
        soldierArmor.applyDamage(Math.min(1, ramp) * soldierArmor.maxHitPoints);
      }
    }
    fallPeakY = null;
  }
  wasGrounded = soldier.grounded;

  // Wake's SupplyDepot instances: collected once per level (a map switch
  // hands `currentRoot` a new object, caught here by reference), then ticked
  // at this hook's own call rate — `SupplyDepot.tick`'s internal 0.5s
  // self-throttle (verify-r3.md SUP-11) is what actually paces the give/heal,
  // not this call rate. The `ShowHealIcon`/`ShowReloadIcon` HUD vars are
  // un-throttled on purpose (SUP-33/34): they track proximity every frame,
  // the way the engine's own icon predicates do, independent of the depot's
  // own action cadence.
  if (supplyDepotsRoot !== currentRoot) {
    supplyDepotsRoot = currentRoot;
    supplyField = new SupplyField(collectSupplyDepots(currentRoot));
  }
  supplyTarget.x = soldier.x; supplyTarget.y = soldier.y; supplyTarget.z = soldier.z;
  supplyTarget.team = deployTeamId;
  supplyTarget.armor = soldierArmor;
  supplyField.tick(dt, supplyTarget);
  hudBridge.vars['ShowHealIcon'] = supplyField.canHeal(supplyTarget);
  hudBridge.vars['ShowReloadIcon'] = supplyField.canRearm(supplyTarget);
  if (soldierArmor) {
    hudBridge.vars['Soldier/SoldierHitPoints'] = soldierArmor.hitPoints;
    hudBridge.vars['Soldier/SoldierMaxHitPoints'] = soldierArmor.maxHitPoints;
  }

  // `soldier.eye()` is the eye pose with the bob already on it, interpolated
  // between the last two 60 Hz ticks — the sim runs on a fixed step inside
  // `step()` above, so drawing at the last tick would stutter on any monitor
  // that is not exactly 60 Hz. The bob's amplitudes are the game's
  // `setCameraShake*`; `soldier.js` has the citation.
  soldier.eye(footEye);
  camera.position.set(footEye.x, footEye.y, footEye.z);
  look.yaw = soldier.viewYaw;
  look.pitch = soldier.pitch;
  applyLook();
  // After the camera pose is final: the weapon fires down this frame's view
  // axis, and the crosshair is drawn against this frame's FOV.
  footFire(dt, input);
  // And after everything the frame owed: is there a door within reach.
  scanForEntry(dt);
}

const EMPTY_KEYS = new Set();
const footEye = { x: 0, y: 0, z: 0 };

// --- the weapon in hand ------------------------------------------------------
//
// A spawned soldier holds one glb, loaded from the models tree the way
// `flight.js` fetches a cockpit, parented to the camera and indexed by the
// same `GunFire` that fires the vehicles. For the pairings §11 of
// `first-person-soldier.md` has extracted, that glb is the first-person arms
// rig — camo sleeves and full-detail hands welded around the weapon, the six
// clip families baked in — mounted at the data's own `center1pHands` and
// driven by an AnimationMixer off the soldier's gait. Every other weapon
// draws its bare 3P glb at the eyeballed stand-in offset, exactly as before.
// Either way the document extras carry the armoury block (rate, spread,
// magazine, zoom, recoil) and a node stamped `fireArms` with a `muzzle`
// child, so nothing about any weapon is declared below.
//
// Two deliberate shortcuts remain, both visible and both documented:
//   - Scoped weapons get the data's FOV change and no scope art.
//   - Crouch and prone play the standing aim: their 1P clip families exist
//     in the data but are not yet baked into the fp.glb (§11 keeps the list).

// Which weapon the deploy screen's kit puts in hand is the game's own data,
// read from two places neither of which is the level's scene: the level's
// `Init.con` (`game.setTeamSkin` / `game.setKit <team> <slot> <kit>`) and the
// kit's `Objects.con` (the `HandFireArms` it carries at `itemIndex 3`, the
// slot the engine selects on spawn). `extract_loadouts.py` reads both through
// the kit readers and writes them as `_shared/loadouts.json` beside the
// levels; `kitPrimary` below looks the answer up by level, team and row.
let loadouts = null;
const loadoutsLoad = fetch(`${MAPS_BASE}/_shared/loadouts.json${bust()}`)
  .then(r => (r.ok ? r.json() : null))
  .then(data => { loadouts = data; return data; })
  .catch(err => { console.warn('loadouts unavailable', err); return null; });
// The stand-in for a maps tree published before `_shared/loadouts.json`
// existed, or a mod not yet run through the extractor: vanilla's kit
// primaries by the nation a side flies (`teamNation`), in the spawn screen's
// row order. Read from the same `Objects/Items/<Nation>Kit/*/Objects.con`
// files the extractor reads — not a guess, but frozen here, so the file wins
// whenever it is present.
const FALLBACK_PRIMARIES = {
  us:   ['No4Sniper', 'Bar1918', 'Bazooka', 'Thompson', 'No4'],
  brit: ['No4Sniper', 'Bar1918', 'Bazooka', 'Thompson', 'No4'],
  rus:  ['No4Sniper', 'DP', 'Bazooka', 'Mp18', 'No4'],
  ger:  ['K98Sniper', 'Sg44', 'Panzershreck', 'Mp40', 'K98'],
  jp:   ['K98Sniper', 'Type99', 'Panzershreck', 'Mp18', 'Type5'],
};

  medic: 'Medic', engineer: 'Engineer',

 *  null where `_shared/loadouts.json` is absent or does not name the level;
 *  `weaponTemplateFor` then falls back to the vanilla table by nation. */
function kitLoadout(team, kitName = deployKit) {
  const side = loadouts?.levels?.[currentDir]?.[team];
  if (!side) return { kit: null, primary: null, soldier: null };
  const slot = KITS.indexOf(kitName);
  let kit = side.slots?.[String(slot)] || null;

    // engine's own `setType`, so match on that before giving up.

function weaponTemplateFor(flag, kitName = deployKit) {
  const forced = params.get('weapon');
  if (forced) return forced;
  const team = flag?.team;
  const loadout = kitLoadout(team, kitName);
  if (loadout.primary) return loadout.primary;
  const slot = Math.max(0, KITS.indexOf(kitName));
  return FALLBACK_PRIMARIES[teamNation(team)]?.[slot]

  if (!hw) return;

    // aircraft's guns too. Rounds already in the air keep their reference to

    pos: { ...viewHip },   // the eased rig offset, chasing hip or zoom
    model: new DeviationModel({ deviation: data?.deviation }),
  };
  if (data) {
    const found = guns.collect(rig, {
      replace: false,          // the flown aircraft's guns must survive this
      speedScale: 1,           // real muzzle velocity, like the pilot path
      maxRange: 1200,
      roundLifetime: 'data',
      platformVelocity: () => (soldier ? soldier.body.velocity : null),
      // `fireInCameraDof 1`: the round leaves the eye down the view axis and
      // the muzzle node only places the flash. All 25 armed hand weapons
      // declare it; a mod one that does not falls back to its muzzle.
      aimRay: data.fireInCameraDof ? () => {
        camera.getWorldPosition(aimOrigin);
        camera.getWorldDirection(aimDirection);
        return { origin: aimOrigin, dir: aimDirection };
      } : null,
      spreadDeg: () => (handWeapon ? handWeapon.model.current() : 0),
    });
    hw.group = found[0] || null;
  }
  handWeapon = hw;
  if (mixer && actions.idle) {
    // Idle underneath from the first frame — the breathing sway, slow enough
    // at its declared 0.1x to read as stillness — and the raise over it:
    // §11's deploy one-shot on spawn.
    actions.idle.play();
    hw.active = 'idle';
    playViewmodelClip(hw, 'deploy', { restart: true });
  }
  // The fetch has been in flight since the top of this function; attach it
  // to `hw` whenever it lands. The guard is the load token, not
  // `handWeapon === hw`: a report that beats the glb home would otherwise be
  // dropped for the very weapon about to be published, while the token still
  // keeps one from landing on a weapon the soldier has already swapped away
  // from.
  firePromise.then(fire => { if (fire && weaponToken === token) hw.fire = fire; });
  return hw;
}

/** The right weapon for `flag` and the chosen kit, loaded only if it is not
 *  already in hand — in the right sleeves: a redeploy across the team line
 *  with the same weapon still changes soldier, so the rig is compared too. */
function ensureHandWeapon(flag) {
  const name = weaponTemplateFor(flag);
  const who = soldierTemplateFor(flag);
  if (handWeapon?.name === name
      && (handWeapon.rigFile || null) === (viewmodelRigFor(name, who) || null)
      && (!handWeapon.group || guns.groups.includes(handWeapon.group))) {
    // Same weapon, new life: the raise plays again on every spawn.
    playViewmodelClip(handWeapon, 'deploy', { restart: true });
    return;
  }
  loadHandWeapon(name, who);
}

// Walk/run are one baked clip at two rates (§11). Crouch/prone fall back to
// idle until those families are baked. LOCO_CLIP lives in viewmodel-anim.js.
const LOCO_LOOP = new Set(['idle', 'walk', 'run']);

/**
 * Bring `name` to full weight and fade whatever held the arms before it.
 * Loops keep their phase across a fade-out — a walk cycle returned to
 * mid-burst has not restarted — and one-shots pass `restart` to rewind.
 * Silently a no-op for the bare-weapon fallback, which has no mixer.
 */
/** Seconds the engine takes to blend into `name`: 1 / its state's morph factor. */
function viewmodelFade(hw, name) {
  const factor = hw?.clips?.[name]?.morphFactor ?? VIEWMODEL_MORPH_DEFAULT;
  return factor >= VIEWMODEL_MORPH_SNAP || factor <= 0 ? 0 : 1 / factor;
}

function playViewmodelClip(hw, name, { restart = false, timeScale = 1,
                                       fade = viewmodelFade(hw, name) } = {}) {
  const to = hw?.actions?.[name];
  if (!to || !hw.mixer) return;
  if (hw.active === name && !restart) return;
  const from = hw.active && hw.active !== name ? hw.actions[hw.active] : null;
  if (restart) to.reset();
  to.setEffectiveTimeScale(timeScale);
  to.enabled = true;
  to.play();
  if (from) {
    // Idle settles in ~1.4 s (morphFactor 0.7). crossFadeFrom alone would
    // leave LoopRepeat fire evaluating — and shaking — for that whole fade.
    // The engine leaves the fire state; freeze fire's clock so the last pose
    // holds while idle/walk morphs in. Reload already snaps via fade === 0.
    const leavingLoopFire = hw.active === 'fire'
      && from.loop === THREE.LoopRepeat;
    if (leavingLoopFire) from.setEffectiveTimeScale(0);
    if (fade > 0) {
      to.crossFadeFrom(from, fade, false);
    } else {
      from.stop();
      to.setEffectiveWeight(1);
    }
  } else if (restart) {
    to.setEffectiveWeight(1);
  }
  hw.active = name;
}

/**
 * The clip this frame owes, then the mixer tick. Selection is
 * `wantViewmodelClip` (viewmodel-anim.js): looping fire follows the trigger
 * latch, PlayOnce finishes its punch, bolt rifles ANIM-7 into StandReload.
 * Never hold fire for the ROF `cool` window (that was the sniper dip).
 */
function updateViewmodelAnimation(hw, dt) {
  if (!hw.mixer) return;
  const fireAction = hw.actions.fire;
  const fireRunning = !!(fireAction && fireAction.isRunning());
  const fireReturnsToReload = /reload/i.test(hw.clips?.fire?.returnTo || '');
  // Looping fire (Thompson / BAR) — not bolt rifles whose returnTo is
  // StandReload even when a stale extract still marks fire.loop true.
  const fireLoops = !!(hw.clips?.fire?.loop) && !fireReturnsToReload;
  const decision = wantViewmodelClip({
    reload: hw.reload,
    reloadPlayed: hw.reloadPlayed,
    reloadRunning: !!hw.actions.reload?.isRunning(),
    deployRunning: !!hw.actions.deploy?.isRunning(),
    active: hw.active,
    fireRunning,
    fireLoops,
    fireReturnsToReload,
    firing: !!hw.group?.firing,
    hasFire: !!fireAction,
    hasReload: !!hw.actions.reload,
    gait: soldier?.gait,
  });
  // Keyed on the magazine change, not on which clip holds the arms: a change
  // begun while the last reload clip is still clamped rewinds it. The clip
  // runs at the engine's own span (1/speed); DICE fitted rates in
  // 1pAnimationsTweaking.con so one pass matches reloadTime.
  if (decision.markReloadPlayed) hw.reloadPlayed = true;
  if (decision.startReload) {
    playViewmodelClip(hw, 'reload', { restart: true });
  } else if (decision.startFire) {
    playViewmodelClip(hw, 'fire', { restart: true });
  } else if (decision.want !== hw.active) {
    playViewmodelClip(hw, decision.want);
  }
  // Belt: selection already matches want (idle) but LoopRepeat fire is still
  // scheduled from a prior fade — freeze its clock so the clip cannot keep
  // shaking after hw.active has already flipped. Weight still drains via any
  // in-flight crossfade / fadeOut from playViewmodelClip.
  if (decision.stopLoopFire && fireAction) {
    fireAction.setEffectiveTimeScale(0);
  }
  hw.mixer.update(dt);
}

/** Begin a magazine change. True if one actually started. */
function startReload() {
  const hw = handWeapon;
  const magazine = hw?.data?.magazine;
  if (!hw || !magazine || hw.reload > 0 || hw.mags <= 0) return false;
  if (hw.rounds >= magazine.size) return false;
  hw.reload = magazine.reloadTime ?? 2;
  hw.reloadPlayed = false;   // the arms clip plays once per magazine change
  // `FireArms::Reload` calls setZoom(false): a magazine change drops zoom.
  hw.zoomed = false;
  hw.rezoom = 0;
  if (hw.group) guns.setFiring(hw.group, false);
  return true;
}

// --- the shot it makes -------------------------------------------------------
//
// Per-round one-shots from `models/sounds/<Name>.mp3` — the fire sample
// `extract_weapon_sounds.py` picked out of the weapon's own `.ssc`, with the
// authored volume, pitch jitter and time gate riding alongside in
// `weapons.json`. The vehicle guns hold a muted loop and gate it with gain
// because their fire is authored as a loop patch on a vehicle that outlives
// any burst; a hand weapon's round is an event, so each shot gets its own
// BufferSource into one shared bus. Overlap comes free — a Thompson's 0.1 s
// loop cycle at 700 rpm stacks instead of restarting, so rapid fire never
// cuts its own tail off — and the bus follows the master volume from
// updateAudio like every other voice on the page. Decodes go through the
// shared cache, so the one-decode-per-wav rule holds here too.
let weaponSoundsIndex = null;   // promise for models/sounds/weapons.json
let handFireBus = null;         // every hand-shot voice sums here

function weaponSoundsManifest() {
  if (!weaponSoundsIndex) {
    weaponSoundsIndex = fetch(`${MODELS_BASE}/sounds/weapons.json${bust()}`)
      .then(r => (r.ok ? r.json() : null))
      .catch(() => null)
      // A fetch that lost its race with the page's own load storm must not
      // memoise silence for the rest of the session: drop the cached promise
      // so the next weapon — or the next shot, through `refetchHandFireSound`
      // — asks again. Only a manifest that actually arrived is kept.
      .then(doc => { if (!doc) weaponSoundsIndex = null; return doc; });
  }
  return weaponSoundsIndex;
}

/** Resolve + decode `name`'s fire sample; inert until a shot actually plays
 *  it. Takes the bare template name rather than `hw` so `loadHandWeapon` can
 *  fire this off *before* `hw` exists — see the call site's comment on why
 *  that ordering is the whole fix for a shot going silent right after spawn. */
async function fetchHandFireSound(name) {
  if (AUDIO_OFF) return null;
  const manifest = await weaponSoundsManifest();
  const spec = manifest?.weapons?.[name];
  if (!spec) return null;   // a quiet weapon (binoculars), or a mod without the tree
  const buffer = await modelSoundBuffer(`sounds/${spec.file}`);
  return buffer ? { spec, buffer } : null;
}

/** One more try for a weapon whose report never landed, asked from the shot
 *  path. Once per weapon: a fetch is cheap, but a round is not the place to
 *  queue one every time the trigger falls. */
function refetchHandFireSound(hw) {
  if (hw.fireRetry) return;
  hw.fireRetry = true;
  const token = weaponToken;
  fetchHandFireSound(hw.name).then(fire => {
    if (fire && weaponToken === token) hw.fire = fire;
  });
}

function ensureHandFireBus(ctx) {
  if (!handFireBus) {
    handFireBus = ctx.createGain();
    handFireBus.gain.value = masterVolume() * WEAPON_HEADROOM;
    handFireBus.connect(audioListener.getInput());
  }
  return handFireBus;
}

// The active Fire Loop voice, for weapons whose .ssc marks the fire patch
// `loop` + `stop FinishSample`: the engine starts the loop when the trigger
// closes and, on release, lets the playing cycle run out rather than cutting
// it. Web Audio spells FinishSample as `source.loop = false` mid-play — the
// buffer is one authored cycle, so it ends exactly at the boundary.
let handFireLoop = null;

function startHandFireLoop(fire) {
  if (handFireLoop || !fire || !audioListener || masterVolume() <= 0) return;
  const ctx = audioListener.context;
  const source = ctx.createBufferSource();
  source.buffer = fire.buffer;
  source.loop = true;
  // The script's own per-play jitter (`randomStartPitch 0.02/0.01` on the
  // distance layer); the close stereo layer plays straight.
  const gain = ctx.createGain();
  gain.gain.value = Math.min(fire.spec.volume ?? 1, 1);
  source.connect(gain);
  gain.connect(ensureHandFireBus(ctx));
  source.onended = () => {
    try { source.disconnect(); gain.disconnect(); } catch (_) {}
    if (handFireLoop && handFireLoop.source === source) handFireLoop = null;
  };
  try { source.start(); handFireLoop = { source, gain }; } catch (_) {}
}

function releaseHandFireLoop() {
  // FinishSample: the cycle in flight completes, nothing is cut.
  if (handFireLoop) handFireLoop.source.loop = false;
  handFireLoop = null;
}

function playHandFire(fire) {
  if (!fire || !audioListener || masterVolume() <= 0) return;
  const ctx = audioListener.context;
  // A context built before the first gesture starts suspended and stays that
  // way until something resumes it. Pulling a trigger is a gesture, and when
  // the listener was created by a load rather than by a click this is the
  // difference between an audible session and a silent one.
  if (ctx.state === 'suspended') ctx.resume().catch(() => {});
  // A looped fire patch is trigger-held, not per-round: `onShot` only has to
  // make sure the loop is running.
  if (fire.spec.loop) {
    startHandFireLoop(fire);
    return;
  }
  const source = ctx.createBufferSource();
  source.buffer = fire.buffer;
  // The same per-play jitter DICE puts on the loops, applied per shot: a
  // burst reads as many rounds rather than one report stuttering.
  const [up = 0, down = 0] = fire.spec.randomStartPitch || [];
  source.playbackRate.value = 1 + (Math.random() * (up + down) - down);
  const gain = ctx.createGain();
  // The M1's report is authored at volume 10 against the game mixer's own
  // headroom; Web Audio has none to give, so the manifest keeps the authored
  // number and the clamp lives here, next to the bus that motivates it.
  gain.gain.value = Math.min(fire.spec.volume ?? 1, 1);
  source.connect(gain);
  gain.connect(ensureHandFireBus(ctx));
  source.onended = () => {
    try { source.disconnect(); gain.disconnect(); } catch (_) {}
  };
  // `delay` is the script's own `Volume <- Time` gate — the knife's swish
  // lands 0.4 s into the swing, and starting it early would un-author that.
  try { source.start(ctx.currentTime + (fire.spec.delay || 0)); } catch (_) {}
}

// Every round the soldier's own gun fires: the report plays, the magazine
// empties, the cone blooms, and the view kicks. `onShot` fires for vehicle
// guns too, so the group is checked first.
guns.onShot = group => {
  const hw = handWeapon;
  if (!hw || group !== hw.group) return;
  // A report that never arrived — a manifest or an mp3 that failed while the
  // page was still pulling the level down — is asked for once more here
  // rather than leaving this weapon silent for the rest of its life.
  if (!hw.fire) refetchHandFireSound(hw);
  playHandFire(hw.fire);
  // PlayOnce arms: one restart per round, blended at the fire state's morph
  // factor and clamped between shots. Looping fire (BAR / Thompson) is owned
  // by updateViewmodelAnimation + the trigger latch — restarting it here
  // would un-freeze a just-released LoopRepeat and keep the post-fire shake.
  const fireReturnsToReload = /reload/i.test(hw.clips?.fire?.returnTo || '');
  const fireLoops = !!(hw.clips?.fire?.loop) && !fireReturnsToReload;
  if (!fireLoops) playViewmodelClip(hw, 'fire', { restart: true });
  if (Number.isFinite(hw.rounds)) hw.rounds = Math.max(0, hw.rounds - 1);
  hw.model.onShot();
  hw.cool = 1 / (hw.data?.roundOfFire || 1);
  // `UnZoomBetweenFireTime > 0` (the snipers' 3.0): the fire path flags it
  // and `FireArms::handleUpdate` un-zooms, then re-zooms when the timer
  // runs out — the bolt-cycle un-zoom. The toggle latch itself holds.
  const unzoom = hw.data?.zoom?.unZoomBetweenFire;
  if (unzoom > 0 && hw.zoomed) hw.rezoom = unzoom;
  // `setRecoil*`: degrees per shot, sampled uniformly inside the declared
  // range (Thompson up 0.21..0.25, leftRight -0.1..0.1) and written into the
  // soldier's own look state, unscaled — the pitch clamp catches a long
  // burst the same way it catches the mouse.
  const recoil = hw.data?.recoil;
  if (recoil && soldier) {
    const draw = range => {
      if (!range) return 0;
      const lo = Math.min(range[0], range[1]);
      // The gun's dice, so a seeded check kicks the same way every run.
      return lo + guns.rand() * (Math.max(range[0], range[1]) - lo);
    };
    soldier.look(draw(recoil.leftRight) * DEG_TO_RAD,
                 draw(recoil.up) * DEG_TO_RAD);
  }
};
// Chained on *after* the raw assignment above, never before: `chainOnShot`
// captures whatever `guns.onShot` already is at the moment it runs and wraps
// it, but the hand weapon's own `guns.onShot = ...` right above is a plain
// reassignment that would discard any wrapper installed earlier in the file,
// silently taking every manned-gun shot's ammo/heat bookkeeping with it (this
// bit a first pass: every seat's `FireState` sat frozen at its starting ammo
// through a full firing test). Splices ammo/heat onto every shot `gunfire.js`
// fires, vehicle or hand weapon alike — a no-op for any group this track
// never built a `FireState` for (the aircraft/car path has no magazine model
// of its own yet; the hand weapon manages its own `hw.rounds` above).
chainOnShot(guns, group => fireStates.get(group.node)?.registerShot());

/**
 * One frame of the weapon: aim blend and FOV, deviation state, the reload
 * clock, the trigger, and the HUD. Runs from `onFoot` after the camera pose
 * is final, and before `guns.advance` fires this frame's rounds.
 */
function footFire(dt, input = null) {
  const hw = handWeapon;
  // Drained even bare-handed, or the first frame holding a weapon would see
  // every radian turned since it was picked up.
  const lookX = dt > 0 ? footLookX / dt : 0;
  const lookY = dt > 0 ? footLookY / dt : 0;
  footLookX = 0;
  footLookY = 0;
  if (!hw) return;
  guns.firstPerson = true;   // the 0.4 m `em_1P_*` sprite, not the 1.76 m mesh

  // The sniper bolt-cycle un-zoom window counts down here; when it empties,
  // the still-set toggle latch zooms the view back in on its own.
  if (hw.rezoom > 0) hw.rezoom = Math.max(0, hw.rezoom - dt);
  const zoomed = isZoomed();

  // Two fields of view, as the engine keeps them. `zoom.soldierFov`
  // (`SoldierZoomFov`, a factor: the Mp40's 0.9 barely leans in, the
  // Thompson's 0.6 commits) belongs to the ARMS: `BFSoldier::applyFovModifier`
  // multiplies it into `set1pFov` and hands the product to every
  // first-person part through `setFirstPersonFov` (0x004f7120). It eases
  // `0.7·cur + 0.3·target` per visual frame and snaps within 0.001 —
  // `BFSoldier::handleVisualUpdate`, no dt, frame-rate dependent by design.
  // The near pass in frame() draws the rig with it.
  const fovTarget = zoomed ? (hw.data?.zoom?.soldierFov ?? 1) : 1;
  hw.fovCur = Math.abs(fovTarget - hw.fovCur) <= FOV_SNAP
    ? fovTarget
    : 0.7 * hw.fovCur + 0.3 * fovTarget;
  // The world camera is the other: zoom switches it to the weapon's
  // `zoomFov`, a whole field of view in the unit `renderer.fieldOfView 1`
  // uses (radians; the Thompson's 0.5 = 28.6°, a sniper's 0.1 = 5.7°), and
  // back to FOOT_FOV. INFERRED [zoomFov unit]: read off the vehicleFov path
  // (`Camera::setVehicleFOV` replaces the render view's FOV wholesale), not
  // off the camera-mode switch itself, which is a raw-byte read
  // (0x004fc8b6). Whether that side eases or snaps is unread, so it borrows
  // the arms' 0.7/0.3 ease. OPEN [stand-in].
  const worldTarget = zoomed && hw.data?.zoom?.fov
    ? hw.data.zoom.fov / DEG_TO_RAD : FOOT_FOV;
  hw.worldFov = Math.abs(worldTarget - hw.worldFov) <= FOV_SNAP
    ? worldTarget
    : 0.7 * hw.worldFov + 0.3 * worldTarget;
  camera.fov = hw.worldFov;
  camera.updateProjectionMatrix();
  // And displaces the rig from its hip pose to its zoom pose, eased 25% of
  // the remaining distance per visual frame (0.25f, same function, no dt).
  const at = zoomed ? hw.viewZoom : hw.viewHip;
  hw.pos.x += (at.x - hw.pos.x) * VIEW_EASE;
  hw.pos.y += (at.y - hw.pos.y) * VIEW_EASE;
  hw.pos.z += (at.z - hw.pos.z) * VIEW_EASE;
  hw.rig.position.set(hw.pos.x, hw.pos.y, hw.pos.z);
  // A scoped weapon aims through glass this page does not draw yet; hiding
  // the rifle is the half of the scope view the data can already pay for.
  hw.rig.visible = !(hw.data?.zoom?.scope && zoomed);

  // The deviation inputs, named for the engine's PlayerInput channels. Note
  // what is NOT fed: zoom — aiming has no effect on deviation, in either
  // binary. `jumping` gates miscDev; the engine's gate is the c_PIAction
  // input masked by a soldier state bit, and airborne is this page's
  // stand-in for that mask. `dt` here is the frame's; the model converts it
  // to whole 1/30 s ticks itself (`TICK_HZ`), the engine's simulation step,
  // so the cone decays at the same rate on every monitor.
  hw.model.update(dt, {
    stance: soldier.stance,
    throttle: input?.forward ?? 0,
    strafe: input?.strafe ?? 0,
    lookX,
    lookY,
    jumping: !soldier.grounded,
  });

  const magazine = hw.data?.magazine;
  if (hw.reload > 0) {
    hw.reload -= dt;
    if (hw.reload <= 0) {
      hw.reload = 0;
      hw.mags -= 1;
      hw.rounds = magazine.size;
    }
  } else if (magazine && hw.rounds <= 0 && hw.mags > 0) {
    // Dry means a magazine change, asked for or not — `autoReload` in the
    // data or no. R merely asks early. Both go through startReload, so every
    // change drops zoom and owes the arms a fresh pass of the reload clip.
    startReload();
  }

  if (hw.group) {
    hw.cool = Math.max(0, hw.cool - dt);
    // `__setTrigger` stands in for the mouse under ?shots, where headless
    // Chromium never grants pointer lock — the capture gate would otherwise
    // dead-trigger every harness shot.
    const canFire = (captured || params.has('shots'))
      && hw.reload <= 0 && hw.rounds > 0;
    if (hw.data?.fireOnce) {
      // Semi-auto: one queued click becomes exactly one frame of trigger,
      // which `advance` turns into exactly one round; `cool` holds the
      // declared cycle (a No4 works its bolt for 2.7 s) across clicks.
      if (hw.pulse) {
        guns.setFiring(hw.group, false);
        hw.pulse = false;
      }
      if (clickQueued && canFire && hw.cool <= 0) {
        clickQueued = false;
        guns.setFiring(hw.group, true);
        hw.pulse = true;
      }
    } else {
      const firing = triggerHeld && canFire;
      guns.setFiring(hw.group, firing);
      // The Fire Loop follows the trigger, not the rounds: the .ssc's
      // `stop FinishSample` lets the cycle in flight complete on release,
      // on running dry, and on a magazine change alike.
      if (!firing) releaseHandFireLoop();
    }
  }

  // The arms last, once the reload clock and the trigger have settled what
  // this frame is: a reload begun above starts its clip this same frame.
  updateViewmodelAnimation(hw, dt);

  updateCrosshair();
}

/**
 * The crosshair's gap, in CSS pixels: the deviation ABOVE the stationary
 * floor, projected through the camera — `0.5 x height x tan(dev - floor) /
 * tan(vfov / 2)`.
 *
 * Subtracting the floor is measured, not derived: in retail footage a still
 * Thompson (minDev 0.4 deg, never zero) draws its arms MEETING at centre,
 * and they part when the shooter moves, turns or fires. So the gap tracks
 * the acquired spread, not the whole cone. OPEN: whether the engine's own
 * mapping is this projection or a linear scale — a corpus question
 * (crosshair draw path, client side); the footage pins only the endpoints.
 */
function updateCrosshair() {
  const hw = handWeapon;
  const style = hw?.data?.crossHair;
  const scoped = !!hw?.data?.zoom?.scope;
  const show = optOnFoot.checked && !!soldier && !!hw
    && (style === 'CHTCrossHair' || style === 'CHTIcon')
    && !(scoped && isZoomed());
  // Written only on change, and read back from the element rather than a
  // cache because enterVehicle and disposeHandWeapon hide it behind this
  // function's back: every DOM write here invalidates style, and a frame
  // with nothing new to say must cost the page nothing (rule 3).
  if (crosshairEl.hidden !== !show) crosshairEl.hidden = !show;
  if (!show) return;
  // CHTIcon weapons draw an authored icon in the game; until that art is
  // extracted they keep the centre dot alone.
  const icon = style === 'CHTIcon';
  if (crosshairEl.classList.contains('ch-icon') !== icon) {
    crosshairEl.classList.toggle('ch-icon', icon);
  }
  // The renderer's own backing store, not `stageHeight`: a headless capture
  // resizes the renderer through `__renderOnce` and never touches the page,
  // so the cached page height is stale there and the crosshair gap came out
  // scaled for a window nobody is looking at. Same reasoning, and the same
  // source, as the HUD canvas's own size in `frame()`.
  const height = renderer.domElement.height / renderer.getPixelRatio() || 800;
  const floor = (hw.model.floor?.() ?? 0) * DEG_TO_RAD;
  const dev = Math.max(0, hw.model.current() * DEG_TO_RAD - floor);
  const px = 0.5 * height * Math.tan(dev) / Math.tan(camera.fov * DEG_TO_RAD / 2);
  const gap = `${px.toFixed(1)}px`;
  if (crosshairEl.style.getPropertyValue('--ch-gap') !== gap) {
    crosshairEl.style.setProperty('--ch-gap', gap);
  }
}

// --- the in-game HUD: soldier-side variables --------------------------------
//
// hud.js owns the one painter for every group hud-layout.json declares; this
// page's job is only to keep `gameHud.vars` current with the engine's own
// named variables (features/bf1942-3d-models/in-game-hud.md). This section
// feeds the SOLDIER side — health bar, stance figure, hand-weapon ammo panel —
// plus the one shared boolean (`Vehicle/ShowVehicleIcon`) that switches the
// ammo panel between its soldier and vehicle skins; a future seats.js owns
// the vehicle-side groups themselves (vehicleIcon/vehicleHealth/vehicleSeats/
// primaryAmmo/secondaryAmmo) and, once it lands, the finer-grained seated
// state that boolean really needs — see the note on `inVehicle` below.

// c_BfSoldierStanding/Crouching/Lying, the engine's own pose vocabulary
// (CommonSoldierData.inc), against the sprite pack's own suffix — a direct
// rename, not an inference.
const STANCE_TEXTURE = { stand: 'standing', crouch: 'crouching', prone: 'lying' };

// OPEN [R1-12]: the nation key BFSoldierHud's stance icon actually reads was
// never traced (verify-r1.md leaves it open). Approximated with the same
// per-side nation the deploy screen's own kit art already resolves
// (`teamNation`), translated only where the icon set's own filenames spell a

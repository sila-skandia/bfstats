<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './vendor/loaders/GLTFLoader.js';
import { createLoadOverlay } from './progress.js';
import { createBriefingScreen } from './briefing-screen.js';
import { selectMod } from './mods.js';
import { Aircraft } from './aircraft.js';
import { GroundVehicle } from './wheeled-vehicle.js';
import { TrackedVehicle } from './tracked-vehicle.js';
import { Ship } from './ship.js';
import { FireState } from './seats.js';
import { GunFire } from './gunfire.js';
import { EffectLibrary, EffectPlayer } from './effects.js';
import { EffectAudio } from './effect-audio.js';
import { createReplayController, recordingLevel } from './replay.js';
import { Armor } from './armor.js';
import { loadHudPaths } from './hud-pack.js';
import { VehicleRegistry } from './vehicle-instance.js';
import { createBotReferee } from './bot-referee.js';
import { createBotRounds } from './bot-rounds.js';
import { createBotUnits } from './bot-units.js';
import { createBotVisuals } from './bot-visuals.js';
import { installTestHooks } from './test-hooks.js';
import { createNetRoom } from './net-room.js';
import { createScoreboardScreen } from './scoreboard-screen.js';
import { createDeployScreen } from './deploy-screen.js';
import { createSpawning } from './spawning.js';
import { createMapSurfaces } from './map-surfaces.js';
import { createTicketFeed } from './ticket-feed.js';
import { createRoundState } from './round-state.js';
import { createHudFeed } from './hud-feed.js';
import { createVehicleHud } from './vehicle-hud.js';
import { createSoldierHud } from './soldier-hud.js';
import { createHandWeapon } from './hand-weapon.js';
import { createKitDropsPage } from './kit-drops-page.js';
import { createSeatPose } from './seat-pose.js';
import { createFootBody } from './foot-body.js';
import { createSoldierView } from './soldier-view.js';
import { createPageAudio } from './page-audio.js';
import { createFlagCapture } from './capture.js';
import { createVehicleWrecks } from './vehicle-wrecks.js';
import { createHullBodies } from './hull-bodies.js';
import { createVehicleHits } from './vehicle-hits.js';
import { createLevel } from './level-load.js';
import { createLocalPlayer } from './local-player.js';
import { createSeatCamera } from './seat-camera.js';
import { createLocalLook } from './local-look.js';
import { createVehicleEntry } from './vehicle-entry.js';
import { createPageConsole } from './page-console.js';
import { createPageInput } from './page-input.js';
import { createControls } from './controls.js';
import { createFreeCamera } from './free-camera.js';
import { createTouchControls } from './touch-controls.js';
import { bag, from } from './page-bag.js';
import { createComms } from './comms.js';

// Which game's levels this page serves, and the directory they hang off:
// 'maps' for vanilla, 'maps/mods/eod' for a mod. Resolved before anything is
// fetched, and it draws the nav's mod picker as a side effect.
const activeMod = await selectMod('maps');
const MAPS_BASE = activeMod.paths.maps;
// And the models tree beside it, for the weapon a spawned soldier holds —
// the same base `flight.js` resolves for a cockpit glb, taken from the mod
// record here because this page has already resolved one.
const MODELS_BASE = activeMod.paths.models || 'models';

const DEFAULT_DRAW = 700;
const FLY_SPEED = 140;
const FLY_SLOW = 0.02;
// The FREE-FLY camera's look, radians per pixel, and nothing else any more.
// It used to be the soldier's too, on no basis; the soldier now runs the
// engine's own law (`mouse-input.js`, `BFSoldier::handlePlayerInput` lnxded
// 0x08273c70) and this number stays only because the free camera is a debug
// surface the engine has no equivalent for. Worth recording why it survived
// so long: at the shipped sensitivity the engine's yaw works out at 0.1215
// degrees per count and 0.0022 rad is 0.12605 degrees per pixel -- 3.7% apart,
// which is the closest thing anyone has to evidence that one browser pixel is
// about one mouse count.
const LOOK_SENS = 0.0022;
const FLY_KEYS = new Set([
  'KeyW', 'KeyA', 'KeyS', 'KeyD', 'KeyQ', 'KeyE',
  'ShiftLeft', 'ShiftRight',
]);

// ?shots keeps the drawing buffer so canvas.toDataURL() works for external
// screenshot tooling; off by default because it costs a buffer copy per frame.
// `&nopreserve` gives the perf harness the hooks without the copy, so it can
// measure the page a player gets.
//
// `?aa=0` and `?dpr=<ratio>` put the renderer settings on the bench's matrix
// (features/mesh-viewer-performance, renderer settings). MSAA is a context
// attribute (`antialias`, handed to `getContext` in three's constructor), so
// it can only be picked here, before the context exists. `dpr` replaces the
// cap for the WebGL canvas alone; the 2D map surfaces keep their own. Absent,
// both leave the defaults exactly as they were.
const renderQuery = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({
  antialias: renderQuery.get('aa') !== '0',
  preserveDrawingBuffer: renderQuery.has('shots') && !renderQuery.has('nopreserve'),
});
const dprOverride = Number(renderQuery.get('dpr'));
renderer.setPixelRatio(dprOverride > 0 && dprOverride <= 4 ? dprOverride : Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
const stage = document.getElementById('stage');
stage.appendChild(renderer.domElement);

// A lost context leaves the canvas showing whatever it last drew -- there is
// no repaint to hint that anything is wrong, so without this the page just
// goes quietly stale. Measured cause on this machine: a GPU-side stall
// during a firing burst at DPR 2 (features/mesh-viewer-performance/README.md,
// the Iris Xe log) took 8-9.5 s on one frame and the browser gave up on the
// context rather than waiting it out. `renderer`'s own `onContextLost`
// (`vendor/three.module.js`) already calls `preventDefault()` -- that is
// what tells Chromium a restore is worth attempting, and `restored` would
// fire without this listener too -- the call here is redundant, not load-
// bearing, kept only because a second listener calling it is harmless and
// this one should not depend on three's internals staying that way. What
// this listener actually adds is the visible message: nothing here tries
// to rebuild the scene on restore -- every texture and compiled program the
// renderer held is gone, and re-uploading all of it is out of scope for "no
// silent black canvas" -- so restore just offers a reload instead of
// pretending play can continue.
const glLostEl = document.getElementById('gl-lost');
const glLostTitle = document.getElementById('gl-lost-title');
const glLostBody = document.getElementById('gl-lost-body');
document.getElementById('gl-lost-reload')?.addEventListener('click', () => location.reload());
// Set while the context is down, so the frame watchdog (below, beside the
// animation loop) does not overwrite the context card with a stall message
// for the same event.
let contextLost = false;
function showGraphicsCard(title, body) {
  glLostTitle.textContent = title;
  glLostBody.textContent = body;
  glLostEl.hidden = false;
}
renderer.domElement.addEventListener('webglcontextlost', e => {
  e.preventDefault();
  pageInput.release();
  contextLost = true;
  showGraphicsCard('Graphics context lost',
    'The GPU dropped the WebGL context mid-frame. Trying to bring it back...');
  // Chrome does not always restore on its own after a GPU process crash: one
  // twelve-bot run saw the process exit unexpectedly and the context sit
  // lost for nine minutes (the browser reinitialised its GPU process 1.6 s
  // in and still nothing). `WEBGL_lose_context`'s restoreContext() forces
  // the browser's own restore path; three re-initialises its GL state on the
  // restored event and textures re-upload as they are drawn. If Chrome does
  // restore on its own first, this is a no-op.
  const lc = renderer.getContext().getExtension('WEBGL_lose_context');
  if (lc) setTimeout(() => { try { lc.restoreContext(); } catch (_) {} }, 1500);
}, false);
renderer.domElement.addEventListener('webglcontextrestored', () => {
  // three has re-initialised its GL state by the time this fires; the frame
  // loop (which parks while `contextLost` or the card is up) resumes. If
  // the re-init went wrong, the frame watchdog below re-raises a card.
  contextLost = false;
  glLostEl.hidden = true;
}, false);

const scene = new THREE.Scene();
// The scene never moves, and in three r169 an auto-updating root is what
// forces every descendant's world matrix to be recomputed each frame
// (freezeStatics, below, has the arithmetic). Its matrix stays the identity
// it was born with.
scene.matrixAutoUpdate = false;
const camera = new THREE.PerspectiveCamera(60, 1, 0.5, 8000);
camera.position.set(0, 80, 0);
// In the scene graph, not just pointed at it, so things may hang off it: the
// audio listener is a child of the camera, and a parentless camera's
// children are never rendered at all. (The on-foot arms are not — they hang
// off `vmRoot`, a camera-following node in the near pass's own scene.)
scene.add(camera);

const hemi = new THREE.HemisphereLight(0xe8dcc0, 0x5a4a32, 1.35);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1d0, 2.4);
scene.add(sun);

const loader = new GLTFLoader();
// Loose textures — lightmap atlases, terrain detail, sky, water — are queued
// after the scene .glb resolves and finish well after it. Their own manager
// turns that tail into a countable second phase of the progress bar instead of
// a stretch where the map is up but still visibly filling in.
const texManager = new THREE.LoadingManager();
const cubeLoader = new THREE.CubeTextureLoader(texManager);
const texLoader = new THREE.TextureLoader(texManager);
// Cache-busting is an iteration aid, not a production behaviour: a 70 MB scene
// re-fetched on every visit and every map switch is by far the slowest thing
// this page can do, and it defeats the Cache-Control nginx already sets. Local
// dev still bypasses the cache so a re-extract shows up without a hard refresh,
// and ?nocache forces it anywhere.
const DEV_ORIGIN = ['localhost', '127.0.0.1', '[::1]', ''].includes(location.hostname);
const NO_CACHE = DEV_ORIGIN || new URLSearchParams(location.search).has('nocache');
const bust = () => (NO_CACHE ? `?t=${Date.now()}` : '');
// Where every piece of the game's interface comes from for this mod: the
// sprites, the spawn screen, the HUD layout, the bitmap fonts and the
// console face. A mod's pack holds only what it changed, so `hudPaths.url`
// answers with the mod's directory for those and vanilla's for the rest;
// on vanilla nothing is fetched and every path is the one it always was.
// See `hud-pack.js`.
const hudPaths = await loadHudPaths(activeMod.id, { bust });

// Hosted on the stage, not the body: .ld-overlay is inset:0 absolute, and
// body is unpositioned, so on the body it would resolve against the viewport
// and paint over the shared nav bar. #stage is the 3D view's positioned box.
// The mission-briefing screen rides along: the overlay parks on it once the
// level is up, and its pixels (the game's plate, faces and knapp plates) come
// out of the hud pack and the load pack through `hudPaths`.
const briefingScreen = createBriefingScreen({ hudPaths, mapsBase: MAPS_BASE, bust });
const overlay = createLoadOverlay(stage, { assetBase: MAPS_BASE, briefing: briefingScreen });
// The local player's combat-area frame (`level.combatArea`), read back from
// the last world step in frame() below, and the world that stepped it. A new
// level's world has stepped nothing yet, so a frame the old one left reads as
// none until the first step of the new.
let combatFrame = null;
let combatFrameWorld = null;
const combatFrameNow = () => (combatFrameWorld === level.world ? combatFrame : null);

const params = new URLSearchParams(location.search);

/** The Instant Battle screen in `play/` is where a level is chosen. The mod
 *  travels with the redirect: that screen reads `?mod=` and nothing else, so
 *  a bare `map.html?mod=xpack1` that dropped it would land the player on
 *  vanilla's level list having asked for Road to Rome's. */
const MENU_URL = new URL('./play/index.html', location.href);
if (params.get('mod') && params.get('mod') !== 'bf1942') {
  MENU_URL.searchParams.set('mod', params.get('mod'));
}

// A bare `map.html` names no level, and the level list sits in the debug
// panel a player never sees, so there would be nothing here to choose with.
// Anything that names a level or a recording, asks for the debug panel, or is
// a headless run stays on this page.
if (!params.has('map') && !params.has('replay') && !params.has('shots')
    && params.get('dev') !== '1') {
  location.replace(MENU_URL);
  await new Promise(() => {});
}

/** A match, as against a level being looked at: `play/skirmish.js` launches
 *  Instant Battle with a side on it and `play/multiplay.js` joins a room, while
 *  a bare `map.html?map=` is the flythrough a visitor browses in. The first two
 *  take the shell down for the whole match (`shell-playing` in map.css), the
 *  third keeps it: the tabs above the stage are how you leave this page.
 *  Set here, before the level loads, so a match never flashes a bar it is about
 *  to drop; the spawn screen, which the flythrough can open too, refines it in
 *  `paintPlayingShell` below. */
const IN_MATCH = params.has('team') || params.has('room');
document.documentElement.classList.toggle('shell-playing', IN_MATCH);

const optGameFog = document.getElementById('game-fog');
const optWire = document.getElementById('wire');
const optVehicles = document.getElementById('vehicles');
const optEntire = document.getElementById('entire-map');
const optSound = document.getElementById('sound');
const optSoundVol = document.getElementById('sound-vol');
const optPilot = document.getElementById('pilot');
const optOnFoot = document.getElementById('onfoot');
const spawnFlagSelect = document.getElementById('spawn-flag');
const isTouchDevice = ('ontouchstart' in window || navigator.maxTouchPoints > 0 || window.matchMedia('(pointer: coarse)').matches || window.innerWidth <= 720);
// `?shots&noaudio` takes Web Audio out at the source, for the perf harness's
// audio-on/audio-off A/B: no AudioContext is ever created, so no listener
// rides the camera, no loop is decoded, no engine or gun patch is built, and
// updateAudio finds nothing to automate. Unticking the sound box is not the
// same experiment — every loop keeps playing into a zero gain, and three's
// listener and panners still schedule their ramps every frame. Gated on
// `?shots` like `&nopreserve`, so no player can reach it.
// (features/mesh-viewer-performance, audio automation cost.)
const AUDIO_OFF = params.has('shots') && params.has('noaudio');

function uiFocused() {
  const t = document.activeElement;
  return t && (t.tagName === 'SELECT' || t.tagName === 'INPUT' || t.tagName === 'TEXTAREA');
}
const level = createLevel(bag(
  from(() => botBodies, `ensureRoot:ensureBotRoot`),
  from(() => flagCapture, `unitRectOf`),
  from(() => freeCamera, `placeCamera`),
  from(() => hullBodies, `floatPlacedVehicles loadCollisionMeshes onCrashDamage rebaseDeckSpawns
    settlePlacedVehicles setupVehicleBodies`),
  from(() => localLook, `capturePresentationTick rebuildVehicleInterp`),
  from(() => localPlayer, `forgetSoldier leaveOnFoot setPilot`),

// The stage's size, taken here and only here: a `clientHeight` read in the
// middle of a frame, after that frame's own DOM writes, forces a synchronous
// layout every frame (features/mesh-viewer-performance, rule 3).
function resize() {
  // Stage, not window: the shared nav bar takes a grid row above it.
  const w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}

//
// The map scene already ships real vehicles at their spawn points, assembled by
// the same assembler the model browser uses and carrying a `rig` extra on every
// input-driven part, plus an empty `<Vehicle>Camera` node at the pilot's eye
// point. Piloting therefore adds no extraction: it drives what is already here.
//
// Control scheme is the game's own (`Settings/Default/Controls/Air.con`): the
// keyboard flies the aircraft and the mouse is a head, not a stick. W/S is
// throttle, A/D is rudder, the arrow keys are the stick — up/down pitch,
// left/right roll. Landing gear is deliberately not bound; in the real game it
// is automatic on altitude thresholds, which `Aircraft.integrate` reproduces.
//
// Freeing the mouse from the stick lets it do what the game's own hold-LShift
// free-look does: swivel the pilot's head inside a cockpit that is still flying
// straight, within the clamps the Corsair's camera declares.
//
// C cycles the view — `c_PIToggleCameraMode`, IDKey_C in the game's own control
// maps — through cockpit, chase, front and fly-by. `VehicleCamera` in flight.js
// owns all four and is explicit about which of them the data actually describes:
// the cockpit, and only the cockpit. Outside it the mouse orbits instead of
// swivelling, and fly-by ignores it entirely.
//
// Every occupied hull is one `VehicleInstance` in `vehicles` (vehicle-
// instance.js): its one drivetrain, its seat model and rigs, its gun groups
// per seat, its body adoption and its seat map. The human and every bot hold
// a seat of it and nothing else; `vehicles.enter` / `leave` / `switchSeat`
// are the only ways in, out and across, for both.
//
// `localPlayer` is how this page reads the human's side of that, looked up from the
// registry on every read rather than kept: `localPlayer.occupancy` is his
// `SeatHandle` (the hull and his seat), `localPlayer.aircraft` the hull's drive
// when it flies or sails (a `Ship` IS an `Aircraft`), `localPlayer.car` when it

/**
 * `env.buildDrive` for the registry: the hull's drivetrain, built once when
 * someone takes its root seat, whoever that is. `ensureDrive` picks the class;
 * `tank` asks for `TrackedVehicle` and falls back to `GroundVehicle`.
 *
 * The cockpit interior is a glb of its own, fetched now and swapped in for the
 * fuselage when it lands (flight.js); relit and then warmed before the swap
 * shows it, so the first cockpit frame links nothing (rule 6) and is not black
 * (`unlitCockpit`) -- for a bot's drive too, since the human may climb into it.
 */
function buildHullDrive(instance) {
  const occ = instance.occupancy;
  const drive = occ.ensureDrive(level.currentRoot, {
    groundHeight: level.groundHeight, surfaceFriction: level.surfaceFriction, deckNormal: level.deckNormal, collider: hullBodies.bodyAwareCollider(),
    // The flat sea. A ship needs it twice: its `FloatingBundle`s measure
    // `f` against it, and its two rudders make lift at all only because
    // `PhysicsWing` gives a submerged surface a medium of 10.
    waterLevel: level.collider?.waterLevel ?? level.extras?.waterLevel,
    prepareCockpit: root => { level.unlitCockpit(root); return level.warmSubtree(root); },
  });
  // A helm with no `Ship` built (a tree with no Engine node under the hull)
  // stays a bare seat rather than pretending to drive.
  if (!drive) return null;
  if (occ.rootKind === 'air') {
    drive.groundHeight = level.groundHeight;
    // The spawn pose puts the aircraft on the deck; lift it clear of its
    // own wheels. The car/tank stays put — its springs are the lift.
    drive.state.position.y += 0.2;
  } else if (occ.rootKind === 'ship') {
    // Run aground on a beach rather than sail through it — but against the
    // sea BED, not `groundHeight`, which is `surfaceHeight` and therefore
    // `max(terrain, water)`. Handing a ship that floor clamps every hull
    // whose draft is below the waterline UP to the sea surface: a Yamato,
    // which floats at 17.45 against a water level of 20, was pinned at 20
    // and reported `grounded`. A ship's floor is the ground under the water.
    drive.groundHeight = (x, z) => {
      const h = level.collider?.heightfield?.height(x, z);
      return Number.isFinite(h) ? h : -Infinity;
    };
    // ... and the normal there, because `impulseOn`'s push-out is ALONG it
    // (`checkVsTerrain` asks for height and normal in one call,
    // `PatchTerrain::getHeightAndNormal` `0x083d6f10`). Without it a hull
    // that meets the face of a reef is lifted up it instead of stopped
    // against it — and a hull left buried in a bank is billed crash damage
    // for a contact with a wall. See `Ship.pushOutOfBed`.
    drive.groundNormal = (x, z, out) => {
      const n = level.collider?.heightfield?.normal;
      if (!n) { out.set(0, 1, 0); return out; }
      n.call(level.collider.heightfield, x, z, hullBodies._shipNormal);
      out.set(hullBodies._shipNormal[0], hullBodies._shipNormal[1], hullBodies._shipNormal[2]);
      return out;
    };
    // ... and once she is on it, what holds her there: the mean of her own
    // material's friction and the bottom's, which is what `impulseOn` writes
    // as the Coulomb budget's `A`.
    drive.seabedFriction = hullBodies.seabedFriction;
  }
  // `Vehicle` defaults to forcing first person every step, because a page
  // with a single view has no other way to say "someone is sitting in it".
  // This page's views take the decision over: `VehicleCamera` calls
  // `setFirstPerson` on every mode change, and a bot's hull stays exterior.
  drive.autoFirstPerson = false;
  drive.setFirstPerson?.(false);
  return drive;
}

// ---------------------------------------------------------------------------
// Vehicle damage: shoot a tank, watch it smoke, burn and explode.
//
// The simulation is `vehicle-damage.js`, which is framework-free and tested
// under node (`tests/test_vehicle_damage.py`). Everything here is the scene
// half: which placed object owns which Armor, where a tier's effect hangs, and
// what a wreck looks like.
//
// What the engine does and does not do, from `features/bf1942-engine-reference/`:
//
//   - **A collision costs hit points** (ledger HP-6, reversed 2026-09-19;
//     `subsystems/collision-response.md` section 9). Ramming damages both
//     vehicles by `speedMod x v^2 x` an angle factor `x` the material pair
//     table, at most once a second per pair. That path is `stepVehicleBodies`
//     below, which feeds the same `VehicleDamageSet` a round does.
//   - **A living vehicle re-evaluates its tier every tick** (ARM-1), so this
//     polls rather than latching, and stops polling once the thing is dead.
// ---------------------------------------------------------------------------

// --- the guns ---------------------------------------------------------------
//
// Same runtime as the model browser (`gunfire.js`), pointed at the flown
// vehicle instead of a model on a turntable. The Corsair's `CorsairGuns` is a
// two-barrel FireArms at 12 rounds a second, 400 m/s, tracer every third round,
// and all of that is read out of the scene — nothing about the Corsair appears
// below.
//
// Three things differ from firing a parked model, and all three are options:
//
//   - Rounds are parented to `scene`, never to the aircraft, or a tracer would
//     hang off the wing at a fixed distance for its whole life. That is the
//     module's own contract, so it costs nothing here beyond passing the
//     world in.
//   - `platformVelocity` adds the airframe's velocity to the muzzle's. Fired
//     level it barely shows against 400 m/s; fired in a dive or a hard yaw the
//     stream visibly leans away from the nose, which is the tell that the
//     rounds are really in the world and not glued to the gun.
//     Not modelled: the muzzle's own `omega x r` from the roll rate. At the
//     Corsair's 200 deg/s and a 2.23 m semi-span that is 7.8 m/s across a
//     400 m/s round — 1.1 degrees, the same order as the gun convergence the
//     muzzle nodes already carry, and it needs the body-rate sign convention
//     to be right to be worth having.
//   - Real muzzle velocity (`speedScale: 1`) and the round's declared
//     `timeToLive`. The browser slows fast rounds to 15% because a 400 m/s
//     round crosses a parked model between two frames; from a cockpit moving
//     at 50 m/s the round's motion *relative to you* is the picture, and it
//     reads as the dashed stream the game draws. A `Tracer_Projectile` then
//     lives its declared 3 s, which at 400 m/s is 1200 m — past Wake's 500 m
//     draw distance, so in practice the stream fades into the fog and expires
//     unseen, exactly as it does in game.
//   - `viewportHeight` is the tracer width floor's denominator. Read off the
//     drawing buffer rather than the window because `__renderOnce` resizes it
//     to whatever a headless check asked for, and a floor measured against the
//     wrong height is a streak that grows or vanishes only under test.
const _bufferSize = new THREE.Vector2();
const guns = new GunFire({
  scene, camera,
  viewportHeight: () => renderer.getDrawingBufferSize(_bufferSize).y,
});
// The tinted impact discs are a debug marker, not the authored effect; the
// authored effect is the EffectBundle the material table names, played out of
// `_shared/effects.glb` by `effects` below. `?impacts=debug` draws the marker
// as well, `?effects=off` leaves the library unloaded.
guns.impactMarkers = params.get('impacts') === 'debug';
// Every seat's gun groups are collected and released by the hull's instance.
vehicles.env.guns = guns;
// Every round that stops anywhere comes through here. Most land on terrain or a
// building and cost nothing; one that lands on something with an Armor takes
// hit points off it (ledger HP-6: a projectile is the only thing that damages
// anything in this engine).
guns.onImpact = record => vehicleHits.applyVehicleHit(record);
guns.bodyCast = vehicleHits.roundBodyCast;
// The struck hull's own `angleMod`, for the direct hit's angle term.
guns.angleModOf = vehicleHits.angleModOf;
// The proximity fuse's candidates: every hull, whoever drives it.
guns.nearObjects = vehicleHits.proximityObjects;
// The game's own impact, trail and explosion bundles. Loaded once per mod
// beside `damage.json`; a level change keeps it. Until it lands (or when it
// is absent) a hit is recorded and nothing is drawn at the spot.
// Mesh particles (the decals, the stone chips) are `lighting true` meshes and
// get the same engine-combine shading as every other dynamic mesh here.
// The other half of a bundle: the sound it was authored with. Pooled per
// sound script and budgeted against the game's own 32 hardware voices — see
// `effect-audio.js`. `?effects=off` leaves it out with the pictures;
// `?sound=off` silences it on its own.
const _effectEar = new THREE.Vector3();
const effectAudio = new EffectAudio({
  listener: null,
  getBuffer: relPath => pageAudio.soundBuffer('_shared', relPath),
});
// The hook is one call at the point a bundle plays, which is also the point
// the engine plays its own — `Game::playCollisionEffect` sounds the bundle
// where it stands it up.
const effects = new EffectPlayer({
  scene, camera,
  onMesh: mesh => level.bindDynamicShading(mesh),
  onSound: (name, position, opts) => effectAudio.play(name, position, opts),
  onSoundStop: token => effectAudio.stop(token),

/** The shell, up or down. A match takes it down for its whole length; so does
 *  the spawn screen, which Caps Lock opens from a flythrough as well, because

 *  row go and resizes the renderer, so nothing here has to.

 *  class list, or every frame of a match would invalidate style. */

// The frame, in named phases. Each phase whose state one module owns lives in
// that module (`localPlayer.frameInput`, `localPlayer.frameCameras`); the rest
// are this page's wiring of several owners, in the order the page has always
// run them. The order below is load-bearing: see each phase's own comments.
function frame(dt) {
  // The joystick is sampled once a frame with the rest of the devices: its
  // button edges dispatch through pageInput's trigger bodies, and its axes
  // are read by `controls.axis` from the sampling below. Absent pad, absent
  // cost.
  controls.pollGamepad();
  // Every drawn hull back on its last tick's pose before any of the frame's
  // simulation reads it (the bots' AI after the step, on a frame that ran no
  // tick); `localLook.present` below draws them between ticks again.
  localLook.restoreTickPose();
  const { seated, onFoot, input, look } = localPlayer.frameInput(dt);
  const step = simulate(dt, input, look);
  // ---- the cameras and the rest of the presentation -------------------------
  localPlayer.frameCameras(dt, seated, onFoot);
  presentWorld(step, dt);
  draw(dt);
  paintHud(dt);
  // The shell last, with the HUD: the spawn screen can take it down mid-match
  // or open it from a flythrough, and Esc puts it back.
  paintPlayingShell();
}

/** The simulation phase: the world's tick, then the bots, the capture law and
 *  the drawn instant, the room's send, and the step's readbacks. */
function simulate(dt, input, look) {
  // ---- the sim core (world) -------------------------------------------------
  // The whole simulation core of the old frame() in one 30 Hz step: the
  // per-player soldiers and occupied drivetrains (the old onFoot +
  // pilot/drive/manned sim halves), guns.advance, the combat area per player,
  // the vehicle bodies and the damage pass — in the exact order, with
  // nothing presentational inside (world.js, the tick law in its header).
  // `step` is that tick's report; the presentation halves read it back.
  const step = level.world?.step(dt) ?? { ticks: 0, bodyTicks: 0, alpha: 0, players: {}, damage: [] };
  // Bot AI runs after the world step, so bots read the player's post-step pose.
  referee.tick(dt);
  // The kits on the ground turn and time out on the world's own ticks: one
  // `Item::handleUpdate` and one message-clock step per world update.
  kitDrops.tick(step.ticks / 30);
  botBodies.updateBotVisuals(dt);
  hullBodies.syncVehicleSpawnOwnership();
  referee.captureTick(step.ticks / 30);
  // The round's bleed, on the same tick count: a side loses a ticket every
  // `60 / rate` seconds while the enemy holds more than 99 weight of the map
  // (`round-state.js`). The weights come from `extras.controlPoints`, which
  // `hoistCaptureFlag` keeps in step with the world's flags.
  if (round && !room.roomJoined) round.tick(step.ticks / 30, level.extras?.controlPoints);
  syncTickets();
  // The presentation instant this frame draws, and the drawn vehicle pose that
  // follows from it. Before every camera below, because all of them read it —
  // directly (the on-foot eye) or through the scene graph (every seat).
  localLook.present(step.alpha);
  localPlayer.drainSoldierEvents();

  room.sendTickInputs(step.ticks, input, look, dt);

  // The readbacks: the HP-15 gate answer the camera shells and the mobile UI
  // spend, the combat-area frame for the warning group and the `?data` hook,
  // and the on-foot look this tick actually applied, for the deviation
  // model's |MouseLookX/Y| drain (footFire reads the accumulated pair).
  const local = step.players[LOCAL_PLAYER] ?? null;
  vehicleHits.readGate(local?.gate);
  combatFrame = local?.combat ?? null;
  combatFrameWorld = level.world;
  if (local?.look) soldierKit.addFootLook(local.look);
  return step;
}

/** The world's presentation: hull bodies, damage, effects, their sound, the
 *  level's own per-frame visuals and the page's audio. */
function presentWorld(step, dt) {
  // After the drive model has moved the player's vehicle and before the damage
  // pass, so a ram's hit points and its smoke tier land on the same frame.
  // The world's tick ran the bodies immediately before its own damage pass,
  // in the same frame as the old code; this half only draws the results.
  hullBodies.stepVehicleBodies(step);
  // ... and beside them, the hulls the body world does not carry: a ship that
  // has taken critical damage is going down, and its deck spawns go with it.
  hullBodies.stepSinkingHulls(step);
  // After `advance`, so a round that landed this frame is already accounted for
  // when the tier is picked. Unconditional for the same reason `advance` is: a
  // tank set alight before the player climbed out keeps burning down to nothing
  // whatever the camera is doing.
  vehicleHits.stepVehicleDamage(step, dt);
  // After `advance`, not before: a manned gun's `Ammo/PrimaryAmmo` etc. must
  // reflect whatever `advance` just fired this frame, the same way the
  // on-foot `updateSoldierHud()` below already does for `hw.rounds`. `manned()`
  // itself no longer calls this (see its own comment) — every occupied seat,
  // driven or manned, gets one authoritative feed here regardless of which
  // branch above ran this frame.
  //
  // Cost (rule 5, features/mesh-viewer-performance/README.md): this also now
  // runs every frame while piloting/driving, where before only a seat switch
  // or entry fed the vehicle group at all. `feedVehicleHud()` is a fixed
  // handful of property reads and `hud.vars` writes -- no scene traversal,
  // and no allocation beyond one throwaway `[]` on the non-manned branch --
  // so the added calls just rewrite the same `Vehicle/*` values every tick
  // until a future track wires live vehicle damage; the painter's own rule 7
  // still gates the actual repaint on whether any of it changed.
  if (localPlayer.occupancy) vehicleHud.feedVehicleHud();
  effects.firstPerson = guns.firstPerson;
  effects.advance(dt);
  // The ear is the camera's, the same listener every other voice on the page
  // hangs off, so an impact is placed against the head the player is looking
  // out of in every camera mode.
  if (effectAudio.listener) {
    effectAudio.setMaster(pageAudio.masterVolume());
    effectAudio.update(dt, camera.getWorldPosition(_effectEar));
  }
  level.applyVisibility();
  level.updateTextureFade();
  level.advanceSim(dt);
  pageAudio.updateAudio(dt);
  level.updateSky();
  // After the camera controls: a followed replay places the camera last.
  replayController?.update(dt);
}

/** The draw phase: the 3D frame, the viewmodel over it, and the 2D surfaces
 *  drawn beside the HUD (the deploy screen, the scoreboard, the maps). */
function draw(dt) {
  renderer.render(scene, camera);
  soldierKit.renderViewmodel();
  deployScreen.deployAnimate(dt);
  if (scoreboard.scoreboardOpen()) scoreboard.paintScoreboard();
  mapSurfaces.bfmap.update(dt);
  mapSurfaces.drawMinimap();
  mapSurfaces.drawFullMap();
}

/** The HUD feed and paint, last, over everything. */
function paintHud(dt) {
  // Last, over everything: feed this frame's soldier-side variables, then
  // repaint only if paint() finds one of them (or the stage size) actually
  // changed since the call before (features/mesh-viewer-performance, rule 7).
  // FIXED (round-3 HUD-parity audit): this used to read `stageWidth ||
  // renderer.domElement...`, on the theory that `stageWidth`/`stageHeight`
  // are 0 under `__renderOnce`. Measured live under a real `?shots` Playwright
  // page (`viewport 1280x800`) and they are NOT 0 — `resize()` runs once,
  // synchronously, at load (`resize();` right after `addEventListener` wires
  // it up, `map.html` ~1689), before any frame ever ticks, and stamps
  // `stageWidth`/`stageHeight` with the page's own `stage.clientWidth/Height`
  // at that moment (1280x724 in that measurement — the nav bar's own row
  // costs the stage 76px of height) and never again once `__renderOnce`
  // starts forcing a *different* renderer size for the screenshot itself.
  // The `||` therefore always took the STALE pre-`__renderOnce` figure, so
  // the HUD painted for a stage 76px shorter than the 3D frame actually
  // rendered at — invisible in a live browser (`resize()` keeps the two in
  // lockstep there) but a real mismatch in every headless capture this
  // project's own recipe (BRIEFING2.md, `__renderOnce(1600,1000)` or any
  // other explicit size) produces, this track's own `Vehicle/VehicleIcon`
  // capture included: the sprite loaded and painted (confirmed directly —
  // `hud-canvas` alone reads alpha 255 over its own rect), just 76 CSS px
  // higher up the merged frame than a checker compositing the two canvases
  // 1:1 would look. `resize()` itself always keeps the renderer's own
  // backing store equal to `stageWidth/Height` (it is the one call site that
  // sets both, together, from the same `stage.client*` read) — so reading
  // the renderer directly, unconditionally, is exactly the on-screen figure
  // in ordinary play and, unlike the old fallback, also the correct one
  // under `__renderOnce`, which touches only the renderer's own size.
  const hudW = renderer.domElement.width / renderer.getPixelRatio();
  const hudH = renderer.domElement.height / renderer.getPixelRatio();
  // The seat dots ask about live occupancy every frame: a room player can
  // climb into (or out of) this vehicle at any moment, and the feed's own
  // signature memo makes the steady state a single string compare.
  vehicleHud.feedSeatDots();
  soldierHud.updateSoldierHud(dt);
  // Every frame, not just an on-foot one: a seat has a crosshair too, and it
  // is `crosshairAim` that decides whose.
  vehicleHud.updateCrosshair();
  hudFeed.gameHud.paint(hudW, hudH);
  comms.tick(dt);
  commsWatchLocalDeath();
  comms.paint(hudW, hudH);
  // After the render: the sun's screen position comes from the camera the
  // frame was just drawn with. A no-op on every vanilla level (see
  // `setupLensFlare`).
  level.paintLensFlare();
  pageConsole.paintGameConsole(hudW, hudH);
}
// One uncaught exception in a frame must not end the page. three's
// `setAnimationLoop` schedules the next animation frame only after its
// callback returns (`vendor/three.module.js`, `onAnimationFrame`: the loop
// call at 13516, `requestAnimationFrame` at 13518), so a throw here stops
// the loop for good -- the canvas keeps the last frame and nothing says why.
// That is the "it just freezes with no details" report: a rare throw in a
// bot, vehicle or effect path kills the whole render loop. Catch it, keep
// looping, and put the error on the card so a freeze has a reason.
let lastFrameAt = performance.now();
let frameErrorShown = false;
let frameErrorCount = 0;
let stallShown = false;
renderer.setAnimationLoop(() => {
  try {
    frame(Math.min(clock.getDelta(), 0.1));
    frameErrorCount = 0;
    if (frameErrorShown || stallShown) {
      // A throw (or a stall the loop recovered from) that stopped recurring:
      // take the card down rather than leave a stale error over a page that is
      // drawing again.
      frameErrorShown = false;
      stallShown = false;
      if (!contextLost) glLostEl.hidden = true;
    }
  } catch (error) {
    frameErrorCount++;
    // A one-off throw is a console detail, not a card: most frames that throw
    // once are fine on the next one. Three in a row is a frame path that is
    // genuinely broken, which is what the player needs to see.
    if (frameErrorCount === 1) console.error('map: frame threw', error);
    if (frameErrorCount >= 3 && !frameErrorShown && !contextLost) {
      frameErrorShown = true;
      showGraphicsCard('Render loop error',
        `The render loop keeps throwing and would otherwise have stopped: ${error?.message ?? error}. The page is still running; reload to recover.`);
    }
  } finally {
    // Stamped after the callback returns, so a single long frame is not read
    // as a dead loop by the watchdog below.
    lastFrameAt = performance.now();
  }
});
// The loop above cannot report a stall it is itself blocked inside, and a
// dead GPU can stop the animation loop without ever firing `webglcontextlost`.
// This timer is independent of rAF, so it still runs when the loop has
// stopped: after a few seconds with no completed frame, the page says so
// instead of sitting silently on a frozen picture. Hidden tabs are exempt
// (`requestAnimationFrame` is paused there, and `?shots` tooling renders in
// one), as is a context already reported lost.
const FRAME_STALL_MS = 4000;
setInterval(() => {
  // `?shots` tooling steps `frame()` through `__renderOnce` and never drives
  // the rAF loop, so a stalled `lastFrameAt` there is the harness working, not
  // a hung GPU.
  if (params.has('shots')) return;
  if (contextLost || document.hidden || !glLostEl.hidden) return;
  if (performance.now() - lastFrameAt < FRAME_STALL_MS) return;
  stallShown = true;
  showGraphicsCard('Page not drawing',
    'No frame has completed for several seconds. The GPU may be hung. Reload to recover.');
}, 1000);

    stepVehicleBodies`),
  from(() => level, `collider combatArea currentDir extras frozenCount groundHeight modeNote
    spawnersRoot surfaceFriction vehicleDamage vehicleSpawnActive warmups world`),
  from(() => localLook, `lookDelta mouseInput snapPresentation`),
  from(() => localPlayer, `applyDamageToPlayer frameInputLast holdDeploy parachuteLog soldier soldierArmor
    soldierDead supplyTarget switchSeat`),
  from(() => mapSurfaces, `bfmap controlPointSprites friendlyMapUnits friendlyVehicleNodes
    localMapTeam mapGate mapVehicleMarks MINIMAP_TEAM_TINT setMapGate`),
  from(() => pageAudio, `activeAreaAudios ambientAudio audioLimiter audioListener ensureWorldFire
    vehicleAudio worldFire`),
  from(() => pageInput, `aimHeld captured KBLOCK KBLOCK_KEYS kbLockState kbSession keys pressTrigger
    seatAltFire seatFire setAim setFly setSeatTriggers triggerHeld`),
  from(() => room, `roomClient roomJoined`),
  from(() => scoreboard, `paintScoreboard scoreboardOpen scoreboardPlayers scoreFromSpawn
    scoreLayout setScoreboard`),
  from(() => seatCamera, `CHASE_OPTION chaseRig mannedActive view`),
  from(() => seatPose, `seatIkChains seatSoldier updateSeatPoseVisibility`),
  from(() => soldierKit, `altFireDemolitions crosshairEl cycleKitWeapon detonatorTemplate
    explosivesTemplate handFireLoop handSlot handWeapon isZoomed itemsLocked kitLoadout kitWeaponSlots
    loadouts loadoutsLoad packAmmo packsLeft selectKitWeapon soldierTemplateFor thrownPackGroup
    viewmodelRigFor vmCamera vmRoot vmScene weaponBarUntil weaponTemplateFor`),
  from(() => soldierView, `canopySpan foot3pRel footView3p supplyField`),
  from(() => spawning, `cancelDeploy chooseKit chooseTeam deployKit deploySpawn deployTeamId
    deployUnchosen selectDeployFlag`),
  from(() => vehicleEntry, `collectEntryPoints enterVehicle entryPoints exitSeat exitVehicle
    nearEntry`),
  from(() => vehicleHits, `applyVehicleHit occupiedVehicleDamage soldierExposureFor splashPos

  from(() => vehicleHud, `crosshairAim`),
  from(() => wrecks, `damageVisuals loadFailures showDamageTier wreckState wreckVehicle`),
  {
    get botBodies() { return botBodies; }, get botRounds() { return botRounds; },
    get botUnits() { return botUnits; },
    get camera() { return camera; }, get comms() { return comms; }, get combatFrame() { return combatFrameNow(); },
    get effectAudio() { return effectAudio; }, get effects() { return effects; },
    get effectSoundsLoad() { return effectSoundsLoad; },
    get fireStateFor() { return fireStateFor; }, get frame() { return frame; },
    get guns() { return guns; },
    get LOCAL_PLAYER() { return LOCAL_PLAYER; }, get localPlayer() { return localPlayer; },
    get optOnFoot() { return optOnFoot; }, get params() { return params; },
    get referee() { return referee; }, get renderer() { return renderer; },
    get round() { return round; },
    get scene() { return scene; }, get spawnFlagSelect() { return spawnFlagSelect; },

));

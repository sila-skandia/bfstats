<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tank school · bfstats.io</title>
<!-- The tank school on its own (features/battle-schools, "The tank school's
     own page"), built the way dogfight.html is: no level loaded and no map
     to pick. Its first screen is MATCHUP: pick your tank and theirs and see
     where to aim, where you are exposed, the two guns, the drive and how
     steady each hull is. -->
<link rel="icon" href="./favicon.ico">
<link rel="stylesheet" href="./tokens.css">
<link rel="stylesheet" href="./map.css">
<link rel="stylesheet" href="./tank-school.css">
<style>
  body { display: block; background: var(--mm-bg); }
  .dsp-wait {
    position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 14px;
    color: var(--mm-ink-muted); font: 500 11px/1.4 var(--mm-font-mono); letter-spacing: 0.18em; text-transform: uppercase;
  }
  .dsp-wait img { width: 72px; height: 72px; object-fit: contain; filter: drop-shadow(0 4px 12px rgb(0 0 0 / 0.6)); animation: dsp-breathe 1.6s ease-in-out infinite alternate; }
  .dsp-wait[hidden] { display: none; }
  .dsp-wait b { color: var(--mm-ink); font: 600 13px/1.3 var(--mm-font-display); letter-spacing: 0.14em; }
  @keyframes dsp-breathe { from { transform: scale(0.96); opacity: 0.75; } to { transform: scale(1.02); opacity: 1; } }
</style>
</head>
<body>
<div class="dsp-wait" role="status"><img src="./bfstats-logo.webp" alt="" width="72" height="72"><b>Tank school</b><span>Loading the shells</span></div>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
<script type="module" src="./tank-school-page.js"></script>
</body>
</html>

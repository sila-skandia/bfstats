<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dogfight school · bfstats.io</title>
<!-- The dogfight school on its own (features/dogfight-school, "The school's
     own page"): the lessons, ring courses and recorded fights first, no level
     loaded and no map to pick. FLY IT puts you in a dogfight arena
     (`dogfight-arena.js`). -->
<link rel="icon" href="./favicon.ico">
<link rel="stylesheet" href="./tokens.css">
<link rel="stylesheet" href="./map.css">
<style>
  body { display: block; background: var(--mm-bg); }
  .dsp-wait {
    position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 14px;
    color: var(--mm-ink-muted); font: 500 11px/1.4 var(--mm-font-mono); letter-spacing: 0.18em; text-transform: uppercase;
  }
  .dsp-wait img { width: 72px; height: 72px; object-fit: contain; filter: drop-shadow(0 4px 12px rgb(0 0 0 / 0.6)); animation: dsp-breathe 1.6s ease-in-out infinite alternate; }
  .dsp-wait[hidden] { display: none; }
  .dsp-wait b { color: var(--mm-ink); font: 600 13px/1.3 var(--mm-font-display); letter-spacing: 0.14em; }
  @keyframes dsp-breathe { from { transform: scale(0.96); opacity: 0.75; } to { transform: scale(1.02); opacity: 1; } }
</style>
</head>
<body>
<div class="dsp-wait" role="status"><img src="./bfstats-logo.webp" alt="" width="72" height="72"><b>Dogfight school</b><span>Fuelling the planes</span></div>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
<script type="module" src="./dogfight-school-page.js"></script>
</body>
</html>

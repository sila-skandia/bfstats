<title id="t">PHY-34 blast acceleration clamp, before and after</title><desc id="d">Speed after one engine tick against blast acceleration, one and two blasts, walking-body.js at 4bc1f4603 and faa39811f.</desc>
<rect width="900" height="520" fill="#fcfcfb"/>
<text x="24" y="34" font-size="19" fill="#0b0b0b" text-anchor="start" font-weight="600">Speed a standing soldier leaves with after one blast tick (PHY-34)</text><text x="24" y="56" font-size="13" fill="#52514e" text-anchor="start" font-weight="400">SoldierBody.blast(a) pushed 45 degrees up-and-out, then one Soldier.step(1/30), from each commit; |v| afterwards.</text><text x="24" y="74" font-size="13" fill="#52514e" text-anchor="start" font-weight="400">After: the accumulator is held to 1000 m/s^2 (0x082536a1..c8), so one tick throws at most ~33 m/s, however many blasts land.</text><line x1="24" y1="103" x2="46" y2="103" stroke="#eb6834" stroke-width="2.5" stroke-linecap="round"/><text x="52" y="107" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="400">before (4bc1f4603), one blast</text><line x1="279.9" y1="103" x2="301.9" y2="103" stroke="#eb6834" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 5"/><text x="307.9" y="107" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="400">before (4bc1f4603), two blasts</text><line x1="542.9" y1="103" x2="564.9" y2="103" stroke="#2a78d6" stroke-width="2.5" stroke-linecap="round"/><text x="570.9" y="107" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="400">after (retail), one blast</text><line x1="24" y1="125" x2="46" y2="125" stroke="#2a78d6" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 5"/><text x="52" y="129" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="400">after (retail), two blasts</text><line x1="90" y1="440" x2="850" y2="440" stroke="#e6e5e1" stroke-width="1"/><text x="82" y="444" font-size="12" fill="#7a7974" text-anchor="end" font-weight="400">0</text><line x1="90" y1="398.57" x2="850" y2="398.57" stroke="#e6e5e1" stroke-width="1"/><text x="82" y="402.57" font-size="12" fill="#7a7974" text-anchor="end" font-weight="400">20</text><line x1="90" y1="357.14" x2="850" y2="357.14" stroke="#e6e5e1" stroke-width="1"/><text x="82" y="361.
# The map page and the front end a bare one hands over to (`play/`) are
# play.bfstats.io's. HAProxy routes that host here as well, so only the mesh
# host's requests for them are sent across: a link from when mesh.bfstats.io
# had a Maps tab still lands on its level. Local servers have no such rule.
map "$host$uri" $to_play_host {
    default 0;
    "~^mesh\.bfstats\.io/(?:map\.html|play(?:/.*)?)$" 1;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    if ($to_play_host) {
        return 301 https://play.bfstats.io$request_uri;
    }

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # .glb is not in Alpine's mime.types; three.js keys off the extension.

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    # Text only. A .glb is a container of already-compressed PNG textures and
    # packed binary, and the browse thumbnails are PNG — gzipping either burns
    # CPU on a single-node cluster to save almost nothing. models.json and the
    # per-model reports are the payloads here that actually compress, and the
    # recordings under /replays/ most of all: tens of MB of JSON lines.
    gzip_types text/plain text/css application/javascript application/json
               model/gltf+json image/svg+xml application/x-ndjson text/xml;

    # Extracted glTF and map scenes — content-addressed by filename from the
    # extractor, re-uploaded when rebuilt. Long edge TTL; short browser TTL so a
    # re-extract shows up without a hard refresh.
    location /models/ {
        add_header Cache-Control "public, max-age=300, s-maxage=86400" always;
        try_files $uri =404;
    }

    location /maps/ {
        add_header Cache-Control "public, max-age=300, s-maxage=86400" always;
        try_files $uri =404;
    }

    # The texture store every glb points at (features/mesh-asset-size): one
    # lossless WebP per distinct image, named by a hash of its pixels. A name
    # never gets new content, so browsers keep a texture for good and the next
    # level that uses it costs nothing. Alpine's mime.types has image/webp.
    location /textures/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Recordings published to share (features/gameplay-recordings): bf42plus
    # replay_*.ndjson and ev_*.xml server logs, uploaded with FileBrowser to
    # the assets PVC's mesh/replays/ and linked as
    # map.html?replay=replays/<file>. Read-only, no listing: a recording is
    # reached by the link that names it. Alpine's mime.types has no .ndjson,
    # and gzip keys off the type.
    location /replays/ {
        types {
            application/x-ndjson ndjson;
            text/xml xml;
        }
        # Without `always`, on a 2xx or 3xx only: a 404 (a link opened before
        # its recording lands, or a name mistyped) carries no cache header,
        # so no browser keeps it once the file is there.
        add_header Cache-Control "public, max-age=300, s-maxage=86400";
        try_files $uri =404;
    }

    # Vendored three.js is large and never changes between image builds.
    location /vendor/ {
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # Static mod icons baked into the image.
    location /icons/ {
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # The viewer pages and the shared chrome they all link. Baked into
    # the image, so a deploy must be able to replace them without waiting on a
    # browser cache — a stale shell.css against a fresh page is a broken nav.
    #
    # The browser revalidates every one of these on every load (`no-cache`: a
    # 304 when it has not changed). `stale-while-revalidate` belongs to the
    # edge alone (`CDN-Cache-Control`, which Cloudflare reads and browsers do
    # not): in `Cache-Control` a browser takes it too, and on the first load
    # after a deploy runs the module it cached a day ago against the fresh
    # page (2026-09-27: `overlay.note is not a function`, a progress.js from
    # before the note against a map.html that calls it). A deploy purges the
    # edge (Jenkinsfile), so its own stale window never outlives one.
    location ~ ^/(?:index|map|poses|kits)\.html$ {
        add_header Cache-Control "no-cache" always;
        add_header CDN-Cache-Control "max-age=60, stale-while-revalidate=86400" always;
    }

    # mods.js draws into the nav markup and shell.css styles it, so a stale
    # copy of either against a fresh page is a broken bar.
    location ~ ^/(?:shell\.css|tokens\.css|mods\.js|progress\.js)$ {
        add_header Cache-Control "no-cache" always;
        add_header CDN-Cache-Control "max-age=60, stale-while-revalidate=86400" always;
    }

    # map.html, index.html, kits.html and poses.html are wiring over their own
    # modules (features/vehicle-instance-refactor): their stylesheets and every
    # module they build hand each other their interfaces, so a stale one against
    # a fresh page is a page that does not start. Same rule as the chrome above.
    location ~ ^/(?:[a-z0-9-]+\.js|(?:map|index|kits|poses)\.css)$ {
        add_header Cache-Control "no-cache" always;
        add_header CDN-Cache-Control "max-age=60, stale-while-revalidate=86400" always;
    }

    # The front end (`play/index.html`, where a bare map.html sends you) and
    # its modules: the same wiring, so the same rule.
    location ~ ^/play/(?:[a-z0-9-]+\.(?:js|html))?$ {
        add_header Cache-Control "no-cache" always;
        add_header CDN-Cache-Control "max-age=60, stale-while-revalidate=86400" always;
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # .glb is not in Alpine's mime.types; three.js keys off the extension.

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    # Text only. A .glb is a container of already-compressed PNG textures and
    # packed binary, and the browse thumbnails are PNG — gzipping either burns
    # CPU on a single-node cluster to save almost nothing. models.json and the
    # per-model reports are the payloads here that actually compress.
    gzip_types text/plain text/css application/javascript application/json
               model/gltf+json image/svg+xml;

    # Extracted glTF and map scenes — content-addressed by filename from the
    # extractor, re-uploaded when rebuilt. Long edge TTL; short browser TTL so a
    # re-extract shows up without a hard refresh.
    location /models/ {
        add_header Cache-Control "public, max-age=300, s-maxage=86400" always;
        try_files $uri =404;
    }

    location /maps/ {
        add_header Cache-Control "public, max-age=300, s-maxage=86400" always;
        try_files $uri =404;
    }

    # Vendored three.js is large and never changes between image builds.
    location /vendor/ {
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # Static mod icons baked into the image.
    location /icons/ {
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # The viewer pages and the shared chrome they all link. Baked into
    # the image, so a deploy must be able to replace them without waiting on a
    # browser cache — a stale shell.css against a fresh page is a broken nav.
    location ~ ^/(?:index|map|poses|kits)\.html$ {
        add_header Cache-Control "public, max-age=0, s-maxage=60, stale-while-revalidate=86400" always;
    }

    # mods.js draws into the nav markup and shell.css styles it, so a stale
    # copy of either against a fresh page is a broken bar.
    location ~ ^/(?:shell\.css|tokens\.css|mods\.js|progress\.js)$ {
        add_header Cache-Control "public, max-age=0, s-maxage=60, stale-while-revalidate=86400" always;
    }

    # map.html, index.html, kits.html and poses.html are wiring over their own
    # modules (features/vehicle-instance-refactor): their stylesheets and every
    # module they build hand each other their interfaces, so a stale one against
    # a fresh page is a page that does not start. Same rule as the chrome above.
    location ~ ^/(?:[a-z0-9-]+\.js|(?:map|index|kits|poses)\.css)$ {
        add_header Cache-Control "public, max-age=0, s-maxage=60, stale-while-revalidate=86400" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

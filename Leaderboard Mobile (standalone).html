document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"9c18ab6e-33ca-4164-93c6-d54e9bdc639e\"><\u002Fscript>\n<\u002Fhead>\n<body>\n\n<x-dc>\n<helmet>\n  <style>/* ============================================================================\n * Fonts — bfstats \"Neutral Depth\"\n * Display / UI:  Geist Variable        (variable weight 100–900)\n * Mono / data:   Geist Mono Variable   (variable weight 100–900)\n *\n * The product loads these via @fontsource-variable/geist as the families\n * 'Geist Variable' / 'Geist Mono Variable'. We declare the identical family\n * names here and source the variable woff2 binaries from the fontsource CDN,\n * so the first entry in each token's font stack resolves to the real font.\n * ========================================================================== */\n\n@font-face {\n  font-family: 'Geist Variable';\n  font-style: normal;\n  font-display: swap;\n  font-weight: 100 900;\n  src: url(\"6e1faf11-65b9-47fa-80b7-8fc1e540164a\") format('woff2-variations');\n}\n\n@font-face {\n  font-family: 'Geist Mono Variable';\n  font-style: normal;\n  font-display: swap;\n  font-weight: 100 900;\n  src: url(\"1b8de773-486d-4d0c-9875-e3dc3e4a21ca\") format('woff2-variations');\n}\n<\u002Fstyle>\n  <style>/* ============================================================================\n * Colors — bfstats \"Neutral Depth\" (v4 / .mm)\n *\n * Dark, ink-on-surface. Surface is a soft #131313 grey, never pure black.\n * Hierarchy is carried by INK WEIGHT + WHITESPACE, not borders or shadows.\n * A single muted-olive accent is the only chromatic brand colour; red is\n * reserved for kills / danger. Numeric tints (K/D bands, load bands, team\n * colours) are semantic — never decorative.\n *\n * Source of truth: ui/src/styles/modern-minimal.css in sila-skandia/bfstats.\n * Tokens live on :root so var(--mm-*) resolves anywhere; components are\n * scoped under `.mm`.\n * ========================================================================== */\n\n:root {\n  /* ---- surfaces (dark, layered greys) ---- */\n  --mm-bg: #131313;          /* page surface */\n  --mm-bg-soft: #1a1a1a;     /* hover rows, raised strips */\n  --mm-bg-mute: #222222;     /* skeleton / bar track */\n  --mm-rule: #2d2d2d;        /* hairline (default) */\n  --mm-rule-strong: #3d3d3d; /* hairline (emphasis / chip border) */\n\n  /* ---- ink (text weights) ---- */\n  --mm-ink: #ffffff;         /* primary ink */\n  --mm-ink-soft: #c8c8c8;    /* secondary text */\n  --mm-ink-muted: #8a8a8a;   /* meta / labels / captions */\n  --mm-ink-faint: #555555;   /* disabled / faint separators */\n\n  /* ---- brand accent (muted olive) ---- */\n  --mm-accent: #7d8849;        /* primary brand / active */\n  --mm-accent-soft: #9aa666;   /* hover / soft accent */\n  --mm-highlight: #847d4c;     /* anchor strips: table head, section bar, CTA */\n  --mm-highlight-ink: #000000; /* text on anchor strips */\n\n  /* ---- semantic status ---- */\n  --mm-success: #7da34c;     /* wins / online / Allied side */\n  --mm-success-bg: #2b3a1a;  /* dark success surface (win chip) */\n  --mm-danger: #d65a5a;      /* loss / danger / admin */\n\n  /* ---- numeric tints (data, not decoration) ---- */\n  --mm-kill: #d65a5a;        /* kills */\n  --mm-kill-soft: #8a3838;   /* low-emphasis kills */\n  --mm-death: #8a8a8a;       /* deaths stay muted */\n  --mm-score: #ffffff;       /* score reads as ink */\n  --mm-streak: #d65a5a;      /* streaks pop kill-red */\n  --mm-load-busy: #c5a23a;   /* server >= 66% full */\n  --mm-load-full: #d65a5a;   /* server at capacity */\n  --mm-load-idle: #555555;   /* empty server */\n\n  /* ---- K/D bands — five steps; good play trends toward olive ---- */\n  --mm-kd-poor:  #6a6a6a;    /* < 0.5  dim grey */\n  --mm-kd-low:   #8a8a6a;    /* 0.5–1  desaturated khaki */\n  --mm-kd-mid:   #ffffff;    /* 1–2    neutral ink (default) */\n  --mm-kd-good:  #7d8849;    /* 2–3    olive accent */\n  --mm-kd-elite: #b4c060;    /* 3+     lifted olive (elite glow) */\n\n  /* ---- podium / bronze ---- */\n  --mm-bronze: #c08a4c;\n\n  /* ----------------------------------------------------------------------\n   * Semantic aliases — friendlier names mapping onto the raw tokens above.\n   * Prefer these in new code where a role is clearer than a raw colour.\n   * -------------------------------------------------------------------- */\n  --surface-page:    var(--mm-bg);\n  --surface-raised:  var(--mm-bg-soft);\n  --surface-sunken:  var(--mm-bg-mute);\n  --border-hairline: var(--mm-rule);\n  --border-strong:   var(--mm-rule-strong);\n  --text-strong:     var(--mm-ink);\n  --text-body:       var(--mm-ink-soft);\n  --text-muted:      var(--mm-ink-muted);\n  --text-faint:      var(--mm-ink-faint);\n  --brand-accent:    var(--mm-accent);\n  --anchor-bg:       var(--mm-highlight);\n  --anchor-ink:      var(--mm-highlight-ink);\n}\n<\u002Fstyle>\n  <style>/* ============================================================================\n * Typography tokens — bfstats \"Neutral Depth\"\n *\n * Two families do all the work:\n *   • Geist (display/sans) — headings, body, names. Light weights (300/400)\n *     at large sizes give the editorial, archival feel.\n *   • Geist Mono — every NUMBER, label, eyebrow, timestamp, chip and meta\n *     string. Mono carries the \"data terminal\" voice; uppercase + wide\n *     tracking is the house signature for labels.\n *\n * Numbers always use tabular figures (font-variant-numeric: tabular-nums)\n * so columns of stats stay aligned.\n * ========================================================================== */\n\n:root {\n  --mm-font-display: 'Geist Variable', 'Geist', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;\n  --mm-font-mono: 'Geist Mono Variable', 'Geist Mono', 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;\n\n  /* friendly aliases */\n  --font-display: var(--mm-font-display);\n  --font-mono: var(--mm-font-mono);\n\n  /* fluid type scale used across the system */\n  --mm-text-display: clamp(40px, 5.5vw, 64px); /* hero numerals / .mm-display */\n  --mm-text-h2: clamp(22px, 2.5vw, 30px);      /* section headings */\n  --mm-text-stat: clamp(28px, 3vw, 40px);      /* big stat values */\n  --mm-text-rank: clamp(28px, 3vw, 38px);      /* headline rank */\n  --mm-text-body: 14px;                        /* table / list body */\n  --mm-text-meta: 10.5px;                      /* mono meta rows */\n  --mm-text-eyebrow: 10px;                      /* tiny mono eyebrow */\n\n  /* the house tracking values for mono labels */\n  --mm-track-eyebrow: 0.14em;\n  --mm-track-label: 0.08em;\n  --mm-track-wide: 0.18em;\n}\n<\u002Fstyle>\n  <style>/* ============================================================================\n * Spacing, radius & layout tokens — bfstats \"Neutral Depth\"\n *\n * The aesthetic is whitespace + 1px hairlines, NOT cards-with-shadow.\n * Corner radii are deliberately tiny (2px) — this is a militaria/terminal\n * look, not a soft consumer app. There is no elevation/shadow system; depth\n * comes from surface greys and rules.\n * ========================================================================== */\n\n:root {\n  /* corner radii — small and square. 2px is the house default. */\n  --mm-radius-xs: 1px;   /* eyebrow leading bar */\n  --mm-radius-sm: 2px;   /* chips, buttons, panels, table corners */\n  --mm-radius-bar: 2px;  /* load bars */\n  --mm-radius-pill: 999px; /* search field, avatar, badges */\n\n  /* spacing scale (px) */\n  --mm-space-1: 4px;\n  --mm-space-2: 8px;\n  --mm-space-3: 12px;\n  --mm-space-4: 16px;\n  --mm-space-5: 24px;\n  --mm-space-6: 32px;\n  --mm-space-7: 48px;\n\n  /* layout */\n  --mm-container: 1280px;       /* max content width */\n  --mm-gutter: 32px;            /* desktop container padding */\n  --mm-gutter-mobile: 18px;     /* mobile container padding */\n  --mm-topbar-pad-y: 16px;\n  --mm-section-pad-y: 32px;\n\n  /* hairline weight */\n  --mm-hairline: 1px;\n\n  /* the one allowed \"glow\" — olive ring on the signed-in avatar */\n  --mm-glow-accent: 0 0 10px rgba(125, 136, 73, 0.28);\n}\n<\u002Fstyle>\n  <style>/* ============================================================================\n * Base — the `.mm` container.\n *\n * Modern-minimal is scoped to descendants of `.mm` so it can co-exist with\n * legacy chrome. Wrap any bfstats surface in <div class=\"mm\"> (or\n * <div class=\"mm mm-shell\">) and every component class below resolves.\n * Tokens are global (:root) so var(--mm-*) works even outside `.mm`.\n * ========================================================================== */\n\n.mm {\n  font-family: var(--mm-font-display);\n  background: var(--mm-bg);\n  color: var(--mm-ink);\n  font-feature-settings: 'ss01', 'cv11';\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n}\n\n.mm * { box-sizing: border-box; }\n\n.mm a {\n  color: inherit;\n  text-decoration: none;\n}\n.mm a:hover { color: var(--mm-accent); }\n<\u002Fstyle>\n  <style>/* ============================================================================\n * bfstats \"Neutral Depth\" — component class library (.mm)\n *\n * Faithful port of ui/src/styles/modern-minimal.css from sila-skandia/bfstats.\n * Token declarations have been lifted out into /tokens/*.css; the rest is\n * verbatim so consuming surfaces match the live product 1:1.\n * ========================================================================== */\n\n/* ---------- typography ---------- */\n\n.mm-eyebrow {\n  font-family: var(--mm-font-mono);\n  font-size: 10px;\n  letter-spacing: 0.14em;\n  text-transform: uppercase;\n  color: var(--mm-ink-muted);\n  font-weight: 400;\n}\n\n.mm-eyebrow--strong {\n  display: inline-flex;\n  align-items: center;\n  gap: 8px;\n  font-size: 13px;\n  font-weight: 600;\n  letter-spacing: 0.08em;\n  color: var(--mm-ink);\n}\n\n.mm-eyebrow--strong::before {\n  content: '';\n  display: inline-block;\n  width: 3px;\n  height: 12px;\n  background: var(--mm-accent);\n  border-radius: 1px;\n}\n\n.mm-display {\n  font-family: var(--mm-font-display);\n  font-weight: 300;\n  font-size: clamp(40px, 5.5vw, 64px);\n  line-height: 1;\n  letter-spacing: -0.02em;\n  color: var(--mm-ink);\n  margin: 0;\n}\n\n.mm-display__muted {\n  color: var(--mm-ink-muted);\n  font-style: italic;\n  font-weight: 300;\n}\n\n.mm-h2 {\n  font-family: var(--mm-font-display);\n  font-weight: 400;\n  font-size: clamp(22px, 2.5vw, 30px);\n  line-height: 1.15;\n  letter-spacing: -0.01em;\n  margin: 0;\n}\n\n.mm-stat__value {\n  font-family: var(--mm-font-display);\n  font-weight: 300;\n  font-size: clamp(28px, 3vw, 40px);\n  line-height: 1;\n  letter-spacing: -0.01em;\n  color: var(--mm-ink);\n}\n\n.mm-stat__value--small { font-size: clamp(22px, 2.4vw, 30px); }\n\n.mm-stat__suffix {\n  font-family: var(--mm-font-mono);\n  font-size: 11px;\n  color: var(--mm-ink-muted);\n  margin-left: 4px;\n  vertical-align: 6px;\n}\n\n.mm-stat__delta {\n  font-family: var(--mm-font-mono);\n  font-size: 10.5px;\n  color: var(--mm-ink-muted);\n  letter-spacing: 0.04em;\n  text-transform: uppercase;\n  margin-top: 6px;\n}\n\n.mm-stat__delta--up { color: var(--mm-success); }\n.mm-stat__delta--down { color: var(--mm-danger); }\n\n/* ---------- hairlines ---------- */\n\n.mm-rule {\n  height: 1px;\n  background: var(--mm-rule);\n  border: 0;\n  margin: 0;\n}\n\n.mm-rule--strong { background: var(--mm-ink); }\n\n/* ---------- shell ---------- */\n\n.mm-shell {\n  min-height: 100vh;\n  background: var(--mm-bg);\n  display: flex;\n  flex-direction: column;\n}\n\n.mm-topbar {\n  display: grid;\n  grid-template-columns: auto 1fr auto auto;\n  align-items: center;\n  gap: 24px;\n  padding: 16px 32px;\n  border-bottom: 1px solid var(--mm-rule);\n}\n\n.mm-brand {\n  display: flex;\n  align-items: center;\n  gap: 12px;\n  color: var(--mm-ink);\n}\n\n.mm-brand__sigil {\n  width: 36px;\n  height: 36px;\n  display: block;\n  object-fit: contain;\n  flex-shrink: 0;\n}\n\n.mm-brand__mark {\n  display: flex;\n  flex-direction: column;\n  line-height: 1;\n}\n\n.mm-brand__name {\n  font-family: var(--mm-font-display);\n  font-size: 14px;\n  font-weight: 500;\n  letter-spacing: -0.005em;\n  color: var(--mm-ink);\n}\n\n.mm-brand__sub {\n  font-family: var(--mm-font-mono);\n  font-size: 9px;\n  letter-spacing: 0.18em;\n  text-transform: uppercase;\n  color: var(--mm-ink-muted);\n  margin-top: 3px;\n}\n\n.mm-nav {\n  display: flex;\n  justify-content: center;\n  gap: 28px;\n}\n\n.mm-nav__link {\n  font-family: var(--mm-font-display);\n  font-size: 13px;\n  font-weight: 400;\n  color: var(--mm-ink-soft);\n  padding: 6px 0;\n  position: relative;\n}\n\n.mm-nav__link:hover { color: var(--mm-ink); }\n\n.mm-nav__link--active {\n  color: var(--mm-ink);\n  font-weight: 500;\n}\n\n.mm-nav__link--active::after {\n  content: '';\n  position: absolute;\n  left: 0; right: 0; bottom: -2px;\n  height: 1px;\n  background: var(--mm-ink);\n}\n\n.mm-nav__link--admin {\n  color: var(--mm-danger);\n  display: inline-flex;\n  align-items: center;\n  gap: 6px;\n}\n.mm-nav__link--admin::before {\n  content: '';\n  width: 5px;\n  height: 5px;\n  border-radius: 50%;\n  background: var(--mm-danger);\n}\n.mm-nav__link--admin:hover { color: var(--mm-danger); opacity: 0.8; }\n.mm-nav__link--admin.mm-nav__link--active { color: var(--mm-danger); }\n.mm-nav__link--admin.mm-nav__link--active::after { background: var(--mm-danger); }\n\n.mm-search {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  padding: 7px 12px;\n  background: transparent;\n  border: 1px solid var(--mm-rule);\n  border-radius: 999px;\n  min-width: 220px;\n  transition: border-color 0.15s ease;\n}\n\n.mm-search:focus-within { border-color: var(--mm-ink); }\n\n.mm-search__icon {\n  width: 12px; height: 12px;\n  color: var(--mm-ink-muted);\n}\n\n.mm-search__input {\n  border: 0;\n  outline: 0;\n  background: transparent;\n  flex: 1;\n  font-family: var(--mm-font-display);\n  font-size: 12.5px;\n  color: var(--mm-ink);\n  min-width: 0;\n}\n\n.mm-search__input::placeholder { color: var(--mm-ink-muted); }\n\n.mm-search__hint {\n  font-family: var(--mm-font-mono);\n  font-size: 10px;\n  letter-spacing: 0.05em;\n  color: var(--mm-ink-muted);\n  border: 1px solid var(--mm-rule);\n  border-radius: 4px;\n  padding: 1px 5px;\n}\n\n/* ---------- breadcrumb / clock strip ---------- */\n\n.mm-substrip {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  padding: 8px 32px;\n  border-bottom: 1px solid var(--mm-rule);\n  background: var(--mm-bg-soft);\n}\n\n.mm-crumbs {\n  display: flex;\n  align-items: center;\n  gap: 8px;\n  font-family: var(--mm-font-mono);\n  font-size: 10.5px;\n  letter-spacing: 0.06em;\n  color: var(--mm-ink-muted);\n}\n\n.mm-crumbs__sep { color: var(--mm-ink-faint); }\n.mm-crumbs__here { color: var(--mm-ink); }\n\n.mm-clock {\n  font-family: var(--mm-font-mono);\n  font-size: 10.5px;\n  letter-spacing: 0.08em;\n  color: var(--mm-ink-muted);\n  display: flex;\n  align-items: baseline;\n  gap: 6px;\n}\n\n.mm-clock__time { color: var(--mm-ink); }\n\n/* ---------- containers ---------- */\n\n.mm-container {\n  width: 100%;\n  max-width: 1280px;\n  margin: 0 auto;\n  padding: 0 32px;\n}\n\n.mm-section { padding: 32px 0; }\n.mm-section--tight { padding: 20px 0; }\n\n/* ---------- pills / chips ---------- */\n\n.mm-chip {\n  display: inline-flex;\n  align-items: center;\n  gap: 6px;\n  font-family: var(--mm-font-mono);\n  font-size: 9.5px;\n  letter-spacing: 0.14em;\n  text-transform: uppercase;\n  padding: 3px 8px;\n  border: 1px solid var(--mm-rule-strong);\n  background: transparent;\n  color: var(--mm-ink);\n  border-radius: 2px;\n}\n\n.mm-chip--filled {\n  background: var(--mm-ink);\n  color: var(--mm-bg);\n  border-color: var(--mm-ink);\n}\n\n.mm-chip--accent {\n  background: var(--mm-highlight);\n  border-color: var(--mm-highlight);\n  color: var(--mm-highlight-ink);\n}\n\n.mm-chip--live {\n  background: transparent;\n  border-color: var(--mm-rule-strong);\n  color: var(--mm-ink);\n}\n\n.mm-chip__dot {\n  width: 6px;\n  height: 6px;\n  border-radius: 50%;\n  background: var(--mm-success);\n  animation: mm-pulse 1.6s ease-in-out infinite;\n}\n\n.mm-chip--off .mm-chip__dot { background: var(--mm-ink-faint); animation: none; }\n\n.mm-chip--win {\n  background: var(--mm-success-bg);\n  border-color: var(--mm-success);\n  color: var(--mm-success);\n}\n\n.mm-chip--loss {\n  background: transparent;\n  border-color: var(--mm-kill);\n  color: var(--mm-kill);\n}\n\n@keyframes mm-pulse {\n  0%, 100% { opacity: 0.4; }\n  50% { opacity: 1; }\n}\n\n/* ---------- meta / status row ---------- */\n\n.mm-meta-row {\n  display: flex;\n  flex-wrap: wrap;\n  align-items: center;\n  gap: 10px;\n  font-family: var(--mm-font-mono);\n  font-size: 10.5px;\n  letter-spacing: 0.08em;\n  text-transform: uppercase;\n  color: var(--mm-ink-muted);\n}\n\n.mm-meta-row__sep { color: var(--mm-ink-faint); }\n.mm-meta-row__strong { color: var(--mm-ink); }\n\n/* ---------- stat strip ---------- */\n\n.mm-stats {\n  display: grid;\n  grid-template-columns: repeat(4, 1fr);\n  gap: 0;\n  border-top: 1px solid var(--mm-ink);\n  border-bottom: 1px solid var(--mm-rule);\n}\n\n.mm-stats__cell {\n  padding: 18px 24px 18px 0;\n  border-right: 1px solid var(--mm-rule);\n}\n.mm-stats__cell:last-child { border-right: 0; }\n.mm-stats__cell + .mm-stats__cell { padding-left: 24px; }\n\n.mm-stats__label {\n  font-family: var(--mm-font-mono);\n  font-size: 10px;\n  letter-spacing: 0.14em;\n  text-transform: uppercase;\n  color: var(--mm-ink-muted);\n  margin-bottom: 8px;\n}\n\n@media (max-width: 720px) {\n  .mm-stats { grid-template-columns: repeat(2, 1fr); }\n  .mm-stats__cell { border-bottom: 1px solid var(--mm-rule); }\n  .mm-stats__cell:nth-child(2n) { border-right: 0; }\n  .mm-stats__cell:nth-last-child(-n+2) { border-bottom: 0; }\n  .mm-stats__cell + .mm-stats__cell { padding-left: 0; }\n  .mm-stats__cell:nth-child(2n) { padding-left: 24px; }\n}\n\n/* ---------- tabs ---------- */\n\n.mm-tabs {\n  display: flex;\n  gap: 28px;\n  border-bottom: 1px solid var(--mm-rule);\n  overflow-x: auto;\n  scrollbar-width: none;\n}\n.mm-tabs::-webkit-scrollbar { display: none; }\n\n.mm-tab {\n  font-family: var(--mm-font-display);\n  font-size: 14px;\n  font-weight: 400;\n  color: var(--mm-ink-soft);\n  padding: 10px 0;\n  background: transparent;\n  border: 0;\n  cursor: pointer;\n  position: relative;\n  white-space: nowrap;\n}\n.mm-tab:hover { color: var(--mm-ink); }\n.mm-tab--active { color: var(--mm-ink); }\n\n.mm-tab--active::after {\n  content: '';\n  position: absolute;\n  left: 0; right: 0; bottom: -1px;\n  height: 2px;\n  background: var(--mm-accent);\n}\n\n.mm-tab__badge {\n  display: inline-block;\n  margin-left: 6px;\n  padding: 1px 6px;\n  border-radius: 8px;\n  background: var(--mm-bg-soft);\n  color: var(--mm-ink-soft);\n  font-family: var(--mm-font-mono);\n  font-size: 10px;\n  font-weight: 500;\n  letter-spacing: 0.04em;\n}\n.mm-tab--active .mm-tab__badge {\n  background: var(--mm-accent);\n  color: var(--mm-highlight-ink);\n}\n\n/* ---------- subtabs ---------- */\n\n.mm-subtabs {\n  display: inline-flex;\n  border: 1px solid var(--mm-rule-strong);\n  border-radius: 2px;\n  overflow: hidden;\n}\n\n.mm-subtab {\n  font-family: var(--mm-font-mono);\n  font-size: 10.5px;\n  letter-spacing: 0.08em;\n  text-transform: uppercase;\n  background: transparent;\n  border: 0;\n  padding: 6px 12px;\n  cursor: pointer;\n  color: var(--mm-ink-muted);\n  border-right: 1px solid var(--mm-rule-strong);\n}\n\n.mm-subtab:last-child { border-right: 0; }\n.mm-subtab:hover { color: var(--mm-ink); }\n\n.mm-subtab--active {\n  background: var(--mm-ink);\n  color: var(--mm-bg);\n}\n\n@media (max-width: 720px) {\n  .mm-subtabs { width: 100%; overflow-x: auto; }\n  .mm-subtab { flex: 1 0 auto; }\n}\n\n/* ---------- buttons ---------- */\n\n.mm-btn {\n  font-family: var(--mm-font-display);\n  font-size: 13px;\n  background: transparent;\n  border: 0;\n  color: var(--mm-ink-soft);\n  padding: 6px 4px;\n  cursor: pointer;\n  transition: color 0.15s ease;\n}\n.mm-btn:hover { color: var(--mm-ink); }\n.mm-btn--strong { color: var(--mm-ink); font-weight: 500; }\n.mm-btn--accent {\n  background: var(--mm-highlight);\n  color: var(--mm-highlight-ink);\n  padding: 6px 12px;\n}\n.mm-btn--accent:hover { background: var(--mm-accent); color: var(--mm-highlight-ink); }\n\n/* outlined utility button (e.g. landing \"Roster\", sign-in) */\n.mm-btn--outline {\n  border: 1px solid var(--mm-rule-strong);\n  border-radius: 2px;\n  padding: 6px 14px;\n  font-family: var(--mm-font-mono);\n  font-size: 10.5px;\n  letter-spacing: 0.1em;\n  text-transform: uppercase;\n  color: var(--mm-ink);\n  transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;\n}\n.mm-btn--outline:hover { background: var(--mm-accent); border-color: var(--mm-accent); color: var(--mm-highlight-ink); }\n.mm-btn--inline { font-family: var(--mm-font-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; }\n.mm-btn:disabled { color: var(--mm-ink-faint); cursor: not-allowed; }\n\n.mm-btn-row {\n  display: flex;\n  align-items: center;\n  gap: 18px;\n}\n\n/* ---------- semantic numeric tints ---------- */\n\n.mm-num--kill   { color: var(--mm-kill); }\n.mm-num--death  { color: var(--mm-death); }\n.mm-num--score  { color: var(--mm-score); }\n.mm-num--streak { color: var(--mm-streak); }\n.mm-num--load-busy { color: var(--mm-load-busy); }\n.mm-num--load-full { color: var(--mm-load-full); }\n.mm-num--load-idle { color: var(--mm-load-idle); }\n\n.mm-kd--poor   { color: var(--mm-kd-poor); }\n.mm-kd--low    { color: var(--mm-kd-low); }\n.mm-kd--mid    { color: var(--mm-kd-mid); }\n.mm-kd--good   { color: var(--mm-kd-good); }\n.mm-kd--elite  { color: var(--mm-kd-elite); font-weight: 500; }\n\n.mm-num__sep { color: var(--mm-ink-faint); margin: 0 2px; }\n\n.mm-stat__value.mm-num--kill,\n.mm-stat__value.mm-num--streak { font-weight: 400; }\n\n/* ---------- list table ---------- */\n\n.mm-list {\n  width: 100%;\n  border-collapse: collapse;\n}\n\n.mm-list thead th {\n  font-family: var(--mm-font-mono);\n  font-size: 11px;\n  letter-spacing: 0.12em;\n  text-transform: uppercase;\n  color: var(--mm-highlight-ink);\n  font-weight: 600;\n  text-align: left;\n  padding: 8px 14px;\n  background: var(--mm-highlight);\n  border-bottom: 1px solid var(--mm-highlight);\n}\n\n.mm-list thead th.is-num {\n  text-align: right;\n  font-variant-numeric: tabular-nums;\n}\n\n.mm-list thead th:first-child { border-top-left-radius: 2px; }\n.mm-list thead th:last-child { border-top-right-radius: 2px; }\n\n.mm-list tbody tr {\n  border-bottom: 1px solid var(--mm-rule);\n  transition: background-color 0.12s ease;\n  cursor: pointer;\n}\n\n.mm-list tbody tr:hover { background: var(--mm-bg-soft); }\n\n.mm-rank--gold { color: var(--mm-kd-elite); }\n.mm-rank--gold .mm-list__rank,\n.mm-rank--gold .mm-bestscores__rank { color: var(--mm-kd-elite); font-weight: 600; }\n.mm-rank--silver { color: var(--mm-ink); }\n.mm-rank--silver .mm-list__rank,\n.mm-rank--silver .mm-bestscores__rank { color: var(--mm-ink); font-weight: 500; }\n.mm-rank--bronze { color: #c08a4c; }\n.mm-rank--bronze .mm-list__rank,\n.mm-rank--bronze .mm-bestscores__rank { color: #c08a4c; font-weight: 500; }\n\n.mm-headline-rank {\n  font-family: var(--mm-font-display);\n  font-size: clamp(28px, 3vw, 38px);\n  font-weight: 500;\n  line-height: 1;\n  color: var(--mm-accent);\n  letter-spacing: -0.01em;\n  font-variant-numeric: tabular-nums;\n}\n\n.mm-headline-rank__hash {\n  font-size: 0.55em;\n  font-weight: 400;\n  color: var(--mm-accent-soft);\n  margin-right: 2px;\n  vertical-align: 0.15em;\n}\n\n.mm-headline-rank--podium { color: var(--mm-kd-elite); }\n\n.mm-list tbody td {\n  padding: 14px 16px;\n  font-family: var(--mm-font-display);\n  font-size: 13.5px;\n  color: var(--mm-ink);\n  vertical-align: middle;\n}\n\n.mm-list td.is-num {\n  text-align: right;\n  font-variant-numeric: tabular-nums;\n  font-family: var(--mm-font-mono);\n  font-size: 12.5px;\n}\n\n.mm-list td.is-muted { color: var(--mm-ink-muted); }\n\n.mm-list .mm-list__rank {\n  font-family: var(--mm-font-mono);\n  font-size: 11px;\n  color: var(--mm-ink-muted);\n  width: 32px;\n}\n\n.mm-list__name {\n  display: flex;\n  flex-direction: column;\n  gap: 2px;\n}\n\n.mm-list__name-primary {\n  font-size: 14px;\n  color: var(--mm-ink);\n}\n\n.mm-list__name-sub {\n  font-family: var(--mm-font-mono);\n  font-size: 10.5px;\n  letter-spacing: 0.06em;\n  color: var(--mm-ink-muted);\n  text-transform: uppercase;\n}\n\n.mm-list__bar {\n  height: 4px;\n  background: var(--mm-bg-mute);\n  position: relative;\n  border-radius: 2px;\n  overflow: hidden;\n  min-width: 80px;\n}\n\n.mm-list__bar-fill {\n  position: absolute;\n  inset: 0 auto 0 0;\n  background: var(--mm-ink);\n}\n\n.mm-list__bar-fill--accent { background: var(--mm-accent); }\n.mm-list__bar-fill--idle { background: var(--mm-ink-faint); }\n\n@media (max-width: 720px) {\n  .mm-list:not(.mm-list--dense) thead { display: none; }\n  .mm-list:not(.mm-list--dense) tbody tr {\n    display: grid;\n    grid-template-columns: 1fr auto;\n    gap: 4px 16px;\n    padding: 14px 16px;\n  }\n  .mm-list:not(.mm-list--dense) tbody td { padding: 0; border: 0; font-size: 13px; }\n  .mm-list:not(.mm-list--dense) td[data-cell-label]::before {\n    content: attr(data-cell-label);\n    display: block;\n    font-family: var(--mm-font-mono);\n    font-size: 9.5px;\n    letter-spacing: 0.14em;\n    text-transform: uppercase;\n    color: var(--mm-ink-muted);\n    margin-bottom: 2px;\n  }\n  .mm-list:not(.mm-list--dense) td.mm-list__name-cell { grid-column: 1 / -1; }\n  .mm-list:not(.mm-list--dense) td.mm-list__name-cell::before { display: none; }\n\n  .mm-list--dense thead { display: none; }\n  .mm-list--dense tbody tr {\n    display: flex;\n    align-items: baseline;\n    gap: 10px;\n    padding: 10px 0;\n    border-bottom: 1px solid var(--mm-rule);\n    font-family: var(--mm-font-mono);\n    font-size: 12.5px;\n  }\n  .mm-list--dense tbody tr:last-child { border-bottom: 0; }\n  .mm-list--dense tbody td { padding: 0; border: 0; }\n  .mm-list--dense td[data-cell-label]::before { display: none; }\n  .mm-list--dense .mm-list__rank { flex: 0 0 22px; color: var(--mm-ink-muted); font-size: 11px; }\n  .mm-list--dense .mm-list__name-cell { flex: 1 1 auto; min-width: 0; overflow: hidden; }\n  .mm-list--dense .mm-list__name-primary {\n    font-family: var(--mm-font-display);\n    font-size: 14px;\n    font-weight: 500;\n    overflow: hidden;\n    text-overflow: ellipsis;\n    white-space: nowrap;\n    display: block;\n  }\n  .mm-list--dense .mm-list__name-sub {\n    font-size: 10.5px;\n    letter-spacing: 0.04em;\n    color: var(--mm-ink-muted);\n    overflow: hidden;\n    text-overflow: ellipsis;\n    white-space: nowrap;\n    display: block;\n  }\n  .mm-list--dense td.is-num { flex: 0 0 auto; text-align: right; min-width: 36px; }\n  .mm-list--dense .mm-list__col--hide-sm { display: none; }\n  .mm-list--dense .mm-rank-cell__bar { display: none; }\n}\n\n/* ---------- empty / loading ---------- */\n\n.mm-skeleton {\n  background: var(--mm-bg-mute);\n  border-radius: 2px;\n  height: 14px;\n  animation: mm-shimmer 1.4s ease-in-out infinite;\n}\n.mm-skeleton--lg { height: 36px; }\n\n@keyframes mm-shimmer {\n  0%, 100% { opacity: 0.55; }\n  50% { opacity: 0.85; }\n}\n\n.mm-empty {\n  padding: 48px 16px;\n  text-align: center;\n  font-family: var(--mm-font-mono);\n  font-size: 12px;\n  letter-spacing: 0.06em;\n  color: var(--mm-ink-muted);\n  text-transform: uppercase;\n}\n\n/* ---------- overview rows / cards ---------- */\n\n.mm-overview__row {\n  display: grid;\n  gap: 32px 48px;\n  padding: 28px 0;\n  border-bottom: 1px solid var(--mm-rule);\n}\n.mm-overview__row:last-child { border-bottom: 0; }\n.mm-overview__row--split { grid-template-columns: 1.4fr 1fr; }\n.mm-overview__row--triple { grid-template-columns: repeat(3, 1fr); }\n\n@media (max-width: 880px) {\n  .mm-overview__row--split,\n  .mm-overview__row--triple { grid-template-columns: 1fr; }\n  .mm-overview__row { padding: 22px 0; gap: 22px; }\n}\n\n.mm-card { display: flex; flex-direction: column; gap: 4px; }\n\n.mm-card__hint {\n  font-family: var(--mm-font-mono);\n  font-size: 9.5px;\n  letter-spacing: 0.06em;\n  text-transform: uppercase;\n  color: var(--mm-ink-faint);\n}\n\n.mm-card__empty {\n  margin-top: 16px;\n  padding: 18px 0;\n  border-top: 1px dashed var(--mm-rule);\n  font-family: var(--mm-font-mono);\n  font-size: 10.5px;\n  letter-spacing: 0.06em;\n  text-transform: uppercase;\n  color: var(--mm-ink-muted);\n}\n\n.mm-card__foot {\n  margin-top: 12px;\n  font-family: var(--mm-font-mono);\n  font-size: 10.5px;\n  letter-spacing: 0.04em;\n  color: var(--mm-ink-muted);\n}\n\n/* ---------- timeline ---------- */\n\n.mm-timeline { list-style: none; margin: 0; padding: 0; position: relative; }\n\n.mm-timeline::before {\n  content: '';\n  position: absolute;\n  left: 5px;\n  top: 6px;\n  bottom: 6px;\n  width: 1px;\n  background: var(--mm-rule);\n}\n\n.mm-timeline li {\n  display: grid;\n  grid-template-columns: 24px 1fr;\n  gap: 6px 12px;\n  padding: 8px 0;\n  position: relative;\n}\n\n.mm-timeline__dot {\n  width: 11px;\n  height: 11px;\n  border-radius: 50%;\n  background: var(--mm-bg);\n  border: 1.5px solid var(--mm-ink);\n  margin-top: 4px;\n  position: relative;\n  z-index: 1;\n}\n\n.mm-timeline__primary {\n  font-family: var(--mm-font-display);\n  font-size: 14px;\n  color: var(--mm-ink);\n  font-weight: 400;\n}\n\n.mm-timeline__sub {\n  font-family: var(--mm-font-mono);\n  font-size: 10.5px;\n  letter-spacing: 0.04em;\n  color: var(--mm-ink-muted);\n  margin-top: 2px;\n}\n\n/* ---------- best-scores blocks ---------- */\n\n.mm-bestscores { display: grid; gap: 16px; }\n.mm-bestscores__list { list-style: none; margin: 0; padding: 0; }\n\n.mm-bestscores__list li {\n  display: grid;\n  grid-template-columns: 18px 64px 1fr;\n  align-items: baseline;\n  gap: 10px;\n  padding: 6px 0;\n  border-top: 1px solid var(--mm-rule);\n}\n.mm-bestscores__list li:first-child { border-top: 0; }\n\n.mm-bestscores__rank { font-family: var(--mm-font-mono); font-size: 10px; color: var(--mm-ink-muted); }\n\n.mm-bestscores__score {\n  font-family: var(--mm-font-display);\n  font-size: 18px;\n  font-weight: 400;\n  color: var(--mm-ink);\n  text-align: right;\n  font-variant-numeric: tabular-nums;\n}\n\n.mm-bestscores__detail {\n  font-family: var(--mm-font-mono);\n  font-size: 10.5px;\n  letter-spacing: 0.04em;\n  color: var(--mm-ink-muted);\n  white-space: nowrap;\n  overflow: hidden;\n  text-overflow: ellipsis;\n}\n\n.mm-bestscores__empty {\n  font-family: var(--mm-font-mono);\n  font-size: 10.5px;\n  letter-spacing: 0.04em;\n  color: var(--mm-ink-faint);\n  padding: 4px 0;\n}\n\n/* ---------- nav progress bar ---------- */\n\n.mm-nav-progress {\n  position: fixed;\n  top: 0;\n  left: 0;\n  width: 0;\n  height: 2px;\n  background: var(--mm-accent);\n  z-index: 9999;\n  opacity: 0;\n  transition: opacity 0.15s ease;\n  pointer-events: none;\n}\n\n.mm-nav-progress--active {\n  opacity: 1;\n  animation: mm-progress-run 1.8s ease-in-out infinite;\n}\n\n@keyframes mm-progress-run {\n  0%   { width: 0;    opacity: 1; }\n  60%  { width: 75%;  opacity: 1; }\n  100% { width: 92%;  opacity: 1; }\n}\n\n/* ---------- footer strip ---------- */\n\n.mm-foot {\n  margin-top: auto;\n  border-top: 1px solid var(--mm-rule);\n  padding: 18px 32px;\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  gap: 16px;\n  font-family: var(--mm-font-mono);\n  font-size: 10px;\n  letter-spacing: 0.14em;\n  text-transform: uppercase;\n  color: var(--mm-ink-muted);\n}\n\n.mm-foot a { color: var(--mm-ink-muted); }\n.mm-foot a:hover { color: var(--mm-accent); }\n\n/* ---------- responsive nav collapse ---------- */\n\n@media (max-width: 880px) {\n  .mm-topbar { grid-template-columns: 1fr auto auto; padding: 14px 18px; gap: 14px; }\n  .mm-nav {\n    grid-column: 1 / -1;\n    order: 3;\n    justify-content: flex-start;\n    gap: 18px;\n    overflow-x: auto;\n    scrollbar-width: none;\n    margin-top: 4px;\n  }\n  .mm-nav::-webkit-scrollbar { display: none; }\n  .mm-search { min-width: 0; }\n  .mm-substrip { padding: 8px 18px; }\n  .mm-container { padding: 0 18px; }\n  .mm-foot { padding: 16px 18px; flex-direction: column; align-items: flex-start; }\n}\n\n@media (max-width: 640px) {\n  .mm-topbar .mm-search { display: none; }\n}\n\n/* ---------- viewport visibility utilities ---------- */\n@media (max-width: 720px) {\n  .mm-only-desktop { display: none !important; }\n}\n@media (min-width: 721px) {\n  .mm-only-mobile { display: none !important; }\n}\n\n/* ---------- mobile patterns ---------- */\n\n.mm-section-bar {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 16px;\n  margin: 24px 0 0;\n  padding: 10px 14px;\n  background: var(--mm-highlight);\n  color: var(--mm-highlight-ink);\n  font-family: var(--mm-font-mono);\n  font-size: 11px;\n  letter-spacing: 0.12em;\n  text-transform: uppercase;\n  font-weight: 600;\n}\n\n.mm-section-bar__meta { color: var(--mm-highlight-ink); opacity: 0.7; letter-spacing: 0.1em; }\n\n.mm-cta-strip {\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n  width: 100%;\n  margin: 16px 0 8px;\n  padding: 14px 18px;\n  background: var(--mm-highlight);\n  border: 0;\n  border-radius: 2px;\n  font-family: var(--mm-font-display);\n  font-weight: 600;\n  font-size: 15px;\n  color: var(--mm-highlight-ink);\n  cursor: pointer;\n  text-decoration: none;\n}\n.mm-cta-strip:hover { background: var(--mm-accent); }\n\n.mm-card-list {\n  list-style: none;\n  margin: 0;\n  padding: 0;\n  display: flex;\n  flex-direction: column;\n}\n\n.mm-card-list__item { padding: 16px 0; border-bottom: 1px solid var(--mm-rule); }\n.mm-card-list__item:last-child { border-bottom: 0; }\n\n.mm-card-list__head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }\n\n.mm-card-list__title {\n  font-family: var(--mm-font-display);\n  font-size: 17px;\n  font-weight: 500;\n  color: var(--mm-ink);\n}\n\n.mm-card-list__time {\n  font-family: var(--mm-font-mono);\n  font-size: 12px;\n  color: var(--mm-ink-muted);\n  letter-spacing: 0.04em;\n  flex-shrink: 0;\n}\n\n.mm-card-list__sub {\n  margin-top: 4px;\n  font-family: var(--mm-font-mono);\n  font-size: 11px;\n  letter-spacing: 0.08em;\n  text-transform: uppercase;\n  color: var(--mm-ink-muted);\n  display: flex;\n  align-items: center;\n  gap: 8px;\n  flex-wrap: wrap;\n}\n\n.mm-card-list__rows { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }\n\n.mm-card-list__row {\n  display: grid;\n  grid-template-columns: 22px minmax(0, 1fr) 60px 50px;\n  gap: 10px;\n  align-items: baseline;\n  font-family: var(--mm-font-mono);\n  font-size: 12.5px;\n  color: var(--mm-ink-soft);\n}\n\n.mm-card-list__row--rust { color: var(--mm-accent); }\n.mm-card-list__row--ink { color: var(--mm-ink); }\n.mm-card-list__rank { color: var(--mm-ink-muted); }\n.mm-card-list__row-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n.mm-card-list__row-kd { text-align: right; color: var(--mm-kill); }\n.mm-card-list__row-score { text-align: right; color: var(--mm-ink); }\n\n/* Win / loss session row */\n.mm-session-row {\n  display: grid;\n  grid-template-columns: 60px 1fr auto;\n  grid-template-rows: auto auto;\n  gap: 4px 12px;\n  align-items: center;\n  padding: 14px 0;\n  border-bottom: 1px solid var(--mm-rule);\n  text-decoration: none;\n  color: var(--mm-ink);\n}\n.mm-session-row:last-child { border-bottom: 0; }\n\n.mm-session-row__chip {\n  grid-row: 1 / span 2;\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  padding: 4px 6px;\n  font-family: var(--mm-font-mono);\n  font-size: 10px;\n  letter-spacing: 0.1em;\n  text-transform: uppercase;\n  border: 1px solid var(--mm-rule);\n  border-radius: 2px;\n  align-self: start;\n}\n\n.mm-session-row--win .mm-session-row__chip {\n  background: var(--mm-success-bg);\n  color: var(--mm-success);\n  border-color: var(--mm-success);\n}\n.mm-session-row--loss .mm-session-row__chip {\n  background: rgba(168, 56, 56, 0.08);\n  color: var(--mm-kill);\n  border-color: var(--mm-kill);\n}\n\n.mm-session-row__map { font-family: var(--mm-font-display); font-size: 15px; font-weight: 500; color: var(--mm-ink); }\n.mm-session-row__date { font-family: var(--mm-font-mono); font-size: 11.5px; color: var(--mm-ink-muted); letter-spacing: 0.04em; text-align: right; }\n\n.mm-session-row__server {\n  grid-row: 2;\n  grid-column: 2;\n  font-family: var(--mm-font-mono);\n  font-size: 10.5px;\n  letter-spacing: 0.06em;\n  text-transform: uppercase;\n  color: var(--mm-ink-muted);\n}\n\n.mm-session-row__stats {\n  grid-row: 2;\n  grid-column: 3;\n  font-family: var(--mm-font-mono);\n  font-size: 11.5px;\n  color: var(--mm-ink);\n  text-align: right;\n  white-space: nowrap;\n}\n\n/* Achievement strip */\n.mm-ach-strip { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 4px; }\n\n.mm-ach-strip__more {\n  font-family: var(--mm-font-mono);\n  font-size: 11px;\n  letter-spacing: 0.08em;\n  text-transform: uppercase;\n  color: var(--mm-ink-soft);\n  text-decoration: underline;\n  text-underline-offset: 3px;\n}\n\n/* ---------- modal (MmBaseModal) ---------- */\n\n.mm-modal__backdrop {\n  position: fixed;\n  inset: 0;\n  background: rgba(0, 0, 0, 0.7);\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  padding: 24px;\n  z-index: 1000;\n}\n\n.mm-modal__panel {\n  background: var(--mm-bg);\n  border: 1px solid var(--mm-rule-strong);\n  border-radius: 2px;\n  width: 100%;\n  display: flex;\n  flex-direction: column;\n  overflow: hidden;\n  color: var(--mm-ink);\n}\n\n.mm-modal__panel--sm { max-width: 360px; }\n.mm-modal__panel--md { max-width: 520px; }\n.mm-modal__panel--lg { max-width: 720px; }\n.mm-modal__panel--xl { max-width: 960px; }\n\n.mm-modal__head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 20px 24px 16px; }\n.mm-modal__head-text { min-width: 0; display: flex; flex-direction: column; gap: 4px; }\n.mm-modal__title { margin: 0; }\n\n.mm-modal__close {\n  flex-shrink: 0;\n  background: transparent;\n  border: 1px solid var(--mm-rule);\n  border-radius: 999px;\n  width: 28px;\n  height: 28px;\n  display: grid;\n  place-items: center;\n  color: var(--mm-ink-muted);\n  cursor: pointer;\n  transition: color 0.15s ease, border-color 0.15s ease;\n}\n.mm-modal__close:hover { color: var(--mm-ink); border-color: var(--mm-ink); }\n\n.mm-modal__body { padding: 20px 24px; overflow-y: auto; }\n.mm-modal__body.is-flush { padding: 0; }\n.mm-modal__foot { padding: 16px 24px 20px; display: flex; align-items: center; justify-content: flex-end; gap: 18px; }\n<\u002Fstyle>\n  <style>/* ============================================================================\n * bfstats Design System — \"Neutral Depth\" (v4)\n * Single entry point. Consumers link THIS file only.\n *\n * Player & server tracking for Battlefield 1942. Dark, editorial, olive-\n * accented, hairlines over cards. Source of truth: sila-skandia/bfstats →\n * ui/src/styles/modern-minimal.css.\n *\n * Wrap any surface in <div class=\"mm\"> to pick up the component classes.\n * ========================================================================== */\n\n/* --- foundations --- */\n/* ============================================================================\n * Fonts — bfstats \"Neutral Depth\"\n * Display / UI:  Geist Variable        (variable weight 100–900)\n * Mono / data:   Geist Mono Variable   (variable weight 100–900)\n *\n * The product loads these via @fontsource-variable/geist as the families\n * 'Geist Variable' / 'Geist Mono Variable'. We declare the identical family\n * names here and source the variable woff2 binaries from the fontsource CDN,\n * so the first entry in each token's font stack resolves to the real font.\n * ========================================================================== */\n\n@font-face {\n  font-family: 'Geist Variable';\n  font-style: normal;\n  font-display: swap;\n  font-weight: 100 900;\n  src: url(\"6e1faf11-65b9-47fa-80b7-8fc1e540164a\") format('woff2-variations');\n}\n\n@font-face {\n  font-family: 'Geist Mono Variable';\n  font-style: normal;\n  font-display: swap;\n  font-weight: 100 900;\n  src: url(\"1b8de773-486d-4d0c-9875-e3dc3e4a21ca\") format('woff2-variations');\n}\n\n/* ============================================================================\n * Colors — bfstats \"Neutral Depth\" (v4 / .mm)\n *\n * Dark, ink-on-surface. Surface is a soft #131313 grey, never pure black.\n * Hierarchy is carried by INK WEIGHT + WHITESPACE, not borders or shadows.\n * A single muted-olive accent is the only chromatic brand colour; red is\n * reserved for kills / danger. Numeric tints (K/D bands, load bands, team\n * colours) are semantic — never decorative.\n *\n * Source of truth: ui/src/styles/modern-minimal.css in sila-skandia/bfstats.\n * Tokens live on :root so var(--mm-*) resolves anywhere; components are\n * scoped under `.mm`.\n * ========================================================================== */\n\n:root {\n  /* ---- surfaces (dark, layered greys) ---- */\n  --mm-bg: #131313;          /* page surface */\n  --mm-bg-soft: #1a1a1a;     /* hover rows, raised strips */\n  --mm-bg-mute: #222222;     /* skeleton / bar track */\n  --mm-rule: #2d2d2d;        /* hairline (default) */\n  --mm-rule-strong: #3d3d3d; /* hairline (emphasis / chip border) */\n\n  /* ---- ink (text weights) ---- */\n  --mm-ink: #ffffff;         /* primary ink */\n  --mm-ink-soft: #c8c8c8;    /* secondary text */\n  --mm-ink-muted: #8a8a8a;   /* meta / labels / captions */\n  --mm-ink-faint: #555555;   /* disabled / faint separators */\n\n  /* ---- brand accent (muted olive) ---- */\n  --mm-accent: #7d8849;        /* primary brand / active */\n  --mm-accent-soft: #9aa666;   /* hover / soft accent */\n  --mm-highlight: #847d4c;     /* anchor strips: table head, section bar, CTA */\n  --mm-highlight-ink: #000000; /* text on anchor strips */\n\n  /* ---- semantic status ---- */\n  --mm-success: #7da34c;     /* wins / online / Allied side */\n  --mm-success-bg: #2b3a1a;  /* dark success surface (win chip) */\n  --mm-danger: #d65a5a;      /* loss / danger / admin */\n\n  /* ---- numeric tints (data, not decoration) ---- */\n  --mm-kill: #d65a5a;        /* kills */\n  --mm-kill-soft: #8a3838;   /* low-emphasis kills */\n  --mm-death: #8a8a8a;       /* deaths stay muted */\n  --mm-score: #ffffff;       /* score reads as ink */\n  --mm-streak: #d65a5a;      /* streaks pop kill-red */\n  --mm-load-busy: #c5a23a;   /* server >= 66% full */\n  --mm-load-full: #d65a5a;   /* server at capacity */\n  --mm-load-idle: #555555;   /* empty server */\n\n  /* ---- K/D bands — five steps; good play trends toward olive ---- */\n  --mm-kd-poor:  #6a6a6a;    /* < 0.5  dim grey */\n  --mm-kd-low:   #8a8a6a;    /* 0.5–1  desaturated khaki */\n  --mm-kd-mid:   #ffffff;    /* 1–2    neutral ink (default) */\n  --mm-kd-good:  #7d8849;    /* 2–3    olive accent */\n  --mm-kd-elite: #b4c060;    /* 3+     lifted olive (elite glow) */\n\n  /* ---- podium / bronze ---- */\n  --mm-bronze: #c08a4c;\n\n  /* ----------------------------------------------------------------------\n   * Semantic aliases — friendlier names mapping onto the raw tokens above.\n   * Prefer these in new code where a role is clearer than a raw colour.\n   * -------------------------------------------------------------------- */\n  --surface-page:    var(--mm-bg);\n  --surface-raised:  var(--mm-bg-soft);\n  --surface-sunken:  var(--mm-bg-mute);\n  --border-hairline: var(--mm-rule);\n  --border-strong:   var(--mm-rule-strong);\n  --text-strong:     var(--mm-ink);\n  --text-body:       var(--mm-ink-soft);\n  --text-muted:      var(--mm-ink-muted);\n  --text-faint:      var(--mm-ink-faint);\n  --brand-accent:    var(--mm-accent);\n  --anchor-bg:       var(--mm-highlight);\n  --anchor-ink:      var(--mm-highlight-ink);\n}\n\n/* ============================================================================\n * Typography tokens — bfstats \"Neutral Depth\"\n *\n * Two families do all the work:\n *   • Geist (display/sans) — headings, body, names. Light weights (300/400)\n *     at large sizes give the editorial, archival feel.\n *   • Geist Mono — every NUMBER, label, eyebrow, timestamp, chip and meta\n *     string. Mono carries the \"data terminal\" voice; uppercase + wide\n *     tracking is the house signature for labels.\n *\n * Numbers always use tabular figures (font-variant-numeric: tabular-nums)\n * so columns of stats stay aligned.\n * ========================================================================== */\n\n:root {\n  --mm-font-display: 'Geist Variable', 'Geist', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;\n  --mm-font-mono: 'Geist Mono Variable', 'Geist Mono', 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;\n\n  /* friendly aliases */\n  --font-display: var(--mm-font-display);\n  --font-mono: var(--mm-font-mono);\n\n  /* fluid type scale used across the system */\n  --mm-text-display: clamp(40px, 5.5vw, 64px); /* hero numerals / .mm-display */\n  --mm-text-h2: clamp(22px, 2.5vw, 30px);      /* section headings */\n  --mm-text-stat: clamp(28px, 3vw, 40px);      /* big stat values */\n  --mm-text-rank: clamp(28px, 3vw, 38px);      /* headline rank */\n  --mm-text-body: 14px;                        /* table / list body */\n  --mm-text-meta: 10.5px;                      /* mono meta rows */\n  --mm-text-eyebrow: 10px;                      /* tiny mono eyebrow */\n\n  /* the house tracking values for mono labels */\n  --mm-track-eyebrow: 0.14em;\n  --mm-track-label: 0.08em;\n  --mm-track-wide: 0.18em;\n}\n\n/* ============================================================================\n * Spacing, radius & layout tokens — bfstats \"Neutral Depth\"\n *\n * The aesthetic is whitespace + 1px hairlines, NOT cards-with-shadow.\n * Corner radii are deliberately tiny (2px) — this is a militaria/terminal\n * look, not a soft consumer app. There is no elevation/shadow system; depth\n * comes from surface greys and rules.\n * ========================================================================== */\n\n:root {\n  /* corner radii — small and square. 2px is the house default. */\n  --mm-radius-xs: 1px;   /* eyebrow leading bar */\n  --mm-radius-sm: 2px;   /* chips, buttons, panels, table corners */\n  --mm-radius-bar: 2px;  /* load bars */\n  --mm-radius-pill: 999px; /* search field, avatar, badges */\n\n  /* spacing scale (px) */\n  --mm-space-1: 4px;\n  --mm-space-2: 8px;\n  --mm-space-3: 12px;\n  --mm-space-4: 16px;\n  --mm-space-5: 24px;\n  --mm-space-6: 32px;\n  --mm-space-7: 48px;\n\n  /* layout */\n  --mm-container: 1280px;       /* max content width */\n  --mm-gutter: 32px;            /* desktop container padding */\n  --mm-gutter-mobile: 18px;     /* mobile container padding */\n  --mm-topbar-pad-y: 16px;\n  --mm-section-pad-y: 32px;\n\n  /* hairline weight */\n  --mm-hairline: 1px;\n\n  /* the one allowed \"glow\" — olive ring on the signed-in avatar */\n  --mm-glow-accent: 0 0 10px rgba(125, 136, 73, 0.28);\n}\n\n\n/* --- base + components --- */\n/* ============================================================================\n * Base — the `.mm` container.\n *\n * Modern-minimal is scoped to descendants of `.mm` so it can co-exist with\n * legacy chrome. Wrap any bfstats surface in <div class=\"mm\"> (or\n * <div class=\"mm mm-shell\">) and every component class below resolves.\n * Tokens are global (:root) so var(--mm-*) works even outside `.mm`.\n * ========================================================================== */\n\n.mm {\n  font-family: var(--mm-font-display);\n  background: var(--mm-bg);\n  color: var(--mm-ink);\n  font-feature-settings: 'ss01', 'cv11';\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n}\n\n.mm * { box-sizing: border-box; }\n\n.mm a {\n  color: inherit;\n  text-decoration: none;\n}\n.mm a:hover { color: var(--mm-accent); }\n\n/* ============================================================================\n * bfstats \"Neutral Depth\" — component class library (.mm)\n *\n * Faithful port of ui/src/styles/modern-minimal.css from sila-skandia/bfstats.\n * Token declarations have been lifted out into /tokens/*.css; the rest is\n * verbatim so consuming surfaces match the live product 1:1.\n * ========================================================================== */\n\n/* ---------- typography ---------- */\n\n.mm-eyebrow {\n  font-family: var(--mm-font-mono);\n  font-size: 10px;\n  letter-spacing: 0.14em;\n  text-transform: uppercase;\n  color: var(--mm-ink-muted);\n  font-weight: 400;\n}\n\n.mm-eyebrow--strong {\n  display: inline-flex;\n  align-items: center;\n  gap: 8px;\n  font-size: 13px;\n  font-weight: 600;\n  letter-spacing: 0.08em;\n  color: var(--mm-ink);\n}\n\n.mm-eyebrow--strong::before {\n  content: '';\n  display: inline-block;\n  width: 3px;\n  height: 12px;\n  background: var(--mm-accent);\n  border-radius: 1px;\n}\n\n.mm-display {\n  font-family: var(--mm-font-display);\n  font-weight: 300;\n  font-size: clamp(40px, 5.5vw, 64px);\n  line-height: 1;\n  letter-spacing: -0.02em;\n  color: var(--mm-ink);\n  margin: 0;\n}\n\n.mm-display__muted {\n  color: var(--mm-ink-muted);\n  font-style: italic;\n  font-weight: 300;\n}\n\n.mm-h2 {\n  font-family: var(--mm-font-display);\n  font-weight: 400;\n  font-size: clamp(22px, 2.5vw, 30px);\n  line-height: 1.15;\n  letter-spacing: -0.01em;\n  margin: 0;\n}\n\n.mm-stat__value {\n  font-family: var(--mm-font-display);\n  font-weight: 300;\n  font-size: clamp(28px, 3vw, 40px);\n  line-height: 1;\n  letter-spacing: -0.01em;\n  color: var(--mm-ink);\n}\n\n.mm-stat__value--small { font-size: clamp(22px, 2.4vw, 30px); }\n\n.mm-stat__suffix {\n  font-family: var(--mm-font-mono);\n  font-size: 11px;\n  color: var(--mm-ink-muted);\n  margin-left: 4px;\n  vertical-align: 6px;\n}\n\n.mm-stat__delta {\n  font-family: var(--mm-font-mono);\n  font-size: 10.5px;\n  color: var(--mm-ink-muted);\n  letter-spacing: 0.04em;\n  text-transform: uppercase;\n  margin-top: 6px;\n}\n\n.mm-stat__delta--up { color: var(--mm-success); }\n.mm-stat__delta--down { color: var(--mm-danger); }\n\n/* ---------- hairlines ---------- */\n\n.mm-rule {\n  height: 1px;\n  background: var(--mm-rule);\n  border: 0;\n  margin: 0;\n}\n\n.mm-rule--strong { background: var(--mm-ink); }\n\n/* ---------- shell ---------- */\n\n.mm-shell {\n  min-height: 100vh;\n  background: var(--mm-bg);\n  display: flex;\n  flex-direction: column;\n}\n\n.mm-topbar {\n  display: grid;\n  grid-template-columns: auto 1fr auto auto;\n  align-items: center;\n  gap: 24px;\n  padding: 16px 32px;\n  border-bottom: 1px solid var(--mm-rule);\n}\n\n.mm-brand {\n  display: flex;\n  align-items: center;\n  gap: 12px;\n  color: var(--mm-ink);\n}\n\n.mm-brand__sigil {\n  width: 36px;\n  height: 36px;\n  display: block;\n  object-fit: contain;\n  flex-shrink: 0;\n}\n\n.mm-brand__mark {\n  display: flex;\n  flex-direction: column;\n  line-height: 1;\n}\n\n.mm-brand__name {\n  font-family: var(--mm-font-display);\n  font-size: 14px;\n  font-weight: 500;\n  letter-spacing: -0.005em;\n  color: var(--mm-ink);\n}\n\n.mm-brand__sub {\n  font-family: var(--mm-font-mono);\n  font-size: 9px;\n  letter-spacing: 0.18em;\n  text-transform: uppercase;\n  color: var(--mm-ink-muted);\n  margin-top: 3px;\n}\n\n.mm-nav {\n  display: flex;\n  justify-content: center;\n  gap: 28px;\n}\n\n.mm-nav__link {\n  font-family: var(--mm-font-display);\n  font-size: 13px;\n  font-weight: 400;\n  color: var(--mm-ink-soft);\n  padding: 6px 0;\n  position: relative;\n}\n\n.mm-nav__link:hover { color: var(--mm-ink); }\n\n.mm-nav__link--active {\n  color: var(--mm-ink);\n  font-weight: 500;\n}\n\n.mm-nav__link--active::after {\n  content: '';\n  position: absolute;\n  left: 0; right: 0; bottom: -2px;\n  height: 1px;\n  background: var(--mm-ink);\n}\n\n.mm-nav__link--admin {\n  color: var(--mm-danger);\n  display: inline-flex;\n  align-items: center;\n  gap: 6px;\n}\n.mm-nav__link--admin::before {\n  content: '';\n  width: 5px;\n  height: 5px;\n  border-radius: 50%;\n  background: var(--mm-danger);\n}\n.mm-nav__link--admin:hover { color: var(--mm-danger); opacity: 0.8; }\n.mm-nav__link--admin.mm-nav__link--active { color: var(--mm-danger); }\n.mm-nav__link--admin.mm-nav__link--active::after { background: var(--mm-danger); }\n\n.mm-search {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  padding: 7px 12px;\n  background: transparent;\n  border: 1px solid var(--mm-rule);\n  border-radius: 999px;\n  min-width: 220px;\n  transition: border-color 0.15s ease;\n}\n\n.mm-search:focus-within { border-color: var(--mm-ink); }\n\n.mm-search__icon {\n  width: 12px; height: 12px;\n  color: var(--mm-ink-muted);\n}\n\n.mm-search__input {\n  border: 0;\n  outline: 0;\n  background: transparent;\n  flex: 1;\n  font-family: var(--mm-font-display);\n  font-size: 12.5px;\n  color: var(--mm-ink);\n  min-width: 0;\n}\n\n.mm-search__input::placeholder { color: var(--mm-ink-muted); }\n\n.mm-search__hint {\n  font-family: var(--mm-font-mono);\n  font-size: 10px;\n  letter-spacing: 0.05em;\n  color: var(--mm-ink-muted);\n  border: 1px solid var(--mm-rule);\n  border-radius: 4px;\n  padding: 1px 5px;\n}\n\n/* ---------- breadcrumb / clock strip ---------- */\n\n.mm-substrip {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  padding: 8px 32px;\n  border-bottom: 1px solid nds\", label: \"Rounds\" }\n  ];\n\n  state = { sortKey: null, dir: \"desc\" };\n\n  labelToKey(label) {\n    const f = this.SORTS.find(s => s.label.toLowerCase() === String(label || \"\").toLowerCase());\n    return f ? f.key : \"score\";\n  }\n\n  kdBand(kd) {\n    if (kd < 0.5) return \"poor\";\n    if (kd < 1) return \"low\";\n    if (kd < 2) return \"mid\";\n    if (kd < 3) return \"good\";\n    return \"elite\";\n  }\n\n  fmt(n) { return n.toLocaleString(\"en-US\"); }\n\n  setSort(key) {\n    this.setState(s => {\n      if (s.sortKey === key) return { dir: s.dir === \"desc\" ? \"asc\" : \"desc\" };\n      return { sortKey: key, dir: \"desc\" };\n    });\n  }\n\n  renderVals() {\n    const podium = this.props.podiumHighlight ?? true;\n    const sortKey = this.state.sortKey || this.labelToKey(this.props.defaultSort ?? \"Score\");\n    const dir = this.state.dir;\n\n    const sorted = [...this.PLAYERS].sort((a, b) => dir === \"desc\" ? b[sortKey] - a[sortKey] : a[sortKey] - b[sortKey]);\n    const podiumColors = [\"var(--mm-kd-elite)\", \"var(--mm-ink)\", \"var(--mm-bronze)\"];\n\n    const rows = sorted.map((p, i) => {\n      const band = this.kdBand(p.kd);\n      return {\n        rankLabel: String(i + 1).padStart(2, \"0\"),\n        rankColor: podium && i < 3 ? podiumColors[i] : \"var(--mm-ink-muted)\",\n        nameF: (p.clan ? p.clan + \" \" : \"\") + p.name,\n        flagServer: p.flag + \" \" + p.server,\n        scoreF: this.fmt(p.score),\n        kdF: p.kd.toFixed(2),\n        kdClass: \"mm-kd--\" + band,\n        killsF: this.fmt(p.kills),\n        deathsF: this.fmt(p.deaths),\n        krateF: p.krate.toFixed(2),\n        timeLabel: p.timeLabel,\n        roundsF: this.fmt(p.rounds)\n      };\n    });\n\n    const arrow = dir === \"desc\" ? \" ↓\" : \" ↑\";\n    const arr = {}, onSort = {};\n    this.SORTS.forEach(s => {\n      arr[s.key] = s.key === sortKey ? arrow : \"\";\n      onSort[s.key] = () => this.setSort(s.key);\n    });\n    const sortDefs = this.SORTS.map(s => {\n      const active = s.key === sortKey;\n      const base = \"flex:0 0 auto;font-family:var(--mm-font-mono);font-size:10px;letter-spacing:0.1em;text-transform:uppercase;padding:6px 11px;border-radius:2px;cursor:pointer;white-space:nowrap;\";\n      const style = base + (active\n        ? \"background:var(--mm-highlight);color:var(--mm-highlight-ink);border:1px solid var(--mm-highlight);font-weight:600;\"\n        : \"background:transparent;color:var(--mm-ink-soft);border:1px solid var(--mm-rule-strong);\");\n      return { text: s.label + (active ? arrow : \"\"), style, onClick: () => this.setSort(s.key) };\n    });\n\n    return {\n      rows,\n      sortDefs,\n      arr,\n      onSort,\n      summary: \"5,459 ranked\"\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"

name: Sidecar Android app

# Builds the Android app (tools/sidecar-android, features/sidecar-android-app).
# A push that touches it or the sidecar it ports runs the Kotlin core's tests
# (JVM and linuxX64), the release build (R8 fails on any class Android lacks),
# and a debug APK, uploaded as a workflow artifact for sideloading.
#
# With the upload key in the repository secrets (SIDECAR_UPLOAD_KEYSTORE_B64,
# SIDECAR_UPLOAD_STORE_PASSWORD; scripts/make-upload-key.sh says how), it
# also builds the signed bundle (.aab) that Google Play takes and a signed APK.
# A tag named sidecar-android-v* (which must have the key) attaches both to a
# draft GitHub release, built from exactly the tagged commit, and uploads the
# bundle to Play's internal testing track when PLAY_SERVICE_ACCOUNT_JSON is
# set too. Play takes a new app's very first bundle only by hand in the Play
# Console: download it from the draft release.

on:
  push:
    branches: [main]
    paths:
      - tools/sidecar-android/**
      - tools/bf1942-models/sidecar/**
      - .github/workflows/sidecar-android.yml
    tags:
      - "sidecar-android-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: tools/sidecar-android
    env:
      # Play wants a higher versionCode on every upload.
      SIDECAR_VERSION_CODE: ${{ github.run_number }}
      HAS_UPLOAD_KEY: ${{ secrets.SIDECAR_UPLOAD_KEYSTORE_B64 != '' }}
    steps:
      # The app; the files the core's table version hashes (core/build.gradle.kts
      # tableVersion, as template-table.mjs does); the Node sidecar, whose
      # bundled files ResourcesDriftTest compares with the core's copies; and
      # the recorded sessions LiveSnapshotTest replays.
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /tools/sidecar-android/
            /tools/bf1942-models/sidecar_tid_table.py
            /tools/bf1942-models/bf42/template_table.py
            /tools/bf1942-models/sidecar/
            /tools/bf1942-models/tests/fixtures/

      # The build's JDK 17 toolchain and the Gradle daemon's JDK 25
      # (gradle/gradle-daemon-jvm.properties).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            25

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('tools/sidecar-android/gradle/libs.versions.toml') }}

      - name: Android SDK location
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # versionName: the tag's version (sidecar-android-v0.1.0 -> 0.1.0), else
      # 0.1.0-<run> for a push build.
      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/sidecar-android-v* ]]; then v="${GITHUB_REF_NAME#sidecar-android-v}"; else v="0.1.0-$GITHUB_RUN_NUMBER"; fi
          echo "SIDECAR_VERSION_NAME=$v" >> "$GITHUB_ENV"
          echo "versionName $v, versionCode $SIDECAR_VERSION_CODE"

      - name: Core tests (JVM and linuxX64)
        run: ./gradlew --no-configuration-cache :core:jvmTest :core:linuxX64Test

      - name: Debug APK and the release build's R8 check
        run: ./gradlew --no-configuration-cache :app:assembleDebug :app:assembleRelease

      - name: A release tag needs the upload key
        if: startsWith(github.ref, 'refs/tags/sidecar-android-v') && env.HAS_UPLOAD_KEY != 'true'
        run: |
          echo "::error::$GITHUB_REF_NAME: SIDECAR_UPLOAD_KEYSTORE_B64 and SIDECAR_UPLOAD_STORE_PASSWORD are not set (scripts/make-upload-key.sh)"
          exit 1

      - name: The upload key
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.SIDECAR_UPLOAD_KEYSTORE_B64 }}
        run: |
          umask 077
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "SIDECAR_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Signed bundle and APK
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          SIDECAR_UPLOAD_STORE_PASSWORD: ${{ secrets.SIDECAR_UPLOAD_STORE_PASSWORD }}
        run: ./gradlew --no-configuration-cache :app:bundleRelease :app:assembleRelease

      - name: Drop the upload key
        if: always() && env.HAS_UPLOAD_KEY == 'true'
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: sidecar-android-build-${{ github.run_number }}
          path: |
            tools/sidecar-android/app/build/outputs/apk/debug/app-debug.apk
            tools/sidecar-android/app/build/outputs/apk/release/app-release.apk
            tools/sidecar-android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn

  play-internal:
    if: startsWith(github.ref, 'refs/tags/sidecar-android-v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sidecar-android-build-${{ github.run_number }}
          path: out

      - name: Upload to the internal testing track
        if: env.HAS_PLAY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.bfstats.app
          releaseFiles: out/bundle/release/app-release.aab
          track: internal
          status: completed

      - name: No Play credentials
        if: env.HAS_PLAY != 'true'
        run: echo "PLAY_SERVICE_ACCOUNT_JSON is not set; the bundle is in the build job's artifact."

  release:
    if: startsWith(github.ref, 'refs/tags/sidecar-android-v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sidecar-android-build-${{ github.run_number }}
          path: out

      # A draft, as the app stays private until testing is done
      # (features/sidecar-android-app); the owner publishes it.
      - name: Draft release with the signed bundle and APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          v="${TAG#sidecar-android-v}"
          mkdir rel
          cp out/bundle/release/app-release.aab "rel/bfstats-io-$v.aab"
          cp out/apk/release/app-release.apk "rel/bfstats-io-$v.apk"
          (cd rel && sha256sum *.aab *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)
          cat > notes.md <<EOF
          The bfstats.io companion app for Android, $v (build ${{ github.run_number }}), built from ${{ github.sha }}.

          - \`bfstats-io-$v.aab\`: the bundle for Google Play.
          - \`bfstats-io-$v.apk\`: install directly ("install unknown apps" allowed). Signed with the upload key, so a copy later installed from Google Play (signed by Google) cannot update it: uninstall this one first.

          Package \`io.bfstats.app\`; Android 8.0 or later.
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" rel/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" rel/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "bfstats.io for Android $v" --notes-file notes.md
          fi

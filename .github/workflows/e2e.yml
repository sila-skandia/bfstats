name: E2E

# Runs the same ./scripts/verify.sh developers run locally — API unit tests plus
# the containerised Playwright suite — so a CI failure reproduces with one
# command. See features/e2e-real-data-fixtures/README.md.
#
# Data: the job tries to pull the real-data fixture from the `e2e-fixture`
# release. If that release does not exist (or the download fails) it falls back
# to the 7-player synthetic seed the API builds itself, so the workflow is
# useful before any fixture is published and never breaks because of it.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      data:
        description: Which fixture to run against
        type: choice
        options: [real, synthetic]
        default: real
      graph:
        description: Also start a private Neo4j and run graph-backed specs
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      # verify.sh looks for this exact container name before it will run, so CI
      # provides it under the same name rather than diverging the script.
      - name: Start Redis
        run: docker run -d --name bf1942-redis -p 6379:6379 redis:7-alpine

      # Both come from user-secrets locally and are absent on a runner. Without the
      # JWT key the API starts but every request through the auth middleware —
      # including /health — returns 500, so verify.sh waits on a readiness check
      # that can never pass. Without the refresh-token secret, login itself 500s.
      #
      # Generated fresh per run rather than held in repository secrets: they sign
      # nothing that outlives the job.
      - name: Generate ephemeral signing keys
        run: |
          openssl genrsa -out "$RUNNER_TEMP/jwt-e2e.pem" 2048
          echo "Jwt__PrivateKeyPath=$RUNNER_TEMP/jwt-e2e.pem" >> "$GITHUB_ENV"
          echo "RefreshToken__Secret=$(openssl rand -base64 48)" >> "$GITHUB_ENV"

      # No Discord config is set on purpose. The suite authenticates through the
      # DevBypass branch of POST /auth/login, which never contacts Discord, and
      # DiscordAuthService now resolves its credentials on use rather than in a
      # field initialiser — so the absence of OAuth secrets is not a problem
      # until something actually tries to exchange a code.

      # Not fatal: a missing release just means the synthetic seed is used.
      - name: Fetch real-data fixture
        id: fixture
        if: inputs.data != 'synthetic'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p ~/.cache/bfstats-e2e
          gh release download e2e-fixture --dir ~/.cache/bfstats-e2e --clobber
          zstd -d ~/.cache/bfstats-e2e/*.zst --rm
          ls -lh ~/.cache/bfstats-e2e
          cat ~/.cache/bfstats-e2e/template.meta || true

      - name: Report data source
        run: |
          if [ "${{ steps.fixture.outcome }}" = "success" ]; then
            echo "Running against the real-data fixture." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Running against the synthetic 7-player seed." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify (unit tests + Playwright)
        env:
          # Empty means "use the fixture if one is present"; 1 forces the seed.
          #
          # Written as "!= success && '1'" rather than "== success && '' || '1'"
          # on purpose: GitHub's &&/|| idiom falls through to the right-hand side
          # whenever the left result is falsy, and '' is falsy — so the natural
          # phrasing silently always yields '1'.
          E2E_SYNTHETIC: ${{ steps.fixture.outcome != 'success' && '1' || '' }}
          E2E_NEO4J: ${{ inputs.graph && '1' || '' }}
        run: ./scripts/verify.sh

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            ui/playwright-report
            ui/test-results
          retention-days: 7

      - name: Upload API log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-log
          path: /tmp/bfstats-e2e-*-api.log
          retention-days: 7
          if-no-files-found: ignore

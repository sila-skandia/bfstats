name: Sidecar desktop app

# Builds the tray app (tools/sidecar-desktop, features/sidecar-desktop-app)
# on Windows and Linux. A push that touches the app or the sidecars it bundles
# runs the unit tests, a smoke test of each sidecar engine
# (scripts/smoke-sidecar.js: Node under the platform's own Electron, and on
# Linux the native Kotlin sidecar built here from tools/sidecar-android/core),
# the installers, and the smoke test again from the packaged app, then
# uploads the builds as workflow artifacts. Windows runs Node only.
# A tag named sidecar-desktop-v* also attaches them to a GitHub release.
# The Windows installer is not code signed (SmartScreen warns; see the app's
# README, "Windows").

on:
  push:
    branches: [main]
    paths:
      - tools/sidecar-desktop/**
      - tools/bf1942-models/sidecar/**
      - tools/sidecar-android/core/**
      - tools/sidecar-android/gradle/**
      - tools/sidecar-android/*.kts
      - .github/workflows/sidecar-desktop.yml
    tags:
      - "sidecar-desktop-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            builder: --win nsis
            unpacked: dist/win-unpacked
            # Node only: no native sidecar is built for Windows yet.
            sparse_extra: ""
            files: |
              tools/sidecar-desktop/dist/*.exe
          - os: ubuntu-latest
            platform: linux
            builder: --linux AppImage deb pacman
            unpacked: dist/linux-unpacked
            # The Kotlin sidecar's Gradle build (core only: -PcoreOnly=true).
            sparse_extra: /tools/sidecar-android/
            files: |
              tools/sidecar-desktop/dist/*.AppImage
              tools/sidecar-desktop/dist/*.deb
              tools/sidecar-desktop/dist/*.pacman
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: tools/sidecar-desktop
    env:
      # No signing identity to look for, and never publish from the build.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      # The files as committed (LF), so a Windows build hashes and packs what
      # a Linux one does.
      - name: Keep line endings
        working-directory: .
        run: git config --global core.autocrlf false

      # Git for Windows refuses a reserved device name (bf42/con.py) even in
      # the index; the sparse checkout below never writes it to disk.
      - name: Allow reserved names in the index
        working-directory: .
        run: git config --global core.protectNTFS false

      # Only what the app builds from. The whole tree cannot be checked out on
      # Windows: tools/bf1942-models/bf42/con.py is a reserved device name
      # there. The two Python files are hashed into the sidecar's table version
      # (template-table.mjs VERSION_INPUTS), not run.
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /tools/sidecar-desktop/
            /tools/bf1942-models/sidecar/
            /tools/bf1942-models/sidecar_tid_table.py
            /tools/bf1942-models/bf42/template_table.py
            ${{ matrix.sparse_extra }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/sidecar-desktop/package-lock.json

      - name: Install the pacman packager's bsdtar
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Install
        run: npm ci

      # The native Kotlin sidecar (src/sidecar-engine.js): the build's JDK 17
      # toolchain and the Gradle daemon's JDK 25 (gradle/gradle-daemon-jvm.properties),
      # Kotlin/Native's toolchain cached in ~/.konan. The packages bundle the
      # executable; no Java ships.
      - uses: actions/setup-java@v4
        if: matrix.platform == 'linux'
        with:
          distribution: temurin
          java-version: |
            17
            25

      - uses: gradle/actions/setup-gradle@v4
        if: matrix.platform == 'linux'

      - name: Cache Kotlin/Native
        if: matrix.platform == 'linux'
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('tools/sidecar-android/gradle/libs.versions.toml') }}

      - name: Build the native sidecar
        if: matrix.platform == 'linux'
        run: npm run build-sidecar

      - name: Unit tests
        run: npm test

      # Linux: Node and the native sidecar; Windows: Node.
      - name: Smoke test the sidecars
        run: node scripts/smoke-sidecar.js

      - name: Build
        run: npx electron-builder ${{ matrix.builder }} --publish never

      - name: Smoke test the packaged app's sidecars
        run: node scripts/smoke-sidecar.js --unpacked ${{ matrix.unpacked }}

      - name: Checksums
        working-directory: tools/sidecar-desktop/dist
        run: |
          shopt -s nullglob
          sha256sum *.exe *.AppImage *.deb *.pacman > SHA256SUMS-${{ matrix.platform }}.txt
          cat SHA256SUMS-${{ matrix.platform }}.txt

      - uses: actions/upload-artifact@v4
        with:
          name: sidecar-desktop-${{ matrix.platform }}
          path: |
            ${{ matrix.files }}
            tools/sidecar-desktop/dist/SHA256SUMS-${{ matrix.platform }}.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/sidecar-desktop-v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sidecar-desktop-*
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout here, so gh cannot read the repository from git.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'NOTES'
          bfstats Sidecar, the tray app that joins BF1942 servers and plays them in the browser.

          - Windows: bfstats-sidecar-<version>-x64.exe, a per-user NSIS installer. It is not code
            signed: SmartScreen shows "Windows protected your PC"; More info, then Run anyway.
          - Linux: the AppImage (chmod +x, run once), or the .deb / .pacman package.

          SHA256SUMS-win.txt and SHA256SUMS-linux.txt hold the checksums.
          NOTES
          # Published: the desktop app is public (features/sidecar-desktop-app/INSTALL.md).
          gh release create "$TAG" ./*.exe ./*.AppImage ./*.deb ./*.pacman ./SHA256SUMS-*.txt \
            --title "Sidecar desktop $TAG" --notes-file notes.md

name: Claude Review - Cursor SRE PRs

# Auto-reviews pull requests raised by the Cursor site-reliability agent, which
# opens branches named cursor/* in response to Seq threshold alerts.
#
# Two jobs, in this order:
#
#   1. review  - dotnet build + API unit tests (minutes), then Claude decides
#                whether the change is worth merging at all. Claude labels the
#                PR with its verdict and may edit the branch in place.
#   2. e2e     - the full ./scripts/verify.sh run (Playwright against a
#                real-data fixture), only for PRs that survived step 1.
#
# The ordering is deliberate. Most of these PRs are narrow patches for an alert
# that fired once, and the reviewer's first job is to decide whether the change
# should exist. Spending ~15 minutes of E2E on a PR that is about to be closed
# is wasted, and it delays the verdict that actually matters. Build and unit
# tests still run first because they are cheap and because a red build is
# something Claude should see - and can fix - during the review.
#
# Because the E2E job runs after the review, it also verifies whatever Claude
# committed in the "edit in place" path, which the old single-job ordering
# needed a separate post-review step for.
#
# Claude runs in "agent mode" (a `prompt` is supplied, so no @claude mention is
# needed) and is allowed to push fixes straight to the PR branch.
#
# Loop safety: we deliberately do NOT trigger on `synchronize`. Claude pushes
# commits to the PR branch, and a `synchronize` trigger would re-invoke this
# workflow on its own commit. Follow-up passes are on-demand: comment
# "@claude ..." on the PR (handled by claude.yml) or run this workflow manually.

on:
  pull_request:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true
        type: string

# Review runs bill against the Claude subscription, shared with interactive use.
# One review per PR at a time; a re-trigger supersedes the run in flight.
concurrency:
  group: claude-cursor-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: write # commit review fixes to the PR branch
  pull-requests: write # post reviews, edit/close the PR
  issues: write # PR comments go through the issues API
  id-token: write # OIDC exchange for the Claude GitHub App token

jobs:
  review:
    # Only cursor/* branches on automatic runs; manual dispatch is always explicit.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.head_ref, 'cursor/')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      number: ${{ steps.pr.outputs.number }}
      ref: ${{ steps.pr.outputs.ref }}
      verdict: ${{ steps.verdict.outputs.verdict }}
      run_e2e: ${{ steps.verdict.outputs.run_e2e }}

    steps:
      - name: Resolve target PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR: ${{ inputs.pr_number }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          EVENT_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # Validate: digits only, so it cannot be smuggled into later shell.
            case "$INPUT_PR" in
              ''|*[!0-9]*) echo "pr_number must be numeric" >&2; exit 1 ;;
            esac
            number="$INPUT_PR"
            ref="$(gh pr view "$number" --json headRefName -q .headRefName)"
          else
            number="$EVENT_PR"
            ref="$EVENT_REF"
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Reviewing PR #$number (branch $ref)"

      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          # Check out the branch itself (not the detached merge ref) so Claude
          # can commit and push fixes back to the PR.
          ref: ${{ steps.pr.outputs.ref }}
          # Full history so Claude can diff against main and read the blame /
          # incident history that CLAUDE.md points at.
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "claude[bot]"
          git config user.email "claude[bot]@users.noreply.github.com"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # Both continue-on-error: a broken build or a failing test is a review
      # finding, not a reason to skip the review. Claude is told the outcome and
      # can fix it in place; it can also re-run either command itself.
      - name: Build API
        id: build
        continue-on-error: true
        run: dotnet build api/api.csproj --nologo -v m

      - name: API unit tests
        id: unit
        continue-on-error: true
        run: dotnet test tests/api/api.tests.csproj --nologo -v m

      - name: Ensure verdict labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # `gh pr edit --add-label` fails on a label that does not exist, so
          # create them up front rather than having the review step discover it.
          gh label create "claude:approved" --color 0E8A16 --force \
            --description "Claude review: sound as-is" >/dev/null
          gh label create "claude:edited"   --color FBCA04 --force \
            --description "Claude review: amended in place" >/dev/null
          gh label create "claude:rejected" --color B60205 --force \
            --description "Claude review: not worth merging" >/dev/null
          gh label create "e2e:failed"      --color D93F0B --force \
            --description "Playwright E2E failed after review" >/dev/null

      - name: Record base commit
        run: echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Review with Claude
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          # Subscription auth (Pro/Max), not a metered API key. Generate the
          # token locally with `claude setup-token` and store it as the repo
          # secret CLAUDE_CODE_OAUTH_TOKEN. It expires periodically and has to
          # be regenerated - a 401 from this step is the usual symptom.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # GitHub auth, separate from the Claude credential above. Passing this
          # explicitly means the action does not depend on the Claude GitHub App
          # being installed - the built-in token already carries the permissions
          # declared above. Side benefit: pushes made with GITHUB_TOKEN do not
          # trigger further workflow runs, which is extra insurance against the
          # review loop described at the top of this file.
          #
          # Drop this line to use the Claude GitHub App instead (via the OIDC
          # exchange that `id-token: write` enables). Comments then come from
          # claude[bot] rather than github-actions[bot], but the app has to be
          # installed on the repo for it to work.
          github_token: ${{ secrets.GITHUB_TOKEN }}

          # Supplying `prompt` puts the action in agent mode: it runs on the
          # `pull_request` event directly, with no @claude mention required.
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ steps.pr.outputs.number }}
            BRANCH: ${{ steps.pr.outputs.ref }}

            BUILD: ${{ steps.build.outcome }}
            API UNIT TESTS: ${{ steps.unit.outcome }}

            Review this PR from the site reliability agent, which is responding
            to threshold alerts triggered from Seq. Not all events require
            investigation so if the change looks too specific and not going to
            solve a bigger problem it can be rejected. If you have changes you
            want to make, just edit the PR in place.

            ## Context

            The PR branch is already checked out in the working directory, with
            full history. `git diff origin/main...HEAD` shows the change.

            `dotnet build` and the API unit tests have already run - their
            outcomes are at the top of this prompt. If either failed, the log is
            in this workflow run and you can re-run the command yourself:
            `dotnet build api/api.csproj` and
            `dotnet test tests/api/api.tests.csproj`. A red build or a failing
            test is a review finding; fix it in place if the change is otherwise
            worth keeping.

            The Playwright E2E suite has NOT run yet. It runs after you, and
            only if you do not reject the PR - so do not try to run it, and do
            not claim it passed.

            Read CLAUDE.md before forming an opinion. The parts that matter most
            for this kind of PR:

            - Production is a SINGLE Hetzner node (4000m CPU, 7741Mi memory)
              running everything. There is no spare capacity to grow into.
            - `deploy/PRODUCTION_ISSUES.md` records changes that have actually
              taken production down. `deploy/NODE_TUNING.md` records host tuning
              that no manifest captures.
            - `api/PlayerTracking/SqliteConnectionInterceptor.cs` applies to
              EVERY connection in the process. SQLite pragmas there are
              per-connection across a pooled set, and a tuning change made for
              one feature lands on all of them. This file has already caused one
              node outage - treat any change to it as high risk.
            - Any memory-sized setting must be multiplied out against the 7741Mi
              budget, leaving ~1.5Gi for the OS and k3s.

            ## What to weigh

            1. Does this address a real, recurring problem, or is it a narrow
               patch for one alert firing once? Narrow one-off patches are the
               main thing to push back on.
            2. Does the fix match the actual cause, or does it just suppress the
               symptom that Seq alerted on?
            3. Blast radius - especially shared/global code paths, resource
               limits, SQLite pragmas, and the hourly background sweeps
               (AggregateCalculationService, RankingCalculationService).
            4. Correctness of the change itself, and whether it follows the
               conventions in CLAUDE.md (feature-first folders, records for
               DTOs, NodaTime Instant, no emojis, $pn/decode rules for player
               and server names).
            5. Test coverage for the changed behaviour.

            ## How to respond

            Pick exactly one outcome, act on it, and label the PR to record it.
            The label is what gates the E2E job, so it is not optional:

            - APPROVE - sound and worth keeping. Post a short review saying so,
              then:
              `gh pr edit ${{ steps.pr.outputs.number }} --add-label "claude:approved"`
            - EDIT IN PLACE - right idea, wrong details. Make the changes
              yourself: edit the files, `git commit`, and `git push origin
              HEAD:${{ steps.pr.outputs.ref }}`. Post a comment listing what you
              changed and why, then:
              `gh pr edit ${{ steps.pr.outputs.number }} --add-label "claude:edited"`
            - REJECT - too specific, or does not solve a bigger problem. Post a
              comment explaining the reasoning. Be concrete about what would
              make a version of this worth merging. Then:
              `gh pr edit ${{ steps.pr.outputs.number }} --add-label "claude:rejected"`
              followed by `gh pr close ${{ steps.pr.outputs.number }}`.

            On APPROVE or EDIT, say in your comment that the E2E suite runs next
            and that the verdict is conditional on it passing.

            Use `gh pr comment` for the top-level verdict. Use
            `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) for specific lines. Post your findings to GitHub
            - do not leave them only in the run log.

          claude_args: |
            --allowedTools "Read,Edit,Write,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(git:*),Bash(dotnet build:*),Bash(dotnet test:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr review:*),Bash(gh pr edit:*),Bash(gh pr close:*),Bash(gh label list:*)"
            --max-turns 40

      # Decides whether E2E runs. PR state is the authoritative signal - a
      # rejected PR is a closed PR - with the label as the readable record.
      # Anything ambiguous (no label, Claude errored) falls through to running
      # E2E: on a public repo the minutes are free, and skipping verification is
      # the more expensive mistake.
      - name: Determine verdict
        id: verdict
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          UNIT_OUTCOME: ${{ steps.unit.outcome }}
        run: |
          set -euo pipefail
          state="$(gh pr view "$PR_NUMBER" --json state -q .state)"
          labels="$(gh pr view "$PR_NUMBER" --json labels -q '[.labels[].name] | join(",")')"

          verdict=unknown
          case ",$labels," in
            *,claude:rejected,*) verdict=reject ;;
            *,claude:edited,*)   verdict=edit ;;
            *,claude:approved,*) verdict=approve ;;
          esac

          if [ "$state" != "OPEN" ] || [ "$verdict" = "reject" ]; then
            run_e2e=false
          else
            run_e2e=true
          fi

          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "run_e2e=$run_e2e" >> "$GITHUB_OUTPUT"

          {
            echo "### Claude review"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Build | $BUILD_OUTCOME |"
            echo "| API unit tests | $UNIT_OUTCOME |"
            echo "| Verdict | \`$verdict\` (PR is $state) |"
            echo "| E2E next | $run_e2e |"
          } >> "$GITHUB_STEP_SUMMARY"

      # The build/test steps above are continue-on-error so Claude gets to see a
      # red build rather than being skipped by it. This re-runs them afterwards
      # so the job still goes red if nobody fixed it - but only for a PR that is
      # still in play, since a closed one no longer needs a green tick.
      - name: Re-check build and unit tests after the review
        if: always()
        env:
          RUN_E2E: ${{ steps.verdict.outputs.run_e2e }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          UNIT_OUTCOME: ${{ steps.unit.outcome }}
        run: |
          set -euo pipefail
          if [ "$RUN_E2E" != "true" ]; then
            echo "PR is not proceeding to E2E; not gating on build/test state."
            exit 0
          fi
          if [ "$BUILD_OUTCOME" != "success" ] || [ "$UNIT_OUTCOME" != "success" ]; then
            echo "Build or tests were red before the review; re-running on the current tree..."
            dotnet build api/api.csproj --nologo -v m
            dotnet test tests/api/api.tests.csproj --nologo -v m
          fi

      # The action hides Claude's output by default, so a failure surfaces only
      # as "is_error:true" with no reason. This pulls the error fields out of the
      # execution log without dumping the whole conversation into the public run
      # log, which is what `show_full_output: true` would do.
      - name: Explain Claude failure
        if: failure() && steps.claude.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -uo pipefail
          if [ ! -f "$EXECUTION_FILE" ]; then
            echo "No execution log at $EXECUTION_FILE"
            exit 0
          fi
          echo "::group::Claude error detail"
          # Emit only diagnostic scalars - error text, result subtype, usage -
          # never assistant message content.
          jq -r '
            [.. | objects
               | select(has("error") or has("is_error") or .type == "result")
               | {type, subtype, is_error, error, result, permission_denials_count}
               | with_entries(select(.value != null))]
            | unique | .[] | tostring
          ' "$EXECUTION_FILE" 2>/dev/null || cat "$EXECUTION_FILE"
          echo "::endgroup::"

  e2e:
    needs: review
    # `always()` so a Claude step failure still lets a live PR be verified;
    # run_e2e already encodes "PR is open and not rejected".
    if: always() && needs.review.outputs.run_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          # By name, not by the SHA the review job saw: Claude may have pushed
          # an "edit in place" commit, and the E2E run must cover it.
          ref: ${{ needs.review.outputs.ref }}
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # Same script a developer runs in a fresh worktree: it starts the Redis
      # container verify.sh gates on, generates the throwaway JWT signing key,
      # installs ui/node_modules and downloads the real-data fixture. Keeping CI
      # on the same path means a CI-only setup bug cannot exist.
      - name: Bootstrap the checkout
        id: bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/bootstrap-worktree.sh

      - name: Report data source
        run: |
          if [ -f ~/.cache/bfstats-e2e/template.db ]; then
            echo "Running against the real-data fixture." >> "$GITHUB_STEP_SUMMARY"
            sed 's/^/    /' ~/.cache/bfstats-e2e/template.meta >> "$GITHUB_STEP_SUMMARY" || true
          else
            echo "Running against the synthetic 7-player seed." >> "$GITHUB_STEP_SUMMARY"
            echo "E2E_SYNTHETIC=1" >> "$GITHUB_ENV"
          fi

      - name: Verify (unit tests + Playwright E2E)
        run: ./scripts/verify.sh

      - name: Report E2E result on the PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.review.outputs.number }}
          VERDICT: ${{ needs.review.outputs.verdict }}
          RESULT: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$RESULT" = "success" ]; then
            gh pr edit "$PR_NUMBER" --remove-label "e2e:failed" >/dev/null 2>&1 || true
            gh pr comment "$PR_NUMBER" --body \
              "E2E verification passed on the reviewed branch (review verdict: \`$VERDICT\`). [Run]($RUN_URL)"
          else
            gh pr edit "$PR_NUMBER" --add-label "e2e:failed" >/dev/null 2>&1 || true
            gh pr comment "$PR_NUMBER" --body \
              "E2E verification **failed** after the review (verdict was \`$VERDICT\`). The Playwright report and API log are attached to the run as artifacts. [Run]($RUN_URL)"
          fi

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            ui/playwright-report
            ui/test-results
          retention-days: 7

      - name: Upload API log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-log
          path: /tmp/bfstats-e2e-*-api.log
          retention-days: 7
          if-no-files-found: ignore

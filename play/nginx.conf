# play.bfstats.io. The mesh site's config with three differences: `/` is the
# Instant Battle screen, the model/pose/kit browsers redirect to the mesh
# host, and the page cache rules name this site's pages.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # .glb is not in Alpine's mime.types; three.js keys off the extension.

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    # Text only. A .glb is a container of already-compressed PNG textures and
    # packed binary — gzipping it burns CPU on a single-node cluster to save
    # almost nothing. The scene reports, the menu layout and the level list
    # are the payloads here that actually compress.
    gzip_types text/plain text/css application/javascript application/json
               model/gltf+json image/svg+xml;

    # The entry page lives at /play/, not at the root: it imports
    # `./menu-screen.js` and reaches the pack at `../maps/...`, so serving the
    # same file from two depths would break one of them. The root redirects.
    #
    # `absolute_redirect off` makes that redirect a bare `Location: /play/`.
    # Left on, nginx rebuilds the URL from the Host header, which behind
    # HAProxy and a Cloudflare tunnel means the scheme and port of the hop
    # rather than the client's — the redirect dropped the port when this was
    # tested against the built image.
    absolute_redirect off;

    location = / {
        return 302 /play/;
    }

    location = /play/ {
        add_header Cache-Control "public, max-age=0, s-maxage=60, stale-while-revalidate=86400" always;
        try_files /play/index.html =404;
    }

    # The model, pose and kit browsers are not in this image. Their paths are
    # in `map.html`'s nav bar, which is one shared source file with the mesh
    # site, so they are sent where they live rather than 404'd.
    location = /index.html { return 301 https://mesh.bfstats.io/index.html; }
    location = /poses.html { return 301 https://mesh.bfstats.io/poses.html; }
    location = /kits.html  { return 301 https://mesh.bfstats.io/kits.html; }

    # Extracted glTF and map scenes, from the PVC. Long edge TTL; short
    # browser TTL so a re-extract shows up without a hard refresh.
    location /models/ {
        add_header Cache-Control "public, max-age=300, s-maxage=86400" always;
        try_files $uri =404;
    }

    location /maps/ {
        add_header Cache-Control "public, max-age=300, s-maxage=86400" always;
        try_files $uri =404;
    }

    # Vendored three.js is large and never changes between image builds.
    location /vendor/ {
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # Static mod icons baked into the image.
    location /icons/ {
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # The two pages this site serves and the chrome they link. Baked into the
    # image, so a deploy must be able to replace them without waiting on a
    # browser cache — a stale shell.css against a fresh page is a broken nav.
    location ~ ^/(?:map\.html|play/(?:index\.html|menu-screen\.js))$ {
        add_header Cache-Control "public, max-age=0, s-maxage=60, stale-while-revalidate=86400" always;
    }

    location ~ ^/(?:shell\.css|tokens\.css|mods\.js|progress\.js)$ {
        add_header Cache-Control "public, max-age=0, s-maxage=60, stale-while-revalidate=86400" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
